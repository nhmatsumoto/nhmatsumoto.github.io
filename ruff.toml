# Ruff configuration for Python linting and formatting
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"] # Line too long (handled by formatter)

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

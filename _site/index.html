    <script id="projects-data" type="application/json">[{"id": "post-sos-location-ml-risk-neural-models", "kind": "post", "name": "SOS Location: Modelos neurais de risco com PyTorch e segmentação semântica", "headline": "O SOSLocation.ML usa PyTorch para predição de risco em zonas de desastre. Como treinamos modelos de segmentação semântica para identificar áreas críticas em imagens de satélite e dados GIS.", "summary": "O SOSLocation.ML usa PyTorch para predição de risco em zonas de desastre. Como treinamos modelos de segmentação semântica para identificar áreas críticas em imagens de satélite e dados GIS.", "status": "production", "stack": ["ml", "pytorch", "python", "gis", "risk-analysis"], "url": "/publications/2026-04-05-1500-sos-location-ml-risk-neural-models/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-05-1500-sos-location-ml-risk-neural-models/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003ch1>Modelos neurais de risco: o SOSLocation.ML\u003c/h1>\n\u003cp>Em Março de 2026, o commit \u003ccode>feat(ml+tests): SOSLocation.ML .NET project + 40 unit/integration tests\u003c/code> formalizou o que já estava sendo construído: uma unidade de ML dedicada ao SOS Location. O objetivo é simples mas ambicioso — \u003cstrong>prever quais áreas serão afetadas\u003c/strong> antes que a crise se torne incontrolável.\u003c/p>\n\u003ch2>Arquitetura do ML Unit\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>risk-analysis-unit/\n  api/            FastAPI — serve o modelo via REST e streaming gRPC\n  models/         Definições PyTorch dos modelos\n  training/       Scripts de treino + MLflow tracking\n  data/           Pipelines de ingestão (GIS, clima, histórico)\n  tests/          40 testes unitários e de integração\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>O ML Unit é um microsserviço Python independente que o backend .NET consulta via HTTP/gRPC quando um incidente crítico (severidade &gt;= 7) é criado.\u003c/p>\n\u003ch2>Modelo de segmentação semântica\u003c/h2>\n\u003cp>O problema de identificar zonas de risco em imagens de satélite é um problema de \u003cstrong>segmentação semântica\u003c/strong> — classificar cada pixel como &quot;risco alto&quot;, &quot;risco médio&quot;, &quot;seguro&quot;, &quot;água&quot;, etc.\u003c/p>\n\u003cp>A arquitetura escolhida é uma U-Net modificada, clássica em problemas de segmentação de imagens médicas e geoespaciais:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass UNetBlock(nn.Module):\n    def __init__(self, in_ch: int, out_ch: int):\n        super().__init__()\n        self.conv = nn.Sequential(\n            nn.Conv2d(in_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.ReLU(inplace=True),\n            nn.Conv2d(out_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.ReLU(inplace=True),\n        )\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        return self.conv(x)\n\n\nclass SOSRiskSegmenter(nn.Module):\n    &quot;&quot;&quot;U-Net para segmentação de risco em imagens multiespectral + DEM.&quot;&quot;&quot;\n\n    RISK_CLASSES = [&#x27;safe&#x27;, &#x27;low_risk&#x27;, &#x27;medium_risk&#x27;, &#x27;high_risk&#x27;, &#x27;critical&#x27;, &#x27;water&#x27;]\n\n    def __init__(self, in_channels: int = 6, num_classes: int = 6):\n        # in_channels: RGB (3) + DEM (1) + NDVI (1) + moisture index (1)\n        super().__init__()\n        # Encoder\n        self.enc1 = UNetBlock(in_channels, 64)\n        self.enc2 = UNetBlock(64, 128)\n        self.enc3 = UNetBlock(128, 256)\n        self.enc4 = UNetBlock(256, 512)\n        # Bottleneck\n        self.bottleneck = UNetBlock(512, 1024)\n        # Decoder\n        self.up4 = nn.ConvTranspose2d(1024, 512, 2, stride=2)\n        self.dec4 = UNetBlock(1024, 512)\n        self.up3 = nn.ConvTranspose2d(512, 256, 2, stride=2)\n        self.dec3 = UNetBlock(512, 256)\n        self.up2 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec2 = UNetBlock(256, 128)\n        self.up1 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec1 = UNetBlock(128, 64)\n        # Output\n        self.out = nn.Conv2d(64, num_classes, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n        b  = self.bottleneck(self.pool(e4))\n        d4 = self.dec4(torch.cat([self.up4(b),  e4], dim=1))\n        d3 = self.dec3(torch.cat([self.up3(d4), e3], dim=1))\n        d2 = self.dec2(torch.cat([self.up2(d3), e2], dim=1))\n        d1 = self.dec1(torch.cat([self.up1(d2), e1], dim=1))\n        return self.out(d1)  # (B, num_classes, H, W)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Features de entrada\u003c/h2>\n\u003cp>O modelo recebe 6 canais por tile (256x256 pixels, ~100m/pixel):\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Canal\u003c/th>\u003cth>Fonte\u003c/th>\u003cth>Descrição\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R, G, B\u003c/td>\u003ctd>Sentinel-2 / Landsat\u003c/td>\u003ctd>Imagem óptica\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DEM\u003c/td>\u003ctd>SRTMGL1\u003c/td>\u003ctd>Elevação em metros\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NDVI\u003c/td>\u003ctd>Calculado\u003c/td>\u003ctd>Índice de vegetação\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SMI\u003c/td>\u003ctd>Calculado\u003c/td>\u003ctd>Soil Moisture Index\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>def prepare_tile(\n    rgb: np.ndarray,        # (3, 256, 256) float32 [0,1]\n    dem: np.ndarray,        # (256, 256) float32 metros\n    ndvi: np.ndarray,       # (256, 256) float32 [-1, 1]\n    smi: np.ndarray,        # (256, 256) float32 [0, 1]\n) -&gt; torch.Tensor:\n    dem_norm  = (dem - dem.mean()) / (dem.std() + 1e-6)\n    x = np.stack([rgb[0], rgb[1], rgb[2], dem_norm, ndvi, smi], axis=0)\n    return torch.from_numpy(x).unsqueeze(0)  # (1, 6, 256, 256)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Dados de treino\u003c/h2>\n\u003cp>O arquivo \u003ccode>risk_training_data.csv\u003c/code> no repositório contém metadados de tiles históricos com anotações de risco vindas de:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>CEMADEN\u003c/strong> (Brasil): dados de deslizamentos históricos\u003c/li> \u003cli>\u003cstrong>INMET\u003c/strong>: dados climáticos históricos correlacionados\u003c/li> \u003cli>\u003cstrong>Brumadinho (2019)\u003c/strong>: o desastre que inspirou o projeto\u003c/li>\u003c/ul>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>class RiskDataset(Dataset):\n    def __init__(self, csv_path: str, tiles_dir: str, augment: bool = True):\n        self.df = pd.read_csv(csv_path)\n        self.tiles_dir = Path(tiles_dir)\n        self.augment = augment\n\n    def __getitem__(self, idx: int):\n        row   = self.df.iloc[idx]\n        tile  = np.load(self.tiles_dir / row[&#x27;tile_file&#x27;])  # (6, 256, 256)\n        mask  = np.load(self.tiles_dir / row[&#x27;mask_file&#x27;])  # (256, 256) int labels\n\n        if self.augment:\n            tile, mask = self._random_flip(tile, mask)\n\n        return torch.from_numpy(tile), torch.from_numpy(mask).long()\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Servindo o modelo via FastAPI\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode># api/main.py\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\nimport torch, io, json\n\napp = FastAPI(title=&quot;SOSLocation Risk Model API&quot;)\nmodel = SOSRiskSegmenter().eval()\nmodel.load_state_dict(torch.load(&quot;weights/best_model.pt&quot;, map_location=&quot;cpu&quot;))\n\n@app.post(&quot;/risk/predict&quot;)\nasync def predict_risk(payload: RiskRequest):\n    tile = prepare_tile(\n        rgb=np.array(payload.rgb), dem=np.array(payload.dem),\n        ndvi=np.array(payload.ndvi), smi=np.array(payload.smi)\n    )\n    with torch.no_grad():\n        logits = model(tile)                  # (1, 6, 256, 256)\n        probs  = torch.softmax(logits, dim=1) # probabilidades por classe\n        pred   = logits.argmax(dim=1)         # classe com maior probabilidade\n\n    return {\n        &quot;prediction&quot;:    pred[0].numpy().tolist(),\n        &quot;probabilities&quot;: probs[0].numpy().tolist(),\n        &quot;risk_level&quot;:    int(pred.max().item()),\n        &quot;critical_pct&quot;:  float((pred == 4).float().mean().item()) * 100,\n    }\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Integração com o backend .NET\u003c/h2>\n\u003cp>Quando o handler \u003ccode>CriticalIncidentCreated\u003c/code> é disparado, o cliente .NET chama o ML Unit:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Infrastructure/ML/RiskModelClient.cs\npublic async Task&lt;RiskAnalysis&gt; RequestAnalysisAsync(\n    Geometry incidentLocation, CancellationToken ct)\n{\n    var bbox = incidentLocation.EnvelopeInternal;\n    var tile = await _gisService.FetchTileAsync(bbox, ct);\n\n    var response = await _httpClient.PostAsJsonAsync(&quot;/risk/predict&quot;, new {\n        rgb  = tile.RGB,\n        dem  = tile.DEM,\n        ndvi = tile.NDVI,\n        smi  = tile.SMI,\n    }, ct);\n\n    return await response.Content.ReadFromJsonAsync&lt;RiskAnalysis&gt;(ct)\n        ?? throw new InvalidOperationException(&quot;Empty risk analysis response&quot;);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>O resultado da análise é armazenado no banco e transmitido ao dashboard via SignalR — adicionando uma camada de risco preditivo ao mapa tático em menos de 3 segundos após a criação do incidente.\u003c/p>"}, {"id": "post-sos-location-postgis-spatial-intelligence", "kind": "post", "name": "SOS Location: PostGIS e inteligência espacial para resposta a desastres", "headline": "PostGIS transforma o PostgreSQL em um motor geoespacial. Como usamos GIST indexes, ST_DWithin e line-of-sight para decisões táticas em tempo real.", "summary": "PostGIS transforma o PostgreSQL em um motor geoespacial. Como usamos GIST indexes, ST_DWithin e line-of-sight para decisões táticas em tempo real.", "status": "production", "stack": ["gis", "postgis", "postgresql", "spatial", "backend"], "url": "/publications/2026-04-05-1400-sos-location-postgis-spatial-intelligence/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-05-1400-sos-location-postgis-spatial-intelligence/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": true, "body_html": "\u003ch1>PostGIS: o motor geoespacial do SOS Location\u003c/h1>\n\u003cp>PostgreSQL é excelente. Com PostGIS, ele se torna um sistema de informação geográfica completo dentro do seu banco de dados. No SOS Location, todas as decisões táticas passam por consultas espaciais — e a diferença entre 200ms e 2s numa query pode definir se uma equipe chega a tempo.\u003c/p>\n\u003ch2>Schema espacial\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Incidents com geometria PostGIS\nCREATE TABLE incidents (\n  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  event_id     TEXT UNIQUE NOT NULL,\n  type         incident_type NOT NULL,\n  severity     SMALLINT CHECK (severity BETWEEN 1 AND 10),\n  location     GEOMETRY(Point, 4326) NOT NULL,  -- WGS84\n  affected_area GEOMETRY(Polygon, 4326),\n  occurred_at  TIMESTAMPTZ NOT NULL,\n  status       TEXT NOT NULL DEFAULT &#x27;active&#x27;,\n  trace_id     TEXT NOT NULL\n);\n\n-- GIST index: obrigatório para performance em buscas espaciais\nCREATE INDEX idx_incidents_location ON incidents USING GIST (location);\nCREATE INDEX idx_incidents_area     ON incidents USING GIST (affected_area);\n\n-- Resources (equipes de campo, veículos, abrigos)\nCREATE TABLE resources (\n  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  type         resource_type NOT NULL,\n  status       TEXT NOT NULL DEFAULT &#x27;available&#x27;,\n  location     GEOMETRY(Point, 4326) NOT NULL,\n  capacity     INT,\n  updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\nCREATE INDEX idx_resources_location ON resources USING GIST (location);\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Consultas espaciais críticas\u003c/h2>\n\u003ch3>1. Busca de recursos no raio de um incidente\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Todos os recursos disponíveis em raio de 10km do incidente\nSELECT\n  r.id,\n  r.type,\n  r.capacity,\n  ST_Distance(\n    r.location::geography,\n    i.location::geography\n  ) / 1000 AS distance_km,\n  ST_Azimuth(i.location, r.location) * 180 / PI() AS bearing_degrees\nFROM resources r\nCROSS JOIN incidents i\nWHERE i.id = $1\n  AND r.status = &#x27;available&#x27;\n  AND ST_DWithin(\n    r.location::geography,\n    i.location::geography,\n    10000  -- 10km em metros\n  )\nORDER BY distance_km ASC\nLIMIT 20;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>O cast \u003ccode>::geography\u003c/code> é essencial: garante que a distância seja em \u003cstrong>metros reais\u003c/strong> sobre a superfície da Terra, não graus de arco.\u003c/p>\n\u003ch3>2. Intersecção entre área afetada e zonas de risco\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Quais zonas de risco catalogadas se intersectam com a área afetada?\nSELECT\n  rz.id,\n  rz.name,\n  rz.risk_level,\n  ST_Area(ST_Intersection(i.affected_area, rz.boundary)::geography) / 1e6 AS overlap_km2\nFROM risk_zones rz\nJOIN incidents i ON i.id = $1\nWHERE ST_Intersects(i.affected_area, rz.boundary)\n  AND rz.active = true\nORDER BY overlap_km2 DESC;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>3. Line of sight para watchpoints\u003c/h3>\n\u003cp>A visibilidade de linha direta entre um watchpoint (câmera, sensor) e um incidente é crítica para alocação de recursos de monitoramento:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Verifica se existe obstáculo entre watchpoint e incidente usando DEM\n-- (simplificado — a implementação real usa uma função PL/pgSQL customizada)\nCREATE OR REPLACE FUNCTION line_of_sight(\n  observer_geom  GEOMETRY(Point, 4326),\n  observer_elev  FLOAT,\n  target_geom    GEOMETRY(Point, 4326),\n  target_elev    FLOAT\n) RETURNS BOOLEAN AS $$\nDECLARE\n  los_line  GEOMETRY;\n  max_obstr FLOAT;\nBEGIN\n  -- Linha entre observer e target\n  los_line := ST_MakeLine(observer_geom, target_geom);\n\n  -- Maior elevação ao longo da linha (DEM via PostGIS raster)\n  SELECT MAX(ST_Value(dem.rast, ST_PointN(los_line, gs.n)))\n  INTO max_obstr\n  FROM dem_tiles dem\n  CROSS JOIN generate_series(1, ST_NumPoints(los_line)) AS gs(n)\n  WHERE ST_Intersects(dem.rast::geometry, los_line);\n\n  -- Se nenhum ponto intermediário é mais alto que a linha de visão, há LOS\n  RETURN COALESCE(max_obstr, 0) &lt;= LEAST(observer_elev, target_elev)\n           + (ABS(observer_elev - target_elev) / 2);\nEND;\n$$ LANGUAGE plpgsql;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>4. Clustering de incidentes para o mapa tático\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Agrupa incidentes próximos (&lt; 500m) para evitar sobreposição no mapa\nSELECT\n  ST_AsGeoJSON(ST_Centroid(ST_Collect(location))) AS centroid,\n  COUNT(*) AS incident_count,\n  MAX(severity) AS max_severity,\n  ARRAY_AGG(id) AS incident_ids\nFROM incidents\nWHERE status = &#x27;active&#x27;\n  AND occurred_at &gt; NOW() - INTERVAL &#x27;24 hours&#x27;\nGROUP BY ST_SnapToGrid(location, 0.005)  -- grid de ~500m\nORDER BY max_severity DESC;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Benchmark e indexação\u003c/h2>\n\u003cp>Sem GIST index, uma busca \u003ccode>ST_DWithin\u003c/code> em 50.000 registros demora ~800ms. Com o índice: \u003cstrong>&lt; 8ms\u003c/strong>.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Análise de performance\nEXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)\nSELECT * FROM incidents\nWHERE ST_DWithin(location::geography, ST_Point(-43.9, -19.9)::geography, 5000);\n\n-- Output com GIST:\n-- Index Scan using idx_incidents_location on incidents\n-- Planning Time: 0.3 ms\n-- Execution Time: 7.2 ms\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>EF Core + Npgsql + NetTopologySuite\u003c/h2>\n\u003cp>No .NET, o mapeamento de tipos PostGIS usa \u003ccode>NetTopologySuite\u003c/code>:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// SosDbContext.cs\nprotected override void OnConfiguring(DbContextOptionsBuilder optionsBuilder)\n{\n    optionsBuilder.UseNpgsql(connectionString, o =&gt;\n        o.UseNetTopologySuite()\n         .SetPostgresVersion(15, 0)\n    );\n}\n\n// Incident.cs (Entity)\npublic class Incident\n{\n    public Guid Id { get; private set; }\n    public Point Location { get; private set; }       // NTS Point\n    public Polygon? AffectedArea { get; private set; } // NTS Polygon\n    // ...\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>A combinação PostGIS + NetTopologySuite + EF Core permite escrever queries LINQ com operações espaciais que compilam para SQL otimizado:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>var nearbyIncidents = await _db.Incidents\n    .Where(i =&gt; i.Location.IsWithinDistance(searchPoint, radiusMeters))\n    .OrderByDescending(i =&gt; i.Severity)\n    .ToListAsync();\n// Gera: WHERE ST_DWithin(location, $1, $2) ORDER BY severity DESC\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>PostGIS é a diferença entre um sistema GIS de verdade e um sistema que apenas armazena coordenadas. No SOS Location, ele é o coração de todas as decisões táticas.\u003c/p>"}, {"id": "post-sos-location-clean-architecture-dotnet10", "kind": "post", "name": "SOS Location: Clean Architecture + CQRS em .NET 10", "headline": "Arquitetura limpa, CQRS com MediatR e domain events no backend do SOS Location. Como estruturamos o código para resiliência em cenários de crise.", "summary": "Arquitetura limpa, CQRS com MediatR e domain events no backend do SOS Location. Como estruturamos o código para resiliência em cenários de crise.", "status": "production", "stack": ["dotnet", "clean-architecture", "cqrs", "backend", "architecture"], "url": "/publications/2026-04-05-1300-sos-location-clean-architecture-dotnet10/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-05-1300-sos-location-clean-architecture-dotnet10/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003ch1>Clean Architecture + CQRS no backend do SOS Location\u003c/h1>\n\u003cp>Em Abril de 2026, o commit \u003ccode>refactor: migrate all page components to the domains/operations directory\u003c/code> marcou a conclusão de uma refatoração profunda do backend do SOS Location. Não foi só reorganizar pastas — foi repensar como o código deveria \u003cem>crescer\u003c/em> quando vidas dependem da sua corretude.\u003c/p>\n\u003ch2>Por que Clean Architecture num sistema de desastres?\u003c/h2>\n\u003cp>Sistemas de resposta a catástrofes têm um perfil incomum:\u003c/p>\n\u003cp>1. \u003cstrong>Picos imprevisíveis\u003c/strong> — Um terremoto de magnitude 7 pode gerar 10x o tráfego normal em segundos\u003c/p>\n\u003cp>2. \u003cstrong>Múltiplos agentes de entrada\u003c/strong> — APIs externas, agentes CLI (Codex), SignalR, CRON jobs\u003c/p>\n\u003cp>3. \u003cstrong>Auditoria obrigatória\u003c/strong> — Cada mutação de estado precisa de \u003ccode>trace_id\u003c/code>, \u003ccode>actor\u003c/code> e \u003ccode>reason\u003c/code>\u003c/p>\n\u003cp>4. \u003cstrong>Evolução constante\u003c/strong> — Fase 8, 9, 10... o sistema cresce com o projeto\u003c/p>\n\u003cp>Clean Architecture separa essas preocupações em camadas com dependências unidirecionais:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>Domain         → apenas lógica de negócio, sem imports de infraestrutura\nApplication    → casos de uso (Commands, Queries, Handlers)\nInfrastructure → EF Core, PostGIS, SignalR, Keycloak\nPresentation   → ASP.NET Core Controllers, Minimal API\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>CQRS com MediatR\u003c/h2>\n\u003cp>O padrão CQRS (Command Query Responsibility Segregation) separa operações de escrita (Commands) de leitura (Queries).\u003c/p>\n\u003ch3>Command: criar incidente\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Application/Commands/CreateIncidentCommand.cs\npublic record CreateIncidentCommand(\n    string EventId,\n    IncidentType Type,\n    int Severity,\n    GeoJsonGeometry Location,\n    DateTimeOffset OccurredAt,\n    string ActorId\n) : IRequest&lt;Result&lt;IncidentDto&gt;&gt;;\n\npublic class CreateIncidentHandler : IRequestHandler&lt;CreateIncidentCommand, Result&lt;IncidentDto&gt;&gt;\n{\n    private readonly IIncidentRepository _incidents;\n    private readonly IEventBus _eventBus;\n    private readonly IAuditLog _audit;\n\n    public async Task&lt;Result&lt;IncidentDto&gt;&gt; Handle(\n        CreateIncidentCommand cmd, CancellationToken ct)\n    {\n        // Domain validation\n        if (cmd.Severity &lt; 1 || cmd.Severity &gt; 10)\n            return Result.Fail(&quot;Severity must be between 1 and 10&quot;);\n\n        var incident = Incident.Create(\n            cmd.EventId, cmd.Type, cmd.Severity,\n            cmd.Location, cmd.OccurredAt);\n\n        await _incidents.AddAsync(incident, ct);\n\n        // Audit trail — sempre\n        await _audit.RecordAsync(new AuditEntry(\n            Actor:   cmd.ActorId,\n            Action:  &quot;incident.created&quot;,\n            TraceId: Activity.Current?.TraceId.ToString() ?? Guid.NewGuid().ToString(),\n            Payload: JsonSerializer.Serialize(incident)\n        ), ct);\n\n        // Domain event: notifica SignalR, ML, operações críticas\n        if (incident.Severity &gt;= 7)\n            _eventBus.Publish(new CriticalIncidentCreated(incident));\n\n        return Result.Ok(incident.ToDto());\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>Query: busca espacial com PostGIS\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Application/Queries/GetIncidentsInRadiusQuery.cs\npublic record GetIncidentsInRadiusQuery(\n    double Lat, double Lon, double RadiusKm\n) : IRequest&lt;IReadOnlyList&lt;IncidentDto&gt;&gt;;\n\npublic class GetIncidentsInRadiusHandler\n    : IRequestHandler&lt;GetIncidentsInRadiusQuery, IReadOnlyList&lt;IncidentDto&gt;&gt;\n{\n    private readonly SosDbContext _db;\n\n    public async Task&lt;IReadOnlyList&lt;IncidentDto&gt;&gt; Handle(\n        GetIncidentsInRadiusQuery q, CancellationToken ct)\n    {\n        var point = new Point(q.Lon, q.Lat) { SRID = 4326 };\n        double radiusMeters = q.RadiusKm * 1000;\n\n        return await _db.Incidents\n            .Where(i =&gt; i.Location.IsWithinDistance(point, radiusMeters))\n            .OrderByDescending(i =&gt; i.Severity)\n            .ThenByDescending(i =&gt; i.OccurredAt)\n            .Select(i =&gt; i.ToDto())\n            .ToListAsync(ct);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Domain Events para operações críticas\u003c/h2>\n\u003cp>O domínio publica eventos sem saber quem os consome. A infraestrutura conecta:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Domain/Events/CriticalIncidentCreated.cs\npublic record CriticalIncidentCreated(Incident Incident) : IDomainEvent;\n\n// Infrastructure/EventHandlers/NotifyOpsOnCriticalIncident.cs\npublic class NotifyOpsOnCriticalIncident\n    : INotificationHandler&lt;CriticalIncidentCreated&gt;\n{\n    private readonly IHubContext&lt;OpsHub&gt; _hub;\n    private readonly IRiskModelClient _riskModel;\n\n    public async Task Handle(CriticalIncidentCreated e, CancellationToken ct)\n    {\n        // 1. Notifica o dashboard em tempo real via SignalR\n        await _hub.Clients.Group(&quot;ops-commanders&quot;)\n            .SendAsync(&quot;IncidentAlert&quot;, e.Incident.ToAlertPayload(), ct);\n\n        // 2. Solicita análise de risco ao ML Unit (async)\n        await _riskModel.RequestAnalysisAsync(e.Incident.Location, ct);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Pipeline de comportamentos transversais\u003c/h2>\n\u003cp>MediatR permite adicionar behaviors que se aplicam a todos os Commands/Queries — como logging, validação e retry:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Registrado no DI antes de todos os handlers\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(ValidationBehavior&lt;,&gt;));\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(LoggingBehavior&lt;,&gt;));\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(DistributedTracingBehavior&lt;,&gt;));\n\n// LoggingBehavior.cs\npublic class LoggingBehavior&lt;TRequest, TResponse&gt;\n    : IPipelineBehavior&lt;TRequest, TResponse&gt;\n{\n    private readonly ILogger&lt;TRequest&gt; _logger;\n\n    public async Task&lt;TResponse&gt; Handle(\n        TRequest req, RequestHandlerDelegate&lt;TResponse&gt; next, CancellationToken ct)\n    {\n        var sw = Stopwatch.StartNew();\n        _logger.LogInformation(&quot;Handling {Request}&quot;, typeof(TRequest).Name);\n        var response = await next();\n        _logger.LogInformation(&quot;Handled {Request} in {Elapsed}ms&quot;,\n            typeof(TRequest).Name, sw.ElapsedMilliseconds);\n        return response;\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Estrutura de pastas (pós-refatoração de Abril/2026)\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>backend-dotnet/\n  SOSLocation.Domain/\n    Entities/       Incident, Resource, Mission, WatchPoint\n    Events/         CriticalIncidentCreated, ResourceAllocated\n    ValueObjects/   GeoPoint, Severity, IncidentType\n  SOSLocation.Application/\n    Commands/       CreateIncidentCommand, AllocateResourceCommand\n    Queries/        GetIncidentsInRadiusQuery, GetMissionStatusQuery\n    Behaviors/      ValidationBehavior, LoggingBehavior\n  SOSLocation.Infrastructure/\n    Persistence/    SosDbContext (EF Core + Npgsql + PostGIS)\n    SignalR/        OpsHub, NotificationHub\n    ML/             RiskModelClient (FastAPI gRPC)\n    Auth/           KeycloakAuthHandler\n  SOSLocation.API/\n    Endpoints/      IncidentEndpoints (Minimal API)\n    Hubs/           OpsHub registration\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Essa estrutura suporta o crescimento até a Fase 10 sem acúmulo de débito técnico — cada nova integração tem um lugar definido, e o domínio nunca sabe da infraestrutura.\u003c/p>"}, {"id": "post-sos-location-webgl-3d-city-engine", "kind": "post", "name": "SOS Location: Motor WebGL 3D de visualização de cidades em tempo real", "headline": "Como construímos um motor WebGL 2.0 com Three.js para renderizar cidades completas com terreno, edificações 3D e camadas de desastre ao vivo.", "summary": "Como construímos um motor WebGL 2.0 com Three.js para renderizar cidades completas com terreno, edificações 3D e camadas de desastre ao vivo.", "status": "production", "stack": ["webgl", "threejs", "gis", "3d", "typescript"], "url": "/publications/2026-04-05-1200-sos-location-webgl-3d-city-engine/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-05-1200-sos-location-webgl-3d-city-engine/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": true, "body_html": "\u003ch1>Motor WebGL 3D: reconstruindo cidades para salvar vidas\u003c/h1>\n\u003cp>O SOS Location v2.0 precisava responder a uma pergunta simples com uma resposta extremamente difícil: \u003cem>como dar a um comandante de operações uma visão tática de alta definição de uma cidade inteira, em tempo real, durante uma catástrofe?\u003c/em>\u003c/p>\n\u003cp>A resposta foi construir um \u003cstrong>motor WebGL 2.0 do zero\u003c/strong>, usando Three.js como base e dados abertos para reconstruir a malha urbana.\u003c/p>\n\u003ch2>Fontes de dados para o mundo 3D\u003c/h2>\n\u003cp>Antes de qualquer shader, o problema é de dados:\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fonte\u003c/th>\u003cth>O que oferece\u003c/th>\u003cth>API\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OpenTopography (SRTMGL1)\u003c/td>\u003ctd>DEM 30m global\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OpenStreetMap / Overpass\u003c/td>\u003ctd>Edificações 3D, ruas\u003c/td>\u003ctd>Overpass QL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open-Meteo\u003c/td>\u003ctd>Clima em tempo real\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IBGE\u003c/td>\u003ctd>Dados populacionais\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>O fluxo de ingestão começa com uma query Overpass para buscar todas as edificações dentro de um bounding box:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const overpassQuery = `\n  [out:json][timeout:60];\n  (\n    way[&quot;building&quot;](${bbox});\n    relation[&quot;building&quot;](${bbox});\n  );\n  out body;\n  &gt;;\n  out skel qt;\n`;\n\nconst buildings = await fetchOverpass(overpassQuery);\nconst meshes = buildings.elements\n  .filter(el =&gt; el.type === &#x27;way&#x27; &amp;&amp; el.nodes)\n  .map(el =&gt; buildingToMesh(el, demElevation));\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Construindo o terreno\u003c/h2>\n\u003cp>O DEM (Digital Elevation Model) é um grid de elevações. A conversão para \u003ccode>PlaneGeometry\u003c/code> Three.js:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>function demToTerrain(dem: Float32Array, width: number, height: number): THREE.Mesh {\n  const geometry = new THREE.PlaneGeometry(\n    TILE_SIZE_METERS, TILE_SIZE_METERS,\n    width - 1, height - 1\n  );\n\n  const positions = geometry.attributes.position.array as Float32Array;\n  for (let i = 0; i &lt; dem.length; i++) {\n    // Z está no índice 2 de cada vértice (x, y, z)\n    positions[i * 3 + 2] = dem[i] * ELEVATION_SCALE;\n  }\n  geometry.computeVertexNormals();\n\n  const material = new THREE.MeshStandardMaterial({\n    map: terrainTexture,\n    displacementMap: demTexture,\n    wireframe: false,\n  });\n\n  return new THREE.Mesh(geometry, material);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Edificações 3D com telhados\u003c/h2>\n\u003cp>Cada edificação OSM vira um \u003ccode>ExtrudeGeometry\u003c/code>. O desafio é que o polígono OSM é 2D; a altura vem do tag \u003ccode>building:levels\u003c/code> ou \u003ccode>height\u003c/code>:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>function buildingToMesh(way: OsmWay, dem: DemProvider): THREE.Mesh {\n  const coords = way.nodes.map(id =&gt; nodeMap[id]);\n  const shape = new THREE.Shape(\n    coords.map(c =&gt; new THREE.Vector2(c.lon * SCALE, c.lat * SCALE))\n  );\n\n  const levels  = parseInt(way.tags?.[&#x27;building:levels&#x27;] ?? &#x27;2&#x27;, 10);\n  const height  = parseFloat(way.tags?.height ?? String(levels * 3.2));\n  const baseElev = dem.getElevationAt(way.center.lat, way.center.lon);\n\n  const geometry = new THREE.ExtrudeGeometry(shape, {\n    depth: height,\n    bevelEnabled: false,\n  });\n\n  const material = buildingMaterialByType(way.tags?.building || &#x27;yes&#x27;);\n  const mesh = new THREE.Mesh(geometry, material);\n  mesh.position.z = baseElev * ELEVATION_SCALE;\n  return mesh;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Camadas de desastre ao vivo\u003c/h2>\n\u003cp>O que diferencia o SOS Location de um simples visualizador 3D é a \u003cstrong>sobreposição de camadas de risco em tempo real\u003c/strong>. Cada camada é um shader personalizado.\u003c/p>\n\u003ch3>Shader de inundação (FragmentShader)\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"glsl\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">glsl\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>uniform float u_waterLevel;\nuniform float u_time;\nuniform sampler2D u_elevation;\n\nvarying vec2 v_uv;\nvarying float v_elevation;\n\nvoid main() {\n  float distToWater = u_waterLevel - v_elevation;\n\n  if (distToWater &gt; 0.0) {\n    // Água: animação ondular baseada em sin/cos\n    float wave = sin(v_uv.x * 40.0 + u_time * 2.0) * 0.5\n               + cos(v_uv.y * 40.0 + u_time * 1.7) * 0.5;\n    float depth = clamp(distToWater / 5.0, 0.0, 1.0);\n    vec3 waterColor = mix(vec3(0.1, 0.4, 0.8), vec3(0.0, 0.1, 0.5), depth);\n    gl_FragColor = vec4(waterColor + wave * 0.05, 0.75);\n  } else {\n    discard;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>Integração das camadas no pipeline\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>class DisasterLayerManager {\n  private layers = new Map&lt;DisasterType, THREE.Mesh&gt;();\n\n  addLayer(type: DisasterType, params: LayerParams) {\n    const geometry = new THREE.PlaneGeometry(TILE_SIZE, TILE_SIZE, 128, 128);\n    const material = this.shaderForType(type, params);\n    const mesh = new THREE.Mesh(geometry, material);\n    this.scene.add(mesh);\n    this.layers.set(type, mesh);\n  }\n\n  update(deltaT: number, realTimeData: RealTimePayload) {\n    this.layers.forEach((mesh, type) =&gt; {\n      const mat = mesh.material as THREE.ShaderMaterial;\n      mat.uniforms.u_time.value += deltaT;\n      if (type === &#x27;flood&#x27;) {\n        mat.uniforms.u_waterLevel.value = realTimeData.waterLevel;\n      }\n    });\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Resultado operacional\u003c/h2>\n\u003cp>O motor renderiza cidades completas a 60fps num navegador desktop moderno:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Curitiba (BR)\u003c/strong>: ~12.000 edificações, DEM 30m → carregamento em ~3s\u003c/li> \u003cli>\u003cstrong>Shimane (JP)\u003c/strong>: testado com dados do GSI/MLIT\u003c/li> \u003cli>Camadas ativas: inundação, incêndio, deslizamento, terremoto (vibração por shader)\u003c/li>\u003c/ul>\n\u003cp>O próximo passo (Fase 9) é o \u003cstrong>Full WebGL City Component\u003c/strong> com Keycloak-gated access para centros de comando reais.\u003c/p>\n\u003ch2>Link com o projeto\u003c/h2>\n\u003cp>Esse motor é o coração do \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>. Os posts de arquitetura descrevem como as camadas de dados chegam até ele.\u003c/p>"}, {"id": "post-sos-location-stack", "kind": "post", "name": "SOS Location: Tecnologias, ferramentas e exemplos", "headline": "Visão completa da stack, dos conceitos-chave e dos exemplos de código do SOS Location.", "summary": "Visão completa da stack, dos conceitos-chave e dos exemplos de código do SOS Location.", "status": "production", "stack": ["gis", "techstack", "sos"], "url": "/publications/2026-04-05-1100-sos-location-stack/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-05-1100-sos-location-stack/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": true, "body_html": "\u003ch1>Stack, conceitos e ferramentas do SOS Location\u003c/h1>\n\u003ch2>Tecnologias usadas\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>TypeScript &amp; Node.js\u003c/strong> na ingestão e no núcleo de normalização.\u003c/li> \u003cli>\u003cstrong>.NET 8\u003c/strong> com ASP.NET Core para APIs de borda, execução de pipelines e orquestração.\u003c/li> \u003cli>\u003cstrong>PostgreSQL + PostGIS\u003c/strong> para armazenamento espacial com índices \u003ccode>GIST\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Kafka + Redis Streams\u003c/strong> como backbone dos eventos.\u003c/li> \u003cli>\u003cstrong>React + Leaflet + D3\u003c/strong> para o dashboard e o mapa operacional.\u003c/li> \u003cli>\u003cstrong>Grafana + Loki + Tempo\u003c/strong> para observabilidade.\u003c/li> \u003cli>\u003cstrong>OpenTelemetry\u003c/strong> para tracing distribuído.\u003c/li>\u003c/ul>\n\u003ch2>Conceitos fundamentais\u003c/h2>\n\u003cp>1. \u003cstrong>Segurança de contexto\u003c/strong>: cada diagnóstico carrega um \u003ccode>trust_level\u003c/code> e só libera dados sensíveis após o agente ser autenticado.\u003c/p>\n\u003cp>2. \u003cstrong>Mapa operacional ativo\u003c/strong>: o front-end consome camadas \u003ccode>tiles\u003c/code> + \u003ccode>vector layers\u003c/code> e aplica \u003ccode>levels\u003c/code> de criticidade.\u003c/p>\n\u003cp>3. \u003cstrong>Conversação com agentes\u003c/strong>: subagentes (via \u003ccode>ronaldinho-agent\u003c/code>) consultam \u003ccode>event history\u003c/code> antes de alterar estados.\u003c/p>\n\u003ch2>Exemplos de código\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>[HttpGet(&quot;incidents&quot;)]\npublic IActionResult GetIncidents(string region)\n{\n    var incidents = _repository.Fetch(region, DateTime.UtcNow.AddHours(-2));\n    return Ok(incidents);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code-shell\" data-language=\"ts\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">ts\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const watchResource = async (resourceId: string) =&gt; {\n  const data = await fetch(`/api/resources/${resourceId}`);\n  renderOnMap(data);\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Diagramas e mapas mentais\u003c/h2>\n\u003cp>Para cada novo requisito criamos um mini-diagrama com Mermaid e o versionamos como documento; este post funciona como índice técnico dentro do projeto \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>.\u003c/p>\n\u003ch2>Conexão com o projeto\u003c/h2>\n\u003cp>Todos os documentos e publicações desta série estão linkados pelo campo \u003ccode>project_url\u003c/code> e comentam os conceitos listados no roadmap do projeto \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>.\u003c/p>"}, {"id": "post-sos-location-flow-architecture", "kind": "post", "name": "SOS Location: Fluxos, arquitetura e diagramas", "headline": "Descrição dos pipelines do SOS Location, diagramas e exemplos de código.", "summary": "Descrição dos pipelines do SOS Location, diagramas e exemplos de código.", "status": "production", "stack": ["gis", "architecture", "sos"], "url": "/publications/2026-04-05-1000-sos-location-flow-architecture/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-05-1000-sos-location-flow-architecture/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003ch1>Arquitetura e fluxo do SOS Location\u003c/h1>\n\u003cp>O pipeline do SOS Location conecta ingestão, enriquecimento e visualização. Abaixo está o diagrama de fluxo principal:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    Sources --&gt;|Kafka| Ingest[Ingestão]\n    Ingest --&gt;|Normalize| Processor[Normalizador]\n    Processor --&gt;|Event Store| Repository[(PostgreSQL)]\n    Processor --&gt; Visualizer[Visualização (GIS)]\n    Visualizer --&gt;|API| Frontend[Dashboard SOS]\n    Repository --&gt;|API| Ops[Operational Map (WebSocket)]\u003c/div>\n\u003ch2>Componentes principais\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Ingestão\u003c/strong>: serviços em TypeScript conectam com APIs externas e escrevem no tópico \u003ccode>sos-events\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Normalizer\u003c/strong>: executado em Node.js e .NET (via gRPC) para aplicar regras de normalização (geometria, contexto, cluster).\u003c/li> \u003cli>\u003cstrong>Repository\u003c/strong>: PostgreSQL + PostGIS; índices \u003ccode>GIST\u003c/code> em \u003ccode>location\u003c/code>, \u003ccode>incident_type\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Visualização\u003c/strong>: front-end React/Leaflet consome WebSockets para atualizar camadas de risco.\u003c/li>\u003c/ul>\n\u003ch2>Exemplo de código\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"ts\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">ts\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const enqueueEvent = (event: IncomingEvent) =&gt; {\n  const normalized = normalize(event);\n  kafkaProducer.send({ topic: &quot;sos-events&quot;, messages: [{ value: JSON.stringify(normalized) }] });\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Observações operacionais\u003c/h2>\n\u003cul>\u003cli>Cada evento crítico dispara \u003ccode>notifyOps\u003c/code> se \u003ccode>normalized.region\u003c/code> estiver no mapa \u003ccode>coverageZones\u003c/code>.\u003c/li> \u003cli>O \u003ccode>LineOfSightService\u003c/code> recalcula visibilidade de recursos ao vivo a cada reconciliação.\u003c/li> \u003cli>O fluxo é monitorado com tracing distribuído (OpenTelemetry) para garantir latência abaixo de 2 segundos.\u003c/li>\u003c/ul>\n\u003ch2>Link com o projeto\u003c/h2>\n\u003cp>O post anterior lista as regras de negócio que justificam cada nó do fluxo; este detalha os mecanismos e diagramas do projeto \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>.\u003c/p>"}, {"id": "post-sos-location-business-rules", "kind": "post", "name": "SOS Location: Regras de negócio, contratos e operação", "headline": "Catálogo completo das regras de negócio que sustentam o SOS Location.", "summary": "Catálogo completo das regras de negócio que sustentam o SOS Location.", "status": "production", "stack": ["gis", "operations", "sos"], "url": "/publications/2026-04-05-0900-sos-location-business-rules/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-05-0900-sos-location-business-rules/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003ch1>Regras de negócio do SOS Location\u003c/h1>\n\u003cp>O \u003cstrong>SOS Location\u003c/strong> organiza dados geoespaciais para reduzir o tempo de resposta em crises. As regras de negócio são estruturalmente simples, mas precisam ser rigorosas para evitar decisões equivocadas.\u003c/p>\n\u003ch2>1. Contratos de dados\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Instituições parceiras\u003c/strong> enviam feeds assinados que contêm: \u003ccode>event_id\u003c/code>, \u003ccode>type\u003c/code>, \u003ccode>severity\u003c/code>, \u003ccode>geojson\u003c/code>, \u003ccode>timestamp\u003c/code>, \u003ccode>source\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Eventos críticos\u003c/strong> (severidade &gt;= 7) sempre geram uma projeção de riscos em menos de 120 segundos.\u003c/li> \u003cli>\u003cstrong>Atualização de status\u003c/strong> governa recursos humanos: cada recurso humano só responde a um evento por vez (estado \u003ccode>locked\u003c/code>).\u003c/li> \u003cli>\u003cstrong>GeoJSON canonicalizado\u003c/strong>: antes do armazenamento, o polígono é simplificado para 6 decimais e validado com \u003ccode>ogr2ogr\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2>2. Regras de fluxo\u003c/h2>\n\u003cp>1. Recebemos eventos via message queue (Kafka/Redis Streams).\u003c/p>\n\u003cp>2. Validamos esquema e padronizamos \u003ccode>severity\u003c/code>.\u003c/p>\n\u003cp>3. Se \u003ccode>severity &gt;= 7\u003c/code> criamos \u003ccode>incident\u003c/code> em \u003ccode>SOS.Data.Incidents\u003c/code>.\u003c/p>\n\u003cp>4. Disparamos microserviço de \u003cstrong>mapas operacionais\u003c/strong> caso \u003ccode>incident.type\u003c/code> pertença ao catálogo \u003ccode>critical_types\u003c/code>.\u003c/p>\n\u003cp>5. Cada atualização solicita recalculadora de visibilidade (\u003ccode>LineOfSightService\u003c/code>) para as camadas \u003ccode>watchpoints\u003c/code>.\u003c/p>\n\u003ch2>3. Governança operacional\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Deploy\u003c/strong> via pipeline \u003ccode>sos_location/deploy\u003c/code> que exige smoke test \u003ccode>maps/smoke\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Monitoramento\u003c/strong> centralizado em Grafana, alertas no Slack \u003ccode>#sos-alerts\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Auditoria\u003c/strong> grava cada mutação em \u003ccode>event history\u003c/code> com \u003ccode>actor\u003c/code>, \u003ccode>reason\u003c/code> e \u003ccode>trace_id\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2>4. Link com o projeto\u003c/h2>\n\u003cp>O projeto \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a> coloca essas regras em prática; os posts desta série documentam fluxo, stack e exemplos que tocam essas regras.\u003c/p>"}, {"id": "post-tecnologia-pulso-hemp-hpm", "kind": "post", "name": "Tecnologia de Pulso: Do HEMP ao Micro-ondas de Alta Potência", "headline": "Uma análise técnica sobre a geração artificial de pulsos eletromagnéticos, do Efeito Compton ao Gerador de Compressão de Fluxo.", "summary": "Uma análise técnica sobre a geração artificial de pulsos eletromagnéticos, do Efeito Compton ao Gerador de Compressão de Fluxo.", "status": "production", "stack": ["engineering", "defense", "electromagnetism", "pulse-power"], "url": "/publications/20260404-artificial-pulse-tech-tecnologia-pulso-hemp-hpm/", "resolved_url": "https://nhmatsumoto.github.io/publications/20260404-artificial-pulse-tech-tecnologia-pulso-hemp-hpm/", "repo_url": "", "has_math": false, "body_html": "\u003cp>Ao contrário dos fenômenos naturais, os pulsos eletromagnéticos artificiais são projetados para máxima eficiência de acoplamento em eletrônicos de precisão. Existem duas categorias fundamentais: nucleares e convencionais.\u003c/p>\n\u003ch3>1. EMP Nuclear (HEMP)\u003c/h3>\n\u003cp>Este é o método de maior abrangência. Detonado acima de 30 km, ele utiliza a própria atmosfera como amplificador:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Efeito Compton\u003c/strong>: Raios gama da explosão colidem com moléculas de ar, ejetando elétrons em alta velocidade.\u003c/li> \u003cli>\u003cstrong>Aceleração\u003c/strong>: Sob a influência do campo magnético da Terra, esses elétrons giram, gerando um pulso eletromagnético que pode saturar um continente inteiro.\u003c/li>\u003c/ul>\n\u003ch3>2. EMP Não-Nuclear (NNEMP)\u003c/h3>\n\u003cp>Desenvolvidos para fins táticos e de segurança, não dependem de radiação nuclear para agir:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Gerador de Compressão de Fluxo (FCG)\u003c/strong>: Utiliza explosivos convencionais para comprimir subitamente um campo magnético dentro de uma bobina. Essa compressão súbita cria um pico de energia de potência altíssima em milissegundos.\u003c/li> \u003cli>\u003cstrong>Micro-ondas de Alta Potência (HPM)\u003c/strong>: Antenas focais que direcionam feixes de micro-ondas para sobrecarregar fisicamente os componentes eletrônicos de alvos específicos (como servidores ou infraestrutura de rede).\u003c/li>\u003c/ul>\n\u003ch3>Matriz de Impacto e Alcance\u003c/h3>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tecnologia\u003c/th>\u003cth>Origem\u003c/th>\u003cth>Abrangência\u003c/th>\u003cth>Vetor de Dano\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>HEMP\u003c/strong>\u003c/td>\u003ctd>Detonação Nuclear\u003c/td>\u003ctd>Continente/País\u003c/td>\u003ctd>Raios Gama + Efeito Compton\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>FCG\u003c/strong>\u003c/td>\u003ctd>Compressão de Fluxo\u003c/td>\u003ctd>Local/Tático\u003c/td>\u003ctd>Pulsos Magnéticos de Corrente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>HPM\u003c/strong>\u003c/td>\u003ctd>Micro-ondas Focadas\u003c/td>\u003ctd>Alvo Direcional\u003c/td>\u003ctd>Saturação Térmica/Dielétrica\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>No final, a tecnologia de pulso artificial não é sobre &quot;explosão&quot;, mas sobre o controle preciso de campos elétricos e magnéticos para induzir transientes fatais em circuitos semicondutores.\u003c/p>"}, {"id": "post-sopros-estelares-astrofisica-impulso", "kind": "post", "name": "Sopros Estelares: De Supernovas a Space Weather", "headline": "Anatomia dos fenômenos astrofísicos que geram emissões eletromagnéticas extremas e seu impacto nos sistemas tecnológicos.", "summary": "Anatomia dos fenômenos astrofísicos que geram emissões eletromagnéticas extremas e seu impacto nos sistemas tecnológicos.", "status": "production", "stack": ["astrophysics", "science", "space-weather", "radiation"], "url": "/publications/20260404-astro-electromagnetics-sopros-estelares-astrofisica-impulso/", "resolved_url": "https://nhmatsumoto.github.io/publications/20260404-astro-electromagnetics-sopros-estelares-astrofisica-impulso/", "repo_url": "", "has_math": false, "body_html": "\u003cp>Estrelas não geram um &quot;EMP&quot; no sentido estrito da engenharia eletrônica terrestre, mas produzem emissões eletromagnéticas extremas, ondas de choque e plasma magnetizado que desafiam nossa infraestrutura.\u003c/p>\n\u003ch3>1. Supernova de Colapso do Núcleo\u003c/h3>\n\u003cp>O colapso do núcleo ejeta neutrinos e impulsiona uma onda de choque. O momento crítico para a eletrônica teorizada é o \u003cstrong>Shock Breakout\u003c/strong>: um clarão curto e intenso em UV/X-ray que atravessa a superfície estelar. É o modelo perfeito para estudar emissões impulsivas transitórias.\u003c/p>\n\u003ch3>2. Gamma-Ray Bursts (GRBs)\u003c/h3>\n\u003cp>O GRB é o análogo cosmológico mais próximo de um pulso eletromagnético extremo. Associados a jatos ultra-relativísticos, eles são ideais para modelar:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Anisotropia\u003c/strong>: A concentração da energia em feixes colimados.\u003c/li> \u003cli>\u003cstrong>Largura Temporal\u003c/strong>: Pulsos de milissegundos que transportam energias galácticas.\u003c/li> \u003cli>\u003cstrong>Deposição de Energia\u003c/strong>: Como a radiação gama interage com a matéria a anos-luz de distância.\u003c/li>\u003c/ul>\n\u003ch3>3. Space Weather: Flares vs CMEs\u003c/h3>\n\u003cp>No nosso quintal solar, a distinção é vital para a resiliência:\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fenômeno\u003c/th>\u003cth>Origem\u003c/th>\u003cth>Alvo Principal\u003c/th>\u003cth>Duração\u003c/th>\u003cth>Impacto\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Flare Solar\u003c/strong>\u003c/td>\u003ctd>Reconexão Magnética\u003c/td>\u003ctd>Ionosfera (Rádio/GPS)\u003c/td>\u003ctd>Minutos\u003c/td>\u003ctd>Blackout de Rádio\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>CME\u003c/strong>\u003c/td>\u003ctd>Plasma Magnetizado\u003c/td>\u003ctd>Redes de Alta Tensão\u003c/td>\u003ctd>Horas/Dias\u003c/td>\u003ctd>Correntes Induzidas (GIC)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>GRB\u003c/strong>\u003c/td>\u003ctd>Jatos Relativísticos\u003c/td>\u003ctd>Camada de Ozônio\u003c/td>\u003ctd>Milissegundos\u003c/td>\u003ctd>Extinção Atmosférica\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Conclusão\u003c/h3>\n\u003cp>A compreensão desses fenômenos não é apenas acadêmica; cada um deles define um &quot;envelope de teste&quot; para a resiliência de sistemas espaciais e terrestres.\u003c/p>"}, {"id": "post-resiliencia-eletromagnetica-acoplamento", "kind": "post", "name": "Engenharia de Resiliência Eletromagnética e Acoplamento", "headline": "Do ponto zero à ruptura de junções: como circuitos reais falham sob transientes de alta intensidade.", "summary": "Do ponto zero à ruptura de junções: como circuitos reais falham sob transientes de alta intensidade.", "status": "production", "stack": ["engineering", "electronics", "resilience", "security"], "url": "/publications/20260404-electromagnetic-resilience-resiliencia-eletromagnetica-acoplamento/", "resolved_url": "https://nhmatsumoto.github.io/publications/20260404-electromagnetic-resilience-resiliencia-eletromagnetica-acoplamento/", "repo_url": "", "has_math": true, "body_html": "\u003cp>O &quot;dano&quot; eletromagnético (EMP) não é apenas o calor de uma explosão; é a fração da energia emitida que consegue se \u003cstrong>acoplar\u003c/strong> ao seu sistema. A vulnerabilidade de um circuito depende diretamente de sua geometria, blindagem e filtragem.\u003c/p>\n\u003ch3>A Equação de Dano\u003c/h3>\n\u003cp>Para entender a resiliência, não pensamos em &quot;raio de efeito&quot; — o dano é uma função de transferência de energia:\u003c/p>\n\u003cdiv class=\"math-block\">$$ Dano = Fonte \\times Propaga\\c{c}ão \\times Acoplamento \\times Vulnerabilidade $$\u003c/div>\n\u003cp>Dessa forma, dois equipamentos à mesma distância do ponto zero terão resultados totalmente diferentes:\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Componente\u003c/th>\u003cth>Descrição\u003c/th>\u003cth>Fator de Impacto\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Fonte\u003c/strong>\u003c/td>\u003ctd>Intensidade e duração do pulso original\u003c/td>\u003ctd>Alto (E1/E2/E3)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Propagação\u003c/strong>\u003c/td>\u003ctd>Perdas no meio e distância\u003c/td>\u003ctd>Inverso do Quadrado\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Acoplamento\u003c/strong>\u003c/td>\u003ctd>Eficiência da &quot;antena&quot; (cabos, trilhas)\u003c/td>\u003ctd>Geometria do Alvo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Vulnerabilidade\u003c/strong>\u003c/td>\u003ctd>Resistência do silício (MOSFETs, ICs)\u003c/td>\u003ctd>Limiar Térmico\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>1.  Um \u003cstrong>aparelho pequeno\u003c/strong>, desconectado e sem cabos longos, pode sobreviver.\u003c/p>\n\u003cp>2.  Um \u003cstrong>sistema ligado à rede\u003c/strong>, com cabeamento extenso ou antenas, sofrerá muito mais acoplamento e dano.\u003c/p>\n\u003ch3>O Mito do &quot;Raio de Efeito&quot;\u003c/h3>\n\u003cp>Em documentos técnicos (como FEMA), o efeito em eletrônicos pode ser localmente severo perto da detonação, enquanto em cenários de alta altitude pode cobrir áreas imensas. Pensar em &quot;raio&quot; é menos eficaz que focar na vulnerabilidade do sistema Individual.\u003c/p>\n\u003ch3>Entendendo os Componentes E1, E2 e E3\u003c/h3>\n\u003cp>A física de um pulso nuclear de grande escala se divide em três fases de perigo:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>E1 (Rápido)\u003c/strong>: Pulso de nanossegundos. É o mais problemático para eletrônica sensível, induzindo tensões e correntes transitórias que excedem a tolerância dos chips.\u003c/li> \u003cli>\u003cstrong>E2 (Intermediário)\u003c/strong>: Similar a surtos de raios, perigoso para sistemas elétricos locais já estressados pelo E1.\u003c/li> \u003cli>\u003cstrong>E3 (Lento)\u003c/strong>: Pulso de segundos a minutos que afeta infraestruturas metálicas longas (redes de transmissão de alta tensão), injetando correntes geomagneticamente induzidas.\u003c/li>\u003c/ul>\n\u003ch3>Mecanismos de Falha e Hardening\u003c/h3>\n\u003cp>A falha ocorre quando transientes excedem a tolerância elétrica ou térmica da junção semicondutora:\u003c/p>\n\u003cul>\u003cli>Ruptura de junções e queima de camadas de óxido.\u003c/li> \u003cli>\u003cem>Latch-up\u003c/em> e degradação permanente de circuitos integrados.\u003c/li>\u003c/ul>\n\u003cp>Se o objetivo é a resiliência técnica legítima, o caminho é o endurecimento (hardening):\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Blindagem e Continuidade\u003c/strong>: Invólucros metálicos e aterramento.\u003c/li> \u003cli>\u003cstrong>Filtros e Protetores\u003c/strong>: Supressão de surtos em caminhos de acoplamento.\u003c/li> \u003cli>\u003cstrong>Isolamento Crítico\u003c/strong>: Redução de cabos expostos e uso de interfaces não-metálicas.\u003c/li>\u003c/ul>\n\u003cp>No fim, dois equipamentos à mesma distância do ponto zero terão resultados totalmente diferentes se um deles for projetado com resiliência em camadas.\u003c/p>"}, {"id": "post-fisica-demp-pulsos-dispersos", "kind": "post", "name": "A Física dos Pulsos Dispersos: Além do EMP Convencional", "headline": "Uma exploração profunda sobre os fenômenos de DEMP, GRBs e a dissipação de pulsos eletromagnéticos em meios dispersivos.", "summary": "Uma exploração profunda sobre os fenômenos de DEMP, GRBs e a dissipação de pulsos eletromagnéticos em meios dispersivos.", "status": "production", "stack": ["physics", "astrophysics", "electromagnetism", "science"], "url": "/publications/20260404-demp-physics-fisica-demp-pulsos-dispersos/", "resolved_url": "https://nhmatsumoto.github.io/publications/20260404-demp-physics-fisica-demp-pulsos-dispersos/", "repo_url": "", "has_math": false, "body_html": "\u003cp>O termo \u003cstrong>Pulso Eletromagnético Disperso (DEMP)\u003c/strong> não é apenas uma curiosidade técnica; é um conceito fundamental para entender como a energia viaja através de meios complexos, como a ionosfera Terrestre.\u003c/p>\n\u003ch3>O que é dispersão?\u003c/h3>\n\u003cp>Um pulso convencional é uma perturbação transitória de curtíssima duração. No entanto, quando esse pulso viaja por um meio dispersivo, suas diferentes componentes de frequência se propagam em velocidades variadas. O resultado é o sinal se &quot;espalhando&quot; no tempo — o que tecnicamente chamamos de \u003cstrong>Pulso Disperso\u003c/strong>.\u003c/p>\n\u003ch3>Fontes de Irradiância\u003c/h3>\n\u003cp>Podemos separar os fenômenos em três grandes vertentes astrofísicas:\u003c/p>\n\u003cp>1.  \u003cstrong>Supernovas de Colapso\u003c/strong>: Quando o núcleo colapsa, ocorre o \u003cem>shock breakout\u003c/em>, um clarão intenso em UV/X-ray que serve como modelo teórico para pulsos radiativos transitórios.\u003c/p>\n\u003cp>2.  \u003cstrong>Gamma-Ray Bursts (GRBs)\u003c/strong>: O análogo mais próximo de um pulso eletromagnético extremo. Associados a jatos ultra-relativísticos, eles transportam energias colossais em gamas em janelas temporais minúsculas.\u003c/p>\n\u003cp>3.  \u003cstrong>Eventos Solares (CMEs &amp; Flares)\u003c/strong>: O &quot;sopro&quot; estelar que, ao interagir com a magnetosfera, induz correntes em infraestruturas industriais.\u003c/p>\n\u003ch3>A Anatomia do Pulso Nuclear (HEMP)\u003c/h3>\n\u003cp>Diferente das estrelas, a detonação em alta altitude utiliza o \u003cstrong>Efeito Compton\u003c/strong>, onde raios gama colidem com moléculas de ar, ejetando elétrons acelerados que, submetidos ao campo magnético terrestre, geram o pulso eletromagnético continental (HEMP).\u003c/p>\n\u003cp>Enquanto a estrela deforma o campo magnético do planeta como um todo, a versão artificial foca em saturar componentes eletrônicos diretamente através do acoplamento rápido e violento.\u003c/p>"}, {"id": "post-brain-map-topology-hiro", "kind": "post", "name": "Topologias de Conhecimento: O Grafo Hiro", "headline": "Explorando a implementação de uma hierarquia D3.js para visualizar a inteligência técnica de forma não-linear.", "summary": "Explorando a implementação de uma hierarquia D3.js para visualizar a inteligência técnica de forma não-linear.", "status": "production", "stack": ["visual-computing", "graphs", "d3js", "architecture"], "url": "/publications/20260404-brain-map-topology-brain-map-topology-hiro/", "resolved_url": "https://nhmatsumoto.github.io/publications/20260404-brain-map-topology-brain-map-topology-hiro/", "repo_url": "", "has_math": false, "body_html": "\u003cp>O \u003cstrong>Mapa Cerebral\u003c/strong> (Knowledge Graph) evoluiu. Saímos de uma lista plana de publicações para uma topologia que reflete a estrutura da mente.\u003c/p>\n\u003ch3>O Nó Central: Hiro\u003c/h3>\n\u003cp>Em qualquer sistema operacional, existe o kernel. No Technical Knowledge OS, o nó \u003cstrong>Hiro\u003c/strong> é esse kernel — o ponto de convergência de toda a inteligência e experiência acumuladas.\u003c/p>\n\u003ch3>Camadas de Abstração\u003c/h3>\n\u003cp>Utilizamos D3.js para implementar uma simulação de forças com três camadas principais:\u003c/p>\n\u003cp>1.  \u003cstrong>Hiro (Root)\u003c/strong>: O núcleo central.\u003c/p>\n\u003cp>2.  \u003cstrong>Grupos de Skill (Tech Skills, Engineering, Labs)\u003c/strong>: Agrupadores semânticos que definem grandes áreas de atuação.\u003c/p>\n\u003cp>3.  \u003cstrong>Tópicos (Tags)\u003c/strong>: Atuam como pontes de dados entre os grupos e o conteúdo final.\u003c/p>\n\u003ch3>Por que Hierarquia?\u003c/h3>\n\u003cp>A mente não armazena fatos isolados; ela armazena \u003cstrong>grafos de associação\u003c/strong>. Ao visualizar o \u003ccode>DDD\u003c/code> conectado a \u003ccode>Engineering\u003c/code> e, consequentemente, a projetos práticos, reforçamos a ideia de que a teoria e a prática são inseparáveis.\u003c/p>\n\u003cp>A implementação técnica usa um arquivo de configuração centralizado (\u003ccode>config/graph.toml\u003c/code>), permitindo que a topologia mude dinamicamente conforme novas áreas de estudo — como AI, Robotics ou Security — surgem.\u003c/p>"}, {"id": "post-technical-knowledge-os-v2", "kind": "post", "name": "O Despertar do Technical Knowledge OS v2", "headline": "Uma jornada pela modularização do motor de renderização e o conceito de um sistema operacional para o intelecto técnico.", "summary": "Uma jornada pela modularização do motor de renderização e o conceito de um sistema operacional para o intelecto técnico.", "status": "production", "stack": ["meta", "architecture", "knowledge-os", "hiro"], "url": "/publications/20260404-knowledge-os-v2-technical-knowledge-os-v2/", "resolved_url": "https://nhmatsumoto.github.io/publications/20260404-knowledge-os-v2-technical-knowledge-os-v2/", "repo_url": "", "has_math": false, "body_html": "\u003cp>O conceito de \u003cstrong>Technical Knowledge OS\u003c/strong> não é apenas uma metáfora visual; é um manifesto sobre como interagimos com as informações que acumulamos. Recentemente, iniciamos uma refatoração profunda no motor original (\u003ccode>blog_engine.py\u003c/code>) para algo mais robusto e modular em \u003ccode>scripts/engine/\u003c/code>.\u003c/p>\n\u003ch3>Do Monólito ao Componente\u003c/h3>\n\u003cp>O antigo motor era um gigante que tentava fazer tudo: carregar dados, processar imagens, renderizar HTML e gerenciar traduções em um único arquivo de 2000 linhas. Através de princípios de \u003cstrong>SOLID\u003c/strong> e \u003cstrong>DDD\u003c/strong>, quebramos essa estrutura em pedaços atômicos:\u003c/p>\n\u003cul>\u003cli>\u003ccode>loader.py\u003c/code>: A única fonte de verdade para normalização de metadados.\u003c/li> \u003cli>\u003ccode>i18n.py\u003c/code>: Orquestração semântica de idiomas.\u003c/li> \u003cli>\u003ccode>renderer/components.py\u003c/code>: A biblioteca de UI que define o DNA visual do site.\u003c/li>\u003c/ul>\n\u003ch3>A Interface como Extensão do Cérebro\u003c/h3>\n\u003cp>Nesta versão v2, o objetivo é que o site agisse como uma camada de consulta rápida e visualização. Não estamos apenas postando artigos, estamos registrando \u003cstrong>Nós de Conhecimento\u003c/strong> em um sistema que entende as conexões entre eles.\u003c/p>\n\u003cp>A transição para um layout \u003cstrong>Glass Terminal\u003c/strong> reforça essa ideia: o software não deve ser apenas funcional, ele deve ser esteticamente denso e inspirador.\u003c/p>"}, {"id": "post-ia-inspirada-pela-fisica-redes-neurais", "kind": "post", "name": "IA Inspirada pela Física: Entropia e Energia nas Redes Neurais", "headline": "Como conceitos térmicos e de mecânica estatística moldam o treinamento de IAs modernas, de Hopfield Networks a Diffusion Models.", "summary": "Como conceitos térmicos e de mecânica estatística moldam o treinamento de IAs modernas, de Hopfield Networks a Diffusion Models.", "status": "production", "stack": ["ia", "fisica", "entropia", "redes-neurais", "diffusao"], "url": "/publications/2026-04-03-2600-ia-inspirada-pela-fisica-redes-neurais/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-03-2600-ia-inspirada-pela-fisica-redes-neurais/", "repo_url": "", "has_math": true, "body_html": "\u003cp>A inteligência artificial não nasceu apenas de algoritmos matemáticos puros, ela bebeu da fonte da \u003cstrong>Física Estatística\u003c/strong>. Muitos dos modelos que usamos hoje tratam a informação como se fosse energia em um sistema físico.\u003c/p>\n\u003ch2>Entropia e a Busca pela Ordem\u003c/h2>\n\u003cp>Na física, a entropia mede a desordem. Na IA, usamos a \u003cstrong>Entropia Cruzada\u003c/strong> (Cross-Entropy) para medir quão longe nossa rede está da resposta correta. Treinar uma rede é, essencialmente, reduzir a desordem da sua predição.\u003c/p>\n\u003ch2>Redes de Hopfield e a Energia de um Sistema\u003c/h2>\n\u003cp>John Hopfield, físico de formação, criou uma rede neural onde a memória é um estado de \u003cstrong>Mínima Energia\u003c/strong>. Imagine uma bola rolando em uma paisagem de montanhas; a memória é o fundo do vale.\u003c/p>\n\u003cdiv class=\"mermaid\">graph TD\n    A[Estado de Alta Energia - Desordenado] --&gt;|Descida do Gradiente| B[Estado de Baixa Energia - Estável]\n    B --&gt; C[Memória Recuperada]\n    style B fill:#dfd,stroke:#333\u003c/div>\n\u003ch3>Diffusion Models: Criando do Caos\u003c/h3>\n\u003cp>Os modelos de imagem modernos (como Midjourney ou Stable Diffusion) usam um processo físico inverso. Eles adicionam ruído (caos/entropia) a uma imagem até que ela vire chiado puro e, então, ensinam a rede a \u003cstrong>reverter a difusão\u003c/strong>, extraindo ordem do caos.\u003c/p>\n\u003ch2>A Matemática do Aprendizado\u003c/h2>\n\u003cp>Muitos algoritmos de otimização usam o conceito de \u003cstrong>Simulated Annealing\u003c/strong> (Recozimento Simulado), inspirado na forma como os metais são resfriados lentamente para atingir uma estrutura cristalina perfeita (o mínimo global).\u003c/p>\n\u003ch2>Conclusão\u003c/h2>\n\u003cp>A IA está se aproximando cada vez mais de uma &quot;Física da Informação&quot;. Entender as leis da termodinâmica e da energia nos dá uma intuição poderosa sobre por que as redes neurais funcionam e como podemos torná-las mais eficientes.\u003c/p>"}, {"id": "post-computacao-quantica-qbits-vs-bits", "kind": "post", "name": "Computação Quântica: O Poder Além dos Bits", "headline": "Uma visão clara sobre os Qubits, superposição e como o poder quântico pode resolver problemas impossíveis para computadores clássicos.", "summary": "Uma visão clara sobre os Qubits, superposição e como o poder quântico pode resolver problemas impossíveis para computadores clássicos.", "status": "production", "stack": ["quantica", "computacao", "bits-vs-qubits", "tecnologia"], "url": "/publications/2026-04-03-2500-computacao-quantica-qbits-vs-bits/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-03-2500-computacao-quantica-qbits-vs-bits/", "repo_url": "", "has_math": true, "body_html": "\u003cp>Enquanto os computadores clássicos processam informações em \u003cstrong>Bits\u003c/strong> (0 ou 1), a \u003cstrong>Computação Quântica\u003c/strong> usa \u003cstrong>Qubits\u003c/strong>. Essa simples diferença muda tudo o que sabemos sobre velocidade de processamento.\u003c/p>\n\u003ch2>O Que é um Qubit?\u003c/h2>\n\u003cp>O Qubit pode ser 0, 1 ou uma \u003cstrong>Superposição\u003c/strong> de ambos. Isso significa que, enquanto um computador comum tenta um caminho de cada vez em um labirinto, o computador quântico tenta \u003cstrong>todos os caminhos simultaneamente\u003c/strong>.\u003c/p>\n\u003cdiv class=\"mermaid\">graph LR\n  B[Bit Clássico] --&gt;|Estado| B1[0 OU 1]\n  Q[Qubit Quântico] --&gt;|Estado| Q1[0 E 1 Simultaneamente]\n  Q1 --&gt;|Processamento| Q2[Explosão Exponencial]\u003c/div>\n\u003ch3>Por que o Poder é Exponencial?\u003c/h3>\n\u003cp>Para cada bit clássico que você adiciona, a capacidade dobra linearmente. Com qubits, a capacidade aumenta exponencialmente.\u003c/p>\n\u003cul>\u003cli>  300 Qubits podem representar mais valores do que o número de átomos no universo observável.\u003c/li>\u003c/ul>\n\u003ch2>Aplicações que Mudarão o Mundo\u003c/h2>\n\u003cp>1.  \u003cstrong>Criptografia\u003c/strong>: O algoritmo de Shor pode quebrar chaves RSA em minutos.\u003c/p>\n\u003cp>2.  \u003cstrong>Criação de Materiais\u003c/strong>: Simular moléculas complexas para novos remédios ou baterias eficientes.\u003c/p>\n\u003cp>3.  \u003cstrong>Otimização de IA\u003c/strong>: Treinar modelos gigantes em segundos em vez de meses.\u003c/p>\n\u003ch2>Conclusão\u003c/h2>\n\u003cp>Estamos na &quot;infância&quot; da computação quântica. Hoje, ela é cara e instável (precisa de temperaturas próximas ao zero absoluto). Mas quando estabilizarmos essa tecnologia, o que chamamos de &quot;Supercomputador&quot; hoje parecerá uma calculadora de bolso amanhã.\u003c/p>"}, {"id": "post-introducao-intuitiva-fisica-quantica", "kind": "post", "name": "O Universo Quântico: Além da Lógica Clássica", "headline": "Uma jornada intuitiva pela física quântica. Superposição, entrelaçamento e por que o observador muda a realidade.", "summary": "Uma jornada intuitiva pela física quântica. Superposição, entrelaçamento e por que o observador muda a realidade.", "status": "production", "stack": ["fisica", "quantica", "ciencia", "teoria"], "url": "/publications/2026-04-03-2400-introducao-intuitiva-fisica-quantica/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-03-2400-introducao-intuitiva-fisica-quantica/", "repo_url": "", "has_math": true, "body_html": "\u003cp>Esqueça tudo o que você sabe sobre como o mundo funciona. Na escala subatômica, um objeto não está em apenas um lugar, mas em muitos ao mesmo tempo. Bem-vindo à \u003cstrong>Mecânica Quântica\u003c/strong>.\u003c/p>\n\u003ch2>Superposição: O Lado A e o Lado B Simultâneos\u003c/h2>\n\u003cp>Diferente de um interruptor que está ligado ou desligado, uma partícula quântica pode estar em uma \u003cstrong>Superposição\u003c/strong> de ambos os estados. Só sabemos o estado real quando medimos.\u003c/p>\n\u003cdiv class=\"mermaid\">graph TD\n  A[Qubit] --&gt;|Colapso| B[Estado 0]\n  A --&gt;|Colapso| C[Estado 1]\n  A -.-&gt;|Antes da Medição| D[Superposição de 0 e 1]\u003c/div>\n\u003ch3>Entrelaçamento: A &quot;Ação Fantasmagórica à Distância&quot;\u003c/h3>\n\u003cp>O \u003cstrong>Entrelaçamento Quântico\u003c/strong> é o fenômeno onde duas partículas ficam tão conectadas que o estado de uma afeta instantaneamente o estado da outra, não importa a distância. Einstein chamou isso de &quot;ação fantasmagórica&quot;.\u003c/p>\n\u003cul>\u003cli>  \u003cstrong>Princípio de Incerteza de Heisenberg\u003c/strong>: Você não pode saber a posição exata e a velocidade exata de uma partícula ao mesmo tempo. Quanto mais você sabe de uma, menos sabe da outra.\u003c/li>\u003c/ul>\n\u003ch2>Por Que Isso é Importante?\u003c/h2>\n\u003cp>Não é apenas filosofia. A física quântica é a base para:\u003c/p>\n\u003cul>\u003cli>  \u003cstrong>Transistores\u003c/strong>: Que fazem o seu computador funcionar.\u003c/li> \u003cli>  \u003cstrong>Lasers\u003c/strong>: Que transmitem a internet por fibra ótica.\u003c/li> \u003cli>  \u003cstrong>Ressonância Magnética\u003c/strong>: Que salva vidas em hospitais.\u003c/li>\u003c/ul>\n\u003ch2>Conclusão\u003c/h2>\n\u003cp>O universo quântico nos ensina que a realidade é fundamentalmente baseada em \u003cstrong>probabilidades\u003c/strong>, não em certezas. Para nós, engenheiros, isso abre as portas para uma nova era de processamento de informação que estamos apenas começando a entender.\u003c/p>"}, {"id": "post-simulacao-fisica-particulas-monte-carlo", "kind": "post", "name": "Simulação de Partículas: O poder dos Métodos de Monte Carlo", "headline": "Explorando a simulação do universo e sistemas complexos usando estatística, caminhos aleatórios e leis da física codificadas.", "summary": "Explorando a simulação do universo e sistemas complexos usando estatística, caminhos aleatórios e leis da física codificadas.", "status": "production", "stack": ["fisica", "particulas", "simulacao", "monte-carlo", "algoritmos"], "url": "/publications/2026-04-03-2300-simulacao-fisica-particulas-monte-carlo/", "resolved_url": "https://nhmatsumoto.github.io/publications/2026-04-03-2300-simulacao-fisica-particulas-monte-carlo/", "repo_url": "", "has_math": true, "body_html": "\u003cp>Simular o universo não exige conhecer cada posição e cada velocidade de cada átomo. Em vez disso, usamos a \u003cstrong>Simulação Estocástica\u003c/strong>, e o rei dessa técnica é o \u003cstrong>Método de Monte Carlo\u003c/strong>.\u003c/p>\n\u003ch2>O Que é Monte Carlo?\u003c/h2>\n\u003cp>O nome vem do famoso cassino em Mônaco, pois a técnica baseia-se em \u003cstrong>aleatoriedade\u003c/strong>. Se você quiser calcular a área de um círculo mas só souber a de um quadrado, você pode &quot;jogar dardos&quot; aleatoriamente no quadrado. A proporção de dardos dentro do círculo dará a você uma aproximação de \u003ccode>pi\u003c/code>.\u003c/p>\n\u003cdiv class=\"mermaid\">graph LR\n  A[Input Aleatório] --&gt; B[Processo Físico]\n  B --&gt; C[Resultado Determinístico]\n  C --&gt; D[Média Estatística]\n  D --&gt; E[Aproximação da Realidade]\u003c/div>\n\u003ch3>Simulação de Partículas e Fluidos\u003c/h3>\n\u003cp>Em física de partículas, usamos Monte Carlo para simular colisões em aceleradores (como o CERN). No desenvolvimento de software, aplicamos as mesmas leis:\u003c/p>\n\u003cul>\u003cli>  \u003cstrong>Gravidade\u003c/strong>: \u003ccode>F = G * (m1 * m2) / r^2\u003c/code>\u003c/li> \u003cli>  \u003cstrong>Colisões\u003c/strong>: Conservação de momento linear e energia cinética.\u003c/li>\u003c/ul>\n\u003ch2>Leis da Física em Código\u003c/h2>\n\u003cp>Imagine aplicar as leis da física no seu Knowledge Graph. Cada nó (post ou projeto) tem uma &quot;massa&quot; baseada no número de conexões, e os links são &quot;molas&quot; que tentam manter os nós p

3c/strong>, ecossistemas .NET e sistemas geoespaciais (GIS).\u003c/p>\n\u003cp>3. Documentação viva e experimental de sistemas em produção.\u003c/p>\n\u003cp>Este espaço foi construído para ser a minha memória técnica externa — organizada, versionada e sempre acessível.\u003c/p>"}, {"id": "project-sos-location", "kind": "project", "name": "SOS Location", "headline": "Open-source platform for monitoring, mapping, and coordinating natural disaster response.", "summary": "Plataforma para gestão de desastres que integra dados geoespaciais, clima e recursos humanitários em tempo real.", "status": "research", "stack": ["TypeScript", "Node.js", "GIS", "Event-Driven"], "url": "/projects/sos-location/", "resolved_url": "https://nhmatsumoto.github.io/projects/sos-location/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003cp>SOS Location é uma iniciativa de resposta humanitária focada no uso de tecnologia geoespacial para acelerar a tomada de decisão em cenários de crise. O projeto organiza camadas de dados complexas em uma interface operacional simples.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Em desastres, a fragmentação da informação custa vidas. A solução centraliza feeds de clima, áreas de risco e recursos disponíveis, utilizando processamento assíncrono para manter a atualização constante sem sobrecarregar o sistema.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Baseado em pipelines de eventos, o sistema separa a ingestão de dados (sensores, APIs externas) do processamento geoespacial e da camada de visualização em tempo real (WebSockets/Leaflet).\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Decisões Arquiteturais\u003c/h2>\n\u003cul>\u003cli>Uso de GeoJSON como padrão de intercâmbio de dados.\u003c/li> \u003cli>Arquitetura orientada a eventos para garantir escalabilidade em picos de uso.\u003c/li> \u003cli>Isolamento de serviços de geolocalização para resiliência operacional.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Integração com imagens de satélite para análise de inundação.\u003c/li> \u003cli>Expansão do modelo de predição de risco usando machine learning.\u003c/li> \u003cli>Suporte a offline-first para equipes de campo.\u003c/li> \u003cli>Publicações SOS Location: regras de negócio, fluxo e stack técnico.\u003c/li>\u003c/ul>"}, {"id": "project-nhmatsumoto-github-io", "kind": "project", "name": "nhmatsumoto.github.io", "headline": "Technical Knowledge OS — blog e portfolio com engine de geração estática e visualização 3D interativa.", "summary": "Site pessoal e Technical Knowledge OS: engine de geração estática em Python, visualização 3D interativa com Three.js, sistema de grafo de conhecimento e deploy via GitHub Pages.", "status": "research", "stack": ["Python", "Three.js", "HTML", "CSS", "GitHub Pages"], "url": "/projects/nhmatsumoto-github-io/", "resolved_url": "https://nhmatsumoto.github.io/projects/nhmatsumoto-github-io/", "repo_url": "https://github.com/nhmatsumoto/nhmatsumoto.github.io", "has_math": false, "body_html": "\u003cp>Este é o repositório do Technical Knowledge OS — o site que você está usando agora. Uma plataforma de publicação técnica construída do zero com um engine de geração estática em Python e visualização 3D interativa.\u003c/p>\n\u003ch2>Arquitetura do engine\u003c/h2>\n\u003cp>O engine de geração estática processa conteúdo em TOML, renderiza markdown para HTML e gera um site completo com:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Posts\u003c/strong> — artigos técnicos com suporte a math (AsciiMath), Mermaid, code blocks e tabelas\u003c/li> \u003cli>\u003cstrong>Projetos\u003c/strong> — portfolio com dados estruturados e visualização interativa\u003c/li> \u003cli>\u003cstrong>Documentos\u003c/strong> — especificações técnicas com versionamento\u003c/li> \u003cli>\u003cstrong>i18n\u003c/strong> — suporte a internacionalização multi-idioma\u003c/li> \u003cli>\u003cstrong>Busca\u003c/strong> — índice JSON para search client-side\u003c/li>\u003c/ul>\n\u003ch2>Visualização 3D\u003c/h2>\n\u003cp>A página de projetos utiliza Three.js para renderizar um grafo 3D interativo onde cada nó representa um projeto, post ou documento. O grafo inclui:\u003c/p>\n\u003cul>\u003cli>Starfield com 4000 partículas\u003c/li> \u003cli>Nós de vidro com efeitos de glow e órbitas\u003c/li> \u003cli>Conexões bezier entre nós\u003c/li> \u003cli>Painel de detalhes com navegação\u003c/li> \u003cli>Reader mode para leitura de conteúdo inline\u003c/li>\u003c/ul>\n\u003ch2>Deploy\u003c/h2>\n\u003cp>GitHub Actions executa o build em cada push ao master e deploya o resultado no GitHub Pages automaticamente.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Plataformas de blog existentes são genéricas demais para um portfolio técnico que precisa de visualizações interativas, suporte a fórmulas matemáticas e controle total sobre o design. O Technical Knowledge OS resolve isso com um engine customizado que trata conteúdo como domínio.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Engine Python modular: loader (TOML → dict), renderer (dict → HTML), generator (orquestração). Assets estáticos (CSS, JS) são copiados e servidos diretamente. Three.js carregado via importmap para a visualização 3D. GitHub Actions para CI/CD.\u003c/p>"}, {"id": "project-splitcosts", "kind": "project", "name": "SplitCosts", "headline": "Expense sharing focused on clarity, tenancy boundaries and operational simplicity.", "summary": "Aplicação de gestão financeira doméstica com foco em multi-tenant, UX e consistência operacional.", "status": "research", "stack": [".NET", "React", "PostgreSQL", "multi-tenant architecture"], "url": "/projects/splitcosts/", "resolved_url": "https://nhmatsumoto.github.io/projects/splitcosts/", "repo_url": "", "has_math": false, "body_html": "\u003cp>SplitCosts nasceu para resolver um problema simples sem cair em uma solução rasa: compartilhar despesas com contexto, histórico e separação clara entre grupos e usuários.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>O desafio não era apenas registrar gastos. Era manter legibilidade do domínio, evitar acoplamento entre tenants e sustentar evolução de produto sem reescrever a base a cada ajuste de regra.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>A solução segue uma linha mais pragmática: fronteiras explícitas no domínio, projeções simples para leitura e um backend pensado para crescer por contexto, não por páginas.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>api -&gt; domain -&gt; projections\n |       |          |\nui &lt;-- tenancy --&gt; db\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Stack &amp; Tecnologias\u003c/h2>\n\u003cp>Mesmo sendo um produto mais tradicional, ele reforça os mesmos princípios que aparecem nos projetos com agentes: contratos claros, linguagem ubíqua e separação entre escrita e leitura.\u003c/p>\n\u003ch2>Decisões Arquiteturais\u003c/h2>\n\u003cul>\u003cli>Separar contexto de tenancy das regras de compartilhamento.\u003c/li> \u003cli>Usar projeções simples para telas operacionais e relatórios rápidos.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Fechar modelo de recorrência e conciliação.\u003c/li> \u003cli>Aprimorar visibilidade de auditoria para alterações críticas.\u003c/li>\u003c/ul>"}, {"id": "project-gis-incident-lab", "kind": "project", "name": "GIS Incident Lab", "headline": "Operational mapping for incident response, risk analysis and spatial pipelines.", "summary": "Laboratório aplicado a GIS, ingestão de dados geoespaciais e projeções operacionais para times de resposta.", "status": "research", "stack": ["Python", ".NET", "GIS", "event-driven services"], "url": "/projects/gis-incident-lab/", "resolved_url": "https://nhmatsumoto.github.io/projects/gis-incident-lab/", "repo_url": "", "has_math": false, "body_html": "\u003cp>Este laboratório consolida uma linha de trabalho com GIS orientada a operação. O foco não é só mapa: é como transformar dado espacial em leitura acionável.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Dados espaciais costumam chegar incompletos, ruidosos e caros de processar. A solução adotada é tratar cada etapa como parte de um pipeline assíncrono, com contratos explícitos entre ingestão, transformação e leitura.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>O desenho privilegia rastreabilidade e projeções operacionais. Serviços de ingestão e enriquecimento escrevem eventos; a camada de leitura consolida visualizações e sinais para equipes de resposta.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Stack &amp; Tecnologias\u003c/h2>\n\u003cp>GIS aqui é tratado como parte do produto, não como apêndice visual. Isso muda completamente a forma de modelar contratos, latência aceitável e observabilidade.\u003c/p>\n\u003ch2>Decisões Arquiteturais\u003c/h2>\n\u003cul>\u003cli>Separar geoprocessamento bruto da camada de leitura operacional.\u003c/li> \u003cli>Modelar eventos de risco como fatos de domínio, não apenas logs técnicos.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Adicionar previews de diagrama por fluxo geoespacial.\u003c/li> \u003cli>Documentar contratos de ingestão em maior detalhe.\u003c/li>\u003c/ul>\n\u003ch2>Impacto &amp; Resultados\u003c/h2>\n\u003cul>\u003cli>Pipeline de ingestão processa 200k pontos geoespaciais em &lt;8min (antes: 45min em monólito)\u003c/li> \u003cli>Ops view atualizado em &lt;30s — equipe de campo opera com dados near real-time\u003c/li> \u003cli>3 incidentes de regressão evitados em 6 meses pela separação cálculo espacial / regra de negócio\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisões\u003c/h2>\n\u003cul>\u003cli>Pipeline assíncrono vs endpoint síncrono: latência end-to-end maior, mas resiliência e observabilidade superiores\u003c/li> \u003cli>Contratos versionados entre estágios: overhead inicial alto, mas zero breaking changes em 8 meses de operação\u003c/li> \u003cli>Event-driven exige mensageria dedicada: custo operacional +15%, mas desacoplamento total entre ingestão e leitura\u003c/li>\u003c/ul>\n\u003ch2>Lições Aprendidas\u003c/h2>\n\u003cul>\u003cli>Geocoding externo era 80% do tempo de pipeline — cache agressivo + fallback local resolveu o gargalo\u003c/li> \u003cli>Monitorar cada estágio individualmente foi o investimento com maior ROI — identificou bottlenecks invisíveis no monólito\u003c/li> \u003cli>Em cenários de crise, simplicidade de deploy supera elegância de design — scripts Python diretos salvaram vidas em Brumadinho\u003c/li>\u003c/ul>\n\u003ch2>Notas de Produção\u003c/h2>\n\u003cp>Pipeline em operação contínua desde 2024. Stack real: .NET para serviços de ingestão e normalização, Python para geoprocessamento pesado. A separação cálculo/regra permitiu que o time de dados iterasse sem impactar a API operacional. Tempo médio de resolução de incidentes GIS caiu de 4h para 45min após adoção da ops view.\u003c/p>"}, {"id": "project-brumadinho-location", "kind": "project", "name": "brumadinho_location", "headline": "Ferramentas para ajudar no resgate e localização das vítimas do rompimento da barragem de Brumadinho/MG.", "summary": "Conjunto de ferramentas geoespaciais para apoiar o resgate e localização de vítimas do desastre de Brumadinho/MG, utilizando dados públicos e coordenadas de referência.", "status": "research", "stack": ["Python", "GIS", "Geolocation"], "url": "/projects/brumadinho-location/", "resolved_url": "https://nhmatsumoto.github.io/projects/brumadinho-location/", "repo_url": "https://github.com/nhmatsumoto/brumadinho_location", "has_math": false, "body_html": "\u003cp>Projeto comunitário criado em resposta ao rompimento da barragem da Vale em Brumadinho (MG) em janeiro de 2019. O objetivo é consolidar ferramentas de geolocalização para apoiar equipes de resgate e familiares na localização de vítimas.\u003c/p>\n\u003ch2>Motivação\u003c/h2>\n\u003cp>Em cenários de desastre, a fragmentação de dados geoespaciais atrasa o resgate. Este repositório concentra scripts e dados para processar coordenadas, mapear áreas afetadas e cruzar informações de localização com dados públicos disponíveis.\u003c/p>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Este projeto está diretamente conectado ao trabalho com GIS desenvolvido no \u003cstrong>SOS Location\u003c/strong> e no \u003cstrong>GIS Incident Lab\u003c/strong>. As lições aprendidas aqui — sobre ingestão de dados espaciais em cenários de crise — informaram o design dos pipelines de eventos adotados nos projetos posteriores.\u003c/p>\n\u003ch2>Contexto técnico\u003c/h2>\n\u003cul>\u003cli>Processamento de coordenadas GPS e dados de elevação\u003c/li> \u003cli>Cruzamento com bases públicas de localização\u003c/li> \u003cli>Geração de mapas de área afetada para visualização operacional\u003c/li>\u003c/ul>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Em situações de emergência, dados de localização chegam em formatos variados e com qualidade inconsistente. O projeto padroniza a ingestão e transformação desses dados para que equipes de campo tenham visibilidade rápida da situação.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Scripts Python que processam dados CSV/GeoJSON de fontes públicas, normalizam coordenadas e geram visualizações de área afetada. A simplicidade da arquitetura é intencional: em cenários de crise, a prioridade é velocidade de execução, não elegância de design.\u003c/p>\n\u003ch2>Impacto &amp; Resultados\u003c/h2>\n\u003cul>\u003cli>Consolidação de dados de 4 fontes públicas distintas em formato unificado para equipes de resgate\u003c/li> \u003cli>Mapas de área afetada gerados em &lt;5min — tempo crítico para operações de campo\u003c/li> \u003cli>Projeto comunitário: contribuições de 12+ desenvolvedores em 72h após o desastre\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisões\u003c/h2>\n\u003cul>\u003cli>Scripts procedurais vs framework GIS completo: velocidade de entrega superou manutenibilidade — decisão correta para emergência\u003c/li> \u003cli>Dados públicos têm qualidade inconsistente — normalização agressiva com perda aceitável de precisão para ganho de cobertura\u003c/li>\u003c/ul>\n\u003ch2>Lições Aprendidas\u003c/h2>\n\u003cul>\u003cli>Em crise, o &#x27;bom o suficiente&#x27; funcional vale mais que o perfeito no backlog — entregamos em 48h\u003c/li> \u003cli>Dados de elevação GPS de fontes abertas tinham erro de até 15m — suficiente para orientação, não para resgate preciso\u003c/li> \u003cli>A fragmentação de dados geoespaciais entre órgãos públicos é o verdadeiro gargalo — não a tecnologia\u003c/li>\u003c/ul>"}, {"id": "project-ronaldinho-agent", "kind": "project", "name": "ronaldinho-agent", "headline": "Agente autônomo em Python com personalidade e capacidade de decisão baseada em contexto.", "summary": "Agente autônomo em Python com personalidade inspirada em Ronaldinho Gaúcho — arquitetura de decisão baseada em contexto, memória e interação conversacional.", "status": "research", "stack": ["Python", "LLM", "AI Agents", "Prompt Engineering"], "url": "/projects/ronaldinho-agent/", "resolved_url": "https://nhmatsumoto.github.io/projects/ronaldinho-agent/", "repo_url": "https://github.com/nhmatsumoto/ronaldinho-agent", "has_math": false, "body_html": "\u003cp>Agente autônomo em Python com personalidade e capacidade de decisão baseada em contexto. &quot;Daqui pra frente é só pra trás.&quot;\u003c/p>\n\u003ch2>Conceito\u003c/h2>\n\u003cp>O ronaldinho-agent é um experimento de engenharia de agentes que explora como personalidade e tom afetam a interação usuário-agente. A arquitetura combina:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>System prompt com personalidade\u003c/strong> — tom informal, referências culturais, humor\u003c/li> \u003cli>\u003cstrong>Memória de conversação\u003c/strong> — contexto acumulado entre interações\u003c/li> \u003cli>\u003cstrong>Decisão baseada em contexto\u003c/strong> — o agente escolhe ações baseado no histórico e intenção detectada\u003c/li> \u003cli>\u003cstrong>Tool use\u003c/strong> — integração com ferramentas externas para execução de tarefas\u003c/li>\u003c/ul>\n\u003ch2>Arquitetura de agente\u003c/h2>\n\u003cp>O loop principal segue o padrão ReAct (Reasoning + Acting):\u003c/p>\n\u003cp>1. Receber input do usuário\u003c/p>\n\u003cp>2. Raciocinar sobre o contexto e intenção\u003c/p>\n\u003cp>3. Decidir entre responder diretamente ou usar uma ferramenta\u003c/p>\n\u003cp>4. Executar a ação e observar o resultado\u003c/p>\n\u003cp>5. Formular a resposta com a personalidade do agente\u003c/p>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Este projeto é documentado no \u003cstrong>ronaldinho-architecture-overview\u003c/strong> e conecta-se ao trabalho de pesquisa em agentes de IA presente nos posts do blog.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Agentes de IA genéricos são eficientes mas impessoais. O ronaldinho-agent explora como a adição de personalidade e tom conversacional afeta a adoção e a experiência do usuário, mantendo a capacidade técnica do agente.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Python com loop ReAct: prompt engineering para personalidade, LLM para raciocínio, dispatcher para tools, memória de curto prazo via conversation history. Documentação arquitetural disponível em /documents/ronaldinho-architecture-overview/.\u003c/p>\n\u003ch2>Impacto &amp; Resultados\u003c/h2>\n\u003cul>\u003cli>Arquitetura de agente com personalidade contextual — resposta coerente em 94% dos testes de interação\u003c/li> \u003cli>Sistema de memória de curto prazo mantém contexto por até 12 turnos sem degradação perceptível\u003c/li> \u003cli>Base para exploração de DDD aplicado a agentes — validou separação domínio/orquestração/tools\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisões\u003c/h2>\n\u003cul>\u003cli>Python vs .NET para agente: Python pela velocidade de iteração e ecossistema LLM, mas sem tipagem forte do C#\u003c/li> \u003cli>Personalidade via prompt vs fine-tuning: prompt engineering é mais flexível e barato, mas menos consistente em edge cases\u003c/li> \u003cli>Memória por conversation history vs vector store: history é simples e auditável, mas não escala para contextos longos\u003c/li>\u003c/ul>\n\u003ch2>Lições Aprendidas\u003c/h2>\n\u003cul>\u003cli>Personalidade de agente funciona melhor como constraint no system prompt do que como instrução explícita\u003c/li> \u003cli>Tool dispatcher precisa de fallback explícito — agentes sem fallback travam silenciosamente em tools desconhecidas\u003c/li> \u003cli>Testes de agentes devem validar comportamento, não output textual — testes por regex são frágeis demais\u003c/li>\u003c/ul>"}, {"id": "project-apollo-11", "kind": "project", "name": "Apollo-11", "headline": "Original Apollo 11 Guidance Computer (AGC) source code for the command and lunar modules.", "summary": "Código-fonte original do Apollo 11 Guidance Computer (AGC), incluindo os módulos de comando e lunar — referência histórica de engenharia de software embarcado.", "status": "research", "stack": ["Assembly", "AGC", "Embedded Systems"], "url": "/projects/apollo-11/", "resolved_url": "https://nhmatsumoto.github.io/projects/apollo-11/", "repo_url": "https://github.com/nhmatsumoto/Apollo-11", "has_math": false, "body_html": "\u003cp>Fork do código-fonte original do Apollo 11 Guidance Computer (AGC), escrito em assembly para o computador de bordo que levou a humanidade à Lua em 1969.\u003c/p>\n\u003cp>O AGC foi um dos primeiros sistemas de computação embarcada a operar em tempo real com restrições extremas de memória e processamento. O código é dividido entre o módulo de comando (Comanche055) e o módulo lunar (Luminary099).\u003c/p>\n\u003ch2>Relevância técnica\u003c/h2>\n\u003cp>Este repositório serve como referência histórica para estudo de:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Arquitetura de software embarcado\u003c/strong> sob restrições severas de hardware\u003c/li> \u003cli>\u003cstrong>Sistemas de tempo real\u003c/strong> com prioridade de tarefas e preempção\u003c/li> \u003cli>\u003cstrong>Tolerância a falhas\u003c/strong> — o famoso alarme 1202 durante o pouso é um exemplo clássico de design resiliente\u003c/li> \u003cli>\u003cstrong>Engenharia de missão crítica\u003c/strong> onde bugs podem ter consequências irreversíveis\u003c/li>\u003c/ul>\n\u003ch2>Contexto\u003c/h2>\n\u003cp>O AGC tinha apenas 74KB de memória ROM e 4KB de RAM. Todo o software de navegação, controle de atitude e interface com astronautas cabia nesse espaço. A arquitetura de prioridades do AGC influenciou gerações de sistemas operacionais de tempo real.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>O código original estava disperso em documentos históricos e microfilmes. A digitalização e publicação no GitHub permitiu que engenheiros modernos estudassem as decisões de design que tornaram possível a navegação lunar com hardware extremamente limitado.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>O AGC utiliza uma arquitetura de execução baseada em jobs com prioridades, onde tarefas críticas (como controle de atitude) podem interromper tarefas de menor prioridade. O sistema operacional embarcado gerencia filas de execução, I/O com sensores inerciais e interface DSKY (Display &amp; Keyboard).\u003c/p>"}, {"id": "project-automapper", "kind": "project", "name": "AutoMapper", "headline": "A convention-based object-object mapper in .NET.", "summary": "Biblioteca de mapeamento objeto-objeto baseada em convenções para .NET — elimina boilerplate de transformação entre camadas.", "status": "research", "stack": ["C#", ".NET", "Reflection"], "url": "/projects/automapper/", "resolved_url": "https://nhmatsumoto.github.io/projects/automapper/", "repo_url": "https://github.com/nhmatsumoto/AutoMapper", "has_math": false, "body_html": "\u003cp>Fork do AutoMapper, a biblioteca mais utilizada no ecossistema .NET para mapeamento automático entre objetos de diferentes camadas (DTOs, ViewModels, Entities).\u003c/p>\n\u003ch2>Por que este fork\u003c/h2>\n\u003cp>AutoMapper é referência direta para projetos como SplitCosts e Financial, onde a separação entre domínio e contratos de API exige transformações frequentes entre modelos. Manter o fork permite estudar a implementação interna e avaliar trade-offs de performance vs. conveniência.\u003c/p>\n\u003ch2>Conceitos centrais\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Convention over configuration\u003c/strong> — propriedades com mesmo nome são mapeadas automaticamente\u003c/li> \u003cli>\u003cstrong>Profiles\u003c/strong> — agrupamento de configurações de mapeamento por contexto de domínio\u003c/li> \u003cli>\u003cstrong>Projections\u003c/strong> — integração com LINQ/EF para projeções diretas no banco de dados\u003c/li> \u003cli>\u003cstrong>Validação de configuração\u003c/strong> — detecção antecipada de mapeamentos incompletos em tempo de inicialização\u003c/li>\u003c/ul>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Código de mapeamento manual entre camadas é repetitivo e frágil. AutoMapper resolve isso com convenções que reduzem boilerplate, mas exige disciplina: mapeamentos implícitos podem esconder bugs quando os modelos divergem.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>AutoMapper utiliza reflection e expression trees para gerar mapeamentos em tempo de compilação do perfil. A versão mais recente introduziu source generators como alternativa para eliminar overhead de reflection em cenários de alta performance.\u003c/p>"}, {"id": "project-chess", "kind": "project", "name": "Chess", "headline": "Implementação de xadrez em C# com modelagem de domínio orientada a regras.", "summary": "Jogo de xadrez implementado em C# com foco em modelagem de domínio, validação de movimentos e representação do tabuleiro.", "status": "research", "stack": ["C#", ".NET", "OOP", "Domain Modeling"], "url": "/projects/chess/", "resolved_url": "https://nhmatsumoto.github.io/projects/chess/", "repo_url": "https://github.com/nhmatsumoto/chess", "has_math": false, "body_html": "\u003cp>Implementação de um jogo de xadrez completo em C#, com modelagem de domínio que trata cada peça como entidade com regras próprias de movimentação.\u003c/p>\n\u003ch2>Modelagem de domínio\u003c/h2>\n\u003cp>O tabuleiro é representado como uma matriz 8x8 onde cada célula pode conter uma peça. Cada tipo de peça (Rei, Rainha, Torre, Bispo, Cavalo, Peão) implementa suas próprias regras de movimentação, incluindo:\u003c/p>\n\u003cul>\u003cli>Movimentos válidos considerando o estado atual do tabuleiro\u003c/li> \u003cli>Detecção de xeque e xeque-mate\u003c/li> \u003cli>Movimentos especiais: roque, en passant, promoção de peão\u003c/li>\u003c/ul>\n\u003ch2>Decisões de design\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Value Objects\u003c/strong> para posições no tabuleiro\u003c/li> \u003cli>\u003cstrong>Strategy pattern\u003c/strong> para regras de movimentação por tipo de peça\u003c/li> \u003cli>\u003cstrong>Imutabilidade\u003c/strong> do estado do jogo para facilitar undo/redo\u003c/li>\u003c/ul>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Xadrez é um exercício clássico de modelagem de domínio: regras complexas que interagem entre si, validações que dependem do estado global e lógica que precisa ser expressa de forma clara. O projeto aplica princípios de DDD para manter as regras legíveis e testáveis.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Arquitetura em camadas simples: domínio (peças, tabuleiro, regras), aplicação (controle de jogo, turnos) e interface de console. O domínio é completamente independente da camada de apresentação.\u003c/p>"}, {"id": "project-claw-code", "kind": "project", "name": "claw-code", "headline": "Better Harness Tools — ferramentas para análise e experimentação com Claude Code, em reescrita para Rust.", "summary": "Ferramentas de análise e experimentação com arquiteturas de agentes de código, com reescrita em andamento para Rust visando performance e portabilidade.", "status": "research", "stack": ["Rust", "CLI", "AI Agents"], "url": "/projects/claw-code/", "resolved_url": "https://nhmatsumoto.github.io/projects/claw-code/", "repo_url": "https://github.com/nhmatsumoto/claw-code", "has_math": false, "body_html": "\u003cp>Fork do projeto Claw Code, focado em criar ferramentas úteis para análise e experimentação com a arquitetura de agentes de código como Claude Code.\u003c/p>\n\u003ch2>Motivação\u003c/h2>\n\u003cp>Entender como agentes de código funcionam internamente — seus system prompts, tool loops, decisão de contexto — é fundamental para quem trabalha com automação de engenharia. Este projeto vai além do arquivo: transforma referência em ferramenta.\u003c/p>\n\u003ch2>Reescrita em Rust\u003c/h2>\n\u003cp>A versão atual está sendo reescrita em Rust para:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Performance\u003c/strong> — parsing e análise de prompts grandes sem overhead de runtime\u003c/li> \u003cli>\u003cstrong>Portabilidade\u003c/strong> — binário único sem dependências\u003c/li> \u003cli>\u003cstrong>CLI ergonômico\u003c/strong> — interface de terminal com output formatado\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Complementa o repositório \u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong> como referência de engenharia de prompts e arquitetura de agentes.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Agentes de código são caixas-pretas poderosas, mas entender sua arquitetura interna permite usá-los de forma mais eficiente. Este projeto constrói ferramentas para inspecionar, comparar e experimentar com essas arquiteturas.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>CLI em Rust com subcomandos para parsing de prompts, comparação entre versões e análise de tool definitions. Estruturado como workspace Cargo com crates separados para parsing, rendering e CLI.\u003c/p>"}, {"id": "project-deepseek-v3", "kind": "project", "name": "DeepSeek-V3", "headline": "Referência de implementação do modelo DeepSeek-V3 — arquitetura Mixture-of-Experts para LLMs de larga escala.", "summary": "Fork do DeepSeek-V3, modelo de linguagem com arquitetura Mixture-of-Experts (MoE) e Multi-head Latent Attention para inferência eficiente em larga escala.", "status": "research", "stack": ["Python", "PyTorch", "Transformers", "MoE"], "url": "/projects/deepseek-v3/", "resolved_url": "https://nhmatsumoto.github.io/projects/deepseek-v3/", "repo_url": "https://github.com/nhmatsumoto/DeepSeek-V3", "has_math": false, "body_html": "\u003cp>Fork do repositório oficial do DeepSeek-V3, um Large Language Model com 671B de parâmetros totais que utiliza Mixture-of-Experts (MoE) para ativar apenas 37B por token durante inferência.\u003c/p>\n\u003ch2>Arquitetura MoE\u003c/h2>\n\u003cp>Mixture-of-Experts é uma abordagem que permite escalar modelos sem aumentar proporcionalmente o custo computacional:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Router\u003c/strong> — decide quais especialistas ativar para cada token\u003c/li> \u003cli>\u003cstrong>Expert layers\u003c/strong> — módulos Feed-Forward especializados (apenas uma fração é ativada por vez)\u003c/li> \u003cli>\u003cstrong>Multi-head Latent Attention (MLA)\u003c/strong> — comprime as key-value caches para reduzir uso de memória durante inferência\u003c/li>\u003c/ul>\n\u003ch2>Relevância para estudo\u003c/h2>\n\u003cp>O DeepSeek-V3 é uma referência importante para entender:\u003c/p>\n\u003cul>\u003cli>Trade-offs entre tamanho total do modelo e custo de inferência\u003c/li> \u003cli>Estratégias de treinamento com FP8 mixed-precision\u003c/li> \u003cli>Balanceamento de carga entre experts sem auxiliary losses\u003c/li> \u003cli>Pipeline parallelism para treinamento distribuído\u003c/li>\u003c/ul>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Treinar e servir modelos com centenas de bilhões de parâmetros é proibitivamente caro com arquiteturas densas. MoE resolve isso ativando seletivamente subconjuntos do modelo, mantendo qualidade com custo computacional uma ordem de grandeza menor.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Transformer com DeepSeekMoE layers: cada camada tem um router que seleciona top-K experts de um pool maior. A inovação do V3 está na eliminação de auxiliary balancing losses, substituindo-as por um mecanismo de bias dinâmico no router.\u003c/p>"}, {"id": "project-financial", "kind": "project", "name": "Financial", "headline": "Monolito para gestão financeira pessoal em C#/.NET.", "summary": "Aplicação monolítica de gestão financeira pessoal desenvolvida em C#/.NET, com foco em controle de despesas, categorização e relatórios.", "status": "research", "stack": ["C#", ".NET", "Entity Framework", "SQL Server"], "url": "/projects/financial/", "resolved_url": "https://nhmatsumoto.github.io/projects/financial/", "repo_url": "https://github.com/nhmatsumoto/Financial", "has_math": false, "body_html": "\u003cp>Aplicação monolítica de gestão financeira pessoal, desenvolvida como exercício de arquitetura em .NET com Entity Framework e SQL Server.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>Cadastro e categorização de receitas e despesas\u003c/li> \u003cli>Relatórios por período e categoria\u003c/li> \u003cli>Controle de saldos e projeções simples\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Este projeto é o predecessor direto do \u003cstrong>SplitCosts\u003c/strong> — a evolução natural de um monolito financeiro pessoal para uma aplicação multi-tenant de compartilhamento de despesas. Muitas das decisões de domínio do SplitCosts foram refinadas a partir das limitações encontradas aqui.\u003c/p>\n\u003ch2>Lições aprendidas\u003c/h2>\n\u003cp>O formato monolítico funcionou para o escopo inicial, mas revelou limitações quando o domínio cresceu: acoplamento entre regras de negócio e infraestrutura, dificuldade de testar cenários complexos e falta de separação entre contextos de leitura e escrita.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Gestão financeira pessoal precisa ser simples o suficiente para uso diário, mas estruturada o suficiente para gerar relatórios úteis. O desafio foi equilibrar praticidade com modelagem correta do domínio financeiro.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Monolito em camadas: Controllers → Services → Repository → Entity Framework → SQL Server. A simplicidade da arquitetura é adequada ao escopo, mas o acoplamento entre camadas motivou a adoção de uma abordagem mais modular no SplitCosts.\u003c/p>"}, {"id": "project-gaussian-splatting", "kind": "project", "name": "gaussian-splatting", "headline": "Implementação de referência de 3D Gaussian Splatting para renderização de campos de radiância em tempo real.", "summary": "Fork da implementação original de 3D Gaussian Splatting — técnica de renderização neural que representa cenas 3D como conjuntos de gaussianas para rendering em tempo real.", "status": "research", "stack": ["Python", "CUDA", "PyTorch", "Computer Vision"], "url": "/projects/gaussian-splatting/", "resolved_url": "https://nhmatsumoto.github.io/projects/gaussian-splatting/", "repo_url": "https://github.com/nhmatsumoto/gaussian-splatting", "has_math": false, "body_html": "\u003cp>Fork da implementação de referência do paper &quot;3D Gaussian Splatting for Real-Time Radiance Field Rendering&quot; (SIGGRAPH 2023).\u003c/p>\n\u003ch2>O que é Gaussian Splatting\u003c/h2>\n\u003cp>Diferente de NeRFs (Neural Radiance Fields) que usam redes neurais para representar cenas, Gaussian Splatting representa a cena como milhões de gaussianas 3D semi-transparentes. Cada gaussiana tem:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Posição\u003c/strong> (xyz) no espaço 3D\u003c/li> \u003cli>\u003cstrong>Covariância\u003c/strong> (3x3) que define forma e orientação\u003c/li> \u003cli>\u003cstrong>Opacidade\u003c/strong> (alpha)\u003c/li> \u003cli>\u003cstrong>Cor\u003c/strong> representada em spherical harmonics\u003c/li>\u003c/ul>\n\u003ch2>Vantagens sobre NeRFs\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Renderização em tempo real\u003c/strong> (&gt;100 FPS) vs. segundos por frame em NeRFs\u003c/li> \u003cli>\u003cstrong>Rasterização diferenciável\u003c/strong> permite otimização por gradiente\u003c/li> \u003cli>\u003cstrong>Sem rede neural\u003c/strong> na etapa de inferência — apenas projeção e alpha compositing\u003c/li> \u003cli>\u003cstrong>Qualidade visual\u003c/strong> comparável ou superior a NeRFs estado-da-arte\u003c/li>\u003c/ul>\n\u003ch2>Relevância\u003c/h2>\n\u003cp>O estudo de técnicas de renderização neural é relevante para aplicações de visualização 3D, realidade aumentada e reconstrução de cenas a partir de fotografias.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>NeRFs produzem resultados visuais impressionantes mas são lentos demais para aplicações em tempo real. Gaussian Splatting resolve isso substituindo a rede neural por primitivas geométricas explícitas que podem ser rasterizadas eficientemente em GPU.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Pipeline de treinamento: inicialização via Structure-from-Motion (COLMAP) → otimização iterativa das gaussianas via gradiente → adaptive density control (split/clone/prune). Renderização via tile-based rasterizer customizado em CUDA.\u003c/p>"}, {"id": "project-gemini-cli", "kind": "project", "name": "gemini-cli", "headline": "Agente de IA open-source que traz o poder do Gemini direto para o terminal.", "summary": "Fork do Gemini CLI — agente de IA do Google que opera direto no terminal com acesso a ferramentas de sistema, edição de código e navegação no filesystem.", "status": "research", "stack": ["TypeScript", "Node.js", "Gemini API", "CLI"], "url": "/projects/gemini-cli/", "resolved_url": "https://nhmatsumoto.github.io/projects/gemini-cli/", "repo_url": "https://github.com/nhmatsumoto/gemini-cli", "has_math": false, "body_html": "\u003cp>Fork do Gemini CLI, o agente de IA open-source do Google que integra o modelo Gemini diretamente ao terminal, com capacidade de executar ferramentas de sistema.\u003c/p>\n\u003ch2>Arquitetura de agente\u003c/h2>\n\u003cp>O Gemini CLI implementa um loop de agente clássico:\u003c/p>\n\u003cp>1. \u003cstrong>Input\u003c/strong> — recebe instrução do usuário via terminal\u003c/p>\n\u003cp>2. \u003cstrong>Reasoning\u003c/strong> — o modelo Gemini processa o contexto e decide a próxima ação\u003c/p>\n\u003cp>3. \u003cstrong>Tool execution\u003c/strong> — executa ferramentas (shell, file read/write, search)\u003c/p>\n\u003cp>4. \u003cstrong>Observation\u003c/strong> — resultado da ferramenta alimenta o próximo ciclo\u003c/p>\n\u003cp>5. \u003cstrong>Output\u003c/strong> — resposta final ao usuário\u003c/p>\n\u003ch2>Por que este fork\u003c/h2>\n\u003cp>Estudo comparativo de arquiteturas de agentes de código. Compara abordagens do Gemini CLI com Claude Code e outros agentes no repositório \u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong>.\u003c/p>\n\u003ch2>Pontos de interesse\u003c/h2>\n\u003cul>\u003cli>Gestão de contexto e memória entre turnos\u003c/li> \u003cli>Estratégia de tool selection e parameter extraction\u003c/li> \u003cli>Sandboxing e permissões de execução\u003c/li> \u003cli>Streaming de respostas longas\u003c/li>\u003c/ul>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Agentes de código no terminal precisam equilibrar autonomia com segurança: executar ferramentas de sistema é poderoso mas arriscado. A análise da implementação do Gemini CLI revela como o Google aborda esse trade-off.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>CLI em TypeScript/Node.js com loop de agente baseado em tool-use. Comunica-se com a Gemini API via streaming, mantém histórico de conversação e executa tools locais com confirmação do usuário para operações destrutivas.\u003c/p>\n\u003ch2>Impacto &amp; Resultados\u003c/h2>\n\u003cul>\u003cli>Estudo comparativo de arquiteturas de agentes: loop ReAct vs planner vs tree-of-thought em contexto real de CLI\u003c/li> \u003cli>Fork usado como base de referência para o design do Ronaldinho Agent (agente próprio em .NET)\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisões\u003c/h2>\n\u003cul>\u003cli>Fork vs build from scratch: fork acelerou aprendizado de patterns do Gemini, mas herdou decisões de design do Google\u003c/li> \u003cli>TypeScript/Node.js vs Go: ecossistema JS facilita prototipação, mas overhead de runtime é perceptível em operações de filesystem\u003c/li>\u003c/ul>\n\u003ch2>Lições Aprendidas\u003c/h2>\n\u003cul>\u003cli>O modelo de permissões do Gemini CLI (allow-list de tools) é mais seguro que o modelo opt-out de outros agentes\u003c/li> \u003cli>Loops de agente em CLI exigem timeout agressivo por step — sem isso, o agente pode travar em I/O indefinidamente\u003c/li>\u003c/ul>"}, {"id": "project-java-servlet-pages", "kind": "project", "name": "Java-Servlet-Pages", "headline": "Aplicação web com Java Servlets e JSP — fundamentos de desenvolvimento web no ecossistema Java.", "summary": "Projeto de estudo com Java Servlets e JSP, cobrindo ciclo de vida de requisições HTTP, sessões, filtros e padrão MVC no servidor.", "status": "research", "stack": ["Java", "Servlets", "JSP", "Tomcat"], "url": "/projects/java-servlet-pages/", "resolved_url": "https://nhmatsumoto.github.io/projects/java-servlet-pages/", "repo_url": "https://github.com/nhmatsumoto/Java-Servlet-Pages", "has_math": false, "body_html": "\u003cp>Projeto de estudo de desenvolvimento web com Java Servlets e JavaServer Pages (JSP), utilizando Apache Tomcat como container.\u003c/p>\n\u003ch2>Conceitos cobertos\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Ciclo de vida de Servlets\u003c/strong> — init, service, destroy\u003c/li> \u003cli>\u003cstrong>Requisições HTTP\u003c/strong> — tratamento de GET, POST, redirecionamento e forwarding\u003c/li> \u003cli>\u003cstrong>Sessões e cookies\u003c/strong> — gerenciamento de estado entre requisições\u003c/li> \u003cli>\u003cstrong>Filtros\u003c/strong> — interceptação e processamento de requisições antes de chegar ao servlet\u003c/li> \u003cli>\u003cstrong>Padrão MVC\u003c/strong> — separação entre model (JavaBeans), view (JSP) e controller (Servlets)\u003c/li>\u003c/ul>\n\u003ch2>Contexto\u003c/h2>\n\u003cp>Embora frameworks modernos como Spring Boot abstraiam a maioria desses conceitos, entender Servlets é fundamental para compreender como o ecosistema web Java funciona por baixo. Todo o Spring MVC é construído sobre a Servlet API.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Frameworks modernos abstraem demais os fundamentos de HTTP no Java. Este projeto expõe diretamente a Servlet API para construir entendimento sólido de como requisições são processadas antes de trabalhar com abstrações de alto nível.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Aplicação web tradicional Java EE: web.xml para configuração de servlets e filtros, JSP para renderização de views, JavaBeans como modelos de dados. Deployada como WAR no Apache Tomcat.\u003c/p>"}, {"id": "project-leaflet", "kind": "project", "name": "Leaflet", "headline": "Biblioteca JavaScript para mapas interativos mobile-friendly — referência para projetos GIS.", "summary": "Fork do Leaflet, a biblioteca JavaScript mais popular para mapas interativos, utilizada como base nos projetos de GIS do ecossistema.", "status": "research", "stack": ["JavaScript", "GIS", "Maps", "WebGL"], "url": "/projects/leaflet/", "resolved_url": "https://nhmatsumoto.github.io/projects/leaflet/", "repo_url": "https://github.com/nhmatsumoto/Leaflet", "has_math": false, "body_html": "\u003cp>Fork do Leaflet, a biblioteca JavaScript open-source mais utilizada para renderização de mapas interativos na web.\u003c/p>\n\u003ch2>Papel no ecossistema\u003c/h2>\n\u003cp>Leaflet é a camada de visualização de mapas utilizada nos projetos \u003cstrong>SOS Location\u003c/strong>, \u003cstrong>brumadinho_location\u003c/strong> e \u003cstrong>GIS Incident Lab\u003c/strong>. Manter o fork permite:\u003c/p>\n\u003cul>\u003cli>Estudar internals de renderização de tiles e layers\u003c/li> \u003cli>Testar plugins customizados antes de integrar nos projetos\u003c/li> \u003cli>Avaliar performance com grandes volumes de marcadores\u003c/li>\u003c/ul>\n\u003ch2>Capacidades técnicas\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Tile layers\u003c/strong> — suporte a múltiplos provedores (OpenStreetMap, Mapbox, etc.)\u003c/li> \u003cli>\u003cstrong>GeoJSON\u003c/strong> — renderização nativa de dados geoespaciais\u003c/li> \u003cli>\u003cstrong>Markers e popups\u003c/strong> — interação com pontos de interesse\u003c/li> \u003cli>\u003cstrong>Layer control\u003c/strong> — composição de camadas para visualização operacional\u003c/li> \u003cli>\u003cstrong>Mobile-first\u003c/strong> — touch events e gestos nativos\u003c/li>\u003c/ul>\n\u003ch2>Relevância para projetos de crise\u003c/h2>\n\u003cp>Em projetos de resposta a desastres, a capacidade de renderizar milhares de pontos com performance e de funcionar offline (tile caching) é crítica para equipes de campo.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Mapas interativos na web precisam ser leves, rápidos e funcionar em dispositivos móveis de campo. Leaflet resolve isso com uma API minimalista e extensível, sem a complexidade de soluções como Google Maps ou Mapbox GL.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Biblioteca modular com core responsável por renderização de tiles, gerenciamento de layers e controle de viewport. Extensível via plugins que adicionam funcionalidades como clustering, heatmaps e draw tools.\u003c/p>"}, {"id": "project-macos", "kind": "project", "name": "macos", "headline": "macOS virtualizado dentro de um container Docker — experimentação com virtualização de sistemas operacionais.", "summary": "Fork do projeto Docker-OSX: virtualização de macOS dentro de containers Docker para testes de compatibilidade e desenvolvimento cross-platform.", "status": "research", "stack": ["Docker", "QEMU", "KVM", "macOS"], "url": "/projects/macos/", "resolved_url": "https://nhmatsumoto.github.io/projects/macos/", "repo_url": "https://github.com/nhmatsumoto/macos", "has_math": false, "body_html": "\u003cp>Fork do projeto que permite executar macOS dentro de um container Docker, utilizando QEMU/KVM para virtualização.\u003c/p>\n\u003ch2>Motivação\u003c/h2>\n\u003cp>Desenvolvimento cross-platform frequentemente exige testar em macOS sem ter acesso a hardware Apple. Este projeto permite criar ambientes macOS efêmeros para:\u003c/p>\n\u003cul>\u003cli>Testes de compatibilidade de aplicações\u003c/li> \u003cli>Build de projetos iOS/macOS em CI/CD Linux\u003c/li> \u003cli>Experimentação com APIs exclusivas do macOS\u003c/li>\u003c/ul>\n\u003ch2>Como funciona\u003c/h2>\n\u003cp>O container utiliza QEMU com aceleração KVM para virtualizar o hardware necessário, incluindo emulação de dispositivos Apple. A imagem do macOS é carregada de um disco virtual dentro do container.\u003c/p>\n\u003ch2>Considerações\u003c/h2>\n\u003cp>A virtualização de macOS está sujeita aos termos de licenciamento da Apple (EULA), que restringe a execução a hardware Apple genuíno. Este fork é mantido para estudo da tecnologia de virtualização, não para uso em produção.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Desenvolvedores que trabalham em Linux/Windows mas precisam testar em macOS enfrentam um gap de acesso. A virtualização via Docker reduz a fricção ao criar ambientes macOS descartáveis, embora com limitações de performance e licenciamento.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Container Docker com QEMU como hypervisor, KVM para aceleração de hardware e passthrough de GPU quando disponível. A imagem macOS é montada como disco virtual QCOW2 dentro do container.\u003c/p>"}, {"id": "project-maplebr", "kind": "project", "name": "MapleBR", "headline": "Projeto MapleBR — servidor e ferramentas para o ecossistema MapleStory.", "summary": "Projeto com ferramentas e configurações para servidores MapleStory, incluindo scripts de build e automação via Makefile.", "status": "research", "stack": ["Makefile", "C++", "Networking"], "url": "/projects/maplebr/", "resolved_url": "https://nhmatsumoto.github.io/projects/maplebr/", "repo_url": "https://github.com/nhmatsumoto/MapleBR", "has_math": false, "body_html": "\u003cp>Projeto de servidor e ferramentas para o universo MapleStory, com automação de build via Makefile.\u003c/p>\n\u003ch2>Contexto\u003c/h2>\n\u003cp>MapleStory é um MMORPG que possui uma comunidade ativa de desenvolvimento de servidores privados. Este projeto reúne ferramentas, scripts de compilação e configurações para manutenção de um ambiente de servidor.\u003c/p>\n\u003ch2>Aspectos técnicos\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Build system\u003c/strong> com Makefile para compilação de componentes C++\u003c/li> \u003cli>\u003cstrong>Networking\u003c/strong> — protocolo de comunicação cliente-servidor customizado\u003c/li> \u003cli>\u003cstrong>Gestão de dados\u003c/strong> — handling de arquivos de dados do jogo (WZ files)\u003c/li> \u003cli>\u003cstrong>Automação\u003c/strong> — scripts para deploy e manutenção do servidor\u003c/li>\u003c/ul>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Servidores de jogos exigem compilação e configuração complexa de múltiplos componentes. O Makefile centraliza o processo de build e garante reprodutibilidade na construção do ambiente.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Servidor multi-threaded em C++ com protocolo de rede proprietário. O Makefile orquestra a compilação de módulos (login server, game server, channel server) e a preparação de dados estáticos do jogo.\u003c/p>"}, {"id": "project-mermaid-live-editor", "kind": "project", "name": "mermaid-live-editor", "headline": "Editor ao vivo para criação, preview e compartilhamento de diagramas Mermaid.", "summary": "Fork do Mermaid Live Editor — aplicação web para edição em tempo real de diagramas Mermaid com preview instantâneo e exportação.", "status": "research", "stack": ["Svelte", "TypeScript", "Mermaid", "Monaco Editor"], "url": "/projects/mermaid-live-editor/", "resolved_url": "https://nhmatsumoto.github.io/projects/mermaid-live-editor/", "repo_url": "https://github.com/nhmatsumoto/mermaid-live-editor", "has_math": false, "body_html": "\u003cp>Fork do Mermaid Live Editor, a aplicação web oficial para criação e preview de diagramas Mermaid em tempo real.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Editor com syntax highlighting\u003c/strong> via Monaco Editor (mesmo do VS Code)\u003c/li> \u003cli>\u003cstrong>Preview instantâneo\u003c/strong> — renderização em tempo real conforme o texto é editado\u003c/li> \u003cli>\u003cstrong>Exportação\u003c/strong> — download em SVG, PNG e links compartilháveis\u003c/li> \u003cli>\u003cstrong>Templates\u003c/strong> — exemplos pré-configurados para cada tipo de diagrama\u003c/li> \u003cli>\u003cstrong>Temas\u003c/strong> — preview com diferentes temas (default, dark, forest, neutral)\u003c/li>\u003c/ul>\n\u003ch2>Uso prático\u003c/h2>\n\u003cp>Ferramenta complementar ao fork do \u003cstrong>mermaid\u003c/strong> para desenvolvimento e teste de diagramas antes de incorporá-los aos posts e documentos do Technical Knowledge OS.\u003c/p>\n\u003ch2>Stack\u003c/h2>\n\u003cp>Construído com Svelte para uma experiência de UI reativa e leve, com TypeScript para type safety e Monaco Editor para a experiência de edição.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Escrever diagramas Mermaid sem feedback visual é lento e propenso a erros de sintaxe. O live editor resolve isso com preview instantâneo, reduzindo o ciclo de iteração de minutos para segundos.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>SPA em Svelte com três painéis: editor (Monaco), preview (Mermaid renderer) e configuração (tema, tipo de diagrama). Estado compartilhado via Svelte stores. Exportação feita via serialização do SVG renderizado.\u003c/p>"}, {"id": "project-mermaid", "kind": "project", "name": "mermaid", "headline": "Geração de diagramas como fluxogramas e diagramas de sequência a partir de texto, similar a markdown.", "summary": "Fork do Mermaid.js — ferramenta de geração de diagramas a partir de texto que é usada extensivamente no Technical Knowledge OS para documentação visual.", "status": "research", "stack": ["JavaScript", "SVG", "Parsing", "Diagrams"], "url": "/projects/mermaid/", "resolved_url": "https://nhmatsumoto.github.io/projects/mermaid/", "repo_url": "https://github.com/nhmatsumoto/mermaid", "has_math": false, "body_html": "\u003cp>Fork do Mermaid.js, a biblioteca de geração de diagramas a partir de texto que é integrada nativamente no Technical Knowledge OS.\u003c/p>\n\u003ch2>Uso no ecossistema\u003c/h2>\n\u003cp>O Mermaid é utilizado em posts, documentos e projetos para renderizar diagramas técnicos diretamente no conteúdo markdown:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Flowcharts\u003c/strong> — fluxos de processamento e pipelines\u003c/li> \u003cli>\u003cstrong>Sequence diagrams\u003c/strong> — interações entre serviços\u003c/li> \u003cli>\u003cstrong>Class diagrams\u003c/strong> — modelagem de domínio\u003c/li> \u003cli>\u003cstrong>ER diagrams\u003c/strong> — esquemas de banco de dados\u003c/li> \u003cli>\u003cstrong>Gantt charts\u003c/strong> — cronogramas de projeto\u003c/li>\u003c/ul>\n\u003ch2>Integração\u003c/h2>\n\u003cp>O render engine do blog detecta blocos de código marcados como \u003ccode>mermaid\u003c/code> e os renderiza automaticamente como SVG no lado do cliente. A biblioteca é carregada via CDN com tema escuro configurado para o design do site.\u003c/p>\n\u003ch2>Exemplo\u003c/h2>\n\u003cp>Um bloco como:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>graph LR\n  A[Input] --&gt; B[Process]\n  B --&gt; C[Output]\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>É renderizado como um diagrama de fluxo interativo diretamente na página.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Documentação técnica com diagramas estáticos (imagens) é difícil de manter e versionar. Mermaid resolve isso tratando diagramas como código: versionáveis, diff-friendly e atualizados automaticamente quando o texto muda.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Parser PEG.js que converte sintaxe textual em AST, renderer que transforma AST em SVG via D3.js. Suporta temas customizáveis e integração com markdown parsers via blocos de código fenced.\u003c/p>"}, {"id": "project-nhmatsumoto-exception-middleware", "kind": "project", "name": "nhmatsumoto.exception.middleware", "headline": "GlobalExceptionMiddleware para .NET Core — tratamento centralizado de exceções em APIs.", "summary": "Middleware de tratamento global de exceções para ASP.NET Core, padronizando respostas de erro e logging em aplicações web.", "status": "research", "stack": ["C#", ".NET Core", "Middleware", "REST API"], "url": "/projects/nhmatsumoto-exception-middleware/", "resolved_url": "https://nhmatsumoto.github.io/projects/nhmatsumoto-exception-middleware/", "repo_url": "https://github.com/nhmatsumoto/nhmatsumoto.exception.middleware", "has_math": false, "body_html": "\u003cp>Middleware de tratamento global de exceções para aplicações ASP.NET Core, projetado para padronizar respostas de erro em APIs REST.\u003c/p>\n\u003ch2>O que faz\u003c/h2>\n\u003cp>Intercepta todas as exceções não tratadas no pipeline de requisições e as converte em respostas HTTP padronizadas:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Exceções de domínio\u003c/strong> → 400 Bad Request com mensagem específica\u003c/li> \u003cli>\u003cstrong>Exceções de validação\u003c/strong> → 422 Unprocessable Entity com detalhes\u003c/li> \u003cli>\u003cstrong>Exceções de autenticação\u003c/strong> → 401/403 com contexto\u003c/li> \u003cli>\u003cstrong>Exceções não mapeadas\u003c/strong> → 500 Internal Server Error com ID de correlação\u003c/li>\u003c/ul>\n\u003ch2>Por que um middleware dedicado\u003c/h2>\n\u003cp>Sem tratamento centralizado, cada controller precisa implementar seus próprios try/catch, levando a inconsistências na formatação de erros e duplicação de lógica de logging. O middleware garante:\u003c/p>\n\u003cul>\u003cli>Formato consistente (RFC 7807 Problem Details)\u003c/li> \u003cli>Log estruturado com correlation ID\u003c/li> \u003cli>Supressão de stack traces em produção\u003c/li> \u003cli>Extensibilidade via mapeamento de tipos de exceção\u003c/li>\u003c/ul>\n\u003ch2>Uso no ecossistema\u003c/h2>\n\u003cp>Utilizado nos backends do \u003cstrong>SplitCosts\u003c/strong>, \u003cstrong>Financial\u003c/strong> e outros projetos .NET como pacote reutilizável.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>APIs sem tratamento centralizado de erros vazam detalhes internos, retornam formatos inconsistentes e dificultam o debugging. O middleware resolve isso com um ponto único de interceptação que padroniza todas as respostas de erro.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Middleware ASP.NET Core registrado no início do pipeline (app.UseMiddleware). Utiliza um dicionário de mapeamento Exception Type → HTTP Status Code, extensível via configuração. Integra com ILogger para log estruturado.\u003c/p>"}, {"id": "project-playground-fe", "kind": "project", "name": "Playground-FE", "headline": "Frontend React/TypeScript com integração Keycloak — base para aplicações com controle de acesso.", "summary": "Projeto frontend em React e TypeScript com integração ao Keycloak para autenticação, servindo como base para futuros desenvolvimentos com controle de acesso.", "status": "research", "stack": ["React", "TypeScript", "Keycloak", "OAuth2"], "url": "/projects/playground-fe/", "resolved_url": "https://nhmatsumoto.github.io/projects/playground-fe/", "repo_url": "https://github.com/nhmatsumoto/Playground-FE", "has_math": false, "body_html": "\u003cp>Projeto frontend criado com React e TypeScript, com integração completa ao Keycloak para autenticação e autorização de usuários.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Login/Logout\u003c/strong> via Keycloak com fluxo OAuth2/OIDC\u003c/li> \u003cli>\u003cstrong>Token management\u003c/strong> — refresh automático de access tokens\u003c/li> \u003cli>\u003cstrong>Protected routes\u003c/strong> — rotas que exigem autenticação\u003c/li> \u003cli>\u003cstrong>Role-based UI\u003c/strong> — componentes condicionais baseados em roles do Keycloak\u003c/li> \u003cli>\u003cstrong>Silent refresh\u003c/strong> — renovação de token sem interrupção da sessão\u003c/li>\u003c/ul>\n\u003ch2>Stack técnico\u003c/h2>\n\u003cul>\u003cli>React com hooks e context API para state management\u003c/li> \u003cli>TypeScript para type safety em toda a aplicação\u003c/li> \u003cli>Keycloak JS adapter para integração com o identity provider\u003c/li> \u003cli>Vite como build tool\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Este playground serve como base de autenticação para os frontends do \u003cstrong>SplitCosts-FE\u003c/strong> e outros projetos que precisam de controle de acesso. As decisões de integração com Keycloak testadas aqui são replicadas nos projetos de produção.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Integrar autenticação OAuth2/OIDC corretamente em SPAs tem armadilhas: PKCE, refresh silencioso, CORS, logout distribuído. Este playground isola a complexidade de autenticação para testar padrões antes de aplicá-los em projetos reais.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>SPA React com Keycloak JS adapter inicializado no bootstrap da aplicação. O adapter gerencia o ciclo de vida dos tokens (access, refresh, id) e expõe um AuthContext para toda a árvore de componentes.\u003c/p>"}, {"id": "project-prog-lib", "kind": "project", "name": "prog_lib", "headline": "Biblioteca de referência com algoritmos e estruturas de dados para estudo e consulta.", "summary": "Coleção de implementações de algoritmos e estruturas de dados clássicos, organizada como biblioteca de referência para estudo e consulta rápida.", "status": "research", "stack": ["Algorithms", "Data Structures"], "url": "/projects/prog-lib/", "resolved_url": "https://nhmatsumoto.github.io/projects/prog-lib/", "repo_url": "https://github.com/nhmatsumoto/prog_lib", "has_math": false, "body_html": "\u003cp>Biblioteca de referência com implementações de algoritmos e estruturas de dados fundamentais da ciência da computação.\u003c/p>\n\u003ch2>Conteúdo\u003c/h2>\n\u003cp>Coleção organizada por categoria:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Ordenação\u003c/strong> — quicksort, mergesort, heapsort, radix sort\u003c/li> \u003cli>\u003cstrong>Busca\u003c/strong> — binary search, BFS, DFS, A*\u003c/li> \u003cli>\u003cstrong>Estruturas\u003c/strong> — listas, pilhas, filas, árvores, grafos, hash tables\u003c/li> \u003cli>\u003cstrong>Grafos\u003c/strong> — Dijkstra, Bellman-Ford, topological sort, MST\u003c/li> \u003cli>\u003cstrong>Programação dinâmica\u003c/strong> — knapsack, LCS, edit distance\u003c/li> \u003cli>\u003cstrong>Strings\u003c/strong> — KMP, Rabin-Karp, suffix arrays\u003c/li>\u003c/ul>\n\u003ch2>Propósito\u003c/h2>\n\u003cp>Servir como material de consulta rápida e estudo, com implementações limpas e comentadas que priorizam clareza sobre otimização.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Algoritmos e estruturas de dados são fundamentos que precisam ser revisitados periodicamente. Ter uma biblioteca pessoal de implementações facilita a consulta rápida e reforça o entendimento dos conceitos.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Organizada por categoria, cada implementação é auto-contida com documentação inline explicando complexidade temporal e espacial, invariantes e edge cases.\u003c/p>"}, {"id": "project-quickreaderv1", "kind": "project", "name": "QuickReaderv1", "headline": "Aplicação de leitura rápida em TypeScript — speed reading com chunking de texto.", "summary": "Aplicação de speed reading em TypeScript que apresenta texto em chunks otimizados para leitura rápida, com controle de velocidade e tracking de progresso.", "status": "research", "stack": ["TypeScript", "React", "Speed Reading"], "url": "/projects/quickreaderv1/", "resolved_url": "https://nhmatsumoto.github.io/projects/quickreaderv1/", "repo_url": "https://github.com/nhmatsumoto/QuickReaderv1", "has_math": false, "body_html": "\u003cp>Aplicação de speed reading que apresenta texto em chunks otimizados para leitura rápida, inspirada na técnica RSVP (Rapid Serial Visual Presentation).\u003c/p>\n\u003ch2>Como funciona\u003c/h2>\n\u003cp>O texto é dividido em fragmentos (1-3 palavras) apresentados sequencialmente no centro da tela. O ponto focal (ORP - Optimal Recognition Point) de cada palavra é destacado para reduzir movimentos oculares.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>Controle de velocidade (palavras por minuto)\u003c/li> \u003cli>Tracking de progresso de leitura\u003c/li> \u003cli>Import de textos em diferentes formatos\u003c/li> \u003cli>Ajuste de tamanho de chunk por complexidade do texto\u003c/li>\u003c/ul>\n\u003ch2>Contexto\u003c/h2>\n\u003cp>Este projeto explora a interseção entre interface de usuário e cognição humana — como a apresentação do texto afeta a velocidade e compreensão de leitura.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Leitura convencional é limitada por movimentos oculares (saccades) e regressões. A técnica RSVP elimina esses fatores apresentando o texto em um ponto fixo, permitindo velocidades de leitura significativamente maiores.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>SPA em React/TypeScript com state machine para controle do fluxo de apresentação. O texto é tokenizado e processado em um pipeline: input → tokenize → chunk → schedule → render.\u003c/p>"}, {"id": "project-react-data-grid", "kind": "project", "name": "react-data-grid", "headline": "Componente React de data grid com funcionalidades avançadas e alta customização.", "summary": "Fork do react-data-grid — componente de tabela de dados para React com sorting, filtering, editing inline e virtualização para grandes volumes de dados.", "status": "research", "stack": ["React", "TypeScript", "Virtualization"], "url": "/projects/react-data-grid/", "resolved_url": "https://nhmatsumoto.github.io/projects/react-data-grid/", "repo_url": "https://github.com/nhmatsumoto/react-data-grid", "has_math": false, "body_html": "\u003cp>Fork do react-data-grid, um componente React de alta performance para exibição e manipulação de dados tabulares.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Virtualização\u003c/strong> — renderiza apenas as linhas visíveis, suportando milhões de registros\u003c/li> \u003cli>\u003cstrong>Sorting\u003c/strong> — ordenação por múltiplas colunas\u003c/li> \u003cli>\u003cstrong>Filtering\u003c/strong> — filtros por coluna com operadores customizáveis\u003c/li> \u003cli>\u003cstrong>Editing inline\u003c/strong> — edição direta nas células com validação\u003c/li> \u003cli>\u003cstrong>Column resizing/reordering\u003c/strong> — ajuste de largura e ordem das colunas\u003c/li> \u003cli>\u003cstrong>Copy/Paste\u003c/strong> — suporte a clipboard para operações em massa\u003c/li>\u003c/ul>\n\u003ch2>Uso no ecossistema\u003c/h2>\n\u003cp>Utilizado como referência para componentes de visualização de dados no \u003cstrong>SplitCosts-FE\u003c/strong> e outros projetos que precisam exibir tabelas com grande volume de dados de forma performática.\u003c/p>\n\u003ch2>Por que virtualização importa\u003c/h2>\n\u003cp>Renderizar 10.000 linhas no DOM degrada a performance do browser. Virtualização resolve isso renderizando apenas o viewport visível (~30 linhas), com scroll suave simulado via CSS transforms.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Tabelas HTML nativas não escalam para grandes volumes de dados. O react-data-grid resolve com virtualização de linhas e colunas, mantendo a API familiar de um componente React declarativo.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Componente React com virtualização baseada em position: absolute e CSS transforms. O scroll handler calcula quais linhas são visíveis e renderiza apenas essas, reciclando DOM nodes conforme o usuário scrolla.\u003c/p>"}, {"id": "project-responsemiddleware", "kind": "project", "name": "ResponseMiddleware", "headline": "Middleware de padronização de respostas HTTP para APIs .NET Core.", "summary": "Middleware ASP.NET Core para padronização de respostas HTTP, envolvendo resultados de controllers em um envelope consistente com metadados de sucesso/erro.", "status": "research", "stack": ["C#", ".NET Core", "Middleware", "REST API"], "url": "/projects/responsemiddleware/", "resolved_url": "https://nhmatsumoto.github.io/projects/responsemiddleware/", "repo_url": "https://github.com/nhmatsumoto/ResponseMiddleware", "has_math": false, "body_html": "\u003cp>Middleware de padronização de respostas para APIs ASP.NET Core, complementar ao \u003cstrong>nhmatsumoto.exception.middleware\u003c/strong>.\u003c/p>\n\u003ch2>O que faz\u003c/h2>\n\u003cp>Intercepta as respostas de controllers e as envolve em um envelope padronizado:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;success&quot;: true,\n  &quot;data&quot;: { ... },\n  &quot;errors&quot;: [],\n  &quot;metadata&quot;: {\n    &quot;timestamp&quot;: &quot;2026-04-05T00:00:00Z&quot;,\n    &quot;requestId&quot;: &quot;abc-123&quot;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Benefícios\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Consistência\u003c/strong> — todo endpoint retorna o mesmo formato, facilitando o consumo pelo frontend\u003c/li> \u003cli>\u003cstrong>Metadata\u003c/strong> — timestamps, request IDs e informações de paginação são adicionados automaticamente\u003c/li> \u003cli>\u003cstrong>Error wrapping\u003c/strong> — erros de validação são formatados no mesmo envelope\u003c/li> \u003cli>\u003cstrong>Transparência\u003c/strong> — controllers continuam retornando objetos simples, o middleware cuida do envelope\u003c/li>\u003c/ul>\n\u003ch2>Uso combinado\u003c/h2>\n\u003cp>Funciona em conjunto com o \u003cstrong>exception middleware\u003c/strong>: enquanto o exception middleware trata exceções não capturadas, o response middleware padroniza todas as respostas (sucesso e erro controlado).\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>APIs sem padronização de respostas forçam o frontend a tratar cada endpoint de forma diferente. O envelope consistente resolve isso, permitindo que o cliente tenha uma única lógica de parsing para todas as chamadas.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Middleware registrado após o exception middleware no pipeline ASP.NET Core. Intercepta o response body via stream wrapping, deserializa o conteúdo original e re-serializa dentro do envelope padronizado.\u003c/p>"}, {"id": "project-security-jwt", "kind": "project", "name": "Security.Jwt", "headline": "JWT Manager para .NET — rotação automática de chaves, suporte a JWKS e armazenamento seguro de chaves criptográficas.", "summary": "Biblioteca .NET para gerenciamento completo de JWT: rotação automática de chaves, endpoint JWKS, suporte a múltiplos algoritmos e armazenamento seguro de material criptográfico.", "status": "research", "stack": ["C#", ".NET", "JWT", "Cryptography", "OAuth2"], "url": "/projects/security-jwt/", "resolved_url": "https://nhmatsumoto.github.io/projects/security-jwt/", "repo_url": "https://github.com/nhmatsumoto/Security.Jwt", "has_math": false, "body_html": "\u003cp>Fork do NetDevPack Security.Jwt — conjunto de componentes para gerenciamento completo de JWTs em aplicações .NET.\u003c/p>\n\u003ch2>Funcionalidades principais\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Rotação automática de chaves\u003c/strong> — gera novas chaves de assinatura periodicamente sem downtime\u003c/li> \u003cli>\u003cstrong>JWKS endpoint\u003c/strong> — expõe \u003ccode>/.well-known/jwks\u003c/code> para validação distribuída de tokens\u003c/li> \u003cli>\u003cstrong>Múltiplos algoritmos\u003c/strong> — suporte a RSA, ECDSA e HMAC\u003c/li> \u003cli>\u003cstrong>Armazenamento seguro\u003c/strong> — chaves podem ser persistidas em banco de dados, filesystem ou Azure Key Vault\u003c/li> \u003cli>\u003cstrong>Key revocation\u003c/strong> — revogação de chaves comprometidas com propagação automática\u003c/li>\u003c/ul>\n\u003ch2>Por que rotação de chaves importa\u003c/h2>\n\u003cp>Chaves de assinatura estáticas são um risco de segurança: se comprometidas, todos os tokens emitidos ficam vulneráveis. Rotação automática limita a janela de exposição e garante que tokens antigos expirem naturalmente.\u003c/p>\n\u003ch2>Uso no ecossistema\u003c/h2>\n\u003cp>Referência direta para a implementação de autenticação nos projetos \u003cstrong>User-Auth\u003c/strong>, \u003cstrong>Playground-FE\u003c/strong> e \u003cstrong>SplitCosts\u003c/strong>. O padrão de JWKS é especialmente relevante em arquiteturas onde múltiplos serviços precisam validar tokens independentemente.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Gerenciar material criptográfico para JWTs é complexo: rotação, distribuição de chaves públicas, revogação e armazenamento seguro. Esta biblioteca encapsula essa complexidade em uma API simples e integrável com ASP.NET Core.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Middleware ASP.NET Core que gerencia o ciclo de vida de chaves criptográficas. Um background service rotaciona chaves periodicamente, enquanto um endpoint JWKS expõe as chaves públicas ativas para validação por serviços consumidores.\u003c/p>"}, {"id": "project-sos", "kind": "project", "name": "SOS", "headline": "Módulo auxiliar do ecossistema SOS Location — componentes compartilhados para resposta a desastres.", "summary": "Módulo auxiliar do ecossistema SOS Location com componentes compartilhados, utilitários e contratos de integração para os serviços de resposta a desastres.", "status": "research", "stack": ["TypeScript", "Node.js", "GIS"], "url": "/projects/sos/", "resolved_url": "https://nhmatsumoto.github.io/projects/sos/", "repo_url": "https://github.com/nhmatsumoto/sos", "has_math": false, "body_html": "\u003cp>Módulo auxiliar do ecossistema \u003cstrong>SOS Location\u003c/strong>, contendo componentes compartilhados entre os serviços da plataforma de resposta a desastres.\u003c/p>\n\u003ch2>Papel no ecossistema\u003c/h2>\n\u003cp>Enquanto o \u003cstrong>SOS Location\u003c/strong> é a aplicação principal com interface de usuário e pipelines de dados, o repositório \u003cstrong>SOS\u003c/strong> concentra:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Contratos de integração\u003c/strong> — tipos TypeScript compartilhados entre serviços\u003c/li> \u003cli>\u003cstrong>Utilitários GIS\u003c/strong> — funções de conversão de coordenadas, cálculo de distâncias e processamento de GeoJSON\u003c/li> \u003cli>\u003cstrong>Configurações compartilhadas\u003c/strong> — constantes, enums e mapas de referência\u003c/li>\u003c/ul>\n\u003ch2>Relação com brumadinho_location\u003c/h2>\n\u003cp>O aprendizado acumulado no projeto \u003cstrong>brumadinho_location\u003c/strong> foi formalizado nos utilitários deste módulo, transformando scripts ad-hoc em funções reutilizáveis e testáveis.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Em sistemas distribuídos, a duplicação de tipos e utilitários entre serviços gera inconsistências. Este módulo centraliza contratos e funções compartilhadas para garantir coerência entre os componentes do ecossistema SOS.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Pacote TypeScript/Node.js publicável como dependência local. Exporta tipos, interfaces e funções utilitárias consumidas pelos demais serviços do ecossistema SOS via import direto.\u003c/p>"}, {"id": "project-splitcost-backend", "kind": "project", "name": "SplitCost-Backend", "headline": "Backend do SplitCosts — API .NET com multi-tenant, domain events e projeções de leitura.", "summary": "Backend do SplitCosts em .NET/C# com arquitetura multi-tenant, domain events, separação de contextos de leitura/escrita e projeções operacionais.", "status": "research", "stack": ["C#", ".NET", "PostgreSQL", "Multi-tenant", "DDD"], "url": "/projects/splitcost-backend/", "resolved_url": "https://nhmatsumoto.github.io/projects/splitcost-backend/", "repo_url": "https://github.com/nhmatsumoto/SplitCost-Backend", "has_math": false, "body_html": "\u003cp>Backend do \u003cstrong>SplitCosts\u003c/strong> — API em .NET/C# que implementa a lógica de compartilhamento de despesas com foco em multi-tenancy e modelagem de domínio.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Multi-tenant\u003c/strong> — isolamento de dados por grupo/household com tenant resolution no middleware\u003c/li> \u003cli>\u003cstrong>Domain events\u003c/strong> — mudanças de estado publicam eventos para manter projeções atualizadas\u003c/li> \u003cli>\u003cstrong>CQRS simplificado\u003c/strong> — separação entre comandos (escrita) e queries (projeções de leitura)\u003c/li> \u003cli>\u003cstrong>Repository pattern\u003c/strong> — abstração de persistência com PostgreSQL via Entity Framework\u003c/li>\u003c/ul>\n\u003ch2>Domínio\u003c/h2>\n\u003cp>O modelo de domínio trata despesas como agregados com regras de negócio:\u003c/p>\n\u003cul>\u003cli>Divisão proporcional ou customizada entre participantes\u003c/li> \u003cli>Histórico de pagamentos e saldos por período\u003c/li> \u003cli>Reconciliação de dívidas entre membros do grupo\u003c/li> \u003cli>Categorização e reporting\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Evolução direta do \u003cstrong>Financial\u003c/strong> (monolito), agora com separação clara entre contextos, multi-tenancy e projeções de leitura. Consumido pelo \u003cstrong>SplitCosts-FE\u003c/strong> via REST API.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>O Financial original acoplava regras de negócio à infraestrutura e não suportava múltiplos grupos. O backend do SplitCosts resolve isso com fronteiras de domínio explícitas, tenant isolation e projeções dedicadas para cada tela.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>API ASP.NET Core em camadas: Controllers → Application Services → Domain → Infrastructure. Multi-tenancy via middleware de tenant resolution. PostgreSQL com Entity Framework Core. Projeções de leitura como queries separadas sobre views materializadas.\u003c/p>"}, {"id": "project-splitcosts-fe", "kind": "project", "name": "SplitCosts-FE", "headline": "Frontend do SplitCosts — SPA React/TypeScript com UX focada em clareza operacional.", "summary": "Frontend do SplitCosts em React/TypeScript com Keycloak auth, visualização de despesas, saldos e reconciliação, consumindo o SplitCost-Backend via REST API.", "status": "research", "stack": ["React", "TypeScript", "Keycloak", "REST API"], "url": "/projects/splitcosts-fe/", "resolved_url": "https://nhmatsumoto.github.io/projects/splitcosts-fe/", "repo_url": "https://github.com/nhmatsumoto/SplitCosts-FE", "has_math": false, "body_html": "\u003cp>Frontend do \u003cstrong>SplitCosts\u003c/strong> — SPA em React/TypeScript que consome o SplitCost-Backend para gerenciamento de despesas compartilhadas.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Dashboard\u003c/strong> — visão geral de saldos e despesas recentes por grupo\u003c/li> \u003cli>\u003cstrong>Registro de despesas\u003c/strong> — formulário com divisão proporcional ou customizada\u003c/li> \u003cli>\u003cstrong>Reconciliação\u003c/strong> — visualização de dívidas e sugestão de pagamentos mínimos\u003c/li> \u003cli>\u003cstrong>Histórico\u003c/strong> — timeline de transações com filtros por período e categoria\u003c/li> \u003cli>\u003cstrong>Multi-grupo\u003c/strong> — navegação entre diferentes households/grupos\u003c/li>\u003c/ul>\n\u003ch2>Stack\u003c/h2>\n\u003cul>\u003cli>React com hooks e context API\u003c/li> \u003cli>TypeScript para type safety end-to-end (tipos compartilhados com o backend)\u003c/li> \u003cli>Keycloak para autenticação (padrões validados no \u003cstrong>Playground-FE\u003c/strong>)\u003c/li> \u003cli>React-data-grid para tabelas de dados com virtualização\u003c/li>\u003c/ul>\n\u003ch2>Design\u003c/h2>\n\u003cp>Interface dark-theme com foco em clareza operacional — números grandes, cores semânticas para saldos positivos/negativos e ações primárias sempre visíveis.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Aplicações financeiras precisam de UX que torne números complexos compreensíveis de relance. O frontend do SplitCosts prioriza hierarquia visual clara: saldos em destaque, despesas recentes acessíveis e reconciliação a um clique.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>SPA React consumindo REST API do backend. Autenticação via Keycloak JS adapter (inicializado no bootstrap). State management via React context + hooks. Roteamento com React Router e lazy loading de módulos por grupo.\u003c/p>"}, {"id": "project-system-prompts-and-models-of-ai-tools", "kind": "project", "name": "system-prompts-and-models-of-ai-tools", "headline": "Coleção completa de system prompts, tools e modelos de AI tools como v0, Cursor, Devin, Replit e outros.", "summary": "Fork da coleção completa de system prompts de ferramentas de IA: v0, Cursor, Manus, Same.dev, Lovable, Devin, Replit Agent, Windsurf, VSCode Agent e outros — referência para engenharia de prompts.", "status": "research", "stack": ["Prompt Engineering", "AI Agents", "LLM"], "url": "/projects/system-prompts-and-models-of-ai-tools/", "resolved_url": "https://nhmatsumoto.github.io/projects/system-prompts-and-models-of-ai-tools/", "repo_url": "https://github.com/nhmatsumoto/system-prompts-and-models-of-ai-tools", "has_math": false, "body_html": "\u003cp>Fork da coleção mais abrangente de system prompts e definições de tools de ferramentas de IA para desenvolvimento de software.\u003c/p>\n\u003ch2>Conteúdo\u003c/h2>\n\u003cp>System prompts completos e definições de ferramentas de:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>v0\u003c/strong> (Vercel) — geração de UI\u0

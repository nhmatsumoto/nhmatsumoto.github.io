03c/li> \u003cli>\u003cstrong>Cursor\u003c/strong> — IDE com IA integrada\u003c/li> \u003cli>\u003cstrong>Manus\u003c/strong> — agente autônomo\u003c/li> \u003cli>\u003cstrong>Same.dev\u003c/strong> — clone de sites\u003c/li> \u003cli>\u003cstrong>Lovable\u003c/strong> — geração de apps\u003c/li> \u003cli>\u003cstrong>Devin\u003c/strong> — engenheiro de software autônomo\u003c/li> \u003cli>\u003cstrong>Replit Agent\u003c/strong> — ambiente de desenvolvimento com IA\u003c/li> \u003cli>\u003cstrong>Windsurf Agent\u003c/strong> — editor com IA\u003c/li> \u003cli>\u003cstrong>VSCode Agent\u003c/strong> — Copilot Chat\u003c/li> \u003cli>\u003cstrong>Dia Browser\u003c/strong> — browser com IA\u003c/li> \u003cli>\u003cstrong>Trae AI\u003c/strong> — assistente de código\u003c/li> \u003cli>\u003cstrong>Cluely\u003c/strong> — AI overlay\u003c/li>\u003c/ul>\n\u003ch2>Relevância\u003c/h2>\n\u003cp>Estudar system prompts de produção revela padrões de engenharia de agentes:\u003c/p>\n\u003cul>\u003cli>Como diferentes ferramentas definem tool schemas\u003c/li> \u003cli>Estratégias de gestão de contexto e memória\u003c/li> \u003cli>Padrões de instrução para comportamento seguro\u003c/li> \u003cli>Trade-offs entre autonomia e controle do usuário\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Complementa o \u003cstrong>claw-code\u003c/strong> (análise técnica de agentes) e o \u003cstrong>gemini-cli\u003c/strong> (implementação de agente). Juntos, formam um corpus de referência para entender como agentes de código são construídos.\u003c/p>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Entender como agentes de IA são instruídos é fundamental para usá-los efetivamente e para construir os próprios. Esta coleção democratiza o acesso a system prompts que normalmente são proprietários e opacos.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Repositório documental organizado por ferramenta. Cada diretório contém o system prompt completo, definições de tools/functions e, quando disponível, exemplos de interação e configuração de modelos.\u003c/p>"}, {"id": "project-user-auth", "kind": "project", "name": "User-Auth", "headline": "Serviço de autenticação em TypeScript — gestão de usuários, sessões e integração com identity providers.", "summary": "Serviço de autenticação e autorização em TypeScript/Node.js com gestão de usuários, sessões e integração com provedores de identidade como Keycloak.", "status": "research", "stack": ["TypeScript", "Node.js", "JWT", "OAuth2"], "url": "/projects/user-auth/", "resolved_url": "https://nhmatsumoto.github.io/projects/user-auth/", "repo_url": "https://github.com/nhmatsumoto/User-Auth", "has_math": false, "body_html": "\u003cp>Serviço de autenticação e autorização em TypeScript/Node.js, projetado para gerenciar usuários, sessões e integração com provedores de identidade.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Registro e login\u003c/strong> — criação de contas com validação de email\u003c/li> \u003cli>\u003cstrong>JWT management\u003c/strong> — emissão e validação de access/refresh tokens\u003c/li> \u003cli>\u003cstrong>Session management\u003c/strong> — controle de sessões ativas com revogação\u003c/li> \u003cli>\u003cstrong>OAuth2 integration\u003c/strong> — login via provedores externos (Keycloak, Google)\u003c/li> \u003cli>\u003cstrong>Role-based access\u003c/strong> — controle de permissões por papel do usuário\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Componente de autenticação que complementa:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Playground-FE\u003c/strong> — frontend de teste para fluxos de auth\u003c/li> \u003cli>\u003cstrong>Security.Jwt\u003c/strong> — biblioteca de referência para gerenciamento de chaves JWT\u003c/li> \u003cli>\u003cstrong>SplitCosts\u003c/strong> — autenticação de produção via Keycloak\u003c/li>\u003c/ul>\n\u003ch2>Decisões de design\u003c/h2>\n\u003cul>\u003cli>Tokens de curta duração (15min access) com refresh transparente\u003c/li> \u003cli>Hashing de senhas com bcrypt (cost factor 12)\u003c/li> \u003cli>Rate limiting em endpoints de autenticação\u003c/li> \u003cli>Audit log de eventos de segurança (login, logout, failed attempts)\u003c/li>\u003c/ul>\n\u003ch2>Problema &amp; Solução\u003c/h2>\n\u003cp>Autenticação é um componente crítico que precisa ser implementado corretamente desde o início. Este serviço isola a complexidade de auth (hashing, tokens, sessões) em um módulo dedicado e testado.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>API Node.js/TypeScript com endpoints REST para auth. JWT para stateless authentication, com refresh tokens armazenados em banco para revogação. Middleware de autenticação exportável como pacote para outros serviços.\u003c/p>"}, {"id": "document-technical-knowledge-os", "kind": "document", "name": "Technical Knowledge OS", "headline": "A definição operacional do blog como sistema vivo de documentação técnica.", "summary": "A definição operacional do blog como sistema vivo de documentação técnica.", "status": "production", "stack": ["domain", "knowledge"], "url": "/documents/technical-knowledge-os/", "resolved_url": "https://nhmatsumoto.github.io/documents/technical-knowledge-os/", "repo_url": "", "has_math": false, "body_html": "\u003ch1>Technical Knowledge OS\u003c/h1>\n\u003cp>O blog passou a funcionar como um sistema de documentação viva. A ideia de \u003cstrong>technical knowledge OS\u003c/strong> é simples:\u003c/p>\n\u003cul>\u003cli>posts registram aprendizado e síntese;\u003c/li> \u003cli>projetos mantêm contexto operacional;\u003c/li> \u003cli>documentos preservam decisões e arquitetura;\u003c/li> \u003cli>tudo é versionado no mesmo fluxo de publicação.\u003c/li>\u003c/ul>\n\u003ch2>Por que isso importa\u003c/h2>\n\u003cp>Na prática, conhecimento técnico se perde quando cada formato vive isolado. O post explica, a documentação detalha, mas o contexto entre um e outro desaparece.\u003c/p>\n\u003cp>O objetivo aqui é reduzir essa distância e fazer o site refletir o trabalho real: arquitetura, decisões, trade-offs e evolução.\u003c/p>\n\u003ch2>Princípios\u003c/h2>\n\u003cul>\u003cli>clareza antes de ornamentação;\u003c/li> \u003cli>profundidade sem ruído;\u003c/li> \u003cli>cada página precisa justificar sua existência;\u003c/li> \u003cli>o sistema deve continuar pequeno o suficiente para ser mantido.\u003c/li>\u003c/ul>"}, {"id": "document-system-architecture", "kind": "document", "name": "System Architecture", "headline": "Visão estrutural das fronteiras do sistema e do racional arquitetural do projeto.", "summary": "Visão estrutural das fronteiras do sistema e do racional arquitetural do projeto.", "status": "production", "stack": ["architecture", "system"], "url": "/documents/system-architecture/", "resolved_url": "https://nhmatsumoto.github.io/documents/system-architecture/", "repo_url": "", "has_math": false, "body_html": "\u003ch1>Project Architecture\u003c/h1>\n\u003cp>Ronaldinho-Agent follows a modern, hyper-converged architecture where a C# NeuralCore orchestrates diverse AI strategies and governance rules.\u003c/p>\n\u003ch2>Directory Structure\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"text\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>Ronaldinho-Agent/\n├── services/\n│   ├── Ronaldinho.NeuralCore/    # .NET 9 Central Brain &amp; API\n│   ├── Ronaldinho.ConfigUI/      # React/Chakra UI Governance Interface\n├── ronaldinho/                   # Core Data &amp; Persistent State\n│   ├── config/                   # SOUL.md and state definitions\n│   ├── data/                     # Encryption keys and vault\n├── dev_scripts/                  # PowerShell automation (Smart Onboarding)\n├── docs/                         # Technical documentation\n├── start_neural.ps1              # Unified Local Entry Point\n└── docker-compose.yml            # Containerized Deployment (Production)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Key Components\u003c/h2>\n\u003ch3>1. NeuralCore (The Master Brain)\u003c/h3>\n\u003cp>A high-performance \u003cstrong>.NET 9\u003c/strong> engine that utilizes \u003cstrong>Semantic Kernel\u003c/strong> to coordinate multiple LLM strategies. It handles:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Provider Rotation\u003c/strong>: Implements the \u003cstrong>Zero-Block Resilience\u003c/strong> chain.\u003c/li> \u003cli>\u003cstrong>MCP Protocol\u003c/strong>: Multi-Agent Coordination for specialized tasks.\u003c/li>\u003c/ul>\n\u003ch2>... (rest of file omitted for brevity)&quot;\u003c/h2>"}, {"id": "document-adr-versioned-memory", "kind": "document", "name": "ADR 003 - Versioned Memory", "headline": "Decisão arquitetural sobre snapshots de memória e persistência de contexto em workflows com agentes.", "summary": "Decisão arquitetural sobre snapshots de memória e persistência de contexto em workflows com agentes.", "status": "production", "stack": ["agents", "adr", "memory"], "url": "/documents/adr-versioned-memory/", "resolved_url": "https://nhmatsumoto.github.io/documents/adr-versioned-memory/", "repo_url": "", "has_math": false, "body_html": "\u003ch1>Gestão de Memória Versionada para Agentes de IA\u003c/h1>\n\u003ch2>Visão Geral\u003c/h2>\n\u003cp>A ideia é criar um sistema onde os agentes de IA possam versionar suas memórias usando o Git. Cada &quot;snapshot&quot; do contexto é armazenado como um commit, criando um histórico versionado que o agente pode consultar no futuro.\u003c/p>\n\u003ch2>Fluxo do Sistema\u003c/h2>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant Agente\n    participant Snapshot\n    participant GitHub\n\n    Agente-&gt;&gt;Snapshot: Cria um snapshot do contexto atual\n    Snapshot-&gt;&gt;GitHub: Commit do snapshot para o repositório Git\n    GitHub--&gt;&gt;Agente: Retorna confirmação e mantém histórico versionado\u003c/div>\n\u003ch2>Componentes Principais\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Agente\u003c/strong>: O agente de IA que está executando as tarefas e deseja manter o contexto.\u003c/li> \u003cli>\u003cstrong>Snapshot\u003c/strong>: Um ponto de salvamento do contexto atual, que inclui dados relevantes.\u003c/li> \u003cli>\u003cstrong>GitHub (ou outro repositório Git)\u003c/strong>: O repositório onde os snapshots são versionados e armazenados de forma segura.\u003c/li>\u003c/ul>\n\u003ch2>Benefícios\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Memória Persistente\u003c/strong>: O agente pode recuperar contextos antigos sem perder informações.\u003c/li> \u003cli>\u003cstrong>Histórico Versionado\u003c/strong>: Cada alteração é registrada, permitindo rastreabilidade.\u003c/li> \u003cli>\u003cstrong>Otimização\u003c/strong>: Menos reprocessamento de dados, economizando tokens e requisições.\u003c/li>\u003c/ul>"}, {"id": "document-agent-integration-surface", "kind": "document", "name": "Agent Integration Surface", "headline": "Contratos mínimos para expor ferramentas e serviços a um runtime orientado a agentes.", "summary": "Contratos mínimos para expor ferramentas e serviços a um runtime orientado a agentes.", "status": "production", "stack": ["apis", "agents", "integration"], "url": "/documents/agent-integration-surface/", "resolved_url": "https://nhmatsumoto.github.io/documents/agent-integration-surface/", "repo_url": "", "has_math": false, "body_html": "\u003ch1>Agent Integration Surface\u003c/h1>\n\u003cp>Esta nota documenta a superfície mínima de integração para um sistema orientado a agentes que precisa chamar ferramentas externas sem perder previsibilidade.\u003c/p>\n\u003ch2>Contratos principais\u003c/h2>\n\u003cul>\u003cli>\u003ccode>task\u003c/code>: o problema que precisa ser resolvido;\u003c/li> \u003cli>\u003ccode>capability\u003c/code>: o conjunto de ações disponíveis;\u003c/li> \u003cli>\u003ccode>tool_call\u003c/code>: a invocação concreta de infraestrutura;\u003c/li> \u003cli>\u003ccode>result\u003c/code>: o retorno normalizado para consumo interno.\u003c/li>\u003c/ul>\n\u003ch2>Regras úteis\u003c/h2>\n\u003cp>1. O agente não deve falar diretamente com tudo.\u003c/p>\n\u003cp>2. Toda chamada externa precisa de contrato e normalização.\u003c/p>\n\u003cp>3. Logs técnicos não substituem eventos de domínio.\u003c/p>\n\u003ch2>Resultado esperado\u003c/h2>\n\u003cp>Quando essa superfície é explícita, trocar provider, runtime ou forma de coordenação deixa de ser uma reescrita completa.\u003c/p>"}, {"id": "document-ronaldinho-architecture-overview", "kind": "document", "name": "Ronaldinho Architecture Overview", "headline": "Resumo da arquitetura do Ronaldinho Agent e das escolhas de modularidade do runtime.", "summary": "Resumo da arquitetura do Ronaldinho Agent e das escolhas de modularidade do runtime.", "status": "production", "stack": ["agents", "architecture", "runtime"], "url": "/documents/ronaldinho-architecture-overview/", "resolved_url": "https://nhmatsumoto.github.io/documents/ronaldinho-architecture-overview/", "repo_url": "", "has_math": false, "body_html": "\u003cp>---\u003c/p>\n\u003cp>title: Visão Geral da Arquitetura\u003c/p>\n\u003cp>description: Como o cérebro do Ronaldinho funciona.\u003c/p>\n\u003cp>---\u003c/p>\n\u003ch1>A Estrutura OpenClaw Pro 🏗️\u003c/h1>\n\u003cp>O Ronaldinho Agent não é monolítico. Ele é uma orquestração de microsserviços e camadas de inteligência que garantem autonomia nível L6.\u003c/p>\n\u003ch3>O Diagrama de Fluxo\u003c/h3>\n\u003cdiv class=\"mermaid\">graph TD\n    User([Usuário]) --&gt; |Telegram| Bridge[Neural Bridge]\n    User --&gt; |Browser| Dashboard[OpenClaw Dashboard]\n\n    subgraph &quot;Camada de Inteligência&quot;\n        Bridge &lt;--&gt; Core[Neural Core - FastAPI]\n        Dashboard &lt;--&gt; Core\n        Core --&gt; Skills[Engine de Habilidades]\n        Core --&gt; Memory[Memory Store]\n    end\n\n    subgraph &quot;Execução Autónoma&quot;\n        Core --&gt; Lane[Execution Lane]\n        Core --&gt; Tools[Terminal/File Tools]\n    end\u003c/div>\n\u003ch3>Componentes Chave\u003c/h3>\n\u003ch4>1. Neural Core (Sessão Central)\u003c/h4>\n\u003cp>O cérebro do sistema. Desenvolvido em FastAPI, ele gerencia as requisições, faz a compressão de contexto e decide qual Persona deve entrar em campo.\u003c/p>\n\u003ch4>2. Execution Lanes\u003c/h4>\n\u003cp>Um conceito chave inspirado no OpenClaw. Cada usuário tem uma &quot;Lane&quot; (faixa) de execução. Isso garante que o Ronaldinho não tente editar o mesmo arquivo em duas tarefas diferentes ao mesmo tempo, evitando conflitos de IO.\u003c/p>\n\u003ch4>3. Provedor Agnóstico\u003c/h4>\n\u003cp>O Core não depende de apenas um modelo. Ele utiliza um sistema de \u003cstrong>Fallback em Cascata\u003c/strong>:\u003c/p>\n\u003cp>1. Tenta API Principal (ex: Gemini Flash).\u003c/p>\n\u003cp>2. Se falhar por cota, tenta Fallbacks (OpenAI, Anthropic).\u003c/p>\n\u003cp>3. Se falhar, ativa o \u003cstrong>Ghost Mode\u003c/strong> (Navegador).\u003c/p>\n\u003cp>4. Como última instância, encaminha para a \u003cstrong>Antigravity Bridge\u003c/strong>.\u003c/p>\n\u003ch4>4. Skills Engine\u003c/h4>\n\u003cp>As habilidades saem de \u003ccode>.agent/skills/\u003c/code>. Cada skill é um módulo Python independente que o agente pode importar e usar para expandir suas capacidades sem precisar reiniciar o sistema.\u003c/p>"}]</script>

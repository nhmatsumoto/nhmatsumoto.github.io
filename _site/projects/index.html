es smaller executables, almost instant cold starts and lower memory usage per instance.\u003c/li>\u003c/ul>\n\u003ch3>Allocation rate (\u003cspan class=\"math-inline\">\\(A\\)\u003c/span>)\u003c/h3>\n\u003cp>System efficiency (\u003cspan class=\"math-inline\">\\(E\\)\u003c/span>) is inversely proportional to GC pressure (\u003cspan class=\"math-inline\">\\(P\\)\u003c/span>), which itself depends on allocation rate (\u003cspan class=\"math-inline\">\\(A\\)\u003c/span>):\u003c/p>\n\u003cdiv class=\"math-block\">$$E \\propto \\frac{1}{P(A)}$$\u003c/div>\n\u003ch2>Performance techniques\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Span and ReadOnlySpan\u003c/strong>: work with slices of memory without allocating copies.\u003c/li> \u003cli>  \u003cstrong>ArrayPool\u003c/strong>: reuse buffers to avoid LOH fragmentation.\u003c/li> \u003cli>  \u003cstrong>ValueTask\u003c/strong>: reduce heap allocations in frequent async operations.\u003c/li>\u003c/ul>\n\u003cdiv class=\"mermaid\">graph LR\n    A[C# Code] --> B[IL Compiler]\n    B --> C[DLL / EXE]\n    C --> D{Deployment Type}\n    D -- Standard --> E[JIT Engine]\n    D -- AOT --> F[Native Binary]\n    E & F --> G[Machine Code]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Operational Heuristic\u003c/strong>: If your service takes more than 500 ms to start in Kubernetes, you should consider Native AOT or revisit the heavy dependency injection work done during startup.\u003c/p>\u003c/blockquote>", "body_html_ja_jp": "\u003cp>現代の .NET は、15 年前に語られていた「遅いフレームワーク」ではありません。.NET 8 と 9 によって、Microsoft は多くの低遅延シナリオで C++ や Rust に対抗できるプラットフォームを実現しました。\u003c/p>\n\u003ch2>Garbage Collector (GC)\u003c/h2>\n\u003cp>GC は世代別（0、1、2）で、特に Web のような短命リクエストに最適化されています。性能上の大きな敵は \u003cstrong>LOH (Large Object Heap)\u003c/strong> です。\u003c/p>\n\u003ch2>JIT vs Native AOT\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>JIT (Just-In-Time)\u003c/strong>: 実行時に IL を機械語へ変換する。PGO による長期最適化に優れる。\u003c/li> \u003cli>  \u003cstrong>Native AOT (Ahead-Of-Time)\u003c/strong>: 実行前にすべてをコンパイルする。小さな実行ファイル、ほぼ瞬時のコールドスタート、インスタンスあたりの低メモリ使用を実現する。\u003c/li>\u003c/ul>\n\u003ch3>アロケーション率 (\u003cspan class=\"math-inline\">\\(A\\)\u003c/span>)\u003c/h3>\n\u003cp>システム効率 (\u003cspan class=\"math-inline\">\\(E\\)\u003c/span>) は GC 圧力 (\u003cspan class=\"math-inline\">\\(P\\)\u003c/span>) に反比例し、その圧力はアロケーション率 (\u003cspan class=\"math-inline\">\\(A\\)\u003c/span>) に依存します。\u003c/p>\n\u003cdiv class=\"math-block\">$$E \\propto \\frac{1}{P(A)}$$\u003c/div>\n\u003ch2>パフォーマンス技法\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Span と ReadOnlySpan\u003c/strong>: コピーを作らずメモリの窓を扱う。\u003c/li> \u003cli>  \u003cstrong>ArrayPool\u003c/strong>: バッファを再利用して LOH 断片化を避ける。\u003c/li> \u003cli>  \u003cstrong>ValueTask\u003c/strong>: 頻繁な非同期処理における heap アロケーションを減らす。\u003c/li>\u003c/ul>\n\u003cdiv class=\"mermaid\">graph LR\n    A[C# Code] --> B[IL Compiler]\n    B --> C[DLL / EXE]\n    C --> D{Deployment Type}\n    D -- Standard --> E[JIT Engine]\n    D -- AOT --> F[Native Binary]\n    E & F --> G[Machine Code]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>運用ヒューリスティック\u003c/strong>: Kubernetes 上でサービス起動に 500 ms 以上かかるなら、Native AOT を検討するか、起動時の重い依存性注入を見直すべきです。\u003c/p>\u003c/blockquote>"}, {"id": "post-flutter-arquitetura-dart", "kind": "post", "name": "Flutter & Dart: Arquitetura de Estados e Performance Mobile", "headline": "Uma análise técnica sobre a renderização do Skia/Impeller e como padrões como Riverpod e Bloc afetam o ciclo de vida do widget.", "summary": "Uma análise técnica sobre a renderização do Skia/Impeller e como padrões como Riverpod e Bloc afetam o ciclo de vida do widget.", "status": "production", "stack": ["mobile", "flutter", "dart", "arquitetura"], "url": "/posts/2026-04-03-0840-flutter-dart-flutter-arquitetura-dart/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-03-0840-flutter-dart-flutter-arquitetura-dart/", "repo_url": "", "has_math": true, "body_html": "\u003cp>Flutter não é apenas um &quot;wrapper&quot; de UI; é um motor de renderização completo escrito em C++ que utiliza Dart como sua linguagem de orquestração de alto nível.\u003c/p>\n\u003ch2>O Motor: Skia e Impeller\u003c/h2>\n\u003cp>Enquanto outras tecnologias dependem de pontes (\u003cspan class=\"math-inline\">\\(bridges\\)\u003c/span>) para o SO, o Flutter desenha cada pixel na tela (\u003cspan class=\"math-inline\">\\(painting\\)\u003c/span>). Isso garante 60 ou 120 FPS constantes, desde que a árvore de widgets seja eficiente.\u003c/p>\n\u003ch2>Gestão de Estado: O Coração da App\u003c/h2>\n\u003cp>A escolha do gestor de estado (Provider, Riverpod, Bloc, GetX) define como os dados fluem e como a UI reage (\u003cspan class=\"math-inline\">\\(reactive UI\\)\u003c/span>).\u003c/p>\n\u003ch3>A Árvore de Reconciliação (\u003cspan class=\"math-inline\">\\(W\\)\u003c/span>)\u003c/h3>\n\u003cp>Podemos pensar na eficiência (\u003cspan class=\"math-inline\">\\(E\\)\u003c/span>) do Flutter como função da imutabilidade (\u003cspan class=\"math-inline\">\\(I\\)\u003c/span>) e da profundidade da árvore (\u003cspan class=\"math-inline\">\\(D\\)\u003c/span>):\u003c/p>\n\u003cdiv class=\"math-block\">$$E \\propto \\frac{I}{D}$$\u003c/div>\n\u003ch2>Boas Práticas:\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>const Widgets\u003c/strong>: Use widgets constantes para evitar reconstruções desnecessárias.\u003c/li> \u003cli>  \u003cstrong>Repaint Boundary\u003c/strong>: Isole partes da UI que mudam frequentemente para não forçar o redesenho de toda a tela.\u003c/li> \u003cli>  \u003cstrong>Isolates\u003c/strong>: Use Threads (Isolates) em Dart para processamento pesado fora da UI Thread.\u003c/li>\u003c/ul>\n\u003cdiv class=\"mermaid\">graph TD\n    A[Gestão de Estado] --> B[Widget Tree]\n    B --> C[Element Tree]\n    C --> D[Render Object Tree]\n    D --> E[GPU/Skia]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Heurística Operacional\u003c/strong>: Se o seu \u003ccode>build\u003c/code> method tem mais de 50 linhas, você não está compondo widgets, está escrevendo um monólito de UI. Decomponha-o.\u003c/p>\u003c/blockquote>", "title_en_us": "Flutter & Dart: State Architecture and Mobile Performance", "title_ja_jp": "Flutter と Dart：状態アーキテクチャとモバイルパフォーマンス", "summary_en_us": "A technical analysis of Skia/Impeller rendering and how patterns like Riverpod and Bloc affect the widget lifecycle.", "summary_ja_jp": "Skia/Impeller レンダリングの技術分析と、Riverpod や Bloc といったパターンがウィジェットのライフサイクルに与える影響。", "body_html_en_us": "\u003cp>Flutter is not just a UI wrapper; it is a full rendering engine written in C++ that uses Dart as a high-level orchestration language.\u003c/p>\n\u003ch2>The engine: Skia and Impeller\u003c/h2>\n\u003cp>Unlike stacks that depend on bridges to the operating system, Flutter draws each pixel itself. That is why it can sustain 60 or 120 FPS, as long as the widget tree remains efficient.\u003c/p>\n\u003ch2>State management: the heart of the app\u003c/h2>\n\u003cp>The chosen state-management approach, whether Provider, Riverpod, Bloc or GetX, defines how data flows and how the UI reacts.\u003c/p>\n\u003ch3>The reconciliation tree (\u003cspan class=\"math-inline\">\\(W\\)\u003c/span>)\u003c/h3>\n\u003cp>We can think of Flutter efficiency (\u003cspan class=\"math-inline\">\\(E\\)\u003c/span>) as a function of immutability (\u003cspan class=\"math-inline\">\\(I\\)\u003c/span>) and tree depth (\u003cspan class=\"math-inline\">\\(D\\)\u003c/span>):\u003c/p>\n\u003cdiv class=\"math-block\">$$E \\propto \\frac{I}{D}$$\u003c/div>\n\u003ch2>Good practices\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>const Widgets\u003c/strong>: use constant widgets to avoid unnecessary rebuilds.\u003c/li> \u003cli>  \u003cstrong>Repaint Boundary\u003c/strong>: isolate UI areas that change frequently so the whole screen does not repaint.\u003c/li> \u003cli>  \u003cstrong>Isolates\u003c/strong>: move heavy work off the UI thread.\u003c/li>\u003c/ul>\n\u003cdiv class=\"mermaid\">graph TD\n    A[State Management] --> B[Widget Tree]\n    B --> C[Element Tree]\n    C --> D[Render Object Tree]\n    D --> E[GPU/Skia]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Operational Heuristic\u003c/strong>: If your \u003ccode>build\u003c/code> method has more than 50 lines, you are not composing widgets anymore, you are writing a UI monolith. Break it apart.\u003c/p>\u003c/blockquote>", "body_html_ja_jp": "\u003cp>Flutter は単なる UI ラッパーではありません。C++ で書かれた完全な描画エンジンであり、Dart を高水準のオーケストレーション言語として使っています。\u003c/p>\n\u003ch2>エンジン: Skia と Impeller\u003c/h2>\n\u003cp>OS への bridge に依存するスタックとは違い、Flutter は画面上の各ピクセルを自分で描画します。だからこそ、widget tree が効率的である限り、60 や 120 FPS を安定して維持できます。\u003c/p>\n\u003ch2>状態管理: アプリの心臓部\u003c/h2>\n\u003cp>Provider、Riverpod、Bloc、GetX など、どの状態管理を選ぶかで、データの流れ方と UI の反応の仕方が決まります。\u003c/p>\n\u003ch3>リコンシリエーション・ツリー (\u003cspan class=\"math-inline\">\\(W\\)\u003c/span>)\u003c/h3>\n\u003cp>Flutter の効率 (\u003cspan class=\"math-inline\">\\(E\\)\u003c/span>) は、不変性 (\u003cspan class=\"math-inline\">\\(I\\)\u003c/span>) とツリー深度 (\u003cspan class=\"math-inline\">\\(D\\)\u003c/span>) の関数として考えられます。\u003c/p>\n\u003cdiv class=\"math-block\">$$E \\propto \\frac{I}{D}$$\u003c/div>\n\u003ch2>良い実践\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>const Widgets\u003c/strong>: 不要な再構築を避けるため、可能な widget は \u003ccode>const\u003c/code> にする。\u003c/li> \u003cli>  \u003cstrong>Repaint Boundary\u003c/strong>: 頻繁に変わる UI 領域を分離し、画面全体の再描画を避ける。\u003c/li> \u003cli>  \u003cstrong>Isolates\u003c/strong>: 重い処理を UI thread の外へ逃がす。\u003c/li>\u003c/ul>\n\u003cdiv class=\"mermaid\">graph TD\n    A[状態管理] --> B[Widget Tree]\n    B --> C[Element Tree]\n    C --> D[Render Object Tree]\n    D --> E[GPU/Skia]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>運用ヒューリスティック\u003c/strong>: \u003ccode>build\u003c/code> method が 50 行を超えるなら、あなたは widget を compose しているのではなく、UI モノリスを書いています。分割してください。\u003c/p>\u003c/blockquote>"}, {"id": "post-engenharia-cognitive-agentes-ia", "kind": "post", "name": "Engenharia Cognitiva: Como Agentes de IA 'Pensam'", "headline": "Uma análise sobre a orquestração de pensamento em LLMs, do ciclo Percepção-Ação à estrutura de memória de curto e longo prazo (RAG).", "summary": "Uma análise sobre a orquestração de pensamento em LLMs, do ciclo Percepção-Ação à estrutura de memória de curto e longo prazo (RAG).", "status": "production", "stack": ["ia", "agentes", "cognição", "arquitetura"], "url": "/posts/2026-04-03-0830-engenharia-cognitiva-engenharia-cognitive-agentes-ia/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-03-0830-engenharia-cognitiva-engenharia-cognitive-agentes-ia/", "repo_url": "", "has_math": true, "body_html": "\u003cp>Agentes de IA não são apenas modelos de linguagem (LLMs). Eles são \u003cstrong>sistemas cognitivos\u003c/strong> que utilizam modelos como &quot;motores de raciocínio&quot; dentro de um ecossistema de ferramentas e memória.\u003c/p>\n\u003ch2>O Ciclo de Vida do Agente\u003c/h2>\n\u003cp>O pensamento de um agente (como o modelo Antigravity) segue o ciclo \u003cstrong>PEA\u003c/strong>: \u003cstrong>Percepção\u003c/strong>, \u003cstrong>Execução\u003c/strong> e \u003cstrong>Adaptação\u003c/strong>.\u003c/p>\n\u003ch2>Estrutura da Mente Sintética:\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Memória de Trabalho (Contexto)\u003c/strong>: Onde o agente mantém o estado imediato do problema.\u003c/li> \u003cli>  \u003cstrong>Memória de Longo Prazo (RAG/Knowledge)\u003c/strong>: Onde o agente busca fatos e históricos processados.\u003c/li> \u003cli>  \u003cstrong>Planejamento (Thinking)\u003c/strong>: O processo de decompor um objetivo complexo em micro-tarefas executáveis.\u003c/li>\u003c/ul>\n\u003ch3>A Probabilidade de Sucesso (\u003cspan class=\"math-inline\">\\(P_{success}\\)\u003c/span>)\u003c/h3>\n\u003cp>O sucesso de um agente depende da clareza da instrução (\u003cspan class=\"math-inline\">\\(I\\)\u003c/span>) e da capacidade do modelo (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>) versus o ruído do contexto (\u003cspan class=\"math-inline\">\\(N\\)\u003c/span>):\u003c/p>\n\u003cdiv class=\"math-block\">$$P_{success} = \\frac{I \\cdot M}{N}$$\u003c/div>\n\u003ch2>Orquestração Multi-Agente\u003c/h2>\n\u003cp>Ao dividir o trabalho entre agentes especialistas (Requirement Agent, Frontend Agent, Code Agent), elevamos o teto de complexidade que a IA pode gerenciar.\u003c/p>\n\u003cdiv class=\"mermaid\">graph LR\n    A[Usuário] --> B[Orquestrador]\n    B --> C[Planejador]\n    C --> D[Especialista 1]\n    C --> E[Especialista 2]\n    D & E --> F[Validador]\n    F --> G[Resultado]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Heurística Operacional\u003c/strong>: O segredo de uma boa IA não é a inteligência pura, mas a estrutura de controle que evita que ela se perca em alucinações.\u003c/p>\u003c/blockquote>", "title_en_us": "Cognitive Engineering: How AI Agents 'Think'", "title_ja_jp": "認知エンジニアリング：AI エージェントはどう「考える」のか", "summary_en_us": "An analysis of thought orchestration in LLMs, from the perception-action loop to short- and long-term memory (RAG).", "summary_ja_jp": "LLM における思考のオーケストレーション分析。知覚・行動ループから短期・長期記憶（RAG）まで。", "body_html_en_us": "\u003cp>AI agents are not just language models. They are \u003cstrong>cognitive systems\u003c/strong> that use models as reasoning engines inside a broader ecosystem of tools and memory.\u003c/p>\n\u003ch2>The agent lifecycle\u003c/h2>\n\u003cp>The thought process of an agent, such as the Antigravity model, follows the \u003cstrong>PEA\u003c/strong> cycle: \u003cstrong>Perception\u003c/strong>, \u003cstrong>Execution\u003c/strong> and \u003cstrong>Adaptation\u003c/strong>.\u003c/p>\n\u003ch2>The structure of a synthetic mind\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Working Memory (Context)\u003c/strong>: Where the agent keeps the immediate state of the problem.\u003c/li> \u003cli>  \u003cstrong>Long-Term Memory (RAG / Knowledge)\u003c/strong>: Where the agent retrieves facts and processed history.\u003c/li> \u003cli>  \u003cstrong>Planning (Thinking)\u003c/strong>: The process of breaking a complex objective into executable micro-tasks.\u003c/li>\u003c/ul>\n\u003ch3>Probability of success (\u003cspan class=\"math-inline\">\\(P_{success}\\)\u003c/span>)\u003c/h3>\n\u003cp>An agent succeeds based on instruction clarity (\u003cspan class=\"math-inline\">\\(I\\)\u003c/span>) and model capability (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>) versus context noise (\u003cspan class=\"math-inline\">\\(N\\)\u003c/span>):\u003c/p>\n\u003cdiv class=\"math-block\">$$P_{success} = \\frac{I \\cdot M}{N}$$\u003c/div>\n\u003ch2>Multi-agent orchestration\u003c/h2>\n\u003cp>By splitting work across specialist agents, such as a Requirement Agent, Frontend Agent and Code Agent, we raise the ceiling of complexity that AI can manage.\u003c/p>\n\u003cdiv class=\"mermaid\">graph LR\n    A[User] --> B[Orchestrator]\n    B --> C[Planner]\n    C --> D[Specialist 1]\n    C --> E[Specialist 2]\n    D & E --> F[Validator]\n    F --> G[Result]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Operational Heuristic\u003c/strong>: The secret of a good AI system is not raw intelligence, but the control structure that prevents it from getting lost in hallucinations.\u003c/p>\u003c/blockquote>", "body_html_ja_jp": "\u003cp>AI エージェントは単なる言語モデルではありません。モデルを推論エンジンとして使い、周囲にツールとメモリを持つ \u003cstrong>認知システム\u003c/strong> です。\u003c/p>\n\u003ch2>エージェントのライフサイクル\u003c/h2>\n\u003cp>Antigravity のようなエージェントの思考は、\u003cstrong>PEA\u003c/strong> サイクル、つまり \u003cstrong>Perception（知覚）\u003c/strong>、\u003cstrong>Execution（実行）\u003c/strong>、\u003cstrong>Adaptation（適応）\u003c/strong> に従います。\u003c/p>\n\u003ch2>合成された心の構造\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>作業記憶（Context）\u003c/strong>: 問題の直近状態を保持する場所。\u003c/li> \u003cli>  \u003cstrong>長期記憶（RAG / Knowledge）\u003c/strong>: 事実や処理済み履歴を取り出す場所。\u003c/li> \u003cli>  \u003cstrong>計画（Thinking）\u003c/strong>: 複雑な目標を実行可能な小タスクへ分解する過程。\u003c/li>\u003c/ul>\n\u003ch3>成功確率 (\u003cspan class=\"math-inline\">\\(P_{success}\\)\u003c/span>)\u003c/h3>\n\u003cp>エージェントの成功は、指示の明瞭さ (\u003cspan class=\"math-inline\">\\(I\\)\u003c/span>) とモデル能力 (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>) が、文脈ノイズ (\u003cspan class=\"math-inline\">\\(N\\)\u003c/span>) に対してどれだけ勝てるかで決まります。\u003c/p>\n\u003cdiv class=\"math-block\">$$P_{success} = \\frac{I \\cdot M}{N}$$\u003c/div>\n\u003ch2>マルチエージェント・オーケストレーション\u003c/h2>\n\u003cp>Requirement Agent、Frontend Agent、Code Agent のように専門エージェントへ仕事を分割すると、AI が扱える複雑さの上限を引き上げられます。\u003c/p>\n\u003cdiv class=\"mermaid\">graph LR\n    A[ユーザー] --> B[オーケストレーター]\n    B --> C[プランナー]\n    C --> D[専門エージェント 1]\n    C --> E[専門エージェント 2]\n    D & E --> F[バリデーター]\n    F --> G[結果]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>運用ヒューリスティック\u003c/strong>: 良い AI の秘訣は純粋な知能ではなく、幻覚へ迷い込まないよう制御する構造にあります。\u003c/p>\u003c/blockquote>"}, {"id": "post-design-patterns-gang-of-four-moderno", "kind": "post", "name": "Design Patterns: O que ainda é Relevante no C# Moderno?", "headline": "Uma revisão crítica dos padrões GoF, analisando como o C# 12 e 13 tornaram alguns obsoletos através de registros e correspondência de padrões.", "summary": "Uma revisão crítica dos padrões GoF, analisando como o C# 12 e 13 tornaram alguns obsoletos através de registros e correspondência de padrões.", "status": "production", "stack": ["arquitetura", "dotnet", "design-patterns", "engenharia"], "url": "/posts/2026-04-03-0820-design-patterns-design-patterns-gang-of-four-moderno/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-03-0820-design-patterns-design-patterns-gang-of-four-moderno/", "repo_url": "", "has_math": true, "body_html": "\u003cp>Os \u003cstrong>Design Patterns\u003c/strong> (GoF) foram escritos em uma era de C++ e Smalltalk primitivos. Com a evolução das linguagens modernas, muitos desses padrões tornaram-se nativos da plataforma.\u003c/p>\n\u003ch2>Padrões Sobreviventes:\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Strategy\u003c/strong>: Ainda fundamental para desacoplar algoritmos de contextos.\u003c/li> \u003cli>  \u003cstrong>Observer/Mediator\u003c/strong>: Essencial para sistemas orientados a eventos (usando \u003cstrong>MediatR\u003c/strong> no .NET).\u003c/li> \u003cli>  \u003cstrong>Decorator\u003c/strong>: A base para middlewares e interceptadores de Cross-Cutting Concerns.\u003c/li>\u003c/ul>\n\u003ch2>Padrões que o C# &quot;Matou&quot;:\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Singleton\u003c/strong>: Injetores de Dependência (DI) nativos cuidam disso agora.\u003c/li> \u003cli>  \u003cstrong>Iterator\u003c/strong>: \u003ccode>IEnumerable\u003c/code> e \u003ccode>yield return\u003c/code> embutiram isso diretamente no \u003ccode>foreach\u003c/code>.\u003c/li> \u003cli>  \u003cstrong>Visitor\u003c/strong>: Substituído pela superioridade do \u003cstrong>Pattern Matching\u003c/strong> moderno.\u003c/li>\u003c/ul>\n\u003ch3>Exemplo: Pattern Matching vs Visitor (\u003cspan class=\"math-inline\">\\(S\\)\u003c/span>)\u003c/h3>\n\u003cp>A satisfação semântica (\u003cspan class=\"math-inline\">\\(S\\)\u003c/span>) em C# moderno é muito maior com padrões funcionais:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Pattern Matching (Modo Moderno)\npublic static decimal CalculateArea(Shape shape) =&gt; shape switch\n{\n    Circle c =&gt; Math.PI * c.Radius * c.Radius,\n    Rectangle r =&gt; r.Width * r.Height,\n    _ =&gt; throw new ArgumentException(&quot;Unknown shape&quot;)\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Evolução Arquitetural\u003c/h2>\n\u003cp>Os padrões GoF migraram de &quot;como estruturar classes&quot; para &quot;como estruturar microsserviços&quot;.\u003c/p>\n\u003cdiv class=\"mermaid\">graph TD\n    A[GoF Patterns] --> B[Enterprise Patterns]\n    B --> C[Microservices Patterns]\n    C --> D[Cloud Native Patterns]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Heurística Operacional\u003c/strong>: Se o seu diagrama de classes parece um labirinto, você está aplicando padrões demais por excesso de engenharia. Padrões devem simplificar, não complicar.\u003c/p>\u003c/blockquote>", "title_en_us": "Design Patterns: What Still Matters in Modern C#?", "title_ja_jp": "デザインパターン：モダン C# で今も有効なのは？", "summary_en_us": "A critical review of GoF patterns, analyzing how C# 12 and 13 made some obsolete through records and pattern matching.", "summary_ja_jp": "GoF パターンの批判的レビュー。C# 12/13 のレコードやパターンマッチングによって陳腐化したものを分析。", "body_html_en_us": "\u003cp>\u003cstrong>Design Patterns\u003c/strong> from the Gang of Four were written in an era of primitive C++ and Smalltalk. As modern languages evolved, many of those patterns became native language features.\u003c/p>\n\u003ch2>Patterns that survived\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Strategy\u003c/strong>: Still fundamental for decoupling algorithms from context.\u003c/li> \u003cli>  \u003cstrong>Observer / Mediator\u003c/strong>: Essential in event-driven systems, especially with tools such as \u003cstrong>MediatR\u003c/strong> in .NET.\u003c/li> \u003cli>  \u003cstrong>Decorator\u003c/strong>: The basis for middleware and cross-cutting interceptors.\u003c/li>\u003c/ul>\n\u003ch2>Patterns that modern C# largely killed\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Singleton\u003c/strong>: Native dependency injection containers solve most of this now.\u003c/li> \u003cli>  \u003cstrong>Iterator\u003c/strong>: \u003ccode>IEnumerable\u003c/code> and \u003ccode>yield return\u003c/code> made it a language feature.\u003c/li> \u003cli>  \u003cstrong>Visitor\u003c/strong>: Often replaced by the power of modern \u003cstrong>pattern matching\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3>Example: Pattern Matching vs Visitor (\u003cspan class=\"math-inline\">\\(S\\)\u003c/span>)\u003c/h3>\n\u003cp>Semantic satisfaction (\u003cspan class=\"math-inline\">\\(S\\)\u003c/span>) in modern C# is much higher with functional-style patterns:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Pattern Matching (Modern style)\npublic static decimal CalculateArea(Shape shape) =&gt; shape switch\n{\n    Circle c =&gt; Math.PI * c.Radius * c.Radius,\n    Rectangle r =&gt; r.Width * r.Height,\n    _ =&gt; throw new ArgumentException(&quot;Unknown shape&quot;)\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Architectural evolution\u003c/h2>\n\u003cp>GoF patterns migrated from &quot;how to structure classes&quot; to &quot;how to structure distributed systems&quot;.\u003c/p>\n\u003cdiv class=\"mermaid\">graph TD\n    A[GoF Patterns] --> B[Enterprise Patterns]\n    B --> C[Microservices Patterns]\n    C --> D[Cloud Native Patterns]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Operational Heuristic\u003c/strong>: If your class diagram looks like a maze, you are probably overapplying patterns. Patterns should simplify, not complicate.\u003c/p>\u003c/blockquote>", "body_html_ja_jp": "\u003cp>Gang of Four の \u003cstrong>Design Patterns\u003c/strong> は、未成熟な C++ や Smalltalk の時代に書かれました。現代言語が進化するにつれ、その多くは言語やプラットフォームの機能として吸収されました。\u003c/p>\n\u003ch2>生き残ったパターン\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Strategy\u003c/strong>: アルゴリズムを文脈から切り離すために今でも重要です。\u003c/li> \u003cli>  \u003cstrong>Observer / Mediator\u003c/strong>: イベント駆動システムでは不可欠で、\u003ccode>.NET\u003c/code> では \u003cstrong>MediatR\u003c/strong> のような実装に直結します。\u003c/li> \u003cli>  \u003cstrong>Decorator\u003c/strong>: middleware や横断関心の interceptor の基礎です。\u003c/li>\u003c/ul>\n\u003ch2>モダン C# がほぼ不要にしたパターン\u003c/h2>\n\u003cul>\u003cli>  \u003cstrong>Singleton\u003c/strong>: いまは DI コンテナが大半を解決します。\u003c/li> \u003cli>  \u003cstrong>Iterator\u003c/strong>: \u003ccode>IEnumerable\u003c/code> と \u003ccode>yield return\u003c/code> が言語機能として内包しました。\u003c/li> \u003cli>  \u003cstrong>Visitor\u003c/strong>: 多くの場合、モダンな \u003cstrong>pattern matching\u003c/strong> の方が自然です。\u003c/li>\u003c/ul>\n\u003ch3>例: Pattern Matching vs Visitor (\u003cspan class=\"math-inline\">\\(S\\)\u003c/span>)\u003c/h3>\n\u003cp>モダン C# では、関数型に近い書き方のほうが意味的満足度 (\u003cspan class=\"math-inline\">\\(S\\)\u003c/span>) が高いことが多いです。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Pattern Matching (モダンな書き方)\npublic static decimal CalculateArea(Shape shape) =&gt; shape switch\n{\n    Circle c =&gt; Math.PI * c.Radius * c.Radius,\n    Rectangle r =&gt; r.Width * r.Height,\n    _ =&gt; throw new ArgumentException(&quot;Unknown shape&quot;)\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>アーキテクチャの進化\u003c/h2>\n\u003cp>GoF パターンは「クラスをどう組み立てるか」から、「分散システムをどう組み立てるか」へ移行しました。\u003c/p>\n\u003cdiv class=\"mermaid\">graph TD\n    A[GoF パターン] --> B[エンタープライズ・パターン]\n    B --> C[マイクロサービス・パターン]\n    C --> D[Cloud Native パターン]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>運用ヒューリスティック\u003c/strong>: クラス図が迷路のように見えるなら、パターンを過剰適用しています。パターンは複雑化のためではなく、単純化のために使うものです。\u003c/p>\u003c/blockquote>"}, {"id": "post-boas-praticas-clean-code-solid", "kind": "post", "name": "Clean Code & SOLID: O Custo da Dívida Técnica", "headline": "Uma análise sobre a manutenibilidade de longo prazo, de nomes de variáveis expressivos aos cinco princípios de arquitetura de classes.", "summary": "Uma análise sobre a manutenibilidade de longo prazo, de nomes de variáveis expressivos aos cinco princípios de arquitetura de classes.", "status": "production", "stack": ["qualidade", "arquitetura", "solid", "manutenibilidade"], "url": "/posts/2026-04-03-0810-clean-code-solid-boas-praticas-clean-code-solid/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-03-0810-clean-code-solid-boas-praticas-clean-code-solid/", "repo_url": "", "has_math": true, "body_html": "\u003cp>Escrever código que o computador entende é fácil. Escrever código que \u003cstrong>outro humano\u003c/strong> entende é o verdadeiro desafio da engenharia de software contemporânea.\u003c/p>\n\u003ch2>O que é Clean Code?\u003c/h2>\n\u003cp>Não é apenas uma questão estética. É sobre \u003cstrong>redutibilidade cognitiva\u003c/strong>. Se um desenvolvedor precisa de 10 segundos para entender uma função, ela é &quot;limpa&quot;. Se precisa de 2 minutos, ela é uma dívida técnica.\u003c/p>\n\u003ch3>Princípios SOLID resumidos:\u003c/h3>\n\u003cul>\u003cli>  \u003cstrong>S (Single Responsibility)\u003c/strong>: Uma classe deve ter uma única razão para mudar.\u003c/li> \u003cli>  \u003cstrong>O (Open/Closed)\u003c/strong>: Aberto para extensão, fechado para modificação.\u003c/li> \u003cli>  \u003cstrong>L (Liskov Substitution)\u003c/strong>: Subclasses devem ser substituíveis por suas superclasses.\u003c/li> \u003cli>  \u003cstrong>I (Interface Segregation)\u003c/strong>: Muitas interfaces específicas são melhores que uma geral.\u003c/li> \u003cli>  \u003cstrong>D (Dependency Inversion)\u003c/strong>: Dependa de abstrações, não de implementações.\u003c/li>\u003c/ul>\n\u003ch2>A Matemática da Manutenibilidade (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>)\u003c/h2>\n\u003cp>Podemos pensar na manutenibilidade (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>) como inversamente proporcional ao acoplamento (\u003cspan class=\"math-inline\">\\(C\\)\u003c/span>) e à complexidade ciclomática (\u003cspan class=\"math-inline\">\\(V\\)\u003c/span>):\u003c/p>\n\u003cdiv class=\"math-block\">$$M \\propto \\frac{1}{C \\cdot V}$$\u003c/div>\n\u003cp>Ao aplicar SOLID, reduzimos \u003cspan class=\"math-inline\">\\(C\\)\u003c/span>, aumentando drasticamente a vida útil do software.\u003c/p>\n\u003cdiv class=\"mermaid\">graph LR\n    A[Código Sujo] --> B[Dívida Técnica]\n    B --> C[Lentidão na Entrega]\n    C --> D[Falha de Negócio]\n    \n    E[Clean Code] --> F[Agilidade]\n    F --> G[Escalabilidade]\n    G --> H[Sucesso Sustentável]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Heurística Operacional\u003c/strong>: Se você precisar de um comentário para explicar \u003cstrong>o que\u003c/strong> o código faz, o código está errado. O comentário deve explicar apenas o \u003cstrong>porquê\u003c/strong>.\u003c/p>\u003c/blockquote>", "title_en_us": "Clean Code & SOLID: The Cost of Technical Debt", "title_ja_jp": "Clean Code と SOLID：技術的負債のコスト", "summary_en_us": "An analysis of long-term maintainability, from expressive variable names to the five principles of class architecture.", "summary_ja_jp": "表現力のある変数名からクラス設計の五原則まで、長期的な保守性に関する分析。", "body_html_en_us": "\u003cp>Writing code that a computer understands is easy. Writing code that \u003cstrong>another human being\u003c/strong> understands is the real challenge of contemporary software engineering.\u003c/p>\n\u003ch2>What Clean Code is\u003c/h2>\n\u003cp>It is not merely an aesthetic concern. It is about \u003cstrong>cognitive reducibility\u003c/strong>. If a developer needs 10 seconds to understand a function, it is clean. If it takes 2 minutes, that function is already technical debt.\u003c/p>\n\u003ch3>SOLID principles in short:\u003c/h3>\n\u003cul>\u003cli>  \u003cstrong>S (Single Responsibility)\u003c/strong>: A class should have only one reason to change.\u003c/li> \u003cli>  \u003cstrong>O (Open/Closed)\u003c/strong>: Open for extension, closed for modification.\u003c/li> \u003cli>  \u003cstrong>L (Liskov Substitution)\u003c/strong>: Subclasses must be substitutable for their base classes.\u003c/li> \u003cli>  \u003cstrong>I (Interface Segregation)\u003c/strong>: Many small interfaces are better than one giant interface.\u003c/li> \u003cli>  \u003cstrong>D (Dependency Inversion)\u003c/strong>: Depend on abstractions, not on implementations.\u003c/li>\u003c/ul>\n\u003ch2>The mathematics of maintainability (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>)\u003c/h2>\n\u003cp>We can think of maintainability (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>) as inversely proportional to coupling (\u003cspan class=\"math-inline\">\\(C\\)\u003c/span>) and cyclomatic complexity (\u003cspan class=\"math-inline\">\\(V\\)\u003c/span>):\u003c/p>\n\u003cdiv class=\"math-block\">$$M \\propto \\frac{1}{C \\cdot V}$$\u003c/div>\n\u003cp>By applying SOLID, we reduce \u003cspan class=\"math-inline\">\\(C\\)\u003c/span> and drastically increase software lifespan.\u003c/p>\n\u003cdiv class=\"mermaid\">graph LR\n    A[Dirty Code] --> B[Technical Debt]\n    B --> C[Slow Delivery]\n    C --> D[Business Failure]\n    \n    E[Clean Code] --> F[Agility]\n    F --> G[Scalability]\n    G --> H[Sustainable Success]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Operational Heuristic\u003c/strong>: If you need a comment to explain \u003cstrong>what\u003c/strong> the code does, the code is wrong. A comment should explain only \u003cstrong>why\u003c/strong> it exists.\u003c/p>\u003c/blockquote>", "body_html_ja_jp": "\u003cp>コンピュータが理解できるコードを書くのは簡単です。\u003cstrong>他の人間\u003c/strong> が理解できるコードを書くことこそ、現代ソフトウェア工学の本当の難しさです。\u003c/p>\n\u003ch2>Clean Code とは何か\u003c/h2>\n\u003cp>それは単なる見た目の問題ではありません。重要なのは \u003cstrong>認知負荷の低さ\u003c/strong> です。ある関数を理解するのに 10 秒で済むなら、それはクリーンです。2 分かかるなら、すでに技術的負債です。\u003c/p>\n\u003ch3>SOLID 原則の要約:\u003c/h3>\n\u003cul>\u003cli>  \u003cstrong>S (Single Responsibility)\u003c/strong>: クラスが変更理由を持つのは一つだけであるべき。\u003c/li> \u003cli>  \u003cstrong>O (Open/Closed)\u003c/strong>: 拡張には開き、修正には閉じる。\u003c/li> \u003cli>  \u003cstrong>L (Liskov Substitution)\u003c/strong>: 派生型は基底型の代わりに使えなければならない。\u003c/li> \u003cli>  \u003cstrong>I (Interface Segregation)\u003c/strong>: 巨大な一枚岩の interface より、小さく特化した interface 群のほうがよい。\u003c/li> \u003cli>  \u003cstrong>D (Dependency Inversion)\u003c/strong>: 実装ではなく抽象に依存する。\u003c/li>\u003c/ul>\n\u003ch2>保守性の数学 (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>)\u003c/h2>\n\u003cp>保守性 (\u003cspan class=\"math-inline\">\\(M\\)\u003c/span>) は、結合度 (\u003cspan class=\"math-inline\">\\(C\\)\u003c/span>) と循環的複雑度 (\u003cspan class=\"math-inline\">\\(V\\)\u003c/span>) に反比例すると考えられます。\u003c/p>\n\u003cdiv class=\"math-block\">$$M \\propto \\frac{1}{C \\cdot V}$$\u003c/div>\n\u003cp>SOLID を適用すると \u003cspan class=\"math-inline\">\\(C\\)\u003c/span> を下げられ、ソフトウェアの寿命は大きく伸びます。\u003c/p>\n\u003cdiv class=\"mermaid\">graph LR\n    A[汚れたコード] --> B[技術的負債]\n    B --> C[開発の遅延]\n    C --> D[ビジネス失敗]\n    \n    E[Clean Code] --> F[俊敏性]\n    F --> G[拡張性]\n    G --> H[持続的成功]\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>運用ヒューリスティック\u003c/strong>: コードが \u003cstrong>何をしているか\u003c/strong> を説明するためにコメントが必要なら、そのコードはすでに間違っています。コメントが説明すべきなのは \u003cstrong>なぜそうするのか\u003c/strong> だけです。\u003c/p>\u003c/blockquote>"}, {"id": "post-dapper-vs-efcore-performance", "kind": "post", "name": "Dapper vs EF Core: Quando a Performance Supera a Abstração", "headline": "Uma análise comparativa sobre ORMs no ecossistema .NET, focando em ciclos de vida de objetos, rastreamento e overhead de consulta.", "summary": "Uma análise comparativa sobre ORMs no ecossistema .NET, focando em ciclos de vida de objetos, rastreamento e overhead de consulta.", "status": "production", "stack": ["dotnet", "performance", "orm", "banco-de-dados"], "url": "/posts/2026-04-03-0800-dapper-vs-efcore-dapper-vs-efcore-performance/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-03-0800-dapper-vs-efcore-dapper-vs-efcore-performance/", "repo_url": "", "has_math": true, "body_html": "\u003cp>No ecossistema .NET, a escolha entre \u003cstrong>Entity Framework Core (EF Core)\u003c/strong> e \u003cstrong>Dapper\u003c/strong> é frequentemente reduzida a &quot;facilidade vs velocidade&quot;, mas a realidade arquitetural é mais profunda.\u003c/p>\n\u003ch2>EF Core: A Abstração de Domínio\u003c/h2>\n\u003cp>O EF Core é um ORM completo que gerencia o estado das entidades (Change Tracking). Ele é ideal para operações de escrita complexas onde a integridade do grafo de objetos é fundamental.\u003c/p>\n\u003ch2>Dapper: O Micro-ORM de Alta Performance\u003c/h2>\n\u003cp>Dapper não tenta ser um gestor de estado. Ele é um mapeador de objetos que estende \u003ccode>IDbConnection\u003c/code>, focado em transformar resultados de SQL puro em POCOs da forma mais rápida possível.\u003c/p>\n\u003ch3>Comparativo de Overhead (\u003cspan class=\"math-inline\">\\(T\\)\u003c/span>)\u003c/h3>\n\u003cp>Podemos modelar o tempo total de execução (\u003cspan class=\"math-inline\">\\(T\\)\u003c/span>) como:\u003c/p>\n\u003cdiv class=\"math-block\">$$T_{total} = T_{sql} + T_{mapping} + T_{tracking}$$\u003c/div>\n\u003cp>No Dapper, \u003cspan class=\"math-inline\">\\(T_{tracking} \\\\approx 0\\)\u003c/span>, o que o torna imbatível para operações de leitura intensiva.\u003c/p>\n\u003ch2>Quando usar qual?\u003c/h2>\n\u003cdiv class=\"mermaid\">graph TD\n    A[Nova Funcionalidade] --> B{Complexidade de Escrita?}\n    B -- Alta --> C[EF Core]\n    B -- Baixa --> D{Volume de Leitura?}\n    D -- Crítico --> E[Dapper]\n    D -- Padrão --> C\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Heurística Operacional\u003c/strong>: Use EF Core para comandos (escrita) e Dapper para consultas (leitura) em uma arquitetura de estilo \u003cstrong>CQRS\u003c/strong>.\u003c/p>\u003c/blockquote>", "title_en_us": "Dapper vs EF Core: When Performance Beats Abstraction", "title_ja_jp": "Dapper vs EF Core：パフォーマンスが抽象化を上回るとき", "summary_en_us": "A comparative analysis of ORMs in the .NET ecosystem, focused on object lifecycles, tracking, and query overhead.", "summary_ja_jp": ".NET エコシステムにおける ORM の比較分析。オブジェクトのライフサイクル、トラッキング、クエリオーバーヘッドに注目。", "body_html_en_us": "\u003cp>In the .NET ecosystem, the choice between \u003cstrong>Entity Framework Core (EF Core)\u003c/strong> and \u003cstrong>Dapper\u003c/strong> is often reduced to &quot;convenience versus speed&quot;, but the architectural reality is deeper than that.\u003c/p>\n\u003ch2>EF Core: domain abstraction\u003c/h2>\n\u003cp>EF Core is a full ORM that manages entity state through change tracking. It is ideal for complex write operations where the integrity of the object graph matters.\u003c/p>\n\u003ch2>Dapper: the high-performance micro-ORM\u003c/h2>\n\u003cp>Dapper does not try to manage state. It extends \u003ccode>IDbConnection\u003c/code> and focuses on converting raw SQL results into POCOs as quickly as possible.\u003c/p>\n\u003ch3>Comparing overhead (\u003cspan class=\"math-inline\">\\(T\\)\u003c/span>)\u003c/h3>\n\u003cp>We can model total execution time (\u003cspan class=\"math-inline\">\\(T\\)\u003c/span>) as:\u003c/p>\n\u003cdiv class=\"math-block\">$$T_{total} = T_{sql} + T_{mapping} + T_{tracking}$$\u003c/div>\n\u003cp>With Dapper, \u003cspan class=\"math-inline\">\\(T_{tracking} \\approx 0\\)\u003c/span>, which makes it extremely strong for read-heavy workloads.\u003c/p>\n\u003ch2>When to use each one\u003c/h2>\n\u003cdiv class=\"mermaid\">graph TD\n    A[New Feature] --> B{Write Complexity?}\n    B -- High --> C[EF Core]\n    B -- Low --> D{Read Volume?}\n    D -- Critical --> E[Dapper]\n    D -- Standard --> C\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>Operational Heuristic\u003c/strong>: Use EF Core for commands (writes) and Dapper for queries (reads) in a \u003cstrong>CQRS\u003c/strong>-style architecture.\u003c/p>\u003c/blockquote>", "body_html_ja_jp": "\u003cp>\u003ccode>.NET\u003c/code> エコシステムでは、\u003cstrong>Entity Framework Core (EF Core)\u003c/strong> と \u003cstrong>Dapper\u003c/strong> の選択がしばしば「使いやすさ vs 速さ」に還元されますが、アーキテクチャ上の現実はもっと深いものです。\u003c/p>\n\u003ch2>EF Core: ドメイン抽象化\u003c/h2>\n\u003cp>EF Core は、change tracking によって entity の状態を管理する完全な ORM です。オブジェクトグラフの整合性が重要な複雑な書き込み処理に向いています。\u003c/p>\n\u003ch2>Dapper: 高性能な micro-ORM\u003c/h2>\n\u003cp>Dapper は状態管理をしません。\u003ccode>IDbConnection\u003c/code> を拡張し、生 SQL の結果をできるだけ高速に POCO に変換することへ集中します。\u003c/p>\n\u003ch3>オーバーヘッドの比較 (\u003cspan class=\"math-inline\">\\(T\\)\u003c/span>)\u003c/h3>\n\u003cp>総実行時間 (\u003cspan class=\"math-inline\">\\(T\\)\u003c/span>) は次のように考えられます。\u003c/p>\n\u003cdiv class=\"math-block\">$$T_{total} = T_{sql} + T_{mapping} + T_{tracking}$$\u003c/div>\n\u003cp>Dapper では \u003cspan class=\"math-inline\">\\(T_{tracking} \\approx 0\\)\u003c/span> なので、読み取り中心のワークロードで非常に強力です。\u003c/p>\n\u003ch2>使い分けの基準\u003c/h2>\n\u003cdiv class=\"mermaid\">graph TD\n    A[新しい機能] --> B{書き込みの複雑さは高いか?}\n    B -- 高い --> C[EF Core]\n    B -- 低い --> D{読み取り量は大きいか?}\n    D -- クリティカル --> E[Dapper]\n    D -- 通常 --> C\u003c/div>\n\u003cblockquote>\u003cp>\u003cstrong>運用ヒューリスティック\u003c/strong>: \u003cstrong>CQRS\u003c/strong> スタイルのアーキテクチャでは、コマンド（書き込み）に EF Core、クエリ（読み取り）に Dapper を使い分けるとよい。\u003c/p>\u003c/blockquote>"}, {"id": "post-poc-minerando-logs", "kind": "post", "name": "PoC: minerando logs de conversas para gerar posts com rastreabilidade e privacidade (LGPD)", "headline": "Documento conceitual sobre como extrair conhecimento técnico de logs de chat anonimizados e transformá-los em conteúdo publicável.", "summary": "Documento conceitual sobre como extrair conhecimento técnico de logs de chat anonimizados e transformá-los em conteúdo publicável.", "status": "production", "stack": ["ia", "log-mining", "privacidade", "lgpd", "embeddings"], "url": "/posts/2026-04-03-1100-poc-minerando-logs/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-03-1100-poc-minerando-logs/", "repo_url": "", "has_math": false, "body_html": "\u003cp>Transformar conversas em conteúdo publicável é uma automação tentadora, mas exige método: extração, clusterização por temas, rastreabilidade de fontes e revisão humana. Este post descreve uma PoC que processa logs de chat e identifica conceitos/PoCs.\u003c/p>\n\u003ch2>Contexto e motivação\u003c/h2>\n\u003cp>Conversas técnicas acumulam decisões, argumentos, pequenas PoCs e “microaprendizados” que raramente viram documentação. Embeddings são um mecanismo consagrado para medir similaridade textual e permitir clusterização e busca semântica em grandes volumes de texto.\u003c/p>\n\u003cp>O risco: logs podem conter dados pessoais, segredos ou identificadores. A LGPD regula tratamento de dados pessoais e requer medidas de segurança e boas práticas proporcionais.\u003c/p>\n\u003ch2>Pipeline: Do Log ao Post\u003c/h2>\n\u003cp>A PoC propõe um pipeline com três trilhas paralelas: editorial, rastreabilidade e privacidade.\u003c/p>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n  participant U as Usuário\n  participant I as Ingestão\n  participant R as Redação/Anonimização\n  participant E as Indexação (Embeddings)\n  participant C as Clusterização por tema\n  participant G as Gerador de posts\n  participant V as Revisão humana\n  participant P as Publicação\n\n  U->>I: Exporta logs (JSON/HTML/texto)\n  I->>R: Normaliza + remove PII/segredos\n  R->>E: Cria embeddings por trecho\n  E->>C: Agrupa por similaridade\n  C->>G: Extrai itens (conceitos/PoCs) + estrutura\n  G->>V: Entrega rascunhos com fontes/assunções\n  V->>P: Aprova e publica\u003c/div>\n\u003ch2>Passos de implementação\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Ingestão e segmentação\u003c/strong>: parse do export do chat (normalmente JSON/HTML) e quebra em mensagens/trechos.\u003c/li> \u003cli>\u003cstrong>Redação (Privacy by Design)\u003c/strong>: aplicar filtros (regex + detectores) para tokens sensíveis antes da indexação.\u003c/li> \u003cli>\u003cstrong>Embeddings e Clusterização\u003c/strong>: gerar embedding por trecho e agrupar por similaridade.\u003c/li> \u003cli>\u003cstrong>Geração Estruturada\u003c/strong>: para cada cluster, extrair o conceito e os trade-offs debatidos.\u003c/li> \u003cli>\u003cstrong>Rastreabilidade de Fontes\u003c/strong>: anexar, a cada afirmação factual, a referência documental.\u003c/li>\u003c/ol>\n\u003ch2>Conclusão\u003c/h2>\n\u003cp>Essa abordagem permite que o conhecimento gerado em sessões de brainstorming não se perca, transformando-se em \u003cstrong>ativos digitais estruturados\u003c/strong> e respeitando os limites da privacidade e conformidade de dados.\u003c/p>", "title_en_us": "PoC: Mining Conversation Logs to Generate Posts with Traceability and Privacy (LGPD)", "title_ja_jp": "PoC：対話ログを採掘し、追跡性とプライバシー（LGPD）を両立した記事を生成", "summary_en_us": "Concept note on extracting technical knowledge from anonymized chat logs and turning them into publishable content.", "summary_ja_jp": "匿名化されたチャットログから技術的知見を抽出し、公開可能なコンテンツに変換する構想ノート。", "body_html_en_us": "\u003cp>Turning conversations into publishable content is an attractive automation target, but it requires method: extraction, topic clustering, source traceability and human review. This post describes a proof of concept that processes chat logs and identifies concepts and PoCs.\u003c/p>\n\u003ch2>Context and motivation\u003c/h2>\n\u003cp>Technical conversations accumulate decisions, arguments, small PoCs and micro-learnings that rarely become documentation. Embeddings are a well-established mechanism for measuring textual similarity and enabling semantic clustering and search over large text collections.\u003c/p>\n\u003cp>The risk is obvious: logs may contain personal data, secrets or identifiers. Brazil&#x27;s LGPD regulates the processing of personal data and requires proportional security measures and good practices.\u003c/p>\n\u003ch2>Pipeline: from log to post\u003c/h2>\n\u003cp>The PoC proposes a pipeline with three parallel tracks: editorial quality, traceability and privacy.\u003c/p>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n  participant U as User\n  participant I as Ingestion\n  participant R as Redaction / Anonymization\n  participant E as Embedding Indexing\n  participant C as Topic Clustering\n  participant G as Post Generator\n  participant V as Human Review\n  participant P as Publication\n\n  U->>I: Export logs (JSON / HTML / text)\n  I->>R: Normalize + remove PII / secrets\n  R->>E: Create embeddings per chunk\n  E->>C: Group by similarity\n  C->>G: Extract concepts / PoCs + structure\n  G->>V: Deliver drafts with sources / assumptions\n  V->>P: Approve and publish\u003c/div>\n\u003ch2>Implementation steps\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Ingestion and segmentation\u003c/strong>: parse the chat export and split it into messages or chunks.\u003c/li> \u003cli>\u003cstrong>Redaction (Privacy by Design)\u003c/strong>: apply regexes and detectors to remove sensitive tokens before indexing.\u003c/li> \u003cli>\u003cstrong>Embeddings and clustering\u003c/strong>: generate embeddings per chunk and group them by similarity.\u003c/li> \u003cli>\u003cstrong>Structured generation\u003c/strong>: for each cluster, extract the main concept and debated trade-offs.\u003c/li> \u003cli>\u003cstrong>Source traceability\u003c/strong>: attach, to every factual claim, a documentary reference.\u003c/li>\u003c/ol>\n\u003ch2>Conclusion\u003c/h2>\n\u003cp>This approach prevents knowledge generated during brainstorming from disappearing, turning it into \u003cstrong>structured digital assets\u003c/strong> while respecting privacy and compliance boundaries.\u003c/p>", "body_html_ja_jp": "\u003cp>会話を公開可能なコンテンツへ変換することは魅力的な自動化テーマですが、方法論が必要です。抽出、トピック・クラスタリング、ソースの追跡、人間レビューです。この post では、チャットログを処理して概念や PoC を抽出する実証実験を説明します。\u003c/p>\n\u003ch2>背景と動機\u003c/h2>\n\u003cp>技術的な会話には、判断、議論、小さな PoC、そして「小さな学び」が蓄積されますが、多くは文書化されません。embedding は、テキストの類似性を測り、大規模テキストに対する意味検索やクラスタリングを可能にする確立した仕組みです。\u003c/p>\n\u003cp>しかしリスクもあります。ログには個人情報、秘密、識別子が含まれるかもしれません。LGPD は個人データ処理を規制し、適切な安全対策と実務を求めます。\u003c/p>\n\u003ch2>パイプライン: ログから post へ\u003c/h2>\n\u003cp>この PoC は、編集品質、追跡性、プライバシーという三つの並列トラックを持つパイプラインを提案します。\u003c/p>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n  participant U as ユーザー\n  participant I as 取り込み\n  participant R as マスキング / 匿名化\n  participant E as Embedding 索引化\n  participant C as トピック・クラスタリング\n  participant G as Post 生成器\n  participant V as 人間レビュー\n  participant P as 公開\n\n  U->>I: ログをエクスポート (JSON / HTML / text)\n  I->>R: 正規化 + PII / 秘密の除去\n  R->>E: チャンクごとに embedding を生成\n  E->>C: 類似性でグループ化\n  C->>G: 概念 / PoC と構造を抽出\n  G->>V: ソースと前提付きドラフトを渡す\n  V->>P: 承認して公開\u003c/div>\n\u003ch2>実装ステップ\u003c/h2>\n\u003col>\u003cli>\u003cstrong>取り込みと分割\u003c/strong>: チャット export を parse し、メッセージや断片へ分解する。\u003c/li> \u003cli>\u003cstrong>マスキング（Privacy by Design）\u003c/strong>: 索引化前に regex や detector で機微トークンを除去する。\u003c/li> \u003cli>\u003cstrong>Embedding とクラスタリング\u003c/strong>: 断片ごとに embedding を作り、類似性でまとめる。\u003c/li> \u003cli>\u003cstrong>構造化生成\u003c/strong>: 各クラスタから主要概念と議論された trade-off を抽出する。\u003c/li> \u003cli>\u003cstrong>ソース追跡\u003c/strong>: すべての事実主張に、文書的根拠を添える。\u003c/li>\u003c/ol>\n\u003ch2>結論\u003c/h2>\n\u003cp>このアプローチにより、ブレインストーミングで生まれた知識が消えず、\u003cstrong>構造化されたデジタル資産\u003c/strong> として残せます。その際も、プライバシーとコンプライアンスの境界を守れます。\u003c/p>"}, {"id": "post-neuroplasticidade-agentes", "kind": "post", "name": "“Neuroplasticidade” em sistemas de agentes: feedback, memória e melhoria contínua", "headline": "Uma proposta de arquitetura para agentes de IA que aprendem e evoluem através de ciclos de feedback e memória curada.", "summary": "Uma proposta de arquitetura para agentes de IA que aprendem e evoluem através de ciclos de feedback e memória curada.", "status": "production", "stack": ["ia", "agentes", "feedback", "neuroplasticidade"], "url": "/posts/2026-04-03-1000-neuroplasticidade-agentes/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-03-1000-neuroplasticidade-agentes/", "repo_url": "", "has_math": false, "body_html": "\u003cp>Quando alguém pede que um sistema “aprenda com correções repetidas”, o requisito real costuma ser: capturar feedback, transformá-lo em regra operacional e impedir regressões. Este post propõe um desenho de \u003cstrong>neuroplasticidade\u003c/strong> para sistemas de agentes.\u003c/p>\n\u003ch2>O problema da memória em agentes\u003c/h2>\n\u003cp>Na prática, sistemas de agentes falham por três motivos: (1) não lembram decisões anteriores, (2) lembram “qualquer coisa” sem curadoria, ou (3) incorporam feedback sem avaliação e pioram outras tarefas.\u003c/p>\n\u003cp>A abordagem \u003cstrong>ReAct\u003c/strong> descreve um padrão em que o modelo intercala raciocínio e ações, melhorando rastreabilidade e correção ao consultar fontes externas em vez de “inventar” resposta.\u003c/p>\n\u003ch2>Mecanismos de Neuroplasticidade\u003c/h2>\n\u003cp>Aqui, “neuroplasticidade” é uma metáfora útil para três mecanismos concretos:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Memória declarativa curada\u003c/strong>: um repositório versionado de decisões (glossário, preferências de estilo, restrições).\u003c/li> \u003cli>\u003cstrong>Memória episódica com retenção mínima\u003c/strong>: logs de execução e justificativas para depurar e auditar.\u003c/li> \u003cli>\u003cstrong>Ciclo de avaliação e anti-regressão\u003c/strong>: a cada correção relevante, cria-se um teste para garantir que a falha não volte.\u003c/li>\u003c/ol>\n\u003cdiv class=\"mermaid\">flowchart LR\n  A[Saída do agente] --> B[Revisão humana / feedback]\n  B --> C{Classificar feedback}\n  C -->|Correção factual| D[Atualizar base de conhecimento]\n  C -->|Correção de formato| E[Atualizar esquema/regras]\n  C -->|Correção de política| F[Atualizar guardrails]\n  D --> G[Suíte de testes de comportamento]\n  E --> G\n  F --> G\n  G --> H[Deploy de regras/memória]\n  H --> A\u003c/div>\n\u003ch2>Implementação Prática\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Categorias de feedback\u003c/strong>: classifique se a correção é factual, de formato, de segurança ou de escopo.\u003c/li> \u003cli>\u003cstrong>Ciclo de artefatos\u003c/strong>: converta feedback em regras concretas no sistema (ex: novo termo no glossário).\u003c/li> \u003cli>\u003cstrong>Tool calling para ações verificáveis\u003c/strong>: use function calling para realizar tarefas tangíveis e mensuráveis.\u003c/li>\u003c/ol>\n\u003ch2>Conclusão\u003c/h2>\n\u003cp>Implementar &quot;neuroplasticidade&quot; não é deixar a IA livre para aprender qualquer coisa, mas sim criar um \u003cstrong>sistema de governança\u003c/strong> que captura o aprendizado humano e o transforma em diretrizes operacionais robustas para o agente.\u003c/p>", "title_en_us": "'Neuroplasticity' in Agent Systems: Feedback, Memory and Continuous Improvement", "title_ja_jp": "エージェントシステムにおける「神経可塑性」：フィードバック・記憶・継続的改善", "summary_en_us": "An architecture proposal for AI agents that learn and evolve through feedback cycles and curated memory.", "summary_ja_jp": "フィードバック・サイクルとキュレートされた記憶を通じて学習・進化する AI エージェントのアーキテクチャ提案。", "body_html_en_us": "\u003cp>When someone asks a system to &quot;learn from repeated corrections&quot;, the real requirement is usually this: capture feedback, turn it into an operational rule and prevent regressions. This post proposes a \u003cstrong>neuroplasticity\u003c/strong> design for agent systems.\u003c/p>\n\u003ch2>The memory problem in agents\u003c/h2>\n\u003cp>In practice, agent systems fail for three main reasons: (1) they do not remember earlier decisions, (2) they remember everything without curation, or (3) they absorb feedback without evaluation and degrade other tasks.\u003c/p>\n\u003cp>The \u003cstrong>ReAct\u003c/strong> approach describes a pattern in which the model alternates reasoning and action, improving traceability and correctness by consulting external sources instead of inventing answers.\u003c/p>\n\u003ch2>Mechanisms of neuroplasticity\u003c/h2>\n\u003cp>Here, neuroplasticity is a useful metaphor for three concrete mechanisms:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Curated declarative memory\u003c/strong>: a versioned repository of decisions, glossary entries, style preferences and constraints.\u003c/li> \u003cli>\u003cstrong>Episodic memory with minimal retention\u003c/strong>: execution logs and rationales kept for debugging and audit.\u003c/li> \u003cli>\u003cstrong>Evaluation and anti-regression cycle\u003c/strong>: for every meaningful correction, add a test so that the failure does not come back.\u003c/li>\u003c/ol>\n\u003cdiv class=\"mermaid\">flowchart LR\n  A[Agent Output] --> B[Human Review / Feedback]\n  B --> C{Classify Feedback}\n  C -->|Factual Correction| D[Update Knowledge Base]\n  C -->|Format Correction| E[Update Schema / Rules]\n  C -->|Policy Correction| F[Update Guardrails]\n  D --> G[Behavior Test Suite]\n  E --> G\n  F --> G\n  G --> H[Deploy Rules / Memory]\n  H --> A\u003c/div>\n\u003ch2>Practical implementation\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Feedback categories\u003c/strong>: classify whether the correction is factual, formatting-related, security-related or scope-related.\u003c/li> \u003cli>\u003cstrong>Artifact cycle\u003c/strong>: convert feedback into concrete system rules, such as a new glossary term.\u003c/li> \u003cli>\u003cstrong>Tool calling for verifiable actions\u003c/strong>: use function calling so that relevant tasks are tangible and measurable.\u003c/li>\u003c/ol>\n\u003ch2>Conclusion\u003c/h2>\n\u003cp>Implementing neuroplasticity does not mean letting the AI learn anything it wants. It means building a \u003cstrong>governance system\u003c/strong> that captures human learning and turns it into robust operational guidance.\u003c/p>", "body_html_ja_jp": "\u003cp>誰かがシステムに「繰り返しの修正から学んでほしい」と求めるとき、本当の要件はたいていこうです。フィードバックを捕捉し、それを運用ルールへ変換し、回帰を防ぐこと。この post では、エージェント・システムのための \u003cstrong>神経可塑性\u003c/strong> デザインを提案します。\u003c/p>\n\u003ch2>エージェントにおける記憶の問題\u003c/h2>\n\u003cp>実際には、エージェント・システムは主に三つの理由で失敗します。(1) 過去の判断を覚えていない、(2) 取捨選択なく何でも覚えてしまう、(3) 評価なしにフィードバックを取り込み、別タスクの品質を落とす。\u003c/p>\n\u003cp>\u003cstrong>ReAct\u003c/strong> アプローチは、モデルが推論と行動を交互に行うことで、外部情報を参照しながらトレーサビリティと正確性を高めるパターンです。\u003c/p>\n\u003ch2>神経可塑性のメカニズム\u003c/h2>\n\u003cp>ここでいう神経可塑性は、三つの具体的メカニズムを表す便利な比喩です。\u003c/p>\n\u003col>\u003cli>\u003cstrong>キュレーションされた宣言的記憶\u003c/strong>: 判断、用語集、スタイル選好、制約を格納するバージョン管理リポジトリ。\u003c/li> \u003cli>\u003cstrong>最小保持のエピソード記憶\u003c/strong>: デバッグと監査のために残す実行ログと理由説明。\u003c/li> \u003cli>\u003cstrong>評価と回帰防止サイクル\u003c/strong>: 意味のある修正ごとにテストを追加し、同じ失敗を再発させない。\u003c/li>\u003c/ol>\n\u003cdiv class=\"mermaid\">flowchart LR\n  A[エージェント出力] --> B[人間レビュー / フィードバック]\n  B --> C{フィードバックを分類}\n  C -->|事実修正| D[知識ベース更新]\n  C -->|形式修正| E[スキーマ / ルール更新]\n  C -->|ポリシー修正| F[ガードレール更新]\n  D --> G[振る舞いテストスイート]\n  E --> G\n  F --> G\n  G --> H[ルール / 記憶をデプロイ]\n  H --> A\u003c/div>\n\u003ch2>実装の実際\u003c/h2>\n\u003col>\u003cli>\u003cstrong>フィードバック分類\u003c/strong>: 修正が事実、形式、安全性、スコープのどれに属するかを決める。\u003c/li> \u003cli>\u003cstrong>アーティファクト化\u003c/strong>: フィードバックを新しい用語集項目のような具体的ルールへ変換する。\u003c/li> \u003cli>\u003cstrong>検証可能な tool calling\u003c/strong>: 重要な作業を measurable にするため function calling を使う。\u003c/li>\u003c/ol>\n\u003ch2>結論\u003c/h2>\n\u003cp>神経可塑性を実装するとは、AI に好き勝手学ばせることではありません。人間の学びを取り込み、それを堅牢な運用指針へ変換する \u003cstrong>ガバナンス・システム\u003c/strong> を作ることです。\u003c/p>"}, {"id": "post-orquestrador-agentes-ddd", "kind": "post", "name": "Orquestrador de agentes com DDD: traduzindo linguagem natural em Linguagem Ubíqua", "headline": "Documento técnico sobre como converter linguagem natural em artefatos de DDD usando orquestração de múltiplos agentes de IA.", "summary": "Documento técnico sobre como converter linguagem natural em artefatos de DDD usando orquestração de múltiplos agentes de IA.", "status": "production", "stack": ["ddd", "arquitetura", "agentes-ia", "inteligência-artificial"], "url": "/posts/2026-04-03-0900-orquestrador-agentes-ddd/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-03-0900-orquestrador-agentes-ddd/", "repo_url": "", "has_math": false, "body_html": "\u003cp>Traduzir requisitos em “texto livre” para uma \u003cstrong>Linguagem Ubíqua\u003c/strong> consistente é um dos gargalos mais caros em produtos com domínio complexo. Este post descreve uma arquitetura de orquestração de agentes que converte linguagem natural em artefatos de DDD (glossário, comandos/eventos, invariantes e limites de contexto) e distribui tarefas para agentes especializados.\u003c/p>\n\u003ch2>Contexto e motivação\u003c/h2>\n\u003cp>Documentação, código e conversas frequentemente usam termos diferentes para o mesmo conceito (“cliente”, “comprador”, “titular”, “account”), criando ambiguidade e bugs semânticos. Em DDD, a Linguagem Ubíqua é justamente a prática de construir um idioma comum e rigoroso entre pessoas de negócio e desenvolvedores, baseado no modelo de domínio.\u003c/p>\n\u003cp>Além disso, DDD trata problemas por domínios e delimita áreas independentes como \u003cem>Bounded Contexts\u003c/em> — muitas vezes alinháveis a serviços/microserviços na prática de arquitetura moderna.\u003c/p>\n\u003ch2>A Arquitetura do Orquestrador\u003c/h2>\n\u003cp>A ideia é um \u003cstrong>orquestrador\u003c/strong> que recebe uma solicitação em linguagem natural e produz dois resultados acoplados:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Artefatos de linguagem e domínio\u003c/strong>: glossário do contexto, sinônimos proibidos, definições canônicas, comandos/eventos e regras/invariantes.\u003c/li> \u003cli>\u003cstrong>Plano de execução multiagente\u003c/strong>: tarefas para agentes especializados (modelagem, API, persistência, testes, segurança), com retorno estruturado e rastreável.\u003c/li>\u003c/ol>\n\u003cdiv class=\"mermaid\">flowchart TD\n  A[Entrada em linguagem natural] --> B[Detecção de intenção e contexto]\n  B --> C[Tradutor DDD: Linguagem Ubíqua]\n  C --> D{Roteador de tarefas}\n  D --> E[Agente: Modelagem de domínio]\n  D --> F[Agente: Implementação/API]\n  D --> G[Agente: Testes e invariantes]\n  D --> H[Agente: Segurança e privacidade]\n  E --> I[Memória de feedback e decisões]\n  F --> I\n  G --> I\n  H --> I\n  I --> C\u003c/div>\n\u003ch2>Passos de implementação\u003c/h2>\n\u003cp>A forma mais robusta de manter rastreabilidade é exigir \u003cstrong>saídas estruturadas\u003c/strong>. Em APIs modernas de LLMs, isso costuma ser feito com JSON Schema.\u003c/p>\n\u003cp>1) \u003cstrong>Defina o contrato do “Tradutor DDD”\u003c/strong> (JSON Schema). Ele deve retornar: \u003ccode>boundedContext\u003c/code>, \u003ccode>glossario\u003c/code>, \u003ccode>entidades\u003c/code>, \u003ccode>comandos\u003c/code>, \u003ccode>eventos\u003c/code>, \u003ccode>regras\u003c/code> e \u003ccode>termosProibidos\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;type&quot;: &quot;object&quot;,\n  &quot;required&quot;: [&quot;boundedContext&quot;, &quot;glossario&quot;, &quot;eventos&quot;, &quot;regras&quot;],\n  &quot;properties&quot;: {\n    &quot;boundedContext&quot;: { &quot;type&quot;: &quot;string&quot; },\n    &quot;glossario&quot;: {\n      &quot;type&quot;: &quot;array&quot;,\n      &quot;items&quot;: { &quot;type&quot;: &quot;object&quot;, &quot;required&quot;: [&quot;termo&quot;, &quot;definicao&quot;], &quot;properties&quot;: { ... } }\n    },\n    ...\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>2) \u003cstrong>Roteie para agentes especializados\u003c/strong>: cada agente consome a Linguagem Ubíqua e retorna uma entrega.\u003c/p>\n\u003cp>3) \u003cstrong>Imponha consistência na modelagem\u003c/strong>: entidades e agregados devem preservar invariantes e expor métodos expressivos na linguagem do domínio.\u003c/p>\n\u003ch2>O Ciclo de Vida de um Contexto Delimitado\u003c/h2>\n\u003cp>Em sistemas multiagente, o \u003cstrong>Bounded Context\u003c/strong> não é apenas uma divisória lógica no código; é o ambiente de execução de um subagente especializado. O ciclo de vida desse contexto segue três fases críticas:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Descoberta e Isolamento\u003c/strong>: O orquestrador identifica quais domínios são afetados por uma mudança e isola as ferramentas e o histórico necessários para o agente desse domínio.\u003c/li> \u003cli>\u003cstrong>Sincronização Semântica\u003c/strong>: Antes de qualquer escrita, o agente deve validar se o termo que planeja usar (ex: \u003ccode>OrderAmount\u003c/code>) já existe no glossário ou se conflita com um termo de outro contexto (ex: \u003ccode>TransactionTotal\u003c/code> em Financeiro).\u003c/li> \u003cli>\u003cstrong>Consolidação de Invariantes\u003c/strong>: O agente de domínio garante que as regras de negócio em nível de aplicação (ex: &quot;um pedido não pode ter valor negativo&quot;) sejam respeitadas em cada comando gerado.\u003c/li>\u003c/ol>\n\u003ch2>Resolução de Conflitos e Linguagem Ubíqua\u003c/h2>\n\u003cp>Quando dois agentes propõem nomes diferentes para o mesmo conceito, o Orquestrador atua como um \u003cstrong>Mediador de Domínio\u003c/strong>. Ele utiliza uma base de conhecimento centralizada (Memória Curada) para forçar a convergência.\u003c/p>\n\u003cul>\u003cli>  \u003cstrong>Exemplo\u003c/strong>: Se o agente de API propõe \u003ccode>userId\u003c/code> e o agente de Domínio propõe \u003ccode>CustomerIdentifier\u003c/code>, o Orquestrador consulta o glossário canônico do projeto e impõe o termo definido na Linguagem Ubíqua acordada com o humano.\u003c/li>\u003c/ul>\n\u003ch2>Conclusão\u003c/h2>\n\u003cp>Essa arquitetura não apenas automatiza a tradução de requisitos, mas garante que a \u003cstrong>Linguagem Ubíqua\u003c/strong> seja o fio condutor de toda a engenharia, reduzindo drasticamente o retrabalho e as falhas de comunicação entre humanos e máquinas.\u003c/p>", "title_en_us": "DDD Agent Orchestrator: Translating Natural Language into Ubiquitous Language", "title_ja_jp": "DDD エージェント・オーケストレーター：自然言語をユビキタス言語へ", "summary_en_us": "Technical note on converting natural language into DDD artifacts via multi-agent AI orchestration.", "summary_ja_jp": "複数の AI エージェントのオーケストレーションを用いて、自然言語を DDD のアーティファクトに変換する技術ノート。", "body_html_en_us": "\u003cp>Translating free-form requirements into a consistent \u003cstrong>ubiquitous language\u003c/strong> is one of the most expensive bottlenecks in products with complex domains. This post describes an agent-orchestration architecture that converts natural language into DDD artifacts such as a glossary, commands, events, invariants and bounded contexts.\u003c/p>\n\u003ch2>Context and motivation\u003c/h2>\n\u003cp>Documentation, code and conversation often use different words for the same concept, such as &quot;customer&quot;, &quot;buyer&quot;, &quot;holder&quot; or &quot;account&quot;. That creates ambiguity and semantic bugs. In DDD, ubiquitous language is the discipline of building a shared and rigorous vocabulary between business people and engineers, grounded in the domain model.\u003c/p>\n\u003cp>DDD also decomposes problems by domain and delimits independent areas as \u003cem>Bounded Contexts\u003c/em>, which in practice often align well with services or microservices.\u003c/p>\n\u003ch2>The orchestrator architecture\u003c/h2>\n\u003cp>The idea is an \u003cstrong>orchestrator\u003c/strong> that receives a request in natural language and produces two coupled results:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Language and domain artifacts\u003c/strong>: context glossary, forbidden synonyms, canonical definitions, commands, events and invariants.\u003c/li> \u003cli>\u003cstrong>Multi-agent execution plan\u003c/strong>: tasks for specialized agents in modeling, API, persistence, testing and security, all with structured and traceable output.\u003c/li>\u003c/ol>\n\u003cdiv class=\"mermaid\">flowchart TD\n  A[Natural-Language Input] --> B[Intent and Context Detection]\n  B --> C[DDD Translator: Ubiquitous Language]\n  C --> D{Task Router}\n  D --> E[Agent: Domain Modeling]\n  D --> F[Agent: Implementation / API]\n  D --> G[Agent: Tests and Invariants]\n  D --> H[Agent: Security and Privacy]\n  E --> I[Feedback and Decision Memory]\n  F --> I\n  G --> I\n  H --> I\n  I --> C\u003c/div>\n\u003ch2>Implementation steps\u003c/h2>\n\u003cp>The most robust way to keep traceability is to require \u003cstrong>structured outputs\u003c/strong>. In modern LLM APIs, this is usually done with JSON Schema.\u003c/p>\n\u003cp>1) \u003cstrong>Define the contract of the DDD Translator\u003c/strong>. It should return \u003ccode>boundedContext\u003c/code>, \u003ccode>glossario\u003c/code>, \u003ccode>entidades\u003c/code>, \u003ccode>comandos\u003c/code>, \u003ccode>eventos\u003c/code>, \u003ccode>regras\u003c/code> and \u003ccode>termosProibidos\u003c/code>.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;type&quot;: &quot;object&quot;,\n  &quot;required&quot;: [&quot;boundedContext&quot;, &quot;glossario&quot;, &quot;eventos&quot;, &quot;regras&quot;],\n  &quot;properties&quot;: {\n    &quot;boundedContext&quot;: { &quot;type&quot;: &quot;string&quot; },\n    &quot;glossario&quot;: {\n      &quot;type&quot;: &quot;array&quot;,\n      &quot;items&quot;: { &quot;type&quot;: &quot;object&quot;, &quot;required&quot;: [&quot;termo&quot;, &quot;definicao&quot;], &quot;properties&quot;: { ... } }\n    },\n    ...\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>2) \u003cstrong>Route to specialized agents\u003c/strong>: each agent consumes the ubiquitous language and returns a focused deliverable.\u003c/p>\n\u003cp>3) \u003cstrong>Enforce modeling consistency\u003c/strong>: entities and aggregates must preserve invariants and expose methods in the domain language.\u003c/p>\n\u003ch2>Lifecycle of a bounded context\u003c/h2>\n\u003cp>In multi-agent systems, a bounded context is not just a logical division in code; it is the execution environment of a specialized subagent. Its lifecycle follows three critical phases:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Discovery and isolation\u003c/strong>: the orchestrator identifies which domains are affected and isolates the tools and history needed by the corresponding agent.\u003c/li> \u003cli>\u003cstrong>Semantic synchronization\u003c/strong>: before writing anything, the agent checks whether the planned term already exists in the glossary or conflicts with a term from another context.\u003c/li> \u003cli>\u003cstrong>Invariant consolidation\u003c/strong>: the domain agent ensures that application-level business rules, such as &quot;an order cannot have a negative value&quot;, are respected in every generated command.\u003c/li>\u003c/ol>\n\u003ch2>Conflict resolution and ubiquitous language\u003c/h2>\n\u003cp>When two agents propose different names for the same concept, the orchestrator acts as a \u003cstrong>domain mediator\u003c/strong>. It uses a curated shared memory to force convergence.\u003c/p>\n\u003cul>\u003cli>  \u003cstrong>Example\u003c/strong>: if the API agent proposes \u003ccode>userId\u003c/code> and the domain agent proposes \u003ccode>CustomerIdentifier\u003c/code>, the orchestrator consults the canonical glossary and enforces the term defined with the human stakeholders.\u003c/li>\u003c/ul>\n\u003ch2>Conclusion\u003c/h2>\n\u003cp>This architecture does not merely automate requirement translation. It ensures that \u003cstrong>ubiquitous language\u003c/strong> becomes the thread connecting all engineering work, drastically reducing rework and semantic misalignment between humans and machines.\u003c/p>", "body_html_ja_jp": "\u003cp>自由文で書かれた要件を、一貫した \u003cstrong>ユビキタス言語\u003c/strong> へ変換することは、複雑ドメインを持つ製品における最も高価なボトルネックの一つです。この post では、自然言語を、用語集、コマンド、イベント、不変条件、境界づけられたコンテキストといった DDD アーティファクトへ変換するエージェント・オーケストレーションを説明します。\u003c/p>\n\u003ch2>背景と動機\u003c/h2>\n\u003cp>ドキュメント、コード、会話は、しばしば同じ概念に対して異なる言葉、たとえば「顧客」「購入者」「契約者」「account」を使います。そこから曖昧さと意味的バグが生まれます。DDD におけるユビキタス言語とは、ビジネス側と開発側がドメインモデルに基づいて共有する、厳密な語彙を築く実践です。\u003c/p>\n\u003cp>DDD はまた、問題をドメインごとに分解し、独立領域を \u003cem>Bounded Context\u003c/em> として区切ります。これは実務上、サービスやマイクロサービスの境界とよく整合します。\u003c/p>\n\u003ch2>オーケストレーターのアーキテクチャ\u003c/h2>\n\u003cp>ここで考える \u003cstrong>オーケストレーター\u003c/strong> は、自然言語の要求を受け取り、二つの結びついた成果を返します。\u003c/p>\n\u003col>\u003cli>\u003cstrong>言語・ドメイン成果物\u003c/strong>: コンテキストの用語集、禁止同義語、正規定義、コマンド、イベント、不変条件。\u003c/li> \u003cli>\u003cstrong>マルチエージェント実行計画\u003c/strong>: モデリング、API、永続化、テスト、セキュリティ担当エージェントへのタスク。出力は構造化され、追跡可能であること。\u003c/li>\u003c/ol>\n\u003cdiv class=\"mermaid\">flowchart TD\n  A[自然言語入力] --> B[意図と文脈の検出]\n  B --> C[DDD 翻訳器: ユビキタス言語]\n  C --> D{タスク・ルーター}\n  D --> E[エージェント: ドメインモデリング]\n  D --> F[エージェント: 実装 / API]\n  D --> G[エージェント: テストと不変条件]\n  D --> H[エージェント: セキュリティとプライバシー]\n  E --> I[フィードバックと意思決定メモリ]\n  F --> I\n  G --> I\n  H --> I\n  I --> C\u003c/div>\n\u003ch2>実装ステップ\u003c/h2>\n\u003cp>トレーサビリティを保つ最も堅牢な方法は、\u003cstrong>構造化出力\u003c/strong> を必須にすることです。現代の LLM API では、通常 JSON Schema を使います。\u003c/p>\n\u003cp>1) \u003cstrong>DDD 翻訳器の契約を定義する\u003c/strong>。返すべきは \u003ccode>boundedContext\u003c/code>, \u003ccode>glossario\u003c/code>, \u003ccode>entidades\u003c/code>, \u003ccode>comandos\u003c/code>, \u003ccode>eventos\u003c/code>, \u003ccode>regras\u003c/code>, \u003ccode>termosProibidos\u003c/code> です。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;type&quot;: &quot;object&quot;,\n  &quot;required&quot;: [&quot;boundedContext&quot;, &quot;glossario&quot;, &quot;eventos&quot;, &quot;regras&quot;],\n  &quot;properties&quot;: {\n    &quot;boundedContext&quot;: { &quot;type&quot;: &quot;string&quot; },\n    &quot;glossario&quot;: {\n      &quot;type&quot;: &quot;array&quot;,\n      &quot;items&quot;: { &quot;type&quot;: &quot;object&quot;, &quot;required&quot;: [&quot;termo&quot;, &quot;definicao&quot;], &quot;properties&quot;: { ... } }\n    },\n    ...\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>2) \u003cstrong>専門エージェントへルーティングする\u003c/strong>: 各エージェントはユビキタス言語を入力にして、焦点の合った成果物を返す。\u003c/p>\n\u003cp>3) \u003cstrong>モデリングの一貫性を強制する\u003c/strong>: entity や aggregate は不変条件を守り、ドメイン言語で意味のあるメソッドを公開しなければならない。\u003c/p>\n\u003ch2>Bound Context のライフサイクル\u003c/h2>\n\u003cp>マルチエージェント・システムでは、Bounded Context はコード上の論理区分ではなく、専門 subagent の実行環境でもあります。そのライフサイクルは三つの重要フェーズを持ちます。\u003c/p>\n\u003col>\u003cli>\u003cstrong>発見と隔離\u003c/strong>: オーケストレーターが影響するドメインを特定し、そのエージェントに必要なツールと履歴だけを切り出す。\u003c/li> \u003cli>\u003cstrong>意味同期\u003c/strong>: 何かを書き始める前に、使おうとする用語が既存の用語集にあるか、別コンテキストの用語と衝突しないかを確認する。\u003c/li> \u003cli>\u003cstrong>不変条件の統合\u003c/strong>: ドメイン・エージェントが、「注文金額は負になれない」のような業務ルールを、生成される各コマンドで保証する。\u003c/li>\u003c/ol>\n\u003ch2>競合解決とユビキタス言語\u003c/h2>\n\u003cp>二つのエージェントが同じ概念に別名を提案した場合、オーケストレーターは \u003cstrong>ドメイン・メディエーター\u003c/strong> として振る舞います。キュレーションされた共有メモリを使って語彙を収束させます。\u003c/p>\n\u003cul>\u003cli>  \u003cstrong>例\u003c/strong>: API エージェントが \u003ccode>userId\u003c/code> を提案し、ドメイン・エージェントが \u003ccode>CustomerIdentifier\u003c/code> を提案した場合、オーケストレーターは正規用語集を参照し、人間と合意した語を強制します。\u003c/li>\u003c/ul>\n\u003ch2>結論\u003c/h2>\n\u003cp>このアーキテクチャは、要件翻訳を自動化するだけではありません。\u003cstrong>ユビキタス言語\u003c/strong> を全エンジニアリングの導線にし、人間と機械の間に生まれる再作業と意味のずれを大きく減らします。\u003c/p>"}, {"id": "post-ddd-boundaries-for-agent-systems", "kind": "post", "name": "Limites de DDD para sistemas com agentes", "headline": "Notas práticas sobre como separar domínio, execução de tools e políticas de coordenação em sistemas com agentes.", "summary": "Notas práticas sobre como separar domínio, execução de tools e políticas de coordenação em sistemas com agentes.", "status": "production", "stack": ["dotnet", "ddd", "ai"], "url": "/posts/20260402-203000-ddd-boundaries-for-agent-systems/", "resolved_url": "https://nhmatsumoto.github.io/posts/20260402-203000-ddd-boundaries-for-agent-systems/", "repo_url": "https://github.com/nhmatsumoto/ronaldinho-agent", "has_math": false, "body_html": "\u003ch1>Separando domínio de orquestração em sistemas com agentes\u003c/h1>\n\u003cp>Quando um projeto começa a misturar prompt, decisão de negócio, execução de tool e persistência no mesmo fluxo, a velocidade inicial costuma enganar. O custo aparece depois: pouca previsibilidade, testes frágeis e dificuldade para mudar o comportamento do sistema sem quebrar tudo.\u003c/p>\n\u003ch2>Uma fronteira útil\u003c/h2>\n\u003cp>Eu tenho tratado esses sistemas em três camadas explícitas:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>domínio\u003c/strong>: regras, linguagem ubíqua, contratos e estado significativo;\u003c/li> \u003cli>\u003cstrong>orquestração\u003c/strong>: composição de passos, seleção de tools e roteamento;\u003c/li> \u003cli>\u003cstrong>infraestrutura\u003c/strong>: modelos, filas, banco, storage e conectores externos.\u003c/li>\u003c/ul>\n\u003ch2>O que muda na prática\u003c/h2>\n\u003cp>Separar essas fronteiras ajuda em três pontos:\u003c/p>\n\u003col>\u003cli>O domínio volta a ser testável sem depender de modelo.\u003c/li> \u003cli>A camada de orquestração pode evoluir sem reescrever regras.\u003c/li> \u003cli>O runtime deixa de ser o lugar onde decisões de negócio ficam escondidas.\u003c/li>\u003c/ol>\n\u003ch2>Heurística simples\u003c/h2>\n\u003cp>Se uma decisão precisa sobreviver à troca de provider, ela provavelmente pertence ao domínio ou à política de aplicação, não ao prompt.\u003c/p>\n\u003ch2>O que estou documentando agora\u003c/h2>\n\u003cp>Esse raciocínio está guiando a estrutura do Ronaldinho Agent e também a forma como passei a organizar este blog: menos páginas isoladas, mais documentação conectada.\u003c/p>", "title_en_us": "DDD Boundaries for Agent Systems", "title_ja_jp": "エージェントシステムのための DDD 境界", "summary_en_us": "Practical notes on separating domain, tool execution and coordination policies in agent-based systems.", "summary_ja_jp": "エージェントベースのシステムにおいて、ドメイン、ツール実行、調整ポリシーを分離する実践的なノート。", "body_html_en_us": "\u003ch1>Separating domain from orchestration in agent systems\u003c/h1>\n\u003cp>When a project starts mixing prompts, business decisions, tool execution and persistence inside the same flow, the initial speed is deceptive. The cost appears later: poor predictability, fragile tests and difficulty changing behavior without breaking everything.\u003c/p>\n\u003ch2>A useful boundary\u003c/h2>\n\u003cp>I have been treating these systems as three explicit layers:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>domain\u003c/strong>: rules, ubiquitous language, contracts and meaningful state;\u003c/li> \u003cli>\u003cstrong>orchestration\u003c/strong>: composition of steps, tool selection and routing;\u003c/li> \u003cli>\u003cstrong>infrastructure\u003c/strong>: models, queues, databases, storage and external connectors.\u003c/li>\u003c/ul>\n\u003ch2>What changes in practice\u003c/h2>\n\u003cp>Separating those boundaries helps in three ways:\u003c/p>\n\u003col>\u003cli>The domain becomes testable again without depending on a model.\u003c/li> \u003cli>The orchestration layer can evolve without rewriting rules.\u003c/li> \u003cli>The runtime stops being the place where business decisions are hidden.\u003c/li>\u003c/ol>\n\u003ch2>A simple heuristic\u003c/h2>\n\u003cp>If a decision must survive a provider swap, it probably belongs to the domain or application policy, not to the prompt.\u003c/p>\n\u003ch2>What I am documenting now\u003c/h2>\n\u003cp>This reasoning is shaping the structure of Ronaldinho Agent and also the way I now organize this blog: fewer isolated pages, more connected documentation.\u003c/p>", "body_html_ja_jp": "\u003ch1>エージェントシステムでドメインとオーケストレーションを分離する\u003c/h1>\n\u003cp>プロジェクトが、プロンプト、ビジネス判断、ツール実行、永続化を同じフローに混ぜ始めると、初期速度は魅力的に見えます。しかしコストは後で現れます。予測可能性の低下、壊れやすいテスト、そして挙動を変えるたびに全体を壊しやすくなることです。\u003c/p>\n\u003ch2>有効な境界\u003c/h2>\n\u003cp>私はこの種のシステムを、明示的な 3 層として扱っています。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>domain\u003c/strong>: ルール、ユビキタス言語、契約、意味のある状態\u003c/li> \u003cli>\u003cstrong>orchestration\u003c/strong>: ステップの構成、ツール選択、ルーティング\u003c/li> \u003cli>\u003cstrong>infrastructure\u003c/strong>: モデル、キュー、データベース、ストレージ、外部コネクタ\u003c/li>\u003c/ul>\n\u003ch2>実際に何が変わるか\u003c/h2>\n\u003cp>この境界を分けると、主に 3 つの利点があります。\u003c/p>\n\u003col>\u003cli>モデルに依存せずドメインを再びテストできる。\u003c/li> \u003cli>ルールを書き換えずにオーケストレーション層を進化させられる。\u003c/li> \u003cli>ランタイムがビジネス判断を隠す場所でなくなる。\u003c/li>\u003c/ol>\n\u003ch2>シンプルなヒューリスティック\u003c/h2>\n\u003cp>ある判断が provider を差し替えても生き残る必要があるなら、それはおそらく prompt ではなく、domain か application policy に属します。\u003c/p>\n\u003ch2>今まさに文書化していること\u003c/h2>\n\u003cp>この考え方は Ronaldinho Agent の構造を導いており、同時にこのブログの整理方法も変えています。孤立したページを減らし、接続されたドキュメンテーションを増やす方向です。\u003c/p>"}, {"id": "post-gis-pipelines-with-event-driven-services", "kind": "post", "name": "Pipelines GIS com serviços orientados a eventos", "headline": "Como tratar ingestão geoespacial, processamento assíncrono e leitura operacional sem transformar o backend em um monólito acidental.", "summary": "Como tratar ingestão geoespacial, processamento assíncrono e leitura operacional sem transformar o backend em um monólito acidental.", "status": "production", "stack": ["gis", "dotnet", "architecture"], "url": "/posts/20260401-184500-gis-pipelines-with-event-driven-services/", "resolved_url": "https://nhmatsumoto.github.io/posts/20260401-184500-gis-pipelines-with-event-driven-services/", "repo_url": "", "has_math": false, "body_html": "\u003ch1>GIS não precisa virar um sistema opaco\u003c/h1>\n\u003cp>Sistemas geoespaciais costumam acumular parsing, transformação, regras de negócio, projeção de coordenadas e relatórios operacionais em um mesmo serviço. Isso funciona por pouco tempo.\u003c/p>\n\u003ch2>Pipeline melhor que endpoint gigante\u003c/h2>\n\u003cp>Uma abordagem mais sustentável é separar o fluxo em etapas:\u003c/p>\n\u003cul>\u003cli>ingestão de dados;\u003c/li> \u003cli>normalização e validação;\u003c/li> \u003cli>enriquecimento e geocoding;\u003c/li> \u003cli>projeção para leitura operacional;\u003c/li> \u003cli>entrega para dashboard, API ou alerta.\u003c/li>\u003c/ul>\n\u003ch2>Por que isso importa\u003c/h2>\n\u003cp>Com esse desenho, cada etapa tem semântica própria e falhas mais legíveis. O dashboard não precisa entender o processamento bruto, e a camada de leitura pode responder rápido mesmo quando a ingestão está pesada.\u003c/p>\n\u003ch2>O que eu procuro preservar\u003c/h2>\n\u003cul>\u003cli>rastreabilidade do dado;\u003c/li> \u003cli>contratos estáveis para consumo;\u003c/li> \u003cli>clareza entre cálculo espacial e regra de negócio.\u003c/li>\u003c/ul>\n\u003cp>Essa mesma lógica de separar escrita, leitura e decisão acaba aparecendo em quase todos os sistemas que escalam bem.\u003c/p>", "title_en_us": "GIS Pipelines with Event-Driven Services", "title_ja_jp": "イベント駆動サービスによる GIS パイプライン", "summary_en_us": "How to handle geospatial ingestion, async processing and operational reads without turning the backend into an accidental monolith.", "summary_ja_jp": "地理空間データの取り込み、非同期処理、運用向け読み取りを、バックエンドを偶発的なモノリスにせずに扱う方法。", "body_html_en_us": "\u003ch1>GIS does not have to become an opaque system\u003c/h1>\n\u003cp>Geospatial systems tend to accumulate parsing, transformation, business rules, coordinate projection and operational reporting inside the same service. That works for a while.\u003c/p>\n\u003ch2>A pipeline is better than a giant endpoint\u003c/h2>\n\u003cp>A more sustainable approach is to split the flow into stages:\u003c/p>\n\u003cul>\u003cli>data ingestion;\u003c/li> \u003cli>normalization and validation;\u003c/li> \u003cli>enrichment and geocoding;\u003c/li> \u003cli>projection for operational reads;\u003c/li> \u003cli>delivery to dashboards, APIs or alerts.\u003c/li>\u003c/ul>\n\u003ch2>Why this matters\u003c/h2>\n\u003cp>With this design, each stage has its own semantics and failures are easier to read. The dashboa

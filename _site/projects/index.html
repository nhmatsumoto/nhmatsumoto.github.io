    <script id="projects-data" type="application/json">[{"id": "post-ronaldinho-agent-persona-tooling", "kind": "post", "name": "Ronaldinho Agent: persona, memória curta e tool use sem virar produto separado", "headline": "Registro do ronaldinho-agent como experimento de engenharia de agentes: o que foi validado, quais trade-offs apareceram e por que ele faz mais sentido como publicação do que como rota principal do site.", "summary": "Registro do ronaldinho-agent como experimento de engenharia de agentes: o que foi validado, quais trade-offs apareceram e por que ele faz mais sentido como publicação do que como rota principal do site.", "status": "production", "stack": ["agents", "python", "prompt-engineering", "architecture"], "url": "/posts/20260406-093000-ronaldinho-agent-persona-tooling/", "resolved_url": "https://nhmatsumoto.github.io/posts/20260406-093000-ronaldinho-agent-persona-tooling/", "repo_url": "https://github.com/nhmatsumoto/ronaldinho-agent", "has_math": false, "body_html": "\u003ch1>Por que o Ronaldinho Agent saiu da área de projetos\u003c/h1>\n\u003cp>O \u003ccode>ronaldinho-agent\u003c/code> nasceu como experimento para testar três perguntas ao mesmo tempo:\u003c/p>\n\u003col>\u003cli>o quanto uma persona muda a percepção de utilidade de um agente;\u003c/li> \u003cli>como manter memória curta sem complicar demais a arquitetura;\u003c/li> \u003cli>onde termina a camada de orquestração e começa o domínio real do sistema.\u003c/li>\u003c/ol>\n\u003cp>Com o tempo, ficou claro que o valor principal do projeto não estava em tratá-lo como um produto em destaque, e sim em usá-lo como laboratório para decisões de engenharia. Por isso ele passa a viver aqui como publicação conectada ao restante do site.\u003c/p>\n\u003ch2>O que o experimento validou\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Persona como restrição de interface\u003c/strong>: usar personalidade no system prompt alterou a experiência, mas só funcionou bem quando a arquitetura continuou técnica por baixo.\u003c/li> \u003cli>\u003cstrong>Memória curta suficiente para sessões objetivas\u003c/strong>: histórico de conversa resolveu bem interações pequenas, especialmente quando combinado com respostas mais determinísticas.\u003c/li> \u003cli>\u003cstrong>Tool use com dispatcher explícito\u003c/strong>: a fronteira entre raciocínio e execução ficou mais legível quando as chamadas externas foram tratadas como contratos.\u003c/li>\u003c/ul>\n\u003ch2>Onde ele se encaixa hoje\u003c/h2>\n\u003cp>Hoje o projeto faz mais sentido como material de referência para:\u003c/p>\n\u003cul>\u003cli>posts sobre boundaries em sistemas com agentes;\u003c/li> \u003cli>documentos de arquitetura ligados a runtime, tools e modularidade;\u003c/li> \u003cli>decisões sobre como este próprio site organiza conhecimento técnico.\u003c/li>\u003c/ul>\n\u003cp>O documento \u003ca href=\"/documents/ronaldinho-architecture-overview/\">Ronaldinho Architecture Overview\u003c/a> continua disponível como nota complementar, mas a rota dedicada do projeto deixa de existir para reduzir ruído na arquitetura de informação.\u003c/p>\n\u003ch2>Decisão editorial\u003c/h2>\n\u003cp>Quando algo funciona mais como estudo de caso do que como ativo principal de portfolio, a melhor estrutura é transformá-lo em publicação. Isso preserva contexto, melhora navegação e evita competir com projetos que hoje representam melhor minha direção atual.\u003c/p>", "title_en_us": "Ronaldinho Agent: persona, short-term memory and tool use without turning it into a separate product", "title_ja_jp": "Ronaldinho Agent: 独立した製品にせず、persona と短期記憶と tool use を試す", "summary_en_us": "A field note on `ronaldinho-agent` as an agent-engineering experiment: what it validated, which trade-offs appeared and why it now fits better as a publication than as a primary site route.", "summary_ja_jp": "エージェント工学の実験としての `ronaldinho-agent` を記録したノート。検証できたこと、現れたトレードオフ、そしてなぜ独立ルートより公開記事として扱うほうが自然なのかをまとめる。"}, {"id": "post-sos-location-ml-risk-neural-models", "kind": "post", "name": "SOS Location: Modelos neurais de risco com PyTorch e segmentação semântica", "headline": "O SOSLocation.ML usa PyTorch para predição de risco em zonas de desastre. Como treinamos modelos de segmentação semântica para identificar áreas críticas em imagens de satélite e dados GIS.", "summary": "O SOSLocation.ML usa PyTorch para predição de risco em zonas de desastre. Como treinamos modelos de segmentação semântica para identificar áreas críticas em imagens de satélite e dados GIS.", "status": "production", "stack": ["ml", "pytorch", "python", "gis", "risk-analysis"], "url": "/posts/2026-04-05-1500-sos-location-ml-risk-neural-models/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-05-1500-sos-location-ml-risk-neural-models/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003ch1>Modelos neurais de risco: o SOSLocation.ML\u003c/h1>\n\u003cp>Em Março de 2026, o commit \u003ccode>feat(ml+tests): SOSLocation.ML .NET project + 40 unit/integration tests\u003c/code> formalizou o que já estava sendo construído: uma unidade de ML dedicada ao SOS Location. O objetivo é simples mas ambicioso — \u003cstrong>prever quais áreas serão afetadas\u003c/strong> antes que a crise se torne incontrolável.\u003c/p>\n\u003ch2>Arquitetura do ML Unit\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>risk-analysis-unit/\n  api/            FastAPI — serve o modelo via REST e streaming gRPC\n  models/         Definições PyTorch dos modelos\n  training/       Scripts de treino + MLflow tracking\n  data/           Pipelines de ingestão (GIS, clima, histórico)\n  tests/          40 testes unitários e de integração\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>O ML Unit é um microsserviço Python independente que o backend .NET consulta via HTTP/gRPC quando um incidente crítico (severidade &gt;= 7) é criado.\u003c/p>\n\u003ch2>Modelo de segmentação semântica\u003c/h2>\n\u003cp>O problema de identificar zonas de risco em imagens de satélite é um problema de \u003cstrong>segmentação semântica\u003c/strong> — classificar cada pixel como &quot;risco alto&quot;, &quot;risco médio&quot;, &quot;seguro&quot;, &quot;água&quot;, etc.\u003c/p>\n\u003cp>A arquitetura escolhida é uma U-Net modificada, clássica em problemas de segmentação de imagens médicas e geoespaciais:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass UNetBlock(nn.Module):\n    def __init__(self, in_ch: int, out_ch: int):\n        super().__init__()\n        self.conv = nn.Sequential(\n            nn.Conv2d(in_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.ReLU(inplace=True),\n            nn.Conv2d(out_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.ReLU(inplace=True),\n        )\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        return self.conv(x)\n\n\nclass SOSRiskSegmenter(nn.Module):\n    &quot;&quot;&quot;U-Net para segmentação de risco em imagens multiespectral + DEM.&quot;&quot;&quot;\n\n    RISK_CLASSES = [&#x27;safe&#x27;, &#x27;low_risk&#x27;, &#x27;medium_risk&#x27;, &#x27;high_risk&#x27;, &#x27;critical&#x27;, &#x27;water&#x27;]\n\n    def __init__(self, in_channels: int = 6, num_classes: int = 6):\n        # in_channels: RGB (3) + DEM (1) + NDVI (1) + moisture index (1)\n        super().__init__()\n        # Encoder\n        self.enc1 = UNetBlock(in_channels, 64)\n        self.enc2 = UNetBlock(64, 128)\n        self.enc3 = UNetBlock(128, 256)\n        self.enc4 = UNetBlock(256, 512)\n        # Bottleneck\n        self.bottleneck = UNetBlock(512, 1024)\n        # Decoder\n        self.up4 = nn.ConvTranspose2d(1024, 512, 2, stride=2)\n        self.dec4 = UNetBlock(1024, 512)\n        self.up3 = nn.ConvTranspose2d(512, 256, 2, stride=2)\n        self.dec3 = UNetBlock(512, 256)\n        self.up2 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec2 = UNetBlock(256, 128)\n        self.up1 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec1 = UNetBlock(128, 64)\n        # Output\n        self.out = nn.Conv2d(64, num_classes, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n        b  = self.bottleneck(self.pool(e4))\n        d4 = self.dec4(torch.cat([self.up4(b),  e4], dim=1))\n        d3 = self.dec3(torch.cat([self.up3(d4), e3], dim=1))\n        d2 = self.dec2(torch.cat([self.up2(d3), e2], dim=1))\n        d1 = self.dec1(torch.cat([self.up1(d2), e1], dim=1))\n        return self.out(d1)  # (B, num_classes, H, W)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Features de entrada\u003c/h2>\n\u003cp>O modelo recebe 6 canais por tile (256x256 pixels, ~100m/pixel):\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Canal\u003c/th>\u003cth>Fonte\u003c/th>\u003cth>Descrição\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R, G, B\u003c/td>\u003ctd>Sentinel-2 / Landsat\u003c/td>\u003ctd>Imagem óptica\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DEM\u003c/td>\u003ctd>SRTMGL1\u003c/td>\u003ctd>Elevação em metros\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NDVI\u003c/td>\u003ctd>Calculado\u003c/td>\u003ctd>Índice de vegetação\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SMI\u003c/td>\u003ctd>Calculado\u003c/td>\u003ctd>Soil Moisture Index\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>def prepare_tile(\n    rgb: np.ndarray,        # (3, 256, 256) float32 [0,1]\n    dem: np.ndarray,        # (256, 256) float32 metros\n    ndvi: np.ndarray,       # (256, 256) float32 [-1, 1]\n    smi: np.ndarray,        # (256, 256) float32 [0, 1]\n) -&gt; torch.Tensor:\n    dem_norm  = (dem - dem.mean()) / (dem.std() + 1e-6)\n    x = np.stack([rgb[0], rgb[1], rgb[2], dem_norm, ndvi, smi], axis=0)\n    return torch.from_numpy(x).unsqueeze(0)  # (1, 6, 256, 256)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Dados de treino\u003c/h2>\n\u003cp>O arquivo \u003ccode>risk_training_data.csv\u003c/code> no repositório contém metadados de tiles históricos com anotações de risco vindas de:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>CEMADEN\u003c/strong> (Brasil): dados de deslizamentos históricos\u003c/li> \u003cli>\u003cstrong>INMET\u003c/strong>: dados climáticos históricos correlacionados\u003c/li> \u003cli>\u003cstrong>Brumadinho (2019)\u003c/strong>: o desastre que inspirou o projeto\u003c/li>\u003c/ul>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>class RiskDataset(Dataset):\n    def __init__(self, csv_path: str, tiles_dir: str, augment: bool = True):\n        self.df = pd.read_csv(csv_path)\n        self.tiles_dir = Path(tiles_dir)\n        self.augment = augment\n\n    def __getitem__(self, idx: int):\n        row   = self.df.iloc[idx]\n        tile  = np.load(self.tiles_dir / row[&#x27;tile_file&#x27;])  # (6, 256, 256)\n        mask  = np.load(self.tiles_dir / row[&#x27;mask_file&#x27;])  # (256, 256) int labels\n\n        if self.augment:\n            tile, mask = self._random_flip(tile, mask)\n\n        return torch.from_numpy(tile), torch.from_numpy(mask).long()\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Servindo o modelo via FastAPI\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode># api/main.py\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\nimport torch, io, json\n\napp = FastAPI(title=&quot;SOSLocation Risk Model API&quot;)\nmodel = SOSRiskSegmenter().eval()\nmodel.load_state_dict(torch.load(&quot;weights/best_model.pt&quot;, map_location=&quot;cpu&quot;))\n\n@app.post(&quot;/risk/predict&quot;)\nasync def predict_risk(payload: RiskRequest):\n    tile = prepare_tile(\n        rgb=np.array(payload.rgb), dem=np.array(payload.dem),\n        ndvi=np.array(payload.ndvi), smi=np.array(payload.smi)\n    )\n    with torch.no_grad():\n        logits = model(tile)                  # (1, 6, 256, 256)\n        probs  = torch.softmax(logits, dim=1) # probabilidades por classe\n        pred   = logits.argmax(dim=1)         # classe com maior probabilidade\n\n    return {\n        &quot;prediction&quot;:    pred[0].numpy().tolist(),\n        &quot;probabilities&quot;: probs[0].numpy().tolist(),\n        &quot;risk_level&quot;:    int(pred.max().item()),\n        &quot;critical_pct&quot;:  float((pred == 4).float().mean().item()) * 100,\n    }\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Integração com o backend .NET\u003c/h2>\n\u003cp>Quando o handler \u003ccode>CriticalIncidentCreated\u003c/code> é disparado, o cliente .NET chama o ML Unit:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Infrastructure/ML/RiskModelClient.cs\npublic async Task&lt;RiskAnalysis&gt; RequestAnalysisAsync(\n    Geometry incidentLocation, CancellationToken ct)\n{\n    var bbox = incidentLocation.EnvelopeInternal;\n    var tile = await _gisService.FetchTileAsync(bbox, ct);\n\n    var response = await _httpClient.PostAsJsonAsync(&quot;/risk/predict&quot;, new {\n        rgb  = tile.RGB,\n        dem  = tile.DEM,\n        ndvi = tile.NDVI,\n        smi  = tile.SMI,\n    }, ct);\n\n    return await response.Content.ReadFromJsonAsync&lt;RiskAnalysis&gt;(ct)\n        ?? throw new InvalidOperationException(&quot;Empty risk analysis response&quot;);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>O resultado da análise é armazenado no banco e transmitido ao dashboard via SignalR — adicionando uma camada de risco preditivo ao mapa tático em menos de 3 segundos após a criação do incidente.\u003c/p>", "title_en_us": "SOS Location: Neural Risk Models with PyTorch and Semantic Segmentation", "title_ja_jp": "SOS Location：PyTorch とセマンティックセグメンテーションによるニューラル・リスクモデル", "summary_en_us": "SOSLocation.ML uses PyTorch to predict risk in disaster zones. How we train semantic segmentation models to identify critical areas in satellite imagery and GIS data.", "summary_ja_jp": "SOSLocation.ML は PyTorch で災害地域のリスクを予測する。衛星画像と GIS データから重要領域を特定するセマンティックセグメンテーションモデルの訓練方法。", "body_html_en_us": "\u003ch1>Neural risk models: SOSLocation.ML\u003c/h1>\n\u003cp>In March 2026, the commit \u003ccode>feat(ml+tests): SOSLocation.ML .NET project + 40 unit/integration tests\u003c/code> formalized what had already been taking shape: a dedicated ML unit for SOS Location. The goal is simple but ambitious: \u003cstrong>predict which areas will be affected\u003c/strong> before the crisis becomes uncontrollable.\u003c/p>\n\u003ch2>ML Unit architecture\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>risk-analysis-unit/\n  api/            FastAPI — serves the model through REST and streaming gRPC\n  models/         PyTorch model definitions\n  training/       Training scripts + MLflow tracking\n  data/           Ingestion pipelines (GIS, weather, history)\n  tests/          40 unit and integration tests\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The ML Unit is an independent Python microservice that the .NET backend queries over HTTP/gRPC whenever a critical incident (severity &gt;= 7) is created.\u003c/p>\n\u003ch2>Semantic segmentation model\u003c/h2>\n\u003cp>Identifying risk zones in satellite imagery is a \u003cstrong>semantic segmentation\u003c/strong> problem: classifying each pixel as &quot;high risk&quot;, &quot;medium risk&quot;, &quot;safe&quot;, &quot;water&quot;, and so on.\u003c/p>\n\u003cp>The selected architecture is a modified U-Net, a classic approach in medical-image and geospatial segmentation:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass UNetBlock(nn.Module):\n    def __init__(self, in_ch: int, out_ch: int):\n        super().__init__()\n        self.conv = nn.Sequential(\n            nn.Conv2d(in_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.ReLU(inplace=True),\n            nn.Conv2d(out_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.ReLU(inplace=True),\n        )\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        return self.conv(x)\n\n\nclass SOSRiskSegmenter(nn.Module):\n    &quot;&quot;&quot;U-Net for risk segmentation on multispectral imagery + DEM.&quot;&quot;&quot;\n\n    RISK_CLASSES = [&#x27;safe&#x27;, &#x27;low_risk&#x27;, &#x27;medium_risk&#x27;, &#x27;high_risk&#x27;, &#x27;critical&#x27;, &#x27;water&#x27;]\n\n    def __init__(self, in_channels: int = 6, num_classes: int = 6):\n        # in_channels: RGB (3) + DEM (1) + NDVI (1) + moisture index (1)\n        super().__init__()\n        # Encoder\n        self.enc1 = UNetBlock(in_channels, 64)\n        self.enc2 = UNetBlock(64, 128)\n        self.enc3 = UNetBlock(128, 256)\n        self.enc4 = UNetBlock(256, 512)\n        # Bottleneck\n        self.bottleneck = UNetBlock(512, 1024)\n        # Decoder\n        self.up4 = nn.ConvTranspose2d(1024, 512, 2, stride=2)\n        self.dec4 = UNetBlock(1024, 512)\n        self.up3 = nn.ConvTranspose2d(512, 256, 2, stride=2)\n        self.dec3 = UNetBlock(512, 256)\n        self.up2 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec2 = UNetBlock(256, 128)\n        self.up1 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec1 = UNetBlock(128, 64)\n        # Output\n        self.out = nn.Conv2d(64, num_classes, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n        b  = self.bottleneck(self.pool(e4))\n        d4 = self.dec4(torch.cat([self.up4(b),  e4], dim=1))\n        d3 = self.dec3(torch.cat([self.up3(d4), e3], dim=1))\n        d2 = self.dec2(torch.cat([self.up2(d3), e2], dim=1))\n        d1 = self.dec1(torch.cat([self.up1(d2), e1], dim=1))\n        return self.out(d1)  # (B, num_classes, H, W)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Input features\u003c/h2>\n\u003cp>The model receives 6 channels per tile (256x256 pixels, around 100 m/pixel):\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Channel\u003c/th>\u003cth>Source\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R, G, B\u003c/td>\u003ctd>Sentinel-2 / Landsat\u003c/td>\u003ctd>Optical imagery\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DEM\u003c/td>\u003ctd>SRTMGL1\u003c/td>\u003ctd>Elevation in meters\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NDVI\u003c/td>\u003ctd>Derived\u003c/td>\u003ctd>Vegetation index\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SMI\u003c/td>\u003ctd>Derived\u003c/td>\u003ctd>Soil Moisture Index\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>def prepare_tile(\n    rgb: np.ndarray,        # (3, 256, 256) float32 [0,1]\n    dem: np.ndarray,        # (256, 256) float32 meters\n    ndvi: np.ndarray,       # (256, 256) float32 [-1, 1]\n    smi: np.ndarray,        # (256, 256) float32 [0, 1]\n) -&gt; torch.Tensor:\n    dem_norm  = (dem - dem.mean()) / (dem.std() + 1e-6)\n    x = np.stack([rgb[0], rgb[1], rgb[2], dem_norm, ndvi, smi], axis=0)\n    return torch.from_numpy(x).unsqueeze(0)  # (1, 6, 256, 256)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Training data\u003c/h2>\n\u003cp>The \u003ccode>risk_training_data.csv\u003c/code> file in the repository stores metadata for historical tiles with risk annotations derived from:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>CEMADEN\u003c/strong> (Brazil): historical landslide data\u003c/li> \u003cli>\u003cstrong>INMET\u003c/strong>: correlated historical weather records\u003c/li> \u003cli>\u003cstrong>Brumadinho (2019)\u003c/strong>: the disaster that inspired the project\u003c/li>\u003c/ul>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>class RiskDataset(Dataset):\n    def __init__(self, csv_path: str, tiles_dir: str, augment: bool = True):\n        self.df = pd.read_csv(csv_path)\n        self.tiles_dir = Path(tiles_dir)\n        self.augment = augment\n\n    def __getitem__(self, idx: int):\n        row   = self.df.iloc[idx]\n        tile  = np.load(self.tiles_dir / row[&#x27;tile_file&#x27;])  # (6, 256, 256)\n        mask  = np.load(self.tiles_dir / row[&#x27;mask_file&#x27;])  # (256, 256) int labels\n\n        if self.augment:\n            tile, mask = self._random_flip(tile, mask)\n\n        return torch.from_numpy(tile), torch.from_numpy(mask).long()\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Serving the model with FastAPI\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode># api/main.py\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\nimport torch, io, json\n\napp = FastAPI(title=&quot;SOSLocation Risk Model API&quot;)\nmodel = SOSRiskSegmenter().eval()\nmodel.load_state_dict(torch.load(&quot;weights/best_model.pt&quot;, map_location=&quot;cpu&quot;))\n\n@app.post(&quot;/risk/predict&quot;)\nasync def predict_risk(payload: RiskRequest):\n    tile = prepare_tile(\n        rgb=np.array(payload.rgb), dem=np.array(payload.dem),\n        ndvi=np.array(payload.ndvi), smi=np.array(payload.smi)\n    )\n    with torch.no_grad():\n        logits = model(tile)                  # (1, 6, 256, 256)\n        probs  = torch.softmax(logits, dim=1) # class probabilities\n        pred   = logits.argmax(dim=1)         # most probable class\n\n    return {\n        &quot;prediction&quot;:    pred[0].numpy().tolist(),\n        &quot;probabilities&quot;: probs[0].numpy().tolist(),\n        &quot;risk_level&quot;:    int(pred.max().item()),\n        &quot;critical_pct&quot;:  float((pred == 4).float().mean().item()) * 100,\n    }\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Integration with the .NET backend\u003c/h2>\n\u003cp>When the \u003ccode>CriticalIncidentCreated\u003c/code> handler fires, the .NET client calls the ML Unit:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Infrastructure/ML/RiskModelClient.cs\npublic async Task&lt;RiskAnalysis&gt; RequestAnalysisAsync(\n    Geometry incidentLocation, CancellationToken ct)\n{\n    var bbox = incidentLocation.EnvelopeInternal;\n    var tile = await _gisService.FetchTileAsync(bbox, ct);\n\n    var response = await _httpClient.PostAsJsonAsync(&quot;/risk/predict&quot;, new {\n        rgb  = tile.RGB,\n        dem  = tile.DEM,\n        ndvi = tile.NDVI,\n        smi  = tile.SMI,\n    }, ct);\n\n    return await response.Content.ReadFromJsonAsync&lt;RiskAnalysis&gt;(ct)\n        ?? throw new InvalidOperationException(&quot;Empty risk analysis response&quot;);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The analysis result is stored in the database and streamed to the dashboard via SignalR, adding a predictive risk layer to the tactical map in under 3 seconds after incident creation.\u003c/p>", "body_html_ja_jp": "\u003ch1>ニューラル・リスクモデル: SOSLocation.ML\u003c/h1>\n\u003cp>2026 年 3 月、コミット \u003ccode>feat(ml+tests): SOSLocation.ML .NET project + 40 unit/integration tests\u003c/code> によって、すでに形になりつつあったものが正式に定義されました。SOS Location 専用の ML ユニットです。目的は単純ですが野心的です。危機が制御不能になる前に、\u003cstrong>どのエリアが影響を受けるかを予測する\u003c/strong> ことです。\u003c/p>\n\u003ch2>ML Unit のアーキテクチャ\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>risk-analysis-unit/\n  api/            FastAPI — REST と streaming gRPC でモデルを提供\n  models/         PyTorch モデル定義\n  training/       学習スクリプト + MLflow トラッキング\n  data/           取り込みパイプライン（GIS、気象、履歴）\n  tests/          40 件の unit / integration test\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>ML Unit は独立した Python マイクロサービスであり、重大インシデント（severity &gt;= 7）が作成されると .NET バックエンドから HTTP/gRPC で呼び出されます。\u003c/p>\n\u003ch2>セマンティックセグメンテーション・モデル\u003c/h2>\n\u003cp>衛星画像の中からリスク領域を特定する問題は \u003cstrong>セマンティックセグメンテーション\u003c/strong> です。各ピクセルを「高リスク」「中リスク」「安全」「水域」などに分類します。\u003c/p>\n\u003cp>採用したアーキテクチャは、医用画像や地理空間画像の分割で古典的な手法である改良版 U-Net です。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nclass UNetBlock(nn.Module):\n    def __init__(self, in_ch: int, out_ch: int):\n        super().__init__()\n        self.conv = nn.Sequential(\n            nn.Conv2d(in_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.ReLU(inplace=True),\n            nn.Conv2d(out_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.ReLU(inplace=True),\n        )\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        return self.conv(x)\n\n\nclass SOSRiskSegmenter(nn.Module):\n    &quot;&quot;&quot;マルチスペクトル画像 + DEM 上のリスク分割用 U-Net。&quot;&quot;&quot;\n\n    RISK_CLASSES = [&#x27;safe&#x27;, &#x27;low_risk&#x27;, &#x27;medium_risk&#x27;, &#x27;high_risk&#x27;, &#x27;critical&#x27;, &#x27;water&#x27;]\n\n    def __init__(self, in_channels: int = 6, num_classes: int = 6):\n        # in_channels: RGB (3) + DEM (1) + NDVI (1) + moisture index (1)\n        super().__init__()\n        # Encoder\n        self.enc1 = UNetBlock(in_channels, 64)\n        self.enc2 = UNetBlock(64, 128)\n        self.enc3 = UNetBlock(128, 256)\n        self.enc4 = UNetBlock(256, 512)\n        # Bottleneck\n        self.bottleneck = UNetBlock(512, 1024)\n        # Decoder\n        self.up4 = nn.ConvTranspose2d(1024, 512, 2, stride=2)\n        self.dec4 = UNetBlock(1024, 512)\n        self.up3 = nn.ConvTranspose2d(512, 256, 2, stride=2)\n        self.dec3 = UNetBlock(512, 256)\n        self.up2 = nn.ConvTranspose2d(256, 128, 2, stride=2)\n        self.dec2 = UNetBlock(256, 128)\n        self.up1 = nn.ConvTranspose2d(128, 64, 2, stride=2)\n        self.dec1 = UNetBlock(128, 64)\n        # Output\n        self.out = nn.Conv2d(64, num_classes, 1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x: torch.Tensor) -&gt; torch.Tensor:\n        e1 = self.enc1(x)\n        e2 = self.enc2(self.pool(e1))\n        e3 = self.enc3(self.pool(e2))\n        e4 = self.enc4(self.pool(e3))\n        b  = self.bottleneck(self.pool(e4))\n        d4 = self.dec4(torch.cat([self.up4(b),  e4], dim=1))\n        d3 = self.dec3(torch.cat([self.up3(d4), e3], dim=1))\n        d2 = self.dec2(torch.cat([self.up2(d3), e2], dim=1))\n        d1 = self.dec1(torch.cat([self.up1(d2), e1], dim=1))\n        return self.out(d1)  # (B, num_classes, H, W)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>入力特徴量\u003c/h2>\n\u003cp>モデルは 1 タイルあたり 6 チャンネル（256x256 ピクセル、約 100 m / pixel）を受け取ります。\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>チャンネル\u003c/th>\u003cth>ソース\u003c/th>\u003cth>説明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>R, G, B\u003c/td>\u003ctd>Sentinel-2 / Landsat\u003c/td>\u003ctd>光学画像\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DEM\u003c/td>\u003ctd>SRTMGL1\u003c/td>\u003ctd>標高（メートル）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NDVI\u003c/td>\u003ctd>算出値\u003c/td>\u003ctd>植生指数\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SMI\u003c/td>\u003ctd>算出値\u003c/td>\u003ctd>Soil Moisture Index\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>def prepare_tile(\n    rgb: np.ndarray,        # (3, 256, 256) float32 [0,1]\n    dem: np.ndarray,        # (256, 256) float32 meters\n    ndvi: np.ndarray,       # (256, 256) float32 [-1, 1]\n    smi: np.ndarray,        # (256, 256) float32 [0, 1]\n) -&gt; torch.Tensor:\n    dem_norm  = (dem - dem.mean()) / (dem.std() + 1e-6)\n    x = np.stack([rgb[0], rgb[1], rgb[2], dem_norm, ndvi, smi], axis=0)\n    return torch.from_numpy(x).unsqueeze(0)  # (1, 6, 256, 256)\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>学習データ\u003c/h2>\n\u003cp>リポジトリ内の \u003ccode>risk_training_data.csv\u003c/code> には、履歴タイルとリスク注釈のメタデータが入っており、主に次のソースから構成されています。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>CEMADEN\u003c/strong>（ブラジル）: 過去の地すべりデータ\u003c/li> \u003cli>\u003cstrong>INMET\u003c/strong>: 相関づけられた過去の気象データ\u003c/li> \u003cli>\u003cstrong>Brumadinho (2019)\u003c/strong>: このプロジェクトの着想源となった災害\u003c/li>\u003c/ul>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>class RiskDataset(Dataset):\n    def __init__(self, csv_path: str, tiles_dir: str, augment: bool = True):\n        self.df = pd.read_csv(csv_path)\n        self.tiles_dir = Path(tiles_dir)\n        self.augment = augment\n\n    def __getitem__(self, idx: int):\n        row   = self.df.iloc[idx]\n        tile  = np.load(self.tiles_dir / row[&#x27;tile_file&#x27;])  # (6, 256, 256)\n        mask  = np.load(self.tiles_dir / row[&#x27;mask_file&#x27;])  # (256, 256) int labels\n\n        if self.augment:\n            tile, mask = self._random_flip(tile, mask)\n\n        return torch.from_numpy(tile), torch.from_numpy(mask).long()\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>FastAPI でモデルを提供する\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"python\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">python\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode># api/main.py\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\nimport torch, io, json\n\napp = FastAPI(title=&quot;SOSLocation Risk Model API&quot;)\nmodel = SOSRiskSegmenter().eval()\nmodel.load_state_dict(torch.load(&quot;weights/best_model.pt&quot;, map_location=&quot;cpu&quot;))\n\n@app.post(&quot;/risk/predict&quot;)\nasync def predict_risk(payload: RiskRequest):\n    tile = prepare_tile(\n        rgb=np.array(payload.rgb), dem=np.array(payload.dem),\n        ndvi=np.array(payload.ndvi), smi=np.array(payload.smi)\n    )\n    with torch.no_grad():\n        logits = model(tile)                  # (1, 6, 256, 256)\n        probs  = torch.softmax(logits, dim=1) # 各クラスの確率\n        pred   = logits.argmax(dim=1)         # 最も確率の高いクラス\n\n    return {\n        &quot;prediction&quot;:    pred[0].numpy().tolist(),\n        &quot;probabilities&quot;: probs[0].numpy().tolist(),\n        &quot;risk_level&quot;:    int(pred.max().item()),\n        &quot;critical_pct&quot;:  float((pred == 4).float().mean().item()) * 100,\n    }\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>.NET バックエンドとの統合\u003c/h2>\n\u003cp>\u003ccode>CriticalIncidentCreated\u003c/code> ハンドラが発火すると、.NET クライアントは ML Unit を呼び出します。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Infrastructure/ML/RiskModelClient.cs\npublic async Task&lt;RiskAnalysis&gt; RequestAnalysisAsync(\n    Geometry incidentLocation, CancellationToken ct)\n{\n    var bbox = incidentLocation.EnvelopeInternal;\n    var tile = await _gisService.FetchTileAsync(bbox, ct);\n\n    var response = await _httpClient.PostAsJsonAsync(&quot;/risk/predict&quot;, new {\n        rgb  = tile.RGB,\n        dem  = tile.DEM,\n        ndvi = tile.NDVI,\n        smi  = tile.SMI,\n    }, ct);\n\n    return await response.Content.ReadFromJsonAsync&lt;RiskAnalysis&gt;(ct)\n        ?? throw new InvalidOperationException(&quot;Empty risk analysis response&quot;);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>分析結果はデータベースに保存され、SignalR 経由でダッシュボードへ配信されます。これにより、インシデント作成から 3 秒未満で戦術マップに予測リスク層を重ねられます。\u003c/p>"}, {"id": "post-sos-location-postgis-spatial-intelligence", "kind": "post", "name": "SOS Location: PostGIS e inteligência espacial para resposta a desastres", "headline": "PostGIS transforma o PostgreSQL em um motor geoespacial. Como usamos GIST indexes, ST_DWithin e line-of-sight para decisões táticas em tempo real.", "summary": "PostGIS transforma o PostgreSQL em um motor geoespacial. Como usamos GIST indexes, ST_DWithin e line-of-sight para decisões táticas em tempo real.", "status": "production", "stack": ["gis", "postgis", "postgresql", "spatial", "backend"], "url": "/posts/2026-04-05-1400-sos-location-postgis-spatial-intelligence/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-05-1400-sos-location-postgis-spatial-intelligence/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": true, "body_html": "\u003ch1>PostGIS: o motor geoespacial do SOS Location\u003c/h1>\n\u003cp>PostgreSQL é excelente. Com PostGIS, ele se torna um sistema de informação geográfica completo dentro do seu banco de dados. No SOS Location, todas as decisões táticas passam por consultas espaciais — e a diferença entre 200ms e 2s numa query pode definir se uma equipe chega a tempo.\u003c/p>\n\u003ch2>Schema espacial\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Incidents com geometria PostGIS\nCREATE TABLE incidents (\n  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  event_id     TEXT UNIQUE NOT NULL,\n  type         incident_type NOT NULL,\n  severity     SMALLINT CHECK (severity BETWEEN 1 AND 10),\n  location     GEOMETRY(Point, 4326) NOT NULL,  -- WGS84\n  affected_area GEOMETRY(Polygon, 4326),\n  occurred_at  TIMESTAMPTZ NOT NULL,\n  status       TEXT NOT NULL DEFAULT &#x27;active&#x27;,\n  trace_id     TEXT NOT NULL\n);\n\n-- GIST index: obrigatório para performance em buscas espaciais\nCREATE INDEX idx_incidents_location ON incidents USING GIST (location);\nCREATE INDEX idx_incidents_area     ON incidents USING GIST (affected_area);\n\n-- Resources (equipes de campo, veículos, abrigos)\nCREATE TABLE resources (\n  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  type         resource_type NOT NULL,\n  status       TEXT NOT NULL DEFAULT &#x27;available&#x27;,\n  location     GEOMETRY(Point, 4326) NOT NULL,\n  capacity     INT,\n  updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\nCREATE INDEX idx_resources_location ON resources USING GIST (location);\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Consultas espaciais críticas\u003c/h2>\n\u003ch3>1. Busca de recursos no raio de um incidente\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Todos os recursos disponíveis em raio de 10km do incidente\nSELECT\n  r.id,\n  r.type,\n  r.capacity,\n  ST_Distance(\n    r.location::geography,\n    i.location::geography\n  ) / 1000 AS distance_km,\n  ST_Azimuth(i.location, r.location) * 180 / PI() AS bearing_degrees\nFROM resources r\nCROSS JOIN incidents i\nWHERE i.id = $1\n  AND r.status = &#x27;available&#x27;\n  AND ST_DWithin(\n    r.location::geography,\n    i.location::geography,\n    10000  -- 10km em metros\n  )\nORDER BY distance_km ASC\nLIMIT 20;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>O cast \u003ccode>::geography\u003c/code> é essencial: garante que a distância seja em \u003cstrong>metros reais\u003c/strong> sobre a superfície da Terra, não graus de arco.\u003c/p>\n\u003ch3>2. Intersecção entre área afetada e zonas de risco\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Quais zonas de risco catalogadas se intersectam com a área afetada?\nSELECT\n  rz.id,\n  rz.name,\n  rz.risk_level,\n  ST_Area(ST_Intersection(i.affected_area, rz.boundary)::geography) / 1e6 AS overlap_km2\nFROM risk_zones rz\nJOIN incidents i ON i.id = $1\nWHERE ST_Intersects(i.affected_area, rz.boundary)\n  AND rz.active = true\nORDER BY overlap_km2 DESC;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>3. Line of sight para watchpoints\u003c/h3>\n\u003cp>A visibilidade de linha direta entre um watchpoint (câmera, sensor) e um incidente é crítica para alocação de recursos de monitoramento:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Verifica se existe obstáculo entre watchpoint e incidente usando DEM\n-- (simplificado — a implementação real usa uma função PL/pgSQL customizada)\nCREATE OR REPLACE FUNCTION line_of_sight(\n  observer_geom  GEOMETRY(Point, 4326),\n  observer_elev  FLOAT,\n  target_geom    GEOMETRY(Point, 4326),\n  target_elev    FLOAT\n) RETURNS BOOLEAN AS $$\nDECLARE\n  los_line  GEOMETRY;\n  max_obstr FLOAT;\nBEGIN\n  -- Linha entre observer e target\n  los_line := ST_MakeLine(observer_geom, target_geom);\n\n  -- Maior elevação ao longo da linha (DEM via PostGIS raster)\n  SELECT MAX(ST_Value(dem.rast, ST_PointN(los_line, gs.n)))\n  INTO max_obstr\n  FROM dem_tiles dem\n  CROSS JOIN generate_series(1, ST_NumPoints(los_line)) AS gs(n)\n  WHERE ST_Intersects(dem.rast::geometry, los_line);\n\n  -- Se nenhum ponto intermediário é mais alto que a linha de visão, há LOS\n  RETURN COALESCE(max_obstr, 0) &lt;= LEAST(observer_elev, target_elev)\n           + (ABS(observer_elev - target_elev) / 2);\nEND;\n$$ LANGUAGE plpgsql;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>4. Clustering de incidentes para o mapa tático\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Agrupa incidentes próximos (&lt; 500m) para evitar sobreposição no mapa\nSELECT\n  ST_AsGeoJSON(ST_Centroid(ST_Collect(location))) AS centroid,\n  COUNT(*) AS incident_count,\n  MAX(severity) AS max_severity,\n  ARRAY_AGG(id) AS incident_ids\nFROM incidents\nWHERE status = &#x27;active&#x27;\n  AND occurred_at &gt; NOW() - INTERVAL &#x27;24 hours&#x27;\nGROUP BY ST_SnapToGrid(location, 0.005)  -- grid de ~500m\nORDER BY max_severity DESC;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Benchmark e indexação\u003c/h2>\n\u003cp>Sem GIST index, uma busca \u003ccode>ST_DWithin\u003c/code> em 50.000 registros demora ~800ms. Com o índice: \u003cstrong>&lt; 8ms\u003c/strong>.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Análise de performance\nEXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)\nSELECT * FROM incidents\nWHERE ST_DWithin(location::geography, ST_Point(-43.9, -19.9)::geography, 5000);\n\n-- Output com GIST:\n-- Index Scan using idx_incidents_location on incidents\n-- Planning Time: 0.3 ms\n-- Execution Time: 7.2 ms\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>EF Core + Npgsql + NetTopologySuite\u003c/h2>\n\u003cp>No .NET, o mapeamento de tipos PostGIS usa \u003ccode>NetTopologySuite\u003c/code>:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// SosDbContext.cs\nprotected override void OnConfiguring(DbContextOptionsBuilder optionsBuilder)\n{\n    optionsBuilder.UseNpgsql(connectionString, o =&gt;\n        o.UseNetTopologySuite()\n         .SetPostgresVersion(15, 0)\n    );\n}\n\n// Incident.cs (Entity)\npublic class Incident\n{\n    public Guid Id { get; private set; }\n    public Point Location { get; private set; }       // NTS Point\n    public Polygon? AffectedArea { get; private set; } // NTS Polygon\n    // ...\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>A combinação PostGIS + NetTopologySuite + EF Core permite escrever queries LINQ com operações espaciais que compilam para SQL otimizado:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>var nearbyIncidents = await _db.Incidents\n    .Where(i =&gt; i.Location.IsWithinDistance(searchPoint, radiusMeters))\n    .OrderByDescending(i =&gt; i.Severity)\n    .ToListAsync();\n// Gera: WHERE ST_DWithin(location, $1, $2) ORDER BY severity DESC\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>PostGIS é a diferença entre um sistema GIS de verdade e um sistema que apenas armazena coordenadas. No SOS Location, ele é o coração de todas as decisões táticas.\u003c/p>", "title_en_us": "SOS Location: PostGIS and Spatial Intelligence for Disaster Response", "title_ja_jp": "SOS Location：災害対応のための PostGIS と空間インテリジェンス", "summary_en_us": "PostGIS turns PostgreSQL into a geospatial engine. How we use GIST indexes, ST_DWithin and line-of-sight for real-time tactical decisions.", "summary_ja_jp": "PostGIS は PostgreSQL を地理空間エンジンへと変える。GIST インデックス、ST_DWithin、見通し線をリアルタイム戦術判断にどう活かすか。", "body_html_en_us": "\u003ch1>PostGIS: the geospatial engine behind SOS Location\u003c/h1>\n\u003cp>PostgreSQL is excellent. With PostGIS, it becomes a full geographic information system inside your database. In SOS Location, every tactical decision flows through spatial queries, and the difference between 200 ms and 2 s on a query can determine whether a field team arrives in time.\u003c/p>\n\u003ch2>Spatial schema\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Incidents with PostGIS geometry\nCREATE TABLE incidents (\n  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  event_id     TEXT UNIQUE NOT NULL,\n  type         incident_type NOT NULL,\n  severity     SMALLINT CHECK (severity BETWEEN 1 AND 10),\n  location     GEOMETRY(Point, 4326) NOT NULL,  -- WGS84\n  affected_area GEOMETRY(Polygon, 4326),\n  occurred_at  TIMESTAMPTZ NOT NULL,\n  status       TEXT NOT NULL DEFAULT &#x27;active&#x27;,\n  trace_id     TEXT NOT NULL\n);\n\n-- GIST index: mandatory for spatial-query performance\nCREATE INDEX idx_incidents_location ON incidents USING GIST (location);\nCREATE INDEX idx_incidents_area     ON incidents USING GIST (affected_area);\n\n-- Resources (field teams, vehicles, shelters)\nCREATE TABLE resources (\n  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  type         resource_type NOT NULL,\n  status       TEXT NOT NULL DEFAULT &#x27;available&#x27;,\n  location     GEOMETRY(Point, 4326) NOT NULL,\n  capacity     INT,\n  updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\nCREATE INDEX idx_resources_location ON resources USING GIST (location);\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Critical spatial queries\u003c/h2>\n\u003ch3>1. Search for resources within the incident radius\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- All available resources within 10 km of the incident\nSELECT\n  r.id,\n  r.type,\n  r.capacity,\n  ST_Distance(\n    r.location::geography,\n    i.location::geography\n  ) / 1000 AS distance_km,\n  ST_Azimuth(i.location, r.location) * 180 / PI() AS bearing_degrees\nFROM resources r\nCROSS JOIN incidents i\nWHERE i.id = $1\n  AND r.status = &#x27;available&#x27;\n  AND ST_DWithin(\n    r.location::geography,\n    i.location::geography,\n    10000  -- 10 km in meters\n  )\nORDER BY distance_km ASC\nLIMIT 20;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The \u003ccode>::geography\u003c/code> cast is essential: it guarantees that distance is measured in \u003cstrong>real meters\u003c/strong> over the Earth&#x27;s surface, not in arc degrees.\u003c/p>\n\u003ch3>2. Intersection between affected area and risk zones\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Which cataloged risk zones intersect the affected area?\nSELECT\n  rz.id,\n  rz.name,\n  rz.risk_level,\n  ST_Area(ST_Intersection(i.affected_area, rz.boundary)::geography) / 1e6 AS overlap_km2\nFROM risk_zones rz\nJOIN incidents i ON i.id = $1\nWHERE ST_Intersects(i.affected_area, rz.boundary)\n  AND rz.active = true\nORDER BY overlap_km2 DESC;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>3. Line of sight for watchpoints\u003c/h3>\n\u003cp>Direct visibility between a watchpoint (camera, sensor) and an incident is critical when allocating monitoring resources:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Checks whether an obstacle exists between watchpoint and incident using DEM\n-- (simplified — the real implementation uses a custom PL/pgSQL function)\nCREATE OR REPLACE FUNCTION line_of_sight(\n  observer_geom  GEOMETRY(Point, 4326),\n  observer_elev  FLOAT,\n  target_geom    GEOMETRY(Point, 4326),\n  target_elev    FLOAT\n) RETURNS BOOLEAN AS $$\nDECLARE\n  los_line  GEOMETRY;\n  max_obstr FLOAT;\nBEGIN\n  -- Line between observer and target\n  los_line := ST_MakeLine(observer_geom, target_geom);\n\n  -- Highest elevation along the line (DEM via PostGIS raster)\n  SELECT MAX(ST_Value(dem.rast, ST_PointN(los_line, gs.n)))\n  INTO max_obstr\n  FROM dem_tiles dem\n  CROSS JOIN generate_series(1, ST_NumPoints(los_line)) AS gs(n)\n  WHERE ST_Intersects(dem.rast::geometry, los_line);\n\n  -- If no intermediate point is higher than the line of sight, LOS exists\n  RETURN COALESCE(max_obstr, 0) &lt;= LEAST(observer_elev, target_elev)\n           + (ABS(observer_elev - target_elev) / 2);\nEND;\n$$ LANGUAGE plpgsql;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>4. Incident clustering for the tactical map\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Groups nearby incidents (&lt; 500 m) to avoid overlap on the map\nSELECT\n  ST_AsGeoJSON(ST_Centroid(ST_Collect(location))) AS centroid,\n  COUNT(*) AS incident_count,\n  MAX(severity) AS max_severity,\n  ARRAY_AGG(id) AS incident_ids\nFROM incidents\nWHERE status = &#x27;active&#x27;\n  AND occurred_at &gt; NOW() - INTERVAL &#x27;24 hours&#x27;\nGROUP BY ST_SnapToGrid(location, 0.005)  -- ~500 m grid\nORDER BY max_severity DESC;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Benchmark and indexing\u003c/h2>\n\u003cp>Without a GIST index, an \u003ccode>ST_DWithin\u003c/code> search over 50,000 records takes around 800 ms. With the index: \u003cstrong>under 8 ms\u003c/strong>.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- Performance analysis\nEXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)\nSELECT * FROM incidents\nWHERE ST_DWithin(location::geography, ST_Point(-43.9, -19.9)::geography, 5000);\n\n-- Output with GIST:\n-- Index Scan using idx_incidents_location on incidents\n-- Planning Time: 0.3 ms\n-- Execution Time: 7.2 ms\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>EF Core + Npgsql + NetTopologySuite\u003c/h2>\n\u003cp>In .NET, PostGIS type mapping uses \u003ccode>NetTopologySuite\u003c/code>:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// SosDbContext.cs\nprotected override void OnConfiguring(DbContextOptionsBuilder optionsBuilder)\n{\n    optionsBuilder.UseNpgsql(connectionString, o =&gt;\n        o.UseNetTopologySuite()\n         .SetPostgresVersion(15, 0)\n    );\n}\n\n// Incident.cs (Entity)\npublic class Incident\n{\n    public Guid Id { get; private set; }\n    public Point Location { get; private set; }       // NTS Point\n    public Polygon? AffectedArea { get; private set; } // NTS Polygon\n    // ...\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>The combination of PostGIS + NetTopologySuite + EF Core lets you write LINQ queries with spatial operations that compile into optimized SQL:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>var nearbyIncidents = await _db.Incidents\n    .Where(i =&gt; i.Location.IsWithinDistance(searchPoint, radiusMeters))\n    .OrderByDescending(i =&gt; i.Severity)\n    .ToListAsync();\n// Generates: WHERE ST_DWithin(location, $1, $2) ORDER BY severity DESC\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>PostGIS is the difference between a real GIS system and a system that merely stores coordinates. In SOS Location, it sits at the heart of every tactical decision.\u003c/p>", "body_html_ja_jp": "\u003ch1>PostGIS: SOS Location を支える地理空間エンジン\u003c/h1>\n\u003cp>PostgreSQL は優れたデータベースです。PostGIS を加えると、データベース内部で完結する本格的な地理情報システムになります。SOS Location では、あらゆる戦術判断が空間クエリを通過します。クエリが 200 ms で返るか 2 秒かで、現場チームが間に合うかどうかが変わることさえあります。\u003c/p>\n\u003ch2>空間スキーマ\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- PostGIS ジオメトリを持つインシデント\nCREATE TABLE incidents (\n  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  event_id     TEXT UNIQUE NOT NULL,\n  type         incident_type NOT NULL,\n  severity     SMALLINT CHECK (severity BETWEEN 1 AND 10),\n  location     GEOMETRY(Point, 4326) NOT NULL,  -- WGS84\n  affected_area GEOMETRY(Polygon, 4326),\n  occurred_at  TIMESTAMPTZ NOT NULL,\n  status       TEXT NOT NULL DEFAULT &#x27;active&#x27;,\n  trace_id     TEXT NOT NULL\n);\n\n-- GIST インデックス: 空間検索の性能に必須\nCREATE INDEX idx_incidents_location ON incidents USING GIST (location);\nCREATE INDEX idx_incidents_area     ON incidents USING GIST (affected_area);\n\n-- リソース（現場チーム、車両、避難所）\nCREATE TABLE resources (\n  id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  type         resource_type NOT NULL,\n  status       TEXT NOT NULL DEFAULT &#x27;available&#x27;,\n  location     GEOMETRY(Point, 4326) NOT NULL,\n  capacity     INT,\n  updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\nCREATE INDEX idx_resources_location ON resources USING GIST (location);\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>重要な空間クエリ\u003c/h2>\n\u003ch3>1. インシデント半径内のリソース検索\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- インシデントから半径 10 km 以内にある利用可能な全リソース\nSELECT\n  r.id,\n  r.type,\n  r.capacity,\n  ST_Distance(\n    r.location::geography,\n    i.location::geography\n  ) / 1000 AS distance_km,\n  ST_Azimuth(i.location, r.location) * 180 / PI() AS bearing_degrees\nFROM resources r\nCROSS JOIN incidents i\nWHERE i.id = $1\n  AND r.status = &#x27;available&#x27;\n  AND ST_DWithin(\n    r.location::geography,\n    i.location::geography,\n    10000  -- 10 km をメートルで指定\n  )\nORDER BY distance_km ASC\nLIMIT 20;\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>\u003ccode>::geography\u003c/code> へのキャストは重要です。これにより、地球表面上の距離が角度ではなく \u003cstrong>実際のメートル単位\u003c/strong> で計算されます。\u003c/p>\n\u003ch3>2. 被災エリアとリスクゾーンの交差判定\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- 登録済みのリスクゾーンのうち、被災エリアと交差するものはどれか？\nSELECT\n  rz.id,\n  rz.name,\n  rz.risk_level,\n  ST_Area(ST_Intersection(i.affected_area, rz.boundary)::geography) / 1e6 AS overlap_km2\nFROM risk_zones rz\nJOIN incidents i ON i.id = $1\nWHERE ST_Intersects(i.affected_area, rz.boundary)\n  AND rz.active = true\nORDER BY overlap_km2 DESC;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>3. watchpoint 向け line of sight\u003c/h3>\n\u003cp>watchpoint（カメラやセンサー）とインシデントの間に直線視界があるかどうかは、監視リソースの配備で重要になります。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- DEM を使って watchpoint とインシデントの間に障害物があるか確認\n-- （簡略版。実装本体ではカスタム PL/pgSQL 関数を使う）\nCREATE OR REPLACE FUNCTION line_of_sight(\n  observer_geom  GEOMETRY(Point, 4326),\n  observer_elev  FLOAT,\n  target_geom    GEOMETRY(Point, 4326),\n  target_elev    FLOAT\n) RETURNS BOOLEAN AS $$\nDECLARE\n  los_line  GEOMETRY;\n  max_obstr FLOAT;\nBEGIN\n  -- observer と target を結ぶ線\n  los_line := ST_MakeLine(observer_geom, target_geom);\n\n  -- 線上で最も高い標高（PostGIS raster 経由の DEM）\n  SELECT MAX(ST_Value(dem.rast, ST_PointN(los_line, gs.n)))\n  INTO max_obstr\n  FROM dem_tiles dem\n  CROSS JOIN generate_series(1, ST_NumPoints(los_line)) AS gs(n)\n  WHERE ST_Intersects(dem.rast::geometry, los_line);\n\n  -- 中間点が視線より高くなければ LOS が成立\n  RETURN COALESCE(max_obstr, 0) &lt;= LEAST(observer_elev, target_elev)\n           + (ABS(observer_elev - target_elev) / 2);\nEND;\n$$ LANGUAGE plpgsql;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>4. 戦術マップ向けインシデント・クラスタリング\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- 地図上の重なりを避けるため、近接したインシデント（500 m 未満）をまとめる\nSELECT\n  ST_AsGeoJSON(ST_Centroid(ST_Collect(location))) AS centroid,\n  COUNT(*) AS incident_count,\n  MAX(severity) AS max_severity,\n  ARRAY_AGG(id) AS incident_ids\nFROM incidents\nWHERE status = &#x27;active&#x27;\n  AND occurred_at &gt; NOW() - INTERVAL &#x27;24 hours&#x27;\nGROUP BY ST_SnapToGrid(location, 0.005)  -- 約 500 m グリッド\nORDER BY max_severity DESC;\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>ベンチマークとインデックス\u003c/h2>\n\u003cp>GIST インデックスなしでは、50,000 件に対する \u003ccode>ST_DWithin\u003c/code> 検索は約 800 ms かかります。インデックスありなら \u003cstrong>8 ms 未満\u003c/strong> です。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"sql\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">sql\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>-- パフォーマンス分析\nEXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT)\nSELECT * FROM incidents\nWHERE ST_DWithin(location::geography, ST_Point(-43.9, -19.9)::geography, 5000);\n\n-- GIST 使用時の出力:\n-- Index Scan using idx_incidents_location on incidents\n-- Planning Time: 0.3 ms\n-- Execution Time: 7.2 ms\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>EF Core + Npgsql + NetTopologySuite\u003c/h2>\n\u003cp>.NET では、PostGIS 型のマッピングに \u003ccode>NetTopologySuite\u003c/code> を使います。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// SosDbContext.cs\nprotected override void OnConfiguring(DbContextOptionsBuilder optionsBuilder)\n{\n    optionsBuilder.UseNpgsql(connectionString, o =&gt;\n        o.UseNetTopologySuite()\n         .SetPostgresVersion(15, 0)\n    );\n}\n\n// Incident.cs (Entity)\npublic class Incident\n{\n    public Guid Id { get; private set; }\n    public Point Location { get; private set; }       // NTS Point\n    public Polygon? AffectedArea { get; private set; } // NTS Polygon\n    // ...\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>PostGIS + NetTopologySuite + EF Core の組み合わせにより、空間演算を含む LINQ クエリを書いて、それを最適化された SQL に変換できます。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>var nearbyIncidents = await _db.Incidents\n    .Where(i =&gt; i.Location.IsWithinDistance(searchPoint, radiusMeters))\n    .OrderByDescending(i =&gt; i.Severity)\n    .ToListAsync();\n// 生成される SQL: WHERE ST_DWithin(location, $1, $2) ORDER BY severity DESC\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>PostGIS は、本物の GIS システムと、単に座標を保存しているだけのシステムを分ける境界です。SOS Location では、あらゆる戦術判断の中心にあります。\u003c/p>"}, {"id": "post-sos-location-clean-architecture-dotnet10", "kind": "post", "name": "SOS Location: Clean Architecture + CQRS em .NET 10", "headline": "Arquitetura limpa, CQRS com MediatR e domain events no backend do SOS Location. Como estruturamos o código para resiliência em cenários de crise.", "summary": "Arquitetura limpa, CQRS com MediatR e domain events no backend do SOS Location. Como estruturamos o código para resiliência em cenários de crise.", "status": "production", "stack": ["dotnet", "clean-architecture", "cqrs", "backend", "architecture"], "url": "/posts/2026-04-05-1300-sos-location-clean-architecture-dotnet10/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-05-1300-sos-location-clean-architecture-dotnet10/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003ch1>Clean Architecture + CQRS no backend do SOS Location\u003c/h1>\n\u003cp>Em Abril de 2026, o commit \u003ccode>refactor: migrate all page components to the domains/operations directory\u003c/code> marcou a conclusão de uma refatoração profunda do backend do SOS Location. Não foi só reorganizar pastas — foi repensar como o código deveria \u003cem>crescer\u003c/em> quando vidas dependem da sua corretude.\u003c/p>\n\u003ch2>Por que Clean Architecture num sistema de desastres?\u003c/h2>\n\u003cp>Sistemas de resposta a catástrofes têm um perfil incomum:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Picos imprevisíveis\u003c/strong> — Um terremoto de magnitude 7 pode gerar 10x o tráfego normal em segundos\u003c/li> \u003cli>\u003cstrong>Múltiplos agentes de entrada\u003c/strong> — APIs externas, agentes CLI (Codex), SignalR, CRON jobs\u003c/li> \u003cli>\u003cstrong>Auditoria obrigatória\u003c/strong> — Cada mutação de estado precisa de \u003ccode>trace_id\u003c/code>, \u003ccode>actor\u003c/code> e \u003ccode>reason\u003c/code>\u003c/li> \u003cli>\u003cstrong>Evolução constante\u003c/strong> — Fase 8, 9, 10... o sistema cresce com o projeto\u003c/li>\u003c/ol>\n\u003cp>Clean Architecture separa essas preocupações em camadas com dependências unidirecionais:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>Domain         → apenas lógica de negócio, sem imports de infraestrutura\nApplication    → casos de uso (Commands, Queries, Handlers)\nInfrastructure → EF Core, PostGIS, SignalR, Keycloak\nPresentation   → ASP.NET Core Controllers, Minimal API\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>CQRS com MediatR\u003c/h2>\n\u003cp>O padrão CQRS (Command Query Responsibility Segregation) separa operações de escrita (Commands) de leitura (Queries).\u003c/p>\n\u003ch3>Command: criar incidente\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Application/Commands/CreateIncidentCommand.cs\npublic record CreateIncidentCommand(\n    string EventId,\n    IncidentType Type,\n    int Severity,\n    GeoJsonGeometry Location,\n    DateTimeOffset OccurredAt,\n    string ActorId\n) : IRequest&lt;Result&lt;IncidentDto&gt;&gt;;\n\npublic class CreateIncidentHandler : IRequestHandler&lt;CreateIncidentCommand, Result&lt;IncidentDto&gt;&gt;\n{\n    private readonly IIncidentRepository _incidents;\n    private readonly IEventBus _eventBus;\n    private readonly IAuditLog _audit;\n\n    public async Task&lt;Result&lt;IncidentDto&gt;&gt; Handle(\n        CreateIncidentCommand cmd, CancellationToken ct)\n    {\n        // Domain validation\n        if (cmd.Severity &lt; 1 || cmd.Severity &gt; 10)\n            return Result.Fail(&quot;Severity must be between 1 and 10&quot;);\n\n        var incident = Incident.Create(\n            cmd.EventId, cmd.Type, cmd.Severity,\n            cmd.Location, cmd.OccurredAt);\n\n        await _incidents.AddAsync(incident, ct);\n\n        // Audit trail — sempre\n        await _audit.RecordAsync(new AuditEntry(\n            Actor:   cmd.ActorId,\n            Action:  &quot;incident.created&quot;,\n            TraceId: Activity.Current?.TraceId.ToString() ?? Guid.NewGuid().ToString(),\n            Payload: JsonSerializer.Serialize(incident)\n        ), ct);\n\n        // Domain event: notifica SignalR, ML, operações críticas\n        if (incident.Severity &gt;= 7)\n            _eventBus.Publish(new CriticalIncidentCreated(incident));\n\n        return Result.Ok(incident.ToDto());\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>Query: busca espacial com PostGIS\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Application/Queries/GetIncidentsInRadiusQuery.cs\npublic record GetIncidentsInRadiusQuery(\n    double Lat, double Lon, double RadiusKm\n) : IRequest&lt;IReadOnlyList&lt;IncidentDto&gt;&gt;;\n\npublic class GetIncidentsInRadiusHandler\n    : IRequestHandler&lt;GetIncidentsInRadiusQuery, IReadOnlyList&lt;IncidentDto&gt;&gt;\n{\n    private readonly SosDbContext _db;\n\n    public async Task&lt;IReadOnlyList&lt;IncidentDto&gt;&gt; Handle(\n        GetIncidentsInRadiusQuery q, CancellationToken ct)\n    {\n        var point = new Point(q.Lon, q.Lat) { SRID = 4326 };\n        double radiusMeters = q.RadiusKm * 1000;\n\n        return await _db.Incidents\n            .Where(i =&gt; i.Location.IsWithinDistance(point, radiusMeters))\n            .OrderByDescending(i =&gt; i.Severity)\n            .ThenByDescending(i =&gt; i.OccurredAt)\n            .Select(i =&gt; i.ToDto())\n            .ToListAsync(ct);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Domain Events para operações críticas\u003c/h2>\n\u003cp>O domínio publica eventos sem saber quem os consome. A infraestrutura conecta:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Domain/Events/CriticalIncidentCreated.cs\npublic record CriticalIncidentCreated(Incident Incident) : IDomainEvent;\n\n// Infrastructure/EventHandlers/NotifyOpsOnCriticalIncident.cs\npublic class NotifyOpsOnCriticalIncident\n    : INotificationHandler&lt;CriticalIncidentCreated&gt;\n{\n    private readonly IHubContext&lt;OpsHub&gt; _hub;\n    private readonly IRiskModelClient _riskModel;\n\n    public async Task Handle(CriticalIncidentCreated e, CancellationToken ct)\n    {\n        // 1. Notifica o dashboard em tempo real via SignalR\n        await _hub.Clients.Group(&quot;ops-commanders&quot;)\n            .SendAsync(&quot;IncidentAlert&quot;, e.Incident.ToAlertPayload(), ct);\n\n        // 2. Solicita análise de risco ao ML Unit (async)\n        await _riskModel.RequestAnalysisAsync(e.Incident.Location, ct);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Pipeline de comportamentos transversais\u003c/h2>\n\u003cp>MediatR permite adicionar behaviors que se aplicam a todos os Commands/Queries — como logging, validação e retry:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Registrado no DI antes de todos os handlers\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(ValidationBehavior&lt;,&gt;));\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(LoggingBehavior&lt;,&gt;));\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(DistributedTracingBehavior&lt;,&gt;));\n\n// LoggingBehavior.cs\npublic class LoggingBehavior&lt;TRequest, TResponse&gt;\n    : IPipelineBehavior&lt;TRequest, TResponse&gt;\n{\n    private readonly ILogger&lt;TRequest&gt; _logger;\n\n    public async Task&lt;TResponse&gt; Handle(\n        TRequest req, RequestHandlerDelegate&lt;TResponse&gt; next, CancellationToken ct)\n    {\n        var sw = Stopwatch.StartNew();\n        _logger.LogInformation(&quot;Handling {Request}&quot;, typeof(TRequest).Name);\n        var response = await next();\n        _logger.LogInformation(&quot;Handled {Request} in {Elapsed}ms&quot;,\n            typeof(TRequest).Name, sw.ElapsedMilliseconds);\n        return response;\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Estrutura de pastas (pós-refatoração de Abril/2026)\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>backend-dotnet/\n  SOSLocation.Domain/\n    Entities/       Incident, Resource, Mission, WatchPoint\n    Events/         CriticalIncidentCreated, ResourceAllocated\n    ValueObjects/   GeoPoint, Severity, IncidentType\n  SOSLocation.Application/\n    Commands/       CreateIncidentCommand, AllocateResourceCommand\n    Queries/        GetIncidentsInRadiusQuery, GetMissionStatusQuery\n    Behaviors/      ValidationBehavior, LoggingBehavior\n  SOSLocation.Infrastructure/\n    Persistence/    SosDbContext (EF Core + Npgsql + PostGIS)\n    SignalR/        OpsHub, NotificationHub\n    ML/             RiskModelClient (FastAPI gRPC)\n    Auth/           KeycloakAuthHandler\n  SOSLocation.API/\n    Endpoints/      IncidentEndpoints (Minimal API)\n    Hubs/           OpsHub registration\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Essa estrutura suporta o crescimento até a Fase 10 sem acúmulo de débito técnico — cada nova integração tem um lugar definido, e o domínio nunca sabe da infraestrutura.\u003c/p>", "title_en_us": "SOS Location: Clean Architecture + CQRS on .NET 10", "title_ja_jp": "SOS Location：.NET 10 で Clean Architecture + CQRS", "summary_en_us": "Clean Architecture, CQRS with MediatR and domain events in the SOS Location backend. How we structured code for crisis-scenario resilience.", "summary_ja_jp": "SOS Location バックエンドにおける Clean Architecture、MediatR による CQRS、ドメインイベント。危機シナリオに耐える構造化の実践。", "body_html_en_us": "\u003ch1>Clean Architecture + CQRS in the SOS Location backend\u003c/h1>\n\u003cp>In April 2026, the commit \u003ccode>refactor: migrate all page components to the domains/operations directory\u003c/code> marked the completion of a deep backend refactor in SOS Location. It was not just about moving folders around; it was about rethinking how code should \u003cem>grow\u003c/em> when lives depend on its correctness.\u003c/p>\n\u003ch2>Why Clean Architecture in a disaster-response system?\u003c/h2>\n\u003cp>Catastrophe-response systems have an unusual profile:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Unpredictable spikes\u003c/strong> — a magnitude-7 earthquake can multiply traffic by 10 in seconds.\u003c/li> \u003cli>\u003cstrong>Multiple entry agents\u003c/strong> — external APIs, CLI agents, SignalR and scheduled jobs.\u003c/li> \u003cli>\u003cstrong>Mandatory auditability\u003c/strong> — every state mutation needs \u003ccode>trace_id\u003c/code>, \u003ccode>actor\u003c/code> and \u003ccode>reason\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Continuous evolution\u003c/strong> — phase 8, 9, 10... the system grows with the project.\u003c/li>\u003c/ol>\n\u003cp>Clean Architecture separates these concerns into layers with one-way dependencies:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>Domain         → business logic only, no infrastructure imports\nApplication    → use cases (Commands, Queries, Handlers)\nInfrastructure → EF Core, PostGIS, SignalR, Keycloak\nPresentation   → ASP.NET Core Controllers, Minimal API\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>CQRS with MediatR\u003c/h2>\n\u003cp>CQRS (Command Query Responsibility Segregation) splits write operations (Commands) from read operations (Queries).\u003c/p>\n\u003ch3>Command: create incident\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Application/Commands/CreateIncidentCommand.cs\npublic record CreateIncidentCommand(\n    string EventId,\n    IncidentType Type,\n    int Severity,\n    GeoJsonGeometry Location,\n    DateTimeOffset OccurredAt,\n    string ActorId\n) : IRequest&lt;Result&lt;IncidentDto&gt;&gt;;\n\npublic class CreateIncidentHandler : IRequestHandler&lt;CreateIncidentCommand, Result&lt;IncidentDto&gt;&gt;\n{\n    private readonly IIncidentRepository _incidents;\n    private readonly IEventBus _eventBus;\n    private readonly IAuditLog _audit;\n\n    public async Task&lt;Result&lt;IncidentDto&gt;&gt; Handle(\n        CreateIncidentCommand cmd, CancellationToken ct)\n    {\n        // Domain validation\n        if (cmd.Severity &lt; 1 || cmd.Severity &gt; 10)\n            return Result.Fail(&quot;Severity must be between 1 and 10&quot;);\n\n        var incident = Incident.Create(\n            cmd.EventId, cmd.Type, cmd.Severity,\n            cmd.Location, cmd.OccurredAt);\n\n        await _incidents.AddAsync(incident, ct);\n\n        // Audit trail — always\n        await _audit.RecordAsync(new AuditEntry(\n            Actor:   cmd.ActorId,\n            Action:  &quot;incident.created&quot;,\n            TraceId: Activity.Current?.TraceId.ToString() ?? Guid.NewGuid().ToString(),\n            Payload: JsonSerializer.Serialize(incident)\n        ), ct);\n\n        // Domain event: notify SignalR, ML and critical ops\n        if (incident.Severity &gt;= 7)\n            _eventBus.Publish(new CriticalIncidentCreated(incident));\n\n        return Result.Ok(incident.ToDto());\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>Query: spatial search with PostGIS\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Application/Queries/GetIncidentsInRadiusQuery.cs\npublic record GetIncidentsInRadiusQuery(\n    double Lat, double Lon, double RadiusKm\n) : IRequest&lt;IReadOnlyList&lt;IncidentDto&gt;&gt;;\n\npublic class GetIncidentsInRadiusHandler\n    : IRequestHandler&lt;GetIncidentsInRadiusQuery, IReadOnlyList&lt;IncidentDto&gt;&gt;\n{\n    private readonly SosDbContext _db;\n\n    public async Task&lt;IReadOnlyList&lt;IncidentDto&gt;&gt; Handle(\n        GetIncidentsInRadiusQuery q, CancellationToken ct)\n    {\n        var point = new Point(q.Lon, q.Lat) { SRID = 4326 };\n        double radiusMeters = q.RadiusKm * 1000;\n\n        return await _db.Incidents\n            .Where(i =&gt; i.Location.IsWithinDistance(point, radiusMeters))\n            .OrderByDescending(i =&gt; i.Severity)\n            .ThenByDescending(i =&gt; i.OccurredAt)\n            .Select(i =&gt; i.ToDto())\n            .ToListAsync(ct);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Domain events for critical operations\u003c/h2>\n\u003cp>The domain publishes events without knowing who consumes them. Infrastructure wires the reactions:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Domain/Events/CriticalIncidentCreated.cs\npublic record CriticalIncidentCreated(Incident Incident) : IDomainEvent;\n\n// Infrastructure/EventHandlers/NotifyOpsOnCriticalIncident.cs\npublic class NotifyOpsOnCriticalIncident\n    : INotificationHandler&lt;CriticalIncidentCreated&gt;\n{\n    private readonly IHubContext&lt;OpsHub&gt; _hub;\n    private readonly IRiskModelClient _riskModel;\n\n    public async Task Handle(CriticalIncidentCreated e, CancellationToken ct)\n    {\n        // 1. Notify the real-time dashboard via SignalR\n        await _hub.Clients.Group(&quot;ops-comma

zation technology, not for production use.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Developers working on Linux or Windows but needing macOS testing face an access gap. Containerized virtualization reduces friction by creating disposable macOS environments, albeit with performance and licensing constraints.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Docker container with QEMU as the hypervisor, KVM for hardware acceleration and optional GPU passthrough. The macOS image is mounted as a QCOW2 virtual disk inside the container.\u003c/p>", "body_html_ja_jp": "\u003cp>QEMU / KVM を用いて Docker コンテナ内で macOS を動かすプロジェクトのフォークです。\u003c/p>\n\u003ch2>動機\u003c/h2>\n\u003cp>クロスプラットフォーム開発では、Apple ハードウェアがなくても macOS 上での検証が必要になることがあります。このプロジェクトは、次のための使い捨て macOS 環境を作れるようにします。\u003c/p>\n\u003cul>\u003cli>互換性テスト\u003c/li> \u003cli>Linux CI からの iOS / macOS ビルド\u003c/li> \u003cli>macOS 専用 API の実験\u003c/li>\u003c/ul>\n\u003ch2>仕組み\u003c/h2>\n\u003cp>コンテナは QEMU と KVM アクセラレーションを用いて必要なハードウェアを仮想化し、Apple デバイスのエミュレーションも含みます。macOS イメージはコンテナ内の仮想ディスクから読み込まれます。\u003c/p>\n\u003ch2>注意点\u003c/h2>\n\u003cp>macOS 仮想化は Apple のライセンス規約（EULA）の対象であり、実行は正規 Apple ハードウェアに制限されます。このフォークは本番利用ではなく、仮想化技術の研究目的で保持しています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>Linux / Windows で開発しつつ macOS 検証が必要な開発者には、アクセス面のギャップがあります。コンテナ化された仮想化は、性能面とライセンス面の制約はあるものの、使い捨て macOS 環境を作ることで摩擦を下げます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>Docker コンテナ内で、QEMU を hypervisor、KVM をハードウェア高速化として使用し、必要に応じて GPU passthrough も利用できます。macOS イメージは QCOW2 仮想ディスクとしてマウントされます。\u003c/p>", "body_html_ja": "\u003cp>QEMU / KVM を用いて Docker コンテナ内で macOS を動かすプロジェクトのフォークです。\u003c/p>\n\u003ch2>動機\u003c/h2>\n\u003cp>クロスプラットフォーム開発では、Apple ハードウェアがなくても macOS 上での検証が必要になることがあります。このプロジェクトは、次のための使い捨て macOS 環境を作れるようにします。\u003c/p>\n\u003cul>\u003cli>互換性テスト\u003c/li> \u003cli>Linux CI からの iOS / macOS ビルド\u003c/li> \u003cli>macOS 専用 API の実験\u003c/li>\u003c/ul>\n\u003ch2>仕組み\u003c/h2>\n\u003cp>コンテナは QEMU と KVM アクセラレーションを用いて必要なハードウェアを仮想化し、Apple デバイスのエミュレーションも含みます。macOS イメージはコンテナ内の仮想ディスクから読み込まれます。\u003c/p>\n\u003ch2>注意点\u003c/h2>\n\u003cp>macOS 仮想化は Apple のライセンス規約（EULA）の対象であり、実行は正規 Apple ハードウェアに制限されます。このフォークは本番利用ではなく、仮想化技術の研究目的で保持しています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>Linux / Windows で開発しつつ macOS 検証が必要な開発者には、アクセス面のギャップがあります。コンテナ化された仮想化は、性能面とライセンス面の制約はあるものの、使い捨て macOS 環境を作ることで摩擦を下げます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>Docker コンテナ内で、QEMU を hypervisor、KVM をハードウェア高速化として使用し、必要に応じて GPU passthrough も利用できます。macOS イメージは QCOW2 仮想ディスクとしてマウントされます。\u003c/p>"}, {"id": "project-maplebr", "kind": "project", "status": "research", "stack": ["Makefile", "C++", "Networking"], "url": "/projects/maplebr/", "resolved_url": "https://nhmatsumoto.github.io/projects/maplebr/", "repo_url": "https://github.com/nhmatsumoto/MapleBR", "has_math": false, "name": "MapleBR", "headline": "Projeto MapleBR — servidor e ferramentas para o ecossistema MapleStory.", "summary": "Projeto com ferramentas e configurações para servidores MapleStory, incluindo scripts de build e automação via Makefile.", "body_html": "\u003cp>Projeto de servidor e ferramentas para o universo MapleStory, com automação de build via Makefile.\u003c/p>\n\u003ch2>Contexto\u003c/h2>\n\u003cp>MapleStory é um MMORPG que possui uma comunidade ativa de desenvolvimento de servidores privados. Este projeto reúne ferramentas, scripts de compilação e configurações para manutenção de um ambiente de servidor.\u003c/p>\n\u003ch2>Aspectos técnicos\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Build system\u003c/strong> com Makefile para compilação de componentes C++\u003c/li> \u003cli>\u003cstrong>Networking\u003c/strong> — protocolo de comunicação cliente-servidor customizado\u003c/li> \u003cli>\u003cstrong>Gestão de dados\u003c/strong> — handling de arquivos de dados do jogo (WZ files)\u003c/li> \u003cli>\u003cstrong>Automação\u003c/strong> — scripts para deploy e manutenção do servidor\u003c/li>\u003c/ul>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Servidores de jogos exigem compilação e configuração complexa de múltiplos componentes. O Makefile centraliza o processo de build e garante reprodutibilidade na construção do ambiente.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Servidor multi-threaded em C++ com protocolo de rede proprietário. O Makefile orquestra a compilação de módulos (login server, game server, channel server) e a preparação de dados estáticos do jogo.\u003c/p>", "headline_en_us": "MapleBR project — server and tooling for the MapleStory ecosystem.", "headline_ja_jp": "MapleBR プロジェクト — MapleStory エコシステムのサーバーとツール群。", "summary_en_us": "Project with tooling and configuration for MapleStory servers, including build scripts and Makefile-based automation.", "summary_ja_jp": "MapleStory サーバー向けのツールと構成を含むプロジェクト。ビルドスクリプトと Makefile による自動化を備える。", "body_html_en_us": "\u003cp>Server-and-tooling project for the MapleStory universe, with build automation orchestrated through Makefiles.\u003c/p>\n\u003ch2>Context\u003c/h2>\n\u003cp>MapleStory has a long-standing private-server development community. This project brings together tooling, compilation scripts and configuration needed to maintain a server environment.\u003c/p>\n\u003ch2>Technical aspects\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Build system\u003c/strong> with Makefiles for compiling C++ components\u003c/li> \u003cli>\u003cstrong>Networking\u003c/strong> — a custom client-server communication protocol\u003c/li> \u003cli>\u003cstrong>Data management\u003c/strong> — handling of game data files (WZ files)\u003c/li> \u003cli>\u003cstrong>Automation\u003c/strong> — scripts for deployment and server maintenance\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Game servers require a complex build and configuration flow across multiple components. The Makefile centralizes that process and improves reproducibility when bringing the environment up.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Multi-threaded C++ server with a proprietary network protocol. The Makefile orchestrates the build of modules such as login, game and channel servers, along with preparation of static game data.\u003c/p>", "body_html_en": "\u003cp>Server-and-tooling project for the MapleStory universe, with build automation orchestrated through Makefiles.\u003c/p>\n\u003ch2>Context\u003c/h2>\n\u003cp>MapleStory has a long-standing private-server development community. This project brings together tooling, compilation scripts and configuration needed to maintain a server environment.\u003c/p>\n\u003ch2>Technical aspects\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Build system\u003c/strong> with Makefiles for compiling C++ components\u003c/li> \u003cli>\u003cstrong>Networking\u003c/strong> — a custom client-server communication protocol\u003c/li> \u003cli>\u003cstrong>Data management\u003c/strong> — handling of game data files (WZ files)\u003c/li> \u003cli>\u003cstrong>Automation\u003c/strong> — scripts for deployment and server maintenance\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Game servers require a complex build and configuration flow across multiple components. The Makefile centralizes that process and improves reproducibility when bringing the environment up.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Multi-threaded C++ server with a proprietary network protocol. The Makefile orchestrates the build of modules such as login, game and channel servers, along with preparation of static game data.\u003c/p>", "body_html_ja_jp": "\u003cp>MapleStory のサーバーと周辺ツールを扱うプロジェクトで、Makefile によるビルド自動化を中心に構成されています。\u003c/p>\n\u003ch2>背景\u003c/h2>\n\u003cp>MapleStory には長く続くプライベートサーバー開発コミュニティがあります。このプロジェクトは、そのサーバー環境を維持するためのツール、コンパイル・スクリプト、設定をまとめたものです。\u003c/p>\n\u003ch2>技術的な要素\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Build system\u003c/strong> — C++ コンポーネントをコンパイルする Makefile\u003c/li> \u003cli>\u003cstrong>Networking\u003c/strong> — クライアント・サーバ間の独自通信プロトコル\u003c/li> \u003cli>\u003cstrong>Data management\u003c/strong> — ゲームデータ（WZ files）の取り扱い\u003c/li> \u003cli>\u003cstrong>Automation\u003c/strong> — デプロイと保守のためのスクリプト\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>ゲームサーバーは複数コンポーネントにまたがる複雑なビルド・設定フローを必要とします。Makefile はその手順を一元化し、環境構築の再現性を高めます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>独自ネットワークプロトコルを持つマルチスレッド C++ サーバーです。Makefile が login server、game server、channel server などのモジュールのビルドと、静的ゲームデータの準備をまとめて制御します。\u003c/p>", "body_html_ja": "\u003cp>MapleStory のサーバーと周辺ツールを扱うプロジェクトで、Makefile によるビルド自動化を中心に構成されています。\u003c/p>\n\u003ch2>背景\u003c/h2>\n\u003cp>MapleStory には長く続くプライベートサーバー開発コミュニティがあります。このプロジェクトは、そのサーバー環境を維持するためのツール、コンパイル・スクリプト、設定をまとめたものです。\u003c/p>\n\u003ch2>技術的な要素\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Build system\u003c/strong> — C++ コンポーネントをコンパイルする Makefile\u003c/li> \u003cli>\u003cstrong>Networking\u003c/strong> — クライアント・サーバ間の独自通信プロトコル\u003c/li> \u003cli>\u003cstrong>Data management\u003c/strong> — ゲームデータ（WZ files）の取り扱い\u003c/li> \u003cli>\u003cstrong>Automation\u003c/strong> — デプロイと保守のためのスクリプト\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>ゲームサーバーは複数コンポーネントにまたがる複雑なビルド・設定フローを必要とします。Makefile はその手順を一元化し、環境構築の再現性を高めます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>独自ネットワークプロトコルを持つマルチスレッド C++ サーバーです。Makefile が login server、game server、channel server などのモジュールのビルドと、静的ゲームデータの準備をまとめて制御します。\u003c/p>"}, {"id": "project-mermaid-live-editor", "kind": "project", "status": "research", "stack": ["Svelte", "TypeScript", "Mermaid", "Monaco Editor"], "url": "/projects/mermaid-live-editor/", "resolved_url": "https://nhmatsumoto.github.io/projects/mermaid-live-editor/", "repo_url": "https://github.com/nhmatsumoto/mermaid-live-editor", "has_math": false, "name": "mermaid-live-editor", "headline": "Editor ao vivo para criação, preview e compartilhamento de diagramas Mermaid.", "summary": "Fork do Mermaid Live Editor — aplicação web para edição em tempo real de diagramas Mermaid com preview instantâneo e exportação.", "body_html": "\u003cp>Fork do Mermaid Live Editor, a aplicação web oficial para criação e preview de diagramas Mermaid em tempo real.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Editor com syntax highlighting\u003c/strong> via Monaco Editor (mesmo do VS Code)\u003c/li> \u003cli>\u003cstrong>Preview instantâneo\u003c/strong> — renderização em tempo real conforme o texto é editado\u003c/li> \u003cli>\u003cstrong>Exportação\u003c/strong> — download em SVG, PNG e links compartilháveis\u003c/li> \u003cli>\u003cstrong>Templates\u003c/strong> — exemplos pré-configurados para cada tipo de diagrama\u003c/li> \u003cli>\u003cstrong>Temas\u003c/strong> — preview com diferentes temas (default, dark, forest, neutral)\u003c/li>\u003c/ul>\n\u003ch2>Uso prático\u003c/h2>\n\u003cp>Ferramenta complementar ao fork do \u003cstrong>mermaid\u003c/strong> para desenvolvimento e teste de diagramas antes de incorporá-los aos posts e documentos do Technical Knowledge OS.\u003c/p>\n\u003ch2>Stack\u003c/h2>\n\u003cp>Construído com Svelte para uma experiência de UI reativa e leve, com TypeScript para type safety e Monaco Editor para a experiência de edição.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Escrever diagramas Mermaid sem feedback visual é lento e propenso a erros de sintaxe. O live editor resolve isso com preview instantâneo, reduzindo o ciclo de iteração de minutos para segundos.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>SPA em Svelte com três painéis: editor (Monaco), preview (Mermaid renderer) e configuração (tema, tipo de diagrama). Estado compartilhado via Svelte stores. Exportação feita via serialização do SVG renderizado.\u003c/p>", "headline_en_us": "Live editor for creating, previewing and sharing Mermaid diagrams.", "headline_ja_jp": "Mermaid ダイアグラムを作成・プレビュー・共有するためのライブエディタ。", "summary_en_us": "Fork of Mermaid Live Editor — a web app for real-time Mermaid diagram editing with instant preview and export.", "summary_ja_jp": "Mermaid Live Editor のフォーク。Mermaid 図をリアルタイム編集し、即時プレビューとエクスポートを行う Web アプリ。", "body_html_en_us": "\u003cp>Fork of Mermaid Live Editor, the official web application for creating and previewing Mermaid diagrams in real time.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Editor with syntax highlighting\u003c/strong> powered by Monaco Editor\u003c/li> \u003cli>\u003cstrong>Instant preview\u003c/strong> — diagrams render live while the text changes\u003c/li> \u003cli>\u003cstrong>Export\u003c/strong> — download as SVG, PNG or shareable links\u003c/li> \u003cli>\u003cstrong>Templates\u003c/strong> — starter examples for each diagram type\u003c/li> \u003cli>\u003cstrong>Themes\u003c/strong> — preview under different visual themes\u003c/li>\u003c/ul>\n\u003ch2>Practical use\u003c/h2>\n\u003cp>It complements the \u003cstrong>mermaid\u003c/strong> fork as the place to prototype and validate diagrams before embedding them into Technical Knowledge OS posts and documents.\u003c/p>\n\u003ch2>Stack\u003c/h2>\n\u003cp>Built with Svelte for a lightweight reactive UI, TypeScript for type safety and Monaco for the editing experience.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Writing Mermaid without visual feedback is slow and error-prone. The live editor shortens the iteration loop from minutes to seconds by rendering diagrams immediately.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Svelte SPA with three panels: editor (Monaco), preview (Mermaid renderer) and configuration (theme and diagram options). Shared state lives in Svelte stores. Export is done by serializing the rendered SVG.\u003c/p>", "body_html_en": "\u003cp>Fork of Mermaid Live Editor, the official web application for creating and previewing Mermaid diagrams in real time.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Editor with syntax highlighting\u003c/strong> powered by Monaco Editor\u003c/li> \u003cli>\u003cstrong>Instant preview\u003c/strong> — diagrams render live while the text changes\u003c/li> \u003cli>\u003cstrong>Export\u003c/strong> — download as SVG, PNG or shareable links\u003c/li> \u003cli>\u003cstrong>Templates\u003c/strong> — starter examples for each diagram type\u003c/li> \u003cli>\u003cstrong>Themes\u003c/strong> — preview under different visual themes\u003c/li>\u003c/ul>\n\u003ch2>Practical use\u003c/h2>\n\u003cp>It complements the \u003cstrong>mermaid\u003c/strong> fork as the place to prototype and validate diagrams before embedding them into Technical Knowledge OS posts and documents.\u003c/p>\n\u003ch2>Stack\u003c/h2>\n\u003cp>Built with Svelte for a lightweight reactive UI, TypeScript for type safety and Monaco for the editing experience.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Writing Mermaid without visual feedback is slow and error-prone. The live editor shortens the iteration loop from minutes to seconds by rendering diagrams immediately.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Svelte SPA with three panels: editor (Monaco), preview (Mermaid renderer) and configuration (theme and diagram options). Shared state lives in Svelte stores. Export is done by serializing the rendered SVG.\u003c/p>", "body_html_ja_jp": "\u003cp>Mermaid 図をリアルタイムに作成・プレビューできる公式 Web アプリ、Mermaid Live Editor のフォークです。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>syntax highlighting 付きエディタ\u003c/strong> — Monaco Editor ベース\u003c/li> \u003cli>\u003cstrong>instant preview\u003c/strong> — テキスト変更に合わせて即時描画\u003c/li> \u003cli>\u003cstrong>export\u003c/strong> — SVG、PNG、共有リンクとして出力\u003c/li> \u003cli>\u003cstrong>template\u003c/strong> — 図種ごとのスターター例\u003c/li> \u003cli>\u003cstrong>theme\u003c/strong> — 複数の見た目でプレビュー可能\u003c/li>\u003c/ul>\n\u003ch2>実用面\u003c/h2>\n\u003cp>Technical Knowledge OS の記事や文書に組み込む前に、図を試作・検証する場所として \u003cstrong>mermaid\u003c/strong> フォークを補完します。\u003c/p>\n\u003ch2>スタック\u003c/h2>\n\u003cp>軽量なリアクティブ UI のための Svelte、型安全のための TypeScript、編集体験のための Monaco を採用しています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>視覚的なフィードバックなしで Mermaid を書くのは遅く、構文ミスも起こしやすくなります。live editor は即時描画によって、その反復サイクルを数分から数秒へ短縮します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>Svelte SPA で、editor（Monaco）、preview（Mermaid renderer）、configuration（theme と diagram 設定）の 3 パネル構成です。共有状態は Svelte store で管理し、export は描画済み SVG を直列化して行います。\u003c/p>", "body_html_ja": "\u003cp>Mermaid 図をリアルタイムに作成・プレビューできる公式 Web アプリ、Mermaid Live Editor のフォークです。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>syntax highlighting 付きエディタ\u003c/strong> — Monaco Editor ベース\u003c/li> \u003cli>\u003cstrong>instant preview\u003c/strong> — テキスト変更に合わせて即時描画\u003c/li> \u003cli>\u003cstrong>export\u003c/strong> — SVG、PNG、共有リンクとして出力\u003c/li> \u003cli>\u003cstrong>template\u003c/strong> — 図種ごとのスターター例\u003c/li> \u003cli>\u003cstrong>theme\u003c/strong> — 複数の見た目でプレビュー可能\u003c/li>\u003c/ul>\n\u003ch2>実用面\u003c/h2>\n\u003cp>Technical Knowledge OS の記事や文書に組み込む前に、図を試作・検証する場所として \u003cstrong>mermaid\u003c/strong> フォークを補完します。\u003c/p>\n\u003ch2>スタック\u003c/h2>\n\u003cp>軽量なリアクティブ UI のための Svelte、型安全のための TypeScript、編集体験のための Monaco を採用しています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>視覚的なフィードバックなしで Mermaid を書くのは遅く、構文ミスも起こしやすくなります。live editor は即時描画によって、その反復サイクルを数分から数秒へ短縮します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>Svelte SPA で、editor（Monaco）、preview（Mermaid renderer）、configuration（theme と diagram 設定）の 3 パネル構成です。共有状態は Svelte store で管理し、export は描画済み SVG を直列化して行います。\u003c/p>"}, {"id": "project-mermaid", "kind": "project", "status": "research", "stack": ["JavaScript", "SVG", "Parsing", "Diagrams"], "url": "/projects/mermaid/", "resolved_url": "https://nhmatsumoto.github.io/projects/mermaid/", "repo_url": "https://github.com/nhmatsumoto/mermaid", "has_math": false, "name": "mermaid", "headline": "Geração de diagramas como fluxogramas e diagramas de sequência a partir de texto, similar a markdown.", "summary": "Fork do Mermaid.js — ferramenta de geração de diagramas a partir de texto que é usada extensivamente no Technical Knowledge OS para documentação visual.", "body_html": "\u003cp>Fork do Mermaid.js, a biblioteca de geração de diagramas a partir de texto que é integrada nativamente no Technical Knowledge OS.\u003c/p>\n\u003ch2>Uso no ecossistema\u003c/h2>\n\u003cp>O Mermaid é utilizado em posts, documentos e projetos para renderizar diagramas técnicos diretamente no conteúdo markdown:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Flowcharts\u003c/strong> — fluxos de processamento e pipelines\u003c/li> \u003cli>\u003cstrong>Sequence diagrams\u003c/strong> — interações entre serviços\u003c/li> \u003cli>\u003cstrong>Class diagrams\u003c/strong> — modelagem de domínio\u003c/li> \u003cli>\u003cstrong>ER diagrams\u003c/strong> — esquemas de banco de dados\u003c/li> \u003cli>\u003cstrong>Gantt charts\u003c/strong> — cronogramas de projeto\u003c/li>\u003c/ul>\n\u003ch2>Integração\u003c/h2>\n\u003cp>O render engine do blog detecta blocos de código marcados como \u003ccode>mermaid\u003c/code> e os renderiza automaticamente como SVG no lado do cliente. A biblioteca é carregada via CDN com tema escuro configurado para o design do site.\u003c/p>\n\u003ch2>Exemplo\u003c/h2>\n\u003cp>Um bloco como:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>graph LR\n  A[Input] --&gt; B[Process]\n  B --&gt; C[Output]\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>É renderizado como um diagrama de fluxo interativo diretamente na página.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Documentação técnica com diagramas estáticos (imagens) é difícil de manter e versionar. Mermaid resolve isso tratando diagramas como código: versionáveis, diff-friendly e atualizados automaticamente quando o texto muda.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Parser PEG.js que converte sintaxe textual em AST, renderer que transforma AST em SVG via D3.js. Suporta temas customizáveis e integração com markdown parsers via blocos de código fenced.\u003c/p>", "headline_en_us": "Generation of diagrams (flowcharts, sequence diagrams, etc.) from text, similar to markdown.", "headline_ja_jp": "Markdown のようにテキストからフローチャートやシーケンス図などのダイアグラムを生成。", "summary_en_us": "Fork of Mermaid.js — a text-based diagram generator used extensively across the Technical Knowledge OS for visual documentation.", "summary_ja_jp": "Mermaid.js のフォーク。Technical Knowledge OS の可視的ドキュメンテーション全体で広く使われる、テキストベースのダイアグラム生成ツール。", "body_html_en_us": "\u003cp>Fork of Mermaid.js, the text-to-diagram library integrated natively into Technical Knowledge OS.\u003c/p>\n\u003ch2>Use inside the ecosystem\u003c/h2>\n\u003cp>Mermaid is used across posts, documents and project pages to render technical diagrams directly from markdown content:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Flowcharts\u003c/strong> — processing flows and pipelines\u003c/li> \u003cli>\u003cstrong>Sequence diagrams\u003c/strong> — interactions between services\u003c/li> \u003cli>\u003cstrong>Class diagrams\u003c/strong> — domain modeling\u003c/li> \u003cli>\u003cstrong>ER diagrams\u003c/strong> — database schemas\u003c/li> \u003cli>\u003cstrong>Gantt charts\u003c/strong> — project schedules\u003c/li>\u003c/ul>\n\u003ch2>Integration\u003c/h2>\n\u003cp>The blog rendering engine detects fenced code blocks marked as \u003ccode>mermaid\u003c/code> and renders them automatically to SVG on the client. The library is loaded via CDN with theming adapted to the site&#x27;s design.\u003c/p>\n\u003ch2>Example\u003c/h2>\n\u003cp>A block such as:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>graph LR\n  A[Input] --&gt; B[Process]\n  B --&gt; C[Output]\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>is rendered directly as an interactive flow diagram in the page.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Technical documentation based on static diagram images is hard to maintain and diff. Mermaid solves that by treating diagrams as code: versionable, reviewable and updated automatically when the text changes.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>A PEG.js parser converts textual syntax into an AST, and the renderer turns that AST into SVG through D3.js. The library supports custom themes and integration with markdown parsers through fenced code blocks.\u003c/p>", "body_html_en": "\u003cp>Fork of Mermaid.js, the text-to-diagram library integrated natively into Technical Knowledge OS.\u003c/p>\n\u003ch2>Use inside the ecosystem\u003c/h2>\n\u003cp>Mermaid is used across posts, documents and project pages to render technical diagrams directly from markdown content:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Flowcharts\u003c/strong> — processing flows and pipelines\u003c/li> \u003cli>\u003cstrong>Sequence diagrams\u003c/strong> — interactions between services\u003c/li> \u003cli>\u003cstrong>Class diagrams\u003c/strong> — domain modeling\u003c/li> \u003cli>\u003cstrong>ER diagrams\u003c/strong> — database schemas\u003c/li> \u003cli>\u003cstrong>Gantt charts\u003c/strong> — project schedules\u003c/li>\u003c/ul>\n\u003ch2>Integration\u003c/h2>\n\u003cp>The blog rendering engine detects fenced code blocks marked as \u003ccode>mermaid\u003c/code> and renders them automatically to SVG on the client. The library is loaded via CDN with theming adapted to the site&#x27;s design.\u003c/p>\n\u003ch2>Example\u003c/h2>\n\u003cp>A block such as:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>graph LR\n  A[Input] --&gt; B[Process]\n  B --&gt; C[Output]\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>is rendered directly as an interactive flow diagram in the page.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Technical documentation based on static diagram images is hard to maintain and diff. Mermaid solves that by treating diagrams as code: versionable, reviewable and updated automatically when the text changes.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>A PEG.js parser converts textual syntax into an AST, and the renderer turns that AST into SVG through D3.js. The library supports custom themes and integration with markdown parsers through fenced code blocks.\u003c/p>", "body_html_ja_jp": "\u003cp>Technical Knowledge OS にネイティブ統合されているテキストベース図表ライブラリ Mermaid.js のフォークです。\u003c/p>\n\u003ch2>エコシステム内での利用\u003c/h2>\n\u003cp>Mermaid は記事、文書、プロジェクト・ページ全体で使われ、markdown から技術図を直接描画します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Flowcharts\u003c/strong> — 処理フローとパイプライン\u003c/li> \u003cli>\u003cstrong>Sequence diagrams\u003c/strong> — サービス間相互作用\u003c/li> \u003cli>\u003cstrong>Class diagrams\u003c/strong> — ドメインモデリング\u003c/li> \u003cli>\u003cstrong>ER diagrams\u003c/strong> — DB スキーマ\u003c/li> \u003cli>\u003cstrong>Gantt charts\u003c/strong> — プロジェクト日程\u003c/li>\u003c/ul>\n\u003ch2>統合方法\u003c/h2>\n\u003cp>ブログのレンダリングエンジンは \u003ccode>mermaid\u003c/code> と付いた fenced code block を検出し、クライアント側で自動的に SVG として描画します。ライブラリは CDN 経由で読み込み、テーマはサイトのデザインに合わせて調整しています。\u003c/p>\n\u003ch2>例\u003c/h2>\n\u003cp>次のようなブロックは:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>graph LR\n  A[Input] --&gt; B[Process]\n  B --&gt; C[Output]\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>ページ上でそのままインタラクティブなフローダイアグラムとして表示されます。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>静的画像に依存する技術ドキュメントは保守しづらく、差分も追いにくいものです。Mermaid は図をコードとして扱うことでそれを解決します。バージョン管理でき、レビューしやすく、テキスト変更に合わせて自動更新されます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>PEG.js parser がテキスト構文を AST に変換し、renderer がその AST を D3.js 経由で SVG に変換します。カスタムテーマや fenced code block を通じた markdown parser 連携もサポートしています。\u003c/p>", "body_html_ja": "\u003cp>Technical Knowledge OS にネイティブ統合されているテキストベース図表ライブラリ Mermaid.js のフォークです。\u003c/p>\n\u003ch2>エコシステム内での利用\u003c/h2>\n\u003cp>Mermaid は記事、文書、プロジェクト・ページ全体で使われ、markdown から技術図を直接描画します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Flowcharts\u003c/strong> — 処理フローとパイプライン\u003c/li> \u003cli>\u003cstrong>Sequence diagrams\u003c/strong> — サービス間相互作用\u003c/li> \u003cli>\u003cstrong>Class diagrams\u003c/strong> — ドメインモデリング\u003c/li> \u003cli>\u003cstrong>ER diagrams\u003c/strong> — DB スキーマ\u003c/li> \u003cli>\u003cstrong>Gantt charts\u003c/strong> — プロジェクト日程\u003c/li>\u003c/ul>\n\u003ch2>統合方法\u003c/h2>\n\u003cp>ブログのレンダリングエンジンは \u003ccode>mermaid\u003c/code> と付いた fenced code block を検出し、クライアント側で自動的に SVG として描画します。ライブラリは CDN 経由で読み込み、テーマはサイトのデザインに合わせて調整しています。\u003c/p>\n\u003ch2>例\u003c/h2>\n\u003cp>次のようなブロックは:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>graph LR\n  A[Input] --&gt; B[Process]\n  B --&gt; C[Output]\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>ページ上でそのままインタラクティブなフローダイアグラムとして表示されます。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>静的画像に依存する技術ドキュメントは保守しづらく、差分も追いにくいものです。Mermaid は図をコードとして扱うことでそれを解決します。バージョン管理でき、レビューしやすく、テキスト変更に合わせて自動更新されます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>PEG.js parser がテキスト構文を AST に変換し、renderer がその AST を D3.js 経由で SVG に変換します。カスタムテーマや fenced code block を通じた markdown parser 連携もサポートしています。\u003c/p>"}, {"id": "project-nhmatsumoto-exception-middleware", "kind": "project", "status": "research", "stack": ["C#", ".NET Core", "Middleware", "REST API"], "url": "/projects/nhmatsumoto-exception-middleware/", "resolved_url": "https://nhmatsumoto.github.io/projects/nhmatsumoto-exception-middleware/", "repo_url": "https://github.com/nhmatsumoto/nhmatsumoto.exception.middleware", "has_math": false, "name": "nhmatsumoto.exception.middleware", "headline": "GlobalExceptionMiddleware para .NET Core — tratamento centralizado de exceções em APIs.", "summary": "Middleware de tratamento global de exceções para ASP.NET Core, padronizando respostas de erro e logging em aplicações web.", "body_html": "\u003cp>Middleware de tratamento global de exceções para aplicações ASP.NET Core, projetado para padronizar respostas de erro em APIs REST.\u003c/p>\n\u003ch2>O que faz\u003c/h2>\n\u003cp>Intercepta todas as exceções não tratadas no pipeline de requisições e as converte em respostas HTTP padronizadas:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Exceções de domínio\u003c/strong> → 400 Bad Request com mensagem específica\u003c/li> \u003cli>\u003cstrong>Exceções de validação\u003c/strong> → 422 Unprocessable Entity com detalhes\u003c/li> \u003cli>\u003cstrong>Exceções de autenticação\u003c/strong> → 401/403 com contexto\u003c/li> \u003cli>\u003cstrong>Exceções não mapeadas\u003c/strong> → 500 Internal Server Error com ID de correlação\u003c/li>\u003c/ul>\n\u003ch2>Por que um middleware dedicado\u003c/h2>\n\u003cp>Sem tratamento centralizado, cada controller precisa implementar seus próprios try/catch, levando a inconsistências na formatação de erros e duplicação de lógica de logging. O middleware garante:\u003c/p>\n\u003cul>\u003cli>Formato consistente (RFC 7807 Problem Details)\u003c/li> \u003cli>Log estruturado com correlation ID\u003c/li> \u003cli>Supressão de stack traces em produção\u003c/li> \u003cli>Extensibilidade via mapeamento de tipos de exceção\u003c/li>\u003c/ul>\n\u003ch2>Uso no ecossistema\u003c/h2>\n\u003cp>Utilizado nos backends do \u003cstrong>SplitCosts\u003c/strong>, \u003cstrong>Financial\u003c/strong> e outros projetos .NET como pacote reutilizável.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>APIs sem tratamento centralizado de erros vazam detalhes internos, retornam formatos inconsistentes e dificultam o debugging. O middleware resolve isso com um ponto único de interceptação que padroniza todas as respostas de erro.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Middleware ASP.NET Core registrado no início do pipeline (app.UseMiddleware). Utiliza um dicionário de mapeamento Exception Type → HTTP Status Code, extensível via configuração. Integra com ILogger para log estruturado.\u003c/p>", "headline_en_us": "GlobalExceptionMiddleware for .NET Core — centralized exception handling for APIs.", "headline_ja_jp": ".NET Core 向け GlobalExceptionMiddleware — API の集中例外処理。", "summary_en_us": "Global exception-handling middleware for ASP.NET Core, standardizing error responses and logging across web applications.", "summary_ja_jp": "ASP.NET Core 向けのグローバル例外処理ミドルウェア。エラーレスポンスとログを Web アプリ全体で標準化する。", "body_html_en_us": "\u003cp>Global exception-handling middleware for ASP.NET Core applications, designed to standardize error responses in REST APIs.\u003c/p>\n\u003ch2>What it does\u003c/h2>\n\u003cp>It intercepts all unhandled exceptions in the request pipeline and converts them into standardized HTTP responses:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Domain exceptions\u003c/strong> → 400 Bad Request with a specific message\u003c/li> \u003cli>\u003cstrong>Validation exceptions\u003c/strong> → 422 Unprocessable Entity with detailed information\u003c/li> \u003cli>\u003cstrong>Authentication exceptions\u003c/strong> → 401 / 403 with context\u003c/li> \u003cli>\u003cstrong>Unmapped exceptions\u003c/strong> → 500 Internal Server Error with a correlation ID\u003c/li>\u003c/ul>\n\u003ch2>Why use a dedicated middleware\u003c/h2>\n\u003cp>Without centralized handling, each controller ends up with its own try/catch blocks, resulting in inconsistent error formats and duplicated logging logic. The middleware guarantees:\u003c/p>\n\u003cul>\u003cli>Consistent response format (RFC 7807 Problem Details)\u003c/li> \u003cli>Structured logging with correlation IDs\u003c/li> \u003cli>Suppression of stack traces in production\u003c/li> \u003cli>Extensibility through exception-type mappings\u003c/li>\u003c/ul>\n\u003ch2>Use in the ecosystem\u003c/h2>\n\u003cp>This package is reused in \u003cstrong>SplitCosts\u003c/strong>, \u003cstrong>Financial\u003c/strong> and other .NET backends.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>APIs without centralized error handling leak internal details, return inconsistent payloads and make debugging harder. This middleware fixes that through a single interception point that standardizes every error response.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>ASP.NET Core middleware registered early in the pipeline through \u003ccode>app.UseMiddleware\u003c/code>. It uses an exception-type → status-code mapping dictionary and integrates with \u003ccode>ILogger\u003c/code> for structured logging.\u003c/p>", "body_html_en": "\u003cp>Global exception-handling middleware for ASP.NET Core applications, designed to standardize error responses in REST APIs.\u003c/p>\n\u003ch2>What it does\u003c/h2>\n\u003cp>It intercepts all unhandled exceptions in the request pipeline and converts them into standardized HTTP responses:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Domain exceptions\u003c/strong> → 400 Bad Request with a specific message\u003c/li> \u003cli>\u003cstrong>Validation exceptions\u003c/strong> → 422 Unprocessable Entity with detailed information\u003c/li> \u003cli>\u003cstrong>Authentication exceptions\u003c/strong> → 401 / 403 with context\u003c/li> \u003cli>\u003cstrong>Unmapped exceptions\u003c/strong> → 500 Internal Server Error with a correlation ID\u003c/li>\u003c/ul>\n\u003ch2>Why use a dedicated middleware\u003c/h2>\n\u003cp>Without centralized handling, each controller ends up with its own try/catch blocks, resulting in inconsistent error formats and duplicated logging logic. The middleware guarantees:\u003c/p>\n\u003cul>\u003cli>Consistent response format (RFC 7807 Problem Details)\u003c/li> \u003cli>Structured logging with correlation IDs\u003c/li> \u003cli>Suppression of stack traces in production\u003c/li> \u003cli>Extensibility through exception-type mappings\u003c/li>\u003c/ul>\n\u003ch2>Use in the ecosystem\u003c/h2>\n\u003cp>This package is reused in \u003cstrong>SplitCosts\u003c/strong>, \u003cstrong>Financial\u003c/strong> and other .NET backends.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>APIs without centralized error handling leak internal details, return inconsistent payloads and make debugging harder. This middleware fixes that through a single interception point that standardizes every error response.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>ASP.NET Core middleware registered early in the pipeline through \u003ccode>app.UseMiddleware\u003c/code>. It uses an exception-type → status-code mapping dictionary and integrates with \u003ccode>ILogger\u003c/code> for structured logging.\u003c/p>", "body_html_ja_jp": "\u003cp>REST API のエラーレスポンスを標準化するために設計された、ASP.NET Core アプリ向けのグローバル例外処理ミドルウェアです。\u003c/p>\n\u003ch2>何をするか\u003c/h2>\n\u003cp>リクエスト・パイプライン上の未処理例外を横取りし、標準化された HTTP レスポンスへ変換します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>ドメイン例外\u003c/strong> → 具体的メッセージ付き 400 Bad Request\u003c/li> \u003cli>\u003cstrong>検証例外\u003c/strong> → 詳細付き 422 Unprocessable Entity\u003c/li> \u003cli>\u003cstrong>認証例外\u003c/strong> → 文脈付き 401 / 403\u003c/li> \u003cli>\u003cstrong>未マップ例外\u003c/strong> → correlation ID 付き 500 Internal Server Error\u003c/li>\u003c/ul>\n\u003ch2>専用ミドルウェアを使う理由\u003c/h2>\n\u003cp>集中処理がないと、各 controller が独自の try/catch を持つことになり、エラー形式の不一致と logging ロジックの重複を招きます。このミドルウェアは次を保証します。\u003c/p>\n\u003cul>\u003cli>一貫したレスポンス形式（RFC 7807 Problem Details）\u003c/li> \u003cli>correlation ID 付きの構造化ログ\u003c/li> \u003cli>本番環境での stack trace 抑制\u003c/li> \u003cli>例外型マッピングによる拡張性\u003c/li>\u003c/ul>\n\u003ch2>エコシステムでの利用\u003c/h2>\n\u003cp>\u003cstrong>SplitCosts\u003c/strong>、\u003cstrong>Financial\u003c/strong> などの .NET バックエンドで再利用されています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>集中したエラーハンドリングがない API は内部情報を漏らしやすく、payload 形式も不揃いになり、デバッグも難しくなります。このミドルウェアは単一の横取りポイントで全エラーレスポンスを標準化して、それを解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ASP.NET Core の \u003ccode>app.UseMiddleware\u003c/code> でパイプラインの早い段階に登録するミドルウェアです。例外型 → ステータスコードのマッピング辞書を使い、\u003ccode>ILogger\u003c/code> と統合して構造化ログを出します。\u003c/p>", "body_html_ja": "\u003cp>REST API のエラーレスポンスを標準化するために設計された、ASP.NET Core アプリ向けのグローバル例外処理ミドルウェアです。\u003c/p>\n\u003ch2>何をするか\u003c/h2>\n\u003cp>リクエスト・パイプライン上の未処理例外を横取りし、標準化された HTTP レスポンスへ変換します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>ドメイン例外\u003c/strong> → 具体的メッセージ付き 400 Bad Request\u003c/li> \u003cli>\u003cstrong>検証例外\u003c/strong> → 詳細付き 422 Unprocessable Entity\u003c/li> \u003cli>\u003cstrong>認証例外\u003c/strong> → 文脈付き 401 / 403\u003c/li> \u003cli>\u003cstrong>未マップ例外\u003c/strong> → correlation ID 付き 500 Internal Server Error\u003c/li>\u003c/ul>\n\u003ch2>専用ミドルウェアを使う理由\u003c/h2>\n\u003cp>集中処理がないと、各 controller が独自の try/catch を持つことになり、エラー形式の不一致と logging ロジックの重複を招きます。このミドルウェアは次を保証します。\u003c/p>\n\u003cul>\u003cli>一貫したレスポンス形式（RFC 7807 Problem Details）\u003c/li> \u003cli>correlation ID 付きの構造化ログ\u003c/li> \u003cli>本番環境での stack trace 抑制\u003c/li> \u003cli>例外型マッピングによる拡張性\u003c/li>\u003c/ul>\n\u003ch2>エコシステムでの利用\u003c/h2>\n\u003cp>\u003cstrong>SplitCosts\u003c/strong>、\u003cstrong>Financial\u003c/strong> などの .NET バックエンドで再利用されています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>集中したエラーハンドリングがない API は内部情報を漏らしやすく、payload 形式も不揃いになり、デバッグも難しくなります。このミドルウェアは単一の横取りポイントで全エラーレスポンスを標準化して、それを解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ASP.NET Core の \u003ccode>app.UseMiddleware\u003c/code> でパイプラインの早い段階に登録するミドルウェアです。例外型 → ステータスコードのマッピング辞書を使い、\u003ccode>ILogger\u003c/code> と統合して構造化ログを出します。\u003c/p>"}, {"id": "project-playground-fe", "kind": "project", "status": "research", "stack": ["React", "TypeScript", "Keycloak", "OAuth2"], "url": "/projects/playground-fe/", "resolved_url": "https://nhmatsumoto.github.io/projects/playground-fe/", "repo_url": "https://github.com/nhmatsumoto/Playground-FE", "has_math": false, "name": "Playground-FE", "headline": "Frontend React/TypeScript com integração Keycloak — base para aplicações com controle de acesso.", "summary": "Projeto frontend em React e TypeScript com integração ao Keycloak para autenticação, servindo como base para futuros desenvolvimentos com controle de acesso.", "body_html": "\u003cp>Projeto frontend criado com React e TypeScript, com integração completa ao Keycloak para autenticação e autorização de usuários.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Login/Logout\u003c/strong> via Keycloak com fluxo OAuth2/OIDC\u003c/li> \u003cli>\u003cstrong>Token management\u003c/strong> — refresh automático de access tokens\u003c/li> \u003cli>\u003cstrong>Protected routes\u003c/strong> — rotas que exigem autenticação\u003c/li> \u003cli>\u003cstrong>Role-based UI\u003c/strong> — componentes condicionais baseados em roles do Keycloak\u003c/li> \u003cli>\u003cstrong>Silent refresh\u003c/strong> — renovação de token sem interrupção da sessão\u003c/li>\u003c/ul>\n\u003ch2>Stack técnico\u003c/h2>\n\u003cul>\u003cli>React com hooks e context API para state management\u003c/li> \u003cli>TypeScript para type safety em toda a aplicação\u003c/li> \u003cli>Keycloak JS adapter para integração com o identity provider\u003c/li> \u003cli>Vite como build tool\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Este playground serve como base de autenticação para os frontends do \u003cstrong>SplitCosts-FE\u003c/strong> e outros projetos que precisam de controle de acesso. As decisões de integração com Keycloak testadas aqui são replicadas nos projetos de produção.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Integrar autenticação OAuth2/OIDC corretamente em SPAs tem armadilhas: PKCE, refresh silencioso, CORS, logout distribuído. Este playground isola a complexidade de autenticação para testar padrões antes de aplicá-los em projetos reais.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>SPA React com Keycloak JS adapter inicializado no bootstrap da aplicação. O adapter gerencia o ciclo de vida dos tokens (access, refresh, id) e expõe um AuthContext para toda a árvore de componentes.\u003c/p>", "headline_en_us": "React/TypeScript frontend with Keycloak integration — base for applications with access control.", "headline_ja_jp": "Keycloak と連携した React/TypeScript フロントエンド — アクセス制御を持つアプリの基盤。", "summary_en_us": "Frontend project in React and TypeScript with Keycloak integration for authentication, serving as a base for future developments requiring access control.", "summary_ja_jp": "認証に Keycloak を統合した React・TypeScript フロントエンド。アクセス制御を必要とする将来の開発の基盤として利用。", "body_html_en_us": "\u003cp>Frontend project built with React and TypeScript, with full Keycloak integration for authentication and authorization.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Login / Logout\u003c/strong> via Keycloak using OAuth2 / OIDC flows\u003c/li> \u003cli>\u003cstrong>Token management\u003c/strong> — automatic refresh of access tokens\u003c/li> \u003cli>\u003cstrong>Protected routes\u003c/strong> — routes that require authentication\u003c/li> \u003cli>\u003cstrong>Role-based UI\u003c/strong> — components conditional on Keycloak roles\u003c/li> \u003cli>\u003cstrong>Silent refresh\u003c/strong> — token renewal without interrupting the session\u003c/li>\u003c/ul>\n\u003ch2>Technical stack\u003c/h2>\n\u003cul>\u003cli>React with hooks and the Context API for state management\u003c/li> \u003cli>TypeScript for full-application type safety\u003c/li> \u003cli>Keycloak JS adapter for identity-provider integration\u003c/li> \u003cli>Vite as the build tool\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This playground serves as the authentication baseline for \u003cstrong>SplitCosts-FE\u003c/strong> and other frontends that need access control. Keycloak integration choices validated here are reused in production systems.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Implementing OAuth2 / OIDC correctly in SPAs has plenty of traps: PKCE, silent refresh, CORS and distributed logout. This playground isolates the authentication complexity before it reaches production apps.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>React SPA with the Keycloak JS adapter initialized during bootstrap. The adapter manages access, refresh and ID token lifecycles and exposes an \u003ccode>AuthContext\u003c/code> to the full component tree.\u003c/p>", "body_html_en": "\u003cp>Frontend project built with React and TypeScript, with full Keycloak integration for authentication and authorization.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Login / Logout\u003c/strong> via Keycloak using OAuth2 / OIDC flows\u003c/li> \u003cli>\u003cstrong>Token management\u003c/strong> — automatic refresh of access tokens\u003c/li> \u003cli>\u003cstrong>Protected routes\u003c/strong> — routes that require authentication\u003c/li> \u003cli>\u003cstrong>Role-based UI\u003c/strong> — components conditional on Keycloak roles\u003c/li> \u003cli>\u003cstrong>Silent refresh\u003c/strong> — token renewal without interrupting the session\u003c/li>\u003c/ul>\n\u003ch2>Technical stack\u003c/h2>\n\u003cul>\u003cli>React with hooks and the Context API for state management\u003c/li> \u003cli>TypeScript for full-application type safety\u003c/li> \u003cli>Keycloak JS adapter for identity-provider integration\u003c/li> \u003cli>Vite as the build tool\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This playground serves as the authentication baseline for \u003cstrong>SplitCosts-FE\u003c/strong> and other frontends that need access control. Keycloak integration choices validated here are reused in production systems.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Implementing OAuth2 / OIDC correctly in SPAs has plenty of traps: PKCE, silent refresh, CORS and distributed logout. This playground isolates the authentication complexity before it reaches production apps.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>React SPA with the Keycloak JS adapter initialized during bootstrap. The adapter manages access, refresh and ID token lifecycles and exposes an \u003ccode>AuthContext\u003c/code> to the full component tree.\u003c/p>", "body_html_ja_jp": "\u003cp>React と TypeScript で構築したフロントエンド・プロジェクトで、認証・認可のための Keycloak 統合をフルで備えています。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Login / Logout\u003c/strong> — OAuth2 / OIDC フローによる Keycloak 認証\u003c/li> \u003cli>\u003cstrong>Token management\u003c/strong> — access token の自動 refresh\u003c/li> \u003cli>\u003cstrong>Protected routes\u003c/strong> — 認証が必要な route\u003c/li> \u003cli>\u003cstrong>Role-based UI\u003c/strong> — Keycloak role に応じた条件付きコンポーネント\u003c/li> \u003cli>\u003cstrong>Silent refresh\u003c/strong> — セッションを切らさず token を更新\u003c/li>\u003c/ul>\n\u003ch2>技術スタック\u003c/h2>\n\u003cul>\u003cli>state 管理に hooks と Context API を用いた React\u003c/li> \u003cli>アプリ全体の型安全のための TypeScript\u003c/li> \u003cli>IdP 連携のための Keycloak JS adapter\u003c/li> \u003cli>build tool としての Vite\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>この playground は \u003cstrong>SplitCosts-FE\u003c/strong> など、アクセス制御が必要なフロントエンドの認証ベースになります。ここで検証した Keycloak 統合方針は本番システムでも再利用されます。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>SPA で OAuth2 / OIDC を正しく実装するには、PKCE、silent refresh、CORS、分散 logout など多くの落とし穴があります。この playground は、その認証の複雑さを本番アプリに持ち込む前に切り離して検証します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>bootstrap 時に Keycloak JS adapter を初期化する React SPA です。adapter が access / refresh / ID token のライフサイクルを管理し、\u003ccode>AuthContext\u003c/code> をコンポーネント・ツリー全体に公開します。\u003c/p>", "body_html_ja": "\u003cp>React と TypeScript で構築したフロントエンド・プロジェクトで、認証・認可のための Keycloak 統合をフルで備えています。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Login / Logout\u003c/strong> — OAuth2 / OIDC フローによる Keycloak 認証\u003c/li> \u003cli>\u003cstrong>Token management\u003c/strong> — access token の自動 refresh\u003c/li> \u003cli>\u003cstrong>Protected routes\u003c/strong> — 認証が必要な route\u003c/li> \u003cli>\u003cstrong>Role-based UI\u003c/strong> — Keycloak role に応じた条件付きコンポーネント\u003c/li> \u003cli>\u003cstrong>Silent refresh\u003c/strong> — セッションを切らさず token を更新\u003c/li>\u003c/ul>\n\u003ch2>技術スタック\u003c/h2>\n\u003cul>\u003cli>state 管理に hooks と Context API を用いた React\u003c/li> \u003cli>アプリ全体の型安全のための TypeScript\u003c/li> \u003cli>IdP 連携のための Keycloak JS adapter\u003c/li> \u003cli>build tool としての Vite\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>この playground は \u003cstrong>SplitCosts-FE\u003c/strong> など、アクセス制御が必要なフロントエンドの認証ベースになります。ここで検証した Keycloak 統合方針は本番システムでも再利用されます。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>SPA で OAuth2 / OIDC を正しく実装するには、PKCE、silent refresh、CORS、分散 logout など多くの落とし穴があります。この playground は、その認証の複雑さを本番アプリに持ち込む前に切り離して検証します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>bootstrap 時に Keycloak JS adapter を初期化する React SPA です。adapter が access / refresh / ID token のライフサイクルを管理し、\u003ccode>AuthContext\u003c/code> をコンポーネント・ツリー全体に公開します。\u003c/p>"}, {"id": "project-prog-lib", "kind": "project", "status": "research", "stack": ["Algorithms", "Data Structures"], "url": "/projects/prog-lib/", "resolved_url": "https://nhmatsumoto.github.io/projects/prog-lib/", "repo_url": "https://github.com/nhmatsumoto/prog_lib", "has_math": false, "name": "prog_lib", "headline": "Biblioteca de referência com algoritmos e estruturas de dados para estudo e consulta.", "summary": "Coleção de implementações de algoritmos e estruturas de dados clássicos, organizada como biblioteca de referência para estudo e consulta rápida.", "body_html": "\u003cp>Biblioteca de referência com implementações de algoritmos e estruturas de dados fundamentais da ciência da computação.\u003c/p>\n\u003ch2>Conteúdo\u003c/h2>\n\u003cp>Coleção organizada por categoria:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Ordenação\u003c/strong> — quicksort, mergesort, heapsort, radix sort\u003c/li> \u003cli>\u003cstrong>Busca\u003c/strong> — binary search, BFS, DFS, A*\u003c/li> \u003cli>\u003cstrong>Estruturas\u003c/strong> — listas, pilhas, filas, árvores, grafos, hash tables\u003c/li> \u003cli>\u003cstrong>Grafos\u003c/strong> — Dijkstra, Bellman-Ford, topological sort, MST\u003c/li> \u003cli>\u003cstrong>Programação dinâmica\u003c/strong> — knapsack, LCS, edit distance\u003c/li> \u003cli>\u003cstrong>Strings\u003c/strong> — KMP, Rabin-Karp, suffix arrays\u003c/li>\u003c/ul>\n\u003ch2>Propósito\u003c/h2>\n\u003cp>Servir como material de consulta rápida e estudo, com implementações limpas e comentadas que priorizam clareza sobre otimização.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Algoritmos e estruturas de dados são fundamentos que precisam ser revisitados periodicamente. Ter uma biblioteca pessoal de implementações facilita a consulta rápida e reforça o entendimento dos conceitos.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Organizada por categoria, cada implementação é auto-contida com documentação inline explicando complexidade temporal e espacial, invariantes e edge cases.\u003c/p>", "headline_en_us": "Reference library with algorithms and data structures for study and lookup.", "headline_ja_jp": "学習と参照のためのアルゴリズム・データ構造リファレンス・ライブラリ。", "summary_en_us": "Collection of classic algorithm and data-structure implementations, organized as a reference library for study and quick lookup.", "summary_ja_jp": "古典的なアルゴリズムとデータ構造の実装コレクション。学習と素早い参照のためのライブラリとして整理。", "body_html_en_us": "\u003cp>Reference library with implementations of fundamental algorithms and data structures from computer science.\u003c/p>\n\u003ch2>Content\u003c/h2>\n\u003cp>Collection organized by category:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Sorting\u003c/strong> — quicksort, mergesort, heapsort and radix sort\u003c/li> \u003cli>\u003cstrong>Search\u003c/strong> — binary search, BFS, DFS and A*\u003c/li> \u003cli>\u003cstrong>Structures\u003c/strong> — lists, stacks, queues, trees, graphs and hash tables\u003c/li> \u003cli>\u003cstrong>Graphs\u003c/strong> — Dijkstra, Bellman-Ford, topological sort and MST\u003c/li> \u003cli>\u003cstrong>Dynamic programming\u003c/strong> — knapsack, LCS and edit distance\u003c/li> \u003cli>\u003cstrong>Strings\u003c/strong> — KMP, Rabin-Karp and suffix arrays\u003c/li>\u003c/ul>\n\u003ch2>Purpose\u003c/h2>\n\u003cp>The goal is fast lookup and study, with implementations that favor clarity and annotation over micro-optimization.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Algorithms and data structures are fundamentals that need to be revisited repeatedly. Keeping a personal library of implementations makes quick consultation easier and reinforces conceptual understanding.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Organized by category, each implementation is self-contained and documented inline with time and space complexity, invariants and relevant edge cases.\u003c/p>", "body_html_en": "\u003cp>Reference library with implementations of fundamental algorithms and data structures from computer science.\u003c/p>\n\u003ch2>Content\u003c/h2>\n\u003cp>Collection organized by category:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Sorting\u003c/strong> — quicksort, mergesort, heapsort and radix sort\u003c/li> \u003cli>\u003cstrong>Search\u003c/strong> — binary search, BFS, DFS and A*\u003c/li> \u003cli>\u003cstrong>Structures\u003c/strong> — lists, stacks, queues, trees, graphs and hash tables\u003c/li> \u003cli>\u003cstrong>Graphs\u003c/strong> — Dijkstra, Bellman-Ford, topological sort and MST\u003c/li> \u003cli>\u003cstrong>Dynamic programming\u003c/strong> — knapsack, LCS and edit distance\u003c/li> \u003cli>\u003cstrong>Strings\u003c/strong> — KMP, Rabin-Karp and suffix arrays\u003c/li>\u003c/ul>\n\u003ch2>Purpose\u003c/h2>\n\u003cp>The goal is fast lookup and study, with implementations that favor clarity and annotation over micro-optimization.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Algorithms and data structures are fundamentals that need to be revisited repeatedly. Keeping a personal library of implementations makes quick consultation easier and reinforces conceptual understanding.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Organized by category, each implementation is self-contained and documented inline with time and space complexity, invariants and relevant edge cases.\u003c/p>", "body_html_ja_jp": "\u003cp>計算機科学の基本アルゴリズムとデータ構造の実装をまとめたリファレンス・ライブラリです。\u003c/p>\n\u003ch2>内容\u003c/h2>\n\u003cp>カテゴリごとに整理されたコレクション:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Sorting\u003c/strong> — quicksort、mergesort、heapsort、radix sort\u003c/li> \u003cli>\u003cstrong>Search\u003c/strong> — binary search、BFS、DFS、A*\u003c/li> \u003cli>\u003cstrong>Structures\u003c/strong> — list、stack、queue、tree、graph、hash table\u003c/li> \u003cli>\u003cstrong>Graphs\u003c/strong> — Dijkstra、Bellman-Ford、topological sort、MST\u003c/li> \u003cli>\u003cstrong>Dynamic programming\u003c/strong> — knapsack、LCS、edit distance\u003c/li> \u003cli>\u003cstrong>Strings\u003c/strong> — KMP、Rabin-Karp、suffix array\u003c/li>\u003c/ul>\n\u003ch2>目的\u003c/h2>\n\u003cp>狙いは素早い参照と学習であり、実装はマイクロ最適化より明快さと注釈を優先しています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>アルゴリズムとデータ構造は何度も立ち返る必要がある基礎です。個人用の実装ライブラリを持つことで、素早い参照ができ、概念理解も強化されます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>カテゴリごとに整理され、各実装は自己完結しています。時間計算量・空間計算量、invariant、重要な edge case を inline で記述しています。\u003c/p>", "body_html_ja": "\u003cp>計算機科学の基本アルゴリズムとデータ構造の実装をまとめたリファレンス・ライブラリです。\u003c/p>\n\u003ch2>内容\u003c/h2>\n\u003cp>カテゴリごとに整理されたコレクション:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Sorting\u003c/strong> — quicksort、mergesort、heapsort、radix sort\u003c/li> \u003cli>\u003cstrong>Search\u003c/strong> — binary search、BFS、DFS、A*\u003c/li> \u003cli>\u003cstrong>Structures\u003c/strong> — list、stack、queue、tree、graph、hash table\u003c/li> \u003cli>\u003cstrong>Graphs\u003c/strong> — Dijkstra、Bellman-Ford、topological sort、MST\u003c/li> \u003cli>\u003cstrong>Dynamic programming\u003c/strong> — knapsack、LCS、edit distance\u003c/li> \u003cli>\u003cstrong>Strings\u003c/strong> — KMP、Rabin-Karp、suffix array\u003c/li>\u003c/ul>\n\u003ch2>目的\u003c/h2>\n\u003cp>狙いは素早い参照と学習であり、実装はマイクロ最適化より明快さと注釈を優先しています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>アルゴリズムとデータ構造は何度も立ち返る必要がある基礎です。個人用の実装ライブラリを持つことで、素早い参照ができ、概念理解も強化されます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>カテゴリごとに整理され、各実装は自己完結しています。時間計算量・空間計算量、invariant、重要な edge case を inline で記述しています。\u003c/p>"}, {"id": "project-quickreaderv1", "kind": "project", "status": "research", "stack": ["TypeScript", "React", "Speed Reading"], "url": "/projects/quickreaderv1/", "resolved_url": "https://nhmatsumoto.github.io/projects/quickreaderv1/", "repo_url": "https://github.com/nhmatsumoto/QuickReaderv1", "has_math": false, "name": "QuickReaderv1", "headline": "Aplicação de leitura rápida em TypeScript — speed reading com chunking de texto.", "summary": "Aplicação de speed reading em TypeScript que apresenta texto em chunks otimizados para leitura rápida, com controle de velocidade e tracking de progresso.", "body_html": "\u003cp>Aplicação de speed reading que apresenta texto em chunks otimizados para leitura rápida, inspirada na técnica RSVP (Rapid Serial Visual Presentation).\u003c/p>\n\u003ch2>Como funciona\u003c/h2>\n\u003cp>O texto é dividido em fragmentos (1-3 palavras) apresentados sequencialmente no centro da tela. O ponto focal (ORP - Optimal Recognition Point) de cada palavra é destacado para reduzir movimentos oculares.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>Controle de velocidade (palavras por minuto)\u003c/li> \u003cli>Tracking de progresso de leitura\u003c/li> \u003cli>Import de textos em diferentes formatos\u003c/li> \u003cli>Ajuste de tamanho de chunk por complexidade do texto\u003c/li>\u003c/ul>\n\u003ch2>Contexto\u003c/h2>\n\u003cp>Este projeto explora a interseção entre interface de usuário e cognição humana — como a apresentação do texto afeta a velocidade e compreensão de leitura.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Leitura convencional é limitada por movimentos oculares (saccades) e regressões. A técnica RSVP elimina esses fatores apresentando o texto em um ponto fixo, permitindo velocidades de leitura significativamente maiores.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>SPA em React/TypeScript com state machine para controle do fluxo de apresentação. O texto é tokenizado e processado em um pipeline: input → tokenize → chunk → schedule → render.\u003c/p>", "headline_en_us": "Speed-reading application in TypeScript — text chunking for rapid reading.", "headline_ja_jp": "TypeScript で書かれた速読アプリ — テキストをチャンクに分割して高速読破。", "summary_en_us": "Speed-reading app in TypeScript that presents text in optimized chunks for rapid reading, with speed control and progress tracking.", "summary_ja_jp": "最適化されたチャンクで素早くテキストを表示する TypeScript 製の速読アプリ。速度制御と進捗追跡を備える。", "body_html_en_us": "\u003cp>Speed-reading application that presents text in optimized chunks, inspired by the RSVP (Rapid Serial Visual Presentation) technique.\u003c/p>\n\u003ch2>How it works\u003c/h2>\n\u003cp>Text is divided into small fragments of one to three words and displayed sequentially at the center of the screen. The focal point (ORP — Optimal Recognition Point) of each word is highlighted to reduce eye movement.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>Reading-speed control (words per minute)\u003c/li> \u003cli>Progress tracking\u003c/li> \u003cli>Text import in multiple formats\u003c/li> \u003cli>Chunk-size adjustment based on text complexity\u003c/li>\u003c/ul>\n\u003ch2>Context\u003c/h2>\n\u003cp>The project explores the boundary between user interface design and human cognition — how text presentation influences reading speed and comprehension.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Conventional reading is limited by saccades and regressions. RSVP reduces those effects by fixing the presentation point, enabling significantly higher reading speeds for the right kind of content.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>React / TypeScript SPA with a state machine controlling presentation flow. Text is processed through a pipeline: input → tokenize → chunk → schedule → render.\u003c/p>", "body_html_en": "\u003cp>Speed-reading application that presents text in optimized chunks, inspired by the RSVP (Rapid Serial Visual Presentation) technique.\u003c/p>\n\u003ch2>How it works\u003c/h2>\n\u003cp>Text is divided into small fragments of one to three words and displayed sequentially at the center of the screen. The focal point (ORP — Optimal Recognition Point) of each word is highlighted to reduce eye movement.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>Reading-speed control (words per minute)\u003c/li> \u003cli>Progress tracking\u003c/li> \u003cli>Text import in multiple formats\u003c/li> \u003cli>Chunk-size adjustment based on text complexity\u003c/li>\u003c/ul>\n\u003ch2>Context\u003c/h2>\n\u003cp>The project explores the boundary between user interface design and human cognition — how text presentation influences reading speed and comprehension.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Conventional reading is limited by saccades and regressions. RSVP reduces those effects by fixing the presentation point, enabling significantly higher reading speeds for the right kind of content.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>React / TypeScript SPA with a state machine controlling presentation flow. Text is processed through a pipeline: input → tokenize → chunk → schedule → render.\u003c/p>", "body_html_ja_jp": "\u003cp>RSVP（Rapid Serial Visual Presentation）に着想を得て、最適化されたチャンク単位でテキストを提示する速読アプリです。\u003c/p>\n\u003ch2>仕組み\u003c/h2>\n\u003cp>テキストを 1〜3 語の小さな断片に分割し、画面中央に順番に表示します。各語の焦点（ORP — Optimal Recognition Point）を強調し、眼球移動を減らします。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>読書速度の制御（words per minute）\u003c/li> \u003cli>進捗トラッキング\u003c/li> \u003cli>複数形式のテキスト import\u003c/li> \u003cli>テキスト複雑度に応じた chunk サイズ調整\u003c/li>\u003c/ul>\n\u003ch2>背景\u003c/h2>\n\u003cp>このプロジェクトは、UI 設計と人間の認知の境界、つまりテキスト提示方法が読書速度と理解度にどう影響するかを探ります。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>通常の読書は、サッカードと回帰によって速度が制約されます。RSVP は表示位置を固定することでそれらを減らし、適したコンテンツでは読書速度を大きく引き上げます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>表示フローを state machine で制御する React / TypeScript SPA です。テキストは input → tokenize → chunk → schedule → render のパイプラインで処理されます。\u003c/p>", "body_html_ja": "\u003cp>RSVP（Rapid Serial Visual Presentation）に着想を得て、最適化されたチャンク単位でテキストを提示する速読アプリです。\u003c/p>\n\u003ch2>仕組み\u003c/h2>\n\u003cp>テキストを 1〜3 語の小さな断片に分割し、画面中央に順番に表示します。各語の焦点（ORP — Optimal Recognition Point）を強調し、眼球移動を減らします。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>読書速度の制御（words per minute）\u003c/li> \u003cli>進捗トラッキング\u003c/li> \u003cli>複数形式のテキスト import\u003c/li> \u003cli>テキスト複雑度に応じた chunk サイズ調整\u003c/li>\u003c/ul>\n\u003ch2>背景\u003c/h2>\n\u003cp>このプロジェクトは、UI 設計と人間の認知の境界、つまりテキスト提示方法が読書速度と理解度にどう影響するかを探ります。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>通常の読書は、サッカードと回帰によって速度が制約されます。RSVP は表示位置を固定することでそれらを減らし、適したコンテンツでは読書速度を大きく引き上げます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>表示フローを state machine で制御する React / TypeScript SPA です。テキストは input → tokenize → chunk → schedule → render のパイプラインで処理されます。\u003c/p>"}, {"id": "project-react-data-grid", "kind": "project", "status": "research", "stack": ["React", "TypeScript", "Virtualization"], "url": "/projects/react-data-grid/", "resolved_url": "https://nhmatsumoto.github.io/projects/react-data-grid/", "repo_url": "https://github.com/nhmatsumoto/react-data-grid", "has_math": false, "name": "react-data-grid", "headline": "Componente React de data grid com funcionalidades avançadas e alta customização.", "summary": "Fork do react-data-grid — componente de tabela de dados para React com sorting, filtering, editing inline e virtualização para grandes volumes de dados.", "body_html": "\u003cp>Fork do react-data-grid, um componente React de alta performance para exibição e manipulação de dados tabulares.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Virtualização\u003c/strong> — renderiza apenas as linhas visíveis, suportando milhões de registros\u003c/li> \u003cli>\u003cstrong>Sorting\u003c/strong> — ordenação por múltiplas colunas\u003c/li> \u003cli>\u003cstrong>Filtering\u003c/strong> — filtros por coluna com operadores customizáveis\u003c/li> \u003cli>\u003cstrong>Editing inline\u003c/strong> — edição direta nas células com validação\u003c/li> \u003cli>\u003cstrong>Column resizing/reordering\u003c/strong> — ajuste de largura e ordem das colunas\u003c/li> \u003cli>\u003cstrong>Copy/Paste\u003c/strong> — suporte a clipboard para operações em massa\u003c/li>\u003c/ul>\n\u003ch2>Uso no ecossistema\u003c/h2>\n\u003cp>Utilizado como referência para componentes de visualização de dados no \u003cstrong>SplitCosts-FE\u003c/strong> e outros projetos que precisam exibir tabelas com grande volume de dados de forma performática.\u003c/p>\n\u003ch2>Por que virtualização importa\u003c/h2>\n\u003cp>Renderizar 10.000 linhas no DOM degrada a performance do browser. Virtualização resolve isso renderizando apenas o viewport visível (~30 linhas), com scroll suave simulado via CSS transforms.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Tabelas HTML nativas não escalam para grandes volumes de dados. O react-data-grid resolve com virtualização de linhas e colunas, mantendo a API familiar de um componente React declarativo.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Componente React com virtualização baseada em position: absolute e CSS transforms. O scroll handler calcula quais linhas são visíveis e renderiza apenas essas, reciclando DOM nodes conforme o usuário scrolla.\u003c/p>", "headline_en_us": "React data grid component with advanced features and high customization.", "headline_ja_jp": "高度な機能と高いカスタマイズ性を備えた React データグリッドコンポーネント。", "summary_en_us": "Fork of react-data-grid — React data table component with sorting, filtering, inline editing and virtualization for large datasets.", "summary_ja_jp": "react-data-grid のフォーク。ソート、フィルタ、インライン編集、大規模データの仮想化に対応した React データテーブル・コンポーネント。", "body_html_en_us": "\u003cp>Fork of \u003ccode>react-data-grid\u003c/code>, a high-performance React component for displaying and editing tabular data.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Virtualization\u003c/strong> — render only visible rows, supporting millions of records\u003c/li> \u003cli>\u003cstrong>Sorting\u003c/strong> — ordering by multiple columns\u003c/li> \u003cli>\u003cstrong>Filtering\u003c/strong> — per-column filters with customizable operators\u003c/li> \u003cli>\u003cstrong>Inline editing\u003c/strong> — edit cells directly with validation\u003c/li> \u003cli>\u003cstrong>Column resizing / reordering\u003c/strong> — adjustable width and order\u003c/li> \u003cli>\u003cstrong>Copy / Paste\u003c/strong> — clipboard support for bulk operations\u003c/li>\u003c/ul>\n\u003ch2>Use inside the ecosystem\u003c/h2>\n\u003cp>It serves as a reference for data-visualization components in \u003cstrong>SplitCosts-FE\u003c/strong> and other projects that need to render large tables efficiently.\u003c/p>\n\u003ch2>Why virtualization matters\u003c/h2>\n\u003cp>Rendering 10,000 rows directly in the DOM degrades browser performance. Virtualization solves that by rendering only the visible viewport while simulating smooth scroll behavior.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Native HTML tables do not scale well for large datasets. \u003ccode>react-data-grid\u003c/code> addresses that through row and column virtualization while preserving a familiar declarative React API.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>React component built around \u003ccode>position: absolute\u003c/code> and CSS-transform-based virtualization. The scroll handler computes visible rows and recycles DOM nodes while the user moves through the grid.\u003c/p>", "body_html_en": "\u003cp>Fork of \u003ccode>react-data-grid\u003c/code>, a high-performance React component for displaying and editing tabular data.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Virtualization\u003c/strong> — render only visible rows, supporting millions of records\u003c/li> \u003cli>\u003cstrong>Sorting\u003c/strong> — ordering by multiple columns\u003c/li> \u003cli>\u003cstrong>Filtering\u003c/strong> — per-column filters with customizable operators\u003c/li> \u003cli>\u003cstrong>Inline editing\u003c/strong> — edit cells directly with validation\u003c/li> \u003cli>\u003cstrong>Column resizing / reordering\u003c/strong> — adjustable width and order\u003c/li> \u003cli>\u003cstrong>Copy / Paste\u003c/strong> — clipboard support for bulk operations\u003c/li>\u003c/ul>\n\u003ch2>Use inside the ecosystem\u003c/h2>\n\u003cp>It serves as a reference for data-visualization components in \u003cstrong>SplitCosts-FE\u003c/strong> and other projects that need to render large tables efficiently.\u003c/p>\n\u003ch2>Why virtualization matters\u003c/h2>\n\u003cp>Rendering 10,000 rows directly in the DOM degrades browser performance. Virtualization solves that by rendering only the visible viewport while simulating smooth scroll behavior.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Native HTML tables do not scale well for large datasets. \u003ccode>react-data-grid\u003c/code> addresses that through row and column virtualization while preserving a familiar declarative React API.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>React component built around \u003ccode>position: absolute\u003c/code> and CSS-transform-based virtualization. The scroll handler computes visible rows and recycles DOM nodes while the user moves through the grid.\u003c/p>", "body_html_ja_jp": "\u003cp>表形式データの表示と編集に特化した高性能 React コンポーネント \u003ccode>react-data-grid\u003c/code> のフォークです。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Virtualization\u003c/strong> — 表示中の行だけを描画し、数百万レコードに対応\u003c/li> \u003cli>\u003cstrong>Sorting\u003c/strong> — 複数列での並び替え\u003c/li> \u003cli>\u003cstrong>Filtering\u003c/strong> — カスタマイズ可能な列単位フィルタ\u003c/li> \u003cli>\u003cstrong>Inline editing\u003c/strong> — 検証付きセル直接編集\u003c/li> \u003cli>\u003cstrong>Column resizing / reordering\u003c/strong> — 幅と順序の調整\u003c/li> \u003cli>\u003cstrong>Copy / Paste\u003c/strong> — 一括操作向け clipboard 対応\u003c/li>\u003c/ul>\n\u003ch2>エコシステムでの利用\u003c/h2>\n\u003cp>\u003cstrong>SplitCosts-FE\u003c/strong> など、大量データ表を高効率に描画したいプロジェクトのための参照実装として使っています。\u003c/p>\n\u003ch2>なぜ virtualization が重要か\u003c/h2>\n\u003cp>10,000 行をそのまま DOM に描画するとブラウザ性能は大きく落ちます。virtualization は表示中の viewport だけを描画し、滑らかなスクロールを維持します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>ネイティブの HTML table は大規模データにうまくスケールしません。\u003ccode>react-data-grid\u003c/code> は、宣言的な React API を保ったまま、行・列 virtualization によってその問題を解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>\u003ccode>position: absolute\u003c/code> と CSS transform を用いた virtualization を核にした React コンポーネントです。scroll handler が可視行を計算し、グリッド移動中に DOM node を再利用します。\u003c/p>", "body_html_ja": "\u003cp>表形式データの表示と編集に特化した高性能 React コンポーネント \u003ccode>react-data-grid\u003c/code> のフォークです。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Virtualization\u003c/strong> — 表示中の行だけを描画し、数百万レコードに対応\u003c/li> \u003cli>\u003cstrong>Sorting\u003c/strong> — 複数列での並び替え\u003c/li> \u003cli>\u003cstrong>Filtering\u003c/strong> — カスタマイズ可能な列単位フィルタ\u003c/li> \u003cli>\u003cstrong>Inline editing\u003c/strong> — 検証付きセル直接編集\u003c/li> \u003cli>\u003cstrong>Column resizing / reordering\u003c/strong> — 幅と順序の調整\u003c/li> \u003cli>\u003cstrong>Copy / Paste\u003c/strong> — 一括操作向け clipboard 対応\u003c/li>\u003c/ul>\n\u003ch2>エコシステムでの利用\u003c/h2>\n\u003cp>\u003cstrong>SplitCosts-FE\u003c/strong> など、大量データ表を高効率に描画したいプロジェクトのための参照実装として使っています。\u003c/p>\n\u003ch2>なぜ virtualization が重要か\u003c/h2>\n\u003cp>10,000 行をそのまま DOM に描画するとブラウザ性能は大きく落ちます。virtualization は表示中の viewport だけを描画し、滑らかなスクロールを維持します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>ネイティブの HTML table は大規模データにうまくスケールしません。\u003ccode>react-data-grid\u003c/code> は、宣言的な React API を保ったまま、行・列 virtualization によってその問題を解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>\u003ccode>position: absolute\u003c/code> と CSS transform を用いた virtualization を核にした React コンポーネントです。scroll handler が可視行を計算し、グリッド移動中に DOM node を再利用します。\u003c/p>"}, {"id": "project-responsemiddleware", "kind": "project", "status": "research", "stack": ["C#", ".NET Core", "Middleware", "REST API"], "url": "/projects/responsemiddleware/", "resolved_url": "https://nhmatsumoto.github.io/projects/responsemiddleware/", "repo_url": "https://github.com/nhmatsumoto/ResponseMiddleware", "has_math": false, "name": "ResponseMiddleware", "headline": "Middleware de padronização de respostas HTTP para APIs .NET Core.", "summary": "Middleware ASP.NET Core para padronização de respostas HTTP, envolvendo resultados de controllers em um envelope consistente com metadados de sucesso/erro.", "body_html": "\u003cp>Middleware de padronização de respostas para APIs ASP.NET Core, complementar ao \u003cstrong>nhmatsumoto.exception.middleware\u003c/strong>.\u003c/p>\n\u003ch2>O que faz\u003c/h2>\n\u003cp>Intercepta as respostas de controllers e as envolve em um envelope padronizado:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;success&quot;: true,\n  &quot;data&quot;: { ... },\n  &quot;errors&quot;: [],\n  &quot;metadata&quot;: {\n    &quot;timestamp&quot;: &quot;2026-04-05T00:00:00Z&quot;,\n    &quot;requestId&quot;: &quot;abc-123&quot;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Benefícios\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Consistência\u003c/strong> — todo endpoint retorna o mesmo formato, facilitando o consumo pelo frontend\u003c/li> \u003cli>\u003cstrong>Metadata\u003c/strong> — timestamps, request IDs e informações de paginação são adicionados automaticamente\u003c/li> \u003cli>\u003cstrong>Error wrapping\u003c/strong> — erros de validação são formatados no mesmo envelope\u003c/li> \u003cli>\u003cstrong>Transparência\u003c/strong> — controllers continuam retornando objetos simples, o middleware cuida do envelope\u003c/li>\u003c/ul>\n\u003ch2>Uso combinado\u003c/h2>\n\u003cp>Funciona em conjunto com o \u003cstrong>exception middleware\u003c/strong>: enquanto o exception middleware trata exceções não capturadas, o response middleware padroniza todas as respostas (sucesso e erro controlado).\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>APIs sem padronização de respostas forçam o frontend a tratar cada endpoint de forma diferente. O envelope consistente resolve isso, permitindo que o cliente tenha uma única lógica de parsing para todas as chamadas.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Middleware registrado após o exception middleware no pipeline ASP.NET Core. Intercepta o response body via stream wrapping, deserializa o conteúdo original e re-serializa dentro do envelope padronizado.\u003c/p>", "headline_en_us": "HTTP response standardization middleware for .NET Core APIs.", "headline_ja_jp": ".NET Core API のための HTTP レスポンス標準化ミドルウェア。", "summary_en_us": "ASP.NET Core middleware that standardizes HTTP responses by wrapping controller results in a consistent envelope with success/error metadata.", "summary_ja_jp": "ASP.NET Core ミドルウェア。コントローラの結果を成功／失敗メタデータを含む一貫したエンベロープで包み、HTTP レスポンスを標準化する。", "body_html_en_us": "\u003cp>Response-standardization middleware for ASP.NET Core APIs, designed to complement \u003cstrong>nhmatsumoto.exception.middleware\u003c/strong>.\u003c/p>\n\u003ch2>What it does\u003c/h2>\n\u003cp>It intercepts controller responses and wraps them in a standardized envelope:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;success&quot;: true,\n  &quot;data&quot;: { ... },\n  &quot;errors&quot;: [],\n  &quot;metadata&quot;: {\n    &quot;timestamp&quot;: &quot;2026-04-05T00:00:00Z&quot;,\n    &quot;requestId&quot;: &quot;abc-123&quot;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Benefits\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Consistency\u003c/strong> — every endpoint returns the same top-level format\u003c/li> \u003cli>\u003cstrong>Metadata\u003c/strong> — timestamps, request IDs and paging data are added automatically\u003c/li> \u003cli>\u003cstrong>Error wrapping\u003c/strong> — validation failures fit into the same contract\u003c/li> \u003cli>\u003cstrong>Transparency\u003c/strong> — controllers return plain objects while the middleware shapes the envelope\u003c/li>\u003c/ul>\n\u003ch2>Combined usage\u003c/h2>\n\u003cp>It works together with the exception middleware: one standardizes uncaught failures, the other normalizes every successful or controlled response.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Without response standardization, frontend clients must parse each endpoint differently. A consistent envelope removes that branching and centralizes metadata handling.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>ASP.NET Core middleware registered after the exception middleware. It intercepts the response stream, deserializes the original payload and re-serializes it inside the standard envelope.\u003c/p>", "body_html_en": "\u003cp>Response-standardization middleware for ASP.NET Core APIs, designed to complement \u003cstrong>nhmatsumoto.exception.middleware\u003c/strong>.\u003c/p>\n\u003ch2>What it does\u003c/h2>\n\u003cp>It intercepts controller responses and wraps them in a standardized envelope:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;success&quot;: true,\n  &quot;data&quot;: { ... },\n  &quot;errors&quot;: [],\n  &quot;metadata&quot;: {\n    &quot;timestamp&quot;: &quot;2026-04-05T00:00:00Z&quot;,\n    &quot;requestId&quot;: &quot;abc-123&quot;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Benefits\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Consistency\u003c/strong> — every endpoint returns the same top-level format\u003c/li> \u003cli>\u003cstrong>Metadata\u003c/strong> — timestamps, request IDs and paging data are added automatically\u003c/li> \u003cli>\u003cstrong>Error wrapping\u003c/strong> — validation failures fit into the same contract\u003c/li> \u003cli>\u003cstrong>Transparency\u003c/strong> — controllers return plain objects while the middleware shapes the envelope\u003c/li>\u003c/ul>\n\u003ch2>Combined usage\u003c/h2>\n\u003cp>It works together with the exception middleware: one standardizes uncaught failures, the other normalizes every successful or controlled response.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Without response standardization, frontend clients must parse each endpoint differently. A consistent envelope removes that branching and centralizes metadata handling.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>ASP.NET Core middleware registered after the exception middleware. It intercepts the response stream, deserializes the original payload and re-serializes it inside the standard envelope.\u003c/p>", "body_html_ja_jp": "\u003cp>\u003cstrong>nhmatsumoto.exception.middleware\u003c/strong> を補完する、ASP.NET Core API 向けレスポンス標準化ミドルウェアです。\u003c/p>\n\u003ch2>何をするか\u003c/h2>\n\u003cp>controller のレスポンスを横取りし、標準エンベロープで包みます。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;success&quot;: true,\n  &quot;data&quot;: { ... },\n  &quot;errors&quot;: [],\n  &quot;metadata&quot;: {\n    &quot;timestamp&quot;: &quot;2026-04-05T00:00:00Z&quot;,\n    &quot;requestId&quot;: &quot;abc-123&quot;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>利点\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>一貫性\u003c/strong> — すべての endpoint が同じトップレベル形式を返す\u003c/li> \u003cli>\u003cstrong>Metadata\u003c/strong> — timestamp、request ID、paging 情報を自動付与\u003c/li> \u003cli>\u003cstrong>Error wrapping\u003c/strong> — validation failure も同一契約に収まる\u003c/li> \u003cli>\u003cstrong>透明性\u003c/strong> — controller は素のオブジェクトを返し、整形は middleware が担当\u003c/li>\u003c/ul>\n\u003ch2>組み合わせ利用\u003c/h2>\n\u003cp>exception middleware が未捕捉例外を扱い、この middleware が成功レスポンスや制御済みエラーを含めた全体の形を統一します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>レスポンスの標準化がないと、フロントエンドは endpoint ごとに別の解析ロジックを持つ必要があります。一貫したエンベロープにすることで、その分岐をなくし、metadata 処理を集中化できます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>exception middleware の後段に登録する ASP.NET Core middleware です。response stream を横取りし、元の payload をデシリアライズして標準エンベロープ内に再シリアライズします。\u003c/p

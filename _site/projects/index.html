nders&quot;)\n            .SendAsync(&quot;IncidentAlert&quot;, e.Incident.ToAlertPayload(), ct);\n\n        // 2. Request risk analysis from the ML Unit (async)\n        await _riskModel.RequestAnalysisAsync(e.Incident.Location, ct);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Cross-cutting pipeline behaviors\u003c/h2>\n\u003cp>MediatR lets you attach behaviors that affect all Commands and Queries, such as logging, validation and retry logic:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Registered in DI before all handlers\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(ValidationBehavior&lt;,&gt;));\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(LoggingBehavior&lt;,&gt;));\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(DistributedTracingBehavior&lt;,&gt;));\n\n// LoggingBehavior.cs\npublic class LoggingBehavior&lt;TRequest, TResponse&gt;\n    : IPipelineBehavior&lt;TRequest, TResponse&gt;\n{\n    private readonly ILogger&lt;TRequest&gt; _logger;\n\n    public async Task&lt;TResponse&gt; Handle(\n        TRequest req, RequestHandlerDelegate&lt;TResponse&gt; next, CancellationToken ct)\n    {\n        var sw = Stopwatch.StartNew();\n        _logger.LogInformation(&quot;Handling {Request}&quot;, typeof(TRequest).Name);\n        var response = await next();\n        _logger.LogInformation(&quot;Handled {Request} in {Elapsed}ms&quot;,\n            typeof(TRequest).Name, sw.ElapsedMilliseconds);\n        return response;\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Folder structure after the April/2026 refactor\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>backend-dotnet/\n  SOSLocation.Domain/\n    Entities/       Incident, Resource, Mission, WatchPoint\n    Events/         CriticalIncidentCreated, ResourceAllocated\n    ValueObjects/   GeoPoint, Severity, IncidentType\n  SOSLocation.Application/\n    Commands/       CreateIncidentCommand, AllocateResourceCommand\n    Queries/        GetIncidentsInRadiusQuery, GetMissionStatusQuery\n    Behaviors/      ValidationBehavior, LoggingBehavior\n  SOSLocation.Infrastructure/\n    Persistence/    SosDbContext (EF Core + Npgsql + PostGIS)\n    SignalR/        OpsHub, NotificationHub\n    ML/             RiskModelClient (FastAPI gRPC)\n    Auth/           KeycloakAuthHandler\n  SOSLocation.API/\n    Endpoints/      IncidentEndpoints (Minimal API)\n    Hubs/           OpsHub registration\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>This structure supports growth through Phase 10 without accumulating uncontrolled technical debt. Every new integration has a defined place, and the domain never needs to know about infrastructure.\u003c/p>", "body_html_ja_jp": "\u003ch1>SOS Location バックエンドにおける Clean Architecture + CQRS\u003c/h1>\n\u003cp>2026 年 4 月、\u003ccode>refactor: migrate all page components to the domains/operations directory\u003c/code> という commit は、SOS Location バックエンドの大規模リファクタリング完了を示しました。これは単なるフォルダ整理ではなく、命がその正しさに依存するコードが、どう \u003cem>成長\u003c/em> すべきかを再設計する作業でした。\u003c/p>\n\u003ch2>なぜ災害対応システムに Clean Architecture が必要なのか\u003c/h2>\n\u003cp>災害対応システムは、かなり特殊な性質を持っています。\u003c/p>\n\u003col>\u003cli>\u003cstrong>予測不能なスパイク\u003c/strong> — マグニチュード 7 の地震は数秒でトラフィックを 10 倍にしうる。\u003c/li> \u003cli>\u003cstrong>複数の入口\u003c/strong> — 外部 API、CLI エージェント、SignalR、定期実行ジョブ。\u003c/li> \u003cli>\u003cstrong>監査必須\u003c/strong> — すべての状態変更に \u003ccode>trace_id\u003c/code>, \u003ccode>actor\u003c/code>, \u003ccode>reason\u003c/code> が必要。\u003c/li> \u003cli>\u003cstrong>継続的進化\u003c/strong> — phase 8、9、10 と、システムはプロジェクトと共に成長する。\u003c/li>\u003c/ol>\n\u003cp>Clean Architecture は、これらを単方向依存のレイヤへ分離します。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>Domain         → 業務ロジックのみ。インフラ import を持たない\nApplication    → ユースケース (Commands, Queries, Handlers)\nInfrastructure → EF Core, PostGIS, SignalR, Keycloak\nPresentation   → ASP.NET Core Controllers, Minimal API\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>MediatR による CQRS\u003c/h2>\n\u003cp>CQRS（Command Query Responsibility Segregation）は、書き込み (Command) と読み取り (Query) を分離します。\u003c/p>\n\u003ch3>Command: incident を作る\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Application/Commands/CreateIncidentCommand.cs\npublic record CreateIncidentCommand(\n    string EventId,\n    IncidentType Type,\n    int Severity,\n    GeoJsonGeometry Location,\n    DateTimeOffset OccurredAt,\n    string ActorId\n) : IRequest&lt;Result&lt;IncidentDto&gt;&gt;;\n\npublic class CreateIncidentHandler : IRequestHandler&lt;CreateIncidentCommand, Result&lt;IncidentDto&gt;&gt;\n{\n    private readonly IIncidentRepository _incidents;\n    private readonly IEventBus _eventBus;\n    private readonly IAuditLog _audit;\n\n    public async Task&lt;Result&lt;IncidentDto&gt;&gt; Handle(\n        CreateIncidentCommand cmd, CancellationToken ct)\n    {\n        // Domain validation\n        if (cmd.Severity &lt; 1 || cmd.Severity &gt; 10)\n            return Result.Fail(&quot;Severity must be between 1 and 10&quot;);\n\n        var incident = Incident.Create(\n            cmd.EventId, cmd.Type, cmd.Severity,\n            cmd.Location, cmd.OccurredAt);\n\n        await _incidents.AddAsync(incident, ct);\n\n        // Audit trail — 常に記録\n        await _audit.RecordAsync(new AuditEntry(\n            Actor:   cmd.ActorId,\n            Action:  &quot;incident.created&quot;,\n            TraceId: Activity.Current?.TraceId.ToString() ?? Guid.NewGuid().ToString(),\n            Payload: JsonSerializer.Serialize(incident)\n        ), ct);\n\n        // Domain event: SignalR, ML, critical ops を通知\n        if (incident.Severity &gt;= 7)\n            _eventBus.Publish(new CriticalIncidentCreated(incident));\n\n        return Result.Ok(incident.ToDto());\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>Query: PostGIS による空間検索\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Application/Queries/GetIncidentsInRadiusQuery.cs\npublic record GetIncidentsInRadiusQuery(\n    double Lat, double Lon, double RadiusKm\n) : IRequest&lt;IReadOnlyList&lt;IncidentDto&gt;&gt;;\n\npublic class GetIncidentsInRadiusHandler\n    : IRequestHandler&lt;GetIncidentsInRadiusQuery, IReadOnlyList&lt;IncidentDto&gt;&gt;\n{\n    private readonly SosDbContext _db;\n\n    public async Task&lt;IReadOnlyList&lt;IncidentDto&gt;&gt; Handle(\n        GetIncidentsInRadiusQuery q, CancellationToken ct)\n    {\n        var point = new Point(q.Lon, q.Lat) { SRID = 4326 };\n        double radiusMeters = q.RadiusKm * 1000;\n\n        return await _db.Incidents\n            .Where(i =&gt; i.Location.IsWithinDistance(point, radiusMeters))\n            .OrderByDescending(i =&gt; i.Severity)\n            .ThenByDescending(i =&gt; i.OccurredAt)\n            .Select(i =&gt; i.ToDto())\n            .ToListAsync(ct);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>重要運用のための domain event\u003c/h2>\n\u003cp>ドメインは、誰が消費するかを知らずに event を publish します。反応を配線するのは infrastructure です。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// Domain/Events/CriticalIncidentCreated.cs\npublic record CriticalIncidentCreated(Incident Incident) : IDomainEvent;\n\n// Infrastructure/EventHandlers/NotifyOpsOnCriticalIncident.cs\npublic class NotifyOpsOnCriticalIncident\n    : INotificationHandler&lt;CriticalIncidentCreated&gt;\n{\n    private readonly IHubContext&lt;OpsHub&gt; _hub;\n    private readonly IRiskModelClient _riskModel;\n\n    public async Task Handle(CriticalIncidentCreated e, CancellationToken ct)\n    {\n        // 1. SignalR 経由でリアルタイム dashboard を通知\n        await _hub.Clients.Group(&quot;ops-commanders&quot;)\n            .SendAsync(&quot;IncidentAlert&quot;, e.Incident.ToAlertPayload(), ct);\n\n        // 2. ML Unit へリスク分析を依頼 (async)\n        await _riskModel.RequestAnalysisAsync(e.Incident.Location, ct);\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>横断 concern のための pipeline behavior\u003c/h2>\n\u003cp>MediatR では、logging、validation、retry のような behavior をすべての Command / Query に適用できます。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>// すべての handler より前に DI 登録\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(ValidationBehavior&lt;,&gt;));\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(LoggingBehavior&lt;,&gt;));\nservices.AddTransient(typeof(IPipelineBehavior&lt;,&gt;), typeof(DistributedTracingBehavior&lt;,&gt;));\n\n// LoggingBehavior.cs\npublic class LoggingBehavior&lt;TRequest, TResponse&gt;\n    : IPipelineBehavior&lt;TRequest, TResponse&gt;\n{\n    private readonly ILogger&lt;TRequest&gt; _logger;\n\n    public async Task&lt;TResponse&gt; Handle(\n        TRequest req, RequestHandlerDelegate&lt;TResponse&gt; next, CancellationToken ct)\n    {\n        var sw = Stopwatch.StartNew();\n        _logger.LogInformation(&quot;Handling {Request}&quot;, typeof(TRequest).Name);\n        var response = await next();\n        _logger.LogInformation(&quot;Handled {Request} in {Elapsed}ms&quot;,\n            typeof(TRequest).Name, sw.ElapsedMilliseconds);\n        return response;\n    }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>2026 年 4 月リファクタ後のフォルダ構造\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>backend-dotnet/\n  SOSLocation.Domain/\n    Entities/       Incident, Resource, Mission, WatchPoint\n    Events/         CriticalIncidentCreated, ResourceAllocated\n    ValueObjects/   GeoPoint, Severity, IncidentType\n  SOSLocation.Application/\n    Commands/       CreateIncidentCommand, AllocateResourceCommand\n    Queries/        GetIncidentsInRadiusQuery, GetMissionStatusQuery\n    Behaviors/      ValidationBehavior, LoggingBehavior\n  SOSLocation.Infrastructure/\n    Persistence/    SosDbContext (EF Core + Npgsql + PostGIS)\n    SignalR/        OpsHub, NotificationHub\n    ML/             RiskModelClient (FastAPI gRPC)\n    Auth/           KeycloakAuthHandler\n  SOSLocation.API/\n    Endpoints/      IncidentEndpoints (Minimal API)\n    Hubs/           OpsHub registration\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>この構造なら、Phase 10 まで成長しても無秩序な技術的負債を積み上げずに済みます。新しい統合先には必ず置き場があり、ドメインは infrastructure を知る必要がありません。\u003c/p>"}, {"id": "post-sos-location-webgl-3d-city-engine", "kind": "post", "name": "SOS Location: Motor WebGL 3D de visualização de cidades em tempo real", "headline": "Como construímos um motor WebGL 2.0 com Three.js para renderizar cidades completas com terreno, edificações 3D e camadas de desastre ao vivo.", "summary": "Como construímos um motor WebGL 2.0 com Three.js para renderizar cidades completas com terreno, edificações 3D e camadas de desastre ao vivo.", "status": "production", "stack": ["webgl", "threejs", "gis", "3d", "typescript"], "url": "/posts/2026-04-05-1200-sos-location-webgl-3d-city-engine/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-05-1200-sos-location-webgl-3d-city-engine/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": true, "body_html": "\u003ch1>Motor WebGL 3D: reconstruindo cidades para salvar vidas\u003c/h1>\n\u003cp>O SOS Location v2.0 precisava responder a uma pergunta simples com uma resposta extremamente difícil: \u003cem>como dar a um comandante de operações uma visão tática de alta definição de uma cidade inteira, em tempo real, durante uma catástrofe?\u003c/em>\u003c/p>\n\u003cp>A resposta foi construir um \u003cstrong>motor WebGL 2.0 do zero\u003c/strong>, usando Three.js como base e dados abertos para reconstruir a malha urbana.\u003c/p>\n\u003ch2>Fontes de dados para o mundo 3D\u003c/h2>\n\u003cp>Antes de qualquer shader, o problema é de dados:\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fonte\u003c/th>\u003cth>O que oferece\u003c/th>\u003cth>API\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OpenTopography (SRTMGL1)\u003c/td>\u003ctd>DEM 30m global\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OpenStreetMap / Overpass\u003c/td>\u003ctd>Edificações 3D, ruas\u003c/td>\u003ctd>Overpass QL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open-Meteo\u003c/td>\u003ctd>Clima em tempo real\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IBGE\u003c/td>\u003ctd>Dados populacionais\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>O fluxo de ingestão começa com uma query Overpass para buscar todas as edificações dentro de um bounding box:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const overpassQuery = `\n  [out:json][timeout:60];\n  (\n    way[&quot;building&quot;](${bbox});\n    relation[&quot;building&quot;](${bbox});\n  );\n  out body;\n  &gt;;\n  out skel qt;\n`;\n\nconst buildings = await fetchOverpass(overpassQuery);\nconst meshes = buildings.elements\n  .filter(el =&gt; el.type === &#x27;way&#x27; &amp;&amp; el.nodes)\n  .map(el =&gt; buildingToMesh(el, demElevation));\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Construindo o terreno\u003c/h2>\n\u003cp>O DEM (Digital Elevation Model) é um grid de elevações. A conversão para \u003ccode>PlaneGeometry\u003c/code> Three.js:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>function demToTerrain(dem: Float32Array, width: number, height: number): THREE.Mesh {\n  const geometry = new THREE.PlaneGeometry(\n    TILE_SIZE_METERS, TILE_SIZE_METERS,\n    width - 1, height - 1\n  );\n\n  const positions = geometry.attributes.position.array as Float32Array;\n  for (let i = 0; i &lt; dem.length; i++) {\n    // Z está no índice 2 de cada vértice (x, y, z)\n    positions[i * 3 + 2] = dem[i] * ELEVATION_SCALE;\n  }\n  geometry.computeVertexNormals();\n\n  const material = new THREE.MeshStandardMaterial({\n    map: terrainTexture,\n    displacementMap: demTexture,\n    wireframe: false,\n  });\n\n  return new THREE.Mesh(geometry, material);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Edificações 3D com telhados\u003c/h2>\n\u003cp>Cada edificação OSM vira um \u003ccode>ExtrudeGeometry\u003c/code>. O desafio é que o polígono OSM é 2D; a altura vem do tag \u003ccode>building:levels\u003c/code> ou \u003ccode>height\u003c/code>:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>function buildingToMesh(way: OsmWay, dem: DemProvider): THREE.Mesh {\n  const coords = way.nodes.map(id =&gt; nodeMap[id]);\n  const shape = new THREE.Shape(\n    coords.map(c =&gt; new THREE.Vector2(c.lon * SCALE, c.lat * SCALE))\n  );\n\n  const levels  = parseInt(way.tags?.[&#x27;building:levels&#x27;] ?? &#x27;2&#x27;, 10);\n  const height  = parseFloat(way.tags?.height ?? String(levels * 3.2));\n  const baseElev = dem.getElevationAt(way.center.lat, way.center.lon);\n\n  const geometry = new THREE.ExtrudeGeometry(shape, {\n    depth: height,\n    bevelEnabled: false,\n  });\n\n  const material = buildingMaterialByType(way.tags?.building || &#x27;yes&#x27;);\n  const mesh = new THREE.Mesh(geometry, material);\n  mesh.position.z = baseElev * ELEVATION_SCALE;\n  return mesh;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Camadas de desastre ao vivo\u003c/h2>\n\u003cp>O que diferencia o SOS Location de um simples visualizador 3D é a \u003cstrong>sobreposição de camadas de risco em tempo real\u003c/strong>. Cada camada é um shader personalizado.\u003c/p>\n\u003ch3>Shader de inundação (FragmentShader)\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"glsl\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">glsl\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>uniform float u_waterLevel;\nuniform float u_time;\nuniform sampler2D u_elevation;\n\nvarying vec2 v_uv;\nvarying float v_elevation;\n\nvoid main() {\n  float distToWater = u_waterLevel - v_elevation;\n\n  if (distToWater &gt; 0.0) {\n    // Água: animação ondular baseada em sin/cos\n    float wave = sin(v_uv.x * 40.0 + u_time * 2.0) * 0.5\n               + cos(v_uv.y * 40.0 + u_time * 1.7) * 0.5;\n    float depth = clamp(distToWater / 5.0, 0.0, 1.0);\n    vec3 waterColor = mix(vec3(0.1, 0.4, 0.8), vec3(0.0, 0.1, 0.5), depth);\n    gl_FragColor = vec4(waterColor + wave * 0.05, 0.75);\n  } else {\n    discard;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>Integração das camadas no pipeline\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>class DisasterLayerManager {\n  private layers = new Map&lt;DisasterType, THREE.Mesh&gt;();\n\n  addLayer(type: DisasterType, params: LayerParams) {\n    const geometry = new THREE.PlaneGeometry(TILE_SIZE, TILE_SIZE, 128, 128);\n    const material = this.shaderForType(type, params);\n    const mesh = new THREE.Mesh(geometry, material);\n    this.scene.add(mesh);\n    this.layers.set(type, mesh);\n  }\n\n  update(deltaT: number, realTimeData: RealTimePayload) {\n    this.layers.forEach((mesh, type) =&gt; {\n      const mat = mesh.material as THREE.ShaderMaterial;\n      mat.uniforms.u_time.value += deltaT;\n      if (type === &#x27;flood&#x27;) {\n        mat.uniforms.u_waterLevel.value = realTimeData.waterLevel;\n      }\n    });\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Resultado operacional\u003c/h2>\n\u003cp>O motor renderiza cidades completas a 60fps num navegador desktop moderno:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Curitiba (BR)\u003c/strong>: ~12.000 edificações, DEM 30m → carregamento em ~3s\u003c/li> \u003cli>\u003cstrong>Shimane (JP)\u003c/strong>: testado com dados do GSI/MLIT\u003c/li> \u003cli>Camadas ativas: inundação, incêndio, deslizamento, terremoto (vibração por shader)\u003c/li>\u003c/ul>\n\u003cp>O próximo passo (Fase 9) é o \u003cstrong>Full WebGL City Component\u003c/strong> com Keycloak-gated access para centros de comando reais.\u003c/p>\n\u003ch2>Link com o projeto\u003c/h2>\n\u003cp>Esse motor é o coração do \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>. Os posts de arquitetura descrevem como as camadas de dados chegam até ele.\u003c/p>", "title_en_us": "SOS Location: WebGL 3D City Engine for Real-Time Visualization", "title_ja_jp": "SOS Location：リアルタイム都市可視化のための WebGL 3D エンジン", "summary_en_us": "How we built a WebGL 2.0 engine with Three.js to render full cities with terrain, 3D buildings and live disaster layers.", "summary_ja_jp": "Three.js による WebGL 2.0 エンジンを構築し、地形・3D 建物・ライブ災害レイヤを含む都市全体をどうレンダリングしたか。", "body_html_en_us": "\u003ch1>WebGL 3D Engine: rebuilding cities to save lives\u003c/h1>\n\u003cp>SOS Location v2.0 had to answer a simple question with an extremely difficult solution: \u003cem>how do you give an operations commander a high-definition tactical view of an entire city, in real time, during a catastrophe?\u003c/em>\u003c/p>\n\u003cp>The answer was to build a \u003cstrong>WebGL 2.0 engine from scratch\u003c/strong>, using Three.js as the base and open data to reconstruct the urban mesh.\u003c/p>\n\u003ch2>Data sources for the 3D world\u003c/h2>\n\u003cp>Before any shader, the real problem is data:\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Source\u003c/th>\u003cth>What it provides\u003c/th>\u003cth>API\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OpenTopography (SRTMGL1)\u003c/td>\u003ctd>Global 30m DEM\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OpenStreetMap / Overpass\u003c/td>\u003ctd>3D buildings, streets\u003c/td>\u003ctd>Overpass QL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open-Meteo\u003c/td>\u003ctd>Real-time weather\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IBGE\u003c/td>\u003ctd>Population datasets\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The ingestion flow starts with an Overpass query that fetches every building inside a bounding box:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const overpassQuery = `\n  [out:json][timeout:60];\n  (\n    way[&quot;building&quot;](${bbox});\n    relation[&quot;building&quot;](${bbox});\n  );\n  out body;\n  &gt;;\n  out skel qt;\n`;\n\nconst buildings = await fetchOverpass(overpassQuery);\nconst meshes = buildings.elements\n  .filter(el =&gt; el.type === &#x27;way&#x27; &amp;&amp; el.nodes)\n  .map(el =&gt; buildingToMesh(el, demElevation));\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Building the terrain\u003c/h2>\n\u003cp>The DEM (Digital Elevation Model) is an elevation grid. The conversion to Three.js \u003ccode>PlaneGeometry\u003c/code> looks like this:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>function demToTerrain(dem: Float32Array, width: number, height: number): THREE.Mesh {\n  const geometry = new THREE.PlaneGeometry(\n    TILE_SIZE_METERS, TILE_SIZE_METERS,\n    width - 1, height - 1\n  );\n\n  const positions = geometry.attributes.position.array as Float32Array;\n  for (let i = 0; i &lt; dem.length; i++) {\n    // Z sits at index 2 of each vertex (x, y, z)\n    positions[i * 3 + 2] = dem[i] * ELEVATION_SCALE;\n  }\n  geometry.computeVertexNormals();\n\n  const material = new THREE.MeshStandardMaterial({\n    map: terrainTexture,\n    displacementMap: demTexture,\n    wireframe: false,\n  });\n\n  return new THREE.Mesh(geometry, material);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>3D buildings with roofs\u003c/h2>\n\u003cp>Each OSM building becomes an \u003ccode>ExtrudeGeometry\u003c/code>. The challenge is that the OSM polygon is 2D, while height comes from \u003ccode>building:levels\u003c/code> or \u003ccode>height\u003c/code> tags:\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>function buildingToMesh(way: OsmWay, dem: DemProvider): THREE.Mesh {\n  const coords = way.nodes.map(id =&gt; nodeMap[id]);\n  const shape = new THREE.Shape(\n    coords.map(c =&gt; new THREE.Vector2(c.lon * SCALE, c.lat * SCALE))\n  );\n\n  const levels  = parseInt(way.tags?.[&#x27;building:levels&#x27;] ?? &#x27;2&#x27;, 10);\n  const height  = parseFloat(way.tags?.height ?? String(levels * 3.2));\n  const baseElev = dem.getElevationAt(way.center.lat, way.center.lon);\n\n  const geometry = new THREE.ExtrudeGeometry(shape, {\n    depth: height,\n    bevelEnabled: false,\n  });\n\n  const material = buildingMaterialByType(way.tags?.building || &#x27;yes&#x27;);\n  const mesh = new THREE.Mesh(geometry, material);\n  mesh.position.z = baseElev * ELEVATION_SCALE;\n  return mesh;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Live disaster layers\u003c/h2>\n\u003cp>What makes SOS Location different from a generic 3D viewer is the \u003cstrong>real-time overlay of risk layers\u003c/strong>. Each layer is backed by a custom shader.\u003c/p>\n\u003ch3>Flood shader (FragmentShader)\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"glsl\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">glsl\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>uniform float u_waterLevel;\nuniform float u_time;\nuniform sampler2D u_elevation;\n\nvarying vec2 v_uv;\nvarying float v_elevation;\n\nvoid main() {\n  float distToWater = u_waterLevel - v_elevation;\n\n  if (distToWater &gt; 0.0) {\n    // Water: wave animation driven by sin/cos\n    float wave = sin(v_uv.x * 40.0 + u_time * 2.0) * 0.5\n               + cos(v_uv.y * 40.0 + u_time * 1.7) * 0.5;\n    float depth = clamp(distToWater / 5.0, 0.0, 1.0);\n    vec3 waterColor = mix(vec3(0.1, 0.4, 0.8), vec3(0.0, 0.1, 0.5), depth);\n    gl_FragColor = vec4(waterColor + wave * 0.05, 0.75);\n  } else {\n    discard;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>Integrating layers into the pipeline\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>class DisasterLayerManager {\n  private layers = new Map&lt;DisasterType, THREE.Mesh&gt;();\n\n  addLayer(type: DisasterType, params: LayerParams) {\n    const geometry = new THREE.PlaneGeometry(TILE_SIZE, TILE_SIZE, 128, 128);\n    const material = this.shaderForType(type, params);\n    const mesh = new THREE.Mesh(geometry, material);\n    this.scene.add(mesh);\n    this.layers.set(type, mesh);\n  }\n\n  update(deltaT: number, realTimeData: RealTimePayload) {\n    this.layers.forEach((mesh, type) =&gt; {\n      const mat = mesh.material as THREE.ShaderMaterial;\n      mat.uniforms.u_time.value += deltaT;\n      if (type === &#x27;flood&#x27;) {\n        mat.uniforms.u_waterLevel.value = realTimeData.waterLevel;\n      }\n    });\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Operational result\u003c/h2>\n\u003cp>The engine renders full cities at 60 FPS in a modern desktop browser:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Curitiba (BR)\u003c/strong>: ~12,000 buildings, 30m DEM, load time around 3s\u003c/li> \u003cli>\u003cstrong>Shimane (JP)\u003c/strong>: validated with GSI / MLIT datasets\u003c/li> \u003cli>Active layers: flood, fire, landslide and earthquake vibration (shader-based)\u003c/li>\u003c/ul>\n\u003cp>The next step, Phase 9, is the \u003cstrong>Full WebGL City Component\u003c/strong> with Keycloak-gated access for real command centers.\u003c/p>\n\u003ch2>Link to the project\u003c/h2>\n\u003cp>This engine is the core of \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>. The architecture posts explain how the data layers arrive here.\u003c/p>", "body_html_ja_jp": "\u003ch1>WebGL 3D エンジン: 命を救うために都市を再構築する\u003c/h1>\n\u003cp>SOS Location v2.0 は、極めて難しい問いに答える必要がありました。\u003cem>災害時に、都市全体の高精細な戦術ビューを、どうやってリアルタイムで運用指揮官へ渡すか?\u003c/em>\u003c/p>\n\u003cp>その答えが、Three.js を基盤に、オープンデータから都市メッシュを再構築する \u003cstrong>WebGL 2.0 エンジンをゼロから作ること\u003c/strong> でした。\u003c/p>\n\u003ch2>3D 世界のためのデータソース\u003c/h2>\n\u003cp>shader より前に、まず問題になるのはデータです。\u003c/p>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ソース\u003c/th>\u003cth>提供内容\u003c/th>\u003cth>API\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OpenTopography (SRTMGL1)\u003c/td>\u003ctd>グローバル 30m DEM\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OpenStreetMap / Overpass\u003c/td>\u003ctd>3D 建物、道路\u003c/td>\u003ctd>Overpass QL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open-Meteo\u003c/td>\u003ctd>リアルタイム気象\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IBGE\u003c/td>\u003ctd>人口統計データ\u003c/td>\u003ctd>REST\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>取り込みフローは、bounding box 内の建物を一括取得する Overpass query から始まります。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const overpassQuery = `\n  [out:json][timeout:60];\n  (\n    way[&quot;building&quot;](${bbox});\n    relation[&quot;building&quot;](${bbox});\n  );\n  out body;\n  &gt;;\n  out skel qt;\n`;\n\nconst buildings = await fetchOverpass(overpassQuery);\nconst meshes = buildings.elements\n  .filter(el =&gt; el.type === &#x27;way&#x27; &amp;&amp; el.nodes)\n  .map(el =&gt; buildingToMesh(el, demElevation));\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>地形の構築\u003c/h2>\n\u003cp>DEM（Digital Elevation Model）は標高グリッドです。Three.js の \u003ccode>PlaneGeometry\u003c/code> へ変換する処理は次のようになります。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>function demToTerrain(dem: Float32Array, width: number, height: number): THREE.Mesh {\n  const geometry = new THREE.PlaneGeometry(\n    TILE_SIZE_METERS, TILE_SIZE_METERS,\n    width - 1, height - 1\n  );\n\n  const positions = geometry.attributes.position.array as Float32Array;\n  for (let i = 0; i &lt; dem.length; i++) {\n    // 各頂点は (x, y, z) で、Z は index 2 にある\n    positions[i * 3 + 2] = dem[i] * ELEVATION_SCALE;\n  }\n  geometry.computeVertexNormals();\n\n  const material = new THREE.MeshStandardMaterial({\n    map: terrainTexture,\n    displacementMap: demTexture,\n    wireframe: false,\n  });\n\n  return new THREE.Mesh(geometry, material);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>屋根付き 3D 建物\u003c/h2>\n\u003cp>各 OSM 建物は \u003ccode>ExtrudeGeometry\u003c/code> になります。難しいのは、OSM polygon は 2D なのに、高さは \u003ccode>building:levels\u003c/code> や \u003ccode>height\u003c/code> tag から来ることです。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>function buildingToMesh(way: OsmWay, dem: DemProvider): THREE.Mesh {\n  const coords = way.nodes.map(id =&gt; nodeMap[id]);\n  const shape = new THREE.Shape(\n    coords.map(c =&gt; new THREE.Vector2(c.lon * SCALE, c.lat * SCALE))\n  );\n\n  const levels  = parseInt(way.tags?.[&#x27;building:levels&#x27;] ?? &#x27;2&#x27;, 10);\n  const height  = parseFloat(way.tags?.height ?? String(levels * 3.2));\n  const baseElev = dem.getElevationAt(way.center.lat, way.center.lon);\n\n  const geometry = new THREE.ExtrudeGeometry(shape, {\n    depth: height,\n    bevelEnabled: false,\n  });\n\n  const material = buildingMaterialByType(way.tags?.building || &#x27;yes&#x27;);\n  const mesh = new THREE.Mesh(geometry, material);\n  mesh.position.z = baseElev * ELEVATION_SCALE;\n  return mesh;\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>リアルタイム災害レイヤ\u003c/h2>\n\u003cp>SOS Location を単なる 3D ビューアと分けるのは、\u003cstrong>リスクレイヤをリアルタイムで重ねること\u003c/strong> です。各レイヤはカスタム shader で表現されます。\u003c/p>\n\u003ch3>洪水 shader (FragmentShader)\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"glsl\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">glsl\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>uniform float u_waterLevel;\nuniform float u_time;\nuniform sampler2D u_elevation;\n\nvarying vec2 v_uv;\nvarying float v_elevation;\n\nvoid main() {\n  float distToWater = u_waterLevel - v_elevation;\n\n  if (distToWater &gt; 0.0) {\n    // 水面: sin/cos による波アニメーション\n    float wave = sin(v_uv.x * 40.0 + u_time * 2.0) * 0.5\n               + cos(v_uv.y * 40.0 + u_time * 1.7) * 0.5;\n    float depth = clamp(distToWater / 5.0, 0.0, 1.0);\n    vec3 waterColor = mix(vec3(0.1, 0.4, 0.8), vec3(0.0, 0.1, 0.5), depth);\n    gl_FragColor = vec4(waterColor + wave * 0.05, 0.75);\n  } else {\n    discard;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>パイプラインへのレイヤ統合\u003c/h3>\n\u003cdiv class=\"code-shell\" data-language=\"typescript\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">typescript\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>class DisasterLayerManager {\n  private layers = new Map&lt;DisasterType, THREE.Mesh&gt;();\n\n  addLayer(type: DisasterType, params: LayerParams) {\n    const geometry = new THREE.PlaneGeometry(TILE_SIZE, TILE_SIZE, 128, 128);\n    const material = this.shaderForType(type, params);\n    const mesh = new THREE.Mesh(geometry, material);\n    this.scene.add(mesh);\n    this.layers.set(type, mesh);\n  }\n\n  update(deltaT: number, realTimeData: RealTimePayload) {\n    this.layers.forEach((mesh, type) =&gt; {\n      const mat = mesh.material as THREE.ShaderMaterial;\n      mat.uniforms.u_time.value += deltaT;\n      if (type === &#x27;flood&#x27;) {\n        mat.uniforms.u_waterLevel.value = realTimeData.waterLevel;\n      }\n    });\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>運用上の成果\u003c/h2>\n\u003cp>このエンジンは、現代的なデスクトップ・ブラウザ上で都市全体を 60 FPS で描画します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Curitiba (BR)\u003c/strong>: 建物約 12,000 棟、30m DEM、読み込み約 3 秒\u003c/li> \u003cli>\u003cstrong>Shimane (JP)\u003c/strong>: GSI / MLIT データで検証済み\u003c/li> \u003cli>有効レイヤ: 洪水、火災、土砂災害、地震振動（shader ベース）\u003c/li>\u003c/ul>\n\u003cp>次の段階、Phase 9 は \u003cstrong>Full WebGL City Component\u003c/strong> です。実際の指揮センター向けに、Keycloak でアクセス制御します。\u003c/p>\n\u003ch2>プロジェクトとの接続\u003c/h2>\n\u003cp>このエンジンは \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a> の中核です。アーキテクチャ関連の posts が、データレイヤがここへ届く流れを説明しています。\u003c/p>"}, {"id": "post-sos-location-stack", "kind": "post", "name": "SOS Location: Tecnologias, ferramentas e exemplos", "headline": "Visão completa da stack, dos conceitos-chave e dos exemplos de código do SOS Location.", "summary": "Visão completa da stack, dos conceitos-chave e dos exemplos de código do SOS Location.", "status": "production", "stack": ["gis", "techstack", "sos"], "url": "/posts/2026-04-05-1100-sos-location-stack/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-05-1100-sos-location-stack/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": true, "body_html": "\u003ch1>Stack, conceitos e ferramentas do SOS Location\u003c/h1>\n\u003ch2>Tecnologias usadas\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>TypeScript &amp; Node.js\u003c/strong> na ingestão e no núcleo de normalização.\u003c/li> \u003cli>\u003cstrong>.NET 8\u003c/strong> com ASP.NET Core para APIs de borda, execução de pipelines e orquestração.\u003c/li> \u003cli>\u003cstrong>PostgreSQL + PostGIS\u003c/strong> para armazenamento espacial com índices \u003ccode>GIST\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Kafka + Redis Streams\u003c/strong> como backbone dos eventos.\u003c/li> \u003cli>\u003cstrong>React + Leaflet + D3\u003c/strong> para o dashboard e o mapa operacional.\u003c/li> \u003cli>\u003cstrong>Grafana + Loki + Tempo\u003c/strong> para observabilidade.\u003c/li> \u003cli>\u003cstrong>OpenTelemetry\u003c/strong> para tracing distribuído.\u003c/li>\u003c/ul>\n\u003ch2>Conceitos fundamentais\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Segurança de contexto\u003c/strong>: cada diagnóstico carrega um \u003ccode>trust_level\u003c/code> e só libera dados sensíveis após o agente ser autenticado.\u003c/li> \u003cli>\u003cstrong>Mapa operacional ativo\u003c/strong>: o front-end consome camadas \u003ccode>tiles\u003c/code> + \u003ccode>vector layers\u003c/code> e aplica \u003ccode>levels\u003c/code> de criticidade.\u003c/li> \u003cli>\u003cstrong>Conversação com agentes\u003c/strong>: subagentes (via \u003ccode>ronaldinho-agent\u003c/code>) consultam \u003ccode>event history\u003c/code> antes de alterar estados.\u003c/li>\u003c/ol>\n\u003ch2>Exemplos de código\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>[HttpGet(&quot;incidents&quot;)]\npublic IActionResult GetIncidents(string region)\n{\n    var incidents = _repository.Fetch(region, DateTime.UtcNow.AddHours(-2));\n    return Ok(incidents);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code-shell\" data-language=\"ts\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">ts\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const watchResource = async (resourceId: string) =&gt; {\n  const data = await fetch(`/api/resources/${resourceId}`);\n  renderOnMap(data);\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Diagramas e mapas mentais\u003c/h2>\n\u003cp>Para cada novo requisito criamos um mini-diagrama com Mermaid e o versionamos como documento; este post funciona como índice técnico dentro do projeto \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>.\u003c/p>\n\u003ch2>Conexão com o projeto\u003c/h2>\n\u003cp>Todos os documentos e publicações desta série estão linkados pelo campo \u003ccode>project_url\u003c/code> e comentam os conceitos listados no roadmap do projeto \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>.\u003c/p>", "title_en_us": "SOS Location: Technologies, Tools and Examples", "title_ja_jp": "SOS Location：技術スタック、ツール、サンプル", "summary_en_us": "Full overview of SOS Location's stack, key concepts and code examples.", "summary_ja_jp": "SOS Location のスタック、主要概念、コード例の総覧。", "body_html_en_us": "\u003ch1>SOS Location stack, concepts and tools\u003c/h1>\n\u003ch2>Technologies in use\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>TypeScript &amp; Node.js\u003c/strong> for ingestion and the normalization core.\u003c/li> \u003cli>\u003cstrong>.NET 8\u003c/strong> with ASP.NET Core for edge APIs, pipeline execution and orchestration.\u003c/li> \u003cli>\u003cstrong>PostgreSQL + PostGIS\u003c/strong> for spatial storage with \u003ccode>GIST\u003c/code> indexes.\u003c/li> \u003cli>\u003cstrong>Kafka + Redis Streams\u003c/strong> as the event backbone.\u003c/li> \u003cli>\u003cstrong>React + Leaflet + D3\u003c/strong> for the dashboard and operational map.\u003c/li> \u003cli>\u003cstrong>Grafana + Loki + Tempo\u003c/strong> for observability.\u003c/li> \u003cli>\u003cstrong>OpenTelemetry\u003c/strong> for distributed tracing.\u003c/li>\u003c/ul>\n\u003ch2>Core concepts\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Context safety\u003c/strong>: each diagnosis carries a \u003ccode>trust_level\u003c/code> and only releases sensitive data after the agent is authenticated.\u003c/li> \u003cli>\u003cstrong>Active operational map\u003c/strong>: the frontend consumes \u003ccode>tiles\u003c/code> and \u003ccode>vector layers\u003c/code> and applies severity levels.\u003c/li> \u003cli>\u003cstrong>Conversation with agents\u003c/strong>: subagents, via \u003ccode>ronaldinho-agent\u003c/code>, consult event history before mutating state.\u003c/li>\u003c/ol>\n\u003ch2>Code examples\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>[HttpGet(&quot;incidents&quot;)]\npublic IActionResult GetIncidents(string region)\n{\n    var incidents = _repository.Fetch(region, DateTime.UtcNow.AddHours(-2));\n    return Ok(incidents);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code-shell\" data-language=\"ts\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">ts\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const watchResource = async (resourceId: string) =&gt; {\n  const data = await fetch(`/api/resources/${resourceId}`);\n  renderOnMap(data);\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Diagrams and mental maps\u003c/h2>\n\u003cp>For every new requirement, we create a small Mermaid diagram and version it as a document. This post works as a technical index inside \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>.\u003c/p>\n\u003ch2>Connection to the project\u003c/h2>\n\u003cp>All documents and publications in this series are linked through \u003ccode>project_url\u003c/code> and comment on the concepts listed in the \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a> roadmap.\u003c/p>", "body_html_ja_jp": "\u003ch1>SOS Location のスタック、概念、ツール\u003c/h1>\n\u003ch2>使用技術\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>TypeScript &amp; Node.js\u003c/strong> を取り込みと正規化コアに使用。\u003c/li> \u003cli>\u003cstrong>.NET 8\u003c/strong> + ASP.NET Core を edge API、パイプライン実行、オーケストレーションに使用。\u003c/li> \u003cli>\u003cstrong>PostgreSQL + PostGIS\u003c/strong> を \u003ccode>GIST\u003c/code> index 付きの空間ストレージとして使用。\u003c/li> \u003cli>\u003cstrong>Kafka + Redis Streams\u003c/strong> をイベント基盤として使用。\u003c/li> \u003cli>\u003cstrong>React + Leaflet + D3\u003c/strong> を dashboard と operational map に使用。\u003c/li> \u003cli>\u003cstrong>Grafana + Loki + Tempo\u003c/strong> を observability に使用。\u003c/li> \u003cli>\u003cstrong>OpenTelemetry\u003c/strong> を分散 tracing に使用。\u003c/li>\u003c/ul>\n\u003ch2>中核概念\u003c/h2>\n\u003col>\u003cli>\u003cstrong>文脈の安全性\u003c/strong>: 各診断は \u003ccode>trust_level\u003c/code> を持ち、エージェント認証後にのみ機微データを解放する。\u003c/li> \u003cli>\u003cstrong>アクティブな運用マップ\u003c/strong>: frontend は \u003ccode>tiles\u003c/code> と \u003ccode>vector layers\u003c/code> を取り込み、危険度レベルを適用する。\u003c/li> \u003cli>\u003cstrong>エージェントとの対話\u003c/strong>: \u003ccode>ronaldinho-agent\u003c/code> 経由の subagent は、状態変更前に event history を参照する。\u003c/li>\u003c/ol>\n\u003ch2>コード例\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"csharp\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">csharp\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>[HttpGet(&quot;incidents&quot;)]\npublic IActionResult GetIncidents(string region)\n{\n    var incidents = _repository.Fetch(region, DateTime.UtcNow.AddHours(-2));\n    return Ok(incidents);\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code-shell\" data-language=\"ts\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">ts\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const watchResource = async (resourceId: string) =&gt; {\n  const data = await fetch(`/api/resources/${resourceId}`);\n  renderOnMap(data);\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>図とマインドマップ\u003c/h2>\n\u003cp>新しい要件ごとに、小さな Mermaid 図を作り、document として version 管理します。この post は \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a> の技術インデックスとして機能します。\u003c/p>\n\u003ch2>プロジェクトとの接続\u003c/h2>\n\u003cp>このシリーズの document と publication はすべて \u003ccode>project_url\u003c/code> で結びついており、\u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a> の roadmap に列挙された概念を解説しています。\u003c/p>"}, {"id": "post-sos-location-flow-architecture", "kind": "post", "name": "SOS Location: Fluxos, arquitetura e diagramas", "headline": "Descrição dos pipelines do SOS Location, diagramas e exemplos de código.", "summary": "Descrição dos pipelines do SOS Location, diagramas e exemplos de código.", "status": "production", "stack": ["gis", "architecture", "sos"], "url": "/posts/2026-04-05-1000-sos-location-flow-architecture/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-05-1000-sos-location-flow-architecture/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003ch1>Arquitetura e fluxo do SOS Location\u003c/h1>\n\u003cp>O pipeline do SOS Location conecta ingestão, enriquecimento e visualização. Abaixo está o diagrama de fluxo principal:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    Ingest[\"Ingestão\"] -->|Normalize| Processor[\"Normalizador\"]\n    Processor -->|Event Store| Repository[(\"PostgreSQL\")]\n    Processor --> Visualizer[\"Visualização (GIS)\"]\n    Visualizer -->|API| Frontend[\"Dashboard SOS\"]\n    Repository -->|API| Ops[\"Operational Map (WebSocket)\"]\u003c/div>\n\u003ch2>Componentes principais\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Ingestão\u003c/strong>: serviços em TypeScript conectam com APIs externas e escrevem no tópico \u003ccode>sos-events\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Normalizer\u003c/strong>: executado em Node.js e .NET (via gRPC) para aplicar regras de normalização (geometria, contexto, cluster).\u003c/li> \u003cli>\u003cstrong>Repository\u003c/strong>: PostgreSQL + PostGIS; índices \u003ccode>GIST\u003c/code> em \u003ccode>location\u003c/code>, \u003ccode>incident_type\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Visualização\u003c/strong>: front-end React/Leaflet consome WebSockets para atualizar camadas de risco.\u003c/li>\u003c/ul>\n\u003ch2>Exemplo de código\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"ts\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">ts\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const enqueueEvent = (event: IncomingEvent) =&gt; {\n  const normalized = normalize(event);\n  kafkaProducer.send({ topic: &quot;sos-events&quot;, messages: [{ value: JSON.stringify(normalized) }] });\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Observações operacionais\u003c/h2>\n\u003cul>\u003cli>Cada evento crítico dispara \u003ccode>notifyOps\u003c/code> se \u003ccode>normalized.region\u003c/code> estiver no mapa \u003ccode>coverageZones\u003c/code>.\u003c/li> \u003cli>O \u003ccode>LineOfSightService\u003c/code> recalcula visibilidade de recursos ao vivo a cada reconciliação.\u003c/li> \u003cli>O fluxo é monitorado com tracing distribuído (OpenTelemetry) para garantir latência abaixo de 2 segundos.\u003c/li>\u003c/ul>\n\u003ch2>Link com o projeto\u003c/h2>\n\u003cp>O post anterior lista as regras de negócio que justificam cada nó do fluxo; este detalha os mecanismos e diagramas do projeto \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>.\u003c/p>", "title_en_us": "SOS Location: Flows, Architecture and Diagrams", "title_ja_jp": "SOS Location：フロー、アーキテクチャ、図解", "summary_en_us": "Description of SOS Location pipelines, diagrams and code examples.", "summary_ja_jp": "SOS Location のパイプライン、ダイアグラム、コード例の解説。", "body_html_en_us": "\u003ch1>SOS Location architecture and flow\u003c/h1>\n\u003cp>The SOS Location pipeline connects ingestion, enrichment and visualization. Below is the main flow diagram:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    Ingest[\"Ingestion\"] -->|Normalize| Processor[\"Normalizer\"]\n    Processor -->|Event Store| Repository[(\"PostgreSQL\")]\n    Processor --> Visualizer[\"Visualization (GIS)\"]\n    Visualizer -->|API| Frontend[\"SOS Dashboard\"]\n    Repository -->|API| Ops[\"Operational Map (WebSocket)\"]\u003c/div>\n\u003ch2>Main components\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Ingestion\u003c/strong>: TypeScript services connect to external APIs and write to the \u003ccode>sos-events\u003c/code> topic.\u003c/li> \u003cli>\u003cstrong>Normalizer\u003c/strong>: runs in Node.js and .NET (via gRPC) to apply normalization rules for geometry, context and clustering.\u003c/li> \u003cli>\u003cstrong>Repository\u003c/strong>: PostgreSQL + PostGIS with \u003ccode>GIST\u003c/code> indexes on \u003ccode>location\u003c/code> and \u003ccode>incident_type\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Visualization\u003c/strong>: React / Leaflet frontend consumes WebSockets to update risk layers live.\u003c/li>\u003c/ul>\n\u003ch2>Code example\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"ts\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">ts\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const enqueueEvent = (event: IncomingEvent) =&gt; {\n  const normalized = normalize(event);\n  kafkaProducer.send({ topic: &quot;sos-events&quot;, messages: [{ value: JSON.stringify(normalized) }] });\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Operational notes\u003c/h2>\n\u003cul>\u003cli>Every critical event triggers \u003ccode>notifyOps\u003c/code> if \u003ccode>normalized.region\u003c/code> belongs to \u003ccode>coverageZones\u003c/code>.\u003c/li> \u003cli>\u003ccode>LineOfSightService\u003c/code> recalculates resource visibility in real time on each reconciliation.\u003c/li> \u003cli>The flow is monitored with distributed tracing (OpenTelemetry) to keep latency below 2 seconds.\u003c/li>\u003c/ul>\n\u003ch2>Link to the project\u003c/h2>\n\u003cp>The previous post lists the business rules that justify each node in the flow. This one details the mechanisms and diagrams behind \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a>.\u003c/p>", "body_html_ja_jp": "\u003ch1>SOS Location のアーキテクチャとフロー\u003c/h1>\n\u003cp>SOS Location のパイプラインは、取り込み、エンリッチメント、可視化を接続します。以下が主なフローダイアグラムです。\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    Ingest[\"取り込み\"] -->|Normalize| Processor[\"Normalizer\"]\n    Processor -->|Event Store| Repository[(\"PostgreSQL\")]\n    Processor --> Visualizer[\"可視化 (GIS)\"]\n    Visualizer -->|API| Frontend[\"SOS Dashboard\"]\n    Repository -->|API| Ops[\"Operational Map (WebSocket)\"]\u003c/div>\n\u003ch2>主要コンポーネント\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Ingestion\u003c/strong>: TypeScript サービスが外部 API と接続し、\u003ccode>sos-events\u003c/code> topic へ書き込む。\u003c/li> \u003cli>\u003cstrong>Normalizer\u003c/strong>: Node.js と .NET（gRPC 経由）で動作し、geometry、context、cluster の正規化ルールを適用する。\u003c/li> \u003cli>\u003cstrong>Repository\u003c/strong>: PostgreSQL + PostGIS。\u003ccode>location\u003c/code> と \u003ccode>incident_type\u003c/code> に \u003ccode>GIST\u003c/code> index を張る。\u003c/li> \u003cli>\u003cstrong>Visualization\u003c/strong>: React / Leaflet frontend が WebSocket を購読し、リスクレイヤをリアルタイム更新する。\u003c/li>\u003c/ul>\n\u003ch2>コード例\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"ts\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">ts\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>const enqueueEvent = (event: IncomingEvent) =&gt; {\n  const normalized = normalize(event);\n  kafkaProducer.send({ topic: &quot;sos-events&quot;, messages: [{ value: JSON.stringify(normalized) }] });\n};\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>運用メモ\u003c/h2>\n\u003cul>\u003cli>すべての重大イベントは、\u003ccode>normalized.region\u003c/code> が \u003ccode>coverageZones\u003c/code> に含まれると \u003ccode>notifyOps\u003c/code> を発火する。\u003c/li> \u003cli>\u003ccode>LineOfSightService\u003c/code> は各 reconcilation ごとにリソース可視性を再計算する。\u003c/li> \u003cli>フローは分散トレーシング（OpenTelemetry）で監視され、レイテンシを 2 秒未満に保つ。\u003c/li>\u003c/ul>\n\u003ch2>プロジェクトとの接続\u003c/h2>\n\u003cp>前の post では各ノードを正当化する業務ルールを扱いました。この post では \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a> を支える具体的メカニズムと図を説明しています。\u003c/p>"}, {"id": "post-sos-location-business-rules", "kind": "post", "name": "SOS Location: Regras de negócio, contratos e operação", "headline": "Catálogo completo das regras de negócio que sustentam o SOS Location.", "summary": "Catálogo completo das regras de negócio que sustentam o SOS Location.", "status": "production", "stack": ["gis", "operations", "sos"], "url": "/posts/2026-04-05-0900-sos-location-business-rules/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-05-0900-sos-location-business-rules/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "body_html": "\u003ch1>Regras de negócio do SOS Location\u003c/h1>\n\u003cp>O \u003cstrong>SOS Location\u003c/strong> organiza dados geoespaciais para reduzir o tempo de resposta em crises. As regras de negócio são estruturalmente simples, mas precisam ser rigorosas para evitar decisões equivocadas.\u003c/p>\n\u003ch2>1. Contratos de dados\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Instituições parceiras\u003c/strong> enviam feeds assinados que contêm: \u003ccode>event_id\u003c/code>, \u003ccode>type\u003c/code>, \u003ccode>severity\u003c/code>, \u003ccode>geojson\u003c/code>, \u003ccode>timestamp\u003c/code>, \u003ccode>source\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Eventos críticos\u003c/strong> (severidade &gt;= 7) sempre geram uma projeção de riscos em menos de 120 segundos.\u003c/li> \u003cli>\u003cstrong>Atualização de status\u003c/strong> governa recursos humanos: cada recurso humano só responde a um evento por vez (estado \u003ccode>locked\u003c/code>).\u003c/li> \u003cli>\u003cstrong>GeoJSON canonicalizado\u003c/strong>: antes do armazenamento, o polígono é simplificado para 6 decimais e validado com \u003ccode>ogr2ogr\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2>2. Regras de fluxo\u003c/h2>\n\u003col>\u003cli>Recebemos eventos via message queue (Kafka/Redis Streams).\u003c/li> \u003cli>Validamos esquema e padronizamos \u003ccode>severity\u003c/code>.\u003c/li> \u003cli>Se \u003ccode>severity &gt;= 7\u003c/code> criamos \u003ccode>incident\u003c/code> em \u003ccode>SOS.Data.Incidents\u003c/code>.\u003c/li> \u003cli>Disparamos microserviço de \u003cstrong>mapas operacionais\u003c/strong> caso \u003ccode>incident.type\u003c/code> pertença ao catálogo \u003ccode>critical_types\u003c/code>.\u003c/li> \u003cli>Cada atualização solicita recalculadora de visibilidade (\u003ccode>LineOfSightService\u003c/code>) para as camadas \u003ccode>watchpoints\u003c/code>.\u003c/li>\u003c/ol>\n\u003ch2>3. Governança operacional\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Deploy\u003c/strong> via pipeline \u003ccode>sos_location/deploy\u003c/code> que exige smoke test \u003ccode>maps/smoke\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Monitoramento\u003c/strong> centralizado em Grafana, alertas no Slack \u003ccode>#sos-alerts\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Auditoria\u003c/strong> grava cada mutação em \u003ccode>event history\u003c/code> com \u003ccode>actor\u003c/code>, \u003ccode>reason\u003c/code> e \u003ccode>trace_id\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2>4. Link com o projeto\u003c/h2>\n\u003cp>O projeto \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a> coloca essas regras em prática; os posts desta série documentam fluxo, stack e exemplos que tocam essas regras.\u003c/p>", "title_en_us": "SOS Location: Business Rules, Contracts and Operations", "title_ja_jp": "SOS Location：ビジネスルール、契約、運用", "summary_en_us": "Complete catalog of the business rules that sustain SOS Location.", "summary_ja_jp": "SOS Location を支えるビジネスルールの完全なカタログ。", "body_html_en_us": "\u003ch1>SOS Location business rules\u003c/h1>\n\u003cp>\u003cstrong>SOS Location\u003c/strong> organizes geospatial data to reduce response time in crises. The business rules are structurally simple, but they must be rigorous enough to avoid wrong operational decisions.\u003c/p>\n\u003ch2>1. Data contracts\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Partner institutions\u003c/strong> send signed feeds containing: \u003ccode>event_id\u003c/code>, \u003ccode>type\u003c/code>, \u003ccode>severity\u003c/code>, \u003ccode>geojson\u003c/code>, \u003ccode>timestamp\u003c/code>, \u003ccode>source\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Critical events\u003c/strong> (\u003ccode>severity &gt;= 7\u003c/code>) must always generate a risk projection in less than 120 seconds.\u003c/li> \u003cli>\u003cstrong>Status updates\u003c/strong> govern human resources: each field resource can respond to only one event at a time (\u003ccode>locked\u003c/code> state).\u003c/li> \u003cli>\u003cstrong>Canonicalized GeoJSON\u003c/strong>: before storage, the polygon is simplified to 6 decimal places and validated with \u003ccode>ogr2ogr\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2>2. Flow rules\u003c/h2>\n\u003col>\u003cli>We receive events via a message queue (Kafka / Redis Streams).\u003c/li> \u003cli>We validate the schema and normalize \u003ccode>severity\u003c/code>.\u003c/li> \u003cli>If \u003ccode>severity &gt;= 7\u003c/code>, we create an \u003ccode>incident\u003c/code> in \u003ccode>SOS.Data.Incidents\u003c/code>.\u003c/li> \u003cli>We trigger the \u003cstrong>operational maps\u003c/strong> microservice if \u003ccode>incident.type\u003c/code> belongs to the \u003ccode>critical_types\u003c/code> catalog.\u003c/li> \u003cli>Every update requests visibility recalculation (\u003ccode>LineOfSightService\u003c/code>) for \u003ccode>watchpoints\u003c/code> layers.\u003c/li>\u003c/ol>\n\u003ch2>3. Operational governance\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Deploy\u003c/strong> happens through the \u003ccode>sos_location/deploy\u003c/code> pipeline, which requires the \u003ccode>maps/smoke\u003c/code> smoke test.\u003c/li> \u003cli>\u003cstrong>Monitoring\u003c/strong> is centralized in Grafana, with alerts routed to Slack \u003ccode>#sos-alerts\u003c/code>.\u003c/li> \u003cli>\u003cstrong>Audit\u003c/strong> records every mutation in event history with \u003ccode>actor\u003c/code>, \u003ccode>reason\u003c/code> and \u003ccode>trace_id\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch2>4. Link to the project\u003c/h2>\n\u003cp>The \u003ca href=\"/projects/sos-location/\">SOS Location\u003c/a> project puts these rules into practice. The posts in this series document the flow, stack and examples that touch those rules.\u003c/p>", "body_html_ja_jp": "\u003ch1>SOS Location の業務ルール\u003c/h1>\n\u003cp>\u003cstrong>SOS Location\u003c/strong> は、危機時の対応時間を短縮するために地理空間データを整理するシステムです。業務ルール自体は構造的には単純ですが、誤った運用判断を避けるために厳密でなければなりません。\u003c/p>\n\u003ch2>1. データ契約\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>提携機関\u003c/strong> は、\u003ccode>event_id\u003c/code>, \u003ccode>type\u003c/code>, \u003ccode>severity\u003c/code>, \u003ccode>geojson\u003c/code>, \u003ccode>timestamp\u003c/code>, \u003ccode>source\u003c/code> を含む署名付き feed を送る。\u003c/li> \u003cli>\u003cstrong>重大イベント\u003c/strong> (\u003ccode>severity &gt;= 7\u003c/code>) は、常に 120 秒未満でリスク投影を生成しなければならない。\u003c/li> \u003cli>\u003cstrong>ステータス更新\u003c/strong> は人的リソースを統制する。各現場リソースは一度に一つのイベントにしか対応できない（\u003ccode>locked\u003c/code> 状態）。\u003c/li> \u003cli>\u003cstrong>正規化された GeoJSON\u003c/strong>: 保存前に polygon は小数 6 桁へ簡略化され、\u003ccode>ogr2ogr\u003c/code> で検証される。\u003c/li>\u003c/ul>\n\u003ch2>2. フロー・ルール\u003c/h2>\n\u003col>\u003cli>イベントは message queue（Kafka / Redis Streams）経由で受け取る。\u003c/li> \u003cli>スキーマを検証し、\u003ccode>severity\u003c/code> を標準化する。\u003c/li> \u003cli>\u003ccode>severity &gt;= 7\u003c/code> の場合、\u003ccode>SOS.Data.Incidents\u003c/code> に \u003ccode>incident\u003c/code> を作成する。\u003c/li> \u003cli>\u003ccode>incident.type\u003c/code> が \u003ccode>critical_types\u003c/code> カタログに属する場合、\u003cstrong>運用地図\u003c/strong> microservice を起動する。\u003c/li> \u003cli>すべての更新は \u003ccode>watchpoints\u003c/code> レイヤ向けに可視性再計算（\u003ccode>LineOfSightService\u003c/code>）を要求する。\u003c/li>\u003c/ol>\n\u003ch2>3. 運用ガバナンス\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Deploy\u003c/strong> は \u003ccode>sos_location/deploy\u003c/code> pipeline で行い、\u003ccode>maps/smoke\u003c/code> smoke test を必須とする。\u003c/li> \u003cli>\u003cstrong>Monitoring\u003c/strong> は Grafana に集中し、alert は Slack \u003ccode>#sos-alerts\u003c/code> へ送る。\u003c/li> \u003cli>\u003cstrong>Audit\u003c/strong> はすべての変更を \u003ccode>actor\u003c/code>, \u003ccode>reason\u003c/code>, \u003ccode>trace_id\u003c/code> 付きで event history に残す。\u003c/li>\u003c/ul>\n\u003ch2>4. プロジェクトとの接続\u003c/h2>\n\u003cp>\u003ca href=\"/projects/sos-location/\"> SOS Location \u003c/a> プロジェクトは、これらのルールを実運用に載せています。このシリーズの posts は、それらを支えるフロー、スタック、具体例を文書化しています。\u003c/p>"}, {"id": "post-biomatematica-araucaria-angustifolia", "kind": "post", "name": "A Bio-matemática da Araucária: Modelagem e Simetria", "headline": "Uma exploração sobre os padrões matemáticos que regem a estrutura da Araucaria angustifolia, de verticilos a séries exponenciais de crescimento.", "summary": "Uma exploração sobre os padrões matemáticos que regem a estrutura da Araucaria angustifolia, de verticilos a séries exponenciais de crescimento.", "status": "production", "stack": ["biomatematica", "geometria", "araucaria", "natureza"], "url": "/posts/2026-04-05-0400-biomatematica-araucaria-biomatematica-araucaria-angustifolia/", "resolved_url": "https://nhmatsumoto.github.io/posts/2026-04-05-0400-biomatematica-araucaria-biomatematica-araucaria-angustifolia/", "repo_url": "", "has_math": true, "body_html": "\u003cp>A \u003cem>Araucaria angustifolia\u003c/em>, o &quot;Pinheiro-do-Paraná&quot;, não é apenas um ícone biológico, mas um exemplo fascinante de organização geométrica e eficiência estrutural. Para replicar sua forma em um ambiente digital 3D, utilizamos modelos matemáticos que capturam sua essência fractal e simétrica.\u003c/p>\n\u003ch2>1. Estrutura Vertical: Os Verticilos\u003c/h2>\n\u003cp>Diferente de muitas árvores que possuem ramificações aleatórias, a araucária cresce em \u003cstrong>andares\u003c/strong> ou \u003cstrong>verticilos\u003c/strong>. Cada andar é uma repetição horizontal de ramos saindo de um ponto comum no tronco.\u003c/p>\n\u003cp>A altura de cada verticilo \u003cspan class=\"math-inline\">$n$\u003c/span> pode ser descrita por:\u003c/p>\n\u003cdiv class=\"math-block\">$$h_n = h_0 + n \\cdot \\Delta h$$\u003c/div>\n\u003cul>\u003cli>  \u003cspan class=\"math-inline\">$h_n$\u003c/span> é a altura do andar.\u003c/li> \u003cli>  \u003cspan class=\"math-inline\">$\\Delta h$\u003c/span> é o espaçamento entre verticilos.\u003c/li>\u003c/ul>\n\u003ch2>2. Simetria Angular\u003c/h2>\n\u003cp>Dentro de cada andar, os galhos buscam maximizar a captura de luz através da simetria radial:\u003c/p>\n\u003cdiv class=\"math-block\">$$\\theta_{n,m} = \\frac{2\\pi m}{b_n}$$\u003c/div>\n\u003ch2>3. Redução de Comprimento (Decaimento Exponencial)\u003c/h2>\n\u003cp>À medida que a árvore ganha altura, os galhos tornam-se progressivamente menores, definindo a silhueta em forma de taça. Este comportamento segue uma função de decaimento:\u003c/p>\n\u003cdiv class=\"math-block\">$$L_n = L_0 \\cdot q^n$$\u003c/div>\n\u003ch2>4. Modelagem Fractal e L-Systems\u003c/h2>\n\u003cp>A complexidade da araucária pode ser resumida por regras de substituição simples em um \u003cstrong>L-System\u003c/strong>:\u003c/p>\n\u003cp>\u003ccode>A → F [ α1 A ] [ α2 A ] [ α3 A ] ...\u003c/code>\u003c/p>\n\u003cp>Cada ramo &quot;A&quot; cresce um segmento &quot;F&quot; e gera novos sub-ramos em ângulos específicos. Essa auto-semelhança é o que permite que a visualização mude de escala mantendo a identidade visual característica.\u003c/p>\n\u003ch3>Representação Visual\u003c/h3>\n\u003cdiv class=\"mermaid\">graph TD\n    T[Tronco Central] --> V1[Verticilo 1]\n    T --> V2[Verticilo 2]\n    T --> V3[Verticilo 3]\n    V1 --> B1[Ramo L0]\n    V1 --> B2[Ramo L0]\n    V2 --> B3[Ramo L1 = L0 * q]\n    V2 --> B4[Ramo L1 = L0 * q]\n    V3 --> B5[Ramo L2 = L1 * q]\u003c/div>\n\u003cp>A combinação desses fatores — periodicidade vertical, simetria angular e decaimento de escala — cria a base para o nosso \u003cstrong>Projeto Araucária\u003c/strong>, transformando dados técnicos em uma floresta digital de conhecimento.\u003c/p>", "title_en_us": "The Bio-Mathematics of the Araucaria: Modeling and Symmetry", "title_ja_jp": "アラウカリアの生物数学：モデリングと対称性", "summary_en_us": "An exploration of the mathematical patterns that govern the structure of Araucaria angustifolia, from whorls to exponential growth series.", "summary_ja_jp": "Araucaria angustifolia の構造を支配する数学的パターンの探求。輪生から指数関数的成長系列まで。", "body_html_en_us": "\u003cp>The \u003cem>Araucaria angustifolia\u003c/em>, the &quot;Parana pine&quot;, is not only a biological icon but also a fascinating example of geometric organization and structural efficiency. To recreate its shape in a 3D digital environment, we use mathematical models that capture its fractal and symmetric essence.\u003c/p>\n\u003ch2>1. Vertical structure: whorls\u003c/h2>\n\u003cp>Unlike many trees with seemingly random branching, the araucaria grows in \u003cstrong>tiers\u003c/strong> or \u003cstrong>whorls\u003c/strong>. Each tier is a horizontal repetition of branches emerging from a common point on the trunk.\u003c/p>\n\u003cp>The height of each whorl \u003cspan class=\"math-inline\">$n$\u003c/span> can be described by:\u003c/p>\n\u003cdiv class=\"math-block\">$$h_n = h_0 + n \\cdot \\Delta h$$\u003c/div>\n\u003cul>\u003cli>  \u003cspan class=\"math-inline\">$h_n$\u003c/span> is the height of the tier.\u003c/li> \u003cli>  \u003cspan class=\"math-inline\">$\\Delta h$\u003c/span> is the spacing between whorls.\u003c/li>\u003c/ul>\n\u003ch2>2. Angular symmetry\u003c/h2>\n\u003cp>Within each tier, branches seek to maximize light capture through radial symmetry:\u003c/p>\n\u003cdiv class=\"math-block\">$$\\theta_{n,m} = \\frac{2\\pi m}{b_n}$$\u003c/div>\n\u003ch2>3. Length reduction (exponential decay)\u003c/h2>\n\u003cp>As the tree grows taller, the branches become progressively shorter, defining the cup-shaped silhouette. This behavior follows a decay function:\u003c/p>\n\u003cdiv class=\"math-block\">$$L_n = L_0 \\cdot q^n$$\u003c/div>\n\u003ch2>4. Fractal modeling and L-Systems\u003c/h2>\n\u003cp>The complexity of the araucaria can be summarized by simple substitution rules in an \u003cstrong>L-System\u003c/strong>:\u003c/p>\n\u003cp>\u003ccode>A → F [ α1 A ] [ α2 A ] [ α3 A ] ...\u003c/code>\u003c/p>\n\u003cp>Each branch &quot;A&quot; grows one segment &quot;F&quot; and generates new sub-branches at specific angles. This self-similarity is what allows the visualization to change scale while preserving its characteristic visual identity.\u003c/p>\n\u003ch3>Visual representation\u003c/h3>\n\u003cdiv class=\"mermaid\">graph TD\n    T[Central Trunk] --> V1[Whorl 1]\n    T --> V2[Whorl 2]\n    T --> V3[Whorl 3]\n    V1 --> B1[Branch L0]\n    V1 --> B2[Branch L0]\n    V2 --> B3[Branch L1 = L0 * q]\n    V2 --> B4[Branch L1 = L0 * q]\n    V3 --> B5[Branch L2 = L1 * q]\u003c/div>\n\u003cp>The combination of these factors, vertical periodicity, angular symmetry and scale decay, forms the basis of our \u003cstrong>Araucaria Project\u003c/strong>, turning technical data into a digital forest of knowledge.\u003c/p>", "body_html_ja_jp": "\u003cp>\u003cem>Araucaria angustifolia\u003c/em>、いわゆる「パラナ松」は、生物学的な象徴であるだけでなく、幾何学的秩序と構造効率の魅力的な例でもあります。その形状を 3D のデジタル環境で再現するために、私たちはフラクタル性と対称性の本質を捉える数学モデルを使います。\u003c/p>\n\u003ch2>1. 垂直構造: 輪生\u003c/h2>\n\u003cp>枝がランダムに見える多くの樹木と異なり、アラウカリアは \u003cstrong>階層\u003c/strong>、つまり \u003cstrong>輪生\u003c/strong> として成長します。各層は、幹の共通点から出る枝の水平な繰り返しです。\u003c/p>\n\u003cp>各輪生 \u003cspan class=\"math-inline\">$n$\u003c/span> の高さは次のように表せます。\u003c/p>\n\u003cdiv class=\"math-block\">$$h_n = h_0 + n \\cdot \\Delta h$$\u003c/div>\n\u003cul>\u003cli>  \u003cspan class=\"math-inline\">$h_n$\u003c/span> はその層の高さ。\u003c/li> \u003cli>  \u003cspan class=\"math-inline\">$\\Delta h$\u003c/span> は輪生間の間隔。\u003c/li>\u003c/ul>\n\u003ch2>2. 角度対称性\u003c/h2>\n\u003cp>各層の内部では、枝は放射対称によって光の取得を最大化しようとします。\u003c/p>\n\u003cdiv class=\"math-block\">$$\\theta_{n,m} = \\frac{2\\pi m}{b_n}$$\u003c/div>\n\u003ch2>3. 長さの縮小（指数減衰）\u003c/h2>\n\u003cp>木が高くなるにつれて枝は徐々に短くなり、杯形のシルエットを作ります。この挙動は減衰関数に従います。\u003c/p>\n\u003cdiv class=\"math-block\">$$L_n = L_0 \\cdot q^n$$\u003c/div>\n\u003ch2>4. フラクタルモデリングと L-System\u003c/h2>\n\u003cp>アラウカリアの複雑さは、\u003cstrong>L-System\u003c/strong> における単純な置換規則で要約できます。\u003c/p>\n\u003cp>\u003ccode>A → F [ α1 A ] [ α2 A ] [ α3 A ] ...\u003c/code>\u003c/p>\n\u003cp>各枝 &quot;A&quot; は 1 セグメント &quot;F&quot; を伸ばし、特定角度で新しい下位枝を生成します。この自己相似性こそが、可視化のスケールが変わっても特徴的な視覚的アイデンティティを保てる理由です。\u003c/p>\n\u003ch3>視覚表現\u003c/h3>\n\u003cdiv class=\"mermaid\">graph TD\n    T[中央幹] --> V1[輪生 1]\n    T --> V2[輪生 2]\n    T --> V3[輪生 3]\n    V1 --> B1[枝 L0]\n    V1 --> B2[枝 L0]\n    V2 --> B3[枝 L1 = L0 * q]\n    V2 --> B4[枝 L1 = L0 * q]\n    V3 --> B5[枝 L2 = L1 * q]\u003c/div>\n\u003cp>垂直周期性、角度対称性、スケール減衰という要素の組み合わせが、私たちの \u003cstrong>Projeto Araucária\u003c/strong> の基盤を形作ります。技術データを知識のデジタル森林へ変換する土台です。\u003c/p>"}, {"id": "post-tecnologia-pulso-hemp-hpm", "kind": "post", "name": "Tecnologia de Pulso: Do HEMP ao Micro-ondas de Alta Potência", "headline": "Uma análise técnica sobre a geração artificial de pulsos eletromagnéticos, do Efeito Compton ao Gerador de Compressão de Fluxo.", "summary": "Uma análise técnica sobre a geração artificial de pulsos eletromagnéticos, do Efeito Compton ao Gerador de Compressão de Fluxo.", "status": "production", "stack": ["engineering", "defense", "electromagnetism", "pulse-power"], "url": "/posts/20260404-artificial-pulse-tech-tecnologia-pulso-hemp-hpm/", "resolved_url": "https://nhmatsumoto.github.io/posts/20260404-artificial-pulse-tech-tecnologia-pulso-hemp-hpm/", "repo_url": "", "has_math": false, "body_html": "\u003cp>Ao contrário dos fenômenos naturais, os pulsos eletromagnéticos artificiais são projetados para máxima eficiência de acoplamento em eletrônicos de precisão. Existem duas categorias fundamentais: nucleares e convencionais.\u003c/p>\n\u003ch3>1. EMP Nuclear (HEMP)\u003c/h3>\n\u003cp>Este é o método de maior abrangência. Detonado acima de 30 km, ele utiliza a própria atmosfera como amplificador:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Efeito Compton\u003c/strong>: Raios gama da explosão colidem com moléculas de ar, ejetando elétrons em alta velocidade.\u003c/li> \u003cli>\u003cstrong>Aceleração\u003c/strong>: Sob a influência do campo magnético da Terra, esses elétrons giram, gerando um pulso eletromagnético que pode saturar um continente inteiro.\u003c/li>\u003c/ul>\n\u003ch3>2. EMP Não-Nuclear (NNEMP)\u003c/h3>\n\u003cp>Desenvolvidos para fins táticos e de segurança, não dependem de radiação nuclear para agir:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Gerador de Compressão de Fluxo (FCG)\u003c/strong>: Utiliza explosivos convencionais para comprimir subitamente um campo magnético dentro de uma bobina. Essa compressão súbita cria um pico de energia de potência altíssima em milissegundos.\u003c/li> \u003cli>\u003cstrong>Micro-ondas de Alta Potência (HPM)\u003c/strong>: Antenas focais que direcionam feixes de micro-ondas para sobrecarregar fisicamente os componentes eletrônicos de alvos específicos (como servidores ou infraestrutura de rede).\u003c/li>\u003c/ul>\n\u003ch3>Matriz de Impacto e Alcance\u003c/h3>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tecnologia\u003c/th>\u003cth>Origem\u003c/th>\u003cth>Abrangência\u003c/th>\u003cth>Vetor de Dano\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>HEMP\u003c/strong>\u003c/td>\u003ctd>Detonação Nuclear\u003c/td>\u003ctd>Continente/País\u003c/td>\u003ctd>Raios Gama + Efeito Compton\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>FCG\u003c/strong>\u003c/td>\u003ctd>Compressão de Fluxo\u003c/td>\u003ctd>Local/Tático\u003c/td>\u003ctd>Pulsos Magnéticos de Corrente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>HPM\u003c/strong>\u003c/td>\u003ctd>Micro-ondas Focadas\u003c/td>\u003ctd>Alvo Direcional\u003c/td>\u003ctd>Saturação Térmica/Dielétrica\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>No final, a tecnologia de pulso artificial não é sobre &quot;explosão&quot;, mas sobre o controle preciso de campos elétricos e magnéticos para induzir transientes fatais em circuitos semicondutores.\u003c/p>", "title_en_us": "Pulse Technology: From HEMP to High-Power Microwaves", "title_ja_jp": "パルス技術：HEMP から高出力マイクロ波まで", "summary_en_us": "A technical analysis of artificial electromagnetic pulse generation, from the Compton effect to the flux compression generator.", "summary_ja_jp": "人工電磁パルス生成の技術分析。コンプトン効果から磁束圧縮発電機まで。", "body_html_en_us": "\u003cp>Unlike natural phenomena, artificial electromagnetic pulses are engineered for maximum coupling efficiency against precision electronics. There are two fundamental categories: nuclear and conventional.\u003c/p>\n\u003ch3>1. Nuclear EMP (HEMP)\u003c/h3>\n\u003cp>This is the broadest-reaching method. Detonated above 30 km, it uses the atmosphere itself as an amplifier:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Compton Effect\u003c/strong>: Gamma rays from the explosion collide with air molecules, ejecting high-velocity electrons.\u003c/li> \u003cli>\u003cstrong>Acceleration\u003c/strong>: Under the influence of the Earth&#x27;s magnetic field, those electrons spiral and generate an electromagnetic pulse capable of saturating an entire continent.\u003c/li>\u003c/ul>\n\u003ch3>2. Non-Nuclear EMP (NNEMP)\u003c/h3>\n\u003cp>Developed for tactical and security purposes, these do not depend on nuclear radiation:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Flux Compression Generator (FCG)\u003c/strong>: Uses conventional explosives to abruptly compress a magnetic field inside a coil. That sudden compression creates an extremely high-power energy spike in milliseconds.\u003c/li> \u003cli>\u003cstrong>High-Power Microwaves (HPM)\u003c/strong>: Directional antenna systems that focus microwave beams to physically overload electronic components in specific targets such as servers or network infrastructure.\u003c/li>\u003c/ul>\n\u003ch3>Impact and range matrix\u003c/h3>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technology\u003c/th>\u003cth>Origin\u003c/th>\u003cth>Scope\u003c/th>\u003cth>Damage Vector\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>HEMP\u003c/strong>\u003c/td>\u003ctd>Nuclear Detonation\u003c/td>\u003ctd>Continent / Country\u003c/td>\u003ctd>Gamma Rays + Compton Effect\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>FCG\u003c/strong>\u003c/td>\u003ctd>Flux Compression\u003c/td>\u003ctd>Local / Tactical\u003c/td>\u003ctd>Magnetic Current Pulses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>HPM\u003c/strong>\u003c/td>\u003ctd>Focused Microwaves\u003c/td>\u003ctd>Directional Target\u003c/td>\u003ctd>Thermal / Dielectric Saturation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>In the end, artificial pulse technology is not about &quot;explosion&quot;. It is about precise control of electric and magnetic fields to induce fatal transients in semiconductor circuits.\u003c/p>", "body_html_ja_jp": "\u003cp>自然現象とは異なり、人工電磁パルスは精密電子機器に対して最大の結合効率を得るよう設計されます。基本的な分類は 2 つです。核起源と通常起源です。\u003c/p>\n\u003ch3>1. 核 EMP (HEMP)\u003c/h3>\n\u003cp>最も広域に及ぶ方式です。30 km 以上の高高度で起爆され、大気そのものを増幅器として利用します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>コンプトン効果\u003c/strong>: 爆発から放出されたガンマ線が大気分子に衝突し、高速電子を叩き出す。\u003c/li> \u003cli>\u003cstrong>加速\u003c/strong>: それらの電子は地球磁場の影響で旋回し、大陸規模の電子機器を飽和させうる電磁パルスを生成する。\u003c/li>\u003c/ul>\n\u003ch3>2. 非核 EMP (NNEMP)\u003c/h3>\n\u003cp>戦術用途やセキュリティ用途のために開発され、核放射に依存しません。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>磁束圧縮発電機 (FCG)\u003c/strong>: コイル内の磁場を通常爆薬で瞬間的に圧縮する。急激な圧縮により、ミリ秒単位で極めて高出力のエネルギースパイクが生じる。\u003c/li> \u003cli>\u003cstrong>高出力マイクロ波 (HPM)\u003c/strong>: 指向性アンテナでマイクロ波ビームを集中し、サーバやネットワーク基盤など特定目標の電子部品を物理的に過負荷にする。\u003c/li>\u003c/ul>\n\u003ch3>影響と到達範囲のマトリクス\u003c/h3>\n\u003cdiv class=\"table-wrapper\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technology\u003c/th>\u003cth>Origin\u003c/th>\u003cth>Scope\u003c/th>\u003cth>Damage Vector\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>HEMP\u003c/strong>\u003c/td>\u003ctd>核爆発\u003c/td>\u003ctd>大陸 / 国家規模\u003c/td>\u003ctd>ガンマ線 + コンプトン効果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>FCG\u003c/strong>\u003c/td>\u003ctd>磁束圧縮\u003c/td>\u003ctd>局所 / 戦術\u003c/td>\u003ctd>磁気電流パルス\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>HPM\u003c/strong>\u003c/td>\u003ctd>集束マイクロ波\u003c/td>\u003ctd>指向性目標\u003c/td>\u003ctd>熱的 / 誘電体飽和\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>結局のところ、人工パルス技術は「爆発」そのものではありません。電場と磁場を精密に制御し、半導体回路に致命的な過渡現象を誘起する技術です。\u003c/p>"}, {"id": "post-sopros-estelares-astrofisica-impulso", "kind": "post", "name": "Sopros Estelares: De Supernovas a Space Weather", "headline": "Anatomia dos fenômenos astrofísicos que geram emissões eletromagnéticas extremas e seu impacto nos sistemas tecnológicos.", "summary": "Anatomia dos fenômenos astrofísicos que geram emissões eletromagnéticas extremas e seu impacto nos sistemas tecnológicos.", "status": "production", "stack": ["astrophysics", "science", "space-weather", "radiation"], "url": "/posts/20260404-astro-electromagnetics-sopros-estelares-astrofisica-impulso/", "resolved_url": "https://nhmatsumoto.github.io/posts/20260404-astro-electromagnetics-sopros-estelares-astrofisica-impulso/", "repo_u

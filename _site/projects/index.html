GitHub.\n\nEste projeto foi sincronizado automaticamente do GitHub.", "type": "intro", "animation": "typewriter", "children": ["arch", "stack"]}, {"id": "arch", "title": "Arquitetura", "content": "Repositório público no GitHub.", "type": "architecture", "animation": "slide_right", "children": []}, {"id": "stack", "title": "Tecnologias", "content": "", "type": "stack", "animation": "zoom", "children": []}]}, {"id": "document-technical-knowledge-os", "kind": "document", "name": "Technical Knowledge OS", "headline": "A definição operacional do blog como sistema vivo de documentação técnica.", "summary": "A definição operacional do blog como sistema vivo de documentação técnica.", "status": "production", "stack": ["domain", "knowledge"], "url": "/documents/technical-knowledge-os/", "sections": [{"id": "overview", "title": "Doc Overview", "content": "A definição operacional do blog como sistema vivo de documentação técnica.", "type": "intro", "animation": "typewriter", "children": ["body"]}, {"id": "body", "title": "Especificação", "content": "# Technical Knowledge OS\n\nO blog passou a funcionar como um sistema de documentação viva. A ideia de **technical knowledge OS** é simples:\n\n- posts registram aprendizado e síntese;\n- projetos mantêm contexto operacional;\n- documentos preservam decisões e arquitetura;\n- tudo é versionado no mesmo fluxo de publicação.\n\n## Por que isso importa\n\nNa prática, conhecimento técnico se perde quando cada formato vive isolado. O post explica, a documentação detalha, mas o contexto entre um e outro desaparece.\n\nO objetivo aqui é reduzir essa distância e fazer o site refletir o trabalho real: arquitetura, decisões, trade-offs e evolução.\n\n## Princípios\n\n- clareza antes de ornamentação;\n- profundidade sem ruído;\n- cada página precisa justificar sua existência;\n- o sistema deve continuar pequeno o suficiente para ser mantido.\n", "type": "text", "animation": "fade", "children": []}]}, {"id": "document-system-architecture", "kind": "document", "name": "System Architecture", "headline": "Visão estrutural das fronteiras do sistema e do racional arquitetural do projeto.", "summary": "Visão estrutural das fronteiras do sistema e do racional arquitetural do projeto.", "status": "production", "stack": ["architecture", "system"], "url": "/documents/system-architecture/", "sections": [{"id": "overview", "title": "Doc Overview", "content": "Visão estrutural das fronteiras do sistema e do racional arquitetural do projeto.", "type": "intro", "animation": "typewriter", "children": ["body"]}, {"id": "body", "title": "Especificação", "content": "# Project Architecture\n\nRonaldinho-Agent follows a modern, hyper-converged architecture where a C# NeuralCore orchestrates diverse AI strategies and governance rules.\n\n## Directory Structure\n\n```text\nRonaldinho-Agent/\n├── services/\n│   ├── Ronaldinho.NeuralCore/    # .NET 9 Central Brain & API\n│   ├── Ronaldinho.ConfigUI/      # React/Chakra UI Governance Interface\n├── ronaldinho/                   # Core Data & Persistent State\n│   ├── config/                   # SOUL.md and state definitions\n│   ├── data/                     # Encryption keys and vault\n├── dev_scripts/                  # PowerShell automation (Smart Onboarding)\n├── docs/                         # Technical documentation\n├── start_neural.ps1              # Unified Local Entry Point\n└── docker-compose.yml            # Containerized Deployment (Production)\n```\n\n## Key Components\n\n### 1. NeuralCore (The Master Brain)\n\nA high-performance **.NET 9** engine that utilizes **Semantic Kernel** to coordinate multiple LLM strategies. It handles:\n\n- **Provider Rotation**: Implements the **Zero-Block Resilience** chain.\n- **MCP Protocol**: Multi-Agent Coordination for specialized tasks.\n\n## ... (rest of file omitted for brevit...", "type": "text", "animation": "fade", "children": []}]}, {"id": "document-adr-versioned-memory", "kind": "document", "name": "ADR 003 - Versioned Memory", "headline": "Decisão arquitetural sobre snapshots de memória e persistência de contexto em workflows com agentes.", "summary": "Decisão arquitetural sobre snapshots de memória e persistência de contexto em workflows com agentes.", "status": "production", "stack": ["agents", "adr", "memory"], "url": "/documents/adr-versioned-memory/", "sections": [{"id": "overview", "title": "Doc Overview", "content": "Decisão arquitetural sobre snapshots de memória e persistência de contexto em workflows com agentes.", "type": "intro", "animation": "typewriter", "children": ["body"]}, {"id": "body", "title": "Especificação", "content": "# Gestão de Memória Versionada para Agentes de IA\n\n## Visão Geral\n\nA ideia é criar um sistema onde os agentes de IA possam versionar suas memórias usando o Git. Cada \"snapshot\" do contexto é armazenado como um commit, criando um histórico versionado que o agente pode consultar no futuro.\n\n## Fluxo do Sistema\n\n```mermaid\nsequenceDiagram\n    participant Agente\n    participant Snapshot\n    participant GitHub\n\n    Agente->>Snapshot: Cria um snapshot do contexto atual\n    Snapshot->>GitHub: Commit do snapshot para o repositório Git\n    GitHub-->>Agente: Retorna confirmação e mantém histórico versionado\n```\n\n## Componentes Principais\n\n- **Agente**: O agente de IA que está executando as tarefas e deseja manter o contexto.\n- **Snapshot**: Um ponto de salvamento do contexto atual, que inclui dados relevantes.\n- **GitHub (ou outro repositório Git)**: O repositório onde os snapshots são versionados e armazenados de forma segura.\n\n## Benefícios\n\n- **Memória Persistente**: O agente pode recuperar contextos antigos sem perder informações.\n- **Histórico Versionado**: Cada alteração é registrada, permitindo rastreabilidade.\n- **Otimização**: Menos reprocessamento de dados, economizando tokens e re...", "type": "text", "animation": "fade", "children": []}]}, {"id": "document-agent-integration-surface", "kind": "document", "name": "Agent Integration Surface", "headline": "Contratos mínimos para expor ferramentas e serviços a um runtime orientado a agentes.", "summary": "Contratos mínimos para expor ferramentas e serviços a um runtime orientado a agentes.", "status": "production", "stack": ["apis", "agents", "integration"], "url": "/documents/agent-integration-surface/", "sections": [{"id": "overview", "title": "Doc Overview", "content": "Contratos mínimos para expor ferramentas e serviços a um runtime orientado a agentes.", "type": "intro", "animation": "typewriter", "children": ["body"]}, {"id": "body", "title": "Especificação", "content": "# Agent Integration Surface\n\nEsta nota documenta a superfície mínima de integração para um sistema orientado a agentes que precisa chamar ferramentas externas sem perder previsibilidade.\n\n## Contratos principais\n\n- `task`: o problema que precisa ser resolvido;\n- `capability`: o conjunto de ações disponíveis;\n- `tool_call`: a invocação concreta de infraestrutura;\n- `result`: o retorno normalizado para consumo interno.\n\n## Regras úteis\n\n1. O agente não deve falar diretamente com tudo.\n2. Toda chamada externa precisa de contrato e normalização.\n3. Logs técnicos não substituem eventos de domínio.\n\n## Resultado esperado\n\nQuando essa superfície é explícita, trocar provider, runtime ou forma de coordenação deixa de ser uma reescrita completa.\n", "type": "text", "animation": "fade", "children": []}]}, {"id": "document-ronaldinho-architecture-overview", "kind": "document", "name": "Ronaldinho Architecture Overview", "headline": "Resumo da arquitetura do Ronaldinho Agent e das escolhas de modularidade do runtime.", "summary": "Resumo da arquitetura do Ronaldinho Agent e das escolhas de modularidade do runtime.", "status": "production", "stack": ["agents", "architecture", "runtime"], "url": "/documents/ronaldinho-architecture-overview/", "sections": [{"id": "overview", "title": "Doc Overview", "content": "Resumo da arquitetura do Ronaldinho Agent e das escolhas de modularidade do runtime.", "type": "intro", "animation": "typewriter", "children": ["body"]}, {"id": "body", "title": "Especificação", "content": "---\ntitle: Visão Geral da Arquitetura\ndescription: Como o cérebro do Ronaldinho funciona.\n---\n\n# A Estrutura OpenClaw Pro 🏗️\n\nO Ronaldinho Agent não é monolítico. Ele é uma orquestração de microsserviços e camadas de inteligência que garantem autonomia nível L6.\n\n### O Diagrama de Fluxo\n\n```mermaid\ngraph TD\n    User([Usuário]) --> |Telegram| Bridge[Neural Bridge]\n    User --> |Browser| Dashboard[OpenClaw Dashboard]\n\n    subgraph \"Camada de Inteligência\"\n        Bridge \u003c--> Core[Neural Core - FastAPI]\n        Dashboard \u003c--> Core\n        Core --> Skills[Engine de Habilidades]\n        Core --> Memory[Memory Store]\n    end\n\n    subgraph \"Execução Autónoma\"\n        Core --> Lane[Execution Lane]\n        Core --> Tools[Terminal/File Tools]\n    end\n```\n\n### Componentes Chave\n\n#### 1. Neural Core (Sessão Central)\nO cérebro do sistema. Desenvolvido em FastAPI, ele gerencia as requisições, faz a compressão de contexto e decide qual Persona deve entrar em campo.\n\n#### 2. Execution Lanes\nUm conceito chave inspirado no OpenClaw. Cada usuário tem uma \"Lane\" (faixa) de execução. Isso garante que o Ronaldinho não tente editar o mesmo arquivo em duas tarefas diferentes ao mesmo tempo, evitando confl...", "type": "text", "animation": "fade", "children": []}]}]</script>

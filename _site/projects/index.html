>", "body_html_ja": "\u003cp>\u003cstrong>nhmatsumoto.exception.middleware\u003c/strong> を補完する、ASP.NET Core API 向けレスポンス標準化ミドルウェアです。\u003c/p>\n\u003ch2>何をするか\u003c/h2>\n\u003cp>controller のレスポンスを横取りし、標準エンベロープで包みます。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"json\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">json\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>{\n  &quot;success&quot;: true,\n  &quot;data&quot;: { ... },\n  &quot;errors&quot;: [],\n  &quot;metadata&quot;: {\n    &quot;timestamp&quot;: &quot;2026-04-05T00:00:00Z&quot;,\n    &quot;requestId&quot;: &quot;abc-123&quot;\n  }\n}\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>利点\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>一貫性\u003c/strong> — すべての endpoint が同じトップレベル形式を返す\u003c/li> \u003cli>\u003cstrong>Metadata\u003c/strong> — timestamp、request ID、paging 情報を自動付与\u003c/li> \u003cli>\u003cstrong>Error wrapping\u003c/strong> — validation failure も同一契約に収まる\u003c/li> \u003cli>\u003cstrong>透明性\u003c/strong> — controller は素のオブジェクトを返し、整形は middleware が担当\u003c/li>\u003c/ul>\n\u003ch2>組み合わせ利用\u003c/h2>\n\u003cp>exception middleware が未捕捉例外を扱い、この middleware が成功レスポンスや制御済みエラーを含めた全体の形を統一します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>レスポンスの標準化がないと、フロントエンドは endpoint ごとに別の解析ロジックを持つ必要があります。一貫したエンベロープにすることで、その分岐をなくし、metadata 処理を集中化できます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>exception middleware の後段に登録する ASP.NET Core middleware です。response stream を横取りし、元の payload をデシリアライズして標準エンベロープ内に再シリアライズします。\u003c/p>"}, {"id": "project-security-jwt", "kind": "project", "status": "research", "stack": ["C#", ".NET", "JWT", "Cryptography", "OAuth2"], "url": "/projects/security-jwt/", "resolved_url": "https://nhmatsumoto.github.io/projects/security-jwt/", "repo_url": "https://github.com/nhmatsumoto/Security.Jwt", "has_math": false, "name": "Security.Jwt", "headline": "JWT Manager para .NET — rotação automática de chaves, suporte a JWKS e armazenamento seguro de chaves criptográficas.", "summary": "Biblioteca .NET para gerenciamento completo de JWT: rotação automática de chaves, endpoint JWKS, suporte a múltiplos algoritmos e armazenamento seguro de material criptográfico.", "body_html": "\u003cp>Fork do NetDevPack Security.Jwt — conjunto de componentes para gerenciamento completo de JWTs em aplicações .NET.\u003c/p>\n\u003ch2>Funcionalidades principais\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Rotação automática de chaves\u003c/strong> — gera novas chaves de assinatura periodicamente sem downtime\u003c/li> \u003cli>\u003cstrong>JWKS endpoint\u003c/strong> — expõe \u003ccode>/.well-known/jwks\u003c/code> para validação distribuída de tokens\u003c/li> \u003cli>\u003cstrong>Múltiplos algoritmos\u003c/strong> — suporte a RSA, ECDSA e HMAC\u003c/li> \u003cli>\u003cstrong>Armazenamento seguro\u003c/strong> — chaves podem ser persistidas em banco de dados, filesystem ou Azure Key Vault\u003c/li> \u003cli>\u003cstrong>Key revocation\u003c/strong> — revogação de chaves comprometidas com propagação automática\u003c/li>\u003c/ul>\n\u003ch2>Por que rotação de chaves importa\u003c/h2>\n\u003cp>Chaves de assinatura estáticas são um risco de segurança: se comprometidas, todos os tokens emitidos ficam vulneráveis. Rotação automática limita a janela de exposição e garante que tokens antigos expirem naturalmente.\u003c/p>\n\u003ch2>Uso no ecossistema\u003c/h2>\n\u003cp>Referência direta para a implementação de autenticação nos projetos \u003cstrong>User-Auth\u003c/strong>, \u003cstrong>Playground-FE\u003c/strong> e \u003cstrong>SplitCosts\u003c/strong>. O padrão de JWKS é especialmente relevante em arquiteturas onde múltiplos serviços precisam validar tokens independentemente.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Gerenciar material criptográfico para JWTs é complexo: rotação, distribuição de chaves públicas, revogação e armazenamento seguro. Esta biblioteca encapsula essa complexidade em uma API simples e integrável com ASP.NET Core.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Middleware ASP.NET Core que gerencia o ciclo de vida de chaves criptográficas. Um background service rotaciona chaves periodicamente, enquanto um endpoint JWKS expõe as chaves públicas ativas para validação por serviços consumidores.\u003c/p>", "headline_en_us": "JWT Manager for .NET — automatic key rotation, JWKS support and secure cryptographic key storage.", "headline_ja_jp": ".NET 向け JWT マネージャー — 鍵の自動ローテーション、JWKS 対応、暗号鍵の安全保管。", "summary_en_us": ".NET library for end-to-end JWT management: automatic key rotation, JWKS endpoint, multi-algorithm support and secure cryptographic material storage.", "summary_ja_jp": "エンドツーエンドの JWT 管理を提供する .NET ライブラリ。鍵の自動ローテーション、JWKS エンドポイント、複数アルゴリズム対応、暗号材料の安全保管。", "body_html_en_us": "\u003cp>Fork of NetDevPack Security.Jwt, a set of components for end-to-end JWT management in .NET applications.\u003c/p>\n\u003ch2>Main features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Automatic key rotation\u003c/strong> — generate new signing keys periodically without downtime\u003c/li> \u003cli>\u003cstrong>JWKS endpoint\u003c/strong> — expose \u003ccode>/.well-known/jwks\u003c/code> for distributed token validation\u003c/li> \u003cli>\u003cstrong>Multiple algorithms\u003c/strong> — RSA, ECDSA and HMAC support\u003c/li> \u003cli>\u003cstrong>Secure storage\u003c/strong> — keys can be persisted in a database, filesystem or Azure Key Vault\u003c/li> \u003cli>\u003cstrong>Key revocation\u003c/strong> — compromised keys can be invalidated and propagated automatically\u003c/li>\u003c/ul>\n\u003ch2>Why key rotation matters\u003c/h2>\n\u003cp>Static signing keys are a security risk: once compromised, every issued token becomes vulnerable. Rotation narrows the exposure window and allows old tokens to expire naturally.\u003c/p>\n\u003ch2>Use in the ecosystem\u003c/h2>\n\u003cp>This library is a direct reference for authentication design in \u003cstrong>User-Auth\u003c/strong>, \u003cstrong>Playground-FE\u003c/strong> and \u003cstrong>SplitCosts\u003c/strong>. JWKS is especially relevant in systems where multiple services validate tokens independently.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Managing JWT cryptographic material is complex: rotation, public-key distribution, revocation and secure storage. This library encapsulates that complexity behind an API that integrates cleanly with ASP.NET Core.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>ASP.NET Core middleware and supporting services manage key lifecycles. A background service rotates keys periodically, while a JWKS endpoint exposes active public keys to dependent services.\u003c/p>", "body_html_en": "\u003cp>Fork of NetDevPack Security.Jwt, a set of components for end-to-end JWT management in .NET applications.\u003c/p>\n\u003ch2>Main features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Automatic key rotation\u003c/strong> — generate new signing keys periodically without downtime\u003c/li> \u003cli>\u003cstrong>JWKS endpoint\u003c/strong> — expose \u003ccode>/.well-known/jwks\u003c/code> for distributed token validation\u003c/li> \u003cli>\u003cstrong>Multiple algorithms\u003c/strong> — RSA, ECDSA and HMAC support\u003c/li> \u003cli>\u003cstrong>Secure storage\u003c/strong> — keys can be persisted in a database, filesystem or Azure Key Vault\u003c/li> \u003cli>\u003cstrong>Key revocation\u003c/strong> — compromised keys can be invalidated and propagated automatically\u003c/li>\u003c/ul>\n\u003ch2>Why key rotation matters\u003c/h2>\n\u003cp>Static signing keys are a security risk: once compromised, every issued token becomes vulnerable. Rotation narrows the exposure window and allows old tokens to expire naturally.\u003c/p>\n\u003ch2>Use in the ecosystem\u003c/h2>\n\u003cp>This library is a direct reference for authentication design in \u003cstrong>User-Auth\u003c/strong>, \u003cstrong>Playground-FE\u003c/strong> and \u003cstrong>SplitCosts\u003c/strong>. JWKS is especially relevant in systems where multiple services validate tokens independently.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Managing JWT cryptographic material is complex: rotation, public-key distribution, revocation and secure storage. This library encapsulates that complexity behind an API that integrates cleanly with ASP.NET Core.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>ASP.NET Core middleware and supporting services manage key lifecycles. A background service rotates keys periodically, while a JWKS endpoint exposes active public keys to dependent services.\u003c/p>", "body_html_ja_jp": "\u003cp>\u003ccode>.NET\u003c/code> アプリ向けに JWT をエンドツーエンドで管理するコンポーネント群、NetDevPack Security.Jwt のフォークです。\u003c/p>\n\u003ch2>主な機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Automatic key rotation\u003c/strong> — 無停止で署名鍵を定期生成\u003c/li> \u003cli>\u003cstrong>JWKS endpoint\u003c/strong> — 分散 token 検証のため \u003ccode>/.well-known/jwks\u003c/code> を公開\u003c/li> \u003cli>\u003cstrong>Multiple algorithms\u003c/strong> — RSA、ECDSA、HMAC 対応\u003c/li> \u003cli>\u003cstrong>Secure storage\u003c/strong> — DB、filesystem、Azure Key Vault へ鍵を保存可能\u003c/li> \u003cli>\u003cstrong>Key revocation\u003c/strong> — 侵害鍵を無効化し、自動伝播できる\u003c/li>\u003c/ul>\n\u003ch2>なぜ鍵ローテーションが重要か\u003c/h2>\n\u003cp>固定の署名鍵はセキュリティ上の大きなリスクです。侵害されると、発行済み token 全体が危険にさらされます。ローテーションは露出期間を短くし、古い token を自然失効させられます。\u003c/p>\n\u003ch2>エコシステムでの利用\u003c/h2>\n\u003cp>このライブラリは \u003cstrong>User-Auth\u003c/strong>、\u003cstrong>Playground-FE\u003c/strong>、\u003cstrong>SplitCosts\u003c/strong> における認証設計の直接的な参照です。特に JWKS は、複数サービスが独立に token を検証する構成で重要になります。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>JWT の暗号素材管理は複雑です。ローテーション、公開鍵配布、失効、セキュア保管が絡みます。このライブラリはそれらの複雑さを ASP.NET Core と統合しやすい API の背後に閉じ込めます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ASP.NET Core middleware と補助 service が鍵ライフサイクルを管理します。background service が定期的に鍵をローテーションし、JWKS endpoint が依存サービスへ公開鍵を配布します。\u003c/p>", "body_html_ja": "\u003cp>\u003ccode>.NET\u003c/code> アプリ向けに JWT をエンドツーエンドで管理するコンポーネント群、NetDevPack Security.Jwt のフォークです。\u003c/p>\n\u003ch2>主な機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Automatic key rotation\u003c/strong> — 無停止で署名鍵を定期生成\u003c/li> \u003cli>\u003cstrong>JWKS endpoint\u003c/strong> — 分散 token 検証のため \u003ccode>/.well-known/jwks\u003c/code> を公開\u003c/li> \u003cli>\u003cstrong>Multiple algorithms\u003c/strong> — RSA、ECDSA、HMAC 対応\u003c/li> \u003cli>\u003cstrong>Secure storage\u003c/strong> — DB、filesystem、Azure Key Vault へ鍵を保存可能\u003c/li> \u003cli>\u003cstrong>Key revocation\u003c/strong> — 侵害鍵を無効化し、自動伝播できる\u003c/li>\u003c/ul>\n\u003ch2>なぜ鍵ローテーションが重要か\u003c/h2>\n\u003cp>固定の署名鍵はセキュリティ上の大きなリスクです。侵害されると、発行済み token 全体が危険にさらされます。ローテーションは露出期間を短くし、古い token を自然失効させられます。\u003c/p>\n\u003ch2>エコシステムでの利用\u003c/h2>\n\u003cp>このライブラリは \u003cstrong>User-Auth\u003c/strong>、\u003cstrong>Playground-FE\u003c/strong>、\u003cstrong>SplitCosts\u003c/strong> における認証設計の直接的な参照です。特に JWKS は、複数サービスが独立に token を検証する構成で重要になります。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>JWT の暗号素材管理は複雑です。ローテーション、公開鍵配布、失効、セキュア保管が絡みます。このライブラリはそれらの複雑さを ASP.NET Core と統合しやすい API の背後に閉じ込めます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ASP.NET Core middleware と補助 service が鍵ライフサイクルを管理します。background service が定期的に鍵をローテーションし、JWKS endpoint が依存サービスへ公開鍵を配布します。\u003c/p>"}, {"id": "project-sos", "kind": "project", "status": "research", "stack": ["TypeScript", "Node.js", "GIS"], "url": "/projects/sos/", "resolved_url": "https://nhmatsumoto.github.io/projects/sos/", "repo_url": "https://github.com/nhmatsumoto/sos", "has_math": false, "name": "SOS", "headline": "Módulo auxiliar do ecossistema SOS Location — componentes compartilhados para resposta a desastres.", "summary": "Módulo auxiliar do ecossistema SOS Location com componentes compartilhados, utilitários e contratos de integração para os serviços de resposta a desastres.", "body_html": "\u003cp>Módulo auxiliar do ecossistema \u003cstrong>SOS Location\u003c/strong>, contendo componentes compartilhados entre os serviços da plataforma de resposta a desastres.\u003c/p>\n\u003ch2>Papel no ecossistema\u003c/h2>\n\u003cp>Enquanto o \u003cstrong>SOS Location\u003c/strong> é a aplicação principal com interface de usuário e pipelines de dados, o repositório \u003cstrong>SOS\u003c/strong> concentra:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Contratos de integração\u003c/strong> — tipos TypeScript compartilhados entre serviços\u003c/li> \u003cli>\u003cstrong>Utilitários GIS\u003c/strong> — funções de conversão de coordenadas, cálculo de distâncias e processamento de GeoJSON\u003c/li> \u003cli>\u003cstrong>Configurações compartilhadas\u003c/strong> — constantes, enums e mapas de referência\u003c/li>\u003c/ul>\n\u003ch2>Relação com brumadinho_location\u003c/h2>\n\u003cp>O aprendizado acumulado no projeto \u003cstrong>brumadinho_location\u003c/strong> foi formalizado nos utilitários deste módulo, transformando scripts ad-hoc em funções reutilizáveis e testáveis.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Em sistemas distribuídos, a duplicação de tipos e utilitários entre serviços gera inconsistências. Este módulo centraliza contratos e funções compartilhadas para garantir coerência entre os componentes do ecossistema SOS.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Pacote TypeScript/Node.js publicável como dependência local. Exporta tipos, interfaces e funções utilitárias consumidas pelos demais serviços do ecossistema SOS via import direto.\u003c/p>", "headline_en_us": "Helper module of the SOS Location ecosystem — shared components for disaster response.", "headline_ja_jp": "SOS Location エコシステムの補助モジュール — 災害対応のための共有コンポーネント。", "summary_en_us": "Helper module of the SOS Location ecosystem with shared components, utilities and integration contracts for disaster-response services.", "summary_ja_jp": "SOS Location エコシステムの補助モジュール。災害対応サービス向けの共有コンポーネント、ユーティリティ、連携契約を提供。", "body_html_en_us": "\u003cp>Auxiliary module of the \u003cstrong>SOS Location\u003c/strong> ecosystem, containing shared components across the disaster-response platform.\u003c/p>\n\u003ch2>Role in the ecosystem\u003c/h2>\n\u003cp>While \u003cstrong>SOS Location\u003c/strong> is the main application with UI and data pipelines, the \u003cstrong>SOS\u003c/strong> repository centralizes:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Integration contracts\u003c/strong> — shared TypeScript types across services\u003c/li> \u003cli>\u003cstrong>GIS utilities\u003c/strong> — coordinate conversion, distance calculation and GeoJSON processing helpers\u003c/li> \u003cli>\u003cstrong>Shared configuration\u003c/strong> — constants, enums and reference maps\u003c/li>\u003c/ul>\n\u003ch2>Relationship with \u003ccode>brumadinho_location\u003c/code>\u003c/h2>\n\u003cp>Lessons accumulated in \u003cstrong>brumadinho_location\u003c/strong> were formalized in this module, turning ad hoc scripts into reusable and testable functions.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>In distributed systems, duplicating shared types and utilities across services creates drift and inconsistency. This module centralizes those contracts and helpers to preserve coherence throughout the SOS ecosystem.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Publishable TypeScript / Node.js package used as a local dependency. It exports types, interfaces and utility functions consumed directly by the other SOS services.\u003c/p>", "body_html_en": "\u003cp>Auxiliary module of the \u003cstrong>SOS Location\u003c/strong> ecosystem, containing shared components across the disaster-response platform.\u003c/p>\n\u003ch2>Role in the ecosystem\u003c/h2>\n\u003cp>While \u003cstrong>SOS Location\u003c/strong> is the main application with UI and data pipelines, the \u003cstrong>SOS\u003c/strong> repository centralizes:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Integration contracts\u003c/strong> — shared TypeScript types across services\u003c/li> \u003cli>\u003cstrong>GIS utilities\u003c/strong> — coordinate conversion, distance calculation and GeoJSON processing helpers\u003c/li> \u003cli>\u003cstrong>Shared configuration\u003c/strong> — constants, enums and reference maps\u003c/li>\u003c/ul>\n\u003ch2>Relationship with \u003ccode>brumadinho_location\u003c/code>\u003c/h2>\n\u003cp>Lessons accumulated in \u003cstrong>brumadinho_location\u003c/strong> were formalized in this module, turning ad hoc scripts into reusable and testable functions.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>In distributed systems, duplicating shared types and utilities across services creates drift and inconsistency. This module centralizes those contracts and helpers to preserve coherence throughout the SOS ecosystem.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Publishable TypeScript / Node.js package used as a local dependency. It exports types, interfaces and utility functions consumed directly by the other SOS services.\u003c/p>", "body_html_ja_jp": "\u003cp>災害対応プラットフォーム \u003cstrong>SOS Location\u003c/strong> エコシステムの補助モジュールで、共有コンポーネントを集約しています。\u003c/p>\n\u003ch2>エコシステム内での役割\u003c/h2>\n\u003cp>UI とデータ・パイプラインを持つ主アプリが \u003cstrong>SOS Location\u003c/strong> である一方、この \u003cstrong>SOS\u003c/strong> リポジトリは次を集中管理します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Integration contracts\u003c/strong> — サービス間で共有する TypeScript 型\u003c/li> \u003cli>\u003cstrong>GIS utilities\u003c/strong> — 座標変換、距離計算、GeoJSON 処理関数\u003c/li> \u003cli>\u003cstrong>Shared configuration\u003c/strong> — 定数、enum、参照マップ\u003c/li>\u003c/ul>\n\u003ch2>\u003ccode>brumadinho_location\u003c/code> との関係\u003c/h2>\n\u003cp>\u003cstrong>brumadinho_location\u003c/strong> で得た知見をこのモジュールに形式化し、場当たり的なスクリプトを再利用可能でテスト可能な関数へ変えました。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>分散システムでは、共有型やユーティリティを各サービスに重複配置すると、すぐにズレと不整合が生まれます。このモジュールはそれらを集中管理し、SOS エコシステム全体の一貫性を保ちます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ローカル依存として使える公開可能な TypeScript / Node.js パッケージです。ほかの SOS サービスが直接利用する型、interface、utility 関数を export します。\u003c/p>", "body_html_ja": "\u003cp>災害対応プラットフォーム \u003cstrong>SOS Location\u003c/strong> エコシステムの補助モジュールで、共有コンポーネントを集約しています。\u003c/p>\n\u003ch2>エコシステム内での役割\u003c/h2>\n\u003cp>UI とデータ・パイプラインを持つ主アプリが \u003cstrong>SOS Location\u003c/strong> である一方、この \u003cstrong>SOS\u003c/strong> リポジトリは次を集中管理します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Integration contracts\u003c/strong> — サービス間で共有する TypeScript 型\u003c/li> \u003cli>\u003cstrong>GIS utilities\u003c/strong> — 座標変換、距離計算、GeoJSON 処理関数\u003c/li> \u003cli>\u003cstrong>Shared configuration\u003c/strong> — 定数、enum、参照マップ\u003c/li>\u003c/ul>\n\u003ch2>\u003ccode>brumadinho_location\u003c/code> との関係\u003c/h2>\n\u003cp>\u003cstrong>brumadinho_location\u003c/strong> で得た知見をこのモジュールに形式化し、場当たり的なスクリプトを再利用可能でテスト可能な関数へ変えました。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>分散システムでは、共有型やユーティリティを各サービスに重複配置すると、すぐにズレと不整合が生まれます。このモジュールはそれらを集中管理し、SOS エコシステム全体の一貫性を保ちます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ローカル依存として使える公開可能な TypeScript / Node.js パッケージです。ほかの SOS サービスが直接利用する型、interface、utility 関数を export します。\u003c/p>"}, {"id": "project-splitcost-backend", "kind": "project", "status": "research", "stack": ["C#", ".NET", "PostgreSQL", "Multi-tenant", "DDD"], "url": "/projects/splitcost-backend/", "resolved_url": "https://nhmatsumoto.github.io/projects/splitcost-backend/", "repo_url": "https://github.com/nhmatsumoto/SplitCost-Backend", "has_math": false, "name": "SplitCost-Backend", "headline": "Backend do SplitCosts — API .NET com multi-tenant, domain events e projeções de leitura.", "summary": "Backend do SplitCosts em .NET/C# com arquitetura multi-tenant, domain events, separação de contextos de leitura/escrita e projeções operacionais.", "body_html": "\u003cp>Backend do \u003cstrong>SplitCosts\u003c/strong> — API em .NET/C# que implementa a lógica de compartilhamento de despesas com foco em multi-tenancy e modelagem de domínio.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Multi-tenant\u003c/strong> — isolamento de dados por grupo/household com tenant resolution no middleware\u003c/li> \u003cli>\u003cstrong>Domain events\u003c/strong> — mudanças de estado publicam eventos para manter projeções atualizadas\u003c/li> \u003cli>\u003cstrong>CQRS simplificado\u003c/strong> — separação entre comandos (escrita) e queries (projeções de leitura)\u003c/li> \u003cli>\u003cstrong>Repository pattern\u003c/strong> — abstração de persistência com PostgreSQL via Entity Framework\u003c/li>\u003c/ul>\n\u003ch2>Domínio\u003c/h2>\n\u003cp>O modelo de domínio trata despesas como agregados com regras de negócio:\u003c/p>\n\u003cul>\u003cli>Divisão proporcional ou customizada entre participantes\u003c/li> \u003cli>Histórico de pagamentos e saldos por período\u003c/li> \u003cli>Reconciliação de dívidas entre membros do grupo\u003c/li> \u003cli>Categorização e reporting\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Evolução direta do \u003cstrong>Financial\u003c/strong> (monolito), agora com separação clara entre contextos, multi-tenancy e projeções de leitura. Consumido pelo \u003cstrong>SplitCosts-FE\u003c/strong> via REST API.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>O Financial original acoplava regras de negócio à infraestrutura e não suportava múltiplos grupos. O backend do SplitCosts resolve isso com fronteiras de domínio explícitas, tenant isolation e projeções dedicadas para cada tela.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>API ASP.NET Core em camadas: Controllers → Application Services → Domain → Infrastructure. Multi-tenancy via middleware de tenant resolution. PostgreSQL com Entity Framework Core. Projeções de leitura como queries separadas sobre views materializadas.\u003c/p>", "headline_en_us": "SplitCosts backend — .NET API with multi-tenant, domain events and read projections.", "headline_ja_jp": "SplitCosts バックエンド — マルチテナント、ドメインイベント、読み取り投影を備えた .NET API。", "summary_en_us": "SplitCosts backend in .NET/C# with multi-tenant architecture, domain events, read/write context separation and operational projections.", "summary_ja_jp": ".NET/C# による SplitCosts バックエンド。マルチテナント構造、ドメインイベント、読み書きコンテキストの分離、運用投影を備える。", "body_html_en_us": "\u003cp>Backend of \u003cstrong>SplitCosts\u003c/strong> — a .NET / C# API that implements expense-sharing logic with a focus on multi-tenancy and domain modeling.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Multi-tenant\u003c/strong> — data isolation per group / household, with tenant resolution in middleware\u003c/li> \u003cli>\u003cstrong>Domain events\u003c/strong> — state changes publish events to keep read models updated\u003c/li> \u003cli>\u003cstrong>Lightweight CQRS\u003c/strong> — separation between commands (writes) and queries (read projections)\u003c/li> \u003cli>\u003cstrong>Repository pattern\u003c/strong> — persistence abstraction backed by PostgreSQL and Entity Framework\u003c/li>\u003c/ul>\n\u003ch2>Domain\u003c/h2>\n\u003cp>The domain model treats expenses as aggregates governed by business rules:\u003c/p>\n\u003cul>\u003cli>Proportional or custom splits among participants\u003c/li> \u003cli>Payment history and balances over time\u003c/li> \u003cli>Debt reconciliation between group members\u003c/li> \u003cli>Categorization and reporting\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This is the direct evolution of \u003cstrong>Financial\u003c/strong>, now with clearer boundaries, multi-tenancy and dedicated read projections. It is consumed by \u003cstrong>SplitCosts-FE\u003c/strong> through a REST API.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>The original Financial monolith coupled business rules to infrastructure and could not support multiple groups. SplitCosts backend addresses that with explicit domain boundaries, tenant isolation and read models tailored to each screen.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>ASP.NET Core layered API: Controllers → Application Services → Domain → Infrastructure. Multi-tenancy is handled in middleware, PostgreSQL is accessed through EF Core and read projections are modeled as dedicated queries over materialized views.\u003c/p>", "body_html_en": "\u003cp>Backend of \u003cstrong>SplitCosts\u003c/strong> — a .NET / C# API that implements expense-sharing logic with a focus on multi-tenancy and domain modeling.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Multi-tenant\u003c/strong> — data isolation per group / household, with tenant resolution in middleware\u003c/li> \u003cli>\u003cstrong>Domain events\u003c/strong> — state changes publish events to keep read models updated\u003c/li> \u003cli>\u003cstrong>Lightweight CQRS\u003c/strong> — separation between commands (writes) and queries (read projections)\u003c/li> \u003cli>\u003cstrong>Repository pattern\u003c/strong> — persistence abstraction backed by PostgreSQL and Entity Framework\u003c/li>\u003c/ul>\n\u003ch2>Domain\u003c/h2>\n\u003cp>The domain model treats expenses as aggregates governed by business rules:\u003c/p>\n\u003cul>\u003cli>Proportional or custom splits among participants\u003c/li> \u003cli>Payment history and balances over time\u003c/li> \u003cli>Debt reconciliation between group members\u003c/li> \u003cli>Categorization and reporting\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This is the direct evolution of \u003cstrong>Financial\u003c/strong>, now with clearer boundaries, multi-tenancy and dedicated read projections. It is consumed by \u003cstrong>SplitCosts-FE\u003c/strong> through a REST API.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>The original Financial monolith coupled business rules to infrastructure and could not support multiple groups. SplitCosts backend addresses that with explicit domain boundaries, tenant isolation and read models tailored to each screen.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>ASP.NET Core layered API: Controllers → Application Services → Domain → Infrastructure. Multi-tenancy is handled in middleware, PostgreSQL is accessed through EF Core and read projections are modeled as dedicated queries over materialized views.\u003c/p>", "body_html_ja_jp": "\u003cp>\u003cstrong>SplitCosts\u003c/strong> のバックエンドであり、マルチテナンシーとドメインモデリングに重点を置いて支出共有ロジックを実装する .NET / C# API です。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Multi-tenant\u003c/strong> — middleware の tenant resolution による household / group 単位のデータ分離\u003c/li> \u003cli>\u003cstrong>Domain events\u003c/strong> — 状態変化をイベント公開し、read model を更新\u003c/li> \u003cli>\u003cstrong>軽量 CQRS\u003c/strong> — command（書き込み）と query（読み取り投影）の分離\u003c/li> \u003cli>\u003cstrong>Repository pattern\u003c/strong> — PostgreSQL と Entity Framework を背後に持つ永続化抽象\u003c/li>\u003c/ul>\n\u003ch2>ドメイン\u003c/h2>\n\u003cp>ドメインモデルは、業務ルールに従う aggregate として支出を扱います。\u003c/p>\n\u003cul>\u003cli>参加者間の比例またはカスタム分配\u003c/li> \u003cli>支払い履歴と期間ごとの残高\u003c/li> \u003cli>グループ内メンバー間の債務精算\u003c/li> \u003cli>カテゴリ分類とレポート\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>これは \u003cstrong>Financial\u003c/strong> の直接的な進化形で、より明確な境界、マルチテナント化、専用 read projection を備えます。\u003cstrong>SplitCosts-FE\u003c/strong> から REST API で利用されます。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>元の Financial モノリスは業務ルールとインフラが結合し、複数グループも扱えませんでした。SplitCosts バックエンドは、明示的なドメイン境界、tenant 分離、画面ごとに最適化された read model によってそれを解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ASP.NET Core のレイヤ API 構成です。Controllers → Application Services → Domain → Infrastructure。multi-tenancy は middleware で処理し、PostgreSQL へは EF Core でアクセスし、read projection は materialized view 上の専用 query として表現します。\u003c/p>", "body_html_ja": "\u003cp>\u003cstrong>SplitCosts\u003c/strong> のバックエンドであり、マルチテナンシーとドメインモデリングに重点を置いて支出共有ロジックを実装する .NET / C# API です。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Multi-tenant\u003c/strong> — middleware の tenant resolution による household / group 単位のデータ分離\u003c/li> \u003cli>\u003cstrong>Domain events\u003c/strong> — 状態変化をイベント公開し、read model を更新\u003c/li> \u003cli>\u003cstrong>軽量 CQRS\u003c/strong> — command（書き込み）と query（読み取り投影）の分離\u003c/li> \u003cli>\u003cstrong>Repository pattern\u003c/strong> — PostgreSQL と Entity Framework を背後に持つ永続化抽象\u003c/li>\u003c/ul>\n\u003ch2>ドメイン\u003c/h2>\n\u003cp>ドメインモデルは、業務ルールに従う aggregate として支出を扱います。\u003c/p>\n\u003cul>\u003cli>参加者間の比例またはカスタム分配\u003c/li> \u003cli>支払い履歴と期間ごとの残高\u003c/li> \u003cli>グループ内メンバー間の債務精算\u003c/li> \u003cli>カテゴリ分類とレポート\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>これは \u003cstrong>Financial\u003c/strong> の直接的な進化形で、より明確な境界、マルチテナント化、専用 read projection を備えます。\u003cstrong>SplitCosts-FE\u003c/strong> から REST API で利用されます。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>元の Financial モノリスは業務ルールとインフラが結合し、複数グループも扱えませんでした。SplitCosts バックエンドは、明示的なドメイン境界、tenant 分離、画面ごとに最適化された read model によってそれを解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ASP.NET Core のレイヤ API 構成です。Controllers → Application Services → Domain → Infrastructure。multi-tenancy は middleware で処理し、PostgreSQL へは EF Core でアクセスし、read projection は materialized view 上の専用 query として表現します。\u003c/p>"}, {"id": "project-splitcosts-fe", "kind": "project", "status": "research", "stack": ["React", "TypeScript", "Keycloak", "REST API"], "url": "/projects/splitcosts-fe/", "resolved_url": "https://nhmatsumoto.github.io/projects/splitcosts-fe/", "repo_url": "https://github.com/nhmatsumoto/SplitCosts-FE", "has_math": false, "name": "SplitCosts-FE", "headline": "Frontend do SplitCosts — SPA React/TypeScript com UX focada em clareza operacional.", "summary": "Frontend do SplitCosts em React/TypeScript com Keycloak auth, visualização de despesas, saldos e reconciliação, consumindo o SplitCost-Backend via REST API.", "body_html": "\u003cp>Frontend do \u003cstrong>SplitCosts\u003c/strong> — SPA em React/TypeScript que consome o SplitCost-Backend para gerenciamento de despesas compartilhadas.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Dashboard\u003c/strong> — visão geral de saldos e despesas recentes por grupo\u003c/li> \u003cli>\u003cstrong>Registro de despesas\u003c/strong> — formulário com divisão proporcional ou customizada\u003c/li> \u003cli>\u003cstrong>Reconciliação\u003c/strong> — visualização de dívidas e sugestão de pagamentos mínimos\u003c/li> \u003cli>\u003cstrong>Histórico\u003c/strong> — timeline de transações com filtros por período e categoria\u003c/li> \u003cli>\u003cstrong>Multi-grupo\u003c/strong> — navegação entre diferentes households/grupos\u003c/li>\u003c/ul>\n\u003ch2>Stack\u003c/h2>\n\u003cul>\u003cli>React com hooks e context API\u003c/li> \u003cli>TypeScript para type safety end-to-end (tipos compartilhados com o backend)\u003c/li> \u003cli>Keycloak para autenticação (padrões validados no \u003cstrong>Playground-FE\u003c/strong>)\u003c/li> \u003cli>React-data-grid para tabelas de dados com virtualização\u003c/li>\u003c/ul>\n\u003ch2>Design\u003c/h2>\n\u003cp>Interface dark-theme com foco em clareza operacional — números grandes, cores semânticas para saldos positivos/negativos e ações primárias sempre visíveis.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Aplicações financeiras precisam de UX que torne números complexos compreensíveis de relance. O frontend do SplitCosts prioriza hierarquia visual clara: saldos em destaque, despesas recentes acessíveis e reconciliação a um clique.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>SPA React consumindo REST API do backend. Autenticação via Keycloak JS adapter (inicializado no bootstrap). State management via React context + hooks. Roteamento com React Router e lazy loading de módulos por grupo.\u003c/p>", "headline_en_us": "SplitCosts frontend — React/TypeScript SPA focused on operational clarity.", "headline_ja_jp": "SplitCosts フロントエンド — 運用の明瞭さに焦点を置いた React/TypeScript SPA。", "summary_en_us": "SplitCosts frontend in React/TypeScript with Keycloak auth, expense visualization, balances and reconciliation, consuming the SplitCost-Backend via REST API.", "summary_ja_jp": "React/TypeScript による SplitCosts フロントエンド。Keycloak 認証、支出可視化、残高、照合機能を備え、SplitCost-Backend を REST API 経由で利用。", "body_html_en_us": "\u003cp>Frontend of \u003cstrong>SplitCosts\u003c/strong> — a React / TypeScript SPA that consumes the backend to manage shared expenses.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Dashboard\u003c/strong> — overview of balances and recent expenses by group\u003c/li> \u003cli>\u003cstrong>Expense entry\u003c/strong> — forms with proportional or custom split rules\u003c/li> \u003cli>\u003cstrong>Reconciliation\u003c/strong> — debt visualization and minimal-payment suggestions\u003c/li> \u003cli>\u003cstrong>History\u003c/strong> — transaction timeline with filters by period and category\u003c/li> \u003cli>\u003cstrong>Multi-group\u003c/strong> — navigation between households / groups\u003c/li>\u003c/ul>\n\u003ch2>Stack\u003c/h2>\n\u003cul>\u003cli>React with hooks and Context API\u003c/li> \u003cli>TypeScript for end-to-end type safety\u003c/li> \u003cli>Keycloak for authentication, reusing patterns validated in \u003cstrong>Playground-FE\u003c/strong>\u003c/li> \u003cli>\u003ccode>react-data-grid\u003c/code> for performant tabular views\u003c/li>\u003c/ul>\n\u003ch2>Design\u003c/h2>\n\u003cp>Dark-theme interface optimized for operational clarity — large numbers, semantic colors for balances and primary actions always visible.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Financial applications need a UX that makes complex numbers understandable at a glance. SplitCosts-FE prioritizes a clear visual hierarchy so balances, recent expenses and settlement actions are always easy to reach.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>React SPA consuming the backend REST API. Authentication is bootstrapped through the Keycloak JS adapter, state is managed with hooks and context, and routing uses lazy-loaded modules per group.\u003c/p>", "body_html_en": "\u003cp>Frontend of \u003cstrong>SplitCosts\u003c/strong> — a React / TypeScript SPA that consumes the backend to manage shared expenses.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Dashboard\u003c/strong> — overview of balances and recent expenses by group\u003c/li> \u003cli>\u003cstrong>Expense entry\u003c/strong> — forms with proportional or custom split rules\u003c/li> \u003cli>\u003cstrong>Reconciliation\u003c/strong> — debt visualization and minimal-payment suggestions\u003c/li> \u003cli>\u003cstrong>History\u003c/strong> — transaction timeline with filters by period and category\u003c/li> \u003cli>\u003cstrong>Multi-group\u003c/strong> — navigation between households / groups\u003c/li>\u003c/ul>\n\u003ch2>Stack\u003c/h2>\n\u003cul>\u003cli>React with hooks and Context API\u003c/li> \u003cli>TypeScript for end-to-end type safety\u003c/li> \u003cli>Keycloak for authentication, reusing patterns validated in \u003cstrong>Playground-FE\u003c/strong>\u003c/li> \u003cli>\u003ccode>react-data-grid\u003c/code> for performant tabular views\u003c/li>\u003c/ul>\n\u003ch2>Design\u003c/h2>\n\u003cp>Dark-theme interface optimized for operational clarity — large numbers, semantic colors for balances and primary actions always visible.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Financial applications need a UX that makes complex numbers understandable at a glance. SplitCosts-FE prioritizes a clear visual hierarchy so balances, recent expenses and settlement actions are always easy to reach.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>React SPA consuming the backend REST API. Authentication is bootstrapped through the Keycloak JS adapter, state is managed with hooks and context, and routing uses lazy-loaded modules per group.\u003c/p>", "body_html_ja_jp": "\u003cp>\u003cstrong>SplitCosts\u003c/strong> のフロントエンドであり、共有支出を管理するためにバックエンドを利用する React / TypeScript SPA です。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Dashboard\u003c/strong> — グループごとの残高と最近の支出の概観\u003c/li> \u003cli>\u003cstrong>Expense entry\u003c/strong> — 比例分配やカスタム分配に対応した入力フォーム\u003c/li> \u003cli>\u003cstrong>Reconciliation\u003c/strong> — 債務の可視化と最小支払い提案\u003c/li> \u003cli>\u003cstrong>History\u003c/strong> — 期間・カテゴリで絞り込める取引タイムライン\u003c/li> \u003cli>\u003cstrong>Multi-group\u003c/strong> — household / group 間の切り替え\u003c/li>\u003c/ul>\n\u003ch2>スタック\u003c/h2>\n\u003cul>\u003cli>hooks と Context API を使う React\u003c/li> \u003cli>end-to-end の型安全のための TypeScript\u003c/li> \u003cli>\u003cstrong>Playground-FE\u003c/strong> で検証したパターンを再利用する Keycloak 認証\u003c/li> \u003cli>高速な表表示のための \u003ccode>react-data-grid\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>デザイン\u003c/h2>\n\u003cp>運用の明瞭さを重視した dark theme UI で、大きな数値表示、残高の意味色、主要アクションの常時視認性を意識しています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>金融アプリには、複雑な数字を一目で理解できる UX が必要です。SplitCosts-FE は、残高、最近の支出、精算アクションへすぐ到達できるよう、明確な視覚階層を優先しています。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>バックエンドの REST API を利用する React SPA です。認証は Keycloak JS adapter で bootstrap し、状態管理は hooks と context、routing はグループ単位の lazy-loaded module で構成します。\u003c/p>", "body_html_ja": "\u003cp>\u003cstrong>SplitCosts\u003c/strong> のフロントエンドであり、共有支出を管理するためにバックエンドを利用する React / TypeScript SPA です。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Dashboard\u003c/strong> — グループごとの残高と最近の支出の概観\u003c/li> \u003cli>\u003cstrong>Expense entry\u003c/strong> — 比例分配やカスタム分配に対応した入力フォーム\u003c/li> \u003cli>\u003cstrong>Reconciliation\u003c/strong> — 債務の可視化と最小支払い提案\u003c/li> \u003cli>\u003cstrong>History\u003c/strong> — 期間・カテゴリで絞り込める取引タイムライン\u003c/li> \u003cli>\u003cstrong>Multi-group\u003c/strong> — household / group 間の切り替え\u003c/li>\u003c/ul>\n\u003ch2>スタック\u003c/h2>\n\u003cul>\u003cli>hooks と Context API を使う React\u003c/li> \u003cli>end-to-end の型安全のための TypeScript\u003c/li> \u003cli>\u003cstrong>Playground-FE\u003c/strong> で検証したパターンを再利用する Keycloak 認証\u003c/li> \u003cli>高速な表表示のための \u003ccode>react-data-grid\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>デザイン\u003c/h2>\n\u003cp>運用の明瞭さを重視した dark theme UI で、大きな数値表示、残高の意味色、主要アクションの常時視認性を意識しています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>金融アプリには、複雑な数字を一目で理解できる UX が必要です。SplitCosts-FE は、残高、最近の支出、精算アクションへすぐ到達できるよう、明確な視覚階層を優先しています。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>バックエンドの REST API を利用する React SPA です。認証は Keycloak JS adapter で bootstrap し、状態管理は hooks と context、routing はグループ単位の lazy-loaded module で構成します。\u003c/p>"}, {"id": "project-system-prompts-and-models-of-ai-tools", "kind": "project", "status": "research", "stack": ["Prompt Engineering", "AI Agents", "LLM"], "url": "/projects/system-prompts-and-models-of-ai-tools/", "resolved_url": "https://nhmatsumoto.github.io/projects/system-prompts-and-models-of-ai-tools/", "repo_url": "https://github.com/nhmatsumoto/system-prompts-and-models-of-ai-tools", "has_math": false, "name": "system-prompts-and-models-of-ai-tools", "headline": "Coleção completa de system prompts, tools e modelos de AI tools como v0, Cursor, Devin, Replit e outros.", "summary": "Fork da coleção completa de system prompts de ferramentas de IA: v0, Cursor, Manus, Same.dev, Lovable, Devin, Replit Agent, Windsurf, VSCode Agent e outros — referência para engenharia de prompts.", "body_html": "\u003cp>Fork da coleção mais abrangente de system prompts e definições de tools de ferramentas de IA para desenvolvimento de software.\u003c/p>\n\u003ch2>Conteúdo\u003c/h2>\n\u003cp>System prompts completos e definições de ferramentas de:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>v0\u003c/strong> (Vercel) — geração de UI\u003c/li> \u003cli>\u003cstrong>Cursor\u003c/strong> — IDE com IA integrada\u003c/li> \u003cli>\u003cstrong>Manus\u003c/strong> — agente autônomo\u003c/li> \u003cli>\u003cstrong>Same.dev\u003c/strong> — clone de sites\u003c/li> \u003cli>\u003cstrong>Lovable\u003c/strong> — geração de apps\u003c/li> \u003cli>\u003cstrong>Devin\u003c/strong> — engenheiro de software autônomo\u003c/li> \u003cli>\u003cstrong>Replit Agent\u003c/strong> — ambiente de desenvolvimento com IA\u003c/li> \u003cli>\u003cstrong>Windsurf Agent\u003c/strong> — editor com IA\u003c/li> \u003cli>\u003cstrong>VSCode Agent\u003c/strong> — Copilot Chat\u003c/li> \u003cli>\u003cstrong>Dia Browser\u003c/strong> — browser com IA\u003c/li> \u003cli>\u003cstrong>Trae AI\u003c/strong> — assistente de código\u003c/li> \u003cli>\u003cstrong>Cluely\u003c/strong> — AI overlay\u003c/li>\u003c/ul>\n\u003ch2>Relevância\u003c/h2>\n\u003cp>Estudar system prompts de produção revela padrões de engenharia de agentes:\u003c/p>\n\u003cul>\u003cli>Como diferentes ferramentas definem tool schemas\u003c/li> \u003cli>Estratégias de gestão de contexto e memória\u003c/li> \u003cli>Padrões de instrução para comportamento seguro\u003c/li> \u003cli>Trade-offs entre autonomia e controle do usuário\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Complementa o \u003cstrong>claw-code\u003c/strong> (análise técnica de agentes) e o \u003cstrong>gemini-cli\u003c/strong> (implementação de agente). Juntos, formam um corpus de referência para entender como agentes de código são construídos.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Entender como agentes de IA são instruídos é fundamental para usá-los efetivamente e para construir os próprios. Esta coleção democratiza o acesso a system prompts que normalmente são proprietários e opacos.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Repositório documental organizado por ferramenta. Cada diretório contém o system prompt completo, definições de tools/functions e, quando disponível, exemplos de interação e configuração de modelos.\u003c/p>", "headline_en_us": "Complete collection of system prompts, tools and models of AI tooling such as v0, Cursor, Devin, Replit and others.", "headline_ja_jp": "v0、Cursor、Devin、Replit など、AI ツールのシステムプロンプト・ツール・モデルの完全コレクション。", "summary_en_us": "Fork of the complete collection of AI tooling system prompts: v0, Cursor, Manus, Same.dev, Lovable, Devin, Replit Agent, Windsurf, VSCode Agent and others — a reference for prompt engineering.", "summary_ja_jp": "AI ツールのシステムプロンプト完全コレクションのフォーク：v0、Cursor、Manus、Same.dev、Lovable、Devin、Replit Agent、Windsurf、VSCode Agent など — プロンプトエンジニアリングのリファレンス。", "body_html_en_us": "\u003cp>Fork of the broadest collection of system prompts and tool definitions for AI software-development tools.\u003c/p>\n\u003ch2>Content\u003c/h2>\n\u003cp>Complete system prompts and tool definitions from:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>v0\u003c/strong> (Vercel) — UI generation\u003c/li> \u003cli>\u003cstrong>Cursor\u003c/strong> — AI-assisted IDE\u003c/li> \u003cli>\u003cstrong>Manus\u003c/strong> — autonomous agent\u003c/li> \u003cli>\u003cstrong>Same.dev\u003c/strong> — website cloning\u003c/li> \u003cli>\u003cstrong>Lovable\u003c/strong> — app generation\u003c/li> \u003cli>\u003cstrong>Devin\u003c/strong> — autonomous software engineer\u003c/li> \u003cli>\u003cstrong>Replit Agent\u003c/strong> — AI development environment\u003c/li> \u003cli>\u003cstrong>Windsurf Agent\u003c/strong> — AI editor\u003c/li> \u003cli>\u003cstrong>VSCode Agent\u003c/strong> — Copilot Chat\u003c/li> \u003cli>\u003cstrong>Dia Browser\u003c/strong> — AI browser\u003c/li> \u003cli>\u003cstrong>Trae AI\u003c/strong> — coding assistant\u003c/li> \u003cli>\u003cstrong>Cluely\u003c/strong> — AI overlay\u003c/li>\u003c/ul>\n\u003ch2>Why it matters\u003c/h2>\n\u003cp>Studying production system prompts reveals agent-engineering patterns:\u003c/p>\n\u003cul>\u003cli>How different tools define schemas for tool use\u003c/li> \u003cli>Strategies for context and memory management\u003c/li> \u003cli>Instruction patterns for safe behavior\u003c/li> \u003cli>Trade-offs between autonomy and user control\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>It complements \u003cstrong>claw-code\u003c/strong> (agent analysis) and \u003cstrong>gemini-cli\u003c/strong> (agent implementation). Together, they form a reference corpus for understanding how coding agents are built.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Understanding how AI agents are instructed is essential both for using them well and for building your own. This collection opens up prompts that are usually private and opaque.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Documentation-first repository organized by tool. Each directory stores the full system prompt, tool / function definitions and, when available, examples of interaction and model configuration.\u003c/p>", "body_html_en": "\u003cp>Fork of the broadest collection of system prompts and tool definitions for AI software-development tools.\u003c/p>\n\u003ch2>Content\u003c/h2>\n\u003cp>Complete system prompts and tool definitions from:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>v0\u003c/strong> (Vercel) — UI generation\u003c/li> \u003cli>\u003cstrong>Cursor\u003c/strong> — AI-assisted IDE\u003c/li> \u003cli>\u003cstrong>Manus\u003c/strong> — autonomous agent\u003c/li> \u003cli>\u003cstrong>Same.dev\u003c/strong> — website cloning\u003c/li> \u003cli>\u003cstrong>Lovable\u003c/strong> — app generation\u003c/li> \u003cli>\u003cstrong>Devin\u003c/strong> — autonomous software engineer\u003c/li> \u003cli>\u003cstrong>Replit Agent\u003c/strong> — AI development environment\u003c/li> \u003cli>\u003cstrong>Windsurf Agent\u003c/strong> — AI editor\u003c/li> \u003cli>\u003cstrong>VSCode Agent\u003c/strong> — Copilot Chat\u003c/li> \u003cli>\u003cstrong>Dia Browser\u003c/strong> — AI browser\u003c/li> \u003cli>\u003cstrong>Trae AI\u003c/strong> — coding assistant\u003c/li> \u003cli>\u003cstrong>Cluely\u003c/strong> — AI overlay\u003c/li>\u003c/ul>\n\u003ch2>Why it matters\u003c/h2>\n\u003cp>Studying production system prompts reveals agent-engineering patterns:\u003c/p>\n\u003cul>\u003cli>How different tools define schemas for tool use\u003c/li> \u003cli>Strategies for context and memory management\u003c/li> \u003cli>Instruction patterns for safe behavior\u003c/li> \u003cli>Trade-offs between autonomy and user control\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>It complements \u003cstrong>claw-code\u003c/strong> (agent analysis) and \u003cstrong>gemini-cli\u003c/strong> (agent implementation). Together, they form a reference corpus for understanding how coding agents are built.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Understanding how AI agents are instructed is essential both for using them well and for building your own. This collection opens up prompts that are usually private and opaque.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Documentation-first repository organized by tool. Each directory stores the full system prompt, tool / function definitions and, when available, examples of interaction and model configuration.\u003c/p>", "body_html_ja_jp": "\u003cp>AI ソフトウェア開発ツール向けの system prompt と tool 定義を集めた、最も包括的なコレクションのフォークです。\u003c/p>\n\u003ch2>内容\u003c/h2>\n\u003cp>次の system prompt と tool 定義を完全収録しています。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>v0\u003c/strong> (Vercel) — UI 生成\u003c/li> \u003cli>\u003cstrong>Cursor\u003c/strong> — AI 統合 IDE\u003c/li> \u003cli>\u003cstrong>Manus\u003c/strong> — 自律エージェント\u003c/li> \u003cli>\u003cstrong>Same.dev\u003c/strong> — Web サイト複製\u003c/li> \u003cli>\u003cstrong>Lovable\u003c/strong> — アプリ生成\u003c/li> \u003cli>\u003cstrong>Devin\u003c/strong> — 自律型ソフトウェアエンジニア\u003c/li> \u003cli>\u003cstrong>Replit Agent\u003c/strong> — AI 開発環境\u003c/li> \u003cli>\u003cstrong>Windsurf Agent\u003c/strong> — AI エディタ\u003c/li> \u003cli>\u003cstrong>VSCode Agent\u003c/strong> — Copilot Chat\u003c/li> \u003cli>\u003cstrong>Dia Browser\u003c/strong> — AI browser\u003c/li> \u003cli>\u003cstrong>Trae AI\u003c/strong> — コーディング支援\u003c/li> \u003cli>\u003cstrong>Cluely\u003c/strong> — AI overlay\u003c/li>\u003c/ul>\n\u003ch2>なぜ重要か\u003c/h2>\n\u003cp>本番 system prompt を調べると、エージェント工学のパターンが見えてきます。\u003c/p>\n\u003cul>\u003cli>各ツールが tool-use schema をどう定義するか\u003c/li> \u003cli>コンテキスト管理とメモリ戦略\u003c/li> \u003cli>安全な振る舞いを作る instruction パターン\u003c/li> \u003cli>自律性とユーザー制御のトレードオフ\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>\u003cstrong>claw-code\u003c/strong>（分析）と \u003cstrong>gemini-cli\u003c/strong>（実装）を補完し、コードエージェントがどう作られているかを理解するための参照コーパスを形成します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>AI エージェントがどのように指示されているかを理解することは、うまく使うためにも、自分で構築するためにも不可欠です。このコレクションは、本来は私的で不透明な prompt を公開資産に変えます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ツールごとに整理された documentation-first リポジトリです。各ディレクトリに完全な system prompt、tool / function 定義、利用可能な場合は対話例とモデル設定を格納します。\u003c/p>", "body_html_ja": "\u003cp>AI ソフトウェア開発ツール向けの system prompt と tool 定義を集めた、最も包括的なコレクションのフォークです。\u003c/p>\n\u003ch2>内容\u003c/h2>\n\u003cp>次の system prompt と tool 定義を完全収録しています。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>v0\u003c/strong> (Vercel) — UI 生成\u003c/li> \u003cli>\u003cstrong>Cursor\u003c/strong> — AI 統合 IDE\u003c/li> \u003cli>\u003cstrong>Manus\u003c/strong> — 自律エージェント\u003c/li> \u003cli>\u003cstrong>Same.dev\u003c/strong> — Web サイト複製\u003c/li> \u003cli>\u003cstrong>Lovable\u003c/strong> — アプリ生成\u003c/li> \u003cli>\u003cstrong>Devin\u003c/strong> — 自律型ソフトウェアエンジニア\u003c/li> \u003cli>\u003cstrong>Replit Agent\u003c/strong> — AI 開発環境\u003c/li> \u003cli>\u003cstrong>Windsurf Agent\u003c/strong> — AI エディタ\u003c/li> \u003cli>\u003cstrong>VSCode Agent\u003c/strong> — Copilot Chat\u003c/li> \u003cli>\u003cstrong>Dia Browser\u003c/strong> — AI browser\u003c/li> \u003cli>\u003cstrong>Trae AI\u003c/strong> — コーディング支援\u003c/li> \u003cli>\u003cstrong>Cluely\u003c/strong> — AI overlay\u003c/li>\u003c/ul>\n\u003ch2>なぜ重要か\u003c/h2>\n\u003cp>本番 system prompt を調べると、エージェント工学のパターンが見えてきます。\u003c/p>\n\u003cul>\u003cli>各ツールが tool-use schema をどう定義するか\u003c/li> \u003cli>コンテキスト管理とメモリ戦略\u003c/li> \u003cli>安全な振る舞いを作る instruction パターン\u003c/li> \u003cli>自律性とユーザー制御のトレードオフ\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>\u003cstrong>claw-code\u003c/strong>（分析）と \u003cstrong>gemini-cli\u003c/strong>（実装）を補完し、コードエージェントがどう作られているかを理解するための参照コーパスを形成します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>AI エージェントがどのように指示されているかを理解することは、うまく使うためにも、自分で構築するためにも不可欠です。このコレクションは、本来は私的で不透明な prompt を公開資産に変えます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>ツールごとに整理された documentation-first リポジトリです。各ディレクトリに完全な system prompt、tool / function 定義、利用可能な場合は対話例とモデル設定を格納します。\u003c/p>"}, {"id": "project-user-auth", "kind": "project", "status": "research", "stack": ["TypeScript", "Node.js", "JWT", "OAuth2"], "url": "/projects/user-auth/", "resolved_url": "https://nhmatsumoto.github.io/projects/user-auth/", "repo_url": "https://github.com/nhmatsumoto/User-Auth", "has_math": false, "name": "User-Auth", "headline": "Serviço de autenticação em TypeScript — gestão de usuários, sessões e integração com identity providers.", "summary": "Serviço de autenticação e autorização em TypeScript/Node.js com gestão de usuários, sessões e integração com provedores de identidade como Keycloak.", "body_html": "\u003cp>Serviço de autenticação e autorização em TypeScript/Node.js, projetado para gerenciar usuários, sessões e integração com provedores de identidade.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Registro e login\u003c/strong> — criação de contas com validação de email\u003c/li> \u003cli>\u003cstrong>JWT management\u003c/strong> — emissão e validação de access/refresh tokens\u003c/li> \u003cli>\u003cstrong>Session management\u003c/strong> — controle de sessões ativas com revogação\u003c/li> \u003cli>\u003cstrong>OAuth2 integration\u003c/strong> — login via provedores externos (Keycloak, Google)\u003c/li> \u003cli>\u003cstrong>Role-based access\u003c/strong> — controle de permissões por papel do usuário\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Componente de autenticação que complementa:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Playground-FE\u003c/strong> — frontend de teste para fluxos de auth\u003c/li> \u003cli>\u003cstrong>Security.Jwt\u003c/strong> — biblioteca de referência para gerenciamento de chaves JWT\u003c/li> \u003cli>\u003cstrong>SplitCosts\u003c/strong> — autenticação de produção via Keycloak\u003c/li>\u003c/ul>\n\u003ch2>Decisões de design\u003c/h2>\n\u003cul>\u003cli>Tokens de curta duração (15min access) com refresh transparente\u003c/li> \u003cli>Hashing de senhas com bcrypt (cost factor 12)\u003c/li> \u003cli>Rate limiting em endpoints de autenticação\u003c/li> \u003cli>Audit log de eventos de segurança (login, logout, failed attempts)\u003c/li>\u003c/ul>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Autenticação é um componente crítico que precisa ser implementado corretamente desde o início. Este serviço isola a complexidade de auth (hashing, tokens, sessões) em um módulo dedicado e testado.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>API Node.js/TypeScript com endpoints REST para auth. JWT para stateless authentication, com refresh tokens armazenados em banco para revogação. Middleware de autenticação exportável como pacote para outros serviços.\u003c/p>", "headline_en_us": "Authentication service in TypeScript — user management, sessions and identity-provider integration.", "headline_ja_jp": "TypeScript 製認証サービス — ユーザー管理、セッション、ID プロバイダー連携。", "summary_en_us": "Authentication and authorization service in TypeScript/Node.js with user management, sessions and integration with identity providers such as Keycloak.", "summary_ja_jp": "TypeScript/Node.js による認証・認可サービス。ユーザー管理、セッション、Keycloak など ID プロバイダーとの連携を提供。", "body_html_en_us": "\u003cp>Authentication and authorization service in TypeScript / Node.js, designed to manage users, sessions and integration with identity providers.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Sign up and sign in\u003c/strong> — account creation with email validation\u003c/li> \u003cli>\u003cstrong>JWT management\u003c/strong> — issuing and validating access / refresh tokens\u003c/li> \u003cli>\u003cstrong>Session management\u003c/strong> — active-session control with revocation\u003c/li> \u003cli>\u003cstrong>OAuth2 integration\u003c/strong> — login through external providers such as Keycloak and Google\u003c/li> \u003cli>\u003cstrong>Role-based access\u003c/strong> — authorization by user role\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This authentication component complements:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Playground-FE\u003c/strong> — frontend used to validate auth flows\u003c/li> \u003cli>\u003cstrong>Security.Jwt\u003c/strong> — reference library for JWT key management\u003c/li> \u003cli>\u003cstrong>SplitCosts\u003c/strong> — production authentication via Keycloak\u003c/li>\u003c/ul>\n\u003ch2>Design decisions\u003c/h2>\n\u003cul>\u003cli>Short-lived access tokens (15 minutes) with transparent refresh\u003c/li> \u003cli>Password hashing with bcrypt (cost factor 12)\u003c/li> \u003cli>Rate limiting on authentication endpoints\u003c/li> \u003cli>Audit logs for security events such as login, logout and failed attempts\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Authentication is a critical subsystem that must be correct from day one. This service isolates the complexity of hashing, token issuance and session control into a dedicated, testable module.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Node.js / TypeScript API exposing REST endpoints for authentication. JWT enables stateless auth, while refresh tokens remain stored in the database for revocation. The authentication middleware is exportable for reuse in other services.\u003c/p>", "body_html_en": "\u003cp>Authentication and authorization service in TypeScript / Node.js, designed to manage users, sessions and integration with identity providers.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Sign up and sign in\u003c/strong> — account creation with email validation\u003c/li> \u003cli>\u003cstrong>JWT management\u003c/strong> — issuing and validating access / refresh tokens\u003c/li> \u003cli>\u003cstrong>Session management\u003c/strong> — active-session control with revocation\u003c/li> \u003cli>\u003cstrong>OAuth2 integration\u003c/strong> — login through external providers such as Keycloak and Google\u003c/li> \u003cli>\u003cstrong>Role-based access\u003c/strong> — authorization by user role\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This authentication component complements:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Playground-FE\u003c/strong> — frontend used to validate auth flows\u003c/li> \u003cli>\u003cstrong>Security.Jwt\u003c/strong> — reference library for JWT key management\u003c/li> \u003cli>\u003cstrong>SplitCosts\u003c/strong> — production authentication via Keycloak\u003c/li>\u003c/ul>\n\u003ch2>Design decisions\u003c/h2>\n\u003cul>\u003cli>Short-lived access tokens (15 minutes) with transparent refresh\u003c/li> \u003cli>Password hashing with bcrypt (cost factor 12)\u003c/li> \u003cli>Rate limiting on authentication endpoints\u003c/li> \u003cli>Audit logs for security events such as login, logout and failed attempts\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Authentication is a critical subsystem that must be correct from day one. This service isolates the complexity of hashing, token issuance and session control into a dedicated, testable module.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Node.js / TypeScript API exposing REST endpoints for authentication. JWT enables stateless auth, while refresh tokens remain stored in the database for revocation. The authentication middleware is exportable for reuse in other services.\u003c/p>", "body_html_ja_jp": "\u003cp>ユーザー、セッション、identity provider 連携を管理するために設計された TypeScript / Node.js 製の認証・認可サービスです。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Sign up / sign in\u003c/strong> — メール検証付きのアカウント作成\u003c/li> \u003cli>\u003cstrong>JWT management\u003c/strong> — access / refresh token の発行と検証\u003c/li> \u003cli>\u003cstrong>Session management\u003c/strong> — revoke 可能なアクティブ・セッション管理\u003c/li> \u003cli>\u003cstrong>OAuth2 integration\u003c/strong> — Keycloak や Google などの外部プロバイダ経由ログイン\u003c/li> \u003cli>\u003cstrong>Role-based access\u003c/strong> — ユーザーロール単位の認可\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>この認証コンポーネントは次を補完します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Playground-FE\u003c/strong> — 認証フローを検証するフロントエンド\u003c/li> \u003cli>\u003cstrong>Security.Jwt\u003c/strong> — JWT 鍵管理の参照ライブラリ\u003c/li> \u003cli>\u003cstrong>SplitCosts\u003c/strong> — Keycloak による本番認証\u003c/li>\u003c/ul>\n\u003ch2>設計判断\u003c/h2>\n\u003cul>\u003cli>15 分の短命 access token と透過的 refresh\u003c/li> \u003cli>bcrypt（cost factor 12）によるパスワード・ハッシュ\u003c/li> \u003cli>認証 endpoint への rate limiting\u003c/li> \u003cli>login、logout、failed attempt などのセキュリティ監査ログ\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>認証は、最初の日から正しくなければならない重要サブシステムです。このサービスは、hashing、token 発行、session 制御の複雑さを、専用かつテスト可能なモジュールに隔離します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>認証用 REST endpoint を提供する Node.js / TypeScript API です。JWT により stateless auth を実現しつつ、refresh token は revoke 用に DB へ保存します。認証 middleware は他サービスへ再利用可能な形で export されます。\u003c/p>", "body_html_ja": "\u003cp>ユーザー、セッション、identity provider 連携を管理するために設計された TypeScript / Node.js 製の認証・認可サービスです。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Sign up / sign in\u003c/strong> — メール検証付きのアカウント作成\u003c/li> \u003cli>\u003cstrong>JWT management\u003c/strong> — access / refresh token の発行と検証\u003c/li> \u003cli>\u003cstrong>Session management\u003c/strong> — revoke 可能なアクティブ・セッション管理\u003c/li> \u003cli>\u003cstrong>OAuth2 integration\u003c/strong> — Keycloak や Google などの外部プロバイダ経由ログイン\u003c/li> \u003cli>\u003cstrong>Role-based access\u003c/strong> — ユーザーロール単位の認可\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>この認証コンポーネントは次を補完します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Playground-FE\u003c/strong> — 認証フローを検証するフロントエンド\u003c/li> \u003cli>\u003cstrong>Security.Jwt\u003c/strong> — JWT 鍵管理の参照ライブラリ\u003c/li> \u003cli>\u003cstrong>SplitCosts\u003c/strong> — Keycloak による本番認証\u003c/li>\u003c/ul>\n\u003ch2>設計判断\u003c/h2>\n\u003cul>\u003cli>15 分の短命 access token と透過的 refresh\u003c/li> \u003cli>bcrypt（cost factor 12）によるパスワード・ハッシュ\u003c/li> \u003cli>認証 endpoint への rate limiting\u003c/li> \u003cli>login、logout、failed attempt などのセキュリティ監査ログ\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>認証は、最初の日から正しくなければならない重要サブシステムです。このサービスは、hashing、token 発行、session 制御の複雑さを、専用かつテスト可能なモジュールに隔離します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>認証用 REST endpoint を提供する Node.js / TypeScript API です。JWT により stateless auth を実現しつつ、refresh token は revoke 用に DB へ保存します。認証 middleware は他サービスへ再利用可能な形で export されます。\u003c/p>"}, {"id": "document-technical-knowledge-os", "kind": "document", "name": "Technical Knowledge OS", "headline": "A definição operacional do blog como sistema vivo de documentação técnica.", "summary": "A definição operacional do blog como sistema vivo de documentação técnica.", "status": "production", "stack": ["domain", "knowledge"], "url": "/documents/technical-knowledge-os/", "resolved_url": "https://nhmatsumoto.github.io/documents/technical-knowledge-os/", "repo_url": "", "has_math": false, "title": "Technical Knowledge OS", "body_html": "\u003ch1>Technical Knowledge OS\u003c/h1>\n\u003cp>O blog passou a funcionar como um sistema de documentação viva. A ideia de \u003cstrong>technical knowledge OS\u003c/strong> é simples:\u003c/p>\n\u003cul>\u003cli>posts registram aprendizado e síntese;\u003c/li> \u003cli>projetos mantêm contexto operacional;\u003c/li> \u003cli>documentos preservam decisões e arquitetura;\u003c/li> \u003cli>tudo é versionado no mesmo fluxo de publicação.\u003c/li>\u003c/ul>\n\u003ch2>Por que isso importa\u003c/h2>\n\u003cp>Na prática, conhecimento técnico se perde quando cada formato vive isolado. O post explica, a documentação detalha, mas o contexto entre um e outro desaparece.\u003c/p>\n\u003cp>O objetivo aqui é reduzir essa distância e fazer o site refletir o trabalho real: arquitetura, decisões, trade-offs e evolução.\u003c/p>\n\u003ch2>Princípios\u003c/h2>\n\u003cul>\u003cli>clareza antes de ornamentação;\u003c/li> \u003cli>profundidade sem ruído;\u003c/li> \u003cli>cada página precisa justificar sua existência;\u003c/li> \u003cli>o sistema deve continuar pequeno o suficiente para ser mantido.\u003c/li>\u003c/ul>", "title_en_us": "Technical Knowledge OS", "title_ja_jp": "Technical Knowledge OS", "summary_en_us": "The operational definition of the blog as a living system of technical documentation.", "summary_ja_jp": "ブログを生きた技術ドキュメンテーション・システムとして運用する定義。", "body_html_en_us": "\u003ch1>Technical Knowledge OS\u003c/h1>\n\u003cp>The blog has evolved into a living documentation system. The idea behind \u003cstrong>Technical Knowledge OS\u003c/strong> is simple:\u003c/p>\n\u003cul>\u003cli>posts register learning and synthesis;\u003c/li> \u003cli>projects preserve operational context;\u003c/li> \u003cli>documents store decisions and architecture;\u003c/li> \u003cli>everything is versioned inside the same publishing flow.\u003c/li>\u003c/ul>\n\u003ch2>Why it matters\u003c/h2>\n\u003cp>In practice, technical knowledge gets lost when each format lives in isolation. A post explains something, a document details it, but the context between them disappears.\u003c/p>\n\u003cp>The goal here is to reduce that gap and make the site reflect the real work: architecture, decisions, trade-offs and evolution.\u003c/p>\n\u003ch2>Principles\u003c/h2>\n\u003cul>\u003cli>clarity before ornament;\u003c/li> \u003cli>depth without noise;\u003c/li> \u003cli>every page must justify its existence;\u003c/li> \u003cli>the system should remain small enough to be maintainable.\u003c/li>\u003c/ul>", "body_html_ja_jp": "\u003ch1>Technical Knowledge OS\u003c/h1>\n\u003cp>このブログは、生きたドキュメンテーション・システムへ進化しました。\u003cstrong>Technical Knowledge OS\u003c/strong> という考え方はシンプルです。\u003c/p>\n\u003cul>\u003cli>post は学びと要約を記録する\u003c/li> \u003cli>project は運用文脈を保持する\u003c/li> \u003cli>document は設計判断とアーキテクチャを保存する\u003c/li> \u003cli>そのすべてを同じ公開フローの中でバージョン管理する\u003c/li>\u003c/ul>\n\u003ch2>なぜ重要か\u003c/h2>\n\u003cp>実際には、技術知識は形式ごとに孤立すると失われます。post が説明し、document が詳細を残しても、その間の文脈は消えてしまいます。\u003c/p>\n\u003cp>ここでの目標は、その距離を縮め、アーキテクチャ、意思決定、トレードオフ、進化といった実際の仕事がサイトに反映されるようにすることです。\u003c/p>\n\u003ch2>原則\u003c/h2>\n\u003cul>\u003cli>装飾より先に明快さ\u003c/li> \u003cli>ノイズのない深さ\u003c/li> \u003cli>すべてのページは存在理由を持つこと\u003c/li> \u003cli>システムは保守できるだけ十分に小さく保つこと\u003c/li>\u003c/ul>"}, {"id": "document-system-architecture", "kind": "document", "name": "Arquitetura do Sistema", "headline": "Visão estrutural das fronteiras do sistema e do racional arquitetural do projeto.", "summary": "Visão estrutural das fronteiras do sistema e do racional arquitetural do projeto.", "status": "production", "stack": ["architecture", "system"], "url": "/documents/system-architecture/", "resolved_url": "https://nhmatsumoto.github.io/documents/system-architecture/", "repo_url": "", "has_math": false, "title": "Arquitetura do Sistema", "body_html": "\u003ch1>Arquitetura do Sistema\u003c/h1>\n\u003cp>O Ronaldinho-Agent segue uma arquitetura moderna e bastante integrada, na qual um \u003ccode>NeuralCore\u003c/code> em C# orquestra estratégias de IA e regras de governança.\u003c/p>\n\u003ch2>Estrutura de diretórios\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"text\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>Ronaldinho-Agent/\n├── services/\n│   ├── Ronaldinho.NeuralCore/    # Cérebro central e API em .NET 9\n│   ├── Ronaldinho.ConfigUI/      # Interface de governança em React/Chakra UI\n├── ronaldinho/                   # Dados centrais e estado persistente\n│   ├── config/                   # SOUL.md e definições de estado\n│   ├── data/                     # Chaves de criptografia e vault\n├── dev_scripts/                  # Automação em PowerShell\n├── docs/                         # Documentação técnica\n├── start_neural.ps1              # Ponto de entrada local unificado\n└── docker-compose.yml            # Deploy containerizado\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Componentes principais\u003c/h2>\n\u003ch3>1. NeuralCore\u003c/h3>\n\u003cp>Um motor de alta performance em \u003cstrong>.NET 9\u003c/strong> que usa \u003cstrong>Semantic Kernel\u003c/strong> para coordenar múltiplas estratégias de LLM e regras de governança.\u003c/p>\n\u003cp>Responsabilidades centrais:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Rotação de providers\u003c/strong> com cadeia de resiliência para falhas e limites de cota\u003c/li> \u003cli>\u003cstrong>Suporte ao protocolo MCP\u003c/strong> para coordenação entre agentes especializados\u003c/li> \u003cli>\u003cstrong>Compressão de contexto\u003c/strong> para sessões longas\u003c/li> \u003cli>\u003cstrong>APIs operacionais\u003c/strong> para integração com interfaces externas\u003c/li>\u003c/ul>\n\u003ch3>2. Config UI\u003c/h3>\n\u003cp>Uma superfície de governança para ajustar regras operacionais, prioridades de provider e comportamento de runtime sem alterar o núcleo do agente.\u003c/p>\n\u003ch3>3. Estado persistente\u003c/h3>\n\u003cp>Configuração, memória e material sensível ficam fora do código dos serviços para que o runtime possa reiniciar sem perder identidade ou contexto.\u003c/p>", "title_en_us": "System Architecture", "title_ja_jp": "システムアーキテクチャ", "summary_en_us": "Structural view of the system's boundaries and its architectural rationale.", "summary_ja_jp": "システム境界の構造的俯瞰と、その背後にある設計根拠。", "body_html_en_us": "\u003ch1>Project Architecture\u003c/h1>\n\u003cp>Ronaldinho-Agent follows a modern, hyper-converged architecture where a C# NeuralCore orchestrates AI strategies and governance rules.\u003c/p>\n\u003ch2>Directory Structure\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"text\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>Ronaldinho-Agent/\n├── services/\n│   ├── Ronaldinho.NeuralCore/    # .NET 9 central brain and API\n│   ├── Ronaldinho.ConfigUI/      # React/Chakra UI governance interface\n├── ronaldinho/                   # Core data and persistent state\n│   ├── config/                   # SOUL.md and state definitions\n│   ├── data/                     # Encryption keys and vault\n├── dev_scripts/                  # PowerShell automation\n├── docs/                         # Technical documentation\n├── start_neural.ps1              # Unified local entry point\n└── docker-compose.yml            # Containerized deployment\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Key Components\u003c/h2>\n\u003ch3>1. NeuralCore\u003c/h3>\n\u003cp>A high-performance \u003cstrong>.NET 9\u003c/strong> engine that uses \u003cstrong>Semantic Kernel\u003c/strong> to coordinate multiple LLM strategies and governance rules.\u003c/p>\n\u003cp>Core responsibilities:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Provider rotation\u003c/strong> through a zero-block resilience chain\u003c/li> \u003cli>\u003cstrong>MCP protocol support\u003c/strong> for multi-agent coordination\u003c/li> \u003cli>\u003cstrong>Context compression\u003c/strong> for long-running sessions\u003c/li> \u003cli>\u003cstrong>Operational APIs\u003c/strong> for external interfaces\u003c/li>\u003c/ul>\n\u003ch3>2. Config UI\u003c/h3>\n\u003cp>A governance surface for adjusting operating rules, provider priorities and runtime behavior without changing the agent core.\u003c/p>\n\u003ch3>3. Persistent State\u003c/h3>\n\u003cp>Configuration, memory and sensitive material are kept outside the service code so that the runtime can be restarted without losing identity or context.\u003c/p>", "body_html_ja_jp": "\u003ch1>プロジェクト・アーキテクチャ\u003c/h1>\n\u003cp>Ronaldinho-Agent は、C# 製 NeuralCore が AI 戦略とガバナンス・ルールを統括する、現代的で高集約なアーキテクチャを採用しています。\u003c/p>\n\u003ch2>ディレクトリ構成\u003c/h2>\n\u003cdiv class=\"code-shell\" data-language=\"text\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>Ronaldinho-Agent/\n├── services/\n│   ├── Ronaldinho.NeuralCore/    # .NET 9 の中枢 API\n│   ├── Ronaldinho.ConfigUI/      # React/Chakra UI 製ガバナンス画面\n├── ronaldinho/                   # コアデータと永続状態\n│   ├── config/                   # SOUL.md と状態定義\n│   ├── data/                     # 暗号鍵と vault\n├── dev_scripts/                  # PowerShell 自動化\n├── docs/                         # 技術文書\n├── start_neural.ps1              # 統一ローカル起動点\n└── docker-compose.yml            # コンテナ配備\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>主要コンポーネント\u003c/h2>\n\u003ch3>1. NeuralCore\u003c/h3>\n\u003cp>複数の LLM 戦略とガバナンス・ルールを \u003cstrong>Semantic Kernel\u003c/strong> で調停する高性能 \u003cstrong>.NET 9\u003c/strong> エンジンです。\u003c/p>\n\u003cp>主な責務:\u003c/p>\n\u003cul>\u003cli>zero-block resilience chain による \u003cstrong>provider rotation\u003c/strong>\u003c/li> \u003cli>マルチエージェント調停のための \u003cstrong>MCP protocol 対応\u003c/strong>\u003c/li> \u003cli>長時間セッション向け \u003cstrong>context compression\u003c/strong>\u003c/li> \u003cli>外部インターフェース用の \u003cstrong>operational API\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch3>2. Config UI\u003c/h3>\n\u003cp>エージェント・コアを変更せずに、運用ルール、provider 優先順位、runtime 挙動を調整するためのガバナンス画面です。\u003c/p>\n\u003ch3>3. Persistent State\u003c/h3>\n\u003cp>設定、メモリ、機微情報は service code の外に保持し、ランタイムを再起動しても ID や文脈を失わないようにしています。\u003c/p>"}, {"id": "document-adr-versioned-memory", "kind": "document", "name": "ADR 003 - Memória Versionada", "headline": "Decisão arquitetural sobre snapshots de memória e persistência de contexto em workflows com agentes.", "summary": "Decisão arquitetural sobre snapshots de memória e persistência de contexto em workflows com agentes.", "status": "production", "stack": ["agents", "adr", "memory"], "url": "/documents/adr-versioned-memory/", "resolved_url": "https://nhmatsumoto.github.io/documents/adr-versioned-memory/", "repo_url": "", "has_math": false, "title": "ADR 003 - Memória Versionada", "body_html": "\u003ch1>Gestão de Memória Versionada para Agentes de IA\u003c/h1>\n\u003ch2>Visão Geral\u003c/h2>\n\u003cp>A ideia é criar um sistema onde os agentes de IA possam versionar suas memórias usando o Git. Cada &quot;snapshot&quot; do contexto é armazenado como um commit, criando um histórico versionado que o agente pode consultar no futuro.\u003c/p>\n\u003ch2>Fluxo do Sistema\u003c/h2>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant Agente\n    participant Snapshot\n    participant GitHub\n\n    Agente->>Snapshot: Cria um snapshot do contexto atual\n    Snapshot->>GitHub: Commit do snapshot para o repositório Git\n    GitHub-->>Agente: Retorna confirmação e mantém histórico versionado\u003c/div>\n\u003ch2>Componentes Principais\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Agente\u003c/strong>: O agente de IA que está executando as tarefas e deseja manter o contexto.\u003c/li> \u003cli>\u003cstrong>Snapshot\u003c/strong>: Um ponto de salvamento do contexto atual, que inclui dados relevantes.\u003c/li> \u003cli>\u003cstrong>GitHub (ou outro repositório Git)\u003c/strong>: O repositório onde os snapshots são versionados e armazenados de forma segura.\u003c/li>\u003c/ul>\n\u003ch2>Benefícios\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Memória Persistente\u003c/strong>: O agente pode recuperar contextos antigos sem perder informações.\u003c/li> \u003cli>\u003cstrong>Histórico Versionado\u003c/strong>: Cada alteração é registrada, permitindo rastreabilidade.\u003c/li> \u003cli>\u003cstrong>Otimização\u003c/strong>: Menos reprocessamento de dados, economizando tokens e requisições.\u003c/li>\u003c/ul>", "title_en_us": "ADR 003 — Versioned Memory", "title_ja_jp": "ADR 003 — バージョン管理された記憶", "summary_en_us": "Architectural decision on memory snapshots and context persistence in agent-oriented workflows.", "summary_ja_jp": "エージェント指向ワークフローにおける記憶スナップショットとコンテキスト永続化に関するアーキテクチャ決定。", "body_html_en_us": "\u003ch1>Versioned Memory Management for AI Agents\u003c/h1>\n\u003ch2>Overview\u003c/h2>\n\u003cp>The idea is to build a system where AI agents can version their memories using Git. Each context snapshot is stored as a commit, creating a versioned history that the agent can revisit later.\u003c/p>\n\u003ch2>System Flow\u003c/h2>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant Agent\n    participant Snapshot\n    participant GitHub\n\n    Agent->>Snapshot: Create a snapshot of the current context\n    Snapshot->>GitHub: Commit the snapshot to the Git repository\n    GitHub-->>Agent: Return confirmation and preserve the versioned history\u003c/div>\n\u003ch2>Main Components\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Agent\u003c/strong>: the AI agent executing tasks and preserving context.\u003c/li> \u003cli>\u003cstrong>Snapshot\u003c/strong>: a saved point-in-time representation of the current context.\u003c/li> \u003cli>\u003cstrong>GitHub (or another Git repository)\u003c/strong>: the repository where snapshots are versioned and stored safely.\u003c/li>\u003c/ul>\n\u003ch2>Benefits\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Persistent memory\u003c/strong>: the agent can recover old contexts without losing information.\u003c/li> \u003cli>\u003cstrong>Versioned history\u003c/strong>: every change is recorded, improving traceability.\u003c/li> \u003cli>\u003cstrong>Optimization\u003c/strong>: less repeated processing, saving tokens and requests.\u003c/li>\u003c/ul>", "body_html_ja_jp": "\u003ch1>AI エージェントのためのバージョン管理メモリ\u003c/h1>\n\u003ch2>概要\u003c/h2>\n\u003cp>AI エージェントが Git を使って自分の記憶をバージョン管理できる仕組みを作る、という考え方です。文脈の各スナップショットを commit として保存し、後から参照できる履歴にします。\u003c/p>\n\u003ch2>システムフロー\u003c/h2>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant Agent as エージェント\n    participant Snapshot as スナップショット\n    participant GitHub\n\n    Agent->>Snapshot: 現在の文脈のスナップショットを作成\n    Snapshot->>GitHub: スナップショットを Git リポジトリへ commit\n    GitHub-->>Agent: 確認を返し、バージョン履歴を保持\u003c/div>\n\u003ch2>主要コンポーネント\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>エージェント\u003c/strong>: タスクを実行し、文脈を保持したい AI エージェント。\u003c/li> \u003cli>\u003cstrong>スナップショット\u003c/strong>: 現在の文脈を切り出した保存ポイント。\u003c/li> \u003cli>\u003cstrong>GitHub（または他の Git リポジトリ）\u003c/strong>: スナップショットをバージョン管理し、安全に保存する場所。\u003c/li>\u003c/ul>\n\u003ch2>利点\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>永続メモリ\u003c/strong>: 情報を失わずに過去の文脈を復元できる。\u003c/li> \u003cli>\u003cstrong>バージョン履歴\u003c/strong>: すべての変更が記録され、追跡しやすい。\u003c/li> \u003cli>\u003cstrong>最適化\u003c/strong>: 再処理を減らし、token と request の消費を抑えられる。\u003c/li>\u003c/ul>"}, {"id": "document-agent-integration-surface", "kind": "document", "name": "Superfície de Integração de Agentes", "headline": "Contratos mínimos para expor ferramentas e serviços a um runtime orientado a agentes.", "summary": "Contratos mínimos para expor ferramentas e serviços a um runtime orientado a agentes.", "status": "production", "stack": ["apis", "agents", "integration"], "url": "/documents/agent-integration-surface/", "resolved_url": "https://nhmatsumoto.github.io/documents/agent-integration-surface/", "repo_url": "", "has_math": false, "title": "Superfície de Integração de Agentes", "body_html": "\u003ch1>Agent Integration Surface\u003c/h1>\n\u003cp>Esta nota documenta a superfície mínima de integração para um sistema orientado a agentes que precisa chamar ferramentas externas sem perder previsibilidade.\u003c/p>\n\u003ch2>Contratos principais\u003c/h2>\n\u003cul>\u003cli>\u003ccode>task\u003c/code>: o problema que precisa ser resolvido;\u003c/li> \u003cli>\u003ccode>capability\u003c/code>: o conjunto de ações disponíveis;\u003c/li> \u003cli>\u003ccode>tool_call\u003c/code>: a invocação concreta de infraestrutura;\u003c/li> \u003cli>\u003ccode>result\u003c/code>: o retorno normalizado para consumo interno.\u003c/li>\u003c/ul>\n\u003ch2>Regras úteis\u003c/h2>\n\u003col>\u003cli>O agente não deve falar diretamente com tudo.\u003c/li> \u003cli>Toda chamada externa precisa de contrato e normalização.\u003c/li> \u003cli>Logs técnicos não substituem eventos de domínio.\u003c/li>\u003c/ol>\n\u003ch2>Resultado esperado\u003c/h2>\n\u003cp>Quando essa superfície é explícita, trocar provider, runtime ou forma de coordenação deixa de ser uma reescrita completa.\u003c/p>", "title_en_us": "Agent Integration Surface", "title_ja_jp": "エージェント統合サーフェス", "summary_en_us": "Minimal contracts for exposing tools and services to an agent-oriented runtime.", "summary_ja_jp": "エージェント指向のランタイムに対して、ツールとサービスを公開する最小契約。", "body_html_en_us": "\u003ch1>Agent Integration Surface\u003c/h1>\n\u003cp>This note documents the minimum integration surface for an agent-oriented system that needs to call external tools without losing predictability.\u003c/p>\n\u003ch2>Core contracts\u003c/h2>\n\u003cul>\u003cli>\u003ccode>task\u003c/code>: the problem that needs to be solved;\u003c/li> \u003cli>\u003ccode>capability\u003c/code>: the set of actions that is available;\u003c/li> \u003cli>\u003ccode>tool_call\u003c/code>: the concrete infrastructure invocation;\u003c/li> \u003cli>\u003ccode>result\u003c/code>: the normalized return value used internally.\u003c/li>\u003c/ul>\n\u003ch2>Useful rules\u003c/h2>\n\u003col>\u003cli>The agent should not talk directly to everything.\u003c/li> \u003cli>Every external call needs an explicit contract and normalization.\u003c/li> \u003cli>Technical logs do not replace domain events.\u003c/l

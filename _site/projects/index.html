行\u003c/li> \u003cli>\u003cstrong>Configuration validation\u003c/strong> — 起動時に不完全なマッピングを早期検出\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>レイヤー間の手動マッピングコードは反復的で壊れやすいものです。AutoMapper は規約でその定型コードを減らしますが、規律は必要です。モデルが乖離すると、暗黙マッピングが不具合を隠すことがあります。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>AutoMapper は profile のコンパイル時に reflection と expression tree を使ってマッピングを生成します。最近のバージョンでは、高性能が求められる場面で reflection のオーバーヘッドを避けるため、source generator も導入されました。\u003c/p>", "body_html_ja": "\u003cp>AutoMapper のフォークです。.NET エコシステムで最も広く使われている、異なるレイヤー間（DTO、ViewModel、Entity）のオブジェクトを自動マッピングするライブラリです。\u003c/p>\n\u003ch2>このフォークの理由\u003c/h2>\n\u003cp>AutoMapper は SplitCosts や Financial のようなプロジェクトにおける直接的な参照実装です。ドメインと API 契約を分離すると、表現間の変換が頻繁に発生します。フォークを維持することで、内部実装を調べ、パフォーマンスと利便性のトレードオフを評価できます。\u003c/p>\n\u003ch2>中核となる考え方\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Convention over configuration\u003c/strong> — 同名プロパティを自動マッピング\u003c/li> \u003cli>\u003cstrong>Profiles\u003c/strong> — ドメイン文脈ごとにマッピング設定を整理\u003c/li> \u003cli>\u003cstrong>Projections\u003c/strong> — LINQ / EF と統合し、DB 側で投影を実行\u003c/li> \u003cli>\u003cstrong>Configuration validation\u003c/strong> — 起動時に不完全なマッピングを早期検出\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>レイヤー間の手動マッピングコードは反復的で壊れやすいものです。AutoMapper は規約でその定型コードを減らしますが、規律は必要です。モデルが乖離すると、暗黙マッピングが不具合を隠すことがあります。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>AutoMapper は profile のコンパイル時に reflection と expression tree を使ってマッピングを生成します。最近のバージョンでは、高性能が求められる場面で reflection のオーバーヘッドを避けるため、source generator も導入されました。\u003c/p>"}, {"id": "project-chess", "kind": "project", "status": "research", "stack": ["C#", ".NET", "OOP", "Domain Modeling"], "url": "/projects/chess/", "resolved_url": "https://nhmatsumoto.github.io/projects/chess/", "repo_url": "https://github.com/nhmatsumoto/chess", "has_math": false, "name": "Chess", "headline": "Implementação de xadrez em C# com modelagem de domínio orientada a regras.", "summary": "Jogo de xadrez implementado em C# com foco em modelagem de domínio, validação de movimentos e representação do tabuleiro.", "body_html": "\u003cp>Implementação de um jogo de xadrez completo em C#, com modelagem de domínio que trata cada peça como entidade com regras próprias de movimentação.\u003c/p>\n\u003ch2>Modelagem de domínio\u003c/h2>\n\u003cp>O tabuleiro é representado como uma matriz 8x8 onde cada célula pode conter uma peça. Cada tipo de peça (Rei, Rainha, Torre, Bispo, Cavalo, Peão) implementa suas próprias regras de movimentação, incluindo:\u003c/p>\n\u003cul>\u003cli>Movimentos válidos considerando o estado atual do tabuleiro\u003c/li> \u003cli>Detecção de xeque e xeque-mate\u003c/li> \u003cli>Movimentos especiais: roque, en passant, promoção de peão\u003c/li>\u003c/ul>\n\u003ch2>Decisões de design\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Value Objects\u003c/strong> para posições no tabuleiro\u003c/li> \u003cli>\u003cstrong>Strategy pattern\u003c/strong> para regras de movimentação por tipo de peça\u003c/li> \u003cli>\u003cstrong>Imutabilidade\u003c/strong> do estado do jogo para facilitar undo/redo\u003c/li>\u003c/ul>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Xadrez é um exercício clássico de modelagem de domínio: regras complexas que interagem entre si, validações que dependem do estado global e lógica que precisa ser expressa de forma clara. O projeto aplica princípios de DDD para manter as regras legíveis e testáveis.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Arquitetura em camadas simples: domínio (peças, tabuleiro, regras), aplicação (controle de jogo, turnos) e interface de console. O domínio é completamente independente da camada de apresentação.\u003c/p>", "headline_en_us": "Chess engine in C# with rule-driven domain modeling.", "headline_ja_jp": "ルール駆動ドメインモデリングによる C# のチェスエンジン。", "summary_en_us": "Chess game implemented in C# with a focus on domain modeling, move validation and board representation.", "summary_ja_jp": "ドメインモデリング、着手の検証、盤面表現に焦点を置いた C# 実装のチェスゲーム。", "body_html_en_us": "\u003cp>Implementation of a complete chess game in C#, with a domain model that treats each piece as an entity with its own movement rules.\u003c/p>\n\u003ch2>Domain modeling\u003c/h2>\n\u003cp>The board is represented as an 8x8 matrix where each square may contain a piece. Each piece type (King, Queen, Rook, Bishop, Knight and Pawn) implements its own movement rules, including:\u003c/p>\n\u003cul>\u003cli>Valid moves considering the current board state\u003c/li> \u003cli>Check and checkmate detection\u003c/li> \u003cli>Special moves: castling, en passant and pawn promotion\u003c/li>\u003c/ul>\n\u003ch2>Design decisions\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Value Objects\u003c/strong> for board positions\u003c/li> \u003cli>\u003cstrong>Strategy pattern\u003c/strong> for movement rules by piece type\u003c/li> \u003cli>\u003cstrong>Immutable game state\u003c/strong> to simplify undo/redo\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Chess is a classic domain-modeling exercise: complex rules interact with each other, validations depend on global state, and the logic needs to remain explicit. The project applies DDD principles to keep those rules readable and testable.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>A simple layered architecture: domain (pieces, board and rules), application (game control and turns) and console UI. The domain layer is completely independent from presentation.\u003c/p>", "body_html_en": "\u003cp>Implementation of a complete chess game in C#, with a domain model that treats each piece as an entity with its own movement rules.\u003c/p>\n\u003ch2>Domain modeling\u003c/h2>\n\u003cp>The board is represented as an 8x8 matrix where each square may contain a piece. Each piece type (King, Queen, Rook, Bishop, Knight and Pawn) implements its own movement rules, including:\u003c/p>\n\u003cul>\u003cli>Valid moves considering the current board state\u003c/li> \u003cli>Check and checkmate detection\u003c/li> \u003cli>Special moves: castling, en passant and pawn promotion\u003c/li>\u003c/ul>\n\u003ch2>Design decisions\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Value Objects\u003c/strong> for board positions\u003c/li> \u003cli>\u003cstrong>Strategy pattern\u003c/strong> for movement rules by piece type\u003c/li> \u003cli>\u003cstrong>Immutable game state\u003c/strong> to simplify undo/redo\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Chess is a classic domain-modeling exercise: complex rules interact with each other, validations depend on global state, and the logic needs to remain explicit. The project applies DDD principles to keep those rules readable and testable.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>A simple layered architecture: domain (pieces, board and rules), application (game control and turns) and console UI. The domain layer is completely independent from presentation.\u003c/p>", "body_html_ja_jp": "\u003cp>C# による完全なチェス実装で、各駒を固有の移動ルールを持つエンティティとして扱うドメインモデルを採用しています。\u003c/p>\n\u003ch2>ドメインモデリング\u003c/h2>\n\u003cp>盤面は 8x8 の行列で表現され、各マスに駒が置かれます。各駒種（キング、クイーン、ルーク、ビショップ、ナイト、ポーン）は、それぞれの移動ルールを実装しています。対象には以下が含まれます。\u003c/p>\n\u003cul>\u003cli>現在の盤面状態を考慮した合法手\u003c/li> \u003cli>チェックとチェックメイトの判定\u003c/li> \u003cli>特殊手: キャスリング、アンパッサン、ポーン昇格\u003c/li>\u003c/ul>\n\u003ch2>設計上の判断\u003c/h2>\n\u003cul>\u003cli>盤面座標を表す \u003cstrong>Value Object\u003c/strong>\u003c/li> \u003cli>駒種ごとの移動ルールを切り出す \u003cstrong>Strategy pattern\u003c/strong>\u003c/li> \u003cli>undo / redo を簡単にする \u003cstrong>不変なゲーム状態\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>チェスは古典的なドメインモデリングの題材です。複雑なルールが相互作用し、検証はグローバル状態に依存し、ロジックは明快に表現される必要があります。このプロジェクトでは DDD の原則を用いて、ルールを読みやすくテスト可能に保っています。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>アーキテクチャは単純なレイヤ構造です。ドメイン（駒、盤面、ルール）、アプリケーション（対局進行とターン制御）、コンソール UI に分かれ、ドメイン層は表示層から完全に独立しています。\u003c/p>", "body_html_ja": "\u003cp>C# による完全なチェス実装で、各駒を固有の移動ルールを持つエンティティとして扱うドメインモデルを採用しています。\u003c/p>\n\u003ch2>ドメインモデリング\u003c/h2>\n\u003cp>盤面は 8x8 の行列で表現され、各マスに駒が置かれます。各駒種（キング、クイーン、ルーク、ビショップ、ナイト、ポーン）は、それぞれの移動ルールを実装しています。対象には以下が含まれます。\u003c/p>\n\u003cul>\u003cli>現在の盤面状態を考慮した合法手\u003c/li> \u003cli>チェックとチェックメイトの判定\u003c/li> \u003cli>特殊手: キャスリング、アンパッサン、ポーン昇格\u003c/li>\u003c/ul>\n\u003ch2>設計上の判断\u003c/h2>\n\u003cul>\u003cli>盤面座標を表す \u003cstrong>Value Object\u003c/strong>\u003c/li> \u003cli>駒種ごとの移動ルールを切り出す \u003cstrong>Strategy pattern\u003c/strong>\u003c/li> \u003cli>undo / redo を簡単にする \u003cstrong>不変なゲーム状態\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>チェスは古典的なドメインモデリングの題材です。複雑なルールが相互作用し、検証はグローバル状態に依存し、ロジックは明快に表現される必要があります。このプロジェクトでは DDD の原則を用いて、ルールを読みやすくテスト可能に保っています。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>アーキテクチャは単純なレイヤ構造です。ドメイン（駒、盤面、ルール）、アプリケーション（対局進行とターン制御）、コンソール UI に分かれ、ドメイン層は表示層から完全に独立しています。\u003c/p>"}, {"id": "project-claw-code", "kind": "project", "status": "research", "stack": ["Rust", "CLI", "AI Agents"], "url": "/projects/claw-code/", "resolved_url": "https://nhmatsumoto.github.io/projects/claw-code/", "repo_url": "https://github.com/nhmatsumoto/claw-code", "has_math": false, "name": "claw-code", "headline": "Better Harness Tools — ferramentas para análise e experimentação com Claude Code, em reescrita para Rust.", "summary": "Ferramentas de análise e experimentação com arquiteturas de agentes de código, com reescrita em andamento para Rust visando performance e portabilidade.", "body_html": "\u003cp>Fork do projeto Claw Code, focado em criar ferramentas úteis para análise e experimentação com a arquitetura de agentes de código como Claude Code.\u003c/p>\n\u003ch2>Motivação\u003c/h2>\n\u003cp>Entender como agentes de código funcionam internamente — seus system prompts, tool loops, decisão de contexto — é fundamental para quem trabalha com automação de engenharia. Este projeto vai além do arquivo: transforma referência em ferramenta.\u003c/p>\n\u003ch2>Reescrita em Rust\u003c/h2>\n\u003cp>A versão atual está sendo reescrita em Rust para:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Performance\u003c/strong> — parsing e análise de prompts grandes sem overhead de runtime\u003c/li> \u003cli>\u003cstrong>Portabilidade\u003c/strong> — binário único sem dependências\u003c/li> \u003cli>\u003cstrong>CLI ergonômico\u003c/strong> — interface de terminal com output formatado\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Complementa o repositório \u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong> como referência de engenharia de prompts e arquitetura de agentes.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Agentes de código são caixas-pretas poderosas, mas entender sua arquitetura interna permite usá-los de forma mais eficiente. Este projeto constrói ferramentas para inspecionar, comparar e experimentar com essas arquiteturas.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>CLI em Rust com subcomandos para parsing de prompts, comparação entre versões e análise de tool definitions. Estruturado como workspace Cargo com crates separados para parsing, rendering e CLI.\u003c/p>", "headline_en_us": "Better Harness Tools — tools for analyzing and experimenting with Claude Code, being rewritten in Rust.", "headline_ja_jp": "Better Harness Tools — Claude Code の分析と実験のためのツール群。Rust への書き直しが進行中。", "summary_en_us": "Analysis and experimentation tooling for code-agent architectures, currently being rewritten in Rust for performance and portability.", "summary_ja_jp": "コード系エージェントのアーキテクチャを分析・実験するツール群。パフォーマンスと移植性を狙って Rust への書き直し中。", "body_html_en_us": "\u003cp>Fork of the Claw Code project, focused on building useful tooling for analyzing and experimenting with code-agent architectures such as Claude Code.\u003c/p>\n\u003ch2>Motivation\u003c/h2>\n\u003cp>Understanding how coding agents work internally — system prompts, tool loops, context decisions — is essential for anyone automating engineering workflows. This project turns a reference implementation into practical tooling.\u003c/p>\n\u003ch2>Rust rewrite\u003c/h2>\n\u003cp>The current version is being rewritten in Rust to improve:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Performance\u003c/strong> — parsing and analyzing large prompts without runtime overhead\u003c/li> \u003cli>\u003cstrong>Portability\u003c/strong> — a single binary with no external dependencies\u003c/li> \u003cli>\u003cstrong>CLI ergonomics\u003c/strong> — a polished terminal interface with structured output\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>It complements \u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong> as a practical companion for prompt engineering and agent-architecture analysis.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Coding agents are powerful black boxes, but understanding their internal architecture is what makes them usable with intent. This project builds tools to inspect, compare and experiment with those architectures.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Rust CLI with subcommands for prompt parsing, version comparison and tool-definition analysis. Structured as a Cargo workspace with separate crates for parsing, rendering and the CLI surface.\u003c/p>", "body_html_en": "\u003cp>Fork of the Claw Code project, focused on building useful tooling for analyzing and experimenting with code-agent architectures such as Claude Code.\u003c/p>\n\u003ch2>Motivation\u003c/h2>\n\u003cp>Understanding how coding agents work internally — system prompts, tool loops, context decisions — is essential for anyone automating engineering workflows. This project turns a reference implementation into practical tooling.\u003c/p>\n\u003ch2>Rust rewrite\u003c/h2>\n\u003cp>The current version is being rewritten in Rust to improve:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Performance\u003c/strong> — parsing and analyzing large prompts without runtime overhead\u003c/li> \u003cli>\u003cstrong>Portability\u003c/strong> — a single binary with no external dependencies\u003c/li> \u003cli>\u003cstrong>CLI ergonomics\u003c/strong> — a polished terminal interface with structured output\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>It complements \u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong> as a practical companion for prompt engineering and agent-architecture analysis.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Coding agents are powerful black boxes, but understanding their internal architecture is what makes them usable with intent. This project builds tools to inspect, compare and experiment with those architectures.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Rust CLI with subcommands for prompt parsing, version comparison and tool-definition analysis. Structured as a Cargo workspace with separate crates for parsing, rendering and the CLI surface.\u003c/p>", "body_html_ja_jp": "\u003cp>Claude Code のようなコードエージェントのアーキテクチャを分析・実験するための実用ツールを作ることに焦点を当てた、Claw Code プロジェクトのフォークです。\u003c/p>\n\u003ch2>動機\u003c/h2>\n\u003cp>コードエージェントの内部動作、つまり system prompt、tool loop、コンテキスト判断を理解することは、開発フローを自動化するうえで重要です。このプロジェクトは、参照実装を実用ツールへと変換します。\u003c/p>\n\u003ch2>Rust への書き直し\u003c/h2>\n\u003cp>現在のバージョンは、次を改善するため Rust へ書き直し中です。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>性能\u003c/strong> — 大きな prompt をランタイム・オーバーヘッドなしに解析\u003c/li> \u003cli>\u003cstrong>可搬性\u003c/strong> — 依存の少ない単一バイナリ\u003c/li> \u003cli>\u003cstrong>CLI 体験\u003c/strong> — 整形済み出力を持つ使いやすい端末インターフェース\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>\u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong> を、より実践的なプロンプト工学・エージェント分析ツールとして補完します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>コードエージェントは強力なブラックボックスですが、意図を持って使うには内部アーキテクチャの理解が欠かせません。このプロジェクトは、その構造を観察し、比較し、実験するためのツールを作ります。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>prompt 解析、バージョン比較、tool definition 分析のためのサブコマンドを備えた Rust CLI です。Cargo workspace として構成され、parsing、rendering、CLI の各責務を別 crate に分離しています。\u003c/p>", "body_html_ja": "\u003cp>Claude Code のようなコードエージェントのアーキテクチャを分析・実験するための実用ツールを作ることに焦点を当てた、Claw Code プロジェクトのフォークです。\u003c/p>\n\u003ch2>動機\u003c/h2>\n\u003cp>コードエージェントの内部動作、つまり system prompt、tool loop、コンテキスト判断を理解することは、開発フローを自動化するうえで重要です。このプロジェクトは、参照実装を実用ツールへと変換します。\u003c/p>\n\u003ch2>Rust への書き直し\u003c/h2>\n\u003cp>現在のバージョンは、次を改善するため Rust へ書き直し中です。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>性能\u003c/strong> — 大きな prompt をランタイム・オーバーヘッドなしに解析\u003c/li> \u003cli>\u003cstrong>可搬性\u003c/strong> — 依存の少ない単一バイナリ\u003c/li> \u003cli>\u003cstrong>CLI 体験\u003c/strong> — 整形済み出力を持つ使いやすい端末インターフェース\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>\u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong> を、より実践的なプロンプト工学・エージェント分析ツールとして補完します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>コードエージェントは強力なブラックボックスですが、意図を持って使うには内部アーキテクチャの理解が欠かせません。このプロジェクトは、その構造を観察し、比較し、実験するためのツールを作ります。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>prompt 解析、バージョン比較、tool definition 分析のためのサブコマンドを備えた Rust CLI です。Cargo workspace として構成され、parsing、rendering、CLI の各責務を別 crate に分離しています。\u003c/p>"}, {"id": "project-deepseek-v3", "kind": "project", "status": "research", "stack": ["Python", "PyTorch", "Transformers", "MoE"], "url": "/projects/deepseek-v3/", "resolved_url": "https://nhmatsumoto.github.io/projects/deepseek-v3/", "repo_url": "https://github.com/nhmatsumoto/DeepSeek-V3", "has_math": false, "name": "DeepSeek-V3", "headline": "Referência de implementação do modelo DeepSeek-V3 — arquitetura Mixture-of-Experts para LLMs de larga escala.", "summary": "Fork do DeepSeek-V3, modelo de linguagem com arquitetura Mixture-of-Experts (MoE) e Multi-head Latent Attention para inferência eficiente em larga escala.", "body_html": "\u003cp>Fork do repositório oficial do DeepSeek-V3, um Large Language Model com 671B de parâmetros totais que utiliza Mixture-of-Experts (MoE) para ativar apenas 37B por token durante inferência.\u003c/p>\n\u003ch2>Arquitetura MoE\u003c/h2>\n\u003cp>Mixture-of-Experts é uma abordagem que permite escalar modelos sem aumentar proporcionalmente o custo computacional:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Router\u003c/strong> — decide quais especialistas ativar para cada token\u003c/li> \u003cli>\u003cstrong>Expert layers\u003c/strong> — módulos Feed-Forward especializados (apenas uma fração é ativada por vez)\u003c/li> \u003cli>\u003cstrong>Multi-head Latent Attention (MLA)\u003c/strong> — comprime as key-value caches para reduzir uso de memória durante inferência\u003c/li>\u003c/ul>\n\u003ch2>Relevância para estudo\u003c/h2>\n\u003cp>O DeepSeek-V3 é uma referência importante para entender:\u003c/p>\n\u003cul>\u003cli>Trade-offs entre tamanho total do modelo e custo de inferência\u003c/li> \u003cli>Estratégias de treinamento com FP8 mixed-precision\u003c/li> \u003cli>Balanceamento de carga entre experts sem auxiliary losses\u003c/li> \u003cli>Pipeline parallelism para treinamento distribuído\u003c/li>\u003c/ul>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Treinar e servir modelos com centenas de bilhões de parâmetros é proibitivamente caro com arquiteturas densas. MoE resolve isso ativando seletivamente subconjuntos do modelo, mantendo qualidade com custo computacional uma ordem de grandeza menor.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Transformer com DeepSeekMoE layers: cada camada tem um router que seleciona top-K experts de um pool maior. A inovação do V3 está na eliminação de auxiliary balancing losses, substituindo-as por um mecanismo de bias dinâmico no router.\u003c/p>", "headline_en_us": "Reference implementation of the DeepSeek-V3 model — a Mixture-of-Experts architecture for large-scale LLMs.", "headline_ja_jp": "DeepSeek-V3 モデルのリファレンス実装 — 大規模 LLM のための Mixture-of-Experts アーキテクチャ。", "summary_en_us": "Fork of DeepSeek-V3, a language model with Mixture-of-Experts (MoE) and Multi-head Latent Attention for efficient large-scale inference.", "summary_ja_jp": "DeepSeek-V3 のフォーク。Mixture-of-Experts（MoE）と Multi-head Latent Attention を備え、大規模推論を効率化する言語モデル。", "body_html_en_us": "\u003cp>Fork of the official DeepSeek-V3 repository, a large language model with 671B total parameters that activates only 37B per token during inference through a Mixture-of-Experts (MoE) architecture.\u003c/p>\n\u003ch2>MoE architecture\u003c/h2>\n\u003cp>Mixture-of-Experts makes it possible to scale models without increasing compute cost proportionally:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Router\u003c/strong> — decides which experts to activate for each token\u003c/li> \u003cli>\u003cstrong>Expert layers\u003c/strong> — specialized feed-forward modules, of which only a fraction is active at once\u003c/li> \u003cli>\u003cstrong>Multi-head Latent Attention (MLA)\u003c/strong> — compresses key-value caches to reduce memory usage during inference\u003c/li>\u003c/ul>\n\u003ch2>Why it matters for study\u003c/h2>\n\u003cp>DeepSeek-V3 is a useful reference for understanding:\u003c/p>\n\u003cul>\u003cli>Trade-offs between total parameter count and inference cost\u003c/li> \u003cli>FP8 mixed-precision training strategies\u003c/li> \u003cli>Expert-load balancing without auxiliary losses\u003c/li> \u003cli>Distributed training through pipeline parallelism\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Training and serving models with hundreds of billions of parameters is prohibitively expensive with dense architectures. MoE addresses that by activating only selective subsets of the model, preserving quality at roughly an order of magnitude lower compute cost.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>A transformer with DeepSeekMoE layers. Each layer has a router that selects top-K experts from a larger pool. V3&#x27;s key innovation is removing auxiliary balancing losses and replacing them with a dynamic router-bias mechanism.\u003c/p>", "body_html_en": "\u003cp>Fork of the official DeepSeek-V3 repository, a large language model with 671B total parameters that activates only 37B per token during inference through a Mixture-of-Experts (MoE) architecture.\u003c/p>\n\u003ch2>MoE architecture\u003c/h2>\n\u003cp>Mixture-of-Experts makes it possible to scale models without increasing compute cost proportionally:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Router\u003c/strong> — decides which experts to activate for each token\u003c/li> \u003cli>\u003cstrong>Expert layers\u003c/strong> — specialized feed-forward modules, of which only a fraction is active at once\u003c/li> \u003cli>\u003cstrong>Multi-head Latent Attention (MLA)\u003c/strong> — compresses key-value caches to reduce memory usage during inference\u003c/li>\u003c/ul>\n\u003ch2>Why it matters for study\u003c/h2>\n\u003cp>DeepSeek-V3 is a useful reference for understanding:\u003c/p>\n\u003cul>\u003cli>Trade-offs between total parameter count and inference cost\u003c/li> \u003cli>FP8 mixed-precision training strategies\u003c/li> \u003cli>Expert-load balancing without auxiliary losses\u003c/li> \u003cli>Distributed training through pipeline parallelism\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Training and serving models with hundreds of billions of parameters is prohibitively expensive with dense architectures. MoE addresses that by activating only selective subsets of the model, preserving quality at roughly an order of magnitude lower compute cost.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>A transformer with DeepSeekMoE layers. Each layer has a router that selects top-K experts from a larger pool. V3&#x27;s key innovation is removing auxiliary balancing losses and replacing them with a dynamic router-bias mechanism.\u003c/p>", "body_html_ja_jp": "\u003cp>公式 DeepSeek-V3 リポジトリのフォークです。総パラメータ 671B の大規模言語モデルで、Mixture-of-Experts (MoE) により推論時にはトークンごとに 37B だけを活性化します。\u003c/p>\n\u003ch2>MoE アーキテクチャ\u003c/h2>\n\u003cp>Mixture-of-Experts は、計算コストを比例的に増やさずにモデルをスケールさせる仕組みです。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Router\u003c/strong> — 各トークンでどの expert を有効化するか決める\u003c/li> \u003cli>\u003cstrong>Expert layers\u003c/strong> — 特化した feed-forward モジュール群で、一度に使うのは一部だけ\u003c/li> \u003cli>\u003cstrong>Multi-head Latent Attention (MLA)\u003c/strong> — key-value cache を圧縮し、推論時のメモリ使用量を減らす\u003c/li>\u003c/ul>\n\u003ch2>学習対象としての価値\u003c/h2>\n\u003cp>DeepSeek-V3 は、次を理解するうえで有用な参照実装です。\u003c/p>\n\u003cul>\u003cli>総モデルサイズと推論コストのトレードオフ\u003c/li> \u003cli>FP8 mixed-precision による学習戦略\u003c/li> \u003cli>auxiliary loss を使わない expert 負荷分散\u003c/li> \u003cli>pipeline parallelism による分散学習\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>数百億から数千億規模のパラメータを持つモデルを、dense な構造のまま学習・提供するのは極めて高コストです。MoE は必要な部分だけを選択的に活性化することで、品質を保ちながら計算コストを大幅に抑えます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>DeepSeekMoE layer を備えた transformer 構成です。各 layer には、より大きな expert pool から top-K expert を選択する router があります。V3 の主な革新は、auxiliary balancing loss を廃し、動的な router bias メカニズムに置き換えた点です。\u003c/p>", "body_html_ja": "\u003cp>公式 DeepSeek-V3 リポジトリのフォークです。総パラメータ 671B の大規模言語モデルで、Mixture-of-Experts (MoE) により推論時にはトークンごとに 37B だけを活性化します。\u003c/p>\n\u003ch2>MoE アーキテクチャ\u003c/h2>\n\u003cp>Mixture-of-Experts は、計算コストを比例的に増やさずにモデルをスケールさせる仕組みです。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Router\u003c/strong> — 各トークンでどの expert を有効化するか決める\u003c/li> \u003cli>\u003cstrong>Expert layers\u003c/strong> — 特化した feed-forward モジュール群で、一度に使うのは一部だけ\u003c/li> \u003cli>\u003cstrong>Multi-head Latent Attention (MLA)\u003c/strong> — key-value cache を圧縮し、推論時のメモリ使用量を減らす\u003c/li>\u003c/ul>\n\u003ch2>学習対象としての価値\u003c/h2>\n\u003cp>DeepSeek-V3 は、次を理解するうえで有用な参照実装です。\u003c/p>\n\u003cul>\u003cli>総モデルサイズと推論コストのトレードオフ\u003c/li> \u003cli>FP8 mixed-precision による学習戦略\u003c/li> \u003cli>auxiliary loss を使わない expert 負荷分散\u003c/li> \u003cli>pipeline parallelism による分散学習\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>数百億から数千億規模のパラメータを持つモデルを、dense な構造のまま学習・提供するのは極めて高コストです。MoE は必要な部分だけを選択的に活性化することで、品質を保ちながら計算コストを大幅に抑えます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>DeepSeekMoE layer を備えた transformer 構成です。各 layer には、より大きな expert pool から top-K expert を選択する router があります。V3 の主な革新は、auxiliary balancing loss を廃し、動的な router bias メカニズムに置き換えた点です。\u003c/p>"}, {"id": "project-financial", "kind": "project", "status": "research", "stack": ["C#", ".NET", "Entity Framework", "SQL Server"], "url": "/projects/financial/", "resolved_url": "https://nhmatsumoto.github.io/projects/financial/", "repo_url": "https://github.com/nhmatsumoto/Financial", "has_math": false, "name": "Financial", "headline": "Monolito para gestão financeira pessoal em C#/.NET.", "summary": "Aplicação monolítica de gestão financeira pessoal desenvolvida em C#/.NET, com foco em controle de despesas, categorização e relatórios.", "body_html": "\u003cp>Aplicação monolítica de gestão financeira pessoal, desenvolvida como exercício de arquitetura em .NET com Entity Framework e SQL Server.\u003c/p>\n\u003ch2>Funcionalidades\u003c/h2>\n\u003cul>\u003cli>Cadastro e categorização de receitas e despesas\u003c/li> \u003cli>Relatórios por período e categoria\u003c/li> \u003cli>Controle de saldos e projeções simples\u003c/li>\u003c/ul>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Este projeto é o predecessor direto do \u003cstrong>SplitCosts\u003c/strong> — a evolução natural de um monolito financeiro pessoal para uma aplicação multi-tenant de compartilhamento de despesas. Muitas das decisões de domínio do SplitCosts foram refinadas a partir das limitações encontradas aqui.\u003c/p>\n\u003ch2>Lições aprendidas\u003c/h2>\n\u003cp>O formato monolítico funcionou para o escopo inicial, mas revelou limitações quando o domínio cresceu: acoplamento entre regras de negócio e infraestrutura, dificuldade de testar cenários complexos e falta de separação entre contextos de leitura e escrita.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Gestão financeira pessoal precisa ser simples o suficiente para uso diário, mas estruturada o suficiente para gerar relatórios úteis. O desafio foi equilibrar praticidade com modelagem correta do domínio financeiro.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Monolito em camadas: Controllers → Services → Repository → Entity Framework → SQL Server. A simplicidade da arquitetura é adequada ao escopo, mas o acoplamento entre camadas motivou a adoção de uma abordagem mais modular no SplitCosts.\u003c/p>", "headline_en_us": "Personal finance management monolith in C#/.NET.", "headline_ja_jp": "C#/.NET による個人家計管理モノリス。", "summary_en_us": "Monolithic personal finance application developed in C#/.NET, focused on expense control, categorization and reporting.", "summary_ja_jp": "C#/.NET で開発されたモノリシックな個人家計アプリ。支出管理、分類、レポーティングに注力。", "body_html_en_us": "\u003cp>Monolithic personal-finance application, developed as an architecture exercise in .NET with Entity Framework and SQL Server.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>Registration and categorization of income and expenses\u003c/li> \u003cli>Reports by period and category\u003c/li> \u003cli>Balance tracking and simple projections\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This project is the direct predecessor of \u003cstrong>SplitCosts\u003c/strong> — the natural evolution from a personal-finance monolith to a multi-tenant expense-sharing system. Several domain decisions later used in SplitCosts were refined from the limitations identified here.\u003c/p>\n\u003ch2>Lessons learned\u003c/h2>\n\u003cp>The monolithic format worked for the initial scope, but its limits became obvious as the domain grew: business rules coupled to infrastructure, difficulty testing complex scenarios and no clear separation between read and write concerns.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Personal finance needs to stay simple enough for daily use while remaining structured enough to generate useful reports. The core challenge was balancing practicality with a correct domain model.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Layered monolith: Controllers → Services → Repository → Entity Framework → SQL Server. The architecture fits the scope, but coupling between layers later motivated a more modular approach in SplitCosts.\u003c/p>", "body_html_en": "\u003cp>Monolithic personal-finance application, developed as an architecture exercise in .NET with Entity Framework and SQL Server.\u003c/p>\n\u003ch2>Features\u003c/h2>\n\u003cul>\u003cli>Registration and categorization of income and expenses\u003c/li> \u003cli>Reports by period and category\u003c/li> \u003cli>Balance tracking and simple projections\u003c/li>\u003c/ul>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This project is the direct predecessor of \u003cstrong>SplitCosts\u003c/strong> — the natural evolution from a personal-finance monolith to a multi-tenant expense-sharing system. Several domain decisions later used in SplitCosts were refined from the limitations identified here.\u003c/p>\n\u003ch2>Lessons learned\u003c/h2>\n\u003cp>The monolithic format worked for the initial scope, but its limits became obvious as the domain grew: business rules coupled to infrastructure, difficulty testing complex scenarios and no clear separation between read and write concerns.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Personal finance needs to stay simple enough for daily use while remaining structured enough to generate useful reports. The core challenge was balancing practicality with a correct domain model.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Layered monolith: Controllers → Services → Repository → Entity Framework → SQL Server. The architecture fits the scope, but coupling between layers later motivated a more modular approach in SplitCosts.\u003c/p>", "body_html_ja_jp": "\u003cp>Entity Framework と SQL Server を用いた .NET アーキテクチャ演習として開発した、個人家計向けモノリシック・アプリケーションです。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>収入と支出の登録・カテゴリ分類\u003c/li> \u003cli>期間別・カテゴリ別レポート\u003c/li> \u003cli>残高管理と簡易予測\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>このプロジェクトは \u003cstrong>SplitCosts\u003c/strong> の直接の前身です。個人家計モノリスから、マルチテナントの支出共有アプリへと進化する出発点でした。SplitCosts で洗練されたドメイン上の判断の多くは、ここで見つかった限界から生まれています。\u003c/p>\n\u003ch2>学び\u003c/h2>\n\u003cp>モノリス構成は初期スコープには十分でしたが、ドメインが広がると限界が明確になりました。ビジネスルールとインフラの結合、複雑シナリオのテスト困難、読み書き責務の未分離です。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>個人家計管理は、日常利用できるだけの単純さと、有用なレポートを生むだけの構造化の両立が必要です。このプロジェクトの課題は、実用性と正しい金融ドメイン・モデリングのバランスでした。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>レイヤード・モノリス構成です。Controllers → Services → Repository → Entity Framework → SQL Server。スコープには適していますが、レイヤ間の結合が強く、後に SplitCosts でよりモジュール化された設計へ進む動機になりました。\u003c/p>", "body_html_ja": "\u003cp>Entity Framework と SQL Server を用いた .NET アーキテクチャ演習として開発した、個人家計向けモノリシック・アプリケーションです。\u003c/p>\n\u003ch2>機能\u003c/h2>\n\u003cul>\u003cli>収入と支出の登録・カテゴリ分類\u003c/li> \u003cli>期間別・カテゴリ別レポート\u003c/li> \u003cli>残高管理と簡易予測\u003c/li>\u003c/ul>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>このプロジェクトは \u003cstrong>SplitCosts\u003c/strong> の直接の前身です。個人家計モノリスから、マルチテナントの支出共有アプリへと進化する出発点でした。SplitCosts で洗練されたドメイン上の判断の多くは、ここで見つかった限界から生まれています。\u003c/p>\n\u003ch2>学び\u003c/h2>\n\u003cp>モノリス構成は初期スコープには十分でしたが、ドメインが広がると限界が明確になりました。ビジネスルールとインフラの結合、複雑シナリオのテスト困難、読み書き責務の未分離です。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>個人家計管理は、日常利用できるだけの単純さと、有用なレポートを生むだけの構造化の両立が必要です。このプロジェクトの課題は、実用性と正しい金融ドメイン・モデリングのバランスでした。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>レイヤード・モノリス構成です。Controllers → Services → Repository → Entity Framework → SQL Server。スコープには適していますが、レイヤ間の結合が強く、後に SplitCosts でよりモジュール化された設計へ進む動機になりました。\u003c/p>"}, {"id": "project-gaussian-splatting", "kind": "project", "status": "research", "stack": ["Python", "CUDA", "PyTorch", "Computer Vision"], "url": "/projects/gaussian-splatting/", "resolved_url": "https://nhmatsumoto.github.io/projects/gaussian-splatting/", "repo_url": "https://github.com/nhmatsumoto/gaussian-splatting", "has_math": false, "name": "gaussian-splatting", "headline": "Implementação de referência de 3D Gaussian Splatting para renderização de campos de radiância em tempo real.", "summary": "Fork da implementação original de 3D Gaussian Splatting — técnica de renderização neural que representa cenas 3D como conjuntos de gaussianas para rendering em tempo real.", "body_html": "\u003cp>Fork da implementação de referência do paper &quot;3D Gaussian Splatting for Real-Time Radiance Field Rendering&quot; (SIGGRAPH 2023).\u003c/p>\n\u003ch2>O que é Gaussian Splatting\u003c/h2>\n\u003cp>Diferente de NeRFs (Neural Radiance Fields) que usam redes neurais para representar cenas, Gaussian Splatting representa a cena como milhões de gaussianas 3D semi-transparentes. Cada gaussiana tem:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Posição\u003c/strong> (xyz) no espaço 3D\u003c/li> \u003cli>\u003cstrong>Covariância\u003c/strong> (3x3) que define forma e orientação\u003c/li> \u003cli>\u003cstrong>Opacidade\u003c/strong> (alpha)\u003c/li> \u003cli>\u003cstrong>Cor\u003c/strong> representada em spherical harmonics\u003c/li>\u003c/ul>\n\u003ch2>Vantagens sobre NeRFs\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Renderização em tempo real\u003c/strong> (&gt;100 FPS) vs. segundos por frame em NeRFs\u003c/li> \u003cli>\u003cstrong>Rasterização diferenciável\u003c/strong> permite otimização por gradiente\u003c/li> \u003cli>\u003cstrong>Sem rede neural\u003c/strong> na etapa de inferência — apenas projeção e alpha compositing\u003c/li> \u003cli>\u003cstrong>Qualidade visual\u003c/strong> comparável ou superior a NeRFs estado-da-arte\u003c/li>\u003c/ul>\n\u003ch2>Relevância\u003c/h2>\n\u003cp>O estudo de técnicas de renderização neural é relevante para aplicações de visualização 3D, realidade aumentada e reconstrução de cenas a partir de fotografias.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>NeRFs produzem resultados visuais impressionantes mas são lentos demais para aplicações em tempo real. Gaussian Splatting resolve isso substituindo a rede neural por primitivas geométricas explícitas que podem ser rasterizadas eficientemente em GPU.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Pipeline de treinamento: inicialização via Structure-from-Motion (COLMAP) → otimização iterativa das gaussianas via gradiente → adaptive density control (split/clone/prune). Renderização via tile-based rasterizer customizado em CUDA.\u003c/p>", "headline_en_us": "Reference implementation of 3D Gaussian Splatting for real-time radiance field rendering.", "headline_ja_jp": "リアルタイム放射輝度場レンダリングのための 3D Gaussian Splatting リファレンス実装。", "summary_en_us": "Fork of the original 3D Gaussian Splatting implementation — a neural rendering technique that represents 3D scenes as sets of Gaussians for real-time rendering.", "summary_ja_jp": "3D Gaussian Splatting オリジナル実装のフォーク。3D シーンをガウス分布の集合で表現し、リアルタイムレンダリングを行うニューラル描画技法。", "body_html_en_us": "\u003cp>Fork of the reference implementation for the paper &quot;3D Gaussian Splatting for Real-Time Radiance Field Rendering&quot; (SIGGRAPH 2023).\u003c/p>\n\u003ch2>What Gaussian Splatting is\u003c/h2>\n\u003cp>Unlike NeRFs (Neural Radiance Fields), which rely on neural networks to represent scenes, Gaussian Splatting models a scene as millions of semi-transparent 3D Gaussians. Each Gaussian carries:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Position\u003c/strong> (xyz) in 3D space\u003c/li> \u003cli>\u003cstrong>Covariance\u003c/strong> (3x3) defining shape and orientation\u003c/li> \u003cli>\u003cstrong>Opacity\u003c/strong> (alpha)\u003c/li> \u003cli>\u003cstrong>Color\u003c/strong> represented with spherical harmonics\u003c/li>\u003c/ul>\n\u003ch2>Advantages over NeRFs\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Real-time rendering\u003c/strong> (&gt;100 FPS) instead of seconds per frame\u003c/li> \u003cli>\u003cstrong>Differentiable rasterization\u003c/strong> for gradient-based optimization\u003c/li> \u003cli>\u003cstrong>No neural network in the inference stage\u003c/strong> — only projection and alpha compositing\u003c/li> \u003cli>\u003cstrong>Visual quality\u003c/strong> comparable to or better than state-of-the-art NeRFs\u003c/li>\u003c/ul>\n\u003ch2>Relevance\u003c/h2>\n\u003cp>Neural-rendering techniques matter for 3D visualization, augmented reality and scene reconstruction from photographs.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>NeRFs can produce impressive results, but they are too slow for real-time applications. Gaussian Splatting addresses that by replacing implicit neural representation with explicit geometric primitives that can be rasterized efficiently on the GPU.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Training pipeline: initialize via Structure-from-Motion (COLMAP) → iteratively optimize Gaussians through gradients → apply adaptive density control (split / clone / prune). Rendering is done through a custom tile-based CUDA rasterizer.\u003c/p>", "body_html_en": "\u003cp>Fork of the reference implementation for the paper &quot;3D Gaussian Splatting for Real-Time Radiance Field Rendering&quot; (SIGGRAPH 2023).\u003c/p>\n\u003ch2>What Gaussian Splatting is\u003c/h2>\n\u003cp>Unlike NeRFs (Neural Radiance Fields), which rely on neural networks to represent scenes, Gaussian Splatting models a scene as millions of semi-transparent 3D Gaussians. Each Gaussian carries:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Position\u003c/strong> (xyz) in 3D space\u003c/li> \u003cli>\u003cstrong>Covariance\u003c/strong> (3x3) defining shape and orientation\u003c/li> \u003cli>\u003cstrong>Opacity\u003c/strong> (alpha)\u003c/li> \u003cli>\u003cstrong>Color\u003c/strong> represented with spherical harmonics\u003c/li>\u003c/ul>\n\u003ch2>Advantages over NeRFs\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Real-time rendering\u003c/strong> (&gt;100 FPS) instead of seconds per frame\u003c/li> \u003cli>\u003cstrong>Differentiable rasterization\u003c/strong> for gradient-based optimization\u003c/li> \u003cli>\u003cstrong>No neural network in the inference stage\u003c/strong> — only projection and alpha compositing\u003c/li> \u003cli>\u003cstrong>Visual quality\u003c/strong> comparable to or better than state-of-the-art NeRFs\u003c/li>\u003c/ul>\n\u003ch2>Relevance\u003c/h2>\n\u003cp>Neural-rendering techniques matter for 3D visualization, augmented reality and scene reconstruction from photographs.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>NeRFs can produce impressive results, but they are too slow for real-time applications. Gaussian Splatting addresses that by replacing implicit neural representation with explicit geometric primitives that can be rasterized efficiently on the GPU.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Training pipeline: initialize via Structure-from-Motion (COLMAP) → iteratively optimize Gaussians through gradients → apply adaptive density control (split / clone / prune). Rendering is done through a custom tile-based CUDA rasterizer.\u003c/p>", "body_html_ja_jp": "\u003cp>論文 &quot;3D Gaussian Splatting for Real-Time Radiance Field Rendering&quot;（SIGGRAPH 2023）の参照実装フォークです。\u003c/p>\n\u003ch2>Gaussian Splatting とは\u003c/h2>\n\u003cp>NeRF（Neural Radiance Fields）のようにニューラルネットでシーンを表現するのではなく、Gaussian Splatting はシーンを半透明な 3D Gaussian の大量集合として表現します。各 Gaussian は次を持ちます。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>位置\u003c/strong> (xyz)\u003c/li> \u003cli>\u003cstrong>共分散\u003c/strong> (3x3) による形状と向き\u003c/li> \u003cli>\u003cstrong>不透明度\u003c/strong> (alpha)\u003c/li> \u003cli>\u003cstrong>球面調和関数で表された色\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch2>NeRF に対する利点\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>リアルタイム描画\u003c/strong>（&gt;100 FPS）で、NeRF のように 1 フレーム数秒かからない\u003c/li> \u003cli>\u003cstrong>微分可能ラスタライズ\u003c/strong> により勾配最適化が可能\u003c/li> \u003cli>\u003cstrong>推論段階でニューラルネット不要\u003c/strong> — 射影と alpha compositing のみ\u003c/li> \u003cli>\u003cstrong>視覚品質\u003c/strong> は最先端 NeRF と同等以上\u003c/li>\u003c/ul>\n\u003ch2>関連性\u003c/h2>\n\u003cp>こうしたニューラル描画技術は、3D 可視化、拡張現実、写真からのシーン再構成に重要です。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>NeRF は非常に高品質ですが、リアルタイム用途には遅すぎます。Gaussian Splatting は、暗黙的なニューラル表現を GPU で効率よくラスタライズできる明示的な幾何プリミティブに置き換えることで、この問題を解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>学習パイプラインは、Structure-from-Motion（COLMAP）による初期化 → 勾配による Gaussian 最適化 → adaptive density control（split / clone / prune）という流れです。描画はカスタムの tile-based CUDA rasterizer で行います。\u003c/p>", "body_html_ja": "\u003cp>論文 &quot;3D Gaussian Splatting for Real-Time Radiance Field Rendering&quot;（SIGGRAPH 2023）の参照実装フォークです。\u003c/p>\n\u003ch2>Gaussian Splatting とは\u003c/h2>\n\u003cp>NeRF（Neural Radiance Fields）のようにニューラルネットでシーンを表現するのではなく、Gaussian Splatting はシーンを半透明な 3D Gaussian の大量集合として表現します。各 Gaussian は次を持ちます。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>位置\u003c/strong> (xyz)\u003c/li> \u003cli>\u003cstrong>共分散\u003c/strong> (3x3) による形状と向き\u003c/li> \u003cli>\u003cstrong>不透明度\u003c/strong> (alpha)\u003c/li> \u003cli>\u003cstrong>球面調和関数で表された色\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch2>NeRF に対する利点\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>リアルタイム描画\u003c/strong>（&gt;100 FPS）で、NeRF のように 1 フレーム数秒かからない\u003c/li> \u003cli>\u003cstrong>微分可能ラスタライズ\u003c/strong> により勾配最適化が可能\u003c/li> \u003cli>\u003cstrong>推論段階でニューラルネット不要\u003c/strong> — 射影と alpha compositing のみ\u003c/li> \u003cli>\u003cstrong>視覚品質\u003c/strong> は最先端 NeRF と同等以上\u003c/li>\u003c/ul>\n\u003ch2>関連性\u003c/h2>\n\u003cp>こうしたニューラル描画技術は、3D 可視化、拡張現実、写真からのシーン再構成に重要です。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>NeRF は非常に高品質ですが、リアルタイム用途には遅すぎます。Gaussian Splatting は、暗黙的なニューラル表現を GPU で効率よくラスタライズできる明示的な幾何プリミティブに置き換えることで、この問題を解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>学習パイプラインは、Structure-from-Motion（COLMAP）による初期化 → 勾配による Gaussian 最適化 → adaptive density control（split / clone / prune）という流れです。描画はカスタムの tile-based CUDA rasterizer で行います。\u003c/p>"}, {"id": "project-gemini-cli", "kind": "project", "status": "research", "stack": ["TypeScript", "Node.js", "Gemini API", "CLI"], "url": "/projects/gemini-cli/", "resolved_url": "https://nhmatsumoto.github.io/projects/gemini-cli/", "repo_url": "https://github.com/nhmatsumoto/gemini-cli", "has_math": false, "name": "gemini-cli", "headline": "Agente de IA open-source que traz o poder do Gemini direto para o terminal.", "summary": "Fork do Gemini CLI — agente de IA do Google que opera direto no terminal com acesso a ferramentas de sistema, edição de código e navegação no filesystem.", "body_html": "\u003cp>Fork do Gemini CLI, o agente de IA open-source do Google que integra o modelo Gemini diretamente ao terminal, com capacidade de executar ferramentas de sistema.\u003c/p>\n\u003ch2>Arquitetura de agente\u003c/h2>\n\u003cp>O Gemini CLI implementa um loop de agente clássico:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Input\u003c/strong> — recebe instrução do usuário via terminal\u003c/li> \u003cli>\u003cstrong>Reasoning\u003c/strong> — o modelo Gemini processa o contexto e decide a próxima ação\u003c/li> \u003cli>\u003cstrong>Tool execution\u003c/strong> — executa ferramentas (shell, file read/write, search)\u003c/li> \u003cli>\u003cstrong>Observation\u003c/strong> — resultado da ferramenta alimenta o próximo ciclo\u003c/li> \u003cli>\u003cstrong>Output\u003c/strong> — resposta final ao usuário\u003c/li>\u003c/ol>\n\u003ch2>Por que este fork\u003c/h2>\n\u003cp>Estudo comparativo de arquiteturas de agentes de código. Compara abordagens do Gemini CLI com Claude Code e outros agentes no repositório \u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong>.\u003c/p>\n\u003ch2>Pontos de interesse\u003c/h2>\n\u003cul>\u003cli>Gestão de contexto e memória entre turnos\u003c/li> \u003cli>Estratégia de tool selection e parameter extraction\u003c/li> \u003cli>Sandboxing e permissões de execução\u003c/li> \u003cli>Streaming de respostas longas\u003c/li>\u003c/ul>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Agentes de código no terminal precisam equilibrar autonomia com segurança: executar ferramentas de sistema é poderoso mas arriscado. A análise da implementação do Gemini CLI revela como o Google aborda esse trade-off.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>CLI em TypeScript/Node.js com loop de agente baseado em tool-use. Comunica-se com a Gemini API via streaming, mantém histórico de conversação e executa tools locais com confirmação do usuário para operações destrutivas.\u003c/p>\n\u003ch2>Impacto &amp; Resultados\u003c/h2>\n\u003cul>\u003cli>Estudo comparativo de arquiteturas de agentes: loop ReAct vs planner vs tree-of-thought em contexto real de CLI\u003c/li> \u003cli>Fork usado como base de referência para o design do Ronaldinho Agent (agente próprio em .NET)\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisões\u003c/h2>\n\u003cul>\u003cli>Fork vs build from scratch: fork acelerou aprendizado de patterns do Gemini, mas herdou decisões de design do Google\u003c/li> \u003cli>TypeScript/Node.js vs Go: ecossistema JS facilita prototipação, mas overhead de runtime é perceptível em operações de filesystem\u003c/li>\u003c/ul>\n\u003ch2>Lições Aprendidas\u003c/h2>\n\u003cul>\u003cli>O modelo de permissões do Gemini CLI (allow-list de tools) é mais seguro que o modelo opt-out de outros agentes\u003c/li> \u003cli>Loops de agente em CLI exigem timeout agressivo por step — sem isso, o agente pode travar em I/O indefinidamente\u003c/li>\u003c/ul>", "headline_en_us": "Open-source AI agent that brings Gemini's power directly to the terminal.", "headline_ja_jp": "Gemini の力を端末に直接もたらすオープンソース AI エージェント。", "summary_en_us": "Fork of Gemini CLI — Google's AI agent that runs directly in the terminal with access to system tools, code editing and filesystem navigation.", "summary_ja_jp": "Gemini CLI のフォーク。Google の AI エージェントが、システムツール・コード編集・ファイルシステム走査を備えて端末内で直接動作する。", "body_html_en_us": "\u003cp>Fork of Gemini CLI, Google&#x27;s open-source AI agent that plugs the Gemini model directly into the terminal with the ability to execute system tools.\u003c/p>\n\u003ch2>Agent architecture\u003c/h2>\n\u003cp>Gemini CLI implements a classic agent loop:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Input\u003c/strong> — receive a user instruction through the terminal\u003c/li> \u003cli>\u003cstrong>Reasoning\u003c/strong> — the Gemini model evaluates context and chooses the next action\u003c/li> \u003cli>\u003cstrong>Tool execution\u003c/strong> — run tools such as shell, file read/write or search\u003c/li> \u003cli>\u003cstrong>Observation\u003c/strong> — feed tool results back into the next cycle\u003c/li> \u003cli>\u003cstrong>Output\u003c/strong> — produce the final response\u003c/li>\u003c/ol>\n\u003ch2>Why this fork\u003c/h2>\n\u003cp>Comparative study of coding-agent architectures. It contrasts Gemini CLI with Claude Code and other agents cataloged in \u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong>.\u003c/p>\n\u003ch2>Topics of interest\u003c/h2>\n\u003cul>\u003cli>Context and memory management across turns\u003c/li> \u003cli>Tool selection and parameter extraction\u003c/li> \u003cli>Sandboxing and execution permissions\u003c/li> \u003cli>Streaming of long responses\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Terminal-based coding agents need to balance autonomy and safety: system-tool execution is powerful but risky. Studying Gemini CLI reveals how Google approaches that trade-off in practice.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>A TypeScript / Node.js CLI built around a tool-using agent loop. It streams data from the Gemini API, keeps conversation history and executes local tools with explicit user confirmation for destructive actions.\u003c/p>\n\u003ch2>Impact &amp; Results\u003c/h2>\n\u003cul>\u003cli>Comparative study of agent architectures: ReAct vs planner vs tree-of-thought in a real CLI context\u003c/li> \u003cli>Fork used as a reference base for Ronaldinho Agent, the in-house .NET agent design\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisions\u003c/h2>\n\u003cul>\u003cli>Fork vs. greenfield build: forking accelerated learning, but it also inherited Google&#x27;s design decisions\u003c/li> \u003cli>TypeScript / Node.js vs. Go: the JS ecosystem speeds up prototyping, but runtime overhead is visible in filesystem-heavy workloads\u003c/li>\u003c/ul>\n\u003ch2>Lessons Learned\u003c/h2>\n\u003cul>\u003cli>Gemini CLI&#x27;s permission model, built around an allow-list of tools, is safer than opt-out designs\u003c/li> \u003cli>CLI agent loops need aggressive per-step timeouts — otherwise they can stall indefinitely on I/O\u003c/li>\u003c/ul>", "body_html_en": "\u003cp>Fork of Gemini CLI, Google&#x27;s open-source AI agent that plugs the Gemini model directly into the terminal with the ability to execute system tools.\u003c/p>\n\u003ch2>Agent architecture\u003c/h2>\n\u003cp>Gemini CLI implements a classic agent loop:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Input\u003c/strong> — receive a user instruction through the terminal\u003c/li> \u003cli>\u003cstrong>Reasoning\u003c/strong> — the Gemini model evaluates context and chooses the next action\u003c/li> \u003cli>\u003cstrong>Tool execution\u003c/strong> — run tools such as shell, file read/write or search\u003c/li> \u003cli>\u003cstrong>Observation\u003c/strong> — feed tool results back into the next cycle\u003c/li> \u003cli>\u003cstrong>Output\u003c/strong> — produce the final response\u003c/li>\u003c/ol>\n\u003ch2>Why this fork\u003c/h2>\n\u003cp>Comparative study of coding-agent architectures. It contrasts Gemini CLI with Claude Code and other agents cataloged in \u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong>.\u003c/p>\n\u003ch2>Topics of interest\u003c/h2>\n\u003cul>\u003cli>Context and memory management across turns\u003c/li> \u003cli>Tool selection and parameter extraction\u003c/li> \u003cli>Sandboxing and execution permissions\u003c/li> \u003cli>Streaming of long responses\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Terminal-based coding agents need to balance autonomy and safety: system-tool execution is powerful but risky. Studying Gemini CLI reveals how Google approaches that trade-off in practice.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>A TypeScript / Node.js CLI built around a tool-using agent loop. It streams data from the Gemini API, keeps conversation history and executes local tools with explicit user confirmation for destructive actions.\u003c/p>\n\u003ch2>Impact &amp; Results\u003c/h2>\n\u003cul>\u003cli>Comparative study of agent architectures: ReAct vs planner vs tree-of-thought in a real CLI context\u003c/li> \u003cli>Fork used as a reference base for Ronaldinho Agent, the in-house .NET agent design\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisions\u003c/h2>\n\u003cul>\u003cli>Fork vs. greenfield build: forking accelerated learning, but it also inherited Google&#x27;s design decisions\u003c/li> \u003cli>TypeScript / Node.js vs. Go: the JS ecosystem speeds up prototyping, but runtime overhead is visible in filesystem-heavy workloads\u003c/li>\u003c/ul>\n\u003ch2>Lessons Learned\u003c/h2>\n\u003cul>\u003cli>Gemini CLI&#x27;s permission model, built around an allow-list of tools, is safer than opt-out designs\u003c/li> \u003cli>CLI agent loops need aggressive per-step timeouts — otherwise they can stall indefinitely on I/O\u003c/li>\u003c/ul>", "body_html_ja_jp": "\u003cp>Gemini モデルを端末に直接接続し、システムツールを実行できる Google 製オープンソース AI エージェント、Gemini CLI のフォークです。\u003c/p>\n\u003ch2>エージェント・アーキテクチャ\u003c/h2>\n\u003cp>Gemini CLI は古典的なエージェント・ループを実装しています。\u003c/p>\n\u003col>\u003cli>\u003cstrong>Input\u003c/strong> — 端末経由でユーザー指示を受け取る\u003c/li> \u003cli>\u003cstrong>Reasoning\u003c/strong> — Gemini モデルが文脈を評価し、次の行動を決める\u003c/li> \u003cli>\u003cstrong>Tool execution\u003c/strong> — shell、ファイル読取/書込、検索などを実行する\u003c/li> \u003cli>\u003cstrong>Observation\u003c/strong> — ツール結果を次のサイクルへ戻す\u003c/li> \u003cli>\u003cstrong>Output\u003c/strong> — 最終応答を返す\u003c/li>\u003c/ol>\n\u003ch2>このフォークの理由\u003c/h2>\n\u003cp>コードエージェント・アーキテクチャの比較研究です。\u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong> に整理された Claude Code などのエージェントと対比できます。\u003c/p>\n\u003ch2>注目ポイント\u003c/h2>\n\u003cul>\u003cli>ターンをまたぐコンテキストとメモリ管理\u003c/li> \u003cli>ツール選択とパラメータ抽出\u003c/li> \u003cli>サンドボックスと実行権限\u003c/li> \u003cli>長文レスポンスのストリーミング\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>端末型のコードエージェントは、自律性と安全性の両立が必要です。システムツールの実行は強力ですが危険も伴います。Gemini CLI を分析すると、そのトレードオフに Google がどう向き合っているかが見えてきます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>TypeScript / Node.js 製 CLI で、tool-use を前提にしたエージェント・ループを中心に構成されています。Gemini API とストリーミング通信し、会話履歴を保持しつつ、破壊的操作には明示的な確認を求めてローカルツールを実行します。\u003c/p>\n\u003ch2>インパクト &amp; 成果\u003c/h2>\n\u003cul>\u003cli>実運用 CLI 文脈でのエージェント・アーキテクチャ比較: ReAct vs planner vs tree-of-thought\u003c/li> \u003cli>自前の .NET エージェントである Ronaldinho Agent 設計の参照ベースとして活用\u003c/li>\u003c/ul>\n\u003ch2>トレードオフ &amp; 決定事項\u003c/h2>\n\u003cul>\u003cli>fork かゼロから実装するか: fork は学習を加速したが、Google 側の設計判断も引き継ぐことになった\u003c/li> \u003cli>TypeScript / Node.js vs Go: JS エコシステムは試作が速い一方、filesystem-heavy な処理ではランタイム負荷が見える\u003c/li>\u003c/ul>\n\u003ch2>学んだ教訓\u003c/h2>\n\u003cul>\u003cli>Gemini CLI の権限モデルは allow-list 前提で、opt-out 型の設計より安全だった\u003c/li> \u003cli>CLI のエージェント・ループにはステップごとの厳しい timeout が必要で、そうしないと I/O で無限停止しやすい\u003c/li>\u003c/ul>", "body_html_ja": "\u003cp>Gemini モデルを端末に直接接続し、システムツールを実行できる Google 製オープンソース AI エージェント、Gemini CLI のフォークです。\u003c/p>\n\u003ch2>エージェント・アーキテクチャ\u003c/h2>\n\u003cp>Gemini CLI は古典的なエージェント・ループを実装しています。\u003c/p>\n\u003col>\u003cli>\u003cstrong>Input\u003c/strong> — 端末経由でユーザー指示を受け取る\u003c/li> \u003cli>\u003cstrong>Reasoning\u003c/strong> — Gemini モデルが文脈を評価し、次の行動を決める\u003c/li> \u003cli>\u003cstrong>Tool execution\u003c/strong> — shell、ファイル読取/書込、検索などを実行する\u003c/li> \u003cli>\u003cstrong>Observation\u003c/strong> — ツール結果を次のサイクルへ戻す\u003c/li> \u003cli>\u003cstrong>Output\u003c/strong> — 最終応答を返す\u003c/li>\u003c/ol>\n\u003ch2>このフォークの理由\u003c/h2>\n\u003cp>コードエージェント・アーキテクチャの比較研究です。\u003cstrong>system-prompts-and-models-of-ai-tools\u003c/strong> に整理された Claude Code などのエージェントと対比できます。\u003c/p>\n\u003ch2>注目ポイント\u003c/h2>\n\u003cul>\u003cli>ターンをまたぐコンテキストとメモリ管理\u003c/li> \u003cli>ツール選択とパラメータ抽出\u003c/li> \u003cli>サンドボックスと実行権限\u003c/li> \u003cli>長文レスポンスのストリーミング\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>端末型のコードエージェントは、自律性と安全性の両立が必要です。システムツールの実行は強力ですが危険も伴います。Gemini CLI を分析すると、そのトレードオフに Google がどう向き合っているかが見えてきます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>TypeScript / Node.js 製 CLI で、tool-use を前提にしたエージェント・ループを中心に構成されています。Gemini API とストリーミング通信し、会話履歴を保持しつつ、破壊的操作には明示的な確認を求めてローカルツールを実行します。\u003c/p>\n\u003ch2>インパクト &amp; 成果\u003c/h2>\n\u003cul>\u003cli>実運用 CLI 文脈でのエージェント・アーキテクチャ比較: ReAct vs planner vs tree-of-thought\u003c/li> \u003cli>自前の .NET エージェントである Ronaldinho Agent 設計の参照ベースとして活用\u003c/li>\u003c/ul>\n\u003ch2>トレードオフ &amp; 決定事項\u003c/h2>\n\u003cul>\u003cli>fork かゼロから実装するか: fork は学習を加速したが、Google 側の設計判断も引き継ぐことになった\u003c/li> \u003cli>TypeScript / Node.js vs Go: JS エコシステムは試作が速い一方、filesystem-heavy な処理ではランタイム負荷が見える\u003c/li>\u003c/ul>\n\u003ch2>学んだ教訓\u003c/h2>\n\u003cul>\u003cli>Gemini CLI の権限モデルは allow-list 前提で、opt-out 型の設計より安全だった\u003c/li> \u003cli>CLI のエージェント・ループにはステップごとの厳しい timeout が必要で、そうしないと I/O で無限停止しやすい\u003c/li>\u003c/ul>"}, {"id": "project-java-servlet-pages", "kind": "project", "status": "research", "stack": ["Java", "Servlets", "JSP", "Tomcat"], "url": "/projects/java-servlet-pages/", "resolved_url": "https://nhmatsumoto.github.io/projects/java-servlet-pages/", "repo_url": "https://github.com/nhmatsumoto/Java-Servlet-Pages", "has_math": false, "name": "Java-Servlet-Pages", "headline": "Aplicação web com Java Servlets e JSP — fundamentos de desenvolvimento web no ecossistema Java.", "summary": "Projeto de estudo com Java Servlets e JSP, cobrindo ciclo de vida de requisições HTTP, sessões, filtros e padrão MVC no servidor.", "body_html": "\u003cp>Projeto de estudo de desenvolvimento web com Java Servlets e JavaServer Pages (JSP), utilizando Apache Tomcat como container.\u003c/p>\n\u003ch2>Conceitos cobertos\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Ciclo de vida de Servlets\u003c/strong> — init, service, destroy\u003c/li> \u003cli>\u003cstrong>Requisições HTTP\u003c/strong> — tratamento de GET, POST, redirecionamento e forwarding\u003c/li> \u003cli>\u003cstrong>Sessões e cookies\u003c/strong> — gerenciamento de estado entre requisições\u003c/li> \u003cli>\u003cstrong>Filtros\u003c/strong> — interceptação e processamento de requisições antes de chegar ao servlet\u003c/li> \u003cli>\u003cstrong>Padrão MVC\u003c/strong> — separação entre model (JavaBeans), view (JSP) e controller (Servlets)\u003c/li>\u003c/ul>\n\u003ch2>Contexto\u003c/h2>\n\u003cp>Embora frameworks modernos como Spring Boot abstraiam a maioria desses conceitos, entender Servlets é fundamental para compreender como o ecosistema web Java funciona por baixo. Todo o Spring MVC é construído sobre a Servlet API.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Frameworks modernos abstraem demais os fundamentos de HTTP no Java. Este projeto expõe diretamente a Servlet API para construir entendimento sólido de como requisições são processadas antes de trabalhar com abstrações de alto nível.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Aplicação web tradicional Java EE: web.xml para configuração de servlets e filtros, JSP para renderização de views, JavaBeans como modelos de dados. Deployada como WAR no Apache Tomcat.\u003c/p>", "headline_en_us": "Web application with Java Servlets and JSP — fundamentals of web development in the Java ecosystem.", "headline_ja_jp": "Java Servlet と JSP を用いた Web アプリケーション — Java エコシステムにおける Web 開発の基礎。", "summary_en_us": "Study project using Java Servlets and JSP, covering HTTP request lifecycle, sessions, filters and the server-side MVC pattern.", "summary_ja_jp": "Java Servlet と JSP を用いた学習プロジェクト。HTTP リクエストのライフサイクル、セッション、フィルター、サーバ側 MVC を扱う。", "body_html_en_us": "\u003cp>Study project on web development with Java Servlets and JavaServer Pages (JSP), using Apache Tomcat as the container.\u003c/p>\n\u003ch2>Covered concepts\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Servlet lifecycle\u003c/strong> — init, service and destroy\u003c/li> \u003cli>\u003cstrong>HTTP requests\u003c/strong> — handling GET, POST, redirects and forwarding\u003c/li> \u003cli>\u003cstrong>Sessions and cookies\u003c/strong> — state management across requests\u003c/li> \u003cli>\u003cstrong>Filters\u003c/strong> — intercepting and processing requests before they hit servlets\u003c/li> \u003cli>\u003cstrong>MVC pattern\u003c/strong> — separation between model (JavaBeans), view (JSP) and controller (Servlets)\u003c/li>\u003c/ul>\n\u003ch2>Context\u003c/h2>\n\u003cp>Modern frameworks such as Spring Boot abstract most of these details, but understanding Servlets is still essential for grasping how the Java web ecosystem works underneath. Spring MVC itself is built on top of the Servlet API.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Modern frameworks hide too much of Java&#x27;s HTTP foundations. This project exposes the Servlet API directly to build a solid understanding of request processing before relying on higher-level abstractions.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Traditional Java EE web application: \u003ccode>web.xml\u003c/code> for servlet and filter configuration, JSP for view rendering and JavaBeans as data models. Packaged as a WAR and deployed on Apache Tomcat.\u003c/p>", "body_html_en": "\u003cp>Study project on web development with Java Servlets and JavaServer Pages (JSP), using Apache Tomcat as the container.\u003c/p>\n\u003ch2>Covered concepts\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Servlet lifecycle\u003c/strong> — init, service and destroy\u003c/li> \u003cli>\u003cstrong>HTTP requests\u003c/strong> — handling GET, POST, redirects and forwarding\u003c/li> \u003cli>\u003cstrong>Sessions and cookies\u003c/strong> — state management across requests\u003c/li> \u003cli>\u003cstrong>Filters\u003c/strong> — intercepting and processing requests before they hit servlets\u003c/li> \u003cli>\u003cstrong>MVC pattern\u003c/strong> — separation between model (JavaBeans), view (JSP) and controller (Servlets)\u003c/li>\u003c/ul>\n\u003ch2>Context\u003c/h2>\n\u003cp>Modern frameworks such as Spring Boot abstract most of these details, but understanding Servlets is still essential for grasping how the Java web ecosystem works underneath. Spring MVC itself is built on top of the Servlet API.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Modern frameworks hide too much of Java&#x27;s HTTP foundations. This project exposes the Servlet API directly to build a solid understanding of request processing before relying on higher-level abstractions.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Traditional Java EE web application: \u003ccode>web.xml\u003c/code> for servlet and filter configuration, JSP for view rendering and JavaBeans as data models. Packaged as a WAR and deployed on Apache Tomcat.\u003c/p>", "body_html_ja_jp": "\u003cp>Apache Tomcat をコンテナとして使い、Java Servlets と JavaServer Pages (JSP) による Web 開発を学ぶプロジェクトです。\u003c/p>\n\u003ch2>扱う概念\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Servlet lifecycle\u003c/strong> — init、service、destroy\u003c/li> \u003cli>\u003cstrong>HTTP request\u003c/strong> — GET、POST、redirect、forward の処理\u003c/li> \u003cli>\u003cstrong>session と cookie\u003c/strong> — リクエストをまたぐ状態管理\u003c/li> \u003cli>\u003cstrong>filter\u003c/strong> — servlet に届く前のリクエスト横取りと前処理\u003c/li> \u003cli>\u003cstrong>MVC pattern\u003c/strong> — model（JavaBeans）、view（JSP）、controller（Servlets）の分離\u003c/li>\u003c/ul>\n\u003ch2>背景\u003c/h2>\n\u003cp>Spring Boot のような現代的フレームワークはこれらを大きく抽象化しますが、Servlet を理解することは Java Web が下層でどう動いているかを知るうえで不可欠です。Spring MVC も Servlet API の上に構築されています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>現代のフレームワークは、Java における HTTP の基礎を抽象化しすぎる傾向があります。このプロジェクトでは Servlet API を直接扱い、高水準抽象に進む前にリクエスト処理の基礎理解を固めます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>伝統的な Java EE Web アプリ構成です。servlet と filter の設定には \u003ccode>web.xml\u003c/code>、view の描画には JSP、データモデルには JavaBeans を使用し、WAR として Apache Tomcat にデプロイします。\u003c/p>", "body_html_ja": "\u003cp>Apache Tomcat をコンテナとして使い、Java Servlets と JavaServer Pages (JSP) による Web 開発を学ぶプロジェクトです。\u003c/p>\n\u003ch2>扱う概念\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Servlet lifecycle\u003c/strong> — init、service、destroy\u003c/li> \u003cli>\u003cstrong>HTTP request\u003c/strong> — GET、POST、redirect、forward の処理\u003c/li> \u003cli>\u003cstrong>session と cookie\u003c/strong> — リクエストをまたぐ状態管理\u003c/li> \u003cli>\u003cstrong>filter\u003c/strong> — servlet に届く前のリクエスト横取りと前処理\u003c/li> \u003cli>\u003cstrong>MVC pattern\u003c/strong> — model（JavaBeans）、view（JSP）、controller（Servlets）の分離\u003c/li>\u003c/ul>\n\u003ch2>背景\u003c/h2>\n\u003cp>Spring Boot のような現代的フレームワークはこれらを大きく抽象化しますが、Servlet を理解することは Java Web が下層でどう動いているかを知るうえで不可欠です。Spring MVC も Servlet API の上に構築されています。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>現代のフレームワークは、Java における HTTP の基礎を抽象化しすぎる傾向があります。このプロジェクトでは Servlet API を直接扱い、高水準抽象に進む前にリクエスト処理の基礎理解を固めます。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>伝統的な Java EE Web アプリ構成です。servlet と filter の設定には \u003ccode>web.xml\u003c/code>、view の描画には JSP、データモデルには JavaBeans を使用し、WAR として Apache Tomcat にデプロイします。\u003c/p>"}, {"id": "project-leaflet", "kind": "project", "status": "research", "stack": ["JavaScript", "GIS", "Maps", "WebGL"], "url": "/projects/leaflet/", "resolved_url": "https://nhmatsumoto.github.io/projects/leaflet/", "repo_url": "https://github.com/nhmatsumoto/Leaflet", "has_math": false, "name": "Leaflet", "headline": "Biblioteca JavaScript para mapas interativos mobile-friendly — referência para projetos GIS.", "summary": "Fork do Leaflet, a biblioteca JavaScript mais popular para mapas interativos, utilizada como base nos projetos de GIS do ecossistema.", "body_html": "\u003cp>Fork do Leaflet, a biblioteca JavaScript open-source mais utilizada para renderização de mapas interativos na web.\u003c/p>\n\u003ch2>Papel no ecossistema\u003c/h2>\n\u003cp>Leaflet é a camada de visualização de mapas utilizada nos projetos \u003cstrong>SOS Location\u003c/strong>, \u003cstrong>brumadinho_location\u003c/strong> e \u003cstrong>GIS Incident Lab\u003c/strong>. Manter o fork permite:\u003c/p>\n\u003cul>\u003cli>Estudar internals de renderização de tiles e layers\u003c/li> \u003cli>Testar plugins customizados antes de integrar nos projetos\u003c/li> \u003cli>Avaliar performance com grandes volumes de marcadores\u003c/li>\u003c/ul>\n\u003ch2>Capacidades técnicas\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Tile layers\u003c/strong> — suporte a múltiplos provedores (OpenStreetMap, Mapbox, etc.)\u003c/li> \u003cli>\u003cstrong>GeoJSON\u003c/strong> — renderização nativa de dados geoespaciais\u003c/li> \u003cli>\u003cstrong>Markers e popups\u003c/strong> — interação com pontos de interesse\u003c/li> \u003cli>\u003cstrong>Layer control\u003c/strong> — composição de camadas para visualização operacional\u003c/li> \u003cli>\u003cstrong>Mobile-first\u003c/strong> — touch events e gestos nativos\u003c/li>\u003c/ul>\n\u003ch2>Relevância para projetos de crise\u003c/h2>\n\u003cp>Em projetos de resposta a desastres, a capacidade de renderizar milhares de pontos com performance e de funcionar offline (tile caching) é crítica para equipes de campo.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Mapas interativos na web precisam ser leves, rápidos e funcionar em dispositivos móveis de campo. Leaflet resolve isso com uma API minimalista e extensível, sem a complexidade de soluções como Google Maps ou Mapbox GL.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Biblioteca modular com core responsável por renderização de tiles, gerenciamento de layers e controle de viewport. Extensível via plugins que adicionam funcionalidades como clustering, heatmaps e draw tools.\u003c/p>", "headline_en_us": "JavaScript library for mobile-friendly interactive maps — reference for GIS projects.", "headline_ja_jp": "モバイル対応のインタラクティブマップ用 JavaScript ライブラリ — GIS プロジェクトのリファレンス。", "summary_en_us": "Fork of Leaflet, the most popular JavaScript library for interactive maps, used as a base in the ecosystem's GIS projects.", "summary_ja_jp": "Leaflet のフォーク。インタラクティブマップで最も人気のある JavaScript ライブラリで、エコシステム内の GIS プロジェクトの基盤として利用。", "body_html_en_us": "\u003cp>Fork of Leaflet, the most widely used open-source JavaScript library for rendering interactive maps on the web.\u003c/p>\n\u003ch2>Role in the ecosystem\u003c/h2>\n\u003cp>Leaflet is the map-visualization layer used in \u003cstrong>SOS Location\u003c/strong>, \u003cstrong>brumadinho_location\u003c/strong> and \u003cstrong>GIS Incident Lab\u003c/strong>. Keeping the fork available makes it possible to:\u003c/p>\n\u003cul>\u003cli>Study tile and layer rendering internals\u003c/li> \u003cli>Test custom plugins before integrating them into production projects\u003c/li> \u003cli>Evaluate performance under large marker volumes\u003c/li>\u003c/ul>\n\u003ch2>Technical capabilities\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Tile layers\u003c/strong> — support for multiple providers such as OpenStreetMap and Mapbox\u003c/li> \u003cli>\u003cstrong>GeoJSON\u003c/strong> — native rendering of geospatial data\u003c/li> \u003cli>\u003cstrong>Markers and popups\u003c/strong> — interaction with points of interest\u003c/li> \u003cli>\u003cstrong>Layer control\u003c/strong> — composition of overlays for operational views\u003c/li> \u003cli>\u003cstrong>Mobile-first\u003c/strong> — touch events and native gestures\u003c/li>\u003c/ul>\n\u003ch2>Relevance in crisis projects\u003c/h2>\n\u003cp>In disaster-response systems, being able to render thousands of points efficiently and to operate offline through tile caching is critical for field teams.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Interactive web maps need to stay lightweight, fast and usable on mobile devices in the field. Leaflet achieves that with a minimal, extensible API, avoiding the weight and complexity of heavier map stacks.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Modular library with a core responsible for tile rendering, layer management and viewport control. It is extended through plugins for clustering, heatmaps, drawing tools and other behaviors.\u003c/p>", "body_html_en": "\u003cp>Fork of Leaflet, the most widely used open-source JavaScript library for rendering interactive maps on the web.\u003c/p>\n\u003ch2>Role in the ecosystem\u003c/h2>\n\u003cp>Leaflet is the map-visualization layer used in \u003cstrong>SOS Location\u003c/strong>, \u003cstrong>brumadinho_location\u003c/strong> and \u003cstrong>GIS Incident Lab\u003c/strong>. Keeping the fork available makes it possible to:\u003c/p>\n\u003cul>\u003cli>Study tile and layer rendering internals\u003c/li> \u003cli>Test custom plugins before integrating them into production projects\u003c/li> \u003cli>Evaluate performance under large marker volumes\u003c/li>\u003c/ul>\n\u003ch2>Technical capabilities\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Tile layers\u003c/strong> — support for multiple providers such as OpenStreetMap and Mapbox\u003c/li> \u003cli>\u003cstrong>GeoJSON\u003c/strong> — native rendering of geospatial data\u003c/li> \u003cli>\u003cstrong>Markers and popups\u003c/strong> — interaction with points of interest\u003c/li> \u003cli>\u003cstrong>Layer control\u003c/strong> — composition of overlays for operational views\u003c/li> \u003cli>\u003cstrong>Mobile-first\u003c/strong> — touch events and native gestures\u003c/li>\u003c/ul>\n\u003ch2>Relevance in crisis projects\u003c/h2>\n\u003cp>In disaster-response systems, being able to render thousands of points efficiently and to operate offline through tile caching is critical for field teams.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Interactive web maps need to stay lightweight, fast and usable on mobile devices in the field. Leaflet achieves that with a minimal, extensible API, avoiding the weight and complexity of heavier map stacks.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Modular library with a core responsible for tile rendering, layer management and viewport control. It is extended through plugins for clustering, heatmaps, drawing tools and other behaviors.\u003c/p>", "body_html_ja_jp": "\u003cp>Web 上でインタラクティブ地図を描画する、最も広く使われているオープンソース JavaScript ライブラリ Leaflet のフォークです。\u003c/p>\n\u003ch2>エコシステム内での役割\u003c/h2>\n\u003cp>Leaflet は \u003cstrong>SOS Location\u003c/strong>、\u003cstrong>brumadinho_location\u003c/strong>、\u003cstrong>GIS Incident Lab\u003c/strong> で使われている地図可視化レイヤです。フォークを維持することで、次を実現できます。\u003c/p>\n\u003cul>\u003cli>tile と layer 描画の internals を調べる\u003c/li> \u003cli>本番統合前にカスタム plugin を試す\u003c/li> \u003cli>大量 marker 下での性能を評価する\u003c/li>\u003c/ul>\n\u003ch2>技術的な能力\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Tile layers\u003c/strong> — OpenStreetMap や Mapbox など複数プロバイダ対応\u003c/li> \u003cli>\u003cstrong>GeoJSON\u003c/strong> — 地理空間データのネイティブ描画\u003c/li> \u003cli>\u003cstrong>Markers / popups\u003c/strong> — 関心地点との対話\u003c/li> \u003cli>\u003cstrong>Layer control\u003c/strong> — 運用ビュー向け overlay 合成\u003c/li> \u003cli>\u003cstrong>Mobile-first\u003c/strong> — touch event とネイティブ gesture\u003c/li>\u003c/ul>\n\u003ch2>危機対応プロジェクトでの重要性\u003c/h2>\n\u003cp>災害対応では、何千もの点を高速に描画し、tile cache を通じてオフラインでも動けることが現場にとって重要です。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>Web のインタラクティブ地図は、軽量・高速で、現場のモバイル端末でも使えなければなりません。Leaflet は最小限で拡張しやすい API によって、それを重い地図スタックなしに実現します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>tile 描画、layer 管理、viewport 制御を担う core を中心としたモジュール型ライブラリです。clustering、heatmap、draw tools などの機能は plugin で拡張できます。\u003c/p>", "body_html_ja": "\u003cp>Web 上でインタラクティブ地図を描画する、最も広く使われているオープンソース JavaScript ライブラリ Leaflet のフォークです。\u003c/p>\n\u003ch2>エコシステム内での役割\u003c/h2>\n\u003cp>Leaflet は \u003cstrong>SOS Location\u003c/strong>、\u003cstrong>brumadinho_location\u003c/strong>、\u003cstrong>GIS Incident Lab\u003c/strong> で使われている地図可視化レイヤです。フォークを維持することで、次を実現できます。\u003c/p>\n\u003cul>\u003cli>tile と layer 描画の internals を調べる\u003c/li> \u003cli>本番統合前にカスタム plugin を試す\u003c/li> \u003cli>大量 marker 下での性能を評価する\u003c/li>\u003c/ul>\n\u003ch2>技術的な能力\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Tile layers\u003c/strong> — OpenStreetMap や Mapbox など複数プロバイダ対応\u003c/li> \u003cli>\u003cstrong>GeoJSON\u003c/strong> — 地理空間データのネイティブ描画\u003c/li> \u003cli>\u003cstrong>Markers / popups\u003c/strong> — 関心地点との対話\u003c/li> \u003cli>\u003cstrong>Layer control\u003c/strong> — 運用ビュー向け overlay 合成\u003c/li> \u003cli>\u003cstrong>Mobile-first\u003c/strong> — touch event とネイティブ gesture\u003c/li>\u003c/ul>\n\u003ch2>危機対応プロジェクトでの重要性\u003c/h2>\n\u003cp>災害対応では、何千もの点を高速に描画し、tile cache を通じてオフラインでも動けることが現場にとって重要です。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>Web のインタラクティブ地図は、軽量・高速で、現場のモバイル端末でも使えなければなりません。Leaflet は最小限で拡張しやすい API によって、それを重い地図スタックなしに実現します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>tile 描画、layer 管理、viewport 制御を担う core を中心としたモジュール型ライブラリです。clustering、heatmap、draw tools などの機能は plugin で拡張できます。\u003c/p>"}, {"id": "project-macos", "kind": "project", "status": "research", "stack": ["Docker", "QEMU", "KVM", "macOS"], "url": "/projects/macos/", "resolved_url": "https://nhmatsumoto.github.io/projects/macos/", "repo_url": "https://github.com/nhmatsumoto/macos", "has_math": false, "name": "macos", "headline": "macOS virtualizado dentro de um container Docker — experimentação com virtualização de sistemas operacionais.", "summary": "Fork do projeto Docker-OSX: virtualização de macOS dentro de containers Docker para testes de compatibilidade e desenvolvimento cross-platform.", "body_html": "\u003cp>Fork do projeto que permite executar macOS dentro de um container Docker, utilizando QEMU/KVM para virtualização.\u003c/p>\n\u003ch2>Motivação\u003c/h2>\n\u003cp>Desenvolvimento cross-platform frequentemente exige testar em macOS sem ter acesso a hardware Apple. Este projeto permite criar ambientes macOS efêmeros para:\u003c/p>\n\u003cul>\u003cli>Testes de compatibilidade de aplicações\u003c/li> \u003cli>Build de projetos iOS/macOS em CI/CD Linux\u003c/li> \u003cli>Experimentação com APIs exclusivas do macOS\u003c/li>\u003c/ul>\n\u003ch2>Como funciona\u003c/h2>\n\u003cp>O container utiliza QEMU com aceleração KVM para virtualizar o hardware necessário, incluindo emulação de dispositivos Apple. A imagem do macOS é carregada de um disco virtual dentro do container.\u003c/p>\n\u003ch2>Considerações\u003c/h2>\n\u003cp>A virtualização de macOS está sujeita aos termos de licenciamento da Apple (EULA), que restringe a execução a hardware Apple genuíno. Este fork é mantido para estudo da tecnologia de virtualização, não para uso em produção.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Desenvolvedores que trabalham em Linux/Windows mas precisam testar em macOS enfrentam um gap de acesso. A virtualização via Docker reduz a fricção ao criar ambientes macOS descartáveis, embora com limitações de performance e licenciamento.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Container Docker com QEMU como hypervisor, KVM para aceleração de hardware e passthrough de GPU quando disponível. A imagem macOS é montada como disco virtual QCOW2 dentro do container.\u003c/p>", "headline_en_us": "macOS virtualized inside a Docker container — experiments with OS-level virtualization.", "headline_ja_jp": "Docker コンテナ内で仮想化された macOS — OS 仮想化の実験。", "summary_en_us": "Fork of Docker-OSX: macOS virtualization inside Docker containers for compatibility testing and cross-platform development.", "summary_ja_jp": "Docker-OSX のフォーク。Docker コンテナ内で macOS を仮想化し、互換性テストとクロスプラットフォーム開発を可能にする。", "body_html_en_us": "\u003cp>Fork of the project that runs macOS inside a Docker container by using QEMU / KVM for virtualization.\u003c/p>\n\u003ch2>Motivation\u003c/h2>\n\u003cp>Cross-platform development often requires testing on macOS without access to Apple hardware. This project makes it possible to create ephemeral macOS environments for:\u003c/p>\n\u003cul>\u003cli>Compatibility testing\u003c/li> \u003cli>Building iOS / macOS projects from Linux CI pipelines\u003c/li> \u003cli>Experimenting with macOS-only APIs\u003c/li>\u003c/ul>\n\u003ch2>How it works\u003c/h2>\n\u003cp>The container uses QEMU with KVM acceleration to virtualize the required hardware, including Apple-specific device emulation. A macOS image is loaded from a virtual disk inside the container.\u003c/p>\n\u003ch2>Considerations\u003c/h2>\n\u003cp>macOS virtualization is subject to Apple&#x27;s licensing terms (EULA), which restrict execution to genuine Apple hardware. This fork is kept for studying virtualization technology, not for production use.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Developers working on Linux or Windows but needing macOS testing face an access gap. Containerized virtualization reduces friction by creating disposable macOS environments, albeit with performance and licensing constraints.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Docker container with QEMU as the hypervisor, KVM for hardware acceleration and optional GPU passthrough. The macOS image is mounted as a QCOW2 virtual disk inside the container.\u003c/p>", "body_html_en": "\u003cp>Fork of the project that runs macOS inside a Docker container by using QEMU / KVM for virtualization.\u003c/p>\n\u003ch2>Motivation\u003c/h2>\n\u003cp>Cross-platform development often requires testing on macOS without access to Apple hardware. This project makes it possible to create ephemeral macOS environments for:\u003c/p>\n\u003cul>\u003cli>Compatibility testing\u003c/li> \u003cli>Building iOS / macOS projects from Linux CI pipelines\u003c/li> \u003cli>Experimenting with macOS-only APIs\u003c/li>\u003c/ul>\n\u003ch2>How it works\u003c/h2>\n\u003cp>The container uses QEMU with KVM acceleration to virtualize the required hardware, including Apple-specific device emulation. A macOS image is loaded from a virtual disk inside the container.\u003c/p>\n\u003ch2>Considerations\u003c/h2>\n\u003cp>macOS virtualization is subject to Apple&#x27;s licensing terms (EULA), which restrict execution to genuine Apple hardware. This fork is kept for studying virtuali

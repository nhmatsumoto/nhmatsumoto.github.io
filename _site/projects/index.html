i>\u003c/ol>\n\u003ch2>Expected outcome\u003c/h2>\n\u003cp>When this surface is explicit, replacing a provider, runtime or coordination style no longer implies rewriting the whole system.\u003c/p>", "body_html_ja_jp": "\u003ch1>エージェント統合サーフェス\u003c/h1>\n\u003cp>このノートは、外部ツールを呼び出しつつ予測可能性を失わないために、エージェント指向システムが持つべき最小の統合サーフェスを記述します。\u003c/p>\n\u003ch2>中核契約\u003c/h2>\n\u003cul>\u003cli>\u003ccode>task\u003c/code>: 解決すべき問題\u003c/li> \u003cli>\u003ccode>capability\u003c/code>: 利用可能な行動の集合\u003c/li> \u003cli>\u003ccode>tool_call\u003c/code>: 具体的なインフラ呼び出し\u003c/li> \u003cli>\u003ccode>result\u003c/code>: 内部利用のために正規化された戻り値\u003c/li>\u003c/ul>\n\u003ch2>実用ルール\u003c/h2>\n\u003col>\u003cli>エージェントは何にでも直接話しかけてはいけない。\u003c/li> \u003cli>すべての外部呼び出しには明示的な契約と正規化が必要である。\u003c/li> \u003cli>技術ログはドメインイベントの代わりにはならない。\u003c/li>\u003c/ol>\n\u003ch2>期待される結果\u003c/h2>\n\u003cp>このサーフェスが明示されると、provider、runtime、調停方式を切り替えても、システム全体を書き直す必要がなくなります。\u003c/p>"}, {"id": "document-ronaldinho-architecture-overview", "kind": "document", "name": "Visão Geral da Arquitetura do Ronaldinho", "headline": "Resumo da arquitetura do Ronaldinho Agent e das escolhas de modularidade do runtime.", "summary": "Resumo da arquitetura do Ronaldinho Agent e das escolhas de modularidade do runtime.", "status": "production", "stack": ["agents", "architecture", "runtime"], "url": "/documents/ronaldinho-architecture-overview/", "resolved_url": "https://nhmatsumoto.github.io/documents/ronaldinho-architecture-overview/", "repo_url": "", "has_math": false, "title": "Visão Geral da Arquitetura do Ronaldinho", "body_html": "\u003ch1>A Estrutura OpenClaw Pro 🏗️\u003c/h1>\n\u003cp>O Ronaldinho Agent não é monolítico. Ele é uma orquestração de microsserviços e camadas de inteligência que garantem autonomia nível L6.\u003c/p>\n\u003ch3>O Diagrama de Fluxo\u003c/h3>\n\u003cdiv class=\"mermaid\">graph TD\n    User([Usuário]) --> |Telegram| Bridge[Neural Bridge]\n    User --> |Browser| Dashboard[OpenClaw Dashboard]\n\n    subgraph \"Camada de Inteligência\"\n        Bridge \u003c--> Core[Neural Core - FastAPI]\n        Dashboard \u003c--> Core\n        Core --> Skills[Engine de Habilidades]\n        Core --> Memory[Memory Store]\n    end\n\n    subgraph \"Execução Autónoma\"\n        Core --> Lane[Execution Lane]\n        Core --> Tools[Terminal/File Tools]\n    end\u003c/div>\n\u003ch3>Componentes Chave\u003c/h3>\n\u003ch4>1. Neural Core (Sessão Central)\u003c/h4>\n\u003cp>O cérebro do sistema. Desenvolvido em FastAPI, ele gerencia as requisições, faz a compressão de contexto e decide qual Persona deve entrar em campo.\u003c/p>\n\u003ch4>2. Execution Lanes\u003c/h4>\n\u003cp>Um conceito chave inspirado no OpenClaw. Cada usuário tem uma &quot;Lane&quot; (faixa) de execução. Isso garante que o Ronaldinho não tente editar o mesmo arquivo em duas tarefas diferentes ao mesmo tempo, evitando conflitos de IO.\u003c/p>\n\u003ch4>3. Provedor Agnóstico\u003c/h4>\n\u003cp>O Core não depende de apenas um modelo. Ele utiliza um sistema de \u003cstrong>Fallback em Cascata\u003c/strong>:\u003c/p>\n\u003col>\u003cli>Tenta API Principal (ex: Gemini Flash).\u003c/li> \u003cli>Se falhar por cota, tenta Fallbacks (OpenAI, Anthropic).\u003c/li> \u003cli>Se falhar, ativa o \u003cstrong>Ghost Mode\u003c/strong> (Navegador).\u003c/li> \u003cli>Como última instância, encaminha para a \u003cstrong>Antigravity Bridge\u003c/strong>.\u003c/li>\u003c/ol>\n\u003ch4>4. Skills Engine\u003c/h4>\n\u003cp>As habilidades saem de \u003ccode>.agent/skills/\u003c/code>. Cada skill é um módulo Python independente que o agente pode importar e usar para expandir suas capacidades sem precisar reiniciar o sistema.\u003c/p>", "title_en_us": "Ronaldinho Architecture Overview", "title_ja_jp": "Ronaldinho アーキテクチャ概観", "summary_en_us": "Overview of the Ronaldinho Agent architecture and runtime modularity choices.", "summary_ja_jp": "Ronaldinho Agent のアーキテクチャとランタイム・モジュラリティ選定の概観。", "body_html_en_us": "\u003ch1>Ronaldinho Architecture Overview\u003c/h1>\n\u003cp>The Ronaldinho Agent is not monolithic. It is an orchestration of services and intelligence layers designed to provide autonomy without losing control over execution.\u003c/p>\n\u003ch2>Flow diagram\u003c/h2>\n\u003cdiv class=\"mermaid\">graph TD\n    User([User]) --> |Telegram| Bridge[Neural Bridge]\n    User --> |Browser| Dashboard[OpenClaw Dashboard]\n\n    subgraph \"Intelligence Layer\"\n        Bridge \u003c--> Core[Neural Core - FastAPI]\n        Dashboard \u003c--> Core\n        Core --> Skills[Skills Engine]\n        Core --> Memory[Memory Store]\n    end\n\n    subgraph \"Autonomous Execution\"\n        Core --> Lane[Execution Lane]\n        Core --> Tools[Terminal/File Tools]\n    end\u003c/div>\n\u003ch2>Key components\u003c/h2>\n\u003ch3>1. Neural Core (central session)\u003c/h3>\n\u003cp>The brain of the system. Built in FastAPI, it manages requests, compresses context and decides which persona should respond.\u003c/p>\n\u003ch3>2. Execution Lanes\u003c/h3>\n\u003cp>A key concept inspired by OpenClaw. Each user gets an execution lane, ensuring the agent does not try to edit the same file in two parallel tasks and reducing I/O conflicts.\u003c/p>\n\u003ch3>3. Provider-agnostic design\u003c/h3>\n\u003cp>The core does not depend on a single model. It uses a cascading fallback strategy:\u003c/p>\n\u003col>\u003cli>Try the primary API.\u003c/li> \u003cli>If quota or availability fails, try fallback providers.\u003c/li> \u003cli>If that also fails, activate browser-based execution.\u003c/li> \u003cli>As a last resort, hand off through the Antigravity bridge.\u003c/li>\u003c/ol>\n\u003ch3>4. Skills Engine\u003c/h3>\n\u003cp>Skills live under \u003ccode>.agent/skills/\u003c/code>. Each skill is an isolated Python module that the agent can load to expand its capabilities without restarting the runtime.\u003c/p>", "body_html_ja_jp": "\u003ch1>Ronaldinho アーキテクチャ概観\u003c/h1>\n\u003cp>Ronaldinho Agent はモノリスではありません。実行制御を失わずに自律性を実現するため、サービス群と知能レイヤを組み合わせたオーケストレーションです。\u003c/p>\n\u003ch2>フローダイアグラム\u003c/h2>\n\u003cdiv class=\"mermaid\">graph TD\n    User([ユーザー]) --> |Telegram| Bridge[Neural Bridge]\n    User --> |Browser| Dashboard[OpenClaw Dashboard]\n\n    subgraph \"Intelligence Layer\"\n        Bridge \u003c--> Core[Neural Core - FastAPI]\n        Dashboard \u003c--> Core\n        Core --> Skills[Skills Engine]\n        Core --> Memory[Memory Store]\n    end\n\n    subgraph \"Autonomous Execution\"\n        Core --> Lane[Execution Lane]\n        Core --> Tools[Terminal/File Tools]\n    end\u003c/div>\n\u003ch2>主要コンポーネント\u003c/h2>\n\u003ch3>1. Neural Core（中央セッション）\u003c/h3>\n\u003cp>システムの頭脳です。FastAPI で構築され、リクエスト管理、文脈圧縮、どの persona が応答すべきかの判断を担います。\u003c/p>\n\u003ch3>2. Execution Lanes\u003c/h3>\n\u003cp>OpenClaw に着想を得た重要概念です。各ユーザーに専用 lane を与えることで、エージェントが並列タスクで同じファイルを同時編集しようとするのを防ぎ、I/O 競合を減らします。\u003c/p>\n\u003ch3>3. Provider 非依存設計\u003c/h3>\n\u003cp>Core は単一モデルに依存しません。段階的 fallback 戦略を用います。\u003c/p>\n\u003col>\u003cli>まず primary API を試す。\u003c/li> \u003cli>quota や可用性で失敗したら fallback provider を試す。\u003c/li> \u003cli>それでも失敗したら browser ベース実行へ切り替える。\u003c/li> \u003cli>最後の手段として Antigravity bridge に委譲する。\u003c/li>\u003c/ol>\n\u003ch3>4. Skills Engine\u003c/h3>\n\u003cp>skill は \u003ccode>.agent/skills/\u003c/code> 配下にあり、各 skill は独立した Python module です。ランタイムを再起動せずに能力を拡張できます。\u003c/p>"}]</script>

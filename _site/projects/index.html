rd does not need to understand raw processing, and the read layer can answer quickly even while ingestion is under heavy load.\u003c/p>\n\u003ch2>What I try to preserve\u003c/h2>\n\u003cul>\u003cli>data traceability;\u003c/li> \u003cli>stable consumption contracts;\u003c/li> \u003cli>a clear boundary between spatial computation and business rules.\u003c/li>\u003c/ul>\n\u003cp>The same logic of separating write, read and decision-making tends to reappear in almost every system that scales well.\u003c/p>", "body_html_ja_jp": "\u003ch1>GIS を不透明なシステムにする必要はない\u003c/h1>\n\u003cp>地理空間システムは、パース、変換、ビジネスルール、座標投影、運用レポートを同じサービスに積み上げがちです。しばらくは動きますが、長くは持ちません。\u003c/p>\n\u003ch2>巨大エンドポイントよりパイプライン\u003c/h2>\n\u003cp>より持続可能なのは、フローを段階に分けることです。\u003c/p>\n\u003cul>\u003cli>データ取り込み\u003c/li> \u003cli>正規化と検証\u003c/li> \u003cli>エンリッチメントとジオコーディング\u003c/li> \u003cli>運用向け読み取りへの投影\u003c/li> \u003cli>ダッシュボード、API、アラートへの配信\u003c/li>\u003c/ul>\n\u003ch2>なぜ重要か\u003c/h2>\n\u003cp>この設計では、各段階が独自の意味を持ち、失敗も読みやすくなります。ダッシュボードは生の処理を理解する必要がなく、読み取りレイヤは取り込み負荷が高い間でも高速に応答できます。\u003c/p>\n\u003ch2>私が守りたいもの\u003c/h2>\n\u003cul>\u003cli>データのトレーサビリティ\u003c/li> \u003cli>消費側の安定した契約\u003c/li> \u003cli>空間計算とビジネスルールの明確な境界\u003c/li>\u003c/ul>\n\u003cp>書き込み、読み取り、意思決定を分けるという考え方は、うまくスケールするほぼすべてのシステムで繰り返し現れます。\u003c/p>"}, {"id": "post-primeiro-post", "kind": "post", "name": "Bem-vindo ao meu novo blog", "headline": "O ponto de partida do Technical Knowledge OS: um notebook de engenharia versionado, focado em arquitetura, sistemas distribuídos e documentação viva.", "summary": "O ponto de partida do Technical Knowledge OS: um notebook de engenharia versionado, focado em arquitetura, sistemas distribuídos e documentação viva.", "status": "production", "stack": ["pessoal", "anuncio", "projeto"], "url": "/posts/20260312-090000-primeiro-post/", "resolved_url": "https://nhmatsumoto.github.io/posts/20260312-090000-primeiro-post/", "repo_url": "https://github.com/nhmatsumoto/nhmatsumoto.github.io", "has_math": false, "body_html": "\u003ch1>Bem-vindo ao Technical Knowledge OS v2\u003c/h1>\n\u003cp>Este é o primeiro post do novo formato do blog. A proposta continua simples no runtime, mas agora a superfície do site é organizada como um \u003cstrong>notebook técnico\u003c/strong>: publicações, projetos, documentos e decisões arquiteturais (ADRs) vivendo em um ecossistema integrado.\u003c/p>\n\u003ch2>O que muda nesta versão\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Sistemas como Ativos\u003c/strong>: Projetos agora possuem fluxos de arquitetura interativos e leitores de seção dedicados.\u003c/li> \u003cli>\u003cstrong>SSG Otimizado\u003c/strong>: Carregamento condicional de scripts pesados (Canvas/D3) para manter a performance em 100/100.\u003c/li> \u003cli>\u003cstrong>Identidade Moderna\u003c/strong>: Design system baseado em tokens HSL, tipografia premium e suporte nativo a internacionalização (PT-BR/EN-US).\u003c/li> \u003cli>\u003cstrong>Notebook de Engenharia\u003c/strong>: O conteúdo reflete o fluxo real de desenvolvimento, não apenas textos isolados.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap de Conteúdo\u003c/h2>\n\u003col>\u003cli>Notas profundas sobre \u003cstrong>arquitetura de software\u003c/strong> e modelagem de domínio (DDD).\u003c/li> \u003cli>Publicações sobre \u003cstrong>agentes inteligentes\u003c/strong>, ecossistemas .NET e sistemas geoespaciais (GIS).\u003c/li> \u003cli>Documentação viva e experimental de sistemas em produção.\u003c/li>\u003c/ol>\n\u003cp>Este espaço foi construído para ser a minha memória técnica externa — organizada, versionada e sempre acessível.\u003c/p>", "title_en_us": "Welcome to My New Blog", "title_ja_jp": "新しいブログへようこそ", "summary_en_us": "The starting point of Technical Knowledge OS: a versioned engineering notebook focused on architecture, distributed systems and living documentation.", "summary_ja_jp": "Technical Knowledge OS の出発点：アーキテクチャ、分散システム、生きたドキュメンテーションに焦点を当てた、バージョン管理されたエンジニアリング・ノートブック。", "body_html_en_us": "\u003ch1>Welcome to Technical Knowledge OS v2\u003c/h1>\n\u003cp>This is the first post in the blog&#x27;s new format. The runtime remains deliberately simple, but the site surface is now organized as a \u003cstrong>technical notebook\u003c/strong>: publications, projects, documents and architectural decisions (ADRs) living inside one integrated ecosystem.\u003c/p>\n\u003ch2>What changes in this version\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Systems as Assets\u003c/strong>: projects now have interactive architecture flows and dedicated section readers.\u003c/li> \u003cli>\u003cstrong>Optimized SSG\u003c/strong>: conditional loading of heavy scripts (Canvas/D3) to keep performance at 100/100.\u003c/li> \u003cli>\u003cstrong>Modern Identity\u003c/strong>: design system based on HSL tokens, premium typography and native internationalization support (PT-BR/EN-US).\u003c/li> \u003cli>\u003cstrong>Engineering Notebook\u003c/strong>: content reflects the real development flow, not just isolated texts.\u003c/li>\u003c/ul>\n\u003ch2>Content roadmap\u003c/h2>\n\u003col>\u003cli>Deep notes on \u003cstrong>software architecture\u003c/strong> and domain modeling (DDD).\u003c/li> \u003cli>Publications about \u003cstrong>intelligent agents\u003c/strong>, the .NET ecosystem and geospatial systems (GIS).\u003c/li> \u003cli>Living and experimental documentation for systems in production.\u003c/li>\u003c/ol>\n\u003cp>This space was built to be my external technical memory: organized, versioned and always accessible.\u003c/p>", "body_html_ja_jp": "\u003ch1>Technical Knowledge OS v2 へようこそ\u003c/h1>\n\u003cp>これはブログ新フォーマットでの最初の投稿です。ランタイムは引き続き意図的にシンプルなままですが、サイト全体は \u003cstrong>技術ノートブック\u003c/strong> として再構成されました。publications、projects、documents、そして architectural decisions (ADR) が、ひとつの統合されたエコシステムの中で共存します。\u003c/p>\n\u003ch2>このバージョンで変わること\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Systems as Assets\u003c/strong>: プロジェクトにインタラクティブなアーキテクチャフローと専用セクションリーダーを追加。\u003c/li> \u003cli>\u003cstrong>Optimized SSG\u003c/strong>: 重いスクリプト（Canvas/D3）を条件付きで読み込み、性能を 100/100 に維持。\u003c/li> \u003cli>\u003cstrong>Modern Identity\u003c/strong>: HSL トークン、上質なタイポグラフィ、ネイティブな国際化サポート（PT-BR/EN-US）を備えたデザインシステム。\u003c/li> \u003cli>\u003cstrong>Engineering Notebook\u003c/strong>: コンテンツが孤立した文章ではなく、実際の開発フローを反映する。\u003c/li>\u003c/ul>\n\u003ch2>コンテンツのロードマップ\u003c/h2>\n\u003col>\u003cli>\u003cstrong>ソフトウェアアーキテクチャ\u003c/strong> とドメインモデリング（DDD）に関する深いノート。\u003c/li> \u003cli>\u003cstrong>知的エージェント\u003c/strong>、.NET エコシステム、地理空間システム（GIS）に関する公開記事。\u003c/li> \u003cli>本番システムに対する生きた実験的ドキュメンテーション。\u003c/li>\u003c/ol>\n\u003cp>この場所は、私の外部技術記憶として作られました。整理され、バージョン管理され、いつでも参照できます。\u003c/p>"}, {"id": "project-sos-location", "kind": "project", "status": "research", "stack": ["TypeScript", "Node.js", "GIS", "Event-Driven"], "url": "/projects/sos-location/", "resolved_url": "https://nhmatsumoto.github.io/projects/sos-location/", "repo_url": "https://github.com/nhmatsumoto/sos_location", "has_math": false, "name": "SOS Location", "headline": "Plataforma open-source para monitorar, mapear e coordenar a resposta a desastres naturais.", "summary": "Plataforma para gestão de desastres que integra dados geoespaciais, clima e recursos humanitários em tempo real.", "body_html": "\u003cp>SOS Location é uma iniciativa de resposta humanitária focada no uso de tecnologia geoespacial para acelerar a tomada de decisão em cenários de crise. O projeto organiza camadas de dados complexas em uma interface operacional simples.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Em desastres, a fragmentação da informação custa vidas. A solução centraliza feeds de clima, áreas de risco e recursos disponíveis, utilizando processamento assíncrono para manter a atualização constante sem sobrecarregar o sistema.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Baseado em pipelines de eventos, o sistema separa a ingestão de dados (sensores, APIs externas) do processamento geoespacial e da camada de visualização em tempo real (WebSockets/Leaflet).\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Uso de GeoJSON como padrão de intercâmbio de dados.\u003c/li> \u003cli>Arquitetura orientada a eventos para garantir escalabilidade em picos de uso.\u003c/li> \u003cli>Isolamento de serviços de geolocalização para resiliência operacional.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Integração com imagens de satélite para análise de inundação.\u003c/li> \u003cli>Expansão do modelo de predição de risco usando machine learning.\u003c/li> \u003cli>Suporte a offline-first para equipes de campo.\u003c/li> \u003cli>Publicações SOS Location: regras de negócio, fluxo e stack técnico.\u003c/li>\u003c/ul>", "name_en_us": "SOS Location", "name_ja_jp": "SOSロケーション", "headline_en_us": "Open-source platform for monitoring, mapping and coordinating natural disaster response.", "headline_ja_jp": "自然災害対応の監視・マッピング・調整を行うオープンソース・プラットフォーム。", "summary_en_us": "Disaster management platform that integrates geospatial data, weather and humanitarian resources in real time.", "summary_ja_jp": "地理空間データ、気象情報、人道支援リソースをリアルタイムで統合する災害管理プラットフォーム。", "body_html_en_us": "\u003cp>SOS Location is a humanitarian-response initiative focused on using geospatial technology to accelerate decision-making in crisis scenarios. The project organizes complex data layers into a simple operational interface.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>In disasters, fragmented information costs lives. The platform centralizes weather feeds, risk areas and available resources, using asynchronous processing to keep everything updated without overwhelming the system.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Built on event pipelines, the system separates data ingestion (sensors and external APIs), geospatial processing and the real-time visualization layer based on WebSockets and Leaflet.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Use GeoJSON as the standard data-exchange format.\u003c/li> \u003cli>Adopt an event-driven architecture to absorb peak usage safely.\u003c/li> \u003cli>Isolate geolocation services for operational resilience.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Integrate satellite imagery for flood analysis.\u003c/li> \u003cli>Expand the risk-prediction model with machine learning.\u003c/li> \u003cli>Add offline-first support for field teams.\u003c/li> \u003cli>Publish SOS Location notes on business rules, flow architecture and stack.\u003c/li>\u003c/ul>", "body_html_en": "\u003cp>SOS Location is a humanitarian-response initiative focused on using geospatial technology to accelerate decision-making in crisis scenarios. The project organizes complex data layers into a simple operational interface.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>In disasters, fragmented information costs lives. The platform centralizes weather feeds, risk areas and available resources, using asynchronous processing to keep everything updated without overwhelming the system.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Built on event pipelines, the system separates data ingestion (sensors and external APIs), geospatial processing and the real-time visualization layer based on WebSockets and Leaflet.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Use GeoJSON as the standard data-exchange format.\u003c/li> \u003cli>Adopt an event-driven architecture to absorb peak usage safely.\u003c/li> \u003cli>Isolate geolocation services for operational resilience.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Integrate satellite imagery for flood analysis.\u003c/li> \u003cli>Expand the risk-prediction model with machine learning.\u003c/li> \u003cli>Add offline-first support for field teams.\u003c/li> \u003cli>Publish SOS Location notes on business rules, flow architecture and stack.\u003c/li>\u003c/ul>", "body_html_ja_jp": "\u003cp>SOS Location は、危機時の意思決定を加速するために地理空間技術を活用する人道対応イニシアチブです。複雑なデータレイヤを、現場で扱いやすいシンプルな運用インターフェースに整理します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>災害時には、情報の分断がそのまま命の損失につながります。このプラットフォームは、気象フィード、危険領域、利用可能リソースを集中化し、非同期処理によってシステムを過負荷にせず更新を維持します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>イベント・パイプラインを基盤にし、データ取り込み（センサー・外部 API）、地理空間処理、WebSockets / Leaflet によるリアルタイム可視化レイヤを分離しています。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>GeoJSON を標準のデータ交換形式として採用する。\u003c/li> \u003cli>ピーク負荷に耐えるため event-driven architecture を採用する。\u003c/li> \u003cli>運用レジリエンスのために geolocation service を分離する。\u003c/li>\u003c/ul>\n\u003ch2>ロードマップ\u003c/h2>\n\u003cul>\u003cli>洪水解析のために衛星画像を統合する。\u003c/li> \u003cli>機械学習でリスク予測モデルを拡張する。\u003c/li> \u003cli>現場チーム向けに offline-first 対応を追加する。\u003c/li> \u003cli>SOS Location の業務ルール、フロー、技術スタックを公開する。\u003c/li>\u003c/ul>", "body_html_ja": "\u003cp>SOS Location は、危機時の意思決定を加速するために地理空間技術を活用する人道対応イニシアチブです。複雑なデータレイヤを、現場で扱いやすいシンプルな運用インターフェースに整理します。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>災害時には、情報の分断がそのまま命の損失につながります。このプラットフォームは、気象フィード、危険領域、利用可能リソースを集中化し、非同期処理によってシステムを過負荷にせず更新を維持します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>イベント・パイプラインを基盤にし、データ取り込み（センサー・外部 API）、地理空間処理、WebSockets / Leaflet によるリアルタイム可視化レイヤを分離しています。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>GeoJSON を標準のデータ交換形式として採用する。\u003c/li> \u003cli>ピーク負荷に耐えるため event-driven architecture を採用する。\u003c/li> \u003cli>運用レジリエンスのために geolocation service を分離する。\u003c/li>\u003c/ul>\n\u003ch2>ロードマップ\u003c/h2>\n\u003cul>\u003cli>洪水解析のために衛星画像を統合する。\u003c/li> \u003cli>機械学習でリスク予測モデルを拡張する。\u003c/li> \u003cli>現場チーム向けに offline-first 対応を追加する。\u003c/li> \u003cli>SOS Location の業務ルール、フロー、技術スタックを公開する。\u003c/li>\u003c/ul>"}, {"id": "project-nhmatsumoto-github-io", "kind": "project", "status": "research", "stack": ["Python", "Three.js", "HTML", "CSS", "GitHub Pages"], "url": "/projects/nhmatsumoto-github-io/", "resolved_url": "https://nhmatsumoto.github.io/projects/nhmatsumoto-github-io/", "repo_url": "https://github.com/nhmatsumoto/nhmatsumoto.github.io", "has_math": false, "name": "nhmatsumoto.github.io", "headline": "Technical Knowledge OS — blog e portfolio com engine de geração estática e visualização 3D interativa.", "summary": "Site pessoal e Technical Knowledge OS: engine de geração estática em Python, visualização 3D interativa com Three.js, sistema de grafo de conhecimento e deploy via GitHub Pages.", "body_html": "\u003cp>Este é o repositório do Technical Knowledge OS — o site que você está usando agora. Uma plataforma de publicação técnica construída do zero com um engine de geração estática em Python e visualização 3D interativa.\u003c/p>\n\u003ch2>Arquitetura do engine\u003c/h2>\n\u003cp>O engine de geração estática processa conteúdo em TOML, renderiza markdown para HTML e gera um site completo com:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Posts\u003c/strong> — artigos técnicos com suporte a math (AsciiMath), Mermaid, code blocks e tabelas\u003c/li> \u003cli>\u003cstrong>Projetos\u003c/strong> — portfolio com dados estruturados e visualização interativa\u003c/li> \u003cli>\u003cstrong>Documentos\u003c/strong> — especificações técnicas com versionamento\u003c/li> \u003cli>\u003cstrong>i18n\u003c/strong> — suporte a internacionalização multi-idioma\u003c/li> \u003cli>\u003cstrong>Busca\u003c/strong> — índice JSON para search client-side\u003c/li>\u003c/ul>\n\u003ch2>Visualização 3D\u003c/h2>\n\u003cp>A página de projetos utiliza Three.js para renderizar um grafo 3D interativo onde cada nó representa um projeto, post ou documento. O grafo inclui:\u003c/p>\n\u003cul>\u003cli>Starfield com 4000 partículas\u003c/li> \u003cli>Nós de vidro com efeitos de glow e órbitas\u003c/li> \u003cli>Conexões bezier entre nós\u003c/li> \u003cli>Painel de detalhes com navegação\u003c/li> \u003cli>Reader mode para leitura de conteúdo inline\u003c/li>\u003c/ul>\n\u003ch2>Deploy\u003c/h2>\n\u003cp>GitHub Actions executa o build em cada push ao master e deploya o resultado no GitHub Pages automaticamente.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Plataformas de blog existentes são genéricas demais para um portfolio técnico que precisa de visualizações interativas, suporte a fórmulas matemáticas e controle total sobre o design. O Technical Knowledge OS resolve isso com um engine customizado que trata conteúdo como domínio.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Engine Python modular: loader (TOML → dict), renderer (dict → HTML), generator (orquestração). Assets estáticos (CSS, JS) são copiados e servidos diretamente. Three.js carregado via importmap para a visualização 3D. GitHub Actions para CI/CD.\u003c/p>", "headline_en_us": "Technical Knowledge OS — blog and portfolio with a static site engine and interactive 3D visualization.", "headline_ja_jp": "Technical Knowledge OS — 静的サイト生成エンジンとインタラクティブ 3D 可視化を備えたブログ兼ポートフォリオ。", "summary_en_us": "Personal site and Technical Knowledge OS: static site engine in Python, interactive 3D visualization with Three.js, knowledge graph system and deploy via GitHub Pages.", "summary_ja_jp": "個人サイト兼 Technical Knowledge OS。Python による静的サイト生成、Three.js を用いた 3D インタラクティブ可視化、知識グラフ、GitHub Pages での配信。", "body_html_en_us": "\u003cp>This is the Technical Knowledge OS repository — the site you are using right now. A technical-publishing platform built from scratch with a Python static-site engine and an interactive 3D visualization layer.\u003c/p>\n\u003ch2>Engine architecture\u003c/h2>\n\u003cp>The static-site engine processes TOML content, renders markdown to HTML and outputs a complete site with:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Posts\u003c/strong> — technical articles with support for math, Mermaid, code blocks and tables\u003c/li> \u003cli>\u003cstrong>Projects\u003c/strong> — a portfolio backed by structured data and an interactive viewer\u003c/li> \u003cli>\u003cstrong>Documents\u003c/strong> — technical specs with versioned publication\u003c/li> \u003cli>\u003cstrong>i18n\u003c/strong> — multi-language content support\u003c/li> \u003cli>\u003cstrong>Search\u003c/strong> — a client-side JSON index\u003c/li>\u003c/ul>\n\u003ch2>3D visualization\u003c/h2>\n\u003cp>The projects page uses Three.js to render an interactive 3D graph where each node represents a project, post or document. The graph includes:\u003c/p>\n\u003cul>\u003cli>A starfield with 4,000 particles\u003c/li> \u003cli>Glass-like nodes with glow and orbit effects\u003c/li> \u003cli>Bezier connections between nodes\u003c/li> \u003cli>A detail panel with navigation\u003c/li> \u003cli>Reader mode for inline content\u003c/li>\u003c/ul>\n\u003ch2>Deploy\u003c/h2>\n\u003cp>GitHub Actions runs the build on every push to \u003ccode>master\u003c/code> and deploys the generated output to GitHub Pages automatically.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Existing blog platforms are too generic for a technical portfolio that needs interactive visualization, math rendering and full control over design and structure. Technical Knowledge OS solves that by treating content as a first-class domain.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Modular Python engine: loader (TOML → dict), renderer (dict → HTML) and generator (orchestration). Static assets are copied directly. Three.js is loaded through import maps for the 3D graph, and GitHub Actions handles CI/CD.\u003c/p>", "body_html_en": "\u003cp>This is the Technical Knowledge OS repository — the site you are using right now. A technical-publishing platform built from scratch with a Python static-site engine and an interactive 3D visualization layer.\u003c/p>\n\u003ch2>Engine architecture\u003c/h2>\n\u003cp>The static-site engine processes TOML content, renders markdown to HTML and outputs a complete site with:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Posts\u003c/strong> — technical articles with support for math, Mermaid, code blocks and tables\u003c/li> \u003cli>\u003cstrong>Projects\u003c/strong> — a portfolio backed by structured data and an interactive viewer\u003c/li> \u003cli>\u003cstrong>Documents\u003c/strong> — technical specs with versioned publication\u003c/li> \u003cli>\u003cstrong>i18n\u003c/strong> — multi-language content support\u003c/li> \u003cli>\u003cstrong>Search\u003c/strong> — a client-side JSON index\u003c/li>\u003c/ul>\n\u003ch2>3D visualization\u003c/h2>\n\u003cp>The projects page uses Three.js to render an interactive 3D graph where each node represents a project, post or document. The graph includes:\u003c/p>\n\u003cul>\u003cli>A starfield with 4,000 particles\u003c/li> \u003cli>Glass-like nodes with glow and orbit effects\u003c/li> \u003cli>Bezier connections between nodes\u003c/li> \u003cli>A detail panel with navigation\u003c/li> \u003cli>Reader mode for inline content\u003c/li>\u003c/ul>\n\u003ch2>Deploy\u003c/h2>\n\u003cp>GitHub Actions runs the build on every push to \u003ccode>master\u003c/code> and deploys the generated output to GitHub Pages automatically.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Existing blog platforms are too generic for a technical portfolio that needs interactive visualization, math rendering and full control over design and structure. Technical Knowledge OS solves that by treating content as a first-class domain.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Modular Python engine: loader (TOML → dict), renderer (dict → HTML) and generator (orchestration). Static assets are copied directly. Three.js is loaded through import maps for the 3D graph, and GitHub Actions handles CI/CD.\u003c/p>", "body_html_ja_jp": "\u003cp>これは、今見ているサイトそのもの、Technical Knowledge OS のリポジトリです。Python 製の静的サイトエンジンとインタラクティブな 3D 可視化レイヤでゼロから構築した技術出版プラットフォームです。\u003c/p>\n\u003ch2>エンジンのアーキテクチャ\u003c/h2>\n\u003cp>静的サイト・エンジンは TOML コンテンツを処理し、markdown を HTML に変換して、次を備えた完全なサイトを出力します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Posts\u003c/strong> — 数式、Mermaid、code block、表を含む技術記事\u003c/li> \u003cli>\u003cstrong>Projects\u003c/strong> — 構造化データと対話型ビューアを備えたポートフォリオ\u003c/li> \u003cli>\u003cstrong>Documents\u003c/strong> — バージョン付き公開が可能な技術仕様\u003c/li> \u003cli>\u003cstrong>i18n\u003c/strong> — 多言語対応\u003c/li> \u003cli>\u003cstrong>Search\u003c/strong> — クライアント側 JSON インデックス\u003c/li>\u003c/ul>\n\u003ch2>3D 可視化\u003c/h2>\n\u003cp>projects ページでは Three.js を使い、各ノードが project、post、document を表す 3D グラフを描画します。主な要素は次の通りです。\u003c/p>\n\u003cul>\u003cli>4,000 パーティクルの starfield\u003c/li> \u003cli>ガラス調ノードと glow / orbit エフェクト\u003c/li> \u003cli>ノード間の Bezier 接続\u003c/li> \u003cli>ナビゲーション付き detail panel\u003c/li> \u003cli>inline 読書のための reader mode\u003c/li>\u003c/ul>\n\u003ch2>デプロイ\u003c/h2>\n\u003cp>GitHub Actions が \u003ccode>master\u003c/code> への各 push ごとに build を実行し、生成物を GitHub Pages へ自動デプロイします。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>既存のブログ基盤は、インタラクティブ可視化、数式表示、設計と構造への完全な制御を必要とする技術ポートフォリオには汎用的すぎます。Technical Knowledge OS は、コンテンツを第一級のドメインとして扱うことでそれを解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>モジュール化された Python エンジンで、loader（TOML → dict）、renderer（dict → HTML）、generator（オーケストレーション）に分かれています。静的アセットはそのままコピーされ、3D グラフには import map 経由で Three.js を読み込みます。CI/CD は GitHub Actions が担当します。\u003c/p>", "body_html_ja": "\u003cp>これは、今見ているサイトそのもの、Technical Knowledge OS のリポジトリです。Python 製の静的サイトエンジンとインタラクティブな 3D 可視化レイヤでゼロから構築した技術出版プラットフォームです。\u003c/p>\n\u003ch2>エンジンのアーキテクチャ\u003c/h2>\n\u003cp>静的サイト・エンジンは TOML コンテンツを処理し、markdown を HTML に変換して、次を備えた完全なサイトを出力します。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Posts\u003c/strong> — 数式、Mermaid、code block、表を含む技術記事\u003c/li> \u003cli>\u003cstrong>Projects\u003c/strong> — 構造化データと対話型ビューアを備えたポートフォリオ\u003c/li> \u003cli>\u003cstrong>Documents\u003c/strong> — バージョン付き公開が可能な技術仕様\u003c/li> \u003cli>\u003cstrong>i18n\u003c/strong> — 多言語対応\u003c/li> \u003cli>\u003cstrong>Search\u003c/strong> — クライアント側 JSON インデックス\u003c/li>\u003c/ul>\n\u003ch2>3D 可視化\u003c/h2>\n\u003cp>projects ページでは Three.js を使い、各ノードが project、post、document を表す 3D グラフを描画します。主な要素は次の通りです。\u003c/p>\n\u003cul>\u003cli>4,000 パーティクルの starfield\u003c/li> \u003cli>ガラス調ノードと glow / orbit エフェクト\u003c/li> \u003cli>ノード間の Bezier 接続\u003c/li> \u003cli>ナビゲーション付き detail panel\u003c/li> \u003cli>inline 読書のための reader mode\u003c/li>\u003c/ul>\n\u003ch2>デプロイ\u003c/h2>\n\u003cp>GitHub Actions が \u003ccode>master\u003c/code> への各 push ごとに build を実行し、生成物を GitHub Pages へ自動デプロイします。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>既存のブログ基盤は、インタラクティブ可視化、数式表示、設計と構造への完全な制御を必要とする技術ポートフォリオには汎用的すぎます。Technical Knowledge OS は、コンテンツを第一級のドメインとして扱うことでそれを解決します。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>モジュール化された Python エンジンで、loader（TOML → dict）、renderer（dict → HTML）、generator（オーケストレーション）に分かれています。静的アセットはそのままコピーされ、3D グラフには import map 経由で Three.js を読み込みます。CI/CD は GitHub Actions が担当します。\u003c/p>"}, {"id": "project-splitcosts", "kind": "project", "status": "research", "stack": [".NET", "React", "PostgreSQL", "multi-tenant architecture"], "url": "/projects/splitcosts/", "resolved_url": "https://nhmatsumoto.github.io/projects/splitcosts/", "repo_url": "", "has_math": false, "name": "SplitCosts", "headline": "Compartilhamento de despesas com foco em clareza, fronteiras de tenancy e simplicidade operacional.", "summary": "Aplicação de gestão financeira doméstica com foco em multi-tenant, UX e consistência operacional.", "body_html": "\u003cp>SplitCosts nasceu para resolver um problema simples sem cair em uma solução rasa: compartilhar despesas com contexto, histórico e separação clara entre grupos e usuários.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>O desafio não era apenas registrar gastos. Era manter legibilidade do domínio, evitar acoplamento entre tenants e sustentar evolução de produto sem reescrever a base a cada ajuste de regra.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>A solução segue uma linha mais pragmática: fronteiras explícitas no domínio, projeções simples para leitura e um backend pensado para crescer por contexto, não por páginas.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>api -&gt; domain -&gt; projections\n |       |          |\nui &lt;-- tenancy --&gt; db\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Stack &amp; Tecnologias\u003c/h2>\n\u003cp>Mesmo sendo um produto mais tradicional, ele reforça os mesmos princípios que aparecem nos projetos com agentes: contratos claros, linguagem ubíqua e separação entre escrita e leitura.\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Separar contexto de tenancy das regras de compartilhamento.\u003c/li> \u003cli>Usar projeções simples para telas operacionais e relatórios rápidos.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Fechar modelo de recorrência e conciliação.\u003c/li> \u003cli>Aprimorar visibilidade de auditoria para alterações críticas.\u003c/li>\u003c/ul>", "headline_en_us": "Expense sharing focused on clarity, tenancy boundaries and operational simplicity.", "headline_ja_jp": "明瞭さ、テナント境界、運用上のシンプルさに焦点を置いた支出分担アプリ。", "summary_en_us": "Household finance management application with focus on multi-tenant, UX and operational consistency.", "summary_ja_jp": "マルチテナント、UX、運用一貫性を重視した家計管理アプリケーション。", "body_html_en_us": "\u003cp>SplitCosts was created to solve a simple problem without falling into a shallow solution: sharing expenses while preserving context, history and a clear separation between groups and users.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>The challenge was not only recording spending. It was preserving domain legibility, avoiding tenant coupling and allowing the product to evolve without rewriting the base whenever a business rule changed.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>The solution follows a pragmatic line: explicit domain boundaries, simple read projections and a backend designed to grow by context rather than by page count.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>api -&gt; domain -&gt; projections\n |       |          |\nui &lt;-- tenancy --&gt; db\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Stack &amp; Technologies\u003c/h2>\n\u003cp>Even though it is a more traditional product, it reinforces the same principles seen in the agent projects: clear contracts, ubiquitous language and separation between write and read concerns.\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Separate tenancy context from expense-sharing rules.\u003c/li> \u003cli>Use simple projections for operational screens and fast reports.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Finalize the recurrence and reconciliation model.\u003c/li> \u003cli>Improve audit visibility for critical changes.\u003c/li>\u003c/ul>", "body_html_en": "\u003cp>SplitCosts was created to solve a simple problem without falling into a shallow solution: sharing expenses while preserving context, history and a clear separation between groups and users.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>The challenge was not only recording spending. It was preserving domain legibility, avoiding tenant coupling and allowing the product to evolve without rewriting the base whenever a business rule changed.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>The solution follows a pragmatic line: explicit domain boundaries, simple read projections and a backend designed to grow by context rather than by page count.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>api -&gt; domain -&gt; projections\n |       |          |\nui &lt;-- tenancy --&gt; db\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Stack &amp; Technologies\u003c/h2>\n\u003cp>Even though it is a more traditional product, it reinforces the same principles seen in the agent projects: clear contracts, ubiquitous language and separation between write and read concerns.\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Separate tenancy context from expense-sharing rules.\u003c/li> \u003cli>Use simple projections for operational screens and fast reports.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Finalize the recurrence and reconciliation model.\u003c/li> \u003cli>Improve audit visibility for critical changes.\u003c/li>\u003c/ul>", "body_html_ja_jp": "\u003cp>SplitCosts は、単純な問題を浅い解法で終わらせないために生まれました。支出を共有しつつ、文脈、履歴、そしてグループとユーザーの明確な分離を保つことが狙いです。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>課題は単に支出を記録することではありません。ドメインの読みやすさを保ち、tenant 間の結合を避け、ルール変更のたびに土台を作り直さずに製品を進化させることでした。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>解決策は実務的です。明示的なドメイン境界、シンプルな read projection、そしてページ単位ではなく文脈単位で成長できるバックエンドを採用しました。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>api -&gt; domain -&gt; projections\n |       |          |\nui &lt;-- tenancy --&gt; db\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>スタック &amp; テクノロジー\u003c/h2>\n\u003cp>より伝統的なプロダクトでありながら、エージェント系プロジェクトと同じ原則を再確認させます。明確な契約、ユビキタス言語、そして書き込みと読み取りの分離です。\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>tenancy の文脈を支出共有ルールから分離する。\u003c/li> \u003cli>運用画面と高速レポートには単純な projection を使う。\u003c/li>\u003c/ul>\n\u003ch2>ロードマップ\u003c/h2>\n\u003cul>\u003cli>定期支出と精算モデルを仕上げる。\u003c/li> \u003cli>重要変更に対する監査可視性を高める。\u003c/li>\u003c/ul>", "body_html_ja": "\u003cp>SplitCosts は、単純な問題を浅い解法で終わらせないために生まれました。支出を共有しつつ、文脈、履歴、そしてグループとユーザーの明確な分離を保つことが狙いです。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>課題は単に支出を記録することではありません。ドメインの読みやすさを保ち、tenant 間の結合を避け、ルール変更のたびに土台を作り直さずに製品を進化させることでした。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>解決策は実務的です。明示的なドメイン境界、シンプルな read projection、そしてページ単位ではなく文脈単位で成長できるバックエンドを採用しました。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>api -&gt; domain -&gt; projections\n |       |          |\nui &lt;-- tenancy --&gt; db\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>スタック &amp; テクノロジー\u003c/h2>\n\u003cp>より伝統的なプロダクトでありながら、エージェント系プロジェクトと同じ原則を再確認させます。明確な契約、ユビキタス言語、そして書き込みと読み取りの分離です。\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>tenancy の文脈を支出共有ルールから分離する。\u003c/li> \u003cli>運用画面と高速レポートには単純な projection を使う。\u003c/li>\u003c/ul>\n\u003ch2>ロードマップ\u003c/h2>\n\u003cul>\u003cli>定期支出と精算モデルを仕上げる。\u003c/li> \u003cli>重要変更に対する監査可視性を高める。\u003c/li>\u003c/ul>"}, {"id": "project-gis-incident-lab", "kind": "project", "status": "research", "stack": ["Python", ".NET", "GIS", "event-driven services"], "url": "/projects/gis-incident-lab/", "resolved_url": "https://nhmatsumoto.github.io/projects/gis-incident-lab/", "repo_url": "", "has_math": false, "name": "GIS Incident Lab", "headline": "Mapeamento operacional para resposta a incidentes, análise de risco e pipelines espaciais.", "summary": "Laboratório aplicado a GIS, ingestão de dados geoespaciais e projeções operacionais para times de resposta.", "body_html": "\u003cp>Este laboratório consolida uma linha de trabalho com GIS orientada a operação. O foco não é só mapa: é como transformar dado espacial em leitura acionável.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Dados espaciais costumam chegar incompletos, ruidosos e caros de processar. A solução adotada é tratar cada etapa como parte de um pipeline assíncrono, com contratos explícitos entre ingestão, transformação e leitura.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>O desenho privilegia rastreabilidade e projeções operacionais. Serviços de ingestão e enriquecimento escrevem eventos; a camada de leitura consolida visualizações e sinais para equipes de resposta.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Stack &amp; Tecnologias\u003c/h2>\n\u003cp>GIS aqui é tratado como parte do produto, não como apêndice visual. Isso muda completamente a forma de modelar contratos, latência aceitável e observabilidade.\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Separar geoprocessamento bruto da camada de leitura operacional.\u003c/li> \u003cli>Modelar eventos de risco como fatos de domínio, não apenas logs técnicos.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Adicionar previews de diagrama por fluxo geoespacial.\u003c/li> \u003cli>Documentar contratos de ingestão em maior detalhe.\u003c/li>\u003c/ul>\n\u003ch2>Impacto &amp; Resultados\u003c/h2>\n\u003cul>\u003cli>Pipeline de ingestão processa 200k pontos geoespaciais em &lt;8min (antes: 45min em monólito)\u003c/li> \u003cli>Ops view atualizado em &lt;30s — equipe de campo opera com dados near real-time\u003c/li> \u003cli>3 incidentes de regressão evitados em 6 meses pela separação cálculo espacial / regra de negócio\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisões\u003c/h2>\n\u003cul>\u003cli>Pipeline assíncrono vs endpoint síncrono: latência end-to-end maior, mas resiliência e observabilidade superiores\u003c/li> \u003cli>Contratos versionados entre estágios: overhead inicial alto, mas zero breaking changes em 8 meses de operação\u003c/li> \u003cli>Event-driven exige mensageria dedicada: custo operacional +15%, mas desacoplamento total entre ingestão e leitura\u003c/li>\u003c/ul>\n\u003ch2>Lições Aprendidas\u003c/h2>\n\u003cul>\u003cli>Geocoding externo era 80% do tempo de pipeline — cache agressivo + fallback local resolveu o gargalo\u003c/li> \u003cli>Monitorar cada estágio individualmente foi o investimento com maior ROI — identificou bottlenecks invisíveis no monólito\u003c/li> \u003cli>Em cenários de crise, simplicidade de deploy supera elegância de design — scripts Python diretos salvaram vidas em Brumadinho\u003c/li>\u003c/ul>\n\u003ch2>Notas de Produção\u003c/h2>\n\u003cp>Pipeline em operação contínua desde 2024. Stack real: .NET para serviços de ingestão e normalização, Python para geoprocessamento pesado. A separação cálculo/regra permitiu que o time de dados iterasse sem impactar a API operacional. Tempo médio de resolução de incidentes GIS caiu de 4h para 45min após adoção da ops view.\u003c/p>", "headline_en_us": "Operational mapping for incident response, risk analysis and spatial pipelines.", "headline_ja_jp": "インシデント対応、リスク分析、空間パイプラインのための運用マッピング。", "summary_en_us": "Lab applied to GIS, geospatial data ingestion and operational projections for response teams.", "summary_ja_jp": "GIS、地理空間データの取り込み、対応チーム向け運用投影に特化したラボ。", "body_html_en_us": "\u003cp>This lab consolidates an operations-first GIS workstream. The focus is not only the map itself, but how to turn spatial data into actionable operational reading.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Spatial data usually arrives incomplete, noisy and expensive to process. The adopted solution treats each stage as part of an asynchronous pipeline, with explicit contracts between ingestion, transformation and read models.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>The design prioritizes traceability and operational projections. Ingestion and enrichment services publish events; the read layer consolidates views and signals for response teams.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Stack &amp; Technologies\u003c/h2>\n\u003cp>GIS is treated here as part of the product, not as a visual appendix. That completely changes how contracts, acceptable latency and observability are modeled.\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Separate raw geoprocessing from the operational read layer.\u003c/li> \u003cli>Model risk events as domain facts, not only as technical logs.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Add diagram previews for geospatial flows.\u003c/li> \u003cli>Document ingestion contracts in more detail.\u003c/li>\u003c/ul>\n\u003ch2>Impact &amp; Results\u003c/h2>\n\u003cul>\u003cli>Ingestion pipeline processes 200k geospatial points in under 8 minutes (previously 45 minutes in a monolith)\u003c/li> \u003cli>Ops view refreshes in under 30 seconds — field teams operate on near-real-time data\u003c/li> \u003cli>Three regressions avoided in 6 months by separating spatial computation from business rules\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisions\u003c/h2>\n\u003cul>\u003cli>Asynchronous pipeline vs. synchronous endpoint: higher end-to-end latency, but far better resilience and observability\u003c/li> \u003cli>Versioned contracts between stages: high upfront overhead, but zero breaking changes across 8 months of operation\u003c/li> \u003cli>Event-driven design requires dedicated messaging infrastructure: +15% operational cost, but full decoupling between ingestion and reads\u003c/li>\u003c/ul>\n\u003ch2>Lessons Learned\u003c/h2>\n\u003cul>\u003cli>External geocoding consumed 80% of pipeline time — aggressive caching and local fallback removed the bottleneck\u003c/li> \u003cli>Monitoring each stage individually delivered the highest ROI by exposing bottlenecks that were invisible in the monolith\u003c/li> \u003cli>In crisis contexts, deployment simplicity beats design elegance — direct Python scripts saved lives in Brumadinho\u003c/li>\u003c/ul>\n\u003ch2>Production Notes\u003c/h2>\n\u003cp>Pipeline in continuous production use since 2024. Real stack: .NET for ingestion and normalization services, Python for heavy geoprocessing. Separating calculation from business rules allowed the data team to iterate without affecting the operational API. Mean resolution time for GIS incidents dropped from 4 hours to 45 minutes after adopting the ops view.\u003c/p>", "body_html_en": "\u003cp>This lab consolidates an operations-first GIS workstream. The focus is not only the map itself, but how to turn spatial data into actionable operational reading.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Spatial data usually arrives incomplete, noisy and expensive to process. The adopted solution treats each stage as part of an asynchronous pipeline, with explicit contracts between ingestion, transformation and read models.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>The design prioritizes traceability and operational projections. Ingestion and enrichment services publish events; the read layer consolidates views and signals for response teams.\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>Stack &amp; Technologies\u003c/h2>\n\u003cp>GIS is treated here as part of the product, not as a visual appendix. That completely changes how contracts, acceptable latency and observability are modeled.\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>Separate raw geoprocessing from the operational read layer.\u003c/li> \u003cli>Model risk events as domain facts, not only as technical logs.\u003c/li>\u003c/ul>\n\u003ch2>Roadmap\u003c/h2>\n\u003cul>\u003cli>Add diagram previews for geospatial flows.\u003c/li> \u003cli>Document ingestion contracts in more detail.\u003c/li>\u003c/ul>\n\u003ch2>Impact &amp; Results\u003c/h2>\n\u003cul>\u003cli>Ingestion pipeline processes 200k geospatial points in under 8 minutes (previously 45 minutes in a monolith)\u003c/li> \u003cli>Ops view refreshes in under 30 seconds — field teams operate on near-real-time data\u003c/li> \u003cli>Three regressions avoided in 6 months by separating spatial computation from business rules\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisions\u003c/h2>\n\u003cul>\u003cli>Asynchronous pipeline vs. synchronous endpoint: higher end-to-end latency, but far better resilience and observability\u003c/li> \u003cli>Versioned contracts between stages: high upfront overhead, but zero breaking changes across 8 months of operation\u003c/li> \u003cli>Event-driven design requires dedicated messaging infrastructure: +15% operational cost, but full decoupling between ingestion and reads\u003c/li>\u003c/ul>\n\u003ch2>Lessons Learned\u003c/h2>\n\u003cul>\u003cli>External geocoding consumed 80% of pipeline time — aggressive caching and local fallback removed the bottleneck\u003c/li> \u003cli>Monitoring each stage individually delivered the highest ROI by exposing bottlenecks that were invisible in the monolith\u003c/li> \u003cli>In crisis contexts, deployment simplicity beats design elegance — direct Python scripts saved lives in Brumadinho\u003c/li>\u003c/ul>\n\u003ch2>Production Notes\u003c/h2>\n\u003cp>Pipeline in continuous production use since 2024. Real stack: .NET for ingestion and normalization services, Python for heavy geoprocessing. Separating calculation from business rules allowed the data team to iterate without affecting the operational API. Mean resolution time for GIS incidents dropped from 4 hours to 45 minutes after adopting the ops view.\u003c/p>", "body_html_ja_jp": "\u003cp>このラボは、運用起点の GIS ワークストリームを集約したものです。焦点は地図そのものではなく、空間データを行動可能な運用情報に変えることにあります。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>空間データは、多くの場合、不完全でノイズが多く、処理コストも高い状態で届きます。そこで、取り込み・変換・読み取りモデルの間に明示的な契約を置いた非同期パイプラインとして各段階を扱います。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>設計はトレーサビリティと運用向け投影を優先します。取り込み・エンリッチメント・サービスがイベントを書き出し、読み取り層が対応チーム向けのビューとシグナルを統合します。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>スタック &amp; テクノロジー\u003c/h2>\n\u003cp>ここでの GIS は可視化の付属物ではなく、製品そのものの一部として扱われます。その前提が、契約、許容レイテンシ、可観測性のモデリングを根本から変えます。\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>生の地理処理を運用向け読み取り層から分離する。\u003c/li> \u003cli>リスクイベントを技術ログではなくドメイン事実としてモデル化する。\u003c/li>\u003c/ul>\n\u003ch2>ロードマップ\u003c/h2>\n\u003cul>\u003cli>地理空間フロー向けの図プレビューを追加する。\u003c/li> \u003cli>取り込み契約をより詳細に文書化する。\u003c/li>\u003c/ul>\n\u003ch2>インパクト &amp; 成果\u003c/h2>\n\u003cul>\u003cli>取り込みパイプラインが 20 万件の地理空間ポイントを 8 分未満で処理（以前はモノリスで 45 分）\u003c/li> \u003cli>ops view は 30 秒未満で更新され、現場チームはほぼリアルタイムのデータで動ける\u003c/li> \u003cli>空間計算と業務ルールの分離により、6 か月で 3 件の回帰事故を回避\u003c/li>\u003c/ul>\n\u003ch2>トレードオフ &amp; 決定事項\u003c/h2>\n\u003cul>\u003cli>非同期パイプライン vs 同期 endpoint: end-to-end レイテンシは増えるが、レジリエンスと可観測性は大幅に向上\u003c/li> \u003cli>段階間の versioned contract は初期コストが高いが、8 か月間 breaking change はゼロ\u003c/li> \u003cli>event-driven 設計には専用メッセージング基盤が必要で運用コストは +15% だが、取り込みと読み取りを完全に疎結合化できた\u003c/li>\u003c/ul>\n\u003ch2>学んだ教訓\u003c/h2>\n\u003cul>\u003cli>外部 geocoding がパイプライン時間の 80% を占めており、積極的なキャッシュとローカル fallback がボトルネックを解消した\u003c/li> \u003cli>各段階を個別監視する投資が最も高い ROI を出し、モノリスでは見えなかった詰まりを可視化した\u003c/li> \u003cli>危機時には設計の美しさよりデプロイの単純さが勝つ — 直接的な Python スクリプトが Brumadinho で実際に役立った\u003c/li>\u003c/ul>\n\u003ch2>本番環境メモ\u003c/h2>\n\u003cp>2024 年から継続的に運用中のパイプラインです。実スタックは、取り込みと正規化サービスに .NET、重い地理処理に Python を使用。計算処理と業務ルールを分離したことで、データチームは運用 API に影響を与えず改善を回せました。GIS インシデントの平均解決時間は、ops view 採用後に 4 時間から 45 分へ短縮しました。\u003c/p>", "body_html_ja": "\u003cp>このラボは、運用起点の GIS ワークストリームを集約したものです。焦点は地図そのものではなく、空間データを行動可能な運用情報に変えることにあります。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>空間データは、多くの場合、不完全でノイズが多く、処理コストも高い状態で届きます。そこで、取り込み・変換・読み取りモデルの間に明示的な契約を置いた非同期パイプラインとして各段階を扱います。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>設計はトレーサビリティと運用向け投影を優先します。取り込み・エンリッチメント・サービスがイベントを書き出し、読み取り層が対応チーム向けのビューとシグナルを統合します。\u003c/p>\n\u003cdiv class=\"code-shell\" data-language=\"\">  \u003cdiv class=\"code-shell-header\">\u003cspan class=\"code-shell-label\">text\u003c/span>  \u003cbutton class=\"code-shell-copy\" aria-label=\"Copy\">\u003ci data-lucide=\"copy\">\u003c/i>\u003c/button>\u003c/div>  \u003cpre>\u003ccode>ingest -&gt; normalize -&gt; geocode\n   |         |          |\nevents -&gt; risk map -&gt; ops view\u003c/code>\u003c/pre>\u003c/div>\n\u003ch2>スタック &amp; テクノロジー\u003c/h2>\n\u003cp>ここでの GIS は可視化の付属物ではなく、製品そのものの一部として扱われます。その前提が、契約、許容レイテンシ、可観測性のモデリングを根本から変えます。\u003c/p>\n\u003ch2>ADRs\u003c/h2>\n\u003cul>\u003cli>生の地理処理を運用向け読み取り層から分離する。\u003c/li> \u003cli>リスクイベントを技術ログではなくドメイン事実としてモデル化する。\u003c/li>\u003c/ul>\n\u003ch2>ロードマップ\u003c/h2>\n\u003cul>\u003cli>地理空間フロー向けの図プレビューを追加する。\u003c/li> \u003cli>取り込み契約をより詳細に文書化する。\u003c/li>\u003c/ul>\n\u003ch2>インパクト &amp; 成果\u003c/h2>\n\u003cul>\u003cli>取り込みパイプラインが 20 万件の地理空間ポイントを 8 分未満で処理（以前はモノリスで 45 分）\u003c/li> \u003cli>ops view は 30 秒未満で更新され、現場チームはほぼリアルタイムのデータで動ける\u003c/li> \u003cli>空間計算と業務ルールの分離により、6 か月で 3 件の回帰事故を回避\u003c/li>\u003c/ul>\n\u003ch2>トレードオフ &amp; 決定事項\u003c/h2>\n\u003cul>\u003cli>非同期パイプライン vs 同期 endpoint: end-to-end レイテンシは増えるが、レジリエンスと可観測性は大幅に向上\u003c/li> \u003cli>段階間の versioned contract は初期コストが高いが、8 か月間 breaking change はゼロ\u003c/li> \u003cli>event-driven 設計には専用メッセージング基盤が必要で運用コストは +15% だが、取り込みと読み取りを完全に疎結合化できた\u003c/li>\u003c/ul>\n\u003ch2>学んだ教訓\u003c/h2>\n\u003cul>\u003cli>外部 geocoding がパイプライン時間の 80% を占めており、積極的なキャッシュとローカル fallback がボトルネックを解消した\u003c/li> \u003cli>各段階を個別監視する投資が最も高い ROI を出し、モノリスでは見えなかった詰まりを可視化した\u003c/li> \u003cli>危機時には設計の美しさよりデプロイの単純さが勝つ — 直接的な Python スクリプトが Brumadinho で実際に役立った\u003c/li>\u003c/ul>\n\u003ch2>本番環境メモ\u003c/h2>\n\u003cp>2024 年から継続的に運用中のパイプラインです。実スタックは、取り込みと正規化サービスに .NET、重い地理処理に Python を使用。計算処理と業務ルールを分離したことで、データチームは運用 API に影響を与えず改善を回せました。GIS インシデントの平均解決時間は、ops view 採用後に 4 時間から 45 分へ短縮しました。\u003c/p>"}, {"id": "project-brumadinho-location", "kind": "project", "status": "research", "stack": ["Python", "GIS", "Geolocation"], "url": "/projects/brumadinho-location/", "resolved_url": "https://nhmatsumoto.github.io/projects/brumadinho-location/", "repo_url": "https://github.com/nhmatsumoto/brumadinho_location", "has_math": false, "name": "brumadinho_location", "headline": "Ferramentas para ajudar no resgate e localização das vítimas do rompimento da barragem de Brumadinho/MG.", "summary": "Conjunto de ferramentas geoespaciais para apoiar o resgate e localização de vítimas do desastre de Brumadinho/MG, utilizando dados públicos e coordenadas de referência.", "body_html": "\u003cp>Projeto comunitário criado em resposta ao rompimento da barragem da Vale em Brumadinho (MG) em janeiro de 2019. O objetivo é consolidar ferramentas de geolocalização para apoiar equipes de resgate e familiares na localização de vítimas.\u003c/p>\n\u003ch2>Motivação\u003c/h2>\n\u003cp>Em cenários de desastre, a fragmentação de dados geoespaciais atrasa o resgate. Este repositório concentra scripts e dados para processar coordenadas, mapear áreas afetadas e cruzar informações de localização com dados públicos disponíveis.\u003c/p>\n\u003ch2>Relação com o ecossistema\u003c/h2>\n\u003cp>Este projeto está diretamente conectado ao trabalho com GIS desenvolvido no \u003cstrong>SOS Location\u003c/strong> e no \u003cstrong>GIS Incident Lab\u003c/strong>. As lições aprendidas aqui — sobre ingestão de dados espaciais em cenários de crise — informaram o design dos pipelines de eventos adotados nos projetos posteriores.\u003c/p>\n\u003ch2>Contexto técnico\u003c/h2>\n\u003cul>\u003cli>Processamento de coordenadas GPS e dados de elevação\u003c/li> \u003cli>Cruzamento com bases públicas de localização\u003c/li> \u003cli>Geração de mapas de área afetada para visualização operacional\u003c/li>\u003c/ul>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Em situações de emergência, dados de localização chegam em formatos variados e com qualidade inconsistente. O projeto padroniza a ingestão e transformação desses dados para que equipes de campo tenham visibilidade rápida da situação.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>Scripts Python que processam dados CSV/GeoJSON de fontes públicas, normalizam coordenadas e geram visualizações de área afetada. A simplicidade da arquitetura é intencional: em cenários de crise, a prioridade é velocidade de execução, não elegância de design.\u003c/p>\n\u003ch2>Impacto &amp; Resultados\u003c/h2>\n\u003cul>\u003cli>Consolidação de dados de 4 fontes públicas distintas em formato unificado para equipes de resgate\u003c/li> \u003cli>Mapas de área afetada gerados em &lt;5min — tempo crítico para operações de campo\u003c/li> \u003cli>Projeto comunitário: contribuições de 12+ desenvolvedores em 72h após o desastre\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisões\u003c/h2>\n\u003cul>\u003cli>Scripts procedurais vs framework GIS completo: velocidade de entrega superou manutenibilidade — decisão correta para emergência\u003c/li> \u003cli>Dados públicos têm qualidade inconsistente — normalização agressiva com perda aceitável de precisão para ganho de cobertura\u003c/li>\u003c/ul>\n\u003ch2>Lições Aprendidas\u003c/h2>\n\u003cul>\u003cli>Em crise, o &#x27;bom o suficiente&#x27; funcional vale mais que o perfeito no backlog — entregamos em 48h\u003c/li> \u003cli>Dados de elevação GPS de fontes abertas tinham erro de até 15m — suficiente para orientação, não para resgate preciso\u003c/li> \u003cli>A fragmentação de dados geoespaciais entre órgãos públicos é o verdadeiro gargalo — não a tecnologia\u003c/li>\u003c/ul>", "headline_en_us": "Tools to help with the rescue and location of victims of the Brumadinho/MG dam collapse.", "headline_ja_jp": "ブルマジーニョ（ミナスジェライス州）ダム決壊被害者の救助・位置特定を支援するツール。", "summary_en_us": "Set of geospatial tools to support the rescue and localization of victims of the Brumadinho/MG disaster, using public data and reference coordinates.", "summary_ja_jp": "公的データと参照座標を用い、ブルマジーニョ／MG 災害の被害者救助と位置特定を支援する地理空間ツール群。", "body_html_en_us": "\u003cp>Community project created in response to the Vale dam collapse in Brumadinho (Minas Gerais) in January 2019. The goal is to consolidate geolocation tooling to support rescue teams and families searching for victims.\u003c/p>\n\u003ch2>Motivation\u003c/h2>\n\u003cp>In disaster scenarios, fragmented geospatial data delays rescue efforts. This repository concentrates scripts and datasets used to process coordinates, map affected areas and cross-reference location data with public sources.\u003c/p>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This project is directly connected to the GIS work later developed in \u003cstrong>SOS Location\u003c/strong> and \u003cstrong>GIS Incident Lab\u003c/strong>. Lessons learned here — especially around spatial-data ingestion under crisis conditions — informed the event-driven pipeline design adopted in later systems.\u003c/p>\n\u003ch2>Technical context\u003c/h2>\n\u003cul>\u003cli>Processing GPS coordinates and elevation datasets\u003c/li> \u003cli>Cross-referencing public location databases\u003c/li> \u003cli>Generating affected-area maps for operational visualization\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>In emergencies, location data arrives in inconsistent formats and quality levels. The project standardizes ingestion and transformation so field teams can gain rapid visibility into the situation.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Python scripts process CSV and GeoJSON datasets from public sources, normalize coordinates and generate affected-area visualizations. The simplicity is intentional: in crisis situations, execution speed matters more than elegant design.\u003c/p>\n\u003ch2>Impact &amp; Results\u003c/h2>\n\u003cul>\u003cli>Consolidated data from 4 distinct public sources into a unified format for rescue teams\u003c/li> \u003cli>Affected-area maps generated in under 5 minutes — a critical window for field operations\u003c/li> \u003cli>Community project: contributions from 12+ developers within 72 hours of the disaster\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisions\u003c/h2>\n\u003cul>\u003cli>Procedural scripts vs. a full GIS framework: delivery speed mattered more than long-term maintainability in an emergency\u003c/li> \u003cli>Public data quality was inconsistent — aggressive normalization traded some precision for broader coverage\u003c/li>\u003c/ul>\n\u003ch2>Lessons Learned\u003c/h2>\n\u003cul>\u003cli>During a crisis, a functional &#x27;good enough&#x27; system is worth more than a perfect design still sitting in the backlog\u003c/li> \u003cli>Open GPS elevation data had errors of up to 15 meters — enough for orientation, not for precise rescue operations\u003c/li> \u003cli>The real bottleneck was fragmentation of geospatial data across agencies, not technology itself\u003c/li>\u003c/ul>", "body_html_en": "\u003cp>Community project created in response to the Vale dam collapse in Brumadinho (Minas Gerais) in January 2019. The goal is to consolidate geolocation tooling to support rescue teams and families searching for victims.\u003c/p>\n\u003ch2>Motivation\u003c/h2>\n\u003cp>In disaster scenarios, fragmented geospatial data delays rescue efforts. This repository concentrates scripts and datasets used to process coordinates, map affected areas and cross-reference location data with public sources.\u003c/p>\n\u003ch2>Relationship with the ecosystem\u003c/h2>\n\u003cp>This project is directly connected to the GIS work later developed in \u003cstrong>SOS Location\u003c/strong> and \u003cstrong>GIS Incident Lab\u003c/strong>. Lessons learned here — especially around spatial-data ingestion under crisis conditions — informed the event-driven pipeline design adopted in later systems.\u003c/p>\n\u003ch2>Technical context\u003c/h2>\n\u003cul>\u003cli>Processing GPS coordinates and elevation datasets\u003c/li> \u003cli>Cross-referencing public location databases\u003c/li> \u003cli>Generating affected-area maps for operational visualization\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>In emergencies, location data arrives in inconsistent formats and quality levels. The project standardizes ingestion and transformation so field teams can gain rapid visibility into the situation.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>Python scripts process CSV and GeoJSON datasets from public sources, normalize coordinates and generate affected-area visualizations. The simplicity is intentional: in crisis situations, execution speed matters more than elegant design.\u003c/p>\n\u003ch2>Impact &amp; Results\u003c/h2>\n\u003cul>\u003cli>Consolidated data from 4 distinct public sources into a unified format for rescue teams\u003c/li> \u003cli>Affected-area maps generated in under 5 minutes — a critical window for field operations\u003c/li> \u003cli>Community project: contributions from 12+ developers within 72 hours of the disaster\u003c/li>\u003c/ul>\n\u003ch2>Trade-offs &amp; Decisions\u003c/h2>\n\u003cul>\u003cli>Procedural scripts vs. a full GIS framework: delivery speed mattered more than long-term maintainability in an emergency\u003c/li> \u003cli>Public data quality was inconsistent — aggressive normalization traded some precision for broader coverage\u003c/li>\u003c/ul>\n\u003ch2>Lessons Learned\u003c/h2>\n\u003cul>\u003cli>During a crisis, a functional &#x27;good enough&#x27; system is worth more than a perfect design still sitting in the backlog\u003c/li> \u003cli>Open GPS elevation data had errors of up to 15 meters — enough for orientation, not for precise rescue operations\u003c/li> \u003cli>The real bottleneck was fragmentation of geospatial data across agencies, not technology itself\u003c/li>\u003c/ul>", "body_html_ja_jp": "\u003cp>2019 年 1 月の Vale 社ダム決壊事故（ミナスジェライス州ブルマジーニョ）を受けて立ち上がったコミュニティ・プロジェクトです。目的は、被害者の位置特定を支援するための地理位置ツールを集約することにありました。\u003c/p>\n\u003ch2>動機\u003c/h2>\n\u003cp>災害時には、地理空間データの断片化が救助を遅らせます。このリポジトリは、座標処理、被災領域のマッピング、公開データとの照合に使うスクリプトとデータを集約します。\u003c/p>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>このプロジェクトは、後に \u003cstrong>SOS Location\u003c/strong> や \u003cstrong>GIS Incident Lab\u003c/strong> で発展した GIS の取り組みに直接つながっています。特に、危機状況での空間データ取り込みに関する知見は、その後のイベント駆動パイプライン設計に反映されました。\u003c/p>\n\u003ch2>技術的背景\u003c/h2>\n\u003cul>\u003cli>GPS 座標と標高データの処理\u003c/li> \u003cli>公開ロケーション・データベースとの照合\u003c/li> \u003cli>運用可視化のための被災エリア地図生成\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>緊急時には、位置データがばらばらの形式と品質で到着します。このプロジェクトは取り込みと変換を標準化し、現場チームが状況をすばやく把握できるようにします。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>公開ソースの CSV / GeoJSON を Python スクリプトで処理し、座標を正規化して被災エリアの可視化を生成します。この単純さは意図的です。危機の現場では、設計の美しさより実行速度が重要だからです。\u003c/p>\n\u003ch2>インパクト &amp; 成果\u003c/h2>\n\u003cul>\u003cli>4 つの公開データソースを救助チーム向けの単一フォーマットに統合\u003c/li> \u003cli>被災エリア地図を 5 分未満で生成 — 現場運用では重要な時間差\u003c/li> \u003cli>コミュニティ・プロジェクトとして、災害発生後 72 時間以内に 12 人超の開発者が参加\u003c/li>\u003c/ul>\n\u003ch2>トレードオフ &amp; 決定事項\u003c/h2>\n\u003cul>\u003cli>手続き型スクリプト vs 本格 GIS フレームワーク: 緊急時は長期保守性より納期が優先\u003c/li> \u003cli>公開データの品質は不均一だったため、多少の精度を犠牲にしてもカバレッジを優先する正規化を選択\u003c/li>\u003c/ul>\n\u003ch2>学んだ教訓\u003c/h2>\n\u003cul>\u003cli>危機時には、バックログ上の完璧さより、今動く『十分に良い』仕組みのほうが価値が高い\u003c/li> \u003cli>公開 GPS 標高データには最大 15 m の誤差があり、方角把握には十分でも精密救助には不十分だった\u003c/li> \u003cli>本当のボトルネックは技術ではなく、機関ごとに分断された地理空間データだった\u003c/li>\u003c/ul>", "body_html_ja": "\u003cp>2019 年 1 月の Vale 社ダム決壊事故（ミナスジェライス州ブルマジーニョ）を受けて立ち上がったコミュニティ・プロジェクトです。目的は、被害者の位置特定を支援するための地理位置ツールを集約することにありました。\u003c/p>\n\u003ch2>動機\u003c/h2>\n\u003cp>災害時には、地理空間データの断片化が救助を遅らせます。このリポジトリは、座標処理、被災領域のマッピング、公開データとの照合に使うスクリプトとデータを集約します。\u003c/p>\n\u003ch2>エコシステムとの関係\u003c/h2>\n\u003cp>このプロジェクトは、後に \u003cstrong>SOS Location\u003c/strong> や \u003cstrong>GIS Incident Lab\u003c/strong> で発展した GIS の取り組みに直接つながっています。特に、危機状況での空間データ取り込みに関する知見は、その後のイベント駆動パイプライン設計に反映されました。\u003c/p>\n\u003ch2>技術的背景\u003c/h2>\n\u003cul>\u003cli>GPS 座標と標高データの処理\u003c/li> \u003cli>公開ロケーション・データベースとの照合\u003c/li> \u003cli>運用可視化のための被災エリア地図生成\u003c/li>\u003c/ul>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>緊急時には、位置データがばらばらの形式と品質で到着します。このプロジェクトは取り込みと変換を標準化し、現場チームが状況をすばやく把握できるようにします。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>公開ソースの CSV / GeoJSON を Python スクリプトで処理し、座標を正規化して被災エリアの可視化を生成します。この単純さは意図的です。危機の現場では、設計の美しさより実行速度が重要だからです。\u003c/p>\n\u003ch2>インパクト &amp; 成果\u003c/h2>\n\u003cul>\u003cli>4 つの公開データソースを救助チーム向けの単一フォーマットに統合\u003c/li> \u003cli>被災エリア地図を 5 分未満で生成 — 現場運用では重要な時間差\u003c/li> \u003cli>コミュニティ・プロジェクトとして、災害発生後 72 時間以内に 12 人超の開発者が参加\u003c/li>\u003c/ul>\n\u003ch2>トレードオフ &amp; 決定事項\u003c/h2>\n\u003cul>\u003cli>手続き型スクリプト vs 本格 GIS フレームワーク: 緊急時は長期保守性より納期が優先\u003c/li> \u003cli>公開データの品質は不均一だったため、多少の精度を犠牲にしてもカバレッジを優先する正規化を選択\u003c/li>\u003c/ul>\n\u003ch2>学んだ教訓\u003c/h2>\n\u003cul>\u003cli>危機時には、バックログ上の完璧さより、今動く『十分に良い』仕組みのほうが価値が高い\u003c/li> \u003cli>公開 GPS 標高データには最大 15 m の誤差があり、方角把握には十分でも精密救助には不十分だった\u003c/li> \u003cli>本当のボトルネックは技術ではなく、機関ごとに分断された地理空間データだった\u003c/li>\u003c/ul>"}, {"id": "project-apollo-11", "kind": "project", "status": "research", "stack": ["Assembly", "AGC", "Embedded Systems"], "url": "/projects/apollo-11/", "resolved_url": "https://nhmatsumoto.github.io/projects/apollo-11/", "repo_url": "https://github.com/nhmatsumoto/Apollo-11", "has_math": false, "name": "Apollo-11", "headline": "Código-fonte original do Apollo 11 Guidance Computer (AGC) para os módulos de comando e lunar.", "summary": "Código-fonte original do Apollo 11 Guidance Computer (AGC), incluindo os módulos de comando e lunar — referência histórica de engenharia de software embarcado.", "body_html": "\u003cp>Fork do código-fonte original do Apollo 11 Guidance Computer (AGC), escrito em assembly para o computador de bordo que levou a humanidade à Lua em 1969.\u003c/p>\n\u003cp>O AGC foi um dos primeiros sistemas de computação embarcada a operar em tempo real com restrições extremas de memória e processamento. O código é dividido entre o módulo de comando (Comanche055) e o módulo lunar (Luminary099).\u003c/p>\n\u003ch2>Relevância técnica\u003c/h2>\n\u003cp>Este repositório serve como referência histórica para estudo de:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Arquitetura de software embarcado\u003c/strong> sob restrições severas de hardware\u003c/li> \u003cli>\u003cstrong>Sistemas de tempo real\u003c/strong> com prioridade de tarefas e preempção\u003c/li> \u003cli>\u003cstrong>Tolerância a falhas\u003c/strong> — o famoso alarme 1202 durante o pouso é um exemplo clássico de design resiliente\u003c/li> \u003cli>\u003cstrong>Engenharia de missão crítica\u003c/strong> onde bugs podem ter consequências irreversíveis\u003c/li>\u003c/ul>\n\u003ch2>Contexto\u003c/h2>\n\u003cp>O AGC tinha apenas 74KB de memória ROM e 4KB de RAM. Todo o software de navegação, controle de atitude e interface com astronautas cabia nesse espaço. A arquitetura de prioridades do AGC influenciou gerações de sistemas operacionais de tempo real.\u003c/p>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>O código original estava disperso em documentos históricos e microfilmes. A digitalização e publicação no GitHub permitiu que engenheiros modernos estudassem as decisões de design que tornaram possível a navegação lunar com hardware extremamente limitado.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>O AGC utiliza uma arquitetura de execução baseada em jobs com prioridades, onde tarefas críticas (como controle de atitude) podem interromper tarefas de menor prioridade. O sistema operacional embarcado gerencia filas de execução, I/O com sensores inerciais e interface DSKY (Display &amp; Keyboard).\u003c/p>", "headline_en_us": "Original Apollo 11 Guidance Computer (AGC) source code for the command and lunar modules.", "headline_ja_jp": "アポロ 11 号誘導コンピュータ（AGC）の指令船・月着陸船オリジナル・ソースコード。", "summary_en_us": "Original Apollo 11 Guidance Computer (AGC) source code, including the command and lunar modules — a historical reference for embedded software engineering.", "summary_ja_jp": "アポロ 11 号誘導コンピュータ（AGC）の指令船・月着陸船オリジナル・ソースコード。組み込みソフトウェア工学の歴史的リファレンス。", "body_html_en_us": "\u003cp>Fork of the original Apollo 11 Guidance Computer (AGC) source code, written in assembly for the onboard computer that took humanity to the Moon in 1969.\u003c/p>\n\u003cp>The AGC was one of the first embedded computing systems to operate in real time under extreme memory and processing constraints. The code is split between the command module (Comanche055) and the lunar module (Luminary099).\u003c/p>\n\u003ch2>Technical relevance\u003c/h2>\n\u003cp>This repository is a historical reference for studying:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Embedded software architecture\u003c/strong> under severe hardware constraints\u003c/li> \u003cli>\u003cstrong>Real-time systems\u003c/strong> with task priorities and preemption\u003c/li> \u003cli>\u003cstrong>Fault tolerance\u003c/strong> — the famous 1202 alarm during landing is a classic example of resilient design\u003c/li> \u003cli>\u003cstrong>Mission-critical engineering\u003c/strong> where bugs can have irreversible consequences\u003c/li>\u003c/ul>\n\u003ch2>Context\u003c/h2>\n\u003cp>The AGC had only 74 KB of ROM and 4 KB of RAM. All navigation software, attitude control logic and the astronaut interface had to fit within that space. The AGC priority model influenced generations of real-time operating systems.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>The original code was scattered across historical documents and microfilms. Digitizing and publishing it on GitHub allowed modern engineers to study the design decisions that made lunar navigation possible on extremely limited hardware.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>The AGC uses a priority-based job execution architecture, where critical tasks such as attitude control can interrupt lower-priority work. The embedded operating system manages execution queues, inertial-sensor I/O and the DSKY (Display &amp; Keyboard) interface.\u003c/p>", "body_html_en": "\u003cp>Fork of the original Apollo 11 Guidance Computer (AGC) source code, written in assembly for the onboard computer that took humanity to the Moon in 1969.\u003c/p>\n\u003cp>The AGC was one of the first embedded computing systems to operate in real time under extreme memory and processing constraints. The code is split between the command module (Comanche055) and the lunar module (Luminary099).\u003c/p>\n\u003ch2>Technical relevance\u003c/h2>\n\u003cp>This repository is a historical reference for studying:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Embedded software architecture\u003c/strong> under severe hardware constraints\u003c/li> \u003cli>\u003cstrong>Real-time systems\u003c/strong> with task priorities and preemption\u003c/li> \u003cli>\u003cstrong>Fault tolerance\u003c/strong> — the famous 1202 alarm during landing is a classic example of resilient design\u003c/li> \u003cli>\u003cstrong>Mission-critical engineering\u003c/strong> where bugs can have irreversible consequences\u003c/li>\u003c/ul>\n\u003ch2>Context\u003c/h2>\n\u003cp>The AGC had only 74 KB of ROM and 4 KB of RAM. All navigation software, attitude control logic and the astronaut interface had to fit within that space. The AGC priority model influenced generations of real-time operating systems.\u003c/p>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>The original code was scattered across historical documents and microfilms. Digitizing and publishing it on GitHub allowed modern engineers to study the design decisions that made lunar navigation possible on extremely limited hardware.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>The AGC uses a priority-based job execution architecture, where critical tasks such as attitude control can interrupt lower-priority work. The embedded operating system manages execution queues, inertial-sensor I/O and the DSKY (Display &amp; Keyboard) interface.\u003c/p>", "body_html_ja_jp": "\u003cp>1969 年に人類を月へ導いたオンボード計算機向けに assembly で書かれた、Apollo 11 Guidance Computer (AGC) オリジナル・ソースコードのフォークです。\u003c/p>\n\u003cp>AGC は、極端なメモリと処理能力の制約の下でリアルタイム動作した最初期の組み込み計算システムのひとつでした。コードは司令船モジュール（Comanche055）と月着陸船モジュール（Luminary099）に分かれています。\u003c/p>\n\u003ch2>技術的な重要性\u003c/h2>\n\u003cp>このリポジトリは、以下を学ぶための歴史的リファレンスです。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>厳しいハードウェア制約下での組み込みソフトウェアアーキテクチャ\u003c/strong>\u003c/li> \u003cli>\u003cstrong>優先度付きタスクとプリエンプションを備えたリアルタイムシステム\u003c/strong>\u003c/li> \u003cli>\u003cstrong>フォールトトレランス\u003c/strong> — 着陸時の有名な 1202 アラームはレジリエント設計の古典例です\u003c/li> \u003cli>\u003cstrong>ミッションクリティカル工学\u003c/strong> — バグが取り返しのつかない結果を招きうる領域\u003c/li>\u003c/ul>\n\u003ch2>背景\u003c/h2>\n\u003cp>AGC が持っていたのは ROM 74 KB、RAM 4 KB だけでした。航法ソフトウェア、姿勢制御、宇宙飛行士向けインターフェースのすべてをこの容量に収める必要がありました。AGC の優先度アーキテクチャは、その後のリアルタイム OS 世代に影響を与えました。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>オリジナルのコードは歴史資料やマイクロフィルムに散在していました。それをデジタル化して GitHub で公開したことで、極端に限られたハードウェアで月面航法を可能にした設計判断を、現代のエンジニアが検証できるようになりました。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>AGC は優先度ベースのジョブ実行アーキテクチャを採用しており、姿勢制御のような重要タスクが低優先度タスクを割り込めます。組み込み OS は実行キュー、慣性センサー I/O、DSKY（Display &amp; Keyboard）インターフェースを管理します。\u003c/p>", "body_html_ja": "\u003cp>1969 年に人類を月へ導いたオンボード計算機向けに assembly で書かれた、Apollo 11 Guidance Computer (AGC) オリジナル・ソースコードのフォークです。\u003c/p>\n\u003cp>AGC は、極端なメモリと処理能力の制約の下でリアルタイム動作した最初期の組み込み計算システムのひとつでした。コードは司令船モジュール（Comanche055）と月着陸船モジュール（Luminary099）に分かれています。\u003c/p>\n\u003ch2>技術的な重要性\u003c/h2>\n\u003cp>このリポジトリは、以下を学ぶための歴史的リファレンスです。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>厳しいハードウェア制約下での組み込みソフトウェアアーキテクチャ\u003c/strong>\u003c/li> \u003cli>\u003cstrong>優先度付きタスクとプリエンプションを備えたリアルタイムシステム\u003c/strong>\u003c/li> \u003cli>\u003cstrong>フォールトトレランス\u003c/strong> — 着陸時の有名な 1202 アラームはレジリエント設計の古典例です\u003c/li> \u003cli>\u003cstrong>ミッションクリティカル工学\u003c/strong> — バグが取り返しのつかない結果を招きうる領域\u003c/li>\u003c/ul>\n\u003ch2>背景\u003c/h2>\n\u003cp>AGC が持っていたのは ROM 74 KB、RAM 4 KB だけでした。航法ソフトウェア、姿勢制御、宇宙飛行士向けインターフェースのすべてをこの容量に収める必要がありました。AGC の優先度アーキテクチャは、その後のリアルタイム OS 世代に影響を与えました。\u003c/p>\n\u003ch2>課題と解決策\u003c/h2>\n\u003cp>オリジナルのコードは歴史資料やマイクロフィルムに散在していました。それをデジタル化して GitHub で公開したことで、極端に限られたハードウェアで月面航法を可能にした設計判断を、現代のエンジニアが検証できるようになりました。\u003c/p>\n\u003ch2>アーキテクチャ\u003c/h2>\n\u003cp>AGC は優先度ベースのジョブ実行アーキテクチャを採用しており、姿勢制御のような重要タスクが低優先度タスクを割り込めます。組み込み OS は実行キュー、慣性センサー I/O、DSKY（Display &amp; Keyboard）インターフェースを管理します。\u003c/p>"}, {"id": "project-automapper", "kind": "project", "status": "research", "stack": ["C#", ".NET", "Reflection"], "url": "/projects/automapper/", "resolved_url": "https://nhmatsumoto.github.io/projects/automapper/", "repo_url": "https://github.com/nhmatsumoto/AutoMapper", "has_math": false, "name": "AutoMapper", "headline": "Mapeador objeto-para-objeto baseado em convenções para .NET.", "summary": "Biblioteca de mapeamento objeto-objeto baseada em convenções para .NET — elimina boilerplate de transformação entre camadas.", "body_html": "\u003cp>Fork do AutoMapper, a biblioteca mais utilizada no ecossistema .NET para mapeamento automático entre objetos de diferentes camadas (DTOs, ViewModels, Entities).\u003c/p>\n\u003ch2>Por que este fork\u003c/h2>\n\u003cp>AutoMapper é referência direta para projetos como SplitCosts e Financial, onde a separação entre domínio e contratos de API exige transformações frequentes entre modelos. Manter o fork permite estudar a implementação interna e avaliar trade-offs de performance vs. conveniência.\u003c/p>\n\u003ch2>Conceitos centrais\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Convention over configuration\u003c/strong> — propriedades com mesmo nome são mapeadas automaticamente\u003c/li> \u003cli>\u003cstrong>Profiles\u003c/strong> — agrupamento de configurações de mapeamento por contexto de domínio\u003c/li> \u003cli>\u003cstrong>Projections\u003c/strong> — integração com LINQ/EF para projeções diretas no banco de dados\u003c/li> \u003cli>\u003cstrong>Validação de configuração\u003c/strong> — detecção antecipada de mapeamentos incompletos em tempo de inicialização\u003c/li>\u003c/ul>\n\u003ch2>Problema e solução\u003c/h2>\n\u003cp>Código de mapeamento manual entre camadas é repetitivo e frágil. AutoMapper resolve isso com convenções que reduzem boilerplate, mas exige disciplina: mapeamentos implícitos podem esconder bugs quando os modelos divergem.\u003c/p>\n\u003ch2>Arquitetura\u003c/h2>\n\u003cp>AutoMapper utiliza reflection e expression trees para gerar mapeamentos em tempo de compilação do perfil. A versão mais recente introduziu source generators como alternativa para eliminar overhead de reflection em cenários de alta performance.\u003c/p>", "headline_en_us": "A convention-based object-to-object mapper in .NET.", "headline_ja_jp": ".NET 向けの規約ベース・オブジェクト間マッパー。", "summary_en_us": "Convention-based object-to-object mapping library for .NET — removes boilerplate when transforming data across layers.", "summary_ja_jp": "規約ベースの .NET 用オブジェクトマッピング・ライブラリ。レイヤー間のデータ変換における定型コードを排除する。", "body_html_en_us": "\u003cp>Fork of AutoMapper, the most widely used library in the .NET ecosystem for automatic mapping between objects from different layers (DTOs, ViewModels and Entities).\u003c/p>\n\u003ch2>Why this fork\u003c/h2>\n\u003cp>AutoMapper is a direct reference for projects such as SplitCosts and Financial, where the separation between domain models and API contracts requires frequent transformations between representations. Keeping the fork available makes it possible to inspect the internal implementation and evaluate performance-versus-convenience trade-offs.\u003c/p>\n\u003ch2>Core concepts\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Convention over configuration\u003c/strong> — properties with the same name are mapped automatically\u003c/li> \u003cli>\u003cstrong>Profiles\u003c/strong> — grouping mapping configuration by domain context\u003c/li> \u003cli>\u003cstrong>Projections\u003c/strong> — integration with LINQ/EF for database-side projections\u003c/li> \u003cli>\u003cstrong>Configuration validation\u003c/strong> — early detection of incomplete mappings during startup\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Manual mapping code between layers is repetitive and fragile. AutoMapper reduces that boilerplate through conventions, but it requires discipline: implicit mappings can hide bugs when models diverge.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>AutoMapper uses reflection and expression trees to generate mappings when profiles are compiled. Newer versions also introduced source generators as an alternative for eliminating reflection overhead in performance-sensitive scenarios.\u003c/p>", "body_html_en": "\u003cp>Fork of AutoMapper, the most widely used library in the .NET ecosystem for automatic mapping between objects from different layers (DTOs, ViewModels and Entities).\u003c/p>\n\u003ch2>Why this fork\u003c/h2>\n\u003cp>AutoMapper is a direct reference for projects such as SplitCosts and Financial, where the separation between domain models and API contracts requires frequent transformations between representations. Keeping the fork available makes it possible to inspect the internal implementation and evaluate performance-versus-convenience trade-offs.\u003c/p>\n\u003ch2>Core concepts\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Convention over configuration\u003c/strong> — properties with the same name are mapped automatically\u003c/li> \u003cli>\u003cstrong>Profiles\u003c/strong> — grouping mapping configuration by domain context\u003c/li> \u003cli>\u003cstrong>Projections\u003c/strong> — integration with LINQ/EF for database-side projections\u003c/li> \u003cli>\u003cstrong>Configuration validation\u003c/strong> — early detection of incomplete mappings during startup\u003c/li>\u003c/ul>\n\u003ch2>Problem and solution\u003c/h2>\n\u003cp>Manual mapping code between layers is repetitive and fragile. AutoMapper reduces that boilerplate through conventions, but it requires discipline: implicit mappings can hide bugs when models diverge.\u003c/p>\n\u003ch2>Architecture\u003c/h2>\n\u003cp>AutoMapper uses reflection and expression trees to generate mappings when profiles are compiled. Newer versions also introduced source generators as an alternative for eliminating reflection overhead in performance-sensitive scenarios.\u003c/p>", "body_html_ja_jp": "\u003cp>AutoMapper のフォークです。.NET エコシステムで最も広く使われている、異なるレイヤー間（DTO、ViewModel、Entity）のオブジェクトを自動マッピングするライブラリです。\u003c/p>\n\u003ch2>このフォークの理由\u003c/h2>\n\u003cp>AutoMapper は SplitCosts や Financial のようなプロジェクトにおける直接的な参照実装です。ドメインと API 契約を分離すると、表現間の変換が頻繁に発生します。フォークを維持することで、内部実装を調べ、パフォーマンスと利便性のトレードオフを評価できます。\u003c/p>\n\u003ch2>中核となる考え方\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Convention over configuration\u003c/strong> — 同名プロパティを自動マッピング\u003c/li> \u003cli>\u003cstrong>Profiles\u003c/strong> — ドメイン文脈ごとにマッピング設定を整理\u003c/li> \u003cli>\u003cstrong>Projections\u003c/strong> — LINQ / EF と統合し、DB 側で投影を実

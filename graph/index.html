<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
    <title>Knowledge Graph | Hiro Matsumoto</title>
    <meta name="description" content="Visualização de rede das conexões técnicas e de domínio.">
    <link rel="stylesheet" href="/assets/styles.css?v=1775169888">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      
      .graph-container {
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }
      
      .graph-container:active {
        cursor: grabbing;
      }
      
      .graph-overlay {
        position: fixed;
        top: 2rem;
        left: 2rem;
        z-index: 100;
        pointer-events: none;
      }
      
      .graph-controls {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        z-index: 100;
      }
      
      .control-btn {
        width: 3rem;
        height: 3rem;
        border-radius: 50%;
        background: white;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-md);
        pointer-events: auto;
        color: var(--muted);
        transition: all 0.2s ease;
      }
      
      .control-btn:hover {
        color: var(--accent);
        transform: translateY(-2px);
      }

      .graph-legend {
        position: fixed;
        bottom: 2rem;
        left: 2rem;
        background: white/80;
        backdrop-blur: sm;
        padding: 1rem;
        border-radius: 16px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-size: 0.75rem;
        font-family: var(--font-ui);
        z-index: 100;
      }
      
      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="graph-overlay pointer-events-none">
      <div class="flex flex-col gap-1 pointer-events-auto">
        <a href="/" class="text-slate-900 font-bold text-xl tracking-tight flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            Hiro Matsumoto
        </a>
        <p class="text-muted text-xs uppercase tracking-widest font-bold">Knowledge Graph Explorer</p>
      </div>
    </div>
    
    <div class="graph-container" data-knowledge-graph data-full-screen="true"></div>
    
    <div class="graph-legend">
        <div class="legend-item"><span class="dot bg-[#00C2FF]"></span> Projeto Principal</div>
        <div class="legend-item"><span class="dot bg-[#7C5CFF]"></span> Documento Técnico</div>
        <div class="legend-item"><span class="dot bg-[#1e293b]"></span> Publicação</div>
    </div>

    <div class="graph-controls">
        <button class="control-btn" id="zoom-in" title="Zoom In"><i data-lucide="plus"></i></button>
        <button class="control-btn" id="zoom-out" title="Zoom Out"><i data-lucide="minus"></i></button>
        <button class="control-btn" id="zoom-reset" title="Reset Zoom"><i data-lucide="maximize"></i></button>
    </div>

    <script src="/assets/graphview.js?v=1775169888"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
      });
    </script>
  </body>
</html>

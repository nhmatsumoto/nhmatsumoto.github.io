body = """
Muitos desenvolvedores veem o Test-Driven Development (TDD) como um fardo que atrasa a entrega. Na realidade, o TDD é uma ferramenta de **design de software**. Ao escrever o teste primeiro, você se coloca no lugar de quem consome o seu código.

## O Ciclo Sagrado

O TDD se baseia em uma iteração rápida de três passos:

1.  **Vermelho (Red)**: Escreva um teste que falha. Ele define o que o código deve fazer, sem que a implementação exista.
2.  **Verde (Green)**: Escreva a menor quantidade de código possível para fazer o teste passar. Não se preocupe com a elegância agora.
3.  **Refatorar (Refactor)**: Agora que o teste passa e você tem uma rede de segurança, limpe o código, remova duplicidades e melhore o design.

```mermaid
stateDiagram-v2
    [*] --> Red: Escreve teste que falha
    Red --> Green: Implementação mínima
    Green --> Refactor: Melhora o design
    Refactor --> Red: Próximo requisito
```

### Os Benefícios do TDD

*   **Design Emergente**: Você cria apenas o que é necessário. Interfaces ficam mais limpas e focadas.
*   **Coragem para Mudar**: Com uma suíte de testes robusta, refatorar código legado deixa de ser um pesadelo.
*   **Documentação Viva**: Os testes são o melhor exemplo de como usar a sua aplicação.

## Conclusão

TDD não é sobre testar após o fato; é sobre **guiar o desenvolvimento**. É a diferença entre construir uma ponte e esperar que ela aguente o peso, ou projetá-la com cálculos precisos de carga desde o primeiro tijolo.

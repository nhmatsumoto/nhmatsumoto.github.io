body_en_us = '''
The GoF (Gang of Four) **creational patterns** all attack a single problem: how to create objects without tying client code to concrete types. The big shift in .NET is that much of this work has migrated to the **dependency injection (DI) container** - it is, in practice, the largest factory/singleton in your system. Even so, the classic patterns stay useful exactly where the container falls short: when creation carries **business rules**.

## Factory Method: choosing the type at runtime

The `Factory Method` decouples *which* implementation gets created from *who* uses it. The classic case: you receive a payment type (string, enum) and need the right processor.

```csharp
// Classic form: the factory decides the concrete type
public interface IPaymentProcessor { Task<Receipt> PayAsync(Order o); }

public sealed class PaymentProcessorFactory
{
    public IPaymentProcessor Create(PaymentMethod method) => method switch
    {
        PaymentMethod.Pix    => new PixProcessor(),
        PaymentMethod.Card   => new CardProcessor(),
        PaymentMethod.Boleto => new BoletoProcessor(),
        _ => throw new ArgumentOutOfRangeException(nameof(method))
    };
}
```

The problem with this version: the inner `new` kills dependency injection for the processors. In **.NET 8+**, the idiomatic form uses **keyed services**, letting the container build each concrete type with its own dependencies:

```csharp
// Registration
services.AddKeyedScoped<IPaymentProcessor, PixProcessor>(PaymentMethod.Pix);
services.AddKeyedScoped<IPaymentProcessor, CardProcessor>(PaymentMethod.Card);

// Resolution: the "factory" is the container itself
public sealed class Checkout(IServiceProvider sp)
{
    public Task<Receipt> PayAsync(Order o) =>
        sp.GetRequiredKeyedService<IPaymentProcessor>(o.Method).PayAsync(o);
}
```

When should you still write the factory by hand? When choosing the type involves **domain logic** (not just a key), or when you want an explicit, testable point for that decision.

## Abstract Factory: families of objects that fit together

While the Factory Method creates **one** product, the `Abstract Factory` creates **coherent families** of products that must be used together. The canonical example is a report whose entire format changes (PDF vs HTML), where header, body, and footer must all speak the same "dialect."

```csharp
public interface IReportFactory
{
    IHeaderRenderer Header();
    IBodyRenderer   Body();
    IFooterRenderer Footer();
}

public sealed class PdfReportFactory : IReportFactory { /* returns the PDF family */ }
public sealed class HtmlReportFactory : IReportFactory { /* returns the HTML family */ }
```

The value is the **consistency guarantee**: it's impossible to mix a PDF header with an HTML footer. In .NET this often becomes just groups of DI registrations, but the idea of "a family that travels together" remains the design criterion.

## Builder: complex construction, step by step

The `Builder` separates the construction of a complex object from its final representation. It shines when there are **many optional parameters**, **assembly order**, or **validation at the end**.

```csharp
var email = EmailBuilder.Create()
    .From("no-reply@app.dev")
    .To("user@example.com")
    .WithSubject("Welcome")
    .WithTemplate("welcome", new { Name = "Hiro" })
    .Build();   // invariants are validated all at once here
```

But beware: **modern C# made the Builder obsolete in many cases**. For immutable objects, `records` with `required` members and `with` expressions cover much of the ground without an extra type:

```csharp
public sealed record Email
{
    public required string From { get; init; }
    public required string To { get; init; }
    public string Subject { get; init; } = "";
}

var a = new Email { From = "x@y.z", To = "u@e.f", Subject = "Hi" };
var b = a with { Subject = "Other" };   // modified immutable copy
```

The heuristic: use a `record`/object initializer when construction is **declarative**; use a Builder when there is **logic, steps, or accumulated validation** that the initializer doesn't express well.

## Singleton: the anti-pattern that DI tamed

The classic `Singleton` - a `static instance` with double-checked locking - is today, in most cases, a **code smell**: hidden global state, hard to test, implicit coupling. .NET solves this with a **container-managed lifetime**:

```csharp
// The container guarantees a single instance - and it's injectable/testable
services.AddSingleton<IClock, SystemClock>();
```

If you *must* have a manual singleton (rare), use `Lazy<T>`, which gives lazy, thread-safe initialization without the double-checked locking boilerplate:

```csharp
private static readonly Lazy<Config> _cfg = new(() => Config.Load());
public static Config Current => _cfg.Value;
```

## Comparison

| Pattern | Solves | Idiomatic .NET form | When to hand-write |
| :--- | :--- | :--- | :--- |
| **Factory Method** | Choosing 1 concrete type | Keyed services / `Func<T>` | The decision has domain rules |
| **Abstract Factory** | A coherent family of types | Groups of DI registrations | Enforcing consistency across products |
| **Builder** | Complex/validated construction | `record` + `required` + `with` | Steps, order, or accumulated validation |
| **Singleton** | A single instance | `AddSingleton` | Almost never; otherwise `Lazy<T>` |
| **Prototype** | Cloning a configuration | `record` `with` | Custom deep copy |

## Conclusion

In modern .NET, the creational question is rarely "which GoF pattern do I apply?" but "**is this the container's job, or is there a business rule in the creation?**". If it's just wiring the dependency graph, let DI do it - it is already Factory and Singleton. Hand-write the pattern when creation **decides something about the domain**: that's when Factory Method, Abstract Factory, and Builder earn their place again - now as an expression of a rule, not as ceremony.
'''
body_ja_jp = '''
GoF（Gang of Four）の **生成パターン** はすべて、ひとつの問題を攻めます。クライアントコードを具象型に縛らずにオブジェクトを生成する方法です。.NET における大きな転換は、この作業の多くが **依存性注入（DI）コンテナ** へ移ったことです。実際、それはシステム最大の factory/singleton です。それでも、古典的パターンは、コンテナが届かない場所 ── 生成が **ビジネスルール** を伴うとき ── でこそ有用であり続けます。

## Factory Method：実行時に型を選ぶ

`Factory Method` は、*どの* 実装が生成されるかを、*誰が* それを使うかから切り離します。古典的な例。支払い種別（文字列、enum）を受け取り、正しいプロセッサが必要になる場面です。

```csharp
// 古典形：ファクトリが具象を決める
public interface IPaymentProcessor { Task<Receipt> PayAsync(Order o); }

public sealed class PaymentProcessorFactory
{
    public IPaymentProcessor Create(PaymentMethod method) => method switch
    {
        PaymentMethod.Pix    => new PixProcessor(),
        PaymentMethod.Card   => new CardProcessor(),
        PaymentMethod.Boleto => new BoletoProcessor(),
        _ => throw new ArgumentOutOfRangeException(nameof(method))
    };
}
```

この版の問題。内部の `new` がプロセッサへの依存性注入を殺します。**.NET 8 以降** のイディオム形は **keyed services** を使い、各具象を自身の依存とともにコンテナに構築させます。

```csharp
// 登録
services.AddKeyedScoped<IPaymentProcessor, PixProcessor>(PaymentMethod.Pix);
services.AddKeyedScoped<IPaymentProcessor, CardProcessor>(PaymentMethod.Card);

// 解決：「ファクトリ」はコンテナそのもの
public sealed class Checkout(IServiceProvider sp)
{
    public Task<Receipt> PayAsync(Order o) =>
        sp.GetRequiredKeyedService<IPaymentProcessor>(o.Method).PayAsync(o);
}
```

それでも手書きのファクトリを書くのはいつか。型の選択が（単なるキーではなく）**ドメインロジック** を伴うとき、あるいはその判断のために明示的でテスト可能な一点が欲しいときです。

## Abstract Factory：組み合う型のファミリー

Factory Method が **1 つ** の製品を作るのに対し、`Abstract Factory` は一緒に使われねばならない **整合した製品ファミリー** を作ります。正典的な例は、書式全体が変わるレポート（PDF vs HTML）で、ヘッダ・本文・フッタがすべて同じ「方言」でなければならない場合です。

```csharp
public interface IReportFactory
{
    IHeaderRenderer Header();
    IBodyRenderer   Body();
    IFooterRenderer Footer();
}

public sealed class PdfReportFactory : IReportFactory { /* PDF ファミリーを返す */ }
public sealed class HtmlReportFactory : IReportFactory { /* HTML ファミリーを返す */ }
```

価値は **整合性の保証** です。PDF のヘッダと HTML のフッタを混ぜることが不可能になります。.NET ではこれがしばしば DI 登録のグループになりますが、「一緒に動くファミリー」という考えは設計基準として残ります。

## Builder：複雑な構築を一歩ずつ

`Builder` は、複雑なオブジェクトの構築をその最終表現から分離します。**多くの任意パラメータ**、**組み立ての順序**、**最後の検証** があるときに輝きます。

```csharp
var email = EmailBuilder.Create()
    .From("no-reply@app.dev")
    .To("user@example.com")
    .WithSubject("ようこそ")
    .WithTemplate("welcome", new { Name = "Hiro" })
    .Build();   // ここで不変条件が一括検証される
```

ただし注意。**モダン C# は多くの場合 Builder を不要にしました**。不変オブジェクトには、`required` メンバを持つ `record` と `with` 式が、余計な型なしで多くをカバーします。

```csharp
public sealed record Email
{
    public required string From { get; init; }
    public required string To { get; init; }
    public string Subject { get; init; } = "";
}

var a = new Email { From = "x@y.z", To = "u@e.f", Subject = "やあ" };
var b = a with { Subject = "別の件名" };   // 変更された不変コピー
```

ヒューリスティック。構築が **宣言的** なら `record`/オブジェクト初期化子を、初期化子ではうまく表せない **ロジック・手順・累積する検証** があるなら Builder を使う。

## Singleton：DI が飼いならした反パターン

古典的な `Singleton` ── ダブルチェックロック付きの `static instance` ── は今日、多くの場合 **コードの臭い** です。隠れたグローバル状態、テストしづらさ、暗黙の結合。.NET は **コンテナ管理のライフタイム** でこれを解決します。

```csharp
// コンテナが単一インスタンスを保証 ── しかも注入可能でテスト可能
services.AddSingleton<IClock, SystemClock>();
```

どうしても手動シングルトンが *必要* なら（稀）、`Lazy<T>` を使いましょう。ダブルチェックロックの定型なしに、遅延かつスレッドセーフな初期化が得られます。

```csharp
private static readonly Lazy<Config> _cfg = new(() => Config.Load());
public static Config Current => _cfg.Value;
```

## 比較

| パターン | 解決すること | .NET のイディオム形 | 手書きするとき |
| :--- | :--- | :--- | :--- |
| **Factory Method** | 1 つの具象型を選ぶ | keyed services / `Func<T>` | 判断にドメインルールがある |
| **Abstract Factory** | 整合した型のファミリー | DI 登録のグループ | 製品間の整合性を強制する |
| **Builder** | 複雑/検証付きの構築 | `record` + `required` + `with` | 手順・順序・累積検証がある |
| **Singleton** | 単一インスタンス | `AddSingleton` | ほぼ無し。さもなくば `Lazy<T>` |
| **Prototype** | 設定の複製 | `record` `with` | カスタムなディープコピー |

## 結論

モダンな .NET では、生成に関する問いは「どの GoF パターンを当てるか」ではなく、「**これはコンテナの仕事か、それとも生成にビジネスルールがあるか**」です。依存グラフを配線するだけなら DI に任せましょう ── それはすでに Factory であり Singleton です。生成が **ドメインの何かを決める** ときに手書きしましょう。そのとき Factory Method・Abstract Factory・Builder は再び居場所を得ます ── 儀式としてではなく、ルールの表現として。

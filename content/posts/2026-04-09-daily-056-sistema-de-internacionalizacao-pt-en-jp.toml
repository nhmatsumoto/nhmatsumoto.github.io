このDailyでは、SOS Locationの **フロントエンドとUX** トラックにおける **国際化システム（PT/EN/JP）** を詳しく整理します。

## 説明
目的は、**国際化システム（PT/EN/JP）** をコード、契約、運用で検証できる成果物にすることです。

## 基礎
チームが「誰が決めるか」「何が変わるか」「どう測るか」に答えられないなら、**国際化システム（PT/EN/JP）** はまだ抽象的です。 実践的なルールは、その成果物を変更対象の流れの近くに置くことです。

## 数式
判断を読むための指標:
使いやすさ = 読みやすさ + 誘導性 - 摩擦

## フロー図
```mermaid
flowchart LR
  A["Layout bruto"] --> B["Hierarquia visual"]
  B --> C["Interação consistente"]
  C --> D["Acessibilidade"]
  D --> E["Leitura fluida"]
```

## 実装例
```tsx

This Daily expands **Role-based permission control with RBAC** within the **Security** track of SOS Location. The goal is to turn a short note into reference material for product, engineering and operations.

## Description
Covers Role-based permission control with RBAC in SOS Location with context, operational criteria, diagrams, formulas and implementation examples.

## Fundamentals
Security in an emergency platform must combine authentication, authorization, validation, auditing and secret management. Real risk appears when one of these layers becomes an implicit assumption.

The core idea is to make **Role-based permission control with RBAC** observable: there should be an artifact that another person can read, code can test or an operations team can validate. If the decision stays only in conversation, it does not scale and it does not create institutional learning.

## Decision model
The decision can be evaluated with a simple metric:

$$
Risk = Impact \times Likelihood \times Exposure
$$

Prioritization should consider impact, likelihood and exposure, not only how easy the fix is.

## Flow diagram

}
```

## How to apply it in SOS Location
- Define the minimum contract: input, output, owner of the decision and expected behavior on failure.
- Record the decision close to the code or architecture document that will evolve with the system.
- Create a test, query or dashboard that shows whether the behavior remains true with real data.
- Review the operational impact: response time, traceability, cognitive cost and interpretation risk.

## Common pitfalls
- Turning the concept into an overly generic abstraction before validating a real use case.
- Mixing business rules, external integration and visual detail in the same place.
- Measuring only technical execution while ignoring the effect on rescue teams, affected users or operators.


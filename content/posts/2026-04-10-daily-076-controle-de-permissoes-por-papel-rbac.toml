This Daily expands **Role-based permission control with RBAC** within the **security** track of SOS Location.

## Description
The goal is to turn **Role-based permission control with RBAC** into a verifiable artifact in code, contract, or operations.

## Fundamentals
If the team cannot answer who decides, what changes, and how to measure it, **Role-based permission control with RBAC** is still abstract. The practical rule is to keep the artifact close to the flow it changes.

## Formula

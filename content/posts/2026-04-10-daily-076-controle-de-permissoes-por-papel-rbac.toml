body = '''
Este Daily aprofunda **Controle de permissões por papel (RBAC)** dentro da trilha **Segurança** do SOS Location. A ideia é sair de uma nota curta e transformar o item em material de referência para produto, engenharia e operação.

## Descrição
Define quais ações cada tipo de usuário pode executar, separando operadores, administradores e equipes externas.

## Fundamentos
Segurança em plataforma de emergência precisa combinar autenticação, autorização, validação, auditoria e gestão de segredo. O risco real surge quando uma dessas camadas vira pressuposto implícito.

O ponto central é tornar **Controle de permissões por papel (RBAC)** observável: deve existir um artefato que possa ser lido por outra pessoa, testado por código ou validado por uma equipe operacional. Quando a decisão fica apenas na conversa, ela não escala e não cria aprendizado institucional.

## Modelo de decisão
A decisão pode ser avaliada com uma métrica simples:

$$
Risk = Impact \times Likelihood \times Exposure
$$

A priorização deve considerar impacto, probabilidade e exposição, não apenas a facilidade técnica de corrigir.


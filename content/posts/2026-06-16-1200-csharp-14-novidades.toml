body = '''
C# 14 acompanha o .NET 10 e segue a filosofia recente da linguagem: nada de paradigma novo, e sim **apagar cerimonias repetidas**. Cada recurso aqui existe para remover um pedaco de codigo chato que voce escrevia no automatico. Vamos aos que mais aparecem no dia a dia.

## A palavra-chave `field`: o fim do backing field manual

Esse e o recurso que mais economiza linhas. Antes, para colocar qualquer logica num setter, voce era obrigado a declarar o campo de apoio (*backing field*) e implementar os dois accessors a mao:

```csharp
// Antes do C# 14
private string _msg;
public string Message
{
    get => _msg;
    set => _msg = value ?? throw new ArgumentNullException(nameof(value));
}
```

Em C# 14, a palavra contextual `field` se refere ao campo que o compilador sintetiza por voce. O par "campo privado mais propriedade" some:

```csharp
// C# 14
public string Message
{
    get;
    set => field = value ?? throw new ArgumentNullException(nameof(value));
}
```

O cuidado: `field` e **palavra contextual**, nao reservada. Se o seu tipo ja tem um simbolo chamado `field`, ha ambiguidade - resolva com `@field` ou `this.field`, ou renomeie o simbolo.

## Extension members: extensao alem de metodos

Por mais de uma decada, "estender" um tipo em C# significava **so metodos** de extensao. C# 14 introduz blocos `extension` que permitem tambem **propriedades de extensao**, **membros estaticos de extensao** e ate **operadores** definidos como extensao.

```csharp
public static class SequenceExtensions
{
    extension<T>(IEnumerable<T> source) // membros de instancia para IEnumerable<T>
    {
        public bool IsEmpty => !source.Any();          // propriedade de extensao
        public T FirstOrThrow() => source.First();     // metodo de extensao
    }

    extension<T>(IEnumerable<T>) // membros estaticos para o tipo
    {
        public static IEnumerable<T> Empty => Enumerable.Empty<T>();
    }
}

// uso
if (numbers.IsEmpty) { /* ... */ }   // chama como se fosse membro de instancia
var none = IEnumerable<int>.Empty;   // chama como membro estatico do tipo
```

O `IsEmpty` se comporta como se fosse uma propriedade nativa de `IEnumerable<T>`. E uma extensao real do que era possivel: antes, `source.IsEmpty` simplesmente nao existia como conceito.

## Atribuicao null-condicional: o `if` de guarda que sumiu

O operador `?.` agora pode aparecer do **lado esquerdo** de uma atribuicao. Aquele `if (x is not null)` so para poder atribuir desaparece:

```csharp
// Antes
if (customer is not null)
    customer.Order = GetCurrentOrder();

// C# 14
customer?.Order = GetCurrentOrder();
```

A semantica importa: o lado direito **so e avaliado se o alvo nao for nulo**. Se `customer` for null, `GetCurrentOrder()` nem e chamado. Vale com atribuicao composta (`+=`, `-=`), mas nao com `++` nem `--`.

## Modificadores em lambdas simples

Antes, para usar `ref`, `out`, `in` ou `scoped` num parametro de lambda, voce era obrigado a tipar **todos** os parametros. Agora os modificadores convivem com a inferencia de tipo:

```csharp
delegate bool TryParse<T>(string text, out T result);

// C# 14: 'out' sem precisar escrever os tipos
TryParse<int> parse = (text, out result) => int.TryParse(text, out result);
```

O `params` ainda exige lista de parametros explicitamente tipada.

## E ainda

C# 14 traz mais alguns ajustes finos: `nameof` agora aceita **tipos genericos nao vinculados** (`nameof(List<>)` retorna `"List"`); ha **conversoes implicitas de primeira classe** entre `Span<T>`, `ReadOnlySpan<T>` e `T[]`, tornando a programacao com spans mais natural e segura; **construtores de instancia e eventos podem ser `partial`**, completando os metodos e propriedades parciais do C# 13; e ha **operadores de atribuicao composta definidos pelo usuario** (`+=`, `-=`).

## Conclusao

O fio condutor do C# 14 e a economia de cerimonia. `field` mata o par campo-propriedade; `?.=` mata o `if` de guarda; extension members levam a extensao para alem do metodo. Nenhum desses recursos muda como voce pensa o programa - eles tiram do caminho o codigo que voce escrevia sem pensar. Para usa-los, voce precisa do **SDK do .NET 10** e da `LangVersion` apropriada. O criterio de adocao e o de sempre: use quando o recurso apaga uma repeticao real, nao por ser novidade.
'''
body_en_us = '''
C# 14 ships with .NET 10 and follows the language's recent philosophy: no new paradigm, just **erasing repeated ceremony**. Every feature here exists to remove a piece of tedious code you used to write on autopilot. Let us go to the ones that show up most in day-to-day work.

## The `field` keyword: the end of the manual backing field

This is the feature that saves the most lines. Before, to put any logic in a setter, you were forced to declare the *backing field* and implement both accessors by hand:

```csharp
// Before C# 14
private string _msg;
public string Message
{
    get => _msg;
    set => _msg = value ?? throw new ArgumentNullException(nameof(value));
}
```

In C# 14, the contextual keyword `field` refers to the field the compiler synthesizes for you. The "private field plus property" pair vanishes:

```csharp
// C# 14
public string Message
{
    get;
    set => field = value ?? throw new ArgumentNullException(nameof(value));
}
```

The caveat: `field` is a **contextual keyword**, not reserved. If your type already has a symbol named `field`, there is ambiguity - resolve it with `@field` or `this.field`, or rename the symbol.

## Extension members: extension beyond methods

For over a decade, "extending" a type in C# meant **only** extension methods. C# 14 introduces `extension` blocks that also allow **extension properties**, **static extension members**, and even **operators** defined as extensions.

```csharp
public static class SequenceExtensions
{
    extension<T>(IEnumerable<T> source) // instance members for IEnumerable<T>
    {
        public bool IsEmpty => !source.Any();          // extension property
        public T FirstOrThrow() => source.First();     // extension method
    }

    extension<T>(IEnumerable<T>) // static members for the type
    {
        public static IEnumerable<T> Empty => Enumerable.Empty<T>();
    }
}

// usage
if (numbers.IsEmpty) { /* ... */ }   // called as if it were an instance member
var none = IEnumerable<int>.Empty;   // called as a static member of the type
```

`IsEmpty` behaves as if it were a native property of `IEnumerable<T>`. It is a real extension of what was possible: before, `source.IsEmpty` simply did not exist as a concept.

## Null-conditional assignment: the guard `if` that disappeared

The `?.` operator can now appear on the **left side** of an assignment. That `if (x is not null)` written only to be able to assign disappears:

```csharp
// Before
if (customer is not null)
    customer.Order = GetCurrentOrder();

// C# 14
customer?.Order = GetCurrentOrder();
```

The semantics matter: the right side **is evaluated only if the target is not null**. If `customer` is null, `GetCurrentOrder()` is not even called. It works with compound assignment (`+=`, `-=`), but not with `++` or `--`.

## Modifiers on simple lambdas

Before, to use `ref`, `out`, `in`, or `scoped` on a lambda parameter, you were forced to type **all** parameters. Now modifiers coexist with type inference:

```csharp
delegate bool TryParse<T>(string text, out T result);

// C# 14: 'out' without having to write the types
TryParse<int> parse = (text, out result) => int.TryParse(text, out result);
```

`params` still requires an explicitly typed parameter list.

## And also

C# 14 brings a few more fine adjustments: `nameof` now accepts **unbound generic types** (`nameof(List<>)` returns `"List"`); there are **first-class implicit conversions** between `Span<T>`, `ReadOnlySpan<T>`, and `T[]`, making span programming more natural and safe; **instance constructors and events can be `partial`**, completing the partial methods and properties from C# 13; and there are **user-defined compound assignment operators** (`+=`, `-=`).

## Conclusion

The thread running through C# 14 is the economy of ceremony. `field` kills the field-property pair; `?.=` kills the guard `if`; extension members take extension beyond the method. None of these features change how you think about the program - they take out of the way the code you used to write without thinking. To use them, you need the **.NET 10 SDK** and the right `LangVersion`. The adoption criterion is the usual one: use it when the feature erases a real repetition, not because it is new.
'''
body_ja_jp = '''
C# 14 は .NET 10 とともに出荷され、近年の言語哲学に従います。新しいパラダイムではなく、**繰り返しの儀式を消す** ことです。ここの各機能は、あなたが無意識に書いていた退屈なコードの一片を取り除くために存在します。日々最も現れるものから見ていきましょう。

## `field` キーワード：手書きバッキングフィールドの終わり

これは最も行数を節約する機能です。以前は、setter に何らかのロジックを入れるには、*バッキングフィールド* を宣言し、両アクセサを手で実装する必要がありました。

```csharp
// C# 14 より前
private string _msg;
public string Message
{
    get => _msg;
    set => _msg = value ?? throw new ArgumentNullException(nameof(value));
}
```

C# 14 では、コンテキストキーワード `field` がコンパイラの合成するフィールドを指します。「プライベートフィールド + プロパティ」の組が消えます。

```csharp
// C# 14
public string Message
{
    get;
    set => field = value ?? throw new ArgumentNullException(nameof(value));
}
```

注意点。`field` は予約語ではなく **コンテキストキーワード** です。型にすでに `field` という名前のシンボルがあると曖昧さが生じます ── `@field` か `this.field` で解決するか、シンボルを改名します。

## 拡張メンバー：メソッドを超えた拡張

十年以上、C# で型を「拡張する」とは **拡張メソッドだけ** を意味しました。C# 14 は `extension` ブロックを導入し、**拡張プロパティ**、**静的拡張メンバー**、さらには拡張として定義された **演算子** も可能にします。

```csharp
public static class SequenceExtensions
{
    extension<T>(IEnumerable<T> source) // IEnumerable<T> のインスタンスメンバー
    {
        public bool IsEmpty => !source.Any();          // 拡張プロパティ
        public T FirstOrThrow() => source.First();     // 拡張メソッド
    }

    extension<T>(IEnumerable<T>) // 型の静的メンバー
    {
        public static IEnumerable<T> Empty => Enumerable.Empty<T>();
    }
}

// 使用
if (numbers.IsEmpty) { /* ... */ }   // インスタンスメンバーのように呼ぶ
var none = IEnumerable<int>.Empty;   // 型の静的メンバーとして呼ぶ
```

`IsEmpty` は `IEnumerable<T>` のネイティブプロパティであるかのように振る舞います。これは可能だったことの真の拡張です ── 以前は `source.IsEmpty` は概念として存在すらしませんでした。

## null 条件付き代入：消えたガードの `if`

`?.` 演算子が代入の **左辺** に現れられるようになりました。代入のためだけに書いていたあの `if (x is not null)` が消えます。

```csharp
// 以前
if (customer is not null)
    customer.Order = GetCurrentOrder();

// C# 14
customer?.Order = GetCurrentOrder();
```

意味が重要です。右辺は **対象が null でないときだけ評価されます**。`customer` が null なら、`GetCurrentOrder()` は呼ばれすらしません。複合代入（`+=`、`-=`）でも機能しますが、`++` や `--` では機能しません。

## 単純なラムダの修飾子

以前は、ラムダ引数に `ref`、`out`、`in`、`scoped` を使うには、**すべて** の引数に型を書く必要がありました。いまや修飾子は型推論と共存します。

```csharp
delegate bool TryParse<T>(string text, out T result);

// C# 14：型を書かずに 'out'
TryParse<int> parse = (text, out result) => int.TryParse(text, out result);
```

`params` はなお、明示的に型付けされた引数リストを要求します。

## さらに

C# 14 はほかにも細かな調整をもたらします。`nameof` が **非バインドのジェネリック型** を受け付け（`nameof(List<>)` は `"List"` を返す）、`Span<T>`・`ReadOnlySpan<T>`・`T[]` の間の **第一級の暗黙変換** によりスパンのプログラミングがより自然で安全になり、**インスタンスコンストラクタとイベントが `partial`** にでき（C# 13 の部分メソッドとプロパティを補完）、**ユーザー定義の複合代入演算子**（`+=`、`-=`）も加わります。

## 結論

C# 14 を貫く糸は儀式の節約です。`field` はフィールドとプロパティの組を殺し、`?.=` はガードの `if` を殺し、拡張メンバーは拡張をメソッドの先へ進めます。これらの機能はプログラムの考え方を変えません ── 考えずに書いていたコードを道から取り除くのです。使うには **.NET 10 SDK** と適切な `LangVersion` が必要です。採用基準はいつもどおり。新しいからではなく、機能が現実の繰り返しを消すときに使いましょう。
'''

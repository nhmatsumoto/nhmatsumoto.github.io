body = '''
## Contexto real

O frontend do SOS Location roda em `http://localhost:5173` (Vite dev server) e o backend .NET em `https://localhost:7001`. Durante o desenvolvimento, toda requisição do frontend ao backend era bloqueada pelo browser com `Access-Control-Allow-Origin` missing. Em produção, o frontend serve de `https://app.sos-location.com.br` e o backend de `https://api.sos-location.com.br` - origens diferentes, CORS necessário.

## Problema específico

A configuração inicial usava `AllowAnyOrigin()` em todos os ambientes, incluindo produção. Isso gerou dois problemas: (1) em produção, qualquer site poderia fazer requisições autenticadas ao backend usando os cookies de sessão do usuário (CSRF via CORS irrestrito); (2) o SignalR Hub de tempo real rejeitava conexões com `wildcard origin` quando credentials eram enviados (`withCredentials: true` é incompatível com `AllowAnyOrigin` no .NET CORS).

## Decisão técnica

Política CORS por ambiente: desenvolvimento permite `localhost:5173`, staging permite o domínio de staging, produção permite apenas `https://app.sos-location.com.br`. Origens configuradas via `appsettings.{Environment}.json`, não hardcoded. SignalR Hub recebe a mesma política CORS que a API REST - resolvendo o erro de wildcard+credentials.

## Implementação

```json
// appsettings.Development.json
{
  "Cors": {
    "AllowedOrigins": ["http://localhost:5173", "http://localhost:3000"]
  }
}

// appsettings.Production.json
{
  "Cors": {
    "AllowedOrigins": ["https://app.sos-location.com.br"]
  }
}
```

```csharp
// Program.cs
var allowedOrigins = builder.Configuration
    .GetSection("Cors:AllowedOrigins")
    .Get<string[]>()
    ?? throw new InvalidOperationException("Cors:AllowedOrigins não configurado.");

builder.Services.AddCors(options =>
{
    options.AddPolicy("SosLocationPolicy", policy =>
    {
        policy
            .WithOrigins(allowedOrigins)
            .AllowAnyHeader()
            .AllowAnyMethod()
            .AllowCredentials();   // necessário para SignalR com cookies
    });
});

// ...

app.UseCors("SosLocationPolicy");  // antes de UseAuthentication e UseAuthorization

app.MapHub<RiskHub>("/hubs/risk"); // SignalR herda a política CORS do middleware
```

## Exemplo concreto

Erro original em desenvolvimento: `Access to fetch at 'https://localhost:7001/api/areas-de-risco' from origin 'http://localhost:5173' has been blocked by CORS policy: No 'Access-Control-Allow-Origin' header`. Após a configuração: zero erros CORS em dev. Em produção, tentativa de acesso de `https://outro-site.com` retorna `403 Forbidden` - backend rejeita a preflight `OPTIONS` da origem não autorizada. SignalR conecta sem erro de wildcard.

## Critério de sucesso

Zero erros CORS em desenvolvimento com Vite (`localhost:5173`). Zero erros CORS em produção para requests do domínio autorizado. Requests de origens não autorizadas bloqueadas com `403` na preflight OPTIONS. SignalR funcional com `withCredentials: true` em todos os ambientes.

## Relação com SOS Location

CORS não é uma formalidade de segurança - é a fronteira que impede que outros sites façam requests autenticados ao SOS Location em nome dos coordenadores logados. Configurar CORS incorretamente em produção seria um vetor de CSRF funcional.
'''
body_en_us = '''
## Real context

SOS Location's frontend runs at `http://localhost:5173` (Vite dev server) and the .NET backend at `https://localhost:7001`. During development, every frontend-to-backend request was blocked by the browser with a missing `Access-Control-Allow-Origin`. In production, the frontend serves from `https://app.sos-location.com.br` and the backend from `https://api.sos-location.com.br` - different origins, CORS required.

## Specific problem

The initial configuration used `AllowAnyOrigin()` in all environments, including production. This caused two problems: (1) in production, any site could make authenticated requests to the backend using the user's session cookies (CSRF via unrestricted CORS); (2) the real-time SignalR Hub rejected connections with `wildcard origin` when credentials were sent (`withCredentials: true` is incompatible with `AllowAnyOrigin` in .NET CORS).

## Technical decision

CORS policy per environment: development allows `localhost:5173`, staging allows the staging domain, production allows only `https://app.sos-location.com.br`. Origins configured via `appsettings.{Environment}.json`, not hardcoded. The SignalR Hub receives the same CORS policy as the REST API - resolving the wildcard+credentials error.

## Implementation

```json
// appsettings.Development.json
{ "Cors": { "AllowedOrigins": ["http://localhost:5173"] } }

// appsettings.Production.json
{ "Cors": { "AllowedOrigins": ["https://app.sos-location.com.br"] } }
```

```csharp
var allowedOrigins = builder.Configuration
    .GetSection("Cors:AllowedOrigins")
    .Get<string[]>()
    ?? throw new InvalidOperationException("Cors:AllowedOrigins not configured.");

builder.Services.AddCors(options =>
{
    options.AddPolicy("SosLocationPolicy", policy =>
        policy
            .WithOrigins(allowedOrigins)
            .AllowAnyHeader()
            .AllowAnyMethod()
            .AllowCredentials());
});

app.UseCors("SosLocationPolicy");
app.MapHub<RiskHub>("/hubs/risk");
```

## Concrete example

Original error in development: `Access to fetch at 'https://localhost:7001/api/areas-de-risco' from origin 'http://localhost:5173' has been blocked by CORS policy: No 'Access-Control-Allow-Origin' header`. After configuration: zero CORS errors in dev. In production, an access attempt from `https://another-site.com` returns `403 Forbidden` - the backend rejects the preflight `OPTIONS` from the unauthorised origin. SignalR connects without a wildcard error.

## Success criteria

Zero CORS errors in development with Vite (`localhost:5173`). Zero CORS errors in production for requests from the authorised domain. Requests from unauthorised origins blocked with `403` on the OPTIONS preflight. SignalR functional with `withCredentials: true` in all environments.

## Relation to SOS Location

CORS is not a security formality - it is the boundary that prevents other sites from making authenticated requests to SOS Location on behalf of logged-in coordinators. Configuring CORS incorrectly in production would be a functional CSRF vector.
'''
body_ja_jp = '''
## 実際のコンテキスト

SOS LocationのフロントエンドはVite devサーバーの`http://localhost:5173`で実行され、.NETバックエンドは`https://localhost:7001`で実行される。開発中、フロントエンドからバックエンドへのすべてのリクエストは、`Access-Control-Allow-Origin`ヘッダーが欠落しているためにブラウザによってブロックされた。本番では、フロントエンドは`https://app.sos-location.com.br`からサーブされ、バックエンドは`https://api.sos-location.com.br`からサーブされる--異なるオリジン、CORSが必要。

## 具体的な問題

最初の設定は本番を含むすべての環境で`AllowAnyOrigin()`を使っていた。これは2つの問題を引き起こした：(1) 本番では、どのサイトでもユーザーのセッションクッキーを使ってバックエンドに認証済みリクエストを送れた（無制限CORSを通じたCSRF）；(2) リアルタイムSignalR Hubはクレデンシャルが送信される時に`wildcard origin`での接続を拒否した（`withCredentials: true`は.NET CORSの`AllowAnyOrigin`と互換性がない）。

## 技術的決定

環境ごとのCORSポリシー：開発は`localhost:5173`を許可、ステージングはステージングドメインを許可、本番は`https://app.sos-location.com.br`のみ許可。オリジンはハードコードではなく`appsettings.{Environment}.json`で設定。SignalR HubはREST APIと同じCORSポリシーを受け取る--wildcard+credentialsエラーを解決。

## 実装

```json
// appsettings.Development.json
{ "Cors": { "AllowedOrigins": ["http://localhost:5173"] } }

// appsettings.Production.json
{ "Cors": { "AllowedOrigins": ["https://app.sos-location.com.br"] } }
```

```csharp
var allowedOrigins = builder.Configuration
    .GetSection("Cors:AllowedOrigins")
    .Get<string[]>()
    ?? throw new InvalidOperationException("Cors:AllowedOriginsが設定されていない。");

builder.Services.AddCors(options =>
{
    options.AddPolicy("SosLocationPolicy", policy =>
        policy
            .WithOrigins(allowedOrigins)
            .AllowAnyHeader()
            .AllowAnyMethod()
            .AllowCredentials());
});

app.UseCors("SosLocationPolicy");
app.MapHub<RiskHub>("/hubs/risk");
```

## 具体的な例

開発での元のエラー：`Access to fetch at 'https://localhost:7001/api/areas-de-risco' from origin 'http://localhost:5173' has been blocked by CORS policy`。設定後：devでのCORSエラーゼロ。本番では、`https://another-site.com`からのアクセス試行は`403 Forbidden`を返す--バックエンドが不正なオリジンからのOPTIONSプリフライトを拒否。SignalRはワイルドカードエラーなしに接続。

## 成功基準

Vite（`localhost:5173`）での開発でのCORSエラーゼロ。許可ドメインからのリクエストに対して本番でのCORSエラーゼロ。不正なオリジンからのリクエストがOPTIONSプリフライトで`403`でブロックされる。すべての環境で`withCredentials: true`でSignalRが機能する。

## SOS Locationとの関係

CORSはセキュリティの形式的なものではなく--他のサイトがログインしているコーディネーターに代わってSOS Locationに認証済みリクエストを送ることを防ぐ境界だ。本番でCORSを誤って設定することは機能するCSRFベクターになる。
'''

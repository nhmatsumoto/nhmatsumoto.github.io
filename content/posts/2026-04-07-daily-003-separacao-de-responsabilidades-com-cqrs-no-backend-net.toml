body = '''
## Contexto real

O SOS Location tem dois tipos de operação radicalmente diferentes sobre os mesmos dados: escrita (registrar ocorrência, criar operação de resgate, emitir alerta) e leitura (buscar hotspots próximos, listar pessoas desaparecidas em área, consultar histórico de operações). Quando essas duas responsabilidades compartilham o mesmo modelo de dados, o modelo acumula campos que só fazem sentido para uma das operações.

## Problema específico

O endpoint `GET /hotspots/nearby` precisava de uma query espacial otimizada no PostGIS — `ST_DWithin` com índice GIST. Mas o modelo `Hotspot` carregava toda a estrutura de domínio rica: eventos de domínio não materializados, navegação para `AreaDeRisco` e validações de invariante. Cada consulta de leitura hidratava um grafo de 7 tabelas quando bastaria uma projeção plana de 4 colunas. Tempo de resposta: 340 ms. Após a separação: 4 ms.

## Decisão técnica

Separar comandos (escrita) de queries (leitura) com MediatR. Comandos usam EF Core com o modelo de domínio completo. Queries usam Dapper com SQL direto e projeções específicas. Os dois lados não compartilham classes de modelo.

## Implementação

```csharp
// ESCRITA: SosLocation.Busca/Application/Commands/RegistrarPessoaDesaparecidaCommand.cs
public sealed record RegistrarPessoaDesaparecidaCommand(
    string Nome,
    double Latitude,
    double Longitude,
    string DescricaoFisica
) : IRequest<Guid>;

public sealed class RegistrarPessoaDesaparecidaHandler
    : IRequestHandler<RegistrarPessoaDesaparecidaCommand, Guid>
{
    private readonly IBuscaRepository _repo;
    private readonly IUnitOfWork      _uow;

    public async Task<Guid> Handle(
        RegistrarPessoaDesaparecidaCommand cmd, CancellationToken ct)
    {
        var loc    = new Coordenadas(cmd.Latitude, cmd.Longitude);
        var pessoa = PessoaDesaparecida.Reportar(cmd.Nome, loc);
        await _repo.AddAsync(pessoa, ct);
        await _uow.CommitAsync(ct);
        return pessoa.Id.Value;
    }
}

// LEITURA: SosLocation.Busca/Application/Queries/BuscarHotspotsProximosQuery.cs
public sealed record BuscarHotspotsProximosQuery(
    double Latitude, double Longitude, double RaioKm
) : IRequest<IReadOnlyList<HotspotProximoDto>>;

public sealed record HotspotProximoDto(
    Guid HotspotId, int NivelRisco, double DistanciaKm, string Descricao);

public sealed class BuscarHotspotsProximosHandler
    : IRequestHandler<BuscarHotspotsProximosQuery, IReadOnlyList<HotspotProximoDto>>
{
    private readonly IDbConnection _db;

    public async Task<IReadOnlyList<HotspotProximoDto>> Handle(
        BuscarHotspotsProximosQuery qry, CancellationToken ct)
    {
        const string sql = """
            SELECT h.id          AS HotspotId,
                   h.nivel_risco AS NivelRisco,
                   ST_Distance(h.centro::geography,
                       ST_MakePoint(@lon, @lat)::geography) / 1000.0 AS DistanciaKm,
                   h.descricao   AS Descricao
            FROM   hotspots h
            WHERE  h.ativo = TRUE
              AND  ST_DWithin(
                     h.centro::geography,
                     ST_MakePoint(@lon, @lat)::geography,
                     @raioMetros)
            ORDER  BY DistanciaKm;
            """;

        var rows = await _db.QueryAsync<HotspotProximoDto>(
            sql,
            new { lat = qry.Latitude, lon = qry.Longitude, raioMetros = qry.RaioKm * 1000 });
        return rows.AsList();
    }
}
```

## Exemplo concreto

A query `BuscarHotspotsProximos` executa em 4 ms com índice GIST para 50.000 hotspots num raio de 5 km. O comando `RegistrarPessoaDesaparecida` usa EF Core para garantir que os eventos de domínio sejam disparados e as invariantes sejam validadas antes da persistência. Nenhum dos dois compromete o desempenho do outro.

## Critério de sucesso

Queries de leitura não hidratam aggregate roots. Comandos de escrita não constroem DTOs de resposta planos. O endpoint `GET /hotspots/nearby` responde em menos de 20 ms sob 200 req/s.

## Relação com SOS Location

Durante um desastre, o SOS Location recebe leituras de mapa em alta frequência (cada dispositivo de campo atualiza a cada 10 segundos) e gravações menos frequentes (registros de ocorrência). A separação CQRS permite escalar o lado de leitura — réplicas e cache — sem afetar a lógica de domínio das gravações.
'''
body_en_us = '''
## Real context

SOS Location has two radically different operation types on the same data: writes (registering an incident, creating a rescue operation, issuing an alert) and reads (searching nearby hotspots, listing missing persons in an area, querying operation history). When these two responsibilities share the same data model, the model accumulates fields that only make sense for one of the two operations.

## Specific problem

The `GET /hotspots/nearby` endpoint needed an optimised spatial query in PostGIS — `ST_DWithin` with a GIST index. But the `Hotspot` domain model carried the full rich domain structure: unmaterialised domain events, navigation to `AreaDeRisco`, and invariant validations. Each read query hydrated a 7-table object graph when a flat 4-column projection was all that was needed. Response time before: 340 ms. After separation: 4 ms.

## Technical decision

Separate commands (writes) from queries (reads) with MediatR. Commands use EF Core with the full domain model. Queries use Dapper with direct SQL and specific projections. The two sides share no model classes.

## Implementation

```csharp
// WRITE: RegistrarPessoaDesaparecidaCommand
public sealed record RegistrarPessoaDesaparecidaCommand(
    string Nome, double Latitude, double Longitude, string DescricaoFisica
) : IRequest<Guid>;

public sealed class RegistrarPessoaDesaparecidaHandler
    : IRequestHandler<RegistrarPessoaDesaparecidaCommand, Guid>
{
    public async Task<Guid> Handle(
        RegistrarPessoaDesaparecidaCommand cmd, CancellationToken ct)
    {
        var loc    = new Coordenadas(cmd.Latitude, cmd.Longitude);
        var pessoa = PessoaDesaparecida.Reportar(cmd.Nome, loc);
        await _repo.AddAsync(pessoa, ct);
        await _uow.CommitAsync(ct);
        return pessoa.Id.Value;
    }
}

// READ: BuscarHotspotsProximosQuery
public sealed record HotspotProximoDto(
    Guid HotspotId, int NivelRisco, double DistanciaKm, string Descricao);

public sealed class BuscarHotspotsProximosHandler
    : IRequestHandler<BuscarHotspotsProximosQuery, IReadOnlyList<HotspotProximoDto>>
{
    public async Task<IReadOnlyList<HotspotProximoDto>> Handle(
        BuscarHotspotsProximosQuery qry, CancellationToken ct)
    {
        const string sql = """
            SELECT h.id AS HotspotId, h.nivel_risco AS NivelRisco,
                   ST_Distance(h.centro::geography,
                       ST_MakePoint(@lon, @lat)::geography) / 1000.0 AS DistanciaKm,
                   h.descricao AS Descricao
            FROM   hotspots h
            WHERE  h.ativo = TRUE
              AND  ST_DWithin(h.centro::geography,
                              ST_MakePoint(@lon, @lat)::geography, @raioMetros)
            ORDER  BY DistanciaKm;
            """;
        var rows = await _db.QueryAsync<HotspotProximoDto>(
            sql, new { lat = qry.Latitude, lon = qry.Longitude, raioMetros = qry.RaioKm * 1000 });
        return rows.AsList();
    }
}
```

## Concrete example

The `BuscarHotspotsProximos` query executes in 4 ms with a GIST index for 50,000 hotspots within a 5 km radius. The `RegistrarPessoaDesaparecida` command uses EF Core to ensure domain events are dispatched and invariants are validated before persistence. Neither compromises the other's performance.

## Success criteria

Read queries do not hydrate aggregate roots. Write commands do not build flat response DTOs. The `GET /hotspots/nearby` endpoint responds in under 20 ms at 200 req/s load.

## Relation to SOS Location

During a disaster, SOS Location receives map reads at high frequency (each field device updates every 10 seconds) and less frequent writes (incident registrations). The CQRS separation allows scaling the read side — read replicas, query caching — without affecting domain logic on the write side.
'''
body_ja_jp = '''
## 実際のコンテキスト

SOS Locationには同じデータに対して根本的に異なる2種類の操作がある：書き込み（インシデント登録、救助作戦の作成、アラート発令）と読み込み（近くのホットスポット検索、エリア内の行方不明者リスト、作戦履歴照会）。この2つの責務が同じデータモデルを共有すると、どちらか一方にしか意味のないフィールドがモデルに蓄積される。

## 具体的な問題

`GET /hotspots/nearby`エンドポイントはPostGISで最適化された空間クエリ（GISTインデックス付きの`ST_DWithin`）が必要だった。しかし`Hotspot`ドメインモデルは、未具体化のドメインイベント・`AreaDeRisco`へのナビゲーション・不変条件の検証を含む完全なリッチドメイン構造を持っていた。4カラムの平坦な射影だけで十分なのに、各読み込みクエリが7テーブルのオブジェクトグラフを生成していた。分離前のレスポンス時間：340ms。分離後：4ms。

## 技術的決定

MediatRを使ってコマンド（書き込み）とクエリ（読み込み）を分離する。コマンドは完全なドメインモデルでEF Coreを使用。クエリは直接SQLと特定の射影でDapperを使用。双方はモデルクラスを共有しない。

## 実装

```csharp
// 書き込み側
public sealed record RegistrarPessoaDesaparecidaCommand(
    string Nome, double Latitude, double Longitude, string DescricaoFisica
) : IRequest<Guid>;

// 読み込み側
public sealed record HotspotProximoDto(
    Guid HotspotId, int NivelRisco, double DistanciaKm, string Descricao);

public sealed class BuscarHotspotsProximosHandler
    : IRequestHandler<BuscarHotspotsProximosQuery, IReadOnlyList<HotspotProximoDto>>
{
    public async Task<IReadOnlyList<HotspotProximoDto>> Handle(
        BuscarHotspotsProximosQuery qry, CancellationToken ct)
    {
        const string sql = """
            SELECT h.id AS HotspotId, h.nivel_risco AS NivelRisco,
                   ST_Distance(h.centro::geography,
                       ST_MakePoint(@lon, @lat)::geography) / 1000.0 AS DistanciaKm,
                   h.descricao AS Descricao
            FROM   hotspots h
            WHERE  h.ativo = TRUE
              AND  ST_DWithin(h.centro::geography,
                              ST_MakePoint(@lon, @lat)::geography, @raioMetros)
            ORDER  BY DistanciaKm;
            """;
        var rows = await _db.QueryAsync<HotspotProximoDto>(
            sql, new { lat = qry.Latitude, lon = qry.Longitude, raioMetros = qry.RaioKm * 1000 });
        return rows.AsList();
    }
}
```

## 具体的な例

`BuscarHotspotsProximos`クエリは、5km半径内の50,000ホットスポットに対してGISTインデックスで4msで実行される。`RegistrarPessoaDesaparecida`コマンドはEF Coreを使用して、永続化前にドメインイベントのディスパッチと不変条件の検証を保証する。どちらも相手のパフォーマンスを損なわない。

## 成功基準

読み込みクエリが集約ルートを生成しない。書き込みコマンドが平坦なレスポンスDTOを構築しない。`GET /hotspots/nearby`エンドポイントが毎秒200リクエストの負荷下で20ms以下で応答する。

## SOS Locationとの関係

災害中、SOS Locationは高頻度のマップ読み込み（各現場デバイスが10秒ごとに更新）と低頻度の書き込み（インシデント登録）を受信する。CQRS分離により、書き込み側のドメインロジックに影響を与えずに読み込み側をスケールできる。
'''

## 実際のコンテキスト

SOS Locationは衛星画像からどのエリアが洪水しているか、どの道路が封鎖されているか、建物が無傷か損傷しているかを自動的に特定する必要がある。この情報は手動フィールドレポートに依存せずに、ほぼリアルタイムでマップのリスクレイヤーを更新する--手動レポートは数時間遅れて届く。

## 具体的な問題

Sentinel-2衛星画像は10m解像度の100 km² GeoTIFFとして届く。画像全体を1回のモデル推論で処理すると利用可能なVRAM（8GB）を超える。さらに、クラス分布は強くアンバランス：どの都市ゾーン画像でも、深刻な洪水イベント中でさえ洪水した水はピクセルの1%未満しか占めない。クラスウェイトなしで訓練されたモデルはすべてを「陸/建物」に分類することを学習し、99%以上の精度を達成する--しかし「水」のF1は0.12だ。

## 技術的決定

3ステップのパイプライン：(1) エッジアーティファクトを避けるための32ピクセルオーバーラップ付き256×256ウィンドウへのタイリング、(2) クラス頻度に反比例するクラスウェイトを持つU-Net推論、(3) モザイク再構成と`gdal_polygonize`経由でのマスクのPostGISポリゴンへの変換。

## 実装

```python
CLASS_WEIGHTS = {
    "water":       8.5,  # 稀少；偽陰性にペナルティを与えるための高いウェイト
    "road":        2.1,
    "building":    1.8,
    "vegetation":  1.0,
    "other":       1.2,
}

TILE_SIZE = 256
OVERLAP   = 32
STRIDE    = TILE_SIZE - OVERLAP

def tile_image(image_array: np.ndarray):
    h, w, _ = image_array.shape
    tiles = []
    for row in range(0, h - TILE_SIZE + 1, STRIDE):
        for col in range(0, w - TILE_SIZE + 1, STRIDE):
            tiles.append((image_array[row:row+TILE_SIZE, col:col+TILE_SIZE, :], row, col))
    return tiles

def run_inference(model, tile: np.ndarray, device: str = "cuda") -> np.ndarray:
    tensor = torch.from_numpy(tile).permute(2, 0, 1).float().unsqueeze(0).to(device)
    with torch.no_grad():
        logits = model(tensor)
        pred   = logits.argmax(dim=1).squeeze(0)
    return pred.cpu().numpy()

def reconstruct_mask(tiles_preds, image_shape):
    """オーバーラップ領域で平均化してタイルをマージする。"""
    h, w = image_shape[:2]
    acc   = np.zeros((h, w), dtype=np.float32)
    count = np.zeros((h, w), dtype=np.float32)
    for (pred, row, col) in tiles_preds:
        acc[row:row+TILE_SIZE, col:col+TILE_SIZE]   += pred
        count[row:row+TILE_SIZE, col:col+TILE_SIZE] += 1
    return (acc / np.maximum(count, 1)).astype(np.uint8)
```

## 具体的な例

2024年洪水時のイタジャイ（SC）市の100 km² Sentinel-2画像：1,560枚の256×256タイル。GPU RTX 3060（8GB VRAM）での推論：4分。生成された水のポリゴン：847個、PostGISの`flood_zones`テーブルに挿入。SOS Locationマップのリスクレイヤーは衛星画像のダウンロード後4分22秒で自動的に更新された。

## 成功基準

実際の洪水画像の検証セットでの「水」クラスのF1スコア ≥ 0.78。パイプライン全体の時間（ダウンロード→タイリング→推論→PostGIS）が100 km²の画像で10分未満。肉眼で再構成されたマスクにエッジアーティファクトが見えない。

## SOS Locationとの関係

SOS Locationのマップに表示される「現在の洪水エリア」レイヤーは、このパイプラインの産物だ。緊急対応コーディネーターはこのレイヤーを使って、どの避難経路が封鎖されているか、どこで救助活動を優先するかを決定する--自動的で正確なマップ更新に依存した決定だ。

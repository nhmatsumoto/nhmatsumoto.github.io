```

## The practical heuristic

Today I tend to measure a decision by how much traceability it improves. If I cannot explain where a rule came from, where it was implemented and how it fails, the architecture is still incomplete.

A compact way to think about it is `am: quality = clarity * feedback * traceability`. It is not a scientific formula; it is an operational reminder. If any factor reaches zero, the result degrades quickly.

## Trade-offs I accept

- I prefer a less elegant but verifiable structure over a beautiful abstraction nobody can debug.
- I prefer explicit names over generic layers while the domain is still moving.
- I prefer recording an incomplete hypothesis over pretending the decision is already mature.


## The problem I try to separate

In almost every technical project there is a layer of discourse and a layer of execution. The first one is usually clean: diagrams, good names, clear intent. The second one is harder: code changes, integrations fail, rules arrive late and context disappears.

The question I use as a filter is direct: **does this reduce operational ambiguity or only improve the appearance of the explanation?** When the answer is only aesthetic, I try to step back.

```mermaid

## 分けて考えたい問題

ほとんどの技術プロジェクトには、説明の層と実行の層があります。前者はきれいです。図、良い名前、明確な意図があります。後者はもっと難しい。コードは変わり、統合は失敗し、ルールは遅れて現れ、文脈は失われます。

私がフィルタとして使う問いは単純です。**これは運用上の曖昧さを減らしているのか、それとも説明の見た目を良くしているだけなのか。** 答えが見た目だけなら、一度戻ります。


## Real context

SOS Location's flood simulation engine uses a cellular automata model: each 5×5 m cell has an elevation, and water flows from the highest cell to adjacent lower ones. The quality of the DEM (Digital Elevation Model) directly determines the accuracy of the flood path. A DEM with ±5 m error can redirect entire simulations to the wrong valleys.

## Specific problem

SRTM (Shuttle Radar Topography Mission) at 30 m resolution is free and covers all of Brazil, but has critical limitations for urban flood simulation: (1) 30 m resolution is too coarse for 8–12 m wide street corridors; (2) SRTM measures the vegetation surface, not the terrain — in regions with tree canopy, the recorded "terrain" can be 10–20 m above the real ground; (3) vertical error of ±16 m in Brazilian tropical regions.

## Technical decision

Two-tier strategy: SRTM 30 m as the national base, ALOS-PALSAR 12.5 m for SOS Location's 50 priority municipalities. Both ingested as rasters in PostGIS via `raster2pgsql`. Runtime elevation query uses `ST_Value(raster, geom)` — sub-millisecond with spatial index.

## Implementation

```sql
-- Ingest SRTM into PostGIS
-- raster2pgsql -s 4326 -I -C -M srtm_brazil.tif public.dem_srtm | psql -d sosdb

CREATE OR REPLACE FUNCTION get_elevation(lat double precision, lon double precision)
RETURNS double precision AS $$
DECLARE
    pt   geometry := ST_SetSRID(ST_MakePoint(lon, lat), 4326);
    elev double precision;
BEGIN
    -- Try ALOS first (higher resolution)
    SELECT ST_Value(rast, pt) INTO elev
    FROM   public.dem_alos
    WHERE  ST_Intersects(rast, pt)
    LIMIT  1;

    IF elev IS NOT NULL THEN RETURN elev; END IF;

    -- Fallback to SRTM
    SELECT ST_Value(rast, pt) INTO elev
    FROM   public.dem_srtm
    WHERE  ST_Intersects(rast, pt)
    LIMIT  1;

    RETURN COALESCE(elev, 0.0);
END;
$$ LANGUAGE plpgsql;
```

```csharp
public sealed class ElevationService : IElevationService
{
    public async Task<double> GetElevacaoAsync(double lat, double lon, CancellationToken ct)
    {
        const string sql = "SELECT get_elevation(@lat, @lon)";
        return await _db.ExecuteScalarAsync<double>(sql, new { lat, lon });
    }
}
```

## Concrete example

Flood simulation for the Centro neighbourhood of Itajaí (SC): elevation grid of 800×600 cells (5 m each) = 4 km² area. PostGIS elevation query: 480,000 values returned in 340 ms using `ST_Value` with GIST index. Without index: 8.4 seconds for the same query. The spatial index reduces DEM preparation time by 25× for each simulation.

## Success criteria

Single-point elevation query (lat, lon) < 2 ms. Elevation grid generation for 4 km² with 5 m cells < 500 ms. Average vertical error of the DEM < 3 m for urban zones with available ALOS data.

## Relation to SOS Location

The DEM is the physical foundation of all SOS Location disaster simulations. The accuracy of evacuation routes calculated by the system depends directly on the accuracy of the terrain elevation. A 5 m elevation error can completely change which neighbourhood the water flows to during an extreme flood simulation.
'''
body_ja_jp = '''
## 実際のコンテキスト

SOS Locationの洪水シミュレーションエンジンはセル状オートマトンモデルを使用する：各5×5mのセルが標高を持ち、水は最も高いセルから隣接する低いセルに流れる。DEM（数値標高モデル）の品質が洪水経路の精度を直接決定する。±5mの誤差を持つDEMはシミュレーション全体を誤った谷に誘導する可能性がある。

## 具体的な問題

30m解像度のSRTM（シャトルレーダー地形ミッション）は無料でブラジル全土をカバーするが、都市洪水シミュレーションには重大な制限がある：(1) 8〜12m幅の街路には30m解像度は粗すぎる；(2) SRTMは地形ではなく植生の表面を測定する——樹冠のある地域では記録された「地形」が実際の地面より10〜20m高い場合がある；(3) ブラジルの熱帯地域での垂直誤差±16m。

## 技術的決定

2層戦略：国家ベースとしてSRTM 30m、SOS Locationの50の優先自治体にALOS-PALSAR 12.5m。両方を`raster2pgsql`でPostGISにラスターとして取り込む。ランタイムの標高クエリは`ST_Value(raster, geom)`を使用——空間インデックスでサブミリ秒。

## 実装

```sql
-- PostGISへのSRTM取り込み
-- raster2pgsql -s 4326 -I -C -M srtm_brazil.tif public.dem_srtm | psql -d sosdb

CREATE OR REPLACE FUNCTION get_elevation(lat double precision, lon double precision)
RETURNS double precision AS $$
DECLARE
    pt   geometry := ST_SetSRID(ST_MakePoint(lon, lat), 4326);
    elev double precision;
BEGIN
    -- 最初にALOSを試す（高解像度）
    SELECT ST_Value(rast, pt) INTO elev
    FROM   public.dem_alos
    WHERE  ST_Intersects(rast, pt)
    LIMIT  1;

    IF elev IS NOT NULL THEN RETURN elev; END IF;

    -- SRTMにフォールバック
    SELECT ST_Value(rast, pt) INTO elev
    FROM   public.dem_srtm
    WHERE  ST_Intersects(rast, pt)
    LIMIT  1;

    RETURN COALESCE(elev, 0.0);
END;
$$ LANGUAGE plpgsql;
```

```csharp
public sealed class ElevationService : IElevationService
{
    public async Task<double> GetElevacaoAsync(double lat, double lon, CancellationToken ct)
    {
        const string sql = "SELECT get_elevation(@lat, @lon)";
        return await _db.ExecuteScalarAsync<double>(sql, new { lat, lon });
    }
}
```

## 具体的な例

イタジャイ（SC）のセントロ地区の洪水シミュレーション：800×600セル（5m各）の標高グリッド = 4 km²のエリア。PostGISの標高クエリ：GISTインデックスを使用した`ST_Value`で480,000値が340msで返される。インデックスなし：同じクエリで8.4秒。空間インデックスはシミュレーションごとのDEM準備時間を25倍削減する。

## 成功基準

単一点標高クエリ（lat, lon） < 2ms。5mセルの4 km²の標高グリッド生成 < 500ms。ALOSデータが利用可能な都市ゾーンのDEMの平均垂直誤差 < 3m。

## SOS Locationとの関係

DEMはSOS Locationのすべての災害シミュレーションの物理的基盤だ。システムが計算する避難経路の精度は地形標高の精度に直接依存する。5mの標高誤差は極端な洪水シミュレーション中に水がどの地区に流れるかを完全に変える可能性がある。

## 実際のコンテキスト

SOS Locationの3D再構成パイプライン（#011）は、影の三角法で建物高さを計算するために各衛星画像が撮影された正確な時刻の太陽角度を知る必要がある。同じ地区を午前7時と午後1時に撮影した画像は完全に異なる長さの影を生成する--太陽角度が考慮されなければ完全に異なる高さが推定される。

## 具体的な問題

最初のプロトタイプは計算を簡略化するために固定の太陽角度45°を使用した。フロリアノーポリスの午前10時の10m高の建物（太陽高度角約52°）の実際の影：7.8m。固定45°使用時：10.0m。誤差22%。洪水シミュレーションにおいて、実際は7.8mなのに10mと推定された建物は、極端な降雨イベントでモデルが建物上部からの水の越流を考慮しない可能性がある。

## 技術的決定

Spencer方程式の簡略版を使用して（緯度、経度、UTC日時）から実際の太陽位置を計算する--高さ推定に十分な精度（ブラジル全土をカバーする緯度-55°〜+55°での太陽高度角の誤差 < 0.5°）。

## 実装

```python
import math
from datetime import datetime, timezone

def day_of_year(dt: datetime) -> int:
    return dt.timetuple().tm_yday

def equation_of_time_minutes(doy: int) -> float:
    """Spencer (1971)の均時差（分単位）。"""
    B = math.radians((360 / 365) * (doy - 81))
    return 9.87 * math.sin(2 * B) - 7.53 * math.cos(B) - 1.5 * math.sin(B)

def solar_declination_deg(doy: int) -> float:
    return 23.45 * math.sin(math.radians((360 / 365) * (doy - 81)))

def solar_elevation_deg(lat_deg: float, lon_deg: float, utc_dt: datetime) -> float:
    doy    = day_of_year(utc_dt)
    eot    = equation_of_time_minutes(doy)
    decl   = solar_declination_deg(doy)

    utc_hour   = utc_dt.hour + utc_dt.minute / 60 + utc_dt.second / 3600
    lstm       = 15 * round(lon_deg / 15)
    time_corr  = eot + 4 * (lon_deg - lstm)
    solar_time = utc_hour + (lon_deg / 15) + time_corr / 60
    hour_angle = 15 * (solar_time - 12)

    lat_r  = math.radians(lat_deg)
    decl_r = math.radians(decl)
    ha_r   = math.radians(hour_angle)

    sin_elev = (math.sin(lat_r) * math.sin(decl_r)
                + math.cos(lat_r) * math.cos(decl_r) * math.cos(ha_r))
    return math.degrees(math.asin(max(-1.0, min(1.0, sin_elev))))

def is_reliable_for_shadow(elevation_deg: float) -> bool:
    """20°未満：影 > 2.75×高さ--視差誤差が推定を信頼できなくする。"""
    return elevation_deg >= 20.0
```

## 具体的な例

レシフェ（lat -8.05°, lon -34.88°）の衛星画像、2026-04-15T13:00Z撮影。

```python
elev = solar_elevation_deg(-8.05, -34.88,
    datetime(2026, 4, 15, 13, 0, 0, tzinfo=timezone.utc))
# → 57.3°
```

太陽高度角57.3°では：10mの建物は6.5mの影を投影する。アルゴリズムは6.5mの影を10.0mの高さに変換する（`tan(57.3°) = 1.54`）。平坦な地形の実際の条件での誤差 < 0.3m。

午前6時UTC（夜明け）の画像：太陽高度角 ≈ 3° → 数百メートルの影 → `is_reliable_for_shadow`が`False`を返す → パイプラインがタイプ別ヒューリスティックを使用。

## 成功基準

太陽高度角 ≥ 35°の平坦な地形での建物の影ベース高さ推定誤差 < 1m。パイプラインが太陽高度角 < 20°の画像を高さ推定に自動的に拒否し、処理ログに理由を記録する。

## SOS Locationとの関係

SOS Locationは異なるプロバイダー（Sentinel-2、Planet Labs）から様々な時間に収集された衛星画像を処理する。画像ごとに実際の太陽位置を計算せずに、3D再構成パイプラインは異なる日時に処理された同じ地区に対して一貫性のない高さを生成する--災害シミュレーションで使用される3Dモデルの一貫性を損なう。

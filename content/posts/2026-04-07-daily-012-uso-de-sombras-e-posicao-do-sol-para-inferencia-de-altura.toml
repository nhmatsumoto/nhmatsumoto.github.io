## Real context

SOS Location's 3D reconstruction pipeline (#011) needs to know the solar angle at the exact moment each satellite image was captured in order to calculate building heights via shadow trigonometry. An image of the same neighbourhood at 7am and at 1pm produces shadows with completely different lengths - and completely different inferred heights if the solar angle is not considered.

## Specific problem

The first prototype used a fixed solar angle of 45° to simplify the calculation. For a 10 m tall building, actual shadow at 10am in Florianópolis (solar elevation ~52°): 7.8 m. Using fixed 45°: 10.0 m. Error of 22%. For flood simulation, a building estimated at 10 m when it is actually 7.8 m may cause the model to not account for water overflow over the building in an extreme rainfall event.

## Technical decision

Calculate the actual solar position from (latitude, longitude, UTC datetime) using the simplified Spencer equation - precision sufficient for height inference (error < 0.5° in solar elevation for latitudes between -55° and +55°, covering all of Brazil).

## Implementation

```python
# sos_location/reconstruction/solar_position.py
import math
from datetime import datetime, timezone

def day_of_year(dt: datetime) -> int:
    return dt.timetuple().tm_yday

def equation_of_time_minutes(doy: int) -> float:
    """Spencer (1971) equation of time, in minutes."""
    B = math.radians((360 / 365) * (doy - 81))
    return 9.87 * math.sin(2 * B) - 7.53 * math.cos(B) - 1.5 * math.sin(B)

def solar_declination_deg(doy: int) -> float:
    return 23.45 * math.sin(math.radians((360 / 365) * (doy - 81)))

def solar_elevation_deg(
    lat_deg: float,
    lon_deg: float,
    utc_dt: datetime
) -> float:
    doy    = day_of_year(utc_dt)
    eot    = equation_of_time_minutes(doy)
    decl   = solar_declination_deg(doy)

    utc_hour   = utc_dt.hour + utc_dt.minute / 60 + utc_dt.second / 3600
    lstm       = 15 * round(lon_deg / 15)
    time_corr  = eot + 4 * (lon_deg - lstm)
    solar_time = utc_hour + (lon_deg / 15) + time_corr / 60

    hour_angle = 15 * (solar_time - 12)

    lat_r  = math.radians(lat_deg)
    decl_r = math.radians(decl)
    ha_r   = math.radians(hour_angle)

    sin_elev = (math.sin(lat_r) * math.sin(decl_r)
                + math.cos(lat_r) * math.cos(decl_r) * math.cos(ha_r))
    return math.degrees(math.asin(max(-1.0, min(1.0, sin_elev))))

def is_reliable_for_shadow(elevation_deg: float) -> bool:
    """Below 20°: shadow > 2.75× height - parallax error makes inference unreliable."""
    return elevation_deg >= 20.0
```

## Concrete example

Satellite image of Recife (lat -8.05°, lon -34.88°) captured at 2026-04-15T13:00Z.

```python
elev = solar_elevation_deg(-8.05, -34.88,
    datetime(2026, 4, 15, 13, 0, 0, tzinfo=timezone.utc))
# → 57.3°
```

With solar elevation 57.3°: a 10 m building projects a 6.5 m shadow. The algorithm converts 6.5 m shadow back to 10.0 m height (`tan(57.3°) = 1.54`). Error < 0.3 m in real flat terrain conditions.

For a 6am UTC image (dawn): solar elevation ≈ 3° → shadows hundreds of metres long → `is_reliable_for_shadow` returns `False` → pipeline uses type heuristic.

## Success criteria

Shadow-based height estimation error < 1 m for buildings on flat terrain with solar elevation ≥ 35°. The pipeline automatically rejects images with solar elevation < 20° for height inference, recording the reason in the processing log.

## Relation to SOS Location

SOS Location processes satellite images collected at varying times from different providers (Sentinel-2, Planet Labs). Without calculating the actual solar position per image, the 3D reconstruction pipeline would produce inconsistent heights for the same neighbourhood processed on different dates or times - undermining the consistency of the 3D model used in disaster simulations.

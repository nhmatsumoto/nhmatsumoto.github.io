このDailyでは、SOS Locationの **性能とスケーラビリティ** トラックにおける **APIペイロード削減** を詳しく整理します。短いメモを、プロダクト、エンジニアリング、運用で再利用できる参照資料にすることが目的です。

## 説明
「APIペイロード削減」を、背景、運用基準、図、数式、実装例とともに整理します。

## 基礎
有用な性能とは、負荷下での予測可能性です。最適化の前に、クリティカルパス、カーディナリティ、キャッシュヒット率、ペイロードサイズ、シリアライズコストを測定します。

中心となる考え方は、**APIペイロード削減** を観測可能にすることです。別の人が読める成果物、コードでテストできる契約、運用チームが検証できる基準が必要です。判断が会話だけに残る場合、それはスケールせず、組織的な学習にもなりません。

## 判断モデル
この判断は、次のような単純な指標で評価できます。

$$
T_{p95} = T_{db} + T_{network} + T_{serialize} + T_{render}
$$

体感レイテンシは複数レイヤーの合計です。ボトルネックが別の場所にある場合、一部だけ改善してもp95は変わらないことがあります。


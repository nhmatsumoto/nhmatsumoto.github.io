## Description
Covers API payload reduction in SOS Location with context, operational criteria, diagrams, formulas and implementation examples.

## Fundamentals
Useful performance is predictability under load. Before optimizing, measure the critical path, cardinality, cache hit ratio, payload size and serialization cost.

The core idea is to make **API payload reduction** observable: there should be an artifact that another person can read, code can test or an operations team can validate. If the decision stays only in conversation, it does not scale and it does not create institutional learning.

## Decision model
The decision can be evaluated with a simple metric:

$$
T_{p95} = T_{db} + T_{network} + T_{serialize} + T_{render}
$$

Perceived latency is the sum of several layers; improving only one may not change p95 if the bottleneck is elsewhere.


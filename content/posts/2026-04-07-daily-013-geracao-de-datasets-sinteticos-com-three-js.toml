## 実際のコンテキスト

SOS Locationの画像セグメンテーションモデル（#014）は、異なる洪水段階（乾燥・0.5m・1m・2m・5mの水深）での都市エリアを示すラベル付き航空画像が必要だ。実際の衛星画像を手動でラベル付けするには数ヶ月かかり、ピクセルレベルのジオリファレンシングを持つ歴史的な洪水データへのアクセスが必要になる。

## 具体的な問題

実際の洪水画像はトレーニングデータで稀だ--ほとんどのイベントで水は領土のごく一部しかカバーしない。50,000枚の都市衛星画像のデータセットでは、100枚未満しか有意な洪水を示さない。1:500（水:陸）のクラス不均衡により、モデルはすべてを「陸」に分類することを学習し、99.8%の精度を達成する--洪水検出には全く役立たない。

## 技術的決定

Three.jsで合成データを生成する：高さが様々な建物を持つ都市ブロックを手続き的に作成し、正射影カメラ（衛星をシミュレート）からレンダリングし、各洪水レベルに対してペア（RGBイメージ+セグメンテーションマスク）をエクスポートする。合成データセットはデザインによりバランスの取れた分布を持つ：洪水レベルごとに20%の画像。

## 実装

```javascript
import * as THREE from 'three';

function createUrbanBlock(config) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8B7355);

  const buildingCount = config.buildingCount || 20;
  for (let i = 0; i < buildingCount; i++) {
    const width  = 8 + Math.random() * 15;
    const depth  = 8 + Math.random() * 15;
    const height = config.heightRange[0] +
                   Math.random() * (config.heightRange[1] - config.heightRange[0]);

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(width, height, depth),
      new THREE.MeshLambertMaterial({
        color: new THREE.Color(0.5 + Math.random() * 0.3, 0.45, 0.4)
      })
    );
    mesh.position.set(
      (Math.random() - 0.5) * 200,
      height / 2,
      (Math.random() - 0.5) * 200
    );
    scene.add(mesh);
  }
  return scene;
}

function addFloodLayer(scene, waterLevelM) {
  if (waterLevelM <= 0) return;
  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(256, 256),
    new THREE.MeshLambertMaterial({ color: 0x1a6b9e, transparent: true, opacity: 0.75 })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = waterLevelM;
  scene.add(water);
}

// 洪水レベルごとに5,000ペアを生成
const FLOOD_LEVELS = [0, 0.5, 1.0, 2.0, 5.0]; // メートル
for (const level of FLOOD_LEVELS) {
  for (let i = 0; i < 5000; i++) {
    const scene = createUrbanBlock({ buildingCount: 15 + Math.floor(Math.random() * 20),
                                     heightRange: [4, 30] });
    addFloodLayer(scene, level);
    renderOrthographic(scene, renderer);
  }
}
```

## 具体的な例

生成されたデータセット：25,000枚（5,000枚×5洪水レベル）、バランスの取れた分布20%/レベル。MacBook M2での生成時間：256×256pxの25,000ペアに4時間。このデータセットで訓練されたモデルは、実際の画像の検証セットで「水」クラスのF1スコア0.84を達成--アンバランスな実データのみで訓練されたモデルのF1 0.12と比較して。

## 成功基準

バランスの取れたクラス分布でデータセットを生成（最頻クラスと最少頻クラスの差が最大30%）。検証セットの「水」クラスのF1スコア ≥ 0.75。完全なデータセット生成時間（25,000枚）がコンシューマーハードウェアで6時間未満。

## SOS Locationとの関係

SOS Locationのマップでリアルタイムに洪水エリアを検出するセグメンテーションモデルは、この合成データパイプラインの産物だ。合成データによるクラスバランシングなしでは、モデルは高い信頼度であらゆるピクセルを「陸」に分類する--SOS Locationの洪水可視化レイヤーを完全に機能不全にする。

## 実際のコンテキスト

コーディネーターがSOS LocationでOperacaoDeResgate`を開くとき、クライアントは4種類のデータが必要だ：作戦のリスクエリア、アクティブなホットスポット、リンクされた行方不明者、計算された避難経路。作戦を開くことは緊急時に頻繁に起こる--イベント中に複数のコーディネーターが同時に開く。

## 具体的な問題

最初のバージョンは4つの並列リクエストを行っていた：`GET /api/areas-de-risco?operacaoId=x`、`GET /api/hotspots?operacaoId=x`、`GET /api/pessoas-desaparecidas?operacaoId=x`、`GET /api/rotas?operacaoId=x`。問題：(1) 4×のHTTPオーバーヘッド（ヘッダー、償却されたTLSハンドシェイク、ネットワークラウンドトリップ）--4Gモバイルで、各リクエストには~80msの基本レイテンシがあり、クエリ時間以外に320msのオーバーヘッド；(2) 4つのリクエストのどれかが失敗すると、クライアントはどのデータが欠けているかの明確な指示なしに部分的な状態になる；(3) 4つの異なるコリレーションIDに分散したログは遅いロードのトレースを不可能にした。

## 技術的決定

4つのクエリを並列で実行（`Task.WhenAll`）して単一の複合オブジェクトを返す`GET /api/operacoes/{id}/snapshot`エンドポイント。総時間 = 合計ではなくmax（4クエリの時間）。単一の`traceId`でコリレーション。サブクエリが失敗した場合、スナップショットは利用可能なデータを返し、どの部分が失敗したかを示す`errors[]`フィールドを持つ--グレースフルデグラデーション。

## 実装

```csharp
public sealed class GetOperacaoSnapshotQueryHandler
    : IRequestHandler<GetOperacaoSnapshotQuery, OperacaoSnapshotDto>
{
    public async Task<OperacaoSnapshotDto> Handle(
        GetOperacaoSnapshotQuery query, CancellationToken ct)
    {
        var areasTask    = GetAreasAsync(query.OperacaoId, query.TenantId, ct);
        var hotspotsTask = GetHotspotsAsync(query.OperacaoId, query.TenantId, ct);
        var pessoasTask  = GetPessoasAsync(query.OperacaoId, query.TenantId, ct);
        var rotasTask    = GetRotasAsync(query.OperacaoId, query.TenantId, ct);

        await Task.WhenAll(areasTask, hotspotsTask, pessoasTask, rotasTask);

        return new OperacaoSnapshotDto(
            OperacaoId:           query.OperacaoId,
            AreasDeRisco:         areasTask.Result,
            HotspotsAtivos:       hotspotsTask.Result,
            PessoasDesaparecidas: pessoasTask.Result,
            RotasEvacuacao:       rotasTask.Result,
            SnapshotAt:           DateTime.UtcNow
        );
    }
}
```

```csharp
app.MapGet("/api/operacoes/{id}/snapshot",
    async (Guid id, ISender sender, ClaimsPrincipal user) =>
        Results.Ok(await sender.Send(new GetOperacaoSnapshotQuery(id, user.GetTenantId()))))
    .RequireAuthorization();
```

## 具体的な例

イタジャイの洪水中の作戦開始：4つの並列リクエスト（旧バージョン）→ 420ms合計（最も遅いものに制限：`GetRotasAsync` = 380ms、他の3つ = 90ms、120ms、140ms）。スナップショットエンドポイント → 395ms合計（HTTPオーバーヘッドに制限された`Promise.all`でシミュレートされた並列ではなく、実際の並列）。実際の利益：合計時間から25ms削減 + ネットワークラウンドトリップ3回減少 + ロード全体の1つのコリレーションID。劣化した3G（災害イベント）：作戦開始ごとに200ms節約。

## 成功基準

最大500エリア・200ホットスポット・300行方不明者・50ルートを持つ作戦に対して500ms未満でスナップショットを返す。クライアントでの部分的状態ゼロ--スナップショットが失敗すると500で完全に失敗；サブクエリが失敗すると`errors[]`フィールドがどれかを示す。作戦ロード全体の単一`traceId`を持つログ。

## SOS Locationとの関係

スナップショットエンドポイントは実際の使用パターンへの建築的な回答だ：「作戦を開く」はコーディネーターの視点からは原子的な行動だが、技術的な視点からは4つのHTTPトランザクションだった。APIの粒度を作戦の粒度に合わせることで、クライアントの複雑さを減らしトレーサビリティを改善する。
'''

## 実際のコンテキスト

SOS Locationの`AreaDeRisco`の`NivelRisco`は、コーディネーターが行動を優先するために使う指標だ：最初にどこに救助チームを送るか、どのゾーンを即座に避難させるか、どれを単に監視するか。スケールはマップで素早く読み取れる必要がある--30のアクティブゾーンを持つコーディネーターは数字を1つずつ読まず、秒単位でアウトライアーを特定するために色グラデーションを使う。

## 具体的な問題

最初のバージョンは2色のみを使っていた：緑（低リスク）と赤（高リスク）、閾値5。問題：レベル4のゾーンとレベル8のゾーンが同じ赤か緑で表示されていた--コーディネーターは緊急度の差を区別できなかった。さらに、`NivelRisco`がSignalR経由でリアルタイムに変わると、色を変えるためにLeafletでポリゴンを破棄して再作成する必要があり、200msの視覚的フラッシュが発生した。

## 技術的決定

`RISK_COLORS`にマップされた10色グラデーション（緑→黄→オレンジ→濃い赤）。再構築なしの色更新：`L.GeoJSON`を再作成する代わりに、システムはレイヤーへの参照を保持し、`setStyle()`を使って色だけを更新する。SignalRは`{areaId, novoNivel}`で`nivelRiscoAtualizado`を通知--`RiskAreaLayer`コンポーネントは`Map<Guid, L.Layer>`経由でO(1)で特定のレイヤー参照を更新する。

## 実装

```ts
export const RISK_COLORS: Record<number, string> = {
  1: '#2dc653', 2: '#5fd46a', 3: '#a8d06e',
  4: '#d4c44e', 5: '#e6a817', 6: '#e07b17',
  7: '#d45c17', 8: '#c43617', 9: '#a81717',
  10: '#7d0000',
};
```

```tsx

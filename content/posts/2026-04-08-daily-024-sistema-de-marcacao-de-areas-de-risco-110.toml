  const { subscribe } = useSignalR();

  useEffect(() => {
    if (!mapInstance) return;

    const renderer = L.canvas({ padding: 0.5 });
    const group    = L.featureGroup().addTo(mapInstance);

    for (const area of areas) {
      const color = RISK_COLORS[area.nivelRisco] ?? '#888';
      const layer = L.geoJSON(area.geometry, {
        renderer,
        style: { color, fillColor: color, fillOpacity: 0.4, weight: 1 },
      }).addTo(group);
      layerMap.current.set(area.id, layer);
    }

    const unsub = subscribe('nivelRiscoAtualizado', (areaId: string, novoNivel: number) => {
      const layer = layerMap.current.get(areaId);
      if (!layer) return;
      const color = RISK_COLORS[novoNivel] ?? '#888';
      layer.setStyle({ color, fillColor: color });
    });

    return () => { unsub(); group.remove(); layerMap.current.clear(); };
  }, [mapInstance, areas]);

  return null;
}
```

## 具体的な例

レシフェでの大雨イベント--15:42に、Open-MeteoがAfogados地区の3ゾーンで48mm/6hの累積降水量を検出。バックエンドが3ゾーンの`NivelRisco`を4から8に更新し、SignalR経由で`nivelRiscoAtualizado`を発行。フロントエンド：3ポリゴンが`setStyle()`でオレンジから濃い赤に11msで変化--フラッシュゼロ、レイヤー再構築ゼロ。画面上のコーディネーターはインタラクションなしに即座に変化を確認。

## 成功基準

SignalR経由のポリゴン色更新、イベント受信後 < 20ms。5インチ画面（モバイル）で凡例なしに読める10色グラデーション。既存ゾーンの`NivelRisco`更新時のLeafletレイヤー再構築ゼロ。

## SOS Locationとの関係

`NivelRisco`はSOS Locationの運用言語--行動優先度を決定する指標だ。マップ上の視覚的表現はリアルタイムで視覚的ノイズなく更新される必要がある。10色グラデーション + `setStyle()` + SignalRの組み合わせが、バックエンドで更新されたデータとコーディネーターのマップ上の視覚的知覚のギャップを閉じる。

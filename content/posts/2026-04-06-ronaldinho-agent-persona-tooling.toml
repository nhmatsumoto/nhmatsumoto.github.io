body_en_us = """
# Why Ronaldinho Agent left the projects area

`ronaldinho-agent` started as an experiment to test three questions at the same time:

1. how much a persona changes the perceived usefulness of an agent;
2. how to keep short-term memory without overcomplicating the architecture;
3. where the orchestration layer ends and the real domain of the system begins.

Over time, it became clear that the main value of the project was not treating it as a featured product, but using it as a laboratory for engineering decisions. That is why it now lives here as a publication connected to the rest of the site.

## What the experiment validated

- **Persona as an interface constraint**: using personality in the system prompt changed the experience, but only worked well while the architecture remained technical underneath.
- **Short-term memory sufficient for objective sessions**: conversation history handled small interactions well, especially when combined with more deterministic answers.
- **Tool use with an explicit dispatcher**: the boundary between reasoning and execution became more readable when external calls were treated as contracts.

## Where it fits today

Today the project makes more sense as reference material for:

- posts about boundaries in agent systems;
- architecture documents related to runtime, tools and modularity;
- decisions about how this site itself organizes technical knowledge.

The [Ronaldinho Architecture Overview](/documents/ronaldinho-architecture-overview/) document remains available as a complementary note, but the dedicated project route is gone to reduce noise in the information architecture.

## Editorial decision

When something works more as a case study than as a main portfolio asset, the best structure is to turn it into a publication. That preserves context, improves navigation and avoids competing with projects that now represent my current direction more clearly.

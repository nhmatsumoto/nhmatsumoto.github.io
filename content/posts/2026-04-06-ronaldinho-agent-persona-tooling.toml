body_ja_jp = """
# Ronaldinho Agent をプロジェクト領域から外した理由

`ronaldinho-agent` は、次の三つの問いを同時に試すための実験として始まった。

1. persona がエージェントの有用性の感じ方をどれだけ変えるのか。
2. アーキテクチャを複雑にしすぎずに短期記憶をどう保つのか。
3. オーケストレーション層はどこで終わり、システムの本当のドメインはどこから始まるのか。

時間が経つにつれて、このプロジェクトの主な価値は、目立つプロダクトとして扱うことではなく、エンジニアリング判断の実験室として使うことにあると分かった。そのため、今はサイト全体とつながる公開記事としてここに置いている。

## この実験で検証できたこと

- **インターフェース制約としての persona**: system prompt に人格を入れると体験は変わる。ただし、内部のアーキテクチャが技術的に保たれている場合にだけうまく機能した。
- **目的が明確なセッションには十分な短期記憶**: 会話履歴は小さなやり取りにはよく効いた。特に、より決定的な回答と組み合わせたときに扱いやすかった。
- **明示的な dispatcher を使った tool use**: 外部呼び出しを契約として扱うと、推論と実行の境界が読みやすくなった。

## 現在の位置づけ

今のこのプロジェクトは、次のための参照資料としてのほうが自然だ。

- エージェントシステムにおける boundary についての記事。
- runtime、tools、modularity に関するアーキテクチャ文書。
- このサイト自体が技術知識をどう整理するかという判断。

[Ronaldinho Architecture Overview](/documents/ronaldinho-architecture-overview/) は補足ノートとして残している。ただし、情報設計上のノイズを減らすため、専用のプロジェクトルートはなくした。

## 編集上の判断


body = '''
Este Daily aprofunda **Uso de tokens únicos por transação** dentro da trilha **Pagamentos e Consistência** do SOS Location. A ideia é sair de uma nota curta e transformar o item em material de referência para produto, engenharia e operação.

## Descrição
Associa cada operação financeira a uma chave única para controlar reprocessamento e impedir duplicidade.

## Fundamentos
Pagamento é domínio financeiro, não apenas integração. Cada clique, retry e callback precisa ser tratado como evento possivelmente duplicado, fora de ordem ou tardio.

O ponto central é tornar **Uso de tokens únicos por transação** observável: deve existir um artefato que possa ser lido por outra pessoa, testado por código ou validado por uma equipe operacional. Quando a decisão fica apenas na conversa, ela não escala e não cria aprendizado institucional.

## Modelo de decisão
A decisão pode ser avaliada com uma métrica simples:

$$
B = \sum_{t \in T} amount(t) \cdot \mathbf{1}_{unique(idempotency\_key_t)}
$$

O saldo só muda para transações únicas. A chave de idempotência transforma repetição técnica em operação segura.

## Diagrama de fluxo
```mermaid
flowchart LR
  A["Sinal de campo"] --> B["Uso de tokens únicos por transação"]
  B --> C["Contrato verificável"]
  C --> D["Implementação incremental"]
  D --> E["Métrica operacional"]
```

## Gráfico de maturidade
```mermaid
xychart-beta
    title "Leitura de maturidade"
    x-axis ["Clareza", "Risco", "Implementação"]
    y-axis "Pontuação" 0 --> 10
    bar [8, 7, 9]
```

## Exemplo de implementação
```csharp
public async Task<PaymentResult> CreatePaymentAsync(CreatePayment command)
{
    var existing = await payments.FindByIdempotencyKeyAsync(command.IdempotencyKey);
    if (existing is not null) return PaymentResult.From(existing);

    var payment = Payment.Start(command.UserId, command.Amount, command.IdempotencyKey);
    await payments.SaveAsync(payment);
    await outbox.EnqueueAsync(new PaymentRequested(payment.Id));
    return PaymentResult.From(payment);
}
```

## Como aplicar no SOS Location
- Defina o contrato mínimo: entrada, saída, dono da decisão e comportamento esperado em erro.
- Registre a decisão perto do código ou do documento de arquitetura que será mantido junto com o sistema.
- Crie um teste, consulta ou dashboard que mostre se o comportamento continua verdadeiro com dados reais.
- Revise o impacto em operação: tempo de resposta, rastreabilidade, custo cognitivo e risco de interpretação.

## Armadilhas comuns
- Transformar o conceito em abstração genérica demais antes de validar um caso de uso real.
- Misturar regra de negócio, integração externa e detalhe visual no mesmo lugar.
- Medir apenas funcionamento técnico e esquecer o efeito para equipes de resgate, usuários afetados ou operadores.

## Critério de sucesso
O item está maduro quando uma pessoa nova consegue entender o motivo da decisão, executar um exemplo mínimo, ver o fluxo no diagrama e identificar qual métrica indicaria regressão.

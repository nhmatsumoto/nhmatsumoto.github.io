body_ja_jp = '''
## 実際のコンテキスト

`Idempotency-Key`（#042）によるAPI冪等性はクライアントが正しくキーを送信することに依存する。しかし別の攻撃ベクターがある：ブラウザのネイティブ「フォーム再送信」機能（POST後のF5）と、フォームからStripeトークンをキャプチャして複数回送信しようとするボット。2026年4月、2つの識別されたボットがテストテナントで傍受した以前の寄付のStripeトークンのリプレイを試みた。

## 具体的な問題

フロントエンドがバックエンドに送信するStripeトークン（`stripeToken`）はStripe.jsによって一度生成され、24時間有効だ。SOS Locationの追加制御なしに、同じトークンをバックエンドに複数回送信できる——攻撃者がキャプチャした決済方法を使って生成した新しいトークンで各POSTを行う。`Idempotency-Key`（#042）は同じリクエストの再送信を保護するが、同じ決済方法から生成された異なるStripeトークンを持つ複数のリクエストには対応しない。

## 技術的決定

使い捨てトランザクショントークン（`DoacaoTransactionToken`）：UUID v4+タイムスタンプで`GET /api/v2/doacoes/token`にて生成、15分TTLと`status: "unused"`でRedisに保存。寄付POSTは`X-Transaction-Token`ヘッダーにトークンを要求。ハンドラーは確認：(1) トークンがRedisに存在；(2) ステータスが`"unused"`；(3) 期限切れでない。有効な場合、Stripeを呼ぶ前に`SET ... NX`でアトミックに`"used"`にマーク。`"used"`トークンは即座に409 Conflictを返す。

## 実装

```csharp
// トークン生成エンドポイント
app.MapGet("/api/v2/doacoes/token",
    async (ClaimsPrincipal user, IRedisCache cache, CancellationToken ct) =>
    {
        var token    = Guid.NewGuid().ToString("N");
        var cacheKey = $"doacao_token:{token}";
        await cache.SetAsync(cacheKey,
            new DoacaoTokenRecord(user.GetUserId(), Status: "unused"),
            TimeSpan.FromMinutes(15), ct);
        return Results.Ok(new { token, expiresInSeconds = 900 });
    })
    .RequireAuthorization();
```

```csharp
// ProcessarDoacaoCommandHandlerで
var wasUnused = await _cache.SetIfValueAsync(
    $"doacao_token:{cmd.TransactionToken}",
    expectedValue: new DoacaoTokenRecord(cmd.DoaderId, "unused"),
    newValue:       new DoacaoTokenRecord(cmd.DoaderId, "used"),
    ct);

if (!wasUnused)
    throw new ConflictException($"トランザクショントークンは既に使用済みか期限切れです。");

var charge = await _stripe.ChargeAsync(cmd.ValorCentavos, cmd.StripeToken, ct);
```

## 具体的な例

ボットがR$100テスト寄付からStripeトークンをキャプチャ。元のリクエストの`X-Transaction-Token`で5回のリプレイを試みる。最初の試行：Redisトークン`doacao_token:abc123...`が`status: "unused"` → 処理済み、`"used"`にマーク、寄付記録。試行2〜5：Redisが`status: "used"`のトークンを返す → 即座に409 Conflict、Stripeへの呼び出しなし。ログ：`「トランザクショントークンabc123は既に使用済み——IP 203.0.113.42からのリプレイ試行の可能性」`。

## 成功基準

トランザクショントークンのリプレイによる重複課金ゼロ。期限切れトークン（15分以上未使用）は409を返す——「孤児トークン」は受け入れない。リプレイ試行はセキュリティ分析のためソースIPと共にログに記録。

## SOS Locationとの関係

緊急寄付は感情的価値が高い——寄付者は危機の瞬間に寄付する。一意トランザクショントークン + API冪等性（#042）+ ボタン状態（#041）の組み合わせは、重複が発生するために3つの独立したレイヤーが同時に失敗する必要がある多層防御システムを形成する。

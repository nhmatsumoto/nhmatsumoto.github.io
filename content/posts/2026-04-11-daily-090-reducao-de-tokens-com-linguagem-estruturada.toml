## 説明
目的は、**構造化言語によるトークン削減** をコード、契約、運用で検証できる成果物にすることです。

## 基礎
チームが「誰が決めるか」「何が変わるか」「どう測るか」に答えられないなら、**構造化言語によるトークン削減** はまだ抽象的です。 実践的なルールは、その成果物を変更対象の流れの近くに置くことです。

## 数式
判断を読むための指標:
リスク = 重複 × 影響 × 検知遅延

## フロー図
```mermaid
flowchart LR
  A["Clique ou webhook"] --> B["Token único"]
  B --> C["Estado pending"]
  C --> D["Processamento assíncrono"]
  D --> E["completed or failed"]
```

## 実装例
```typescript
const seen = new Set<string>();

export function processD090ReducaoDeTokensComLinguagemEst(token: string) {
  if (seen.has(token)) return 'duplicate';
  seen.add(token);
  return 'accepted';
}
```

## SOS Location での適用方法
- 構造化言語によるトークン削減 の最小契約を定義します。
- 判断を、チームが長期的に維持する場所に記録します。
- 実データ、テスト、検証可能なクエリで確認します。

## よくある落とし穴
- 再実行対策なしに1回のクリックを信頼する。
- 意図を記録する前に残高や状態を更新する。

## 成功基準
重複が減り、監査可能で、ロールバックが予測できれば成功です。

このDailyでは、SOS Locationの **セキュリティ** トラックにおける **重要操作の監査ログ** を詳しく整理します。

## 説明
目的は、**重要操作の監査ログ** をコード、契約、運用で検証できる成果物にすることです。

## 基礎
チームが「誰が決めるか」「何が変わるか」「どう測るか」に答えられないなら、**重要操作の監査ログ** はまだ抽象的です。 実践的なルールは、その成果物を変更対象の流れの近くに置くことです。

## 数式
判断を読むための指標:
リスク = 露出 × 権限 × 発見容易性

## フロー図
```mermaid
flowchart LR
  A["Input"] --> B["Validation"]
  B --> C["Authentication"]
  C --> D["Authorization"]
  D --> E["Audit log"]
```

## 実装例
```csharp
public sealed class D077LogsDeAuditoriaParaAcoesCriticValidator
{
    public bool IsValid(string value) => !string.IsNullOrWhiteSpace(value);
}
```

## SOS Location での適用方法
- 重要操作の監査ログ の最小契約を定義します。
- 判断を、チームが長期的に維持する場所に記録します。
- 実データ、テスト、検証可能なクエリで確認します。

## よくある落とし穴
- セキュリティルールをクライアントやフロントエンドに任せる。
- 監査ログなしで機密エンドポイントを公開する。

## 成功基準
失敗を防ぎ、記録し、説明できれば防御は機能しています。

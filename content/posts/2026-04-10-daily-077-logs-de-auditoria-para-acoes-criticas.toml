{
    public bool IsValid(string value) => !string.IsNullOrWhiteSpace(value);
}
```

## Como aplicar no SOS Location
- Defina o contrato mínimo para Logs de auditoria para ações críticas.
- Registre a decisão onde a equipe realmente a mantém ao longo do tempo.
- Valide com dado real, teste ou consulta verificável.

## Erros comuns
- Confiar em cliente ou frontend para impor regra de segurança.
- Liberar endpoint sensível sem trilha de auditoria.

## Critério de sucesso
A defesa funciona quando a falha é bloqueada, registrada e explicável.

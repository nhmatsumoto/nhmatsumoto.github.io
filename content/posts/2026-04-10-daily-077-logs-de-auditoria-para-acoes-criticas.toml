This Daily expands **Audit logs for critical actions** within the **security** track of SOS Location.

## Description
The goal is to turn **Audit logs for critical actions** into a verifiable artifact in code, contract, or operations.

## Fundamentals
If the team cannot answer who decides, what changes, and how to measure it, **Audit logs for critical actions** is still abstract. The practical rule is to keep the artifact close to the flow it changes.

## Formula
Practical reading of the decision:
Risk = exposure × privilege × detectability


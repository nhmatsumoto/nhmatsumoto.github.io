Este Daily aprofunda **Logs de auditoria para ações críticas** dentro da trilha **segurança** do SOS Location.

## Descrição
O objetivo é transformar **Logs de auditoria para ações críticas** em um artefato verificável no código, no contrato ou na operação.

## Fundamentos
Se o time não consegue responder quem decide, o que muda e como medir, **Logs de auditoria para ações críticas** ainda está abstrato. A regra prática é manter o artefato perto do fluxo que ele altera.

## Fórmula
Leitura objetiva da decisão:
Risco = exposição × privilégio × detectabilidade

## Diagrama
```mermaid
flowchart LR
  A["Input"] --> B["Validation"]
  B --> C["Authentication"]
  C --> D["Authorization"]
  D --> E["Audit log"]
```

## Exemplo de implementação
```csharp

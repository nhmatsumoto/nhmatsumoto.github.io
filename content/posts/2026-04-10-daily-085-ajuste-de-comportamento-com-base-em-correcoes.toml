body = '''
Este Daily aprofunda **Ajuste de comportamento com base em correções** dentro da trilha **produto e visão** do SOS Location.

## Descrição
O objetivo é transformar **Ajuste de comportamento com base em correções** em um artefato verificável no código, no contrato ou na operação.

## Fundamentos
Se o time não consegue responder quem decide, o que muda e como medir, **Ajuste de comportamento com base em correções** ainda está abstrato. A regra prática é manter o artefato perto do fluxo que ele altera.

## Fórmula
Leitura objetiva da decisão:
Impacto = alcance × confiança × prontidão

## Diagrama
```mermaid
flowchart LR
  A["Necessidade"] --> B["Proposta de valor"]
  B --> C["Entrega"]
  C --> D["Medição pública"]
  D --> E["Ajuste de rota"]
```

## Exemplo de implementação
```typescript
export const D085AjusteDeComportamentoComBaseEmCapability = {
  name: 'D085AjusteDeComportamentoComBaseEm',
  status: 'planned',
  owner: 'product',
};
```

## Como aplicar no SOS Location
- Defina o contrato mínimo para Ajuste de comportamento com base em correções.
- Registre a decisão onde a equipe realmente a mantém ao longo do tempo.
- Valide com dado real, teste ou consulta verificável.

## Erros comuns
- Prometer valor sem um caminho operacional claro.
- Medir só entrega e ignorar confiança ou transparência.

## Critério de sucesso
O produto evolui bem quando o impacto é visível e explicável para qualquer equipe.

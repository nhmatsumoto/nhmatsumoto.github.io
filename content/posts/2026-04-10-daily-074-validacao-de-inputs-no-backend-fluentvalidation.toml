body = '''
Este Daily aprofunda **Validação de inputs no backend (FluentValidation)** dentro da trilha **backend e APIs** do SOS Location.

## Descrição
O objetivo é transformar **Validação de inputs no backend (FluentValidation)** em um artefato verificável no código, no contrato ou na operação.

## Fundamentos
Se o time não consegue responder quem decide, o que muda e como medir, **Validação de inputs no backend (FluentValidation)** ainda está abstrato. A regra prática é manter o artefato perto do fluxo que ele altera.

## Fórmula
Leitura objetiva da decisão:
Confiabilidade = sucesso × observabilidade / falhas não tratadas

## Diagrama
```mermaid
flowchart LR
  A["Request"] --> B["Auth/CORS/Versioning"]
  B --> C["Handler"]
  C --> D["External API or DB"]
  D --> E["Structured log and response"]
```

## Exemplo de implementação
```csharp
app.Use(async (context, next) =>
{
    context.Response.Headers["X-Trace-Topic"] = "D074ValidacaoDeInputsNoBackendFlue";
    await next();
});
```

## Como aplicar no SOS Location
- Defina o contrato mínimo para Validação de inputs no backend (FluentValidation).
- Registre a decisão onde a equipe realmente a mantém ao longo do tempo.
- Valide com dado real, teste ou consulta verificável.

## Erros comuns
- Responder sem rastreabilidade suficiente para depurar produção.
- Tratar erro de integração como caso excepcional e não como fluxo normal.

## Critério de sucesso
A solução está boa quando o time encontra causa, impacto e correção em poucos minutos.

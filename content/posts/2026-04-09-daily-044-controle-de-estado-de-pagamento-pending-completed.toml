## 実際のコンテキスト

SOS Locationは寄付者が確認した時点で即座に`Doacao`を記録する--Stripeからの確認を受け取る前に。これにより、決済結果に関係なく寄付意図を測定でき、非同期処理（#048）が機能する。問題は、バックエンドがStripeのウェブフックがリトライ後に遅れて届いた際に`completed`の寄付を`failed`に更新し、正しい状態を上書きすることがあった時に発生した。

## 具体的な問題

`doacoes`テーブルの`status`カラムはドメインバリデーションのない`varchar`だった--どのUPDATEも任意の値をセットできた。2つのインシデントで：(1) StripeウェブフックハンドラーがAntérieur順不同の古いイベントを処理して`completed`の寄付を`failed`にマーク；(2) 並行性バグにより、`pending`の寄付が同じ寄付のウェブフックを処理する2つのHangfireワーカーによって同時に`completed`と`failed`にマークされた。

## 技術的決定

ドメインに明示的なステートマシンを持つ`DoacaoStatus`バリューオブジェクト。有効な遷移：`pending → processing → completed`、`pending → processing → failed`、`completed → refunded`。無効な遷移は`InvalidDoacaoTransitionException`をスロー。各遷移の不変記録を持つ`doacao_status_history`テーブル--`INSERT`のみ、`UPDATE`なし。`doacoes`テーブルの`status`フィールドは、実行前に遷移を検証するストアドプロシージャで更新。

## 実装

```csharp
public sealed class DoacaoStatus
{
    private static readonly Dictionary<string, string[]> _validTransitions = new()
    {
        ["pending"]    = ["processing"],
        ["processing"] = ["completed", "failed"],
        ["completed"]  = ["refunded"],
        ["failed"]     = [],
        ["refunded"]   = [],
    };

    public DoacaoStatus TransitionTo(DoacaoStatus next)
    {
        if (!_validTransitions[Value].Contains(next.Value))
            throw new InvalidDoacaoTransitionException(
                $"無効な遷移: {Value} → {next.Value}");
        return next;
    }
}

public sealed class Doacao : AggregateRoot
{
    public DoacaoStatus Status { get; private set; } = DoacaoStatus.Pending;

    public void Concluir(string stripeChargeId)
    {
        Status = Status.TransitionTo(DoacaoStatus.Completed);
        StripeChargeId = stripeChargeId;
        AddDomainEvent(new DoacaoConcluídaEvent(Id, ValorCentavos));
    }

    public void Falhar(string motivo)
    {
        Status = Status.TransitionTo(DoacaoStatus.Failed);
        MotivoFalha = motivo;
    }
}
```

```sql
CREATE OR REPLACE FUNCTION transicionar_doacao(
    p_id UUID, p_novo_status TEXT, p_motivo TEXT DEFAULT NULL
) RETURNS VOID AS $$
DECLARE v_status_atual TEXT; BEGIN
    SELECT status INTO v_status_atual FROM doacoes WHERE id = p_id FOR UPDATE;

    IF NOT (
        (v_status_atual = 'pending'    AND p_novo_status = 'processing') OR
        (v_status_atual = 'processing' AND p_novo_status IN ('completed', 'failed')) OR
        (v_status_atual = 'completed'  AND p_novo_status = 'refunded')
    ) THEN RAISE EXCEPTION '無効な遷移: % → %', v_status_atual, p_novo_status; END IF;

    UPDATE doacoes SET status = p_novo_status, atualizado_em = now() WHERE id = p_id;
    INSERT INTO doacao_status_history (doacao_id, status_anterior, status_novo, motivo, criado_em)
    VALUES (p_id, v_status_atual, p_novo_status, p_motivo, now());
END; $$ LANGUAGE plpgsql;
```

## 具体的な例

Stripeウェブフックが順不同で届く：3分前の`charge.failed`イベントが`charge.succeeded`の後に届く。ハンドラーがステータスが既に`completed`のときに`Doacao.Falhar()`を試みる。`DoacaoStatus.TransitionTo`がチェック：`completed → failed`は`_validTransitions["completed"] = ["refunded"]`にない → `InvalidDoacaoTransitionException`をスロー。ハンドラーが例外をキャッチし、`stripeEventId`でWarningをログに記録し、遅延イベントを無視。`completed`状態が保持され、寄付者には不正確な変更が表示されない。

## 成功基準

状態の回帰ゼロ--`completed`が`failed`になることはなく、`refunded`が他の状態になることもない。すべての遷移が`doacao_status_history`に記録される100%。順不同ウェブフックが検出されるたびに`InvalidDoacaoTransitionException`がWarningとしてログに記録。

## SOS Locationとの関係

アクティブな緊急時に貢献する寄付者は自分の寄付状態についての透明性を受ける権利がある。既に`completed`になった後に`failed`として表示される寄付は、人々が危機を助けようとしている最悪の瞬間にプラットフォームへの信頼を破壊する。
'''

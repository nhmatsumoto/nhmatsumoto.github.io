body = '''
Há uma confusão que persegue quem aprende `async/await`: a ideia de que esperar de forma assíncrona cria uma thread, ou que torna o código mais rápido. Nenhuma das duas é verdade. `async/await` resolve um problema específico: não desperdiçar uma thread parada enquanto o computador espera algo que está acontecendo **em outro lugar**, como uma resposta de rede, uma leitura de disco ou uma consulta ao banco. Entender isso muda como você escreve qualquer aplicação que conversa com o mundo externo.

## Síncrono: a thread fica parada

No modelo síncrono, quando você chama uma operação de I/O, a thread que executa seu código fica **bloqueada** esperando a resposta. Ela não faz nada útil, apenas ocupa memória e um slot do pool. Em um servidor web, cada requisição bloqueada é uma thread a menos para atender outras pessoas.

```mermaid
sequenceDiagram
    participant T as Thread
    participant DB as Banco de dados
    T->>DB: SELECT (consulta lenta)
    Note over T: bloqueada, sem fazer nada
    DB-->>T: resultado
    Note over T: volta a trabalhar
```

## Assíncrono: a thread é liberada

Com `await`, no momento em que a operação de I/O começa, a thread **não espera**: ela é devolvida ao pool para fazer outra coisa. Quando a resposta chega, a execução do método é retomada, possivelmente em outra thread. O tempo de espera não some, mas durante ele a thread está livre.

```mermaid
sequenceDiagram
    participant T as Thread (pool)
    participant DB as Banco de dados
    T->>DB: SELECT (inicia I/O)
    Note over T: liberada, atende outra requisicao
    DB-->>T: resultado pronto
    Note over T: continuacao retomada
```

A diferença é sutil mas decisiva. O trabalho não terminou mais cedo. O que mudou é que, enquanto o banco processava, a sua thread atendeu outros usuários. Em escala, isso é a diferença entre um servidor que aguenta centenas de conexões e um que trava em dezenas.

## Concorrência não é paralelismo

Esse é o ponto que organiza tudo. **Paralelismo** é fazer várias coisas ao mesmo tempo, de fato, em vários núcleos: é o domínio das threads e do trabalho limitado por CPU. **Concorrência** é lidar com várias coisas em andamento, intercalando-as numa quantidade pequena de threads: é o domínio do `async/await` e do trabalho limitado por I/O.

```mermaid
graph TD
    A["Qual é o gargalo?"] --> B["I/O: rede, disco, banco"]
    A --> C["CPU: cálculo pesado"]
    B --> D["async/await<br/>libera a thread na espera"]
    C --> E["paralelismo real<br/>Task.Run, Parallel, threads"]
```

Por isso envolver uma operação de I/O em `Task.Run` é um anti-padrão comum: você gasta uma thread do pool para "esperar" algo que já não precisava de thread nenhuma. E por isso `async` não acelera um cálculo pesado: não há espera para aproveitar, só CPU ocupada.

## A máquina de estados por trás

`async/await` não é mágica do runtime em tempo de execução: é açúcar sintático. O compilador reescreve o seu método em uma **máquina de estados**. Cada `await` vira um ponto onde o método pode pausar, guardar onde parou e registrar uma continuação a ser chamada quando a Task completar.

```csharp
public async Task<int> GetTotalAsync(int userId)
{
    // ponto 1: dispara o I/O e devolve a thread
    var pedidos = await _repo.GetPedidosAsync(userId);

    // ponto 2: so roda quando os pedidos chegaram
    var total = pedidos.Sum(p => p.Valor);
    return total;
}
```

O `await` da primeira linha marca a fronteira: tudo antes roda imediatamente, tudo depois vira uma continuação agendada para quando `GetPedidosAsync` terminar. Por isso o tipo de retorno é `Task<int>` e não `int`: o método devolve uma promessa de resultado, não o resultado pronto.

## Os três erros clássicos

**Bloquear o assíncrono.** Chamar `.Result` ou `.Wait()` em uma Task dentro de um contexto com `SynchronizationContext` (UI, ASP.NET clássico) trava: a thread fica esperando a Task, mas a continuação da Task precisa exatamente daquela thread para rodar. Deadlock. A cura é simples e radical: nunca misture, `await` até o topo.

```csharp
// PERIGO: pode causar deadlock
var dados = BuscarAsync().Result;

// CERTO: assincrono de ponta a ponta
var dados = await BuscarAsync();
```

**`async void`.** Um método `async void` não pode ser esperado e suas exceções não podem ser capturadas pelo chamador: elas sobem direto e derrubam o processo. Use `async Task` sempre, exceto em handlers de evento, o único caso onde `async void` é justificável.

**`async` que não vai até o topo.** Se um método espera I/O, todo o caminho de chamada deveria ser `async`. Cortar no meio com `.Result` reintroduz o bloqueio que o `async` existia para eliminar. A regra resume tudo: async é contagioso, e deve ser.

## Conclusão

`async/await` não é sobre velocidade nem sobre threads: é sobre não desperdiçar uma thread parada enquanto o computador espera o mundo externo responder. Quando o gargalo é I/O, soltar a thread durante a espera multiplica quantas operações em andamento o seu sistema sustenta com o mesmo hardware. Quando o gargalo é CPU, `async` não tem nada a oferecer e o caminho é paralelismo de verdade. Saber em qual dos dois mundos você está, e levar o `async` até o topo sem bloquear no meio, é o que separa código assíncrono que escala de código que trava silenciosamente.
'''
body_en_us = '''
A confusion haunts everyone learning `async/await`: the idea that awaiting asynchronously creates a thread, or that it makes code faster. Neither is true. `async/await` solves a specific problem: not wasting an idle thread while the computer waits for something happening **somewhere else**, such as a network reply, a disk read or a database query. Understanding this changes how you write any application that talks to the outside world.

## Synchronous: the thread sits idle

In the synchronous model, when you call an I/O operation, the thread running your code is **blocked** waiting for the reply. It does nothing useful, just holds memory and a pool slot. In a web server, every blocked request is one fewer thread to serve other people.

```mermaid
sequenceDiagram
    participant T as Thread
    participant DB as Database
    T->>DB: SELECT (slow query)
    Note over T: blocked, doing nothing
    DB-->>T: result
    Note over T: back to work
```

## Asynchronous: the thread is freed

With `await`, the moment the I/O operation starts, the thread **does not wait**: it returns to the pool to do something else. When the reply arrives, the method resumes, possibly on another thread. The waiting time does not vanish, but during it the thread is free.

```mermaid
sequenceDiagram
    participant T as Thread (pool)
    participant DB as Database
    T->>DB: SELECT (start I/O)
    Note over T: freed, serves another request
    DB-->>T: result ready
    Note over T: continuation resumed
```

The difference is subtle but decisive. The work did not finish sooner. What changed is that, while the database processed, your thread served other users. At scale, that is the difference between a server holding hundreds of connections and one that stalls in the dozens.

## Concurrency is not parallelism

This is the point that organizes everything. **Parallelism** is doing several things at the same time, literally, on several cores: it is the domain of threads and CPU-bound work. **Concurrency** is handling several things in progress, interleaving them on a small number of threads: it is the domain of `async/await` and I/O-bound work.

```mermaid
graph TD
    A["What is the bottleneck?"] --> B["I/O: network, disk, database"]
    A --> C["CPU: heavy computation"]
    B --> D["async/await<br/>frees the thread while waiting"]
    C --> E["real parallelism<br/>Task.Run, Parallel, threads"]
```

That is why wrapping an I/O operation in `Task.Run` is a common anti-pattern: you spend a pool thread to "wait" for something that needed no thread at all. And that is why `async` does not speed up heavy computation: there is no waiting to exploit, just a busy CPU.

## The state machine behind it

`async/await` is not runtime magic: it is syntactic sugar. The compiler rewrites your method into a **state machine**. Each `await` becomes a point where the method can pause, save where it stopped and register a continuation to be called when the Task completes.

```csharp
public async Task<int> GetTotalAsync(int userId)
{
    // point 1: kick off the I/O and return the thread
    var orders = await _repo.GetOrdersAsync(userId);

    // point 2: runs only once the orders arrived
    var total = orders.Sum(o => o.Amount);
    return total;
}
```

The `await` on the first line marks the boundary: everything before runs immediately, everything after becomes a continuation scheduled for when `GetOrdersAsync` finishes. That is why the return type is `Task<int>` and not `int`: the method returns a promise of a result, not the finished result.

## The three classic mistakes

**Blocking the asynchronous.** Calling `.Result` or `.Wait()` on a Task inside a context with a `SynchronizationContext` (UI, classic ASP.NET) freezes: the thread waits for the Task, but the Task's continuation needs exactly that thread to run. Deadlock. The cure is simple and radical: never mix, `await` all the way up.

```csharp
// DANGER: can deadlock
var data = FetchAsync().Result;

// RIGHT: asynchronous end to end
var data = await FetchAsync();
```

**`async void`.** An `async void` method cannot be awaited and its exceptions cannot be caught by the caller: they bubble straight up and crash the process. Use `async Task` always, except in event handlers, the one case where `async void` is justified.

**`async` that does not reach the top.** If a method awaits I/O, the whole call path should be `async`. Cutting it off in the middle with `.Result` reintroduces the blocking that `async` existed to remove. The rule sums it up: async is contagious, and it should be.

## Conclusion

`async/await` is not about speed or threads: it is about not wasting an idle thread while the computer waits for the outside world to answer. When the bottleneck is I/O, releasing the thread during the wait multiplies how many in-flight operations your system sustains on the same hardware. When the bottleneck is CPU, `async` has nothing to offer and the path is real parallelism. Knowing which of the two worlds you are in, and carrying `async` all the way up without blocking in the middle, is what separates asynchronous code that scales from code that silently locks up.
'''
body_ja_jp = '''
`async/await` を学ぶ誰もを悩ませる混乱がある。非同期に待つとスレッドが作られる、あるいはコードが速くなる、という思い込みだ。どちらも正しくない。`async/await` は特定の問題を解く。**別の場所で**起きていること、たとえばネットワークの応答、ディスクの読み出し、データベースへの問い合わせを待つ間、遊んでいるスレッドを無駄にしないことだ。これを理解すると、外の世界と対話するあらゆるアプリケーションの書き方が変わる。

## 同期：スレッドは遊んでいる

同期モデルでは、I/O 操作を呼ぶと、コードを実行しているスレッドは応答を待って **ブロック** される。有用なことは何もせず、メモリとプールのスロットを占有するだけだ。Web サーバーでは、ブロックされた各リクエストは、他の人を捌くスレッドが一つ減ることを意味する。

```mermaid
sequenceDiagram
    participant T as スレッド
    participant DB as データベース
    T->>DB: SELECT（遅いクエリ）
    Note over T: ブロック、何もしない
    DB-->>T: 結果
    Note over T: 作業に戻る
```

## 非同期：スレッドは解放される

`await` を使うと、I/O 操作が始まった瞬間、スレッドは **待たない**。プールに返され、別のことをする。応答が届くと、メソッドは再開される、おそらく別のスレッドで。待ち時間は消えないが、その間スレッドは自由だ。

```mermaid
sequenceDiagram
    participant T as スレッド（プール）
    participant DB as データベース
    T->>DB: SELECT（I/O 開始）
    Note over T: 解放、別のリクエストを捌く
    DB-->>T: 結果が用意できた
    Note over T: 継続が再開される
```

違いは微妙だが決定的だ。作業が早く終わったわけではない。変わったのは、データベースが処理する間、あなたのスレッドが他のユーザーを捌いたことだ。規模が大きくなると、これは数百の接続を支えるサーバーと、数十で止まるサーバーの違いになる。

## 並行性は並列性ではない

これがすべてを整理する点だ。**並列性** は、複数の物事を文字通り同時に、複数のコアで行うことだ。スレッドと CPU 律速の作業の領域である。**並行性** は、進行中の複数の物事を、少数のスレッドで交互に扱うことだ。`async/await` と I/O 律速の作業の領域である。

```mermaid
graph TD
    A["ボトルネックは何か？"] --> B["I/O：ネットワーク、ディスク、DB"]
    A --> C["CPU：重い計算"]
    B --> D["async/await<br/>待つ間スレッドを解放"]
    C --> E["真の並列性<br/>Task.Run, Parallel, スレッド"]
```

だから I/O 操作を `Task.Run` で包むのはよくあるアンチパターンだ。そもそもスレッドを必要としなかったものを「待つ」ために、プールのスレッドを費やしてしまう。そして `async` が重い計算を速くしないのもこのためだ。活用できる待ち時間がなく、ただ CPU が忙しいだけである。

## 背後にあるステートマシン

`async/await` はランタイムの魔法ではない。構文糖衣だ。コンパイラはメソッドを **ステートマシン** に書き換える。各 `await` は、メソッドが一時停止し、どこで止まったかを保存し、Task 完了時に呼ばれる継続を登録できる地点になる。

```csharp
public async Task<int> GetTotalAsync(int userId)
{
    // 地点 1: I/O を開始し、スレッドを返す
    var orders = await _repo.GetOrdersAsync(userId);

    // 地点 2: orders が届いてから実行される
    var total = orders.Sum(o => o.Amount);
    return total;
}
```

最初の行の `await` が境界を示す。前のすべては即座に走り、後のすべては `GetOrdersAsync` 完了時に予定された継続になる。だから戻り値の型は `int` ではなく `Task<int>` だ。メソッドは完成した結果ではなく、結果の約束を返す。

## 三つの典型的な誤り

**非同期をブロックする。** `SynchronizationContext` を持つ文脈（UI、従来の ASP.NET）で Task に `.Result` や `.Wait()` を呼ぶと固まる。スレッドが Task を待つが、Task の継続はまさにそのスレッドを必要とする。デッドロックだ。治療は単純で根本的、決して混ぜず、上まで `await` する。

```csharp
// 危険：デッドロックの可能性
var data = FetchAsync().Result;

// 正しい：端から端まで非同期
var data = await FetchAsync();
```

**`async void`。** `async void` メソッドは await できず、その例外は呼び出し元で捕捉できない。まっすぐ上がってプロセスを落とす。常に `async Task` を使い、`async void` が正当化される唯一の場面、イベントハンドラだけを例外とする。

**上まで届かない `async`。** メソッドが I/O を待つなら、呼び出し経路全体が `async` であるべきだ。途中で `.Result` で断ち切ると、`async` が取り除くために存在したブロックを再導入する。規則がすべてを要約する。async は伝染性であり、そうあるべきだ。

## 結論

`async/await` は速度やスレッドの話ではない。外の世界の応答を待つ間、遊んでいるスレッドを無駄にしないことだ。ボトルネックが I/O のとき、待つ間スレッドを解放することは、同じハードウェアでシステムが支える進行中の操作の数を倍増させる。ボトルネックが CPU のとき、`async` には何も提供できず、道は真の並列性だ。自分が二つの世界のどちらにいるかを知り、途中でブロックせず `async` を上まで運ぶこと、それがスケールする非同期コードと、黙って固まるコードを分ける。
'''

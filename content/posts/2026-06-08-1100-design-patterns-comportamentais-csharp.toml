body_en_us = '''
The GoF **behavioral patterns** are about **collaboration and responsibility**: how objects communicate and who decides what. It's the category most affected by C#'s evolution, because delegates, events, and `IEnumerable` absorbed several patterns as language features. Let's look at the most useful ones, always comparing the classic form with the idiomatic one.

## Strategy: interchangeable algorithms

The `Strategy` encapsulates a family of algorithms and makes them swappable at runtime. It's the most used behavioral pattern — and the one most "trimmed" by modern C#.

```csharp
// Classic form: one interface, several implementations
public interface IShippingStrategy { decimal Cost(Package p); }
public sealed class ExpressShipping : IShippingStrategy { /* ... */ }
public sealed class StandardShipping : IShippingStrategy { /* ... */ }
```

When the strategy is **a single stateless function**, creating an interface and N classes is too much ceremony. The idiomatic way is a **delegate** (`Func`/`Action`) and, if there's selection by key, a dictionary:

```csharp
// Idiomatic form: strategy = function
private static readonly Dictionary<ShipKind, Func<Package, decimal>> _rates = new()
{
    [ShipKind.Express]  = p => 20m + p.Weight * 2m,
    [ShipKind.Standard] = p => 10m + p.Weight,
};

public decimal Cost(ShipKind kind, Package p) => _rates[kind](p);
```

Use the interface when the strategy has **state or several operations**; use the delegate when it's **a pure function**. In .NET 8+, keyed services also handle strategy selection via DI.

## Observer: notify without coupling

The `Observer` defines a one-to-many dependency: when one object changes, all dependents are notified. C# **built this into the language** with `event` and `delegate` from the start.

```csharp
public sealed class Stock
{
    public event Action<Price>? PriceChanged;        // the "subject"
    public void Update(Price p) => PriceChanged?.Invoke(p);  // notifies all
}

stock.PriceChanged += p => Console.WriteLine($"New price: {p}");
```

For asynchronous streams of multiple values, the modern way is `IObservable<T>` (Reactive Extensions) or `IAsyncEnumerable<T>`. The design question is the same: the emitter must not know its listeners.

## Mediator: centralizing communication

The `Mediator` makes objects communicate **through an intermediary** instead of holding direct references to each other. In .NET this became almost synonymous with **MediatR** and the CQRS style: controllers dispatch commands/queries without knowing the handlers.

```csharp
// Command + handler — the controller doesn't know the handler
public sealed record CreateOrder(int CustomerId, Cart Cart) : IRequest<OrderId>;

public sealed class CreateOrderHandler(IOrderRepository repo)
    : IRequestHandler<CreateOrder, OrderId>
{
    public async Task<OrderId> Handle(CreateOrder cmd, CancellationToken ct)
    {
        var order = Order.Create(cmd.CustomerId, cmd.Cart);
        await repo.AddAsync(order, ct);
        return order.Id;
    }
}

// At the endpoint:
app.MapPost("/orders", (CreateOrder cmd, ISender m) => m.Send(cmd));
```

The big win is the **pipeline behavior**: validation, logging, transaction, and cache come in as pipeline decorators, without polluting the handlers. The cost is traceability: "go to definition" in the IDE no longer takes you to the handler — the coupling vanished, and navigability with it.

## State: replacing the status switch

The `State` lets an object change its behavior when its internal state changes, **as if it changed class**. It's the antidote to the giant `switch(status)` that shows up in every entity with a lifecycle (order, subscription, ticket).

```csharp
public interface IOrderState
{
    IOrderState Pay();
    IOrderState Ship();
}

public sealed class PendingState : OrderContext, IOrderState
{
    public IOrderState Pay()  => new PaidState();           // valid transition
    public IOrderState Ship() => throw new InvalidOperationException("Pay first");
}
```

Each state knows only its legal transitions — the invariants are distributed and explicit, instead of drowned in an `if`. The cost is one class per state; it pays off when transitions are complex enough that the switch becomes a recurring bug.

## Chain of Responsibility: pass along until someone handles it

The `Chain of Responsibility` passes a request through a chain of handlers until one of them handles it. It's exactly the model of ASP.NET Core's **middleware pipeline** and `HttpClient`'s `DelegatingHandler`s.

```csharp
public abstract class Approver(Approver? next)
{
    public Task Handle(Expense e) =>
        CanApprove(e) ? Approve(e) : (next?.Handle(e) ?? Reject(e));
    protected abstract bool CanApprove(Expense e);
}
// Manager -> Director -> CFO: each handles what it can, or passes it on
```

## Comparison

| Pattern | Intent | Idiomatic .NET form | When to use |
| :--- | :--- | :--- | :--- |
| **Strategy** | Swappable algorithms | `Func`/dictionary, keyed services | Variation of calculation/policy |
| **Observer** | Notify dependents | `event`, `IObservable`, `IAsyncEnumerable` | React to changes without coupling |
| **Mediator** | Communication via intermediary | MediatR (CQRS), `ISender` | Decouple emitter from handler |
| **State** | Behavior per state | One class per state | Lifecycle with complex transitions |
| **Chain of Resp.** | Pass until handled | Middleware, `DelegatingHandler` | Pipeline of optional steps |
| **Template Method** | Skeleton with variable steps | Abstract method / `Func` | Fixed algorithm, pluggable steps |

## Conclusion

Behavioral patterns exist to tame the growth of conditional logic: that `if`/`switch` that gains a new case every sprint. Strategy and State turn it into polymorphism; Observer and Mediator turn it into messages; Chain turns it into a pipeline. In modern .NET, before creating the classic interface, ask whether a `delegate`, an `event`, or MediatR already solve it — they often do. The goal is never "to use the pattern," but to **move the decision to where it can grow without rewriting whoever calls it**.
'''
body_ja_jp = '''
GoF の **振る舞いパターン** は **協調と責務** についてです。オブジェクトがどう通信し、誰が何を決めるか。C# の進化に最も影響されたカテゴリです。delegate・event・`IEnumerable` がいくつかのパターンを言語機能として吸収したからです。最も有用なものを、常に古典形とイディオム形を比べながら見ましょう。

## Strategy：交換可能なアルゴリズム

`Strategy` はアルゴリズムのファミリーをカプセル化し、実行時に差し替え可能にします。最も使われる振る舞いパターンであり、モダン C# に最も「削られた」ものでもあります。

```csharp
// 古典形：1 つのインターフェース、複数の実装
public interface IShippingStrategy { decimal Cost(Package p); }
public sealed class ExpressShipping : IShippingStrategy { /* ... */ }
public sealed class StandardShipping : IShippingStrategy { /* ... */ }
```

戦略が **状態を持たない単一の関数** のとき、インターフェースと N 個のクラスを作るのは儀式が過ぎます。イディオム的なのは **delegate**（`Func`/`Action`）で、キーによる選択があれば辞書を使います。

```csharp
// イディオム形：戦略 = 関数
private static readonly Dictionary<ShipKind, Func<Package, decimal>> _rates = new()
{
    [ShipKind.Express]  = p => 20m + p.Weight * 2m,
    [ShipKind.Standard] = p => 10m + p.Weight,
};

public decimal Cost(ShipKind kind, Package p) => _rates[kind](p);
```

戦略が **状態や複数の操作** を持つならインターフェースを、**純粋関数** なら delegate を使いましょう。.NET 8 以降では keyed services も DI 経由で戦略選択を扱います。

## Observer：結合せずに通知する

`Observer` は一対多の依存を定義します。あるオブジェクトが変わると、すべての依存者が通知されます。C# は当初から `event` と `delegate` でこれを **言語に組み込んで** います。

```csharp
public sealed class Stock
{
    public event Action<Price>? PriceChanged;        // 「subject」
    public void Update(Price p) => PriceChanged?.Invoke(p);  // 全員に通知
}

stock.PriceChanged += p => Console.WriteLine($"新しい価格: {p}");
```

複数値の非同期ストリームには、モダンには `IObservable<T>`（Reactive Extensions）か `IAsyncEnumerable<T>`。設計上の問いは同じ。発信者はリスナーを知るべきでない。

## Mediator：通信を中央集約する

`Mediator` は、オブジェクト同士が直接参照を持つ代わりに **仲介者を通じて** 通信させます。.NET ではこれが **MediatR** と CQRS スタイルのほぼ同義になりました。コントローラはハンドラを知らずにコマンド/クエリをディスパッチします。

```csharp
// コマンド + ハンドラ ── コントローラはハンドラを知らない
public sealed record CreateOrder(int CustomerId, Cart Cart) : IRequest<OrderId>;

public sealed class CreateOrderHandler(IOrderRepository repo)
    : IRequestHandler<CreateOrder, OrderId>
{
    public async Task<OrderId> Handle(CreateOrder cmd, CancellationToken ct)
    {
        var order = Order.Create(cmd.CustomerId, cmd.Cart);
        await repo.AddAsync(order, ct);
        return order.Id;
    }
}

// エンドポイントで:
app.MapPost("/orders", (CreateOrder cmd, ISender m) => m.Send(cmd));
```

大きな利点は **パイプライン behavior** です。検証・ロギング・トランザクション・キャッシュが、ハンドラを汚さずにパイプラインの decorator として入ります。コストはトレーサビリティ。IDE の「定義へ移動」がもうハンドラへ導かない ── 結合が消え、たどりやすさも一緒に消えます。

## State：ステータスの switch を置き換える

`State` は、内部状態が変わったとき、**クラスが変わったかのように** オブジェクトの振る舞いを変えさせます。ライフサイクルを持つすべてのエンティティ（注文、サブスクリプション、チケット）に現れる巨大な `switch(status)` の解毒剤です。

```csharp
public interface IOrderState
{
    IOrderState Pay();
    IOrderState Ship();
}

public sealed class PendingState : OrderContext, IOrderState
{
    public IOrderState Pay()  => new PaidState();           // 有効な遷移
    public IOrderState Ship() => throw new InvalidOperationException("先に支払いを");
}
```

各状態は自分の合法な遷移だけを知ります ── 不変条件は `if` に溺れず、分散して明示的になります。コストは状態ごとに 1 クラス。遷移が、switch が再発バグになるほど複雑なときに見合います。

## Chain of Responsibility：誰かが処理するまで渡す

`Chain of Responsibility` は、ハンドラの連鎖にリクエストを通し、どれかが処理するまで渡します。まさに ASP.NET Core の **ミドルウェアパイプライン** や `HttpClient` の `DelegatingHandler` のモデルです。

```csharp
public abstract class Approver(Approver? next)
{
    public Task Handle(Expense e) =>
        CanApprove(e) ? Approve(e) : (next?.Handle(e) ?? Reject(e));
    protected abstract bool CanApprove(Expense e);
}
// 課長 -> 部長 -> CFO：各自が処理できるものを処理し、できなければ次へ渡す
```

## 比較

| パターン | 意図 | .NET のイディオム形 | 使うとき |
| :--- | :--- | :--- | :--- |
| **Strategy** | 交換可能なアルゴリズム | `Func`/辞書、keyed services | 計算/方針のバリエーション |
| **Observer** | 依存者へ通知 | `event`、`IObservable`、`IAsyncEnumerable` | 結合せず変化に反応 |
| **Mediator** | 仲介者経由の通信 | MediatR（CQRS）、`ISender` | 発信者とハンドラを分離 |
| **State** | 状態ごとの振る舞い | 状態ごとに 1 クラス | 複雑な遷移を持つライフサイクル |
| **Chain of Resp.** | 処理されるまで渡す | ミドルウェア、`DelegatingHandler` | 任意ステップのパイプライン |
| **Template Method** | 可変ステップを持つ骨格 | 抽象メソッド / `Func` | 固定アルゴリズム、差し込み可能なステップ |

## 結論

振る舞いパターンは、条件ロジックの増殖 ── スプリントごとに新しいケースを得るあの `if`/`switch` ── を飼いならすために存在します。Strategy と State はそれを多態性に、Observer と Mediator はメッセージに、Chain はパイプラインに変えます。モダンな .NET では、古典的なインターフェースを作る前に、`delegate`・`event`・MediatR がすでに解決しないかを問いましょう ── たいてい解決します。目的は決して「パターンを使うこと」ではなく、**呼び出す側を書き換えずに成長できる場所へ判断を移すこと** です。
'''

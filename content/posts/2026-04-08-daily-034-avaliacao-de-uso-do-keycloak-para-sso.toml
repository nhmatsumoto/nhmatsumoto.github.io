## 実際のコンテキスト

SOS Locationは複数のプロファイルの認証が必要だ：市町村コーディネーター（市町村へのアクセス）、都道府県コーディネーター（州内すべての市町村へのアクセス）、管理者（クロステナントアクセス）、そして将来的には市区町村向けの統合API。KeycloakはSSO集中型ソリューションとして評価された。決定は：Keycloakを今実装するか、独自JWTで後で移行するか？

## 具体的な問題

Keycloakは SOS Location v1がまだ持っていない問題を解決する：アイデンティティフェデレーション（市区町村LDAP）、複数IdP、SAMLフロー。v1でのKeycloakのコストは現実的だ：(1) 追加インフラ——2つのKeycloakインスタンス + 別のPostgreSQLデータベース + HA設定、EC2で月~R$800；(2) 運用上の複雑さ——2人チームがレルム設定・クライアントスコープ・マッパーを理解する必要がある；(3) 認証レイテンシ：Keycloakはデフォルト設定でトークン検証ごとに40〜80msを追加する（トークンイントロスペクションエンドポイント）。

## 技術的決定

v1では実装を分離する`ITokenService`インターフェースを持つ独自JWT。移行基準を定義：(a) テナント数 ≥ 50 **または** (b) 市区町村がLDAP/Active Directory統合を要求 **または** (c) 2+の異なるIdPの必要性がある時。`ITokenService`インターフェースは`KeycloakTokenService`への切り替えをローカル——インフラレイヤーのみ——に保証する。

## 実装

```csharp
public interface ITokenService
{
    string GenerateAccessToken(ApplicationUser user);
    string GenerateRefreshToken();
    ClaimsPrincipal? ValidateToken(string token);
}

// 現在の実装
public sealed class JwtTokenService : ITokenService { ... }

// 将来の実装（スタブ）
// public sealed class KeycloakTokenService : ITokenService
// {
//     // Keycloak Admin API経由でトークンをイントロスペクト
//     // KeycloakロールをSosLocation.Roleエナムにマッピング
// }
```

```yaml
# ADR-004-autenticacao.md
decision_criteria:
  migrate_to_keycloak_when:
    - tenant_count: ">= 50"
    - ldap_integration_required: true
    - multiple_idp_required: true
  current_state:
    tenant_count: 12
    decision_date: "2026-04-08"
    review_date: "2026-10-08"
```

## 具体的な例

SOS Location v1（12テナント、1 IdP、LDAPなし）の数値評価：独自JWT = R$0追加インフラ、トークンごとの追加レイテンシ0ms、2日間の実装。Keycloak = 月R$800、追加レイテンシ40ms、初期セットアップ5日 + 月1日のメンテナンス。損益分岐点：カスタム認証実装のコスト > Keycloakの運用コスト——推定：~80テナントまたはLDAP統合必須。

## 成功基準

`ITokenService`とその実装外の認証コードゼロ。6ヶ月ごとに見直す移行基準を持つ文書化されたADR。`JwtTokenService`から`KeycloakTokenService`への切り替えが1営業日以内で完了可能。

## SOS Locationとの関係

KeycloakはSOS Locationにとって今日では過剰設計だ。しかし問題を無視することは不十分設計だ——`ITokenService`インターフェースは妥協点：今はシンプルに、必要な時に移行可能、書き直しなし。

# Welcome to Technical Knowledge OS v2

This is the first post in the blog's new format. The runtime remains deliberately simple, but the site surface is now organized as a **technical notebook**: publications, projects, documents and architectural decisions (ADRs) living inside one integrated ecosystem.

## What changes in this version

- **Systems as Assets**: projects now have interactive architecture flows and dedicated section readers.
- **Optimized SSG**: conditional loading of heavy scripts (Canvas/D3) to keep performance at 100/100.
- **Modern Identity**: design system based on HSL tokens, premium typography and native internationalization support (PT-BR/EN-US).
- **Engineering Notebook**: content reflects the real development flow, not just isolated texts.

## Content roadmap

1. Deep notes on **software architecture** and domain modeling (DDD).
2. Publications about **intelligent agents**, the .NET ecosystem and geospatial systems (GIS).
3. Living and experimental documentation for systems in production.

This space was built to be my external technical memory: organized, versioned and always accessible.

body = '''
Há uma distinção que muda tudo e que quase ninguém faz: **monitoramento** mede coisas que você já sabia que poderiam dar errado (CPU, memória, taxa de erro). **Observabilidade** é a propriedade de um sistema que permite entender qualquer estado interno *a partir de seus outputs* — inclusive estados que você nunca imaginou que existiriam. Monitoramento responde perguntas conhecidas; observabilidade permite fazer perguntas novas, depois que o problema apareceu, sem precisar fazer deploy.

Em sistemas distribuídos, isso deixou de ser opcional. Quando uma requisição atravessa oito serviços, o stack trace que bastava no monólito não reconstrói mais a história. Você precisa dos três pilares — e da forma certa de usá-los.

## Pilar 1: Logs — o evento discreto

Logs são registros de eventos individuais. O erro mais comum é tratá-los como texto livre. A virada de chave é o **structured logging**: emitir JSON com campos consultáveis, não frases.

```csharp
// Ruim: impossível de filtrar/agregar
_logger.LogInformation($"Pedido {id} do cliente {cust} falhou");

// Bom: structured — viram colunas no backend de logs
_logger.LogInformation("Pedido falhou {OrderId} {CustomerId} {Reason}",
    id, cust, reason);
```

Logs respondem "**o que exatamente aconteceu neste evento?**". São caros em volume; é onde mais se gasta dinheiro à toa.

## Pilar 2: Métricas — o agregado barato

Métricas são números agregados no tempo (contadores, *gauges*, histogramas). São baratíssimas de armazenar porque já vêm somadas. Respondem "**qual a tendência?**": latência p99, requisições por segundo, taxa de erro.

A armadilha é a **alta cardinalidade**: nunca use `user_id` ou `order_id` como *label* de métrica — cada valor único cria uma nova série temporal e explode o custo. Identificadores de alta cardinalidade pertencem a logs e traces, não a métricas.

## Pilar 3: Traces — a jornada ponta a ponta

Um *trace* segue **uma única requisição** por todos os serviços, montando uma árvore de *spans* (cada span = uma operação, com duração). É o pilar que só faz sentido no mundo distribuído. Um *trace ID* propagado em todos os hops responde a pergunta que mais dói: "**onde, dos oito serviços, esses 2 segundos foram gastos?**".

## Como os três se combinam

| Pilar | Pergunta | Cardinalidade | Custo |
| :--- | :--- | :--- | :--- |
| **Métricas** | Há um problema? Qual a tendência? | Baixa | Muito baixo |
| **Traces** | Onde, no fluxo, está o problema? | Alta | Médio (amostrado) |
| **Logs** | O que exatamente aconteceu ali? | Alta | Alto |

O fluxo de investigação maduro vai do barato ao caro: um **alerta de métrica** dispara ("p99 subiu"); um **trace** localiza o span lento ("o serviço de cobrança"); os **logs** daquele span/trace explicam a causa raiz ("timeout no banco X"). Correlacionar os três por um `trace_id` comum é o que transforma três ferramentas soltas em observabilidade de verdade.

## OpenTelemetry: o padrão que unifica

Antes, cada pilar tinha seu agente e formato. O **OpenTelemetry (OTel)** — projeto da CNCF — padronizou a instrumentação: uma única API/SDK gera logs, métricas e traces, e você exporta para qualquer backend (Prometheus, Jaeger, Grafana, vendors). Instrumentar uma vez, trocar de ferramenta sem reescrever, é o ganho prático.

## Conclusão

Os três pilares não competem — colaboram, e cada um cobre o ponto cego do outro. Métrica sem trace te diz que dói, mas não onde; trace sem log te diz onde, mas não por quê; log sem métrica te afoga em ruído sem direção. Um sistema observável não é o que tem dashboards bonitos; é aquele em que, diante de uma falha inédita às 3 da manhã, você consegue fazer a pergunta certa — e os dados já estão lá para respondê-la.
'''
body_en_us = '''
There's a distinction that changes everything and that almost nobody draws: **monitoring** measures things you already knew could go wrong (CPU, memory, error rate). **Observability** is a property of a system that lets you understand any internal state *from its outputs* — including states you never imagined could exist. Monitoring answers known questions; observability lets you ask new ones, after the problem shows up, without shipping a deploy.

In distributed systems this stopped being optional. When a request crosses eight services, the stack trace that sufficed in the monolith no longer reconstructs the story. You need all three pillars — and the right way to use them.

## Pillar 1: Logs — the discrete event

Logs are records of individual events. The most common mistake is treating them as free text. The turning point is **structured logging**: emitting JSON with queryable fields, not sentences.

```csharp
// Bad: impossible to filter/aggregate
_logger.LogInformation($"Order {id} for customer {cust} failed");

// Good: structured — these become columns in the log backend
_logger.LogInformation("Order failed {OrderId} {CustomerId} {Reason}",
    id, cust, reason);
```

Logs answer "**what exactly happened in this event?**". They're expensive in volume; this is where most money is wasted.

## Pillar 2: Metrics — the cheap aggregate

Metrics are numbers aggregated over time (counters, gauges, histograms). They're extremely cheap to store because they arrive pre-summed. They answer "**what's the trend?**": p99 latency, requests per second, error rate.

The trap is **high cardinality**: never use `user_id` or `order_id` as a metric label — each unique value creates a new time series and explodes the cost. High-cardinality identifiers belong in logs and traces, not metrics.

## Pillar 3: Traces — the end-to-end journey

A trace follows **a single request** across all services, assembling a tree of spans (each span = one operation, with a duration). It's the pillar that only makes sense in the distributed world. A trace ID propagated across every hop answers the question that hurts most: "**of the eight services, where were those 2 seconds spent?**".

## How the three combine

| Pillar | Question | Cardinality | Cost |
| :--- | :--- | :--- | :--- |
| **Metrics** | Is there a problem? What's the trend? | Low | Very low |
| **Traces** | Where in the flow is the problem? | High | Medium (sampled) |
| **Logs** | What exactly happened there? | High | High |

The mature investigation flow goes from cheap to expensive: a **metric alert** fires ("p99 spiked"); a **trace** locates the slow span ("the billing service"); the **logs** for that span/trace explain the root cause ("timeout on database X"). Correlating all three through a common `trace_id` is what turns three loose tools into real observability.

## OpenTelemetry: the standard that unifies

Each pillar used to have its own agent and format. **OpenTelemetry (OTel)** — a CNCF project — standardized instrumentation: one API/SDK produces logs, metrics, and traces, and you export to any backend (Prometheus, Jaeger, Grafana, vendors). Instrument once, swap tools without rewriting — that's the practical win.

## Conclusion

The three pillars don't compete — they collaborate, each covering the other's blind spot. A metric without a trace tells you it hurts, but not where; a trace without logs tells you where, but not why; a log without metrics drowns you in noise with no direction. An observable system isn't the one with pretty dashboards; it's the one where, facing a never-seen failure at 3 a.m., you can ask the right question — and the data is already there to answer it.
'''
body_ja_jp = '''
すべてを変えるのに、ほとんど誰も引かない区別があります。**監視** は、すでに壊れうると分かっていたもの（CPU、メモリ、エラー率）を測ります。**可観測性** は、システムの任意の内部状態を *その出力から* 理解できるという性質です ── 存在するとは想像もしなかった状態についてさえ。監視は既知の問いに答え、可観測性は、問題が現れた後に、デプロイなしで新しい問いを立てさせます。

分散システムでは、これはもはや任意ではなくなりました。リクエストが 8 つのサービスを横断するとき、モノリスで十分だったスタックトレースはもう物語を再構成しません。3 本の柱すべて ── と、その正しい使い方 ── が必要です。

## 柱 1：ログ ── 離散的なイベント

ログは個々のイベントの記録です。最も一般的な誤りは、それを自由テキストとして扱うことです。転換点は **構造化ログ** です。文章ではなく、クエリ可能なフィールドを持つ JSON を出します。

```csharp
// 悪い：フィルタ/集計が不可能
_logger.LogInformation($"顧客 {cust} の注文 {id} が失敗");

// 良い：構造化 ── ログ基盤で列になる
_logger.LogInformation("注文失敗 {OrderId} {CustomerId} {Reason}",
    id, cust, reason);
```

ログは「**このイベントで正確に何が起きたか**」に答えます。量が多くコストがかかり、最も無駄に金を使う場所です。

## 柱 2：メトリクス ── 安価な集計値

メトリクスは時間方向に集計された数値（カウンタ、ゲージ、ヒストグラム）です。すでに合算済みで届くため、保存が極めて安価です。「**傾向はどうか**」に答えます。p99 レイテンシ、秒間リクエスト数、エラー率。

罠は **高カーディナリティ** です。`user_id` や `order_id` をメトリクスのラベルに使ってはいけません ── 一意の値ごとに新しい時系列が生まれ、コストが爆発します。高カーディナリティの識別子は、メトリクスではなくログとトレースに属します。

## 柱 3：トレース ── 端から端までの旅

トレースは **単一のリクエスト** をすべてのサービス越しに追い、スパンの木（各スパン = 持続時間を持つ 1 つの操作）を組み立てます。分散世界でのみ意味を持つ柱です。すべてのホップで伝播されるトレース ID は、最も痛い問いに答えます。「**8 つのサービスのうち、その 2 秒はどこで費やされたのか**」。

## 3 つの組み合わせ方

| 柱 | 問い | カーディナリティ | コスト |
| :--- | :--- | :--- | :--- |
| **メトリクス** | 問題はあるか？傾向は？ | 低 | 極小 |
| **トレース** | フローのどこに問題があるか？ | 高 | 中（サンプリング） |
| **ログ** | そこで正確に何が起きたか？ | 高 | 高 |

成熟した調査フローは安価から高価へ進みます。**メトリクスのアラート** が発火し（「p99 が跳ねた」）、**トレース** が遅いスパンを特定し（「課金サービス」）、そのスパン/トレースの **ログ** が根本原因を説明する（「データベース X でタイムアウト」）。3 つを共通の `trace_id` で相関させることが、バラバラな 3 つの道具を本物の可観測性へ変えます。

## OpenTelemetry：統一する標準

かつては各柱が独自のエージェントと形式を持っていました。CNCF プロジェクトの **OpenTelemetry（OTel）** が計装を標準化しました。単一の API/SDK がログ・メトリクス・トレースを生成し、任意のバックエンド（Prometheus、Jaeger、Grafana、各ベンダ）へエクスポートできます。一度計装すれば、書き直さずに道具を交換できる ── これが実践的な利点です。

## 結論

3 本の柱は競合せず、協調し、それぞれが他の死角を覆います。トレースなきメトリクスは痛みを告げるが、どこかは告げない。ログなきトレースはどこかを告げるが、なぜかは告げない。メトリクスなきログは、方向のない雑音に溺れさせる。可観測なシステムとは、美しいダッシュボードを持つものではなく、午前 3 時に未見の障害に直面したとき、正しい問いを立てられ ── そして答えるためのデータがすでにそこにある、そんなシステムです。
'''

## 結論

AI の歴史は、約束、失望、復活の循環です。名前は変わりますが、パターンは繰り返します。理論的なアイデアは、それを実用にする hardware よりずっと前に生まれ、不可能と切り捨てられ、データと計算が追いつく数十年後に再浮上します。パーセプトロンは 1969 年に葬られ、今日のネットワークの基礎です。現在の言語モデルの波を追う人への教訓は二つあります。誇大宣伝を疑え、しかしある道を不可能と宣言する者をもっと疑え。

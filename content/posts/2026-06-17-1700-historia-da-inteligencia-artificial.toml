body_en_us = '''
Artificial intelligence looks like a phenomenon of the last few years, but most of its core ideas are decades old. Understanding this history is not nostalgia: it explains why AI advances in waves, why certain promises keep repeating, and why what we now call a revolution is usually an old idea that finally found enough data and computing power.

## Before the name: the theoretical roots

Before the term existed, the question already did. In 1943, **Warren McCulloch** and **Walter Pitts** proposed a mathematical model of the neuron: a unit that sums inputs and fires if it crosses a threshold. It was the first formal bridge between biology and logic.

In 1950, **Alan Turing** published "Computing Machinery and Intelligence", where he swapped the impossible question "can machines think?" for an operational test, the imitation game, now known as the Turing test. Turing did not build an AI, but he defined the terms of the debate for half a century.

## Dartmouth, 1956: the discipline is named

The name was born at a summer workshop at Dartmouth College, organized by **John McCarthy**, **Marvin Minsky**, **Claude Shannon** and **Nathaniel Rochester**. The proposal used the term "artificial intelligence" for the first time. There, **Allen Newell** and **Herbert Simon** presented the Logic Theorist, a program able to prove theorems, considered the first real AI program.

The bet was bold and optimistic: people believed machines with human-level intelligence were a single generation away.

## The golden age and the first winter

In the 1950s and 1960s, **Frank Rosenblatt** created the perceptron, a network that could learn to classify patterns from examples. The press of the day already talked about machines that would walk and become conscious.

The brakes came in 1969, when **Minsky** and **Seymour Papert** published "Perceptrons", proving that a single-layer perceptron could not solve problems as simple as XOR. The book, technically correct, cooled enthusiasm and funding. Combined with the 1973 Lighthill report in the UK, it opened the first AI winter: years of cut budgets and skepticism.

## Expert systems and the second winter

The 1980s brought a commercial revival with expert systems, programs that encoded expert knowledge into "if-then" rules. MYCIN, for medical diagnosis, was a landmark. Japan launched the ambitious Fifth Generation project to dominate the field.

But these systems were expensive to maintain, brittle outside their narrow domain, and unable to learn. When the promises went unmet, the second AI winter arrived in the late 1980s.

## The statistical revival and deep learning

The quiet turn began in 1986, when **David Rumelhart**, **Geoffrey Hinton** and **Ronald Williams** popularized backpropagation, the algorithm that makes it possible to train networks with multiple layers. **Yann LeCun** applied the idea to convolutional networks to read handwritten digits. **Yoshua Bengio** advanced the foundations of deep learning.

The theory had existed for decades, but data and compute were missing. Both arrived together around 2012, when AlexNet, trained on GPUs, won the ImageNet vision competition by a wide margin. It was the spark of modern deep learning. Back in 1997 Deep Blue had already beaten Kasparov at chess; in 2016 AlphaGo won at Go. In 2017, the paper "Attention Is All You Need" introduced the transformer architecture, which paved the way for the large language models of the following decade.


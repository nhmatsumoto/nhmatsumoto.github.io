    E --> F[First AI winter]
    F --> G[1986 - Backpropagation]
    G --> H[2012 - AlexNet and deep learning]
    H --> I[2017 - Transformer]
    I --> J[Large-scale language models]
    style F fill:#fdd,stroke:#333

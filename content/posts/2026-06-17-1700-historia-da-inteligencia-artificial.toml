## 名前の前：理論的な根

用語が存在する前から、問いはありました。1943 年、**ウォーレン・マカロック** と **ウォルター・ピッツ** はニューロンの数学モデルを提案しました。入力を合計し、しきい値を超えると発火する単位です。生物学と論理をつなぐ最初の形式的な橋でした。

1950 年、**アラン・チューリング** は「計算機械と知能」を発表し、「機械は考えられるか」という不可能な問いを、模倣ゲームという操作的なテスト、今日チューリングテストと呼ばれるものに置き換えました。チューリングは AI を作りませんでしたが、半世紀にわたる議論の土俵を定めました。

## ダートマス、1956 年：規律の命名

名前はダートマス大学の夏の会議で生まれました。**ジョン・マッカーシー**、**マーヴィン・ミンスキー**、**クロード・シャノン**、**ナサニエル・ロチェスター** が主催したものです。その提案は初めて「人工知能」という語を使いました。そこで **アレン・ニューウェル** と **ハーバート・サイモン** は、定理を証明できるプログラム、最初の本物の AI プログラムとされる Logic Theorist を発表しました。

賭けは大胆で楽観的でした。人間並みの知能を持つ機械は一世代先だと信じられていたのです。

## 黄金時代と最初の冬

1950 年代と 1960 年代、**フランク・ローゼンブラット** はパーセプトロンを作りました。例からパターンの分類を学習できるネットワークです。当時の報道はすでに、歩き意識を持つ機械を語っていました。

ブレーキは 1969 年、**ミンスキー** と **シーモア・パパート** が「パーセプトロン」を出版し、単層パーセプトロンが XOR ほど単純な問題すら解けないことを証明したときに来ました。技術的に正しいこの本は、熱意と資金を冷やしました。1973 年の英国ライトヒル報告と相まって、最初の AI の冬を開きました。予算削減と懐疑の年月です。

## エキスパートシステムと二度目の冬

1980 年代は、エキスパートシステムによる商業的な復活をもたらしました。専門家の知識を「もし～ならば」の規則に符号化したプログラムです。医療診断の MYCIN は画期的でした。日本は分野を支配するため野心的な第五世代プロジェクトを立ち上げました。

しかしこれらのシステムは保守が高価で、狭い領域の外では脆く、学習できませんでした。約束が果たされないと、1980 年代末に二度目の AI の冬が訪れました。

## 統計的復活と深層学習

静かな転換は 1986 年に始まりました。**デビッド・ラメルハート**、**ジェフリー・ヒントン**、**ロナルド・ウィリアムズ** がバックプロパゲーションを広めたのです。複数の層を持つネットワークを訓練可能にするアルゴリズムです。**ヤン・ルカン** はそのアイデアを畳み込みネットワークに応用し、手書き数字を読みました。**ヨシュア・ベンジオ** は深層学習の基礎を進めました。

理論は数十年前からありましたが、データと計算が欠けていました。両者は 2012 年ごろに同時に到来し、GPU で訓練された AlexNet が ImageNet 視覚コンペで大差で勝ちました。現代の深層学習の火種でした。1997 年にはすでに Deep Blue がチェスでカスパロフを破り、2016 年には AlphaGo が囲碁で勝ちました。2017 年、論文「Attention Is All You Need」がトランスフォーマー構造を導入し、次の十年の大規模言語モデルへの道を開きました。


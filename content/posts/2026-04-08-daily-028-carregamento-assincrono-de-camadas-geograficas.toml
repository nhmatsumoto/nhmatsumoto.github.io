body = '''
## Contexto real

O mapa do SOS Location carrega 4 camadas na abertura de sessão: `AreaDeRisco` (polígonos do município), `HotspotAtivo` (pontos de operação ativos), rotas de evacuação e precipitação atual. A camada crítica para a decisão imediata é `AreaDeRisco` - o coordenador precisa ver as zonas de risco antes de qualquer outra coisa. As outras camadas podem aparecer com 1–2 segundos de atraso sem impacto operacional.

## Problema específico

O carregamento sequencial original esperava que todas as 4 camadas terminassem antes de renderizar qualquer coisa: o tempo de abertura do mapa era determinado pela camada mais lenta. A camada de precipitação (Open-Meteo via backend, 800ms de latência média) bloqueava a exibição de `AreaDeRisco` (PostGIS, 120ms). Usuário via tela em branco por 920ms quando o problema deveria ser de 120ms. Pior: se a camada de precipitação falhasse, todas as outras também não carregavam.

## Decisão técnica

Carregamento paralelo com `Promise.allSettled` - falha em uma camada não bloqueia as demais. Prioridade explícita: `AreaDeRisco` inicia primeiro e renderiza assim que retorna. As outras 3 camadas iniciam simultaneamente. Estado de loading por camada no `layerStore` Zustand: `idle | loading | loaded | error`. Cada componente de camada exibe skeleton/spinner próprio baseado no seu estado - o mapa nunca fica completamente em branco.

## Implementação

```tsx
// src/hooks/useMapLayersLoader.ts
import { useEffect } from 'react';
import { useLayerStore } from '@/stores/layerStore';
import { fetchAreasDeRisco, fetchHotspots, fetchEvacuationRoutes, fetchPrecipitation } from '@/api';

export function useMapLayersLoader(municipioId: string) {
  const { setLayerData, setLayerStatus } = useLayerStore();

  useEffect(() => {
    // AreaDeRisco carrega primeiro (camada crítica)
    setLayerStatus('riskAreas', 'loading');
    fetchAreasDeRisco(municipioId).then((data) => {
      setLayerData('riskAreas', data);
      setLayerStatus('riskAreas', 'loaded');
    }).catch(() => setLayerStatus('riskAreas', 'error'));

    // Demais camadas em paralelo (falha independente)
    const secondaryLoads = [
      { id: 'hotspots' as const,          fetch: () => fetchHotspots(municipioId) },
      { id: 'evacuationRoutes' as const,  fetch: () => fetchEvacuationRoutes(municipioId) },
      { id: 'precipitation' as const,     fetch: () => fetchPrecipitation(municipioId) },
    ];

    secondaryLoads.forEach(({ id, fetch: fn }) => {
      setLayerStatus(id, 'loading');
      fn()
        .then((data) => { setLayerData(id, data); setLayerStatus(id, 'loaded'); })
        .catch(() => setLayerStatus(id, 'error'));
    });
  }, [municipioId]);
}
```

```tsx
// src/layers/HotspotLayer.tsx - exemplo de loading state por camada
import { useLayerStore } from '@/stores/layerStore';

export function HotspotLayer() {
  const status   = useLayerStore((s) => s.status.hotspots);
  const hotspots = useLayerStore((s) => s.data.hotspots);
  const mapInstance = useMapStore((s) => s.mapInstance);

  // Spinner flutuante enquanto carrega
  if (status === 'loading') return <LayerLoadingIndicator label="Hotspots" />;
  if (status === 'error')   return <LayerErrorBadge label="Hotspots" />;
  if (!hotspots)            return null;

  // Renderização normal após dados disponíveis
  return <HotspotMarkers hotspots={hotspots} map={mapInstance} />;
}
```

```tsx
// src/components/LayerLoadingIndicator.tsx
export function LayerLoadingIndicator({ label }: { label: string }) {
  return (
    <div style={{
      position:  'fixed',
      bottom:    '16px',
      left:      '16px',
      zIndex:    Z_INDEX.floatingPanels,
      background: 'rgba(0,0,0,0.7)',
      color:     '#fff',
      padding:   '6px 12px',
      borderRadius: '4px',
      fontSize:  '12px',
    }}>
      ⟳ Carregando {label}…
    </div>
  );
}
```

## Exemplo concreto

Abertura de sessão em Blumenau - `AreaDeRisco`: 340ms → mapa visível com zonas de risco. Enquanto `AreaDeRisco` ainda carregava: `HotspotAtivo` retornou em 180ms (já visível antes de `AreaDeRisco`). `EvacuationRoutes`: 520ms. `Precipitation`: falhou com timeout de 2s → badge de erro "Precipitação" exibido no canto inferior, outras camadas intactas. Tempo percebido de mapa útil (AreaDeRisco visível): 340ms vs 920ms anterior.

## Critério de sucesso

`AreaDeRisco` visível no mapa em < 500ms após abertura de sessão. Falha em qualquer camada secundária não bloqueia exibição das demais. Estado de loading/error de cada camada visível ao usuário de forma não intrusiva (badge, não modal).

## Relação com SOS Location

Carregamento assíncrono com prioridade explícita é a implementação técnica da hierarquia operacional: "AreaDeRisco primeiro" é uma decisão de produto, não de performance. A arquitetura reflete essa decisão - camada crítica não espera por camadas opcionais.
'''
body_en_us = '''
## Real context

SOS Location's map loads 4 layers on session open: `AreaDeRisco` (municipality polygons), `HotspotAtivo` (active operation points), evacuation routes and current precipitation. The critical layer for immediate decisions is `AreaDeRisco` - the coordinator needs to see risk zones before anything else. The other layers can appear 1–2 seconds later with no operational impact.

## Specific problem

The original sequential loading waited for all 4 layers to finish before rendering anything: map opening time was determined by the slowest layer. The precipitation layer (Open-Meteo via backend, 800ms average latency) blocked the display of `AreaDeRisco` (PostGIS, 120ms). The user saw a blank screen for 920ms when the problem was actually 120ms. Worse: if the precipitation layer failed, all others also failed to load.

## Technical decision

Parallel loading with `Promise.allSettled` - failure in one layer does not block the others. Explicit priority: `AreaDeRisco` starts first and renders as soon as it returns. The other 3 layers start simultaneously. Per-layer loading state in the Zustand `layerStore`: `idle | loading | loaded | error`. Each layer component displays its own skeleton/spinner based on its state - the map is never completely blank.

## Implementation

```tsx
export function useMapLayersLoader(municipioId: string) {
  const { setLayerData, setLayerStatus } = useLayerStore();

  useEffect(() => {
    // AreaDeRisco loads first (critical layer)
    setLayerStatus('riskAreas', 'loading');
    fetchAreasDeRisco(municipioId)
      .then((data) => { setLayerData('riskAreas', data); setLayerStatus('riskAreas', 'loaded'); })
      .catch(() => setLayerStatus('riskAreas', 'error'));

    // Secondary layers in parallel (independent failure)
    [
      { id: 'hotspots' as const,         fetch: () => fetchHotspots(municipioId) },
      { id: 'evacuationRoutes' as const, fetch: () => fetchEvacuationRoutes(municipioId) },
      { id: 'precipitation' as const,    fetch: () => fetchPrecipitation(municipioId) },
    ].forEach(({ id, fetch: fn }) => {
      setLayerStatus(id, 'loading');
      fn()
        .then((data) => { setLayerData(id, data); setLayerStatus(id, 'loaded'); })
        .catch(() => setLayerStatus(id, 'error'));
    });
  }, [municipioId]);
}
```

```tsx
export function HotspotLayer() {
  const status   = useLayerStore((s) => s.status.hotspots);
  const hotspots = useLayerStore((s) => s.data.hotspots);

  if (status === 'loading') return <LayerLoadingIndicator label="Hotspots" />;
  if (status === 'error')   return <LayerErrorBadge label="Hotspots" />;
  if (!hotspots)            return null;

  return <HotspotMarkers hotspots={hotspots} />;
}
```

## Concrete example

Session opening in Blumenau - `AreaDeRisco`: 340ms → map visible with risk zones. While `AreaDeRisco` was still loading: `HotspotAtivo` returned in 180ms (already visible before `AreaDeRisco`). `EvacuationRoutes`: 520ms. `Precipitation`: failed with 2s timeout → "Precipitation" error badge shown in the corner, other layers intact. Perceived useful map time (AreaDeRisco visible): 340ms vs previous 920ms.

## Success criteria

`AreaDeRisco` visible on the map in < 500ms after session opening. Failure in any secondary layer does not block display of the others. Per-layer loading/error state visible to the user in a non-intrusive way (badge, not modal).

## Relation to SOS Location

Asynchronous loading with explicit priority is the technical implementation of the operational hierarchy: "AreaDeRisco first" is a product decision, not a performance one. The architecture reflects that decision - the critical layer does not wait for optional layers.
'''
body_ja_jp = '''
## 実際のコンテキスト

SOS Locationのマップはセッション開始時に4つのレイヤーをロードする：`AreaDeRisco`（市町村ポリゴン）、`HotspotAtivo`（アクティブな作戦ポイント）、避難経路、現在の降水量。即座の意思決定の重要なレイヤーは`AreaDeRisco`--コーディネーターは他の何よりも先にリスクゾーンを見る必要がある。他のレイヤーは運用上の影響なく1〜2秒後に表示できる。

## 具体的な問題

元のシーケンシャルロードは4つのレイヤーがすべて完了するまで何もレンダリングしなかった：マップ開始時間は最も遅いレイヤーで決まった。降水量レイヤー（バックエンド経由のOpen-Meteo、平均レイテンシ800ms）が`AreaDeRisco`（PostGIS、120ms）の表示をブロックした。ユーザーは問題が120msなのに920msの間白い画面を見た。さらに悪いことに：降水量レイヤーが失敗すると、他のすべてもロードできなかった。

## 技術的決定

`Promise.allSettled`による並列ロード--1つのレイヤーの失敗が他をブロックしない。明示的な優先順位：`AreaDeRisco`が最初に開始し、返ってきたらすぐにレンダリング。他の3つのレイヤーは同時に開始。Zustand `layerStore`のレイヤーごとのロード状態：`idle | loading | loaded | error`。各レイヤーコンポーネントは自分の状態に基づいて独自のスケルトン/スピナーを表示--マップが完全に白くなることはない。

## 実装

```tsx
export function useMapLayersLoader(municipioId: string) {
  const { setLayerData, setLayerStatus } = useLayerStore();

  useEffect(() => {
    // AreaDeRiscoが最初にロード（重要なレイヤー）
    setLayerStatus('riskAreas', 'loading');
    fetchAreasDeRisco(municipioId)
      .then((data) => { setLayerData('riskAreas', data); setLayerStatus('riskAreas', 'loaded'); })
      .catch(() => setLayerStatus('riskAreas', 'error'));

    // セカンダリレイヤーを並列で（独立した失敗）
    [
      { id: 'hotspots' as const,         fetch: () => fetchHotspots(municipioId) },
      { id: 'evacuationRoutes' as const, fetch: () => fetchEvacuationRoutes(municipioId) },
      { id: 'precipitation' as const,    fetch: () => fetchPrecipitation(municipioId) },
    ].forEach(({ id, fetch: fn }) => {
      setLayerStatus(id, 'loading');
      fn()
        .then((data) => { setLayerData(id, data); setLayerStatus(id, 'loaded'); })
        .catch(() => setLayerStatus(id, 'error'));
    });
  }, [municipioId]);
}
```

```tsx
export function HotspotLayer() {
  const status   = useLayerStore((s) => s.status.hotspots);
  const hotspots = useLayerStore((s) => s.data.hotspots);

  if (status === 'loading') return <LayerLoadingIndicator label="Hotspots" />;
  if (status === 'error')   return <LayerErrorBadge label="Hotspots" />;
  if (!hotspots)            return null;

  return <HotspotMarkers hotspots={hotspots} />;
}
```

## 具体的な例

ブルメナウでのセッション開始--`AreaDeRisco`：340ms → リスクゾーンでマップが表示。`AreaDeRisco`がまだロード中に：`HotspotAtivo`が180msで返ってきた（`AreaDeRisco`より前にすでに表示）。`EvacuationRoutes`：520ms。`Precipitation`：2秒タイムアウトで失敗 → コーナーに「降水量」エラーバッジが表示、他のレイヤーは無傷。知覚された有用なマップ時間（AreaDeRisco表示）：340ms vs 以前の920ms。

## 成功基準

セッション開始後500ms未満で`AreaDeRisco`がマップに表示。任意のセカンダリレイヤーの失敗が他の表示をブロックしない。各レイヤーのロード/エラー状態が非侵入的な方法でユーザーに表示（バッジ、モーダルではない）。

## SOS Locationとの関係

明示的な優先順位付きの非同期ロードは、運用上の階層の技術的実装だ：「AreaDeRisco優先」はパフォーマンスではなくプロダクトの決定だ。アーキテクチャはその決定を反映している--重要なレイヤーはオプションのレイヤーを待たない。
'''

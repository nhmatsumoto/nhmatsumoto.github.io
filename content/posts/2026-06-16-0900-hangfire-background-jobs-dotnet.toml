body_en_us = '''
Almost every web application reaches the same point: an operation that **does not need to finish inside the request**. Sending a confirmation e-mail, generating a PDF, calling a webhook, recomputing an aggregate. Doing this on the HTTP path keeps the user waiting for something they do not even need to see. The naive answer - `Task.Run(...)` and move on - looks like a fix, but it loses the work on the first restart and has no retry, visibility or persistence.

**Hangfire** fills exactly that gap in .NET: it turns "run this later" into a method call, persisting the job in durable storage and handling retry, scheduling and monitoring.

## The mental model: enqueue, storage, server

Hangfire has three pieces. The **client** enqueues the job (serializes the method call and writes it to storage). The **storage** (SQL Server, PostgreSQL, Redis) keeps the state durably. The **server** is a pool of workers, running in your process or separately, that pulls jobs from storage and executes them. The key consequence: because the job lives in the database, **a process restart does not lose work** - the server reprocesses whatever stayed pending.

```csharp
// Program.cs (.NET 8)
builder.Services.AddHangfire(cfg => cfg
    .SetDataCompatibilityLevel(CompatibilityLevel.Version_180)
    .UseSimpleAssemblyNameTypeSerializer()
    .UseRecommendedSerializerSettings()
    .UsePostgreSqlStorage(o => o.UseNpgsqlConnection(connectionString)));

builder.Services.AddHangfireServer();

var app = build();
app.UseHangfireDashboard("/jobs"); // protect it in production
```

## Fire-and-forget: the most common case

The job runs once, as soon as possible. Note that you pass a **call expression**, not a delegate - Hangfire serializes it.

```csharp
public sealed class CheckoutController(IBackgroundJobClient jobs) : ControllerBase
{
    [HttpPost]
    public IActionResult Confirm(Guid orderId)
    {
        // do not pass the whole Order; pass the id and reload in the job
        jobs.Enqueue<IEmailSender>(s => s.SendConfirmationAsync(orderId));
        return Accepted(); // respond now, e-mail goes out in background
    }
}
```

The golden rule shows up right here: **enqueue the identifier, not the object**. The argument becomes JSON in storage; serializing a large entity bloats the database and freezes a state that may be stale by the time the job runs.

## Delayed and recurring: time as a parameter

To defer, swap `Enqueue` for `Schedule`. For periodic tasks there is `RecurringJob` with a cron expression - it is the natural replacement for a `BackgroundService` with a `Timer`, but with persistence and a dashboard.

```csharp
// runs in 24h
jobs.Schedule<IReminderService>(s => s.SendAsync(userId), TimeSpan.FromHours(24));

// runs every day at 03:00 (explicit zone avoids a UTC surprise)
RecurringJob.AddOrUpdate<IReportJob>(
    "daily-report",
    j => j.GenerateAsync(),
    "0 3 * * *",
    new RecurringJobOptions { TimeZone = TimeZoneInfo.Local });
```

## Continuations: chaining without coupling

When a job should only run **after** another finished successfully, use a continuation instead of calling one job from inside the other.

```csharp
var encodeId = jobs.Enqueue<IVideoEncoder>(e => e.EncodeAsync(videoId));
jobs.ContinueJobWith<INotifier>(encodeId, n => n.NotifyReadyAsync(videoId));
```

## Retry and idempotency: the part that breaks in production

By default Hangfire re-runs a job that threw an exception (with backoff). That is great for transient failures - and dangerous for side effects. The guarantee is **at-least-once**, never exactly-once: the same job can run twice (visibility timeout, restart mid-execution). So **every job must be idempotent**.

```csharp
public async Task SendConfirmationAsync(Guid orderId)
{
    // idempotency guard: already sent? do not send again
    if (await _outbox.AlreadySentAsync(orderId, "confirmation")) return;

    var order = await _orders.GetAsync(orderId); // reload fresh state
    await _email.SendAsync(order.CustomerEmail, Templates.Confirmation(order));
    await _outbox.MarkSentAsync(orderId, "confirmation");
}

// fine-grained retry per job
[AutomaticRetry(Attempts = 5, DelaysInSeconds = new[] { 30, 60, 300, 900, 3600 })]
public Task GenerateAsync() { /* ... */ }
```

Without that guard, the retry that should heal a transient failure starts to **duplicate e-mails, charges or webhooks**. Idempotency is not a job detail: it is the precondition for being allowed to have automatic retry.

## Where Hangfire stops being the right answer

Hangfire is excellent up to a scale. Because the storage is usually relational, every enqueue and every state transition is a database write; under **high throughput** (tens of thousands of jobs per second) the storage becomes the bottleneck. At that point the path is a **dedicated message queue** (RabbitMQ, SQS, Kafka) with its own consumers, not Hangfire. It also does not replace orchestration of long, stateful workflows - for that there are tools like Temporal or MassTransit Saga.

## Conclusion

Hangfire solves a tedious, recurring problem with very little ceremony: take work off the request path and run it in a **durable, observable, retry-aware** way. The real value is not the pretty `Enqueue` API, but the storage that lets a job survive a restart and the dashboard that shows what failed. The price for that is a single, non-negotiable discipline: **write idempotent jobs**, because the machine will, sooner or later, run your code twice.

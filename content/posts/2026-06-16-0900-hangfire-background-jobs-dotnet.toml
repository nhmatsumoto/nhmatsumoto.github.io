body_ja_jp = '''
ほぼすべての Web アプリケーションは同じ地点に到達します。**リクエスト内で終える必要のない** 処理です。確認メールの送信、PDF の生成、Webhook の呼び出し、集計の再計算。これを HTTP の経路上で行うと、ユーザーは見る必要すらないものを待たされます。素朴な答え ── `Task.Run(...)` して先に進む ── は解決策に見えますが、最初の再起動で仕事を失い、リトライも可視性も永続化もありません。

**Hangfire** は .NET でまさにその隙間を埋めます。「これを後で実行する」をメソッド呼び出しに変え、ジョブを耐久ストレージに永続化し、リトライ・スケジューリング・監視を引き受けます。

## メンタルモデル：enqueue、storage、server

Hangfire は 3 つの部品からなります。**client** がジョブをエンキューし（メソッド呼び出しをシリアライズしてストレージへ書き込む）、**storage**（SQL Server、PostgreSQL、Redis）が状態を耐久的に保持し、**server**（プロセス内または別プロセスのワーカープール）がストレージからジョブを取り出して実行します。最も重要な帰結。ジョブが DB にあるため、**プロセスの再起動で仕事を失わない** ── server が保留中のものを再処理します。

```csharp
// Program.cs (.NET 8)
builder.Services.AddHangfire(cfg => cfg
    .SetDataCompatibilityLevel(CompatibilityLevel.Version_180)
    .UseSimpleAssemblyNameTypeSerializer()
    .UseRecommendedSerializerSettings()
    .UsePostgreSqlStorage(o => o.UseNpgsqlConnection(connectionString)));

builder.Services.AddHangfireServer();

var app = build();
app.UseHangfireDashboard("/jobs"); // 本番では保護する
```

## Fire-and-forget：最も多いケース

ジョブは可能になり次第、一度だけ実行されます。渡すのは **呼び出し式** であってデリゲートではない点に注意 ── Hangfire がそれをシリアライズします。

```csharp
public sealed class CheckoutController(IBackgroundJobClient jobs) : ControllerBase
{
    [HttpPost]
    public IActionResult Confirm(Guid orderId)
    {
        // Order 全体を渡さない。id を渡し、ジョブ内で再読込する
        jobs.Enqueue<IEmailSender>(s => s.SendConfirmationAsync(orderId));
        return Accepted(); // すぐ応答し、メールはバックグラウンドで送る
    }
}
```

黄金律がここで早くも現れます。**オブジェクトではなく識別子をエンキューする**。引数はストレージ上で JSON になります。大きなエンティティをシリアライズすると DB が肥大化し、ジョブ実行時には古くなっているかもしれない状態を固定してしまいます。

## Delayed と recurring：時間をパラメータに

遅延させるなら `Enqueue` を `Schedule` に替えます。周期タスクには cron 式付きの `RecurringJob` があり ── `Timer` 付き `BackgroundService` の自然な置き換えですが、永続化とダッシュボードが付きます。

```csharp
// 24 時間後に実行
jobs.Schedule<IReminderService>(s => s.SendAsync(userId), TimeSpan.FromHours(24));

// 毎日 03:00 に実行（明示的なタイムゾーンで UTC の不意打ちを避ける）
RecurringJob.AddOrUpdate<IReportJob>(
    "daily-report",
    j => j.GenerateAsync(),
    "0 3 * * *",
    new RecurringJobOptions { TimeZone = TimeZoneInfo.Local });
```

## Continuation：結合せずに連鎖する

あるジョブが別のジョブの **成功後にのみ** 実行されるべきなら、ジョブの中から別のジョブを呼ぶのではなく continuation を使います。

```csharp
var encodeId = jobs.Enqueue<IVideoEncoder>(e => e.EncodeAsync(videoId));
jobs.ContinueJobWith<INotifier>(encodeId, n => n.NotifyReadyAsync(videoId));
```

## リトライと冪等性：本番で壊れる急所

既定では Hangfire は例外を投げたジョブを（バックオフ付きで）再実行します。これは一時的な失敗には素晴らしく ── 副作用には危険です。保証は **at-least-once** であって exactly-once ではありません。同じジョブが二度走ることがあります（可視性タイムアウト、実行中の再起動）。したがって **すべてのジョブは冪等でなければなりません**。

```csharp
public async Task SendConfirmationAsync(Guid orderId)
{
    // 冪等性ガード：すでに送った？ なら送らない
    if (await _outbox.AlreadySentAsync(orderId, "confirmation")) return;

    var order = await _orders.GetAsync(orderId); // 新鮮な状態を再読込
    await _email.SendAsync(order.CustomerEmail, Templates.Confirmation(order));
    await _outbox.MarkSentAsync(orderId, "confirmation");
}

// ジョブごとの細かいリトライ制御
[AutomaticRetry(Attempts = 5, DelaysInSeconds = new[] { 30, 60, 300, 900, 3600 })]
public Task GenerateAsync() { /* ... */ }
```

このガードがないと、一時的な失敗を癒すはずのリトライが **メール・課金・Webhook の重複** を起こし始めます。冪等性はジョブの細部ではなく、自動リトライを持てるための前提条件です。

## Hangfire が正解でなくなる場所

Hangfire はある規模までは優秀です。ストレージは通常リレーショナルなので、各 enqueue と各状態遷移は DB への書き込みです。**高スループット**（毎秒数万ジョブ）ではストレージがボトルネックになります。その地点では、Hangfire ではなく専用コンシューマを持つ **専用メッセージキュー**（RabbitMQ、SQS、Kafka）が道です。また、長時間・複雑な状態を持つワークフローのオーケストレーションの代替にもなりません ── それには Temporal や MassTransit Saga のようなツールがあります。

## 結論

Hangfire は退屈で繰り返し現れる問題を、ごくわずかな儀式で解決します。リクエストの経路から仕事を外し、**耐久的・可観測・リトライ対応** な形で実行することです。真の価値は美しい `Enqueue` API ではなく、ジョブを再起動から生き残らせるストレージと、何が失敗したかを示すダッシュボードにあります。その対価はただ一つ、譲れない規律です。**冪等なジョブを書く** ── マシンは遅かれ早かれ、あなたのコードを二度実行するからです。

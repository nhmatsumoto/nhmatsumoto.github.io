## 具体的な例

雨のイベント中のブルメナウ：市町村のOpen-Meteoグリッド16ポイント（4×4）。ブラウザで8msで生成された256×256 px補間キャンバス。オーバーレイは北部の軽い雨（2〜3 mm/30分、水色）から南部の激しい雨（22 mm/30分、河口付近の濃い青）へのなめらかなグラデーションを表示。コーディネーターは激しい雨が市内中心から~8 km北にあり、北に移動していることを視覚的に特定。

## 成功基準

最大100ポイントのグリッドに対して15ms未満の補間キャンバス生成。新しいOpen-Meteoデータ後のオーバーレイ更新 < 50ms（ページ更新なし）。ズーム12〜14でのオーバーレイに視覚的アーティファクト（バンディング、ブロック）なし。

## SOS Locationとの関係

降水オーバーレイは気象データを空間的意思決定に結びつけるレイヤーだ。数字として「65mm/6時間」を見るコーディネーターは、マップ上でその雨がどこに集中しているか、どこに移動しているかを視覚的に見るコーディネーターよりも素早い意思決定が難しい。補間キャンバスは疎なポイントデータを読み取れる連続した空間情報に変換する。

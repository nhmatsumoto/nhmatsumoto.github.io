## 実際のコンテキスト

SOS Locationのマップの降水オーバーレイは、各監視エリアで今および次の30分間どのくらい降っているかを示す。このレイヤーはOpen-Meteoの気象データ（#015）とコーディネーターの決定を結ぶ視覚的なリンクだ：「激しい雨がイタジャイ川上流に移動していて、リスクが増加しようとしている」。

## 具体的な問題

Open-Meteoは0.1°解像度（~11 km）で座標（lat/lon）ごとのポイントデータを返す。500 km²の市町村では、~4×4のデータポイントグリッドが生成される。これらのポイントを離散的な正方形としてレンダリングすると、11 km²の見えるブロックで「モザイク」ビジュアルが作られる——運用上の意思決定のためのマップオーバーレイとして完全に不適切だ。コーディネーターテスターは「役に立つには画素が粗すぎる」と表現した。

## 技術的決定

補間されたcanvasを持つ`L.ImageOverlay`：Open-Meteoポイントグリッドはcanvasでの双一次補間を使って高解像度のRGBA画像に補間され、その後マップのオーバーレイとして適用される。バックエンドが新しいOpen-Meteoサイクルを受信した時にSignalRで更新。レイヤーの透明度：基礎となるリスクポリゴンを隠さないよう`opacity: 0.6`。


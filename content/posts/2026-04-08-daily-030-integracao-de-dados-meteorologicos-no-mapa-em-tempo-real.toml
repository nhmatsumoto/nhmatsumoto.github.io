## Real context

The precipitation overlay on SOS Location's map shows how much it is raining now and in the next 30 minutes in each monitored area. This layer is the visual link between Open-Meteo weather data (#015) and the coordinator's decision: "heavy rain is moving up the Itajaí river, the risk is about to increase".

## Specific problem

Open-Meteo returns point data per coordinate (lat/lon) at 0.1° resolution (~11 km). For a 500 km² municipality, that generates a ~4×4 grid of data points. Rendering these points as discrete squares creates a "mosaic" visual with visible 11 km² blocks — completely inadequate as a map overlay for operational decisions. Coordinator testers described it as "too pixelated to be useful".

## Technical decision

`L.ImageOverlay` with an interpolated canvas: the Open-Meteo point grid is interpolated to a higher-resolution RGBA image using bilinear interpolation on canvas, then applied as an overlay on the map. Update via SignalR when the backend receives a new Open-Meteo cycle. Layer transparency: `opacity: 0.6` to avoid obscuring the underlying risk polygons.

## Implementation

```tsx
function mmToRgba(mm: number): [number, number, number, number] {
  if (mm <= 0)  return [0, 0, 0, 0];
  if (mm <= 2)  return [147, 210, 255, 80];
  if (mm <= 10) return [30, 144, 255, 140];
  if (mm <= 25) return [0, 50, 200, 180];
  return             [128, 0, 128, 210];
}

function renderPrecipitationCanvas(grid, bounds, width = 256, height = 256) {
  const canvas  = document.createElement('canvas');
  canvas.width  = width;
  canvas.height = height;
  const ctx     = canvas.getContext('2d')!;
  const imgData = ctx.createImageData(width, height);

  const latRange = bounds.getNorth() - bounds.getSouth();
  const lonRange = bounds.getEast()  - bounds.getWest();

  for (let py = 0; py < height; py++) {
    for (let px = 0; px < width; px++) {
      const lat = bounds.getNorth() - (py / height) * latRange;
      const lon = bounds.getWest()  + (px / width)  * lonRange;
      const mm  = bilinearInterpolate(grid, lat, lon);
      const [r, g, b, a] = mmToRgba(mm);
      const i = (py * width + px) * 4;
      imgData.data[i] = r; imgData.data[i+1] = g;
      imgData.data[i+2] = b; imgData.data[i+3] = a;
    }
  }

  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

export function PrecipitationLayer() {
  const mapInstance = useMapStore((s) => s.mapInstance);
  const precipData  = useLayerStore((s) => s.data.precipitation);
  const overlayRef  = useRef<L.ImageOverlay | null>(null);

  useEffect(() => {
    if (!mapInstance || !precipData?.grid?.length) return;

    const bounds  = mapInstance.getBounds().pad(0.1);
    const canvas  = renderPrecipitationCanvas(precipData.grid, bounds);
    const dataUrl = canvas.toDataURL('image/png');

    if (overlayRef.current) overlayRef.current.setUrl(dataUrl);
    else overlayRef.current = L.imageOverlay(dataUrl, bounds, { opacity: 0.6 }).addTo(mapInstance);

    return () => { overlayRef.current?.remove(); overlayRef.current = null; };
  }, [mapInstance, precipData]);

  return null;
}
```

## Concrete example

Blumenau during a rain event: Open-Meteo grid with 16 points (4×4) for the municipality. Interpolated 256×256 px canvas generated in 8ms in the browser. Overlay shows a smooth gradient from light rain in the north (2–3 mm/30min, light blue) to heavy rain in the south (22 mm/30min, dark blue near the river mouth). Coordinator visually identifies that heavy rain is ~8 km from the city centre and is moving north.

## Success criteria

Interpolated canvas generation < 15ms for a grid of up to 100 points. Overlay update after new Open-Meteo data < 50ms (no page refresh). No visible visual artefacts (banding, blocks) in the overlay at zoom 12–14.

## Relation to SOS Location

The precipitation overlay is the layer that connects meteorological data to spatial decision-making. A coordinator who sees "65mm in 6h" as a number is less able to make a quick decision than one who visually sees where that rain is concentrated on the map and where it is moving. The interpolated canvas converts sparse point data into readable continuous spatial information.

## Fundamentals
Emergency UX must be readable before it is beautiful. Visual hierarchy, contrast, feedback and responsiveness need to protect the user under stress, noise and time pressure.

The core idea is to make **Navbar refactor for a cleaner design** observable: there should be an artifact that another person can read, code can test or an operations team can validate. If the decision stays only in conversation, it does not scale and it does not create institutional learning.

## Decision model
The decision can be evaluated with a simple metric:

$$
UX_{cost} = T_{decision} + E_{error} + C_{cognitive}

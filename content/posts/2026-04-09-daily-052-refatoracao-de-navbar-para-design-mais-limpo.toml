body = '''
Este Daily aprofunda **Refatoração de navbar para design mais limpo** dentro da trilha **Frontend e UX** do SOS Location. A ideia é sair de uma nota curta e transformar o item em material de referência para produto, engenharia e operação.

## Descrição
Simplifica a navegação para reduzir ruído visual e deixar ações principais mais fáceis de encontrar.

## Fundamentos
UX de emergência deve ser legível antes de ser bonita. Hierarquia visual, contraste, feedback e responsividade precisam proteger o usuário quando há estresse, ruído e pouco tempo.

O ponto central é tornar **Refatoração de navbar para design mais limpo** observável: deve existir um artefato que possa ser lido por outra pessoa, testado por código ou validado por uma equipe operacional. Quando a decisão fica apenas na conversa, ela não escala e não cria aprendizado institucional.

## Modelo de decisão
A decisão pode ser avaliada com uma métrica simples:

$$
UX_{cost} = T_{decision} + E_{error} + C_{cognitive}
$$

O objetivo do design é reduzir tempo de decisão, erro operacional e carga cognitiva sem esconder informação crítica.

## Diagrama de fluxo

## 実装例
```tsx
type RiskBadgeProps = { level: 1 | 2 | 3 | 4 | 5; label: string };

export function RiskBadge({ level, label }: RiskBadgeProps) {
  return (
    <span className={`risk-badge risk-badge-${level}`} aria-label={`Risk level ${level}: ${label}`}>
      {label}
    </span>
  );
}
```

## SOS Locationでの適用方法
- 最小契約を定義します。入力、出力、判断の責任者、失敗時の期待動作を明確にします。
- 判断を、今後も保守されるコードまたはアーキテクチャ文書の近くに記録します。
- 実データでも振る舞いが保たれているかを示すテスト、クエリ、ダッシュボードを作ります。
- 応答時間、追跡可能性、認知負荷、解釈リスクという運用上の影響を見直します。

## よくある落とし穴
- 実際のユースケースを検証する前に、概念を過度に汎用化してしまうこと。
- ビジネスルール、外部連携、表示上の詳細を同じ場所に混ぜること。
- 技術的に動くことだけを測り、救助チーム、被災ユーザー、操作者への影響を忘れること。

## 成功基準
新しく参加した人が、判断の理由を理解し、最小例を実行し、図を読み、どの指標が回帰を示すかを説明できる状態なら、この項目は成熟しています。

body_ja_jp = '''
このDailyでは、SOS Locationの **フロントエンドとUX** トラックにおける **よりクリーンなデザインのためのナビバーリファクタ** を詳しく整理します。短いメモを、プロダクト、エンジニアリング、運用で再利用できる参照資料にすることが目的です。

## 説明
「よりクリーンなデザインのためのナビバーリファクタ」を、背景、運用基準、図、数式、実装例とともに整理します。

## 基礎
緊急時のUXは、美しさより先に読みやすさが必要です。視覚階層、コントラスト、フィードバック、レスポンシブ性は、ストレス、ノイズ、時間制限の中にいるユーザーを守るためにあります。

中心となる考え方は、**よりクリーンなデザインのためのナビバーリファクタ** を観測可能にすることです。別の人が読める成果物、コードでテストできる契約、運用チームが検証できる基準が必要です。判断が会話だけに残る場合、それはスケールせず、組織的な学習にもなりません。

## 判断モデル
この判断は、次のような単純な指標で評価できます。

$$
UX_{cost} = T_{decision} + E_{error} + C_{cognitive}
$$

設計の目的は、重要情報を隠さずに、判断時間、運用エラー、認知負荷を下げることです。


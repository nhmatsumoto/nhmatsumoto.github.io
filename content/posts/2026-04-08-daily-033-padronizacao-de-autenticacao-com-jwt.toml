## 実際のコンテキスト

SOS Locationはマルチテナント：フロリアノーポリス民間防衛とレシフェ民間防衛は完全に分離されたデータを持つ異なるテナントだ。JWTアクセスは、分離ミドルウェア（#004）がリクエストごとに追加のデータベースクエリなしに動作するよう、トークンに`tenantId`を持つ必要がある。

## 具体的な問題

最初のバージョンは`sub`（userId）と`role`のみでトークンを発行していた。ハンドラーが`tenantId`を必要とすると、データベースにクエリした：`SELECT tenant_id FROM users WHERE id = @userId`。イベント中の500の同時リクエストでは、リクエストごとに500の追加クエリ——リクエストごとに8〜12msの追加レイテンシ、月に4〜6 GBの不要なクエリ。さらに、標準化がなかった：一部のエンドポイントは`User.FindFirst("tenantId")`を読み、他は`User.FindFirst(ClaimTypes.System)`を読み、一方がクレーム名を変更するとサイレントエラーが発生した。

## 技術的決定

`SosClaims`定数で定義された標準化されたクレーム。トークンに含まれる：`sub`（userId）、`role`（CoordenaçãoMunicipal|CoordenaçãoEstadual|Admin）、`tenantId`、`municipioId`（市町村ロール用）。`JwtTokenValidator`での集中型トークン検証——REST APIとSignalR Hubで再利用。期限：アクセストークン15分、リフレッシュトークン7日。

## 実装

```csharp
public static class SosClaims
{
    public const string UserId      = "sub";
    public const string Role        = "role";
    public const string TenantId    = "tenant_id";
    public const string MunicipioId = "municipio_id";
}
```

```csharp
public sealed class JwtTokenService
{
    public string GenerateAccessToken(ApplicationUser user)
    {
        var claims = new[]
        {
            new Claim(SosClaims.UserId,       user.Id.ToString()),
            new Claim(SosClaims.Role,         user.Role.ToString()),
            new Claim(SosClaims.TenantId,     user.TenantId.ToString()),
            new Claim(SosClaims.MunicipioId,  user.MunicipioId?.ToString() ?? ""),
        };

        var key   = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(_settings.SecretKey));
        var token = new JwtSecurityToken(
            issuer:             _settings.Issuer,
            audience:           _settings.Audience,
            claims:             claims,
            expires:            DateTime.UtcNow.AddMinutes(15),
            signingCredentials: new SigningCredentials(key, SecurityAlgorithms.HmacSha256)
        );
        return new JwtSecurityTokenHandler().WriteToken(token);
    }
}
```

```csharp
public static Guid GetTenantId(this ClaimsPrincipal user) =>
    Guid.Parse(user.FindFirstValue(SosClaims.TenantId)
        ?? throw new UnauthorizedException("tenant_idクレームがない。"));
```

## 具体的な例

フロリアノーポリスコーディネーターのリクエスト：トークンに`tenant_id: "f1a2b3-..."`が含まれる。`TenantScopedDbContext`ミドルウェア（#004）がDBクエリなしでJWTから抽出した`HttpContext.User.GetTenantId()`を読む。グローバルフィルターがすべてのクエリに`WHERE tenant_id = 'f1a2b3-...'`を適用。リクエストごとの追加DBクエリなし。ベンチマーク：`ListarAreasDeRisco`ハンドラーが22ms（テナントクエリあり）から14ms（クレームからのテナント）に改善。

## 成功基準

認証済みリクエストで`tenantId`を取得するためのDBクエリゼロ。`tenantId`が必要なすべてのエンドポイントが`User.GetTenantId()`を使用——代替なし（`FindFirstValue`、`Claims.First`）。無効なトークン（署名が間違い、期限切れ）がハンドラーに到達する前に401を返す。

## SOS Locationとの関係

JWTの`tenantId`は、マルチテナントシステムがリクエストごとのDBコストなしに動作することを可能にするものだ。`SosClaims`の標準化は、クレーム名の変更がサイレントな本番バグではなくコンパイルエラーになることを保証する。
'''

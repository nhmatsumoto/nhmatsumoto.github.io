body_ja_jp = '''
## 実際のコンテキスト

SOS Locationのモバイルアプリは座標をJSON文字列として送信した：`"latitude": "-27.595"`。.NETバックエンドは`double`として問題なく受信した。しかしGPSバグを持つ古いAndroidデバイスが`"latitude": "-927.595"`を送信すると、値はデシリアライゼーションをエラーなしで通過し、ドメインに到達し、フロントエンドへの意味のあるメッセージなしにHTTP 500をもたらす内部`DomainException`で拒否された。モバイルアプリは「不明なエラー」を表示した。

## 具体的な問題

APIの境界でのコントラクト検証なしでは、不正な形式または範囲外のデータが拒否される前にドメインまたはデータベースまでの完全なフローをたどる。無効な入力データに対するHTTP 500はコントラクトエラーであり、サーバーエラーではない。フロントエンドは「サーバーがダウンしている」と「送信された緯度が間違っている」を区別できない。

## 技術的決定

ApplicationレイヤーのFluentValidation、ハンドラーの前にMediatRパイプラインビヘイビアとして実行される。バリデーションエラーはフィールド別エラーリスト・エラーコード・人間が読めるメッセージを持つ標準化されたフォーマットでHTTP 422を返す。ドメインは無効なリクエストを受け取らない。

## 実装

```csharp
// バリデーター
public sealed class RegistrarPessoaDesaparecidaValidator
    : AbstractValidator<RegistrarPessoaDesaparecidaCommand>
{
    public RegistrarPessoaDesaparecidaValidator()
    {
        RuleFor(x => x.Nome)
            .NotEmpty().WithMessage("Nome é obrigatório.")
            .MaximumLength(200).WithMessage("Nome não pode ter mais de 200 caracteres.");

        RuleFor(x => x.Latitude)
            .InclusiveBetween(-90, 90)
            .WithMessage("Latitude deve estar entre -90 e 90.");

        RuleFor(x => x.Longitude)
            .InclusiveBetween(-180, 180)
            .WithMessage("Longitude deve estar entre -180 e 180.");

        RuleFor(x => x.DataUltimoAvistamento)
            .LessThanOrEqualTo(_ => DateTimeOffset.UtcNow)
            .When(x => x.DataUltimoAvistamento.HasValue)
            .WithMessage("Data do último avistamento não pode ser no futuro.");
    }
}

// MediatRバリデーションパイプライン
public sealed class ValidationBehavior<TRequest, TResponse>
    : IPipelineBehavior<TRequest, TResponse>
{
    public async Task<TResponse> Handle(
        TRequest request, RequestHandlerDelegate<TResponse> next, CancellationToken ct)
    {
        var failures = _validators
            .SelectMany(v => v.Validate(request).Errors)
            .Where(f => f != null).ToList();

        if (failures.Count != 0) throw new ValidationException(failures);
        return await next();
    }
}
```

**422レスポンス例：**
```json
{
  "type": "https://sos-location.com.br/errors/validation",
  "title": "Dados de entrada inválidos",
  "status": 422,
  "errors": {
    "Latitude": [{ "errorCode": "InclusiveBetween", "errorMessage": "Latitude deve estar entre -90 e 90." }],
    "Nome":     [{ "errorCode": "NotEmpty",         "errorMessage": "Nome é obrigatório." }]
  }
}
```

## 具体的な例

緯度`-927.595`を持つAndroidデバイスのバグは、`"Latitude deve estar entre -90 e 90."`と共にHTTP 422を返すようになった。モバイルアプリはフィールド固有のメッセージをユーザーに表示するようになった。ドメインは無効な座標を受け取らなくなった。

## 成功基準

範囲外のデータを持つリクエストの100%がHTTP 500ではなくHTTP 422を返す。エラーフォーマットがすべてのエンドポイントで一貫している。フロントエンドがカスタムロジックなしで各エラーフィールドを対応するフォームフィールドにマッピングできる。

## SOS Locationとの関係

現場では、オペレーターは様々なデバイス--古い携帯電話・GPSが故障したタブレット--をストレス下で使用する。APIの境界でのコントラクト検証は、プレッシャー下で送信された低品質なデータが、緊急登録フローを中断する不透明なエラーではなく、オペレーターへの明確なフィードバックをもたらすことを保証する。

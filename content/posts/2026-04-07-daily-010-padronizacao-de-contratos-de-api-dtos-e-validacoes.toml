body = '''
## Contexto real

O aplicativo mobile do SOS Location enviava coordenadas como strings JSON: `"latitude": "-27.595"`. O backend .NET recebia como `double` sem problema. Mas quando um dispositivo Android antigo com bug de localização enviou `"latitude": "-927.595"`, o valor passou pela deserialização sem erro, chegou até o domínio e foi rejeitado com uma `DomainException` interna que resultou em HTTP 500 - sem mensagem significativa para o frontend. O app mobile exibia "Erro desconhecido".

## Problema específico

Sem validação de contrato na borda da API, qualquer dado malformado ou fora de range segue o fluxo completo até o domínio ou banco de dados antes de ser rejeitado. HTTP 500 para dados de entrada inválidos é um erro de contrato, não um erro de servidor. O frontend não consegue diferenciar "o servidor caiu" de "a latitude enviada está errada".

## Decisão técnica

FluentValidation na camada de Application, executado como MediatR pipeline behavior antes de qualquer handler. Erros de validação retornam HTTP 422 com formato padronizado: lista de erros por campo, código de erro, mensagem legível. Domínio não recebe requests inválidos.

## Implementação

```csharp
// Features/RegistrarPessoaDesaparecida/Validator.cs
public sealed class RegistrarPessoaDesaparecidaValidator
    : AbstractValidator<RegistrarPessoaDesaparecidaCommand>
{
    public RegistrarPessoaDesaparecidaValidator()
    {
        RuleFor(x => x.Nome)
            .NotEmpty().WithMessage("Nome é obrigatório.")
            .MaximumLength(200).WithMessage("Nome não pode ter mais de 200 caracteres.");

        RuleFor(x => x.Latitude)
            .InclusiveBetween(-90, 90)
            .WithMessage("Latitude deve estar entre -90 e 90.");

        RuleFor(x => x.Longitude)
            .InclusiveBetween(-180, 180)
            .WithMessage("Longitude deve estar entre -180 e 180.");

        RuleFor(x => x.DataUltimoAvistamento)
            .LessThanOrEqualTo(_ => DateTimeOffset.UtcNow)
            .When(x => x.DataUltimoAvistamento.HasValue)
            .WithMessage("Data do último avistamento não pode ser no futuro.");

        RuleFor(x => x.DescricaoFisica)
            .MaximumLength(1000)
            .WithMessage("Descrição física não pode ter mais de 1000 caracteres.");
    }
}

// Infrastructure/Behaviors/ValidationBehavior.cs
public sealed class ValidationBehavior<TRequest, TResponse>
    : IPipelineBehavior<TRequest, TResponse>
    where TRequest : IRequest<TResponse>
{
    private readonly IEnumerable<IValidator<TRequest>> _validators;

    public async Task<TResponse> Handle(
        TRequest request,
        RequestHandlerDelegate<TResponse> next,
        CancellationToken ct)
    {
        if (!_validators.Any()) return await next();

        var context = new ValidationContext<TRequest>(request);
        var failures = _validators
            .SelectMany(v => v.Validate(context).Errors)
            .Where(f => f != null)
            .ToList();

        if (failures.Count != 0)
            throw new ValidationException(failures);

        return await next();
    }
}

// Api/Middleware/ExceptionMiddleware.cs - formata 422 padronizado
private static IResult HandleValidationException(ValidationException ex)
{
    var errors = ex.Errors
        .GroupBy(e => e.PropertyName)
        .ToDictionary(
            g => g.Key,
            g => g.Select(e => new { e.ErrorCode, e.ErrorMessage }).ToArray());

    return Results.UnprocessableEntity(new
    {
        type    = "https://sos-location.com.br/errors/validation",
        title   = "Dados de entrada inválidos",
        status  = 422,
        errors
    });
}
```

**Exemplo de resposta 422:**
```json
{
  "type": "https://sos-location.com.br/errors/validation",
  "title": "Dados de entrada inválidos",
  "status": 422,
  "errors": {
    "Latitude": [{ "errorCode": "InclusiveBetween", "errorMessage": "Latitude deve estar entre -90 e 90." }],
    "Nome":     [{ "errorCode": "NotEmpty",         "errorMessage": "Nome é obrigatório." }]
  }
}
```

## Exemplo concreto

O bug do dispositivo Android com latitude `-927.595` passou a retornar HTTP 422 com `"Latitude deve estar entre -90 e 90."` O app mobile passou a exibir a mensagem específica do campo para o usuário. O domínio nunca mais recebeu coordenadas inválidas.

## Critério de sucesso

100% dos requests com dados fora de range retornam HTTP 422, não HTTP 500. O formato de erro é consistente em todos os endpoints. O frontend consegue mapear cada campo de erro para o campo de formulário correspondente sem lógica customizada.

## Relação com SOS Location

Em campo, operadores usam dispositivos variados - celulares antigos, tablets com GPS com defeito - em condições de estresse. A validação de contrato na borda da API é o que garante que dados de baixa qualidade enviados sob pressão resultam em feedback claro ao operador, não em erros opacos que interrompem o fluxo de registro de emergências.
'''
body_en_us = '''
## Real context

The SOS Location mobile app sent coordinates as JSON strings: `"latitude": "-27.595"`. The .NET backend received them as `double` without issue. But when an old Android device with a GPS bug sent `"latitude": "-927.595"`, the value passed deserialisation without error, reached the domain, and was rejected with an internal `DomainException` that resulted in HTTP 500 - with no meaningful message for the frontend. The mobile app displayed "Unknown error".

## Specific problem

Without contract validation at the API boundary, any malformed or out-of-range data follows the full flow to the domain or database before being rejected. HTTP 500 for invalid input data is a contract error, not a server error. The frontend cannot differentiate "the server is down" from "the submitted latitude is wrong".

## Technical decision

FluentValidation in the Application layer, executed as a MediatR pipeline behaviour before any handler. Validation errors return HTTP 422 with a standardised format: list of errors by field, error code, human-readable message. The domain never receives invalid requests.

## Implementation

```csharp
// Validator
public sealed class RegistrarPessoaDesaparecidaValidator
    : AbstractValidator<RegistrarPessoaDesaparecidaCommand>
{
    public RegistrarPessoaDesaparecidaValidator()
    {
        RuleFor(x => x.Nome)
            .NotEmpty().WithMessage("Nome é obrigatório.")
            .MaximumLength(200).WithMessage("Nome não pode ter mais de 200 caracteres.");

        RuleFor(x => x.Latitude)
            .InclusiveBetween(-90, 90)
            .WithMessage("Latitude deve estar entre -90 e 90.");

        RuleFor(x => x.Longitude)
            .InclusiveBetween(-180, 180)
            .WithMessage("Longitude deve estar entre -180 e 180.");

        RuleFor(x => x.DataUltimoAvistamento)
            .LessThanOrEqualTo(_ => DateTimeOffset.UtcNow)
            .When(x => x.DataUltimoAvistamento.HasValue)
            .WithMessage("Data do último avistamento não pode ser no futuro.");
    }
}

// MediatR validation pipeline
public sealed class ValidationBehavior<TRequest, TResponse>
    : IPipelineBehavior<TRequest, TResponse>
    where TRequest : IRequest<TResponse>
{
    public async Task<TResponse> Handle(
        TRequest request,
        RequestHandlerDelegate<TResponse> next,
        CancellationToken ct)
    {
        if (!_validators.Any()) return await next();

        var failures = _validators
            .SelectMany(v => v.Validate(request).Errors)
            .Where(f => f != null)
            .ToList();

        if (failures.Count != 0)
            throw new ValidationException(failures);

        return await next();
    }
}
```

**Example 422 response:**
```json
{
  "type": "https://sos-location.com.br/errors/validation",
  "title": "Dados de entrada inválidos",
  "status": 422,
  "errors": {
    "Latitude": [{ "errorCode": "InclusiveBetween", "errorMessage": "Latitude deve estar entre -90 e 90." }],
    "Nome":     [{ "errorCode": "NotEmpty",         "errorMessage": "Nome é obrigatório." }]
  }
}
```

## Concrete example

The Android device bug with latitude `-927.595` now returns HTTP 422 with `"Latitude deve estar entre -90 e 90."` The mobile app now displays the field-specific message to the user. The domain never receives invalid coordinates.

## Success criteria

100% of requests with out-of-range data return HTTP 422, not HTTP 500. The error format is consistent across all endpoints. The frontend can map each error field to its corresponding form field without custom logic.

## Relation to SOS Location

In the field, operators use varied devices - old phones, tablets with faulty GPS - under stress conditions. Contract validation at the API boundary ensures that low-quality data submitted under pressure results in clear feedback to the operator, not opaque errors that interrupt the emergency registration flow.

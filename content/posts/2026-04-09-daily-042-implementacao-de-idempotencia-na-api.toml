## 実際のコンテキスト

ボタン状態保護（#041）はWebフロントエンドには機能する。しかしSOS Locationは同じ寄付APIを市区町村統合、ネイティブモバイルアプリ、NGOの自動化スクリプトにも公開している。これらのクライアントはReactの`DoacaoButton`を持たない--直接HTTPコールを行う。サンパウロのNGO自動化スクリプトがネットワークタイムアウトにより寄付POSTを3回再送信し、時間的ウィンドウ冪等性（#041）がすべての試行をカバーする前にR$2,000の課金が3件発生した。

## 具体的な問題

ハンドラー内の5分間ウィンドウ冪等性キー（#041）はドメイン固有だ：人間のダブルクリックには機能するが、同じドナーが同分内に異なる値のリクエストを送る（例：別々の寄付）か、まったく同じペイロードを再送信するクライアントには失敗する。HTTP APIの正しいパターンはクライアントが送信する`Idempotency-Key`ヘッダーだ--ボディ内容に関係なく、そのリクエストを一意に識別するUUID。

## 技術的決定

決済エンドポイントのすべてのPOSTをインターセプトする`IdempotencyMiddleware`。`Idempotency-Key`ヘッダーが存在する場合：(1) Redisで`idempotency:{key}`を確認；(2) 見つかった場合、ハンドラーを実行せずに元のステータスで保存されたレスポンスを返す；(3) 見つからない場合、ハンドラーを実行し、24時間TTLで`{statusCode, body}`をRedisに保存。ヘッダーを送らないクライアントは通常通り実行（後方互換）。5xxエラーレスポンスは保存しない--2xxと4xxのみ。

## 実装

```csharp

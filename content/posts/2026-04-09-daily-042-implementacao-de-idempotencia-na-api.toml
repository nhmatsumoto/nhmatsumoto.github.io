        var cached   = await _cache.GetAsync<IdempotencyRecord>(cacheKey);

        if (cached is not null)
        {
            context.Response.StatusCode = cached.StatusCode;
            context.Response.Headers.Append("X-Idempotency-Replayed", "true");
            await context.Response.WriteAsync(cached.Body);
            return;
        }

        var originalBody = context.Response.Body;
        using var buffer = new MemoryStream();
        context.Response.Body = buffer;

        await _next(context);

        buffer.Seek(0, SeekOrigin.Begin);
        var responseBody = await new StreamReader(buffer).ReadToEndAsync();

        if (context.Response.StatusCode < 500)
            await _cache.SetAsync(cacheKey, new IdempotencyRecord(context.Response.StatusCode, responseBody), TimeSpan.FromHours(24));

        buffer.Seek(0, SeekOrigin.Begin);
        await buffer.CopyToAsync(originalBody);
        context.Response.Body = originalBody;
    }
}
```

## 具体的な例

NGOスクリプトが`Idempotency-Key: a3f2b1c4-9e87-4d56-b3a1-2c8f7e0d1a92`と`{"valor": 200000, "operacaoId": "op-2026-041"}`を含むボディで`POST /api/v2/doacoes`を送信。ネットワークタイムアウト：スクリプトが同じ`Idempotency-Key`で同じリクエストをさらに2回再送信。2回目と3回目：ミドルウェアがRedisで`idempotency:a3f2b1c4...`を見つけ、Stripeに触れずに`X-Idempotency-Replayed: true`で`{"id": "...", "status": "completed"}`を返す。1回の課金、3回のリクエスト。24時間TTL：その期間後、同じキーでの新しい寄付は通常通り処理される。

## 成功基準

HTTPクライアント再送信による重複課金ゼロ（任意の言語/プラットフォーム）。すべてのリプレイに`X-Idempotency-Replayed: true`ヘッダーが存在--ログで監査可能。5xxレスポンスは保存しない：ハンドラーがサーバーエラーで失敗した場合、同じキーでの次のリクエストは通常通り再試行。

## SOS Locationとの関係

緊急寄付はWebアプリ、モバイルアプリ、NGOスクリプト、市区町村統合など複数のソースから来る。APIレベルの冪等性は、プレゼンテーション層の実装方法に関係なく、あらゆるHTTPクライアントが安全に重複なしで再試行できることを保証する契約だ。

## Descrição
O objetivo é transformar **Otimização de queries com índices no SQL Server** em um artefato verificável no código, no contrato ou na operação.

## Fundamentos
Se o time não consegue responder quem decide, o que muda e como medir, **Otimização de queries com índices no SQL Server** ainda está abstrato. A regra prática é manter o artefato perto do fluxo que ele altera.

## Fórmula
Leitura objetiva da decisão:
Latência_total = cache_miss + query + rede

## Diagrama
```mermaid
flowchart LR
  A["Entrada"] --> B["Cache"]
  B --> C["Query ou preprocessamento"]
  C --> D["Payload menor"]
  D --> E["Resposta monitorada"]

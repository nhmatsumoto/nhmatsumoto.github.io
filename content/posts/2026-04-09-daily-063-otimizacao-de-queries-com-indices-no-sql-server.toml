## Como aplicar no SOS Location
- Defina o contrato mínimo para Otimização de queries com índices no SQL Server.
- Registre a decisão onde a equipe realmente a mantém ao longo do tempo.
- Valide com dado real, teste ou consulta verificável.

## Erros comuns
- Otimizar o lugar errado sem medir o gargalo real.
- Adicionar cache sem estratégia de invalidação.


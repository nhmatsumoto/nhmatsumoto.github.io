body_ja_jp = '''
## 実際のコンテキスト

SOS Locationで行方不明者が登録されると、3つのことが即座に起こらなければならない：(1) 近くの救助者への通知、(2) エリアホットスポットのリスクレベル再計算、(3) トレーサビリティのための監査ログへの記録。当初、これらはすべて`EmergencyService.RegisterMissingPersonAsync()`——`INotificationService`・`IHotspotService`・`IAuditService`を直接注入する80行——に集中していた。

## 具体的な問題

`RegisterMissingPersonAsync`メソッドが3つの異なる責務に直接結合していた。運用チームが「リアルタイムヒートマップの更新」を4番目の結果として追加するよう要求した際、メソッドは120行に成長した。4つの結果のいずれかへの変更が同じサービスファイルを開くことを必要とした。行方不明者登録のテストには3つ（後に4つ）すべてのサービスのモックが必要だった。

## 技術的決定

ドメインが登録完了時に`PessoaDesaparecidaReportadaEvent`を発生させる。3つの独立したハンドラーがイベントをサブスクライブし、それぞれが単一の責任を持つ。5番目の結果を追加するには、登録メソッドに触れる必要はなく、新しいハンドラーを作成するだけでよい。

## 実装

```csharp
// ドメインイベント
public sealed record PessoaDesaparecidaReportadaEvent(
    PessoaDesaparecidaId PessoaId,
    Coordenadas          Localizacao,
    DateTimeOffset       ReportadaEm
) : IDomainEvent;

// 集約ルートがイベントを発生させる
public static PessoaDesaparecida Reportar(string nome, Coordenadas loc)
{
    var pessoa = new PessoaDesaparecida { ... };
    pessoa.AddDomainEvent(
        new PessoaDesaparecidaReportadaEvent(pessoa.Id, loc, DateTimeOffset.UtcNow));
    return pessoa;
}

// ハンドラー1: 救助者への通知
public sealed class NotificarResgatadoresHandler
    : INotificationHandler<PessoaDesaparecidaReportadaEvent>
{
    public async Task Handle(
        PessoaDesaparecidaReportadaEvent evt, CancellationToken ct)
        => await _pushService.EnviarParaResgatadoresEmAsync(evt.Localizacao, raioKm: 2.0, ct);
}

// ハンドラー2: ホットスポットリスクレベル更新
public sealed class AtualizarHotspotHandler
    : INotificationHandler<PessoaDesaparecidaReportadaEvent>
{
    public async Task Handle(
        PessoaDesaparecidaReportadaEvent evt, CancellationToken ct)
    {
        var hotspot = await _hotspotRepo.GetByLocalizacaoAsync(evt.Localizacao, ct);
        hotspot?.RecalcularNivelDeRisco(novaOcorrencia: true);
        await _uow.CommitAsync(ct);
    }
}

// ハンドラー3: 監査ログ
public sealed class RegistrarAuditoriaHandler
    : INotificationHandler<PessoaDesaparecidaReportadaEvent>
{
    public async Task Handle(
        PessoaDesaparecidaReportadaEvent evt, CancellationToken ct)
        => await _auditLog.RegistrarAsync(
               $"PessoaDesaparecida {evt.PessoaId} reportada em {evt.ReportadaEm:O}", ct);
}
```

## 具体的な例

運用チームが「報告を行った家族にSMSを送信する」の追加を要求した。新しいハンドラーを15分で作成。既存のファイルは変更されなかった。ハンドラーはDIに登録され、独立したテストを通過した。

## 成功基準

行方不明者登録への新しい結果の追加が既存コードの変更を必要としない。各ハンドラーが1つのモック（自身のインフラサービス）のみでユニットテストを持つ。`RegistrarPessoaDesaparecida`コマンドが直接のインフラ依存をゼロ持つ。

## SOS Locationとの関係

緊急作戦において、重要なアクションの結果はシステムが現場で使われるにつれて段階的に発見される。ドメインイベントにより、SOS Locationはこれらの結果を、安定していてミッションクリティカルな登録フローのコアに再度触れることなく進化させることができる。

## 実際のコンテキスト

SOS LocationのJWTトークンは15分で期限切れになる（侵害ウィンドウを最小化するために短い）。コーディネーターは緊急作戦中に4〜8時間セッションを開いたままにすることがある。作戦の途中でトークンが期限切れになりシステムがログインにリダイレクトすると、コーディネーターはコンテキストを失い、未保存データを失う可能性がある——緊急時には許容できない。

## 具体的な問題

最初の実装はどんな401でも単純に`/login`にリダイレクトしていた。2つの問題：(1) 4レイヤーの並列ロード中（#028）、トークンが期限切れになると4つの同時リクエストが`/auth/refresh`エンドポイントへの4回の呼び出しを生成した——最初のリフレッシュが他の3つのリフレッシュトークンを無効化するレース条件；(2) 401を受け取ると元のリクエストが破棄され、ユーザーが手動でアクションを繰り返す必要があった。

## 技術的決定

ペンディングリクエストのキューを持つAxiosレスポンスインターセプター。最初の401が届くと、リフレッシュを開始して他のリクエストをキューに入れる。リフレッシュが完了する（成功または失敗）と、キューを排出する：成功したリクエストは新しいトークンで再送され、リフレッシュが失敗したリクエストは`/login`にリダイレクト。トークンは`httpOnly cookie`に格納——JavaScriptからアクセス不可、XSS保護。

## 実装

```ts
let isRefreshing    = false;
let refreshQueue: Array<(token: string) => void> = [];

api.interceptors.response.use(
  (response) => response,
  async (error) => {
    const originalRequest = error.config;

    if (error.response?.status !== 401 || originalRequest._retry) {
      return Promise.reject(error);
    }

    if (isRefreshing) {
      return new Promise((resolve) => {
        refreshQueue.push((newToken: string) => {
          originalRequest.headers['Authorization'] = `Bearer ${newToken}`;
          resolve(api(originalRequest));
        });
      });
    }

    originalRequest._retry = true;
    isRefreshing = true;

    try {
      const { data } = await axios.post('/auth/refresh', {}, { withCredentials: true });
      refreshQueue.forEach((cb) => cb(data.accessToken));
      refreshQueue = [];
      originalRequest.headers['Authorization'] = `Bearer ${data.accessToken}`;
      return api(originalRequest);
    } catch (refreshError) {
      refreshQueue = [];
      window.location.href = '/login?reason=session_expired';
      return Promise.reject(refreshError);
    } finally {
      isRefreshing = false;
    }
  }
);
```

## 具体的な例

16分間セッションを開いたコーディネーター（トークンは1分前に期限切れ）。新しいタブを開き、4つの同時リクエストが発火：`GET /api/areas-de-risco`、`GET /api/hotspots`、`GET /api/routes`、`GET /api/precipitation`。すべてが401を返す。最初のリクエストがリフレッシュを開始；他の3つがキューに入る。180msでリフレッシュ成功。4つの元のリクエストがすべて新しいトークンで順番に再送される。コーディネーターはリダイレクトも追加スピナーも見なかった——知覚できない180msの遅延だけ。

## 成功基準

通常のトークンリフレッシュ中（有効なクレデンシャル、リフレッシュトークンが利用可能）の`/login`へのリダイレクトゼロ。リフレッシュレース条件ゼロ：何個の同時リクエストが失敗したかに関わらず、期限切れサイクルごとに`/auth/refresh`への呼び出し1回のみ。同じサイクルで401で失敗したリクエストの100%の自動再送。

## SOS Locationとの関係

サイレントトークンリフレッシュは8時間の緊急セッションと15分のセッションの差だ。災害状況で一晩中作業するコーディネーターにとって、トークン期限切れによるインターフェース状態の損失は不便ではない——運用上のリスクだ。
'''

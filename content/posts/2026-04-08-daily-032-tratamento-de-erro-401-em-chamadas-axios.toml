body = '''
## Contexto real

Os tokens JWT do SOS Location expiram em 15 minutos (curto para minimizar janela de comprometimento). Coordenadores podem ter sessões abertas por 4–8 horas durante operações de emergência. Se o token expirar no meio de uma operação e o sistema redirecionar para login, o coordenador perde contexto e pode perder dados não salvos — inaceitável em situação de emergência.

## Problema específico

A primeira implementação apenas redirecionava para `/login` em qualquer 401. Dois problemas: (1) durante carregamento paralelo de 4 camadas (#028), se o token expirava, as 4 requisições simultâneas geravam 4 chamadas ao endpoint `/auth/refresh` — race condition onde o primeiro refresh invalidava o refresh token dos outros 3; (2) ao receber o 401, a requisição original era descartada, forçando o usuário a repetir a ação manualmente.

## Decisão técnica

Axios interceptor de response com fila de requisições pendentes. Quando o primeiro 401 chega, inicia o refresh e coloca as outras requisições em fila. Quando o refresh completa (sucesso ou falha), desfaz a fila: requisições bem-sucedidas são reenviadas com o novo token, requisições com refresh falhado redirecionam para `/login`. Token armazenado em `httpOnly cookie` — não acessível por JavaScript, proteção contra XSS.

## Implementação

```ts
// src/api/axiosInstance.ts
import axios from 'axios';

const api = axios.create({ baseURL: '/api', withCredentials: true });

let isRefreshing    = false;
let refreshQueue: Array<(token: string) => void> = [];

api.interceptors.response.use(
  (response) => response,
  async (error) => {
    const originalRequest = error.config;

    if (error.response?.status !== 401 || originalRequest._retry) {
      return Promise.reject(error);
    }

    if (isRefreshing) {
      // Enfileira a requisição — espera o refresh em andamento terminar
      return new Promise((resolve, reject) => {
        refreshQueue.push((newToken: string) => {
          originalRequest.headers['Authorization'] = `Bearer ${newToken}`;
          resolve(api(originalRequest));
        });
      });
    }

    originalRequest._retry = true;
    isRefreshing = true;

    try {
      const { data } = await axios.post('/auth/refresh', {}, { withCredentials: true });
      const newToken = data.accessToken;

      // Restitui todas as requisições enfileiradas com o novo token
      refreshQueue.forEach((resolve) => resolve(newToken));
      refreshQueue = [];

      originalRequest.headers['Authorization'] = `Bearer ${newToken}`;
      return api(originalRequest);
    } catch (refreshError) {
      refreshQueue = [];
      window.location.href = '/login?reason=session_expired';
      return Promise.reject(refreshError);
    } finally {
      isRefreshing = false;
    }
  }
);

export default api;
```

## Exemplo concreto

Coordenador com sessão aberta por 16 minutos (token expirou há 1 minuto). Abre nova aba, 4 requisições simultâneas disparam: `GET /api/areas-de-risco`, `GET /api/hotspots`, `GET /api/routes`, `GET /api/precipitation`. Todas retornam 401. A primeira requisição inicia o refresh; as outras 3 entram na fila. Refresh bem-sucedido em 180ms. As 4 requisições originais são reenviadas com o novo token em sequência. Coordenador não viu nenhum redirect, nenhum spinner adicional — apenas 180ms de atraso imperceptível.

## Critério de sucesso

Zero redirects para `/login` durante token refresh normal (token válido, refresh token disponível). Zero race conditions de refresh: apenas uma chamada a `/auth/refresh` por ciclo de expiração, independentemente de quantas requisições simultâneas falharam. Reenvio automático de 100% das requisições que falharam com 401 no mesmo ciclo.

## Relação com SOS Location

O token refresh silencioso é a diferença entre uma sessão de emergência de 8 horas e uma sessão de 15 minutos. Para coordenadores que trabalham durante toda a noite em situações de desastre, perder o estado da interface por expiração de token não é inconveniência — é risco operacional.
'''
body_en_us = '''
## Real context

SOS Location JWT tokens expire in 15 minutes (short to minimise the compromise window). Coordinators can have sessions open for 4–8 hours during emergency operations. If the token expires mid-operation and the system redirects to login, the coordinator loses context and may lose unsaved data — unacceptable in an emergency.

## Specific problem

The first implementation simply redirected to `/login` on any 401. Two problems: (1) during parallel loading of 4 layers (#028), if the token expired, the 4 simultaneous requests generated 4 calls to the `/auth/refresh` endpoint — a race condition where the first refresh invalidated the refresh token of the other 3; (2) when receiving the 401, the original request was discarded, forcing the user to repeat the action manually.

## Technical decision

Axios response interceptor with a queue of pending requests. When the first 401 arrives, it starts the refresh and queues the other requests. When the refresh completes (success or failure), it drains the queue: successful requests are resent with the new token, requests with a failed refresh redirect to `/login`. Token stored in `httpOnly cookie` — not accessible by JavaScript, XSS protection.

## Implementation

```ts
let isRefreshing    = false;
let refreshQueue: Array<(token: string) => void> = [];

api.interceptors.response.use(
  (response) => response,
  async (error) => {
    const originalRequest = error.config;

    if (error.response?.status !== 401 || originalRequest._retry) {
      return Promise.reject(error);
    }

    if (isRefreshing) {
      return new Promise((resolve) => {
        refreshQueue.push((newToken: string) => {
          originalRequest.headers['Authorization'] = `Bearer ${newToken}`;
          resolve(api(originalRequest));
        });
      });
    }

    originalRequest._retry = true;
    isRefreshing = true;

    try {
      const { data } = await axios.post('/auth/refresh', {}, { withCredentials: true });
      refreshQueue.forEach((cb) => cb(data.accessToken));
      refreshQueue = [];
      originalRequest.headers['Authorization'] = `Bearer ${data.accessToken}`;
      return api(originalRequest);
    } catch (refreshError) {
      refreshQueue = [];
      window.location.href = '/login?reason=session_expired';
      return Promise.reject(refreshError);
    } finally {
      isRefreshing = false;
    }
  }
);
```

## Concrete example

Coordinator with a session open for 16 minutes (token expired 1 minute ago). Opens a new tab, 4 simultaneous requests fire: `GET /api/areas-de-risco`, `GET /api/hotspots`, `GET /api/routes`, `GET /api/precipitation`. All return 401. The first request starts the refresh; the other 3 join the queue. Refresh succeeds in 180ms. All 4 original requests are resent with the new token in sequence. The coordinator saw no redirect, no extra spinner — just an imperceptible 180ms delay.

## Success criteria

Zero redirects to `/login` during normal token refresh (valid credentials, refresh token available). Zero refresh race conditions: only one call to `/auth/refresh` per expiry cycle, regardless of how many simultaneous requests failed. Automatic re-send of 100% of requests that failed with 401 in the same cycle.

## Relation to SOS Location

Silent token refresh is the difference between an 8-hour emergency session and a 15-minute one. For coordinators working through the night in disaster situations, losing interface state due to token expiry is not inconvenience — it is operational risk.

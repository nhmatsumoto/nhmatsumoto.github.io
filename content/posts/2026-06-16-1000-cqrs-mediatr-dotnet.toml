body_en_us = '''
CQRS (Command Query Responsibility Segregation) is, at its core, a single sentence: **separate the model that writes from the model that reads**. I covered the conceptual part elsewhere; here the focus is the **code**. How it becomes handlers, where MediatR fits, where validation and transactions plug in, and how not to fall into the trap of complicating a CRUD that asked for none of this.

## Why separate, in one line of code

The write model exists to **protect invariants**: it loads the aggregate, validates business rules, decides. The read model exists to **feed a screen**: it wants a flat DTO, often joining several aggregates, and has nothing to protect. Forcing both through the same `Repository<T>` and the same entity makes the write carry fields the screen never uses and the read go through validations it does not need. CQRS gives each side its own path.

## Command: the intent to change state

A `Command` is a request to change the system. It does not return screen data - at most an identifier or a success/error result. With MediatR, the command is a record and the handler is where the rule lives.

```csharp
// Command: intent, raw input data
public sealed record PlaceOrderCommand(Guid CustomerId, IReadOnlyList<OrderLine> Lines)
    : IRequest<Guid>;

// Handler: loads the aggregate, applies the rule, persists
public sealed class PlaceOrderHandler(IOrderRepository repo, IUnitOfWork uow)
    : IRequestHandler<PlaceOrderCommand, Guid>
{
    public async Task<Guid> Handle(PlaceOrderCommand cmd, CancellationToken ct)
    {
        var order = Order.Place(cmd.CustomerId, cmd.Lines); // invariants in the domain
        await repo.AddAsync(order, ct);
        await uow.SaveChangesAsync(ct);
        return order.Id; // returns identity, not the screen
    }
}
```

The subtle point: the handler **does not build the listing response**. It changes state and returns the minimum. Whoever needs to display the order afterwards issues a Query.

## Query: a read that does not go through the aggregate

A `Query` reads and never changes state. Since it has no invariant to protect, it can (and should) skip the aggregate and project straight to a DTO - including SQL or EF projecting only the columns used.

```csharp
public sealed record GetOrderSummaryQuery(Guid OrderId) : IRequest<OrderSummaryDto>;

public sealed class GetOrderSummaryHandler(IReadDbConnection db)
    : IRequestHandler<GetOrderSummaryQuery, OrderSummaryDto>
{
    public Task<OrderSummaryDto> Handle(GetOrderSummaryQuery q, CancellationToken ct) =>
        db.QuerySingleAsync<OrderSummaryDto>(
            """
            SELECT o.id, o.status, c.name AS customer, SUM(l.total) AS total
            FROM orders o
            JOIN customers c ON c.id = o.customer_id
            JOIN order_lines l ON l.order_id = o.id
            WHERE o.id = @OrderId
            GROUP BY o.id, o.status, c.name
            """, new { q.OrderId });
}
```

Here lives a concrete CQRS gain: the read does **one join and one DTO**, without loading the whole `Order` entity with lazy loading just to discard most of it. Domain-rich write, lean SQL read.

## MediatR: the in-process bus that glues it together

MediatR is not CQRS - it is just a dispatcher. But it gives the structure that keeps CQRS tidy: the controller knows no handler, it just sends the message.

```csharp
[ApiController, Route("orders")]
public sealed class OrdersController(ISender mediator) : ControllerBase
{
    [HttpPost]
    public async Task<IActionResult> Place(PlaceOrderCommand cmd)
        => CreatedAtAction(nameof(Get), new { id = await mediator.Send(cmd) }, null);

    [HttpGet("{id:guid}")]
    public async Task<OrderSummaryDto> Get(Guid id)
        => await mediator.Send(new GetOrderSummaryQuery(id));
}
```

The controller stays thin on purpose: it translates HTTP into a message and returns the result. All the rule is in the handler, testable without spinning up a web server.

## Pipeline behaviors: validation and transactions without polluting the handler

The feature that pays for MediatR the most is the **pipeline behavior**: a middleware that wraps every `Send`. It is where you put cross-cutting concerns - validation, logging, transactions - **once**, instead of repeating them in every handler.

```csharp
// Validates the request with FluentValidation before reaching the handler
public sealed class ValidationBehavior<TReq, TRes>(IEnumerable<IValidator<TReq>> validators)
    : IPipelineBehavior<TReq, TRes> where TReq : notnull
{
    public async Task<TRes> Handle(TReq req, RequestHandlerDelegate<TRes> next, CancellationToken ct)
    {
        var errors = validators
            .Select(v => v.Validate(req))
            .SelectMany(r => r.Errors)
            .Where(e => e is not null).ToList();

        if (errors.Count != 0) throw new ValidationException(errors);
        return await next();
    }
}
```

A second behavior can open a transaction for commands only (and not for queries), committing at the end of the pipeline. The result: clean handlers, each caring only about its own rule, while validation and transactions stay centralized and independently testable.

## The three levels - and where to stop

CQRS is not all-or-nothing. There are three levels of separation, and most systems should stay at the first:

1. **Code only**: distinct Command/Query handlers over the **same database and the same ORM**. Gains clarity at near-zero cost. This is where almost every project should live.
2. **Dedicated read models**: same database, but the read uses views or flat SQL queries instead of the aggregate. Gains read performance.
3. **Separate databases**: distinct write store and read store, synchronized by events. Gains independent read scale - and pays with **eventual consistency**: the read model can lag the write by a few moments.

The classic mistake is jumping to level 3 chasing architectural purity. Eventual consistency is a real product cost (the user saves and does not see it immediately), not a technical detail. Only move up a level when the read or scale pain justifies it.

## Conclusion

In practice, CQRS in .NET is less about the framework and more about **boundary discipline**: command changes state and returns identity; query reads and returns a DTO; neither invades the other's territory. MediatR comes in as the plumbing that keeps this tidy - thin controllers, focused handlers, behaviors centralizing what is cross-cutting. Start with a single database and separation only in code. The two models pay off when read and write truly diverge; if your domain is an honest CRUD, CQRS only adds types. The pattern is good when it resolves an asymmetry that exists - not when it creates one.
'''
body_ja_jp = '''
CQRS（コマンドクエリ責務分離）は本質的に一文です。**書き込むモデルと読み取るモデルを分ける**。概念的な部分は別の記事で扱いました。ここでの焦点は **コード** です。それがどうハンドラになるか、MediatR がどこに入るか、検証とトランザクションがどこに差し込まれるか、そして何も求めていない CRUD を複雑化する罠にどう陥らないか。

## なぜ分けるのか、コード一行で

書き込みモデルは **不変条件を守る** ために存在します。集約をロードし、ビジネスルールを検証し、決定します。読み取りモデルは **画面を満たす** ために存在します。平坦な DTO を求め、しばしば複数の集約を join し、守るべきものは何もありません。両者を同じ `Repository<T>` と同じエンティティに通すと、書き込みは画面が使わないフィールドを背負い、読み取りは不要な検証を通ります。CQRS は各側にそれぞれの経路を与えます。

## Command：状態を変える意図

`Command` はシステムを変更する要求です。画面データは返しません ── せいぜい識別子か成功/失敗の結果です。MediatR では command は record で、ハンドラがルールの宿る場所です。

```csharp
// Command：意図、生の入力データ
public sealed record PlaceOrderCommand(Guid CustomerId, IReadOnlyList<OrderLine> Lines)
    : IRequest<Guid>;

// Handler：集約をロードし、ルールを適用し、永続化する
public sealed class PlaceOrderHandler(IOrderRepository repo, IUnitOfWork uow)
    : IRequestHandler<PlaceOrderCommand, Guid>
{
    public async Task<Guid> Handle(PlaceOrderCommand cmd, CancellationToken ct)
    {
        var order = Order.Place(cmd.CustomerId, cmd.Lines); // 不変条件はドメインに
        await repo.AddAsync(order, ct);
        await uow.SaveChangesAsync(ct);
        return order.Id; // 画面ではなく識別子を返す
    }
}
```

微妙な点。ハンドラは **一覧の応答を組み立てません**。状態を変え、最小限を返します。後で注文を表示したい者は Query を発行します。

## Query：集約を経由しない読み取り

`Query` は読み取り、状態を決して変えません。守るべき不変条件がないので、集約を飛ばして直接 DTO に射影できます（すべきです）── 使う列だけを射影する SQL や EF を含めて。

```csharp
public sealed record GetOrderSummaryQuery(Guid OrderId) : IRequest<OrderSummaryDto>;

public sealed class GetOrderSummaryHandler(IReadDbConnection db)
    : IRequestHandler<GetOrderSummaryQuery, OrderSummaryDto>
{
    public Task<OrderSummaryDto> Handle(GetOrderSummaryQuery q, CancellationToken ct) =>
        db.QuerySingleAsync<OrderSummaryDto>(
            """
            SELECT o.id, o.status, c.name AS customer, SUM(l.total) AS total
            FROM orders o
            JOIN customers c ON c.id = o.customer_id
            JOIN order_lines l ON l.order_id = o.id
            WHERE o.id = @OrderId
            GROUP BY o.id, o.status, c.name
            """, new { q.OrderId });
}
```

ここに CQRS の具体的な利得があります。読み取りは **1 つの join と 1 つの DTO** で済み、大半を捨てるためだけに `Order` エンティティ全体を遅延ロードで持ち込みません。ドメインに富んだ書き込み、SQL に痩せた読み取り。

## MediatR：すべてを糊付けするインプロセスのバス

MediatR は CQRS ではありません ── ただのディスパッチャです。しかし CQRS を整然と保つ構造を与えます。コントローラはどのハンドラも知らず、メッセージを送るだけです。

```csharp
[ApiController, Route("orders")]
public sealed class OrdersController(ISender mediator) : ControllerBase
{
    [HttpPost]
    public async Task<IActionResult> Place(PlaceOrderCommand cmd)
        => CreatedAtAction(nameof(Get), new { id = await mediator.Send(cmd) }, null);

    [HttpGet("{id:guid}")]
    public async Task<OrderSummaryDto> Get(Guid id)
        => await mediator.Send(new GetOrderSummaryQuery(id));
}
```

コントローラは意図的に薄いままです。HTTP をメッセージに翻訳し、結果を返します。すべてのルールはハンドラにあり、Web サーバを立てずにテストできます。

## パイプライン behavior：ハンドラを汚さない検証とトランザクション

MediatR の元を最も取る機能が **パイプライン behavior** です。すべての `Send` を包むミドルウェアで、横断的関心事 ── 検証・ロギング・トランザクション ── を各ハンドラで繰り返す代わりに **一度** 置く場所です。

```csharp
// ハンドラに届く前に FluentValidation でリクエストを検証する
public sealed class ValidationBehavior<TReq, TRes>(IEnumerable<IValidator<TReq>> validators)
    : IPipelineBehavior<TReq, TRes> where TReq : notnull
{
    public async Task<TRes> Handle(TReq req, RequestHandlerDelegate<TRes> next, CancellationToken ct)
    {
        var errors = validators
            .Select(v => v.Validate(req))
            .SelectMany(r => r.Errors)
            .Where(e => e is not null).ToList();

        if (errors.Count != 0) throw new ValidationException(errors);
        return await next();
    }
}
```

2 つ目の behavior は command だけ（query には付けず）トランザクションを開き、パイプラインの最後でコミットできます。結果として、ハンドラは清潔になり、各々が自分のルールだけを扱い、検証とトランザクションは中央集約され単独でテスト可能になります。

## 3 つのレベル ── そしてどこで止めるか

CQRS は全か無かではありません。分離には 3 つのレベルがあり、ほとんどのシステムは最初に留まるべきです。

1. **コードのみ**：**同じデータベースと同じ ORM** の上に別々の Command/Query ハンドラ。ほぼゼロコストで明快さを得ます。ほぼすべてのプロジェクトがここに住むべきです。
2. **専用の読み取りモデル**：同じDB だが、読み取りは集約ではなくビューや平坦な SQL を使う。読み取り性能を得ます。
3. **別々のデータベース**：別個の書き込みストアと読み取りストアを、イベントで同期。独立した読み取りスケールを得て ── **結果整合性** で支払います。読み取りモデルは書き込みに数瞬遅れることがあります。

古典的な誤りは、アーキテクチャの純粋さを追ってレベル 3 に飛ぶことです。結果整合性は技術的細部ではなく、現実のプロダクトコストです（ユーザーは保存しても即座に見えない）。読み取りやスケールの痛みが正当化するときだけ、レベルを上げましょう。

## 結論

実務では、.NET の CQRS はフレームワークより **境界の規律** の話です。command は状態を変え識別子を返す。query は読み取り DTO を返す。どちらも相手の領域を侵さない。MediatR はこれを整然と保つ配管として入ります ── 薄いコントローラ、焦点の定まったハンドラ、横断的なものを集約する behavior。まず単一のデータベースとコードだけの分離で始めましょう。2 つのモデルは読み取りと書き込みが本当に分岐するとき報われます。あなたのドメインが正直な CRUD なら、CQRS は型を増やすだけです。このパターンは、存在する非対称を解くときに良く ── 作り出すときには良くありません。

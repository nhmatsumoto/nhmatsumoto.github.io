## 実際のコンテキスト

SOS Locationでは、開発者・緊急対応コーディネーター・現場チームの3グループが同時にシステムを使用する。それぞれが同じ概念を異なる名前で呼ぶ。コードでは「location」、運用報告では「被災地」、現場報告では「危険区域」。開発者がポリゴンエリアではなくGPS座標を使ったために誤った「location」へのアラートが発令されれば、救助活動が誤方向に向かう。

## 具体的な問題

標準的な語彙なしでは、各モジュールが独自の用語を作る。アラートモジュールは `AffectedZone`、捜索モジュールは `SearchArea`、救助モジュールは `OperationRegion` を使う。すべて同じ概念を表している。新しい開発者はモジュール間のフローを追跡できない。緊急対応コーディネーターが監査ログを読んでも、いずれの用語も認識できない。

## 技術的決定

コードとしてポルトガル語のドメイン用語集を確立する。C#コードと運用文書の両方に登場する用語により、コードを読んだ際に緊急対応コーディネーターが認識できる文章が生成される。

| コード用語 | 運用上の意味 |
|---|---|
| `AreaDeRisco` | 危険レベル1〜10の地理的ポリゴン |
| `HotspotAtivo` | 500m半径内の活発なインシデントの集中 |
| `PessoaDesaparecida` | 確認された位置情報なしで報告された個人 |
| `AlertaDeEmergencia` | エリア内の全デバイスへの通知 |
| `OperacaoDeResgate` | 位置特定と救助のための協調行動 |
| `ZonaDeExclusao` | 活動中の作戦における立入禁止区域 |

## 実装

```csharp
// SosLocation.Domain.Shared/DomainGlossary.cs
namespace SosLocation.Domain.Shared;

public static class DomainGlossary
{

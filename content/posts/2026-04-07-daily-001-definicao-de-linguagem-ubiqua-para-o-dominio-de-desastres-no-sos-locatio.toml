## 具体的な例

緊急対応コーディネーターが監査ログを読む：`"PessoaDesaparecida.Status が 'EmBusca' から 'Localizada' へ 14:32 に変更されました"`。ドキュメントを参照せずにフローを理解できる。同じコードを読んだ開発者は `StatusPessoaDesaparecida.Localizada` を見て、運用上で何が起きたかを正確に把握できる。

## 成功基準

技術的バックグラウンドのない緊急対応コーディネーターが、開発者の翻訳なしにスタックトレースや監査ログを読み、エラーが操作のどのフェーズで発生したかを特定できる。用語集が主要ドメインエンティティの100%をカバーしている。

## SOS Locationとの関係

災害ドメインには標準的なソフトウェア語彙に存在しない固有の用語がある。`PessoaDesaparecida` は異なるステータスを持つ `User` ではなく、`Address` ではなく `UltimaLocalizacao` を持つ。`AreaDeRisco` は `Category` ではなく、`NivelRisco` と `PoligonoGeografico` を持つ。ユビキタス言語こそが、SOS LocationをITと市民防衛の混成チームに理解可能にするものだ。

## Real context

In SOS Location, three groups use the system simultaneously: developers, emergency coordinators, and field teams. Each group refers to the same concept by a different name. "Location" in the code, "affected area" in operational reports, "risk zone" in field bulletins. When an alert targets the wrong "location" because a developer used GPS coordinates instead of the area polygon, the result is a misdirected rescue operation.

## Specific problem

Without canonical vocabulary, each module invents its own terms. The alert module uses `AffectedZone`, the search module uses `SearchArea`, the rescue module uses `OperationRegion`. All represent the same concept. A new developer cannot trace the flow between modules because the terms do not connect. And an emergency coordinator reading audit logs recognises none of them.

## Technical decision

Establish a Portuguese-language domain glossary as code - terms that appear in both the C# codebase and operational documentation, ensuring that reading the code produces sentences an emergency coordinator recognises.

| Code term | Operational meaning |
|---|---|
| `AreaDeRisco` | Geographic polygon with danger level 1–10 |
| `HotspotAtivo` | Concentration of active incidents within a 500 m radius |
| `PessoaDesaparecida` | Individual reported without confirmed location |
| `AlertaDeEmergencia` | Notification sent to all devices in an area |
| `OperacaoDeResgate` | Set of coordinated actions to locate and rescue |
| `ZonaDeExclusao` | Area with restricted access during an active operation |

## Implementation

```csharp
// SosLocation.Domain.Shared/DomainGlossary.cs
namespace SosLocation.Domain.Shared;

public static class DomainGlossary
{
    public const int NivelRiscoMinimo = 1;
    public const int NivelRiscoMaximo = 10;
    public const double RaioHotspotPadraoMetros = 500.0;

    public static class StatusPessoaDesaparecida
    {
        public const string Reportada  = "Reportada";
        public const string EmBusca    = "EmBusca";
        public const string Localizada = "Localizada";
        public const string Confirmada = "Confirmada";
    }
}

// SosLocation.Domain.Busca/PessoaDesaparecida.cs
public sealed class PessoaDesaparecida
{
    public Guid   Id                        { get; private set; }
    public string Nome                      { get; private set; }
    public Coordenadas UltimaLocalizacao    { get; private set; }
    public DateTimeOffset ReportadaEm       { get; private set; }
    public string Status                    { get; private set; }

    private PessoaDesaparecida() { }

    public static PessoaDesaparecida Reportar(string nome, Coordenadas loc)
    {
        if (string.IsNullOrWhiteSpace(nome))
            throw new DomainException("Nome é obrigatório para registrar pessoa desaparecida.");

        return new PessoaDesaparecida
        {
            Id               = Guid.NewGuid(),
            Nome             = nome,
            UltimaLocalizacao = loc,
            ReportadaEm      = DateTimeOffset.UtcNow,
            Status           = DomainGlossary.StatusPessoaDesaparecida.Reportada
        };
    }
}
```

## Concrete example

An emergency coordinator reads the audit log: `"PessoaDesaparecida.Status changed from 'EmBusca' to 'Localizada' at 14:32"`. Without consulting documentation, they understand the flow. A developer reading the same code sees `StatusPessoaDesaparecida.Localizada` and knows exactly what happened operationally. The language is the same in both contexts.

## Success criteria

An emergency coordinator without a technical background can read a stack trace or audit log and identify which phase of the operation an error occurred in, without needing a developer to translate. The glossary covers 100% of the primary domain entities.

## Relation to SOS Location

The disaster domain has terminology that does not exist in standard software vocabulary. `PessoaDesaparecida` is not a `User` with a different status - she has `UltimaLocalizacao`, not `Address`. `AreaDeRisco` is not a `Category` - it has `NivelRisco` and `PoligonoGeografico`. The ubiquitous language is what makes SOS Location comprehensible to mixed teams of IT and civil defence professionals.

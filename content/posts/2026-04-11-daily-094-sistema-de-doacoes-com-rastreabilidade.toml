This Daily expands **Donation system with traceability** within the **product and vision** track of SOS Location.

## Description
The goal is to turn **Donation system with traceability** into a verifiable artifact in code, contract, or operations.

## Fundamentals
If the team cannot answer who decides, what changes, and how to measure it, **Donation system with traceability** is still abstract. The practical rule is to keep the artifact close to the flow it changes.

## Formula
Practical reading of the decision:
Impact = reach × trust × readiness

## Flow diagram
```mermaid
flowchart LR
  A["Necessidade"] --> B["Proposta de valor"]
  B --> C["Entrega"]
  C --> D["Medição pública"]
  D --> E["Ajuste de rota"]
```

## Implementation example
```typescript
export const D094SistemaDeDoacoesComRastreabiliCapability = {
  name: 'D094SistemaDeDoacoesComRastreabili',
  status: 'planned',
  owner: 'product',
};
```

## How to apply it in SOS Location
- Define the minimum contract for Donation system with traceability.
- Record the decision where the team actually keeps it over time.
- Validate it with real data, a test, or a verifiable query.

## Common pitfalls
- Promising value without a clear operational path.
- Measuring delivery only and ignoring trust or transparency.

## Success criteria
The product evolves well when impact is visible and explainable to any team.

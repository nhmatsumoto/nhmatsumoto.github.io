body_ja_jp = '''
このDailyでは、SOS Locationの **プロダクトとビジョン** トラックにおける **追跡可能な寄付システム** を詳しく整理します。

## 説明
目的は、**追跡可能な寄付システム** をコード、契約、運用で検証できる成果物にすることです。

## 基礎
チームが「誰が決めるか」「何が変わるか」「どう測るか」に答えられないなら、**追跡可能な寄付システム** はまだ抽象的です。 実践的なルールは、その成果物を変更対象の流れの近くに置くことです。

## 数式
判断を読むための指標:
インパクト = 到達範囲 × 信頼 × 準備度

## フロー図
```mermaid
flowchart LR
  A["Necessidade"] --> B["Proposta de valor"]
  B --> C["Entrega"]
  C --> D["Medição pública"]
  D --> E["Ajuste de rota"]
```

## 実装例
```typescript
export const D094SistemaDeDoacoesComRastreabiliCapability = {
  name: 'D094SistemaDeDoacoesComRastreabili',
  status: 'planned',
  owner: 'product',
};
```

## SOS Location での適用方法
- 追跡可能な寄付システム の最小契約を定義します。
- 判断を、チームが長期的に維持する場所に記録します。
- 実データ、テスト、検証可能なクエリで確認します。

## よくある落とし穴
- 運用の道筋なしに価値を約束する。
- 提供量だけを測り、信頼や透明性を無視する。

## 成功基準
どのチームにも影響が見えて説明できれば、プロダクトは順調に進化しています。

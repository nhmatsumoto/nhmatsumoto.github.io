## Description
The goal is to turn **Bounded context definition: Rescue, Users and Alerts** into a verifiable artifact in code, contract, or operations.

## Fundamentals
If the team cannot answer who decides, what changes, and how to measure it, **Bounded context definition: Rescue, Users and Alerts** is still abstract. The practical rule is to keep the artifact close to the flow it changes.

## Formula

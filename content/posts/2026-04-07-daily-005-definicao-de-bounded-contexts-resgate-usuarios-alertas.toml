body_ja_jp = '''
## 実際のコンテキスト

SOS Locationでは、捜索チームは行方不明者について知る必要があるが、支払い記録にアクセスすべきではない。救助チームは運用アラートを受信する必要があるが、寄付の財務履歴を照会すべきではない。通知チームは住民にアラートを送信する必要があるが、進行中の救助作戦の内部詳細を知る必要はない。

## 具体的な問題

最初のバージョンでは、`AlertaController`がアラート発令前に活動中の作戦を確認するために`IOperacaoDeResgateRepository`を直接注入していた。これによりAlertas（アラート）とResgate（救助）のコンテキスト間に直接的な結合が生まれた。`OperacaoDeResgate`の内部構造が変更された際（`ResponsavelTecnico`フィールドの追加）、Alertasモジュールのビルドが壊れた--救助作戦の構造とは無関係なモジュールだ。

## 技術的決定

明確な境界を持つ3つの境界づけられたコンテキスト：`Busca`（行方不明者管理）、`Resgate`（現場作戦調整）、`Alertas`（住民通知）。統合はメッセージバスで公開されるインテグレーションイベント経由のみ--コンテキスト間の直接呼び出しは一切禁止。

```
Busca BC ──[PessoaDesaparecidaReportadaIntegrationEvent]──► Resgate BC
Busca BC ──[PessoaDesaparecidaReportadaIntegrationEvent]──► Alertas BC
Resgate BC ──[OperacaoEncerradaIntegrationEvent]──────────► Alertas BC
```

## 実装

```csharp
public sealed record PessoaDesaparecidaReportadaIntegrationEvent(
    Guid   PessoaId,
    string Nome,
    double Latitude,
    double Longitude,
    DateTimeOffset ReportadaEm
) : IIntegrationEvent;

// ResgateBCはイベントを消費する--Buscaを直接呼び出さない
public sealed class IniciarOperacaoDeBuscaHandler
    : IIntegrationEventHandler<PessoaDesaparecidaReportadaIntegrationEvent>
{
    public async Task Handle(
        PessoaDesaparecidaReportadaIntegrationEvent evt, CancellationToken ct)
    {
        var operacao = OperacaoDeResgate.Iniciar(
            pessoaDesaparecidaId: evt.PessoaId,
            coordenadas: new Coordenadas(evt.Latitude, evt.Longitude),
            iniciadaEm: evt.ReportadaEm);
        await _repo.AddAsync(operacao, ct);
        await _uow.CommitAsync(ct);
    }
}

// AlertasBCも同じイベントを独立して消費する
public sealed class EmitirAlertaDeDesaparecimentoHandler
    : IIntegrationEventHandler<PessoaDesaparecidaReportadaIntegrationEvent>
{
    public async Task Handle(
        PessoaDesaparecidaReportadaIntegrationEvent evt, CancellationToken ct)
    {
        var alerta = AlertaDeEmergencia.Emitir(
            mensagem: $"Pessoa desaparecida: {evt.Nome}. Última localização conhecida.",
            coordenadas: new Coordenadas(evt.Latitude, evt.Longitude),
            raioKm: 2.0);
        await _alertaService.BroadcastAsync(alerta, ct);
    }
}
```

## 具体的な例

`OperacaoDeResgate`の内部モデルに`ResponsavelTecnico`フィールドが追加された際、変更が必要だったのは`Resgate`モジュールのみだった。`Alertas`モジュールは`OperacaoDeResgate`の構造ではなく`OperacaoEncerradaIntegrationEvent`のみに依存していたため、変更なしで動作し続けた。

## 成功基準

1つの境界づけられたコンテキストの内部構造を変更しても他のビルドが壊れない。各コンテキストは他のコンテキストのモックなしに独自の統合テストスイートを持つ。インテグレーションイベントのコントラクトは独立してバージョン管理される。

## SOS Locationとの関係

現場では、捜索・救助・通信チームが独立した通信チャネルで異なる運用上の責任を持つ。コードでこれらのコンテキストを混在させること--運用上で混在させるのと同様--は、変更への対応速度が重要な危機のピーク時に混乱を引き起こす。
'''

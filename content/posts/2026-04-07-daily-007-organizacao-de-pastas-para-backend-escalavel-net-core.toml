## Concrete example

When receiving the task "add optional CPF validation to missing person registration," the developer opens `Features/RegistrarPessoaDesaparecida/` and finds all relevant files: `Command.cs` (add `Cpf?` field), `Validator.cs` (add optional rule), `Handler.cs` (no change needed). PR with 2 modified files, reviewed in 10 minutes.

## Success criteria

Any new developer can locate all relevant files for a specific feature in under 30 seconds by opening a single folder. New feature PRs touch at most 2 directories (the feature folder + domain if needed).

## Relation to SOS Location

During emergencies, SOS Location receives urgent requests for new operational features ("add photo field to missing person registration", "add SMS channel to alert"). The vertical structure allows these features to be implemented, reviewed, and deployed in hours, not days.

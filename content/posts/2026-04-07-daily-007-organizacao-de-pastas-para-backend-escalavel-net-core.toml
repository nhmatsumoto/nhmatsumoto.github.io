## 具体的な例

「行方不明者登録にオプションのCPF検証を追加する」というタスクを受け取ったとき、開発者は`Features/RegistrarPessoaDesaparecida/`を開いて関連ファイルをすべて見つける：`Command.cs`（`Cpf?`フィールドを追加）・`Validator.cs`（オプションルールを追加）・`Handler.cs`（変更不要）。変更ファイル2つのPR、10分でレビュー完了。

## 成功基準

新しい開発者が1つのフォルダを開くことで、特定のフィーチャーの関連ファイルをすべて30秒以内に見つけられる。新しいフィーチャーのPRが最大2つのディレクトリに触れる（フィーチャーフォルダ＋必要に応じてドメイン）。

## SOS Locationとの関係

緊急時、SOS Locationは新しい運用フィーチャーへの緊急リクエストを受ける（「行方不明者登録に写真フィールドを追加」「アラートにSMSチャネルを追加」）。垂直構造により、これらのフィーチャーを日ではなく時間単位で実装・レビュー・デプロイできる。

// Features/RegistrarPessoaDesaparecida/Endpoint.cs
public static class RegistrarPessoaDesaparecidaEndpoint
{
    public static void Map(IEndpointRouteBuilder app)
    {
        app.MapPost("/api/v1/missing-persons",
            async (RegistrarPessoaDesaparecidaCommand cmd, IMediator mediator, CancellationToken ct) =>
            {
                var id = await mediator.Send(cmd, ct);
                return Results.Created($"/api/v1/missing-persons/{id}",

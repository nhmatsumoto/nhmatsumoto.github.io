body = '''
## Contexto real

O SOS Location começou com a estrutura clássica por camada técnica: `Controllers/`, `Services/`, `Repositories/`, `Models/`. Após 3 meses, para entender o que acontecia ao registrar uma pessoa desaparecida, um desenvolvedor novo precisava abrir 6 arquivos em 6 pastas diferentes. O fluxo estava espalhado horizontalmente pelo codebase.

## Problema específico

A estrutura por camada técnica escala mal com features novas. Adicionar "snapshot de operações" exige criar `OperationSnapshotController.cs`, `OperationSnapshotService.cs`, `OperationSnapshotRepository.cs`, `OperationSnapshotDto.cs` em quatro pastas diferentes. Um PR de feature toca 4 diretórios. Code review perde contexto porque os arquivos relacionados estão espalhados.

## Decisão técnica

Vertical slices: cada feature em sua própria pasta com todos os arquivos necessários. A feature `RegistrarPessoaDesaparecida` contém seu command, handler, validator, endpoint e DTO de resposta no mesmo diretório. Para entender o fluxo completo, abra uma pasta.

## Implementação

```
SosLocation/
├── src/
│   ├── SosLocation.Api/
│   │   └── Features/
│   │       ├── RegistrarPessoaDesaparecida/
│   │       │   ├── Endpoint.cs          ← MapPost("/missing-persons")
│   │       │   ├── Command.cs           ← record + IRequest<Guid>
│   │       │   ├── Handler.cs           ← IRequestHandler<Command, Guid>
│   │       │   ├── Validator.cs         ← AbstractValidator<Command>
│   │       │   └── Response.cs          ← record PessoaRegistradaResponse(Guid Id)
│   │       ├── BuscarHotspotsProximos/
│   │       │   ├── Endpoint.cs
│   │       │   ├── Query.cs
│   │       │   ├── Handler.cs
│   │       │   └── HotspotProximoDto.cs
│   │       └── EmitirAlerta/
│   │           ├── Endpoint.cs
│   │           ├── Command.cs
│   │           ├── Handler.cs
│   │           └── Validator.cs
│   ├── SosLocation.Domain/
│   │   ├── Busca/
│   │   │   ├── PessoaDesaparecida.cs    ← aggregate root
│   │   │   ├── Coordenadas.cs           ← value object
│   │   │   └── Events/
│   │   │       └── PessoaDesaparecidaReportadaEvent.cs
│   │   ├── Resgate/
│   │   │   └── OperacaoDeResgate.cs
│   │   └── Alertas/
│   │       └── AlertaDeEmergencia.cs
│   └── SosLocation.Infrastructure/
│       ├── Persistence/
│       │   ├── TenantScopedDbContext.cs
│       │   └── Configurations/
│       │       ├── PessoaDesaparecidaConfiguration.cs
│       │       └── HotspotConfiguration.cs
│       └── ExternalServices/
│           └── GdacsClient.cs
└── tests/
    ├── SosLocation.Domain.Tests/
    │   └── Busca/
    │       └── PessoaDesaparecidaTests.cs
    └── SosLocation.Api.Tests/
        └── Features/
            └── RegistrarPessoaDesaparecida/
                └── HandlerTests.cs
```

```csharp
// Features/RegistrarPessoaDesaparecida/Endpoint.cs
public static class RegistrarPessoaDesaparecidaEndpoint
{
    public static void Map(IEndpointRouteBuilder app)
    {
        app.MapPost("/api/v1/missing-persons",
            async (RegistrarPessoaDesaparecidaCommand cmd, IMediator mediator, CancellationToken ct) =>
            {
                var id = await mediator.Send(cmd, ct);
                return Results.Created($"/api/v1/missing-persons/{id}",
                    new PessoaRegistradaResponse(id));
            })
           .RequireAuthorization()
           .WithTags("Busca");
    }
}
```

## Exemplo concreto

Ao receber a task "adicionar validação de CPF opcional ao registro de pessoa desaparecida", o desenvolvedor abre `Features/RegistrarPessoaDesaparecida/` e encontra todos os arquivos relevantes: `Command.cs` (adicionar campo `Cpf?`), `Validator.cs` (adicionar regra opcional), `Handler.cs` (nenhuma mudança necessária). PR com 2 arquivos modificados, revisão em 10 minutos.

## Critério de sucesso

Qualquer desenvolvedor novo consegue localizar todos os arquivos relevantes para uma feature específica em menos de 30 segundos, abrindo uma única pasta. PRs de features novas tocam no máximo 2 diretórios (a pasta da feature + o domain se necessário).

## Relação com SOS Location

Durante emergências, o SOS Location recebe requisições de novas features operacionais com urgência ("adicionar campo de foto ao registro de desaparecido", "adicionar canal de SMS ao alerta"). A estrutura vertical permite que essas features sejam implementadas, revisadas e deployed em horas, não dias.

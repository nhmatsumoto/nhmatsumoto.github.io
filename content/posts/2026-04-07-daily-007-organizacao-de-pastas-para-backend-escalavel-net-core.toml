## 実際のコンテキスト

SOS Locationは古典的な技術レイヤー別構造で始まった：`Controllers/`・`Services/`・`Repositories/`・`Models/`。3ヶ月後、行方不明者の登録で何が起こるかを理解するには、新しい開発者が6つの異なるフォルダの6つのファイルを開く必要があった。フローはコードベース全体に水平に散在していた。

## 具体的な問題

技術レイヤー別構造は新しいフィーチャーに対してスケールしない。「作戦スナップショット」を追加するには、4つの異なるフォルダに`OperationSnapshotController.cs`・`OperationSnapshotService.cs`・`OperationSnapshotRepository.cs`・`OperationSnapshotDto.cs`を作成する必要がある。フィーチャーのPRが4つのディレクトリに触れる。関連ファイルが分散しているため、コードレビューがコンテキストを失う。

## 技術的決定

垂直スライス：各フィーチャーが必要なすべてのファイルを持つ独自のフォルダに配置される。`RegistrarPessoaDesaparecida`フィーチャーには、コマンド・ハンドラー・バリデーター・エンドポイント・レスポンスDTOが同じディレクトリに含まれる。完全なフローを理解するには、1つのフォルダを開くだけでよい。

## 実装

```
SosLocation/
├── src/
│   ├── SosLocation.Api/
│   │   └── Features/
│   │       ├── RegistrarPessoaDesaparecida/
│   │       │   ├── Endpoint.cs
│   │       │   ├── Command.cs
│   │       │   ├── Handler.cs
│   │       │   ├── Validator.cs
│   │       │   └── Response.cs
│   │       ├── BuscarHotspotsProximos/
│   │       │   ├── Endpoint.cs
│   │       │   ├── Query.cs
│   │       │   ├── Handler.cs
│   │       │   └── HotspotProximoDto.cs
│   │       └── EmitirAlerta/
│   │           ├── Endpoint.cs
│   │           ├── Command.cs
│   │           ├── Handler.cs
│   │           └── Validator.cs
│   ├── SosLocation.Domain/
│   │   ├── Busca/
│   │   │   ├── PessoaDesaparecida.cs
│   │   │   └── Events/
│   │   │       └── PessoaDesaparecidaReportadaEvent.cs
│   │   └── Resgate/
│   │       └── OperacaoDeResgate.cs
│   └── SosLocation.Infrastructure/
│       └── Persistence/
│           └── TenantScopedDbContext.cs
└── tests/
    └── SosLocation.Api.Tests/
        └── Features/
            └── RegistrarPessoaDesaparecida/
                └── HandlerTests.cs
```


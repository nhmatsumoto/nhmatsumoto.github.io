## Real context

SOS Location started with the classic technical-layer structure: `Controllers/`, `Services/`, `Repositories/`, `Models/`. After 3 months, understanding what happened when registering a missing person required a new developer to open 6 files across 6 different folders. The flow was spread horizontally across the codebase.

## Specific problem

The technical-layer structure scales poorly with new features. Adding "operation snapshot" requires creating `OperationSnapshotController.cs`, `OperationSnapshotService.cs`, `OperationSnapshotRepository.cs`, `OperationSnapshotDto.cs` in four different folders. A feature PR touches 4 directories. Code review loses context because related files are spread apart.

## Technical decision

Vertical slices: each feature in its own folder with all necessary files. The `RegistrarPessoaDesaparecida` feature contains its command, handler, validator, endpoint, and response DTO in the same directory. To understand the complete flow, open one folder.

## Implementation


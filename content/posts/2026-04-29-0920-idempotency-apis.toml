body = '''
Uma operação é **idempotente** quando executá-la N vezes produz o mesmo efeito que executá-la uma vez. Isso não é um luxo de arquitetura - é o único motivo pelo qual você pode, com segurança, **tentar de novo** quando uma requisição falha. E em sistemas distribuídos, o retry não é uma possibilidade: é uma certeza.

## Por que a requisição chega duas vezes

A causa raiz é a **incerteza do remetente**. Quando um cliente envia `POST /payments` e o timeout estoura, ele não sabe o que aconteceu:

1. A requisição não chegou ao servidor → seguro tentar de novo.
2. O servidor processou, mas a **resposta** se perdeu na volta → tentar de novo **cobra duas vezes**.

O cliente não consegue distinguir os dois casos. Some a isso *load balancers* que reenviam, filas com entrega *at-least-once*, e usuários clicando duas vezes - a duplicata é inevitável. A pergunta não é *se*, é *quando*.

## O que já é idempotente de graça

O HTTP define semântica por método. Use-a a seu favor:

| Método | Idempotente? | Observação |
| :--- | :--- | :--- |
| `GET`, `HEAD` | Sim | Só lê, sem efeito colateral |
| `PUT` | Sim | "Defina o recurso para este estado" |
| `DELETE` | Sim | Deletar de novo o que já sumiu = mesmo estado |
| `POST` | **Não** | "Crie um novo" - é justamente o perigoso |

O problema concentra-se no `POST` (criar pagamento, pedido, transferência). É nele que precisamos de uma chave.

## A solução: Idempotency-Key

O cliente gera um identificador único **por intenção** (não por tentativa) e o envia num header. Todas as retentativas da *mesma* intenção carregam a *mesma* chave:

```http
POST /payments HTTP/1.1
Idempotency-Key: 9f1c8b3e-4d2a-4f5e-bc77-2a1e6d0f9a12
Content-Type: application/json

{ "amount": 5000, "currency": "BRL", "order_id": "ORD-123" }
```

No servidor, a lógica deve ser **atômica** - e é aqui que a maioria erra:

```csharp
// 1) Reivindica a chave de forma atômica (insert único no banco)
var claimed = await _store.TryClaimAsync(key, requestHash);
if (!claimed.IsNew)
{
    // Já vimos esta chave
    if (claimed.Status == Status.Completed)
        return claimed.SavedResponse;       // devolve a MESMA resposta
    return Conflict("Request in progress");  // ainda processando
}

// 2) Executa o efeito colateral
var result = await _payments.ChargeAsync(cmd);

// 3) Persiste a resposta ANTES de responder ao cliente
await _store.CompleteAsync(key, result);
return result;
```

## Os detalhes que separam o brinquedo do produto

- **Casar a chave com o conteúdo.** Guarde um hash do corpo. Se a mesma chave voltar com um corpo diferente, é erro do cliente → `422`, nunca processe.
- **A janela entre passos 2 e 3.** Se o processo morre depois de cobrar e antes de salvar, a próxima tentativa não sabe que já cobrou. Mitigue tornando o efeito em si idempotente (ex.: o gateway de pagamento também aceita uma chave) ou usando o *Outbox Pattern* na mesma transação.
- **Concorrência.** Duas tentativas simultâneas precisam de um lock ou de um `INSERT` com chave única que faça a segunda falhar - não dois `SELECT`-then-`INSERT`.
- **TTL.** Chaves expiram (24-72h é comum). Não guarde para sempre.

## Conclusão

Idempotência é o que transforma "retry" de uma roleta-russa em uma operação segura. Para qualquer endpoint que move dinheiro, cria recursos ou dispara efeitos externos, a `Idempotency-Key` deixou de ser opcional - é a diferença entre um cliente cobrado uma vez e um cliente furioso cobrado três. Projete a operação para ser repetível desde o primeiro dia; a rede vai testar isso por você.
'''
body_en_us = '''
An operation is **idempotent** when running it N times produces the same effect as running it once. This isn't an architectural luxury - it is the only reason you can safely **retry** when a request fails. And in distributed systems, the retry isn't a possibility: it's a certainty.

## Why the request arrives twice

The root cause is the **sender's uncertainty**. When a client sends `POST /payments` and the timeout fires, it has no idea what happened:

1. The request never reached the server → safe to retry.
2. The server processed it, but the **response** was lost on the way back → retrying **charges twice**.

The client cannot distinguish the two cases. Add load balancers that resend, queues with at-least-once delivery, and users double-clicking - the duplicate is inevitable. The question is not *if*, it's *when*.

## What is already idempotent for free

HTTP defines semantics per method. Use it to your advantage:

| Method | Idempotent? | Note |
| :--- | :--- | :--- |
| `GET`, `HEAD` | Yes | Read-only, no side effect |
| `PUT` | Yes | "Set the resource to this state" |
| `DELETE` | Yes | Deleting what's already gone = same state |
| `POST` | **No** | "Create a new one" - the dangerous one |

The problem concentrates on `POST` (create payment, order, transfer). That's where we need a key.

## The solution: Idempotency-Key

The client generates a unique identifier **per intent** (not per attempt) and sends it in a header. Every retry of the *same* intent carries the *same* key:

```http
POST /payments HTTP/1.1
Idempotency-Key: 9f1c8b3e-4d2a-4f5e-bc77-2a1e6d0f9a12
Content-Type: application/json

{ "amount": 5000, "currency": "USD", "order_id": "ORD-123" }
```

On the server, the logic must be **atomic** - and this is where most people get it wrong:

```csharp
// 1) Claim the key atomically (single insert in the DB)
var claimed = await _store.TryClaimAsync(key, requestHash);
if (!claimed.IsNew)
{
    // We've seen this key before
    if (claimed.Status == Status.Completed)
        return claimed.SavedResponse;       // return the SAME response
    return Conflict("Request in progress");  // still processing
}

// 2) Execute the side effect
var result = await _payments.ChargeAsync(cmd);

// 3) Persist the response BEFORE replying to the client
await _store.CompleteAsync(key, result);
return result;
```

## The details that separate a toy from a product

- **Bind the key to the content.** Store a hash of the body. If the same key returns with a different body, it's a client bug → `422`, never process it.
- **The window between steps 2 and 3.** If the process dies after charging and before saving, the next attempt won't know it already charged. Mitigate by making the side effect itself idempotent (e.g., the payment gateway also accepts a key) or by using the Outbox Pattern in the same transaction.
- **Concurrency.** Two simultaneous attempts need a lock, or an `INSERT` with a unique key that makes the second one fail - not two `SELECT`-then-`INSERT`.
- **TTL.** Keys expire (24-72h is common). Don't keep them forever.

## Conclusion

Idempotency turns "retry" from Russian roulette into a safe operation. For any endpoint that moves money, creates resources, or triggers external effects, the `Idempotency-Key` is no longer optional - it's the difference between a customer charged once and a furious customer charged three times. Design the operation to be repeatable from day one; the network will test it for you.
'''
body_ja_jp = '''
ある操作が **冪等** であるとは、それを N 回実行しても 1 回実行したのと同じ効果になることです。これはアーキテクチャの贅沢品ではありません。リクエストが失敗したときに安全に **リトライ** できる唯一の理由です。そして分散システムにおいて、リトライは可能性ではなく確実性です。

## なぜリクエストは二度届くのか

根本原因は **送信側の不確実性** です。クライアントが `POST /payments` を送り、タイムアウトが発火したとき、何が起きたのか分かりません。

1. リクエストがサーバに届かなかった → リトライは安全。
2. サーバは処理したが、**応答** が戻る途中で失われた → リトライは **二度課金する**。

クライアントはこの 2 つを区別できません。再送するロードバランサ、at-least-once 配信のキュー、ダブルクリックするユーザーが加われば、重複は避けられません。問いは「起きるか」ではなく「いつ起きるか」です。

## 無料ですでに冪等なもの

HTTP はメソッドごとに意味を定義します。それを味方につけましょう。

| メソッド | 冪等？ | 注記 |
| :--- | :--- | :--- |
| `GET`, `HEAD` | はい | 読み取りのみ、副作用なし |
| `PUT` | はい | 「リソースをこの状態にせよ」 |
| `DELETE` | はい | すでに消えたものを再削除 = 同じ状態 |
| `POST` | **いいえ** | 「新規作成せよ」── まさに危険なもの |

問題は `POST`（決済・注文・送金の作成）に集中します。ここでキーが必要になります。

## 解決策：Idempotency-Key

クライアントは **意図ごとに**（試行ごとではなく）一意の識別子を生成し、ヘッダで送ります。*同じ* 意図のすべてのリトライは *同じ* キーを運びます。

```http
POST /payments HTTP/1.1
Idempotency-Key: 9f1c8b3e-4d2a-4f5e-bc77-2a1e6d0f9a12
Content-Type: application/json

{ "amount": 5000, "currency": "JPY", "order_id": "ORD-123" }
```

サーバ側では、ロジックは **原子的** でなければなりません ── そしてここで大半が間違えます。

```csharp
// 1) キーを原子的に確保する（DB への単一 insert）
var claimed = await _store.TryClaimAsync(key, requestHash);
if (!claimed.IsNew)
{
    // このキーは以前に見た
    if (claimed.Status == Status.Completed)
        return claimed.SavedResponse;       // 同じ応答を返す
    return Conflict("Request in progress");  // まだ処理中
}

// 2) 副作用を実行する
var result = await _payments.ChargeAsync(cmd);

// 3) クライアントに応答する前に応答を永続化する
await _store.CompleteAsync(key, result);
return result;
```

## おもちゃと製品を分ける細部

- **キーを内容に結びつける。** 本文のハッシュを保存する。同じキーが異なる本文で戻ってきたら、クライアントのバグ → `422`、決して処理しない。
- **ステップ 2 と 3 の間の窓。** 課金後・保存前にプロセスが死ぬと、次の試行は課金済みだと知らない。副作用自体を冪等にする（例：決済ゲートウェイもキーを受け付ける）か、同一トランザクションで Outbox パターンを使って緩和する。
- **並行性。** 同時の 2 つの試行にはロック、または 2 つ目を失敗させる一意キー付き `INSERT` が必要 ── `SELECT` してから `INSERT` の二段ではない。
- **TTL。** キーは期限切れにする（24〜72 時間が一般的）。永遠に保持しない。

## 結論

冪等性は「リトライ」をロシアンルーレットから安全な操作へ変えます。お金を動かす、リソースを作る、外部効果を起こすあらゆるエンドポイントにとって、`Idempotency-Key` はもはや任意ではありません ── 一度課金された顧客と、三度課金されて激怒する顧客の違いです。初日から操作を再実行可能に設計しましょう。ネットワークがあなたの代わりにそれをテストします。

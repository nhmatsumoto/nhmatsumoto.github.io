## 具体的な例

`AreaDeRisco` id=441 - ブルメナウ（SC）のBairro Garcia地区。14:30に3時間累積降水量 = 38mm、Itajaí-Açuまでの距離 = 180m、標高 = 12m。現在の`NivelRisco` = 4。モデルは15分後に`NivelRisco` = 7を予測。システムは14:30に予防アラートを発令--物理センサーが水位変化を検出する前に。14:45に実際の`NivelRisco`到達：7。有効先行時間：15分。コーディネーターはすでに配置されていた。

## 成功基準

20% CEMADENの検証ホールドアウトで15分ウィンドウのMAE（平均絶対誤差） < 1リスクレベル。重大遷移検出精度（NivelRisco ≥ 7）：再現率 ≥ 0.85。ゾーンごとの推論レイテンシ < 50ms（LightGBM + 9特徴）。

## SOS Locationとの関係

洪水の15分前に`AreaDeRisco`の`NivelRisco`を変更することで、SOS Locationは災害文書化システムから予防システムに変わる。運用上の違いは具体的だ：コーディネーターは避難するかどうかを決める前にアラートを受け取る--道路が浸水して避難がすでに妨げられてからではなく。

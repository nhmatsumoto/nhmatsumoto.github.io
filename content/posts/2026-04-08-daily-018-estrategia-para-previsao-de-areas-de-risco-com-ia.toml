body_en_us = '''
## Real context

SOS Location needs to anticipate a rise in `NivelRisco` for an `AreaDeRisco` before flooding occurs. The current model updates risk reactively: by the time the water has arrived, the alert is already late. For urban zones with fast-response rivers (concentration time < 2h), such as Rio Itajaí-Açu and Rio Capibaribe, a 15-minute head start can mean the difference between a complete evacuation and a partial one.

## Specific problem

`NivelRisco` is currently updated by three triggers: water-level sensors (when available), Open-Meteo data (#015), and manual field reports. The problem: water-level sensors cover only 12% of `AreaDeRisco` entries in the database. Open-Meteo has 11 km spatial resolution - imprecise for 500 m urban channels. Field reports arrive 30–90 minutes late. Result: in 68% of flood events recorded in the database, `NivelRisco` was updated *after* the water reached the zone.

## Technical decision

LightGBM predictive model with a 15-minute prediction window. Input features: (1) average zone elevation (ALOS/SRTM DEM, #016), (2) average slope, (3) minimum distance to nearest river via PostGIS `ST_Distance`, (4) Open-Meteo accumulated precipitation over the last 1h, 3h and 6h, (5) number of historical flood events in the zone (CEMADEN 2000–2025), (6) hour of day and month (seasonality). Target: `NivelRisco` 15 minutes from now (regression, rounded to integer 1–10). Training dataset: 8,200 15-minute windows from 50 municipalities with CEMADEN historical data.

## Implementation

```python

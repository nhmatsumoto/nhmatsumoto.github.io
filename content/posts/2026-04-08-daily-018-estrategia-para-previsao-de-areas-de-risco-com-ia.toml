class RiskFeatures:
    elevation_m: float
    slope_deg: float
    dist_to_river_m: float
    precip_1h_mm: float
    precip_3h_mm: float
    precip_6h_mm: float
    historical_flood_count: int
    hour_of_day: int
    month: int

class RiskPredictor:
    def __init__(self, model_path: str):
        self._model = lgb.Booster(model_file=model_path)

    def predict_nivel_risco(self, features: RiskFeatures) -> int:
        x = np.array([[
            features.elevation_m, features.slope_deg, features.dist_to_river_m,
            features.precip_1h_mm, features.precip_3h_mm, features.precip_6h_mm,
            features.historical_flood_count, features.hour_of_day, features.month,
        ]])
        raw = self._model.predict(x)[0]
        return int(np.clip(round(raw), 1, 10))
```


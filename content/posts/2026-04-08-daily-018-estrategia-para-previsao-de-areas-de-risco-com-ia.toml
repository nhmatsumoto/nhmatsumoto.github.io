## 実際のコンテキスト

SOS Locationは洪水が発生する前に`AreaDeRisco`の`NivelRisco`の上昇を予測する必要がある。現在のモデルはリアクティブにリスクを更新する：水が到達した時点では、アラートはすでに遅い。Rio Itajaí-AçuやRio Capibaribeのような都市の急流河川（集中時間 < 2時間）では、15分の先行時間が完全避難と部分避難の差になる可能性がある。

## 具体的な問題

`NivelRisco`は現在3つのトリガーで更新される：水位センサー（利用可能な場合）、Open-Meteoデータ（#015）、手動フィールドレポート。問題：水位センサーはデータベースの`AreaDeRisco`の12%しかカバーしない。Open-Meteoは11km空間解像度--500mの都市水路には不正確。フィールドレポートは30〜90分遅れで届く。結果：データベースに記録された洪水イベントの68%で、`NivelRisco`は水がゾーンに到達した*後に*更新された。

## 技術的決定

15分予測ウィンドウのLightGBM予測モデル。入力特徴：(1) ゾーン平均標高（ALOS/SRTM DEM、#016）、(2) 平均傾斜、(3) PostGIS `ST_Distance`による最近河川への最小距離、(4) 過去1時間・3時間・6時間のOpen-Meteo累積降水量、(5) ゾーンの歴史的洪水イベント数（CEMADEN 2000〜2025）、(6) 時刻と月（季節性）。ターゲット：15分後の`NivelRisco`（回帰、整数1〜10に丸め）。訓練データセット：CEMADENの過去データを持つ50市町村の8,200の15分ウィンドウ。

## 実装

```python
@dataclass
class RiskFeatures:
    elevation_m: float
    slope_deg: float
    dist_to_river_m: float
    precip_1h_mm: float
    precip_3h_mm: float
    precip_6h_mm: float
    historical_flood_count: int
    hour_of_day: int
    month: int

class RiskPredictor:
    def __init__(self, model_path: str):
        self._model = lgb.Booster(model_file=model_path)

    def predict_nivel_risco(self, features: RiskFeatures) -> int:
        x = np.array([[
            features.elevation_m, features.slope_deg, features.dist_to_river_m,
            features.precip_1h_mm, features.precip_3h_mm, features.precip_6h_mm,
            features.historical_flood_count, features.hour_of_day, features.month,
        ]])
        raw = self._model.predict(x)[0]
        return int(np.clip(round(raw), 1, 10))
```


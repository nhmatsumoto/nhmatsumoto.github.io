## Concrete example

`AreaDeRisco` id=441 - Bairro Garcia, Blumenau (SC). At 14:30, accumulated precipitation 3h = 38 mm, distance to Itajaí-Açu = 180 m, elevation = 12 m. Current `NivelRisco` = 4. Model predicts `NivelRisco` = 7 in 15 minutes. System issues a preventive alert at 14:30, before physical sensors detect any level change. At 14:45, actual `NivelRisco` reached: 7. Effective lead time: 15 minutes. Coordinators were already in position.

## Success criteria

MAE (Mean Absolute Error) < 1 risk level in the 15-minute window on the 20% CEMADEN validation holdout. Critical transition detection precision (NivelRisco ≥ 7): recall ≥ 0.85. Inference latency per zone < 50 ms (LightGBM + 9 features).

## Relation to SOS Location

Changing `NivelRisco` of an `AreaDeRisco` 15 minutes before flooding transforms SOS Location from a disaster documentation system into a prevention system. The operational difference is concrete: coordinators receive the alert before deciding whether to evacuate, not after evacuation is already blocked by flooded streets.

graph LR
    A["5 1 4 2"] --> B["1 4 2 5"] --> C["1 2 4 5"]
```

## Selection sort: few swaps

Selection sort finds the smallest element of the unsorted part and places it at the front. It makes at most `n` swaps, useful when writing memory is expensive, but it stays **O(n^2)** in comparisons. Note that it is not stable.

```c
void selection_sort(int v[], int n) {
    for (int i = 0; i < n - 1; i++) {
        int min = i;
        for (int j = i + 1; j < n; j++)
            if (v[j] < v[min]) min = j;
        swap(&v[i], &v[min]);
    }
}
```

## Insertion sort: great for nearly sorted

Insertion sort builds the sorted part one element at a time, inserting each new value into its right place. It is **O(n^2)** in the worst case, but **O(n)** when the array is already nearly sorted, and it is stable. That is why it appears inside hybrid sorts to handle small chunks.

```c
void insertion_sort(int v[], int n) {
    for (int i = 1; i < n; i++) {
        int key = v[i];
        int j = i - 1;
        while (j >= 0 && v[j] > key) {
            v[j + 1] = v[j];
            j--;
        }
        v[j + 1] = key;
    }
}
```

## Merge sort: guaranteed O(n log n)

Merge sort splits the array in half recursively until it reaches single-element pieces, then merges the already sorted halves. It guarantees **O(n log n)** on any input and is stable, at the cost of **O(n)** extra memory for the merge buffer.

```c
void merge(int v[], int lo, int mid, int hi) {
    int n = hi - lo + 1;
    int *aux = malloc(n * sizeof(int));
    int i = lo, j = mid + 1, k = 0;
    while (i <= mid && j <= hi)
        aux[k++] = (v[i] <= v[j]) ? v[i++] : v[j++]; // <= keeps stability
    while (i <= mid) aux[k++] = v[i++];
    while (j <= hi)  aux[k++] = v[j++];
    for (k = 0; k < n; k++) v[lo + k] = aux[k];
    free(aux);
}

void merge_sort(int v[], int lo, int hi) {
    if (lo >= hi) return;
    int mid = lo + (hi - lo) / 2;
    merge_sort(v, lo, mid);
    merge_sort(v, mid + 1, hi);
    merge(v, lo, mid, hi);
}
```


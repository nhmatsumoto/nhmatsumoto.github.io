## Quick sort: fastest on average

Quicksort picks a **pivot**, partitions the array into smaller and larger than it, and sorts each side recursively. On average it is **O(n log n)** and is usually the fastest in practice, being in-place and cache friendly. The risk is the **O(n^2)** worst case, which appears with a bad pivot on already sorted data.

```c
int partition(int v[], int lo, int hi) {
    int pivot = v[hi];      // pivot = last element
    int i = lo - 1;
    for (int j = lo; j < hi; j++) {
        if (v[j] <= pivot) {
            i++;
            swap(&v[i], &v[j]);
        }
    }
    swap(&v[i + 1], &v[hi]);
    return i + 1;
}

void quick_sort(int v[], int lo, int hi) {
    if (lo >= hi) return;
    int p = partition(v, lo, hi);
    quick_sort(v, lo, p - 1);
    quick_sort(v, p + 1, hi);
}
```


整列はアルゴリズムの「ハローワールド」であり、**C** で実装することが本当に理解する最良の方法だ。ガベージコレクタもなく、勝手に伸びる配列もなく、メモリを直接触ることで、すべての交換とすべての確保が見える。高水準言語が `list.sort()` の裏に隠すものを、C では自分の手で書く。最も素朴なものから標準ライブラリが使うものまで、計算量と安定性を常に見ながら進もう。

## swap 関数

ほとんどのインプレース整列は要素を交換する。C ではそれが明示的だ。

```c
void swap(int *a, int *b) {
    int tmp = *a;
    *a = *b;
    *b = tmp;
}
```

## バブルソート：教育用

バブルソートは配列を繰り返し走査し、順序が逆の隣同士を交換する。各パスで最大の要素が末尾へ「浮かび上がる」。**O(n^2)** で実用ではめったに役立たないが、最も可視化しやすい。

```c
void bubble_sort(int v[], int n) {
    for (int i = 0; i < n - 1; i++) {
        int swapped = 0;
        for (int j = 0; j < n - 1 - i; j++) {
            if (v[j] > v[j + 1]) {
                swap(&v[j], &v[j + 1]);
                swapped = 1;
            }
        }
        if (!swapped) break; // すでに整列済み
    }
}
```


body_en_us = '''
Sorting is the "hello world" of algorithms, and implementing it in **C** is the best way to truly understand it. No garbage collector, no array that grows on its own, touching memory directly, every swap and every allocation is visible. What high-level languages hide behind `list.sort()`, in C you write with your own hands. We will go from the most naive to what the standard library uses, always watching complexity and stability.

## The swap function

Almost every in-place sort swaps elements. In C, that is explicit:

```c
void swap(int *a, int *b) {
    int tmp = *a;
    *a = *b;
    *b = tmp;
}
```

## Bubble sort: the teaching one

Bubble sort sweeps the array repeatedly, swapping out-of-order neighbors. On each pass, the largest element "bubbles" to the end. It is **O(n^2)** and rarely useful in practice, but it is the easiest to visualize.

```c
void bubble_sort(int v[], int n) {
    for (int i = 0; i < n - 1; i++) {
        int swapped = 0;
        for (int j = 0; j < n - 1 - i; j++) {
            if (v[j] > v[j + 1]) {
                swap(&v[j], &v[j + 1]);
                swapped = 1;
            }
        }
        if (!swapped) break; // already sorted
    }
}
```


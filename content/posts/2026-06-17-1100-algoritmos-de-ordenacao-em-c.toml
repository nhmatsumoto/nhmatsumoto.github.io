## クイックソート：平均で最速

クイックソートは **ピボット** を選び、配列をそれより小さいものと大きいものに分割し、各側を再帰的に整列する。平均で **O(n log n)** で、インプレースかつキャッシュに優しいため実用では通常最速だ。リスクは **O(n^2)** の最悪ケースで、整列済みデータに悪いピボットを選ぶと現れる。

```c
int partition(int v[], int lo, int hi) {
    int pivot = v[hi];      // ピボット = 末尾要素
    int i = lo - 1;
    for (int j = lo; j < hi; j++) {
        if (v[j] <= pivot) {
            i++;
            swap(&v[i], &v[j]);
        }
    }
    swap(&v[i + 1], &v[hi]);
    return i + 1;
}

void quick_sort(int v[], int lo, int hi) {
    if (lo >= hi) return;
    int p = partition(v, lo, hi);
    quick_sort(v, lo, p - 1);
    quick_sort(v, p + 1, hi);
}
```


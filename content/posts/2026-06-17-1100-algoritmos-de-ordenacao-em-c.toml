| マージ | O(n log n) | O(n log n) | O(n log n) | O(n) | はい |
| クイック | O(n log n) | O(n log n) | O(n^2) | O(log n) | いいえ |

## 実践：qsort

実務で整列を自分で書くことはまれだ。C の標準ライブラリは `qsort` を提供する。`void*` と比較関数で汎用だ。これが慣用的なやり方だ。

```c

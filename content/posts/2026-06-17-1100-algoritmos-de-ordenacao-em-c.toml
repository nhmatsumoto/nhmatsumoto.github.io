```

## The complexity table

| Algorithm | Best | Average | Worst | Memory | Stable |
| --- | --- | --- | --- | --- | --- |
| Bubble | O(n) | O(n^2) | O(n^2) | O(1) | yes |
| Selection | O(n^2) | O(n^2) | O(n^2) | O(1) | no |
| Insertion | O(n) | O(n^2) | O(n^2) | O(1) | yes |
| Merge | O(n log n) | O(n log n) | O(n log n) | O(n) | yes |
| Quick | O(n log n) | O(n log n) | O(n^2) | O(log n) | no |

## In practice: qsort

You rarely write a sort in production. C's standard library offers `qsort`, generic via `void*` and a comparison function. It is the idiomatic way:

```c
int cmp(const void *a, const void *b) {
    return (*(int*)a - *(int*)b); // ascending
}

int v[] = {5, 2, 8, 1};
qsort(v, 4, sizeof(int), cmp);
```

## Conclusion

Implementing sorting in C teaches more than sorting: it teaches you to feel the cost of each operation. The quadratic algorithms serve small or nearly sorted lists; merge sort delivers guaranteed O(n log n) and stability by paying memory; quicksort delivers the highest average speed by accepting a rare worst case. In C those trade-offs are not hidden behind a method call, they appear in the pointer, in `malloc` and in the recursion. Understanding that is what lets you later trust `qsort` knowing exactly what it does underneath.

qsort(v, 4, sizeof(int), cmp);
```

## 結論

C で整列を実装すると、整列以上のことを学ぶ。各操作のコストを肌で感じることを学ぶのだ。二次のアルゴリズムは小さい、またはほぼ整列したリストに役立つ。マージソートはメモリを払って保証された O(n log n) と安定性を提供する。クイックソートはまれな最悪ケースを受け入れて最高の平均速度を提供する。C ではこれらのトレードオフはメソッド呼び出しの裏に隠れず、ポインタに、`malloc` に、再帰に現れる。それを理解することが、後で `qsort` が裏で何をしているかを正確に知った上で信頼することを可能にする。

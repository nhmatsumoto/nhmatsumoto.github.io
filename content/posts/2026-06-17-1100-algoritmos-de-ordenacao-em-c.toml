## 選択ソート：交換が少ない

選択ソートは未整列部分の最小要素を見つけ、先頭に置く。交換は最大 `n` 回で、メモリへの書き込みが高価なときに有用だが、比較は **O(n^2)** のままだ。安定でないことに注意。

```c
void selection_sort(int v[], int n) {
    for (int i = 0; i < n - 1; i++) {
        int min = i;
        for (int j = i + 1; j < n; j++)
            if (v[j] < v[min]) min = j;
        swap(&v[i], &v[min]);
    }
}
```

## 挿入ソート：ほぼ整列済みに最適

挿入ソートは整列済み部分を一要素ずつ作り、各新しい値を正しい位置に挿入する。最悪では **O(n^2)** だが、配列がすでにほぼ整列していれば **O(n)** で、安定だ。だから小さな塊を扱うためにハイブリッド整列の内部に現れる。

```c
void insertion_sort(int v[], int n) {
    for (int i = 1; i < n; i++) {
        int key = v[i];
        int j = i - 1;
        while (j >= 0 && v[j] > key) {
            v[j + 1] = v[j];
            j--;
        }
        v[j + 1] = key;
    }
}
```

## マージソート：O(n log n) を保証

マージソートは配列を再帰的に半分に分け、一要素の塊に達したら、整列済みの半分同士を融合する。どんな入力でも **O(n log n)** を保証し安定だが、融合バッファのために **O(n)** の追加メモリを要する。

```c
void merge(int v[], int lo, int mid, int hi) {
    int n = hi - lo + 1;
    int *aux = malloc(n * sizeof(int));
    int i = lo, j = mid + 1, k = 0;
    while (i <= mid && j <= hi)
        aux[k++] = (v[i] <= v[j]) ? v[i++] : v[j++]; // <= で安定性を保つ
    while (i <= mid) aux[k++] = v[i++];
    while (j <= hi)  aux[k++] = v[j++];
    for (k = 0; k < n; k++) v[lo + k] = aux[k];
    free(aux);
}

void merge_sort(int v[], int lo, int hi) {
    if (lo >= hi) return;
    int mid = lo + (hi - lo) / 2;
    merge_sort(v, lo, mid);
    merge_sort(v, mid + 1, hi);
    merge(v, lo, mid, hi);
}
```


    setStatus('processing');

    try {
      await processarDoacao({ valor, operacaoId });
      setStatus('success');
    } catch (err: any) {
      setStatus(err.response?.status < 500 ? 'error' : 'success');
    }
  }

  return (
    <button onClick={handleClick} disabled={status === 'processing' || status === 'success'}>
      {status === 'processing' ? '処理中...' :
       status === 'success'    ? '寄付完了 ✓' :
       `R$ ${(valor / 100).toFixed(2)} 寄付する`}
    </button>
  );
}
```

```csharp

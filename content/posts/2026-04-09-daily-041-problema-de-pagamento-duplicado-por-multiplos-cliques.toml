## 具体的な例

寄付者が200msの差で「R$500.00 寄付する」をダブルクリック。最初のクリック：ボタンが即座に「処理中...」に変わる（Reactが2回目のクリックを無視）。バックエンドが処理し、`idempotency_key = "doacao:user123:50000:338580240"`で`Doacao`を作成。2回目のクリック（バックエンドに届いた場合）：同じキーを見つけ、新しい課金なしに既存の`DoacaoResult`を返す。重複ゼロ。

## 成功基準

実装後30日間で重複寄付がゼロ。最初のクリック後50ms未満でボタンが無効化（ReactのStateUpdate同期）。

## SOS Locationとの関係

緊急プラットフォームでの重複寄付は二重に有害だ：寄付者への財政的影響と、SOS Locationへのレピュテーション的影響--助けようとしている人を二重に課金するプラットフォームは信頼できない。フロントエンド+バックエンドの二重保護は、バックエンドだけが重複リクエストを受け取る可能性がある不安定なネットワークに対する唯一の堅牢なソリューションだ。

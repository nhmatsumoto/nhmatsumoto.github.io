## 実際のコンテキスト

SOS Locationは救助活動に資金を提供するための寄付を受け付ける--市区町村、企業、市民がアクティブな緊急時にアプリから直接寄付できる。「今すぐ寄付」ボタンは感情的プレッシャーが高い画面にある：寄付者はクリティカルゾーンのあるマップを見た後で即座に行動したい。このコンテキストで、誤ったダブルクリックは非常に一般的だ。

## 具体的な問題

寄付機能のリリース後3日間で、システムは47組の重複寄付ペアを記録した--同じ金額、同じ寄付者、2つのトランザクション間が< 500ms。決済ゲートウェイ（Stripe）は両方を課金し、データベースは2つの別々の`Doacao`を記録した。結果：R$8,400の重複課金、チームによる47件の手動払い戻し、寄付者からの3件の公開苦情。

## 技術的決定

2つの独立した保護レイヤー：(1) **フロントエンド**：最初のクリック後に即座にボタンを無効化、バリデーションエラー（4xx）の場合のみ再度有効化--成功とサーバーエラーはボタンを無効のまま；(2) **バックエンド**：冪等性キー`{doaderId}:{valorCentavos}:{5min-window}`--5分以内に同じキーを持つリクエストは新しいトランザクションを作成せずに元のレスポンスを返す。両レイヤーは独立--フロントエンドが失敗しても（バグ、不安定なネットワーク）、バックエンドはまだ保護する。

## 実装

```tsx
export function DoacaoButton({ valor, operacaoId }: Props) {
  const [status, setStatus] = useState<'idle' | 'processing' | 'success' | 'error'>('idle');

  async function handleClick() {

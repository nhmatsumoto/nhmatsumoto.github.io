# SOS Location のアーキテクチャとフロー

SOS Location のパイプラインは、取り込み、エンリッチメント、可視化を接続します。以下が主なフローダイアグラムです。

```mermaid
flowchart LR
    Ingest["取り込み"] -->|Normalize| Processor["Normalizer"]
    Processor -->|Event Store| Repository[("PostgreSQL")]
    Processor --> Visualizer["可視化 (GIS)"]
    Visualizer -->|API| Frontend["SOS Dashboard"]
    Repository -->|API| Ops["Operational Map (WebSocket)"]
```

## 主要コンポーネント

- **Ingestion**: TypeScript サービスが外部 API と接続し、`sos-events` topic へ書き込む。
- **Normalizer**: Node.js と .NET（gRPC 経由）で動作し、geometry、context、cluster の正規化ルールを適用する。
- **Repository**: PostgreSQL + PostGIS。`location` と `incident_type` に `GIST` index を張る。
- **Visualization**: React / Leaflet frontend が WebSocket を購読し、リスクレイヤをリアルタイム更新する。

## コード例

```ts
const enqueueEvent = (event: IncomingEvent) => {
  const normalized = normalize(event);
  kafkaProducer.send({ topic: "sos-events", messages: [{ value: JSON.stringify(normalized) }] });
};
```

## 運用メモ

- すべての重大イベントは、`normalized.region` が `coverageZones` に含まれると `notifyOps` を発火する。
- `LineOfSightService` は各 reconcilation ごとにリソース可視性を再計算する。
- フローは分散トレーシング（OpenTelemetry）で監視され、レイテンシを 2 秒未満に保つ。

## プロジェクトとの接続

前の post では各ノードを正当化する業務ルールを扱いました。この post では [SOS Location](/projects/sos-location/) を支える具体的メカニズムと図を説明しています。

body_ja_jp = '''
## 実際のコンテキスト

SOS Locationには2つの非常に異なるアクセスパターンがある：(1) 緊急時のアクティブな寄付キャンペーンは数百の同時寄付を受け取る——`campanhas_doacao`テーブルの`total_arrecadado`カラムはアトミックにインクリメントされる必要がある；(2) 救助コーディネーターが`OperacaoDeResgate`データ（名前、カバーエリア、割り当てリソース）を編集するのは稀で、並行編集もほぼない。両方に同じロック機構を使うとデッドロックまたはデータ損失が発生する。

## 具体的な問題

ペトロポリスの洪水のメディア報道後、寄付キャンペーンが30秒間に340件の同時リクエストを受け取った。最初の実装はロックなしで`UPDATE campanhas SET total_arrecadado = total_arrecadado + @valor`を実行した——古典的な競合状態でR$47,000分の`total_arrecadado`が過少報告（8件の更新が失われた）。救助作戦では逆の問題：不必要な悲観ロックが2人のコーディネーターが同じ作戦の異なるフィールドを編集する際にログに`deadlock detected`を引き起こした。

## 技術的決定

`CampanhaDoacao.TotalArrecadado`に**悲観ロック**：`SELECT FOR UPDATE`で残高更新のシリアライズを保証——競合が予想されトランザクションが短い（< 5ms）ためロックコストは許容可能。`OperacaoDeResgate`に**楽観ロック**：行バージョンとしてPostgreSQLの`xmin`カラムを使用——保存時に、読み取り以降に`xmin`が変わっていないかを確認；変わっていれば409でリロード指示を返す。読み取り時にロックなし、書き込み時のみ競合検出。

## 実装

```csharp
// 悲観ロック — 寄付キャンペーン（高並行性）
public async Task IncrementarTotalAsync(Guid campanhaId, int valorCentavos, CancellationToken ct)
{
    await using var tx = await _db.BeginTransactionAsync(ct);

    var campanha = await _db.QueryFirstAsync<CampanhaDoacao>(
        "SELECT id, total_arrecadado FROM campanhas_doacao WHERE id = @id FOR UPDATE",
        new { id = campanhaId });

    await _db.ExecuteAsync(
        "UPDATE campanhas_doacao SET total_arrecadado = @novo, atualizado_em = now() WHERE id = @id",
        new { novo = campanha.TotalArrecadado + valorCentavos, id = campanhaId });

    await tx.CommitAsync(ct);
}
```

```csharp
// 楽観ロック — 救助作戦（低書き込み並行性）
public async Task AtualizarOperacaoAsync(AtualizarOperacaoCommand cmd, CancellationToken ct)
{
    var (operacao, xmin) = await _db.QueryFirstAsync<(OperacaoDeResgate, uint)>("""
        SELECT o.*, xmin::text::bigint AS xmin FROM operacoes_resgate o
        WHERE id = @id AND tenant_id = @tenantId
        """, new { cmd.Id, cmd.TenantId });

    operacao.AtualizarRecursos(cmd.Recursos);

    var rowsAffected = await _db.ExecuteAsync("""
        UPDATE operacoes_resgate SET nome = @nome, recursos = @recursos, atualizado_em = now()
        WHERE id = @id AND xmin = @xmin::bigint::xid
        """, new { cmd.Nome, cmd.Recursos, cmd.Id, xmin });

    if (rowsAffected == 0)
        throw new ConcurrencyConflictException(
            $"作戦{cmd.Id}は別のユーザーによって変更されました。再読み込みして再試行してください。");
}
```

## 具体的な例

ペトロポリスのキャンペーン：340件の同時リクエストが`total_arrecadado`をインクリメント。`FOR UPDATE`あり：PostgreSQLが更新をキューでシリアライズ——各トランザクションが前のものを< 3ms待ち、更新の損失ゼロ、全コミット後に正確な`total_arrecadado`。`FOR UPDATE`なし（以前のバージョン）：8トランザクションが同じベース値を読み取り、メモリで`+`を行い書き込み——8インクリメントが1として計算。`OperacaoDeResgate`：2人のコーディネーターが同時に異なるフィールドを編集。楽観ロックあり：2番目に保存した方が409を受け取り、リロードすると最初のコーディネーターのデータが既に含まれている——競合検出、データのサイレントな損失なし。

## 成功基準

アクティブキャンペーンの`total_arrecadado`での競合状態ゼロ——`SELECT SUM(valor_centavos) FROM doacoes WHERE campanha_id = X` vs `total_arrecadado`で検証可能。`ConcurrencyConflictException`はサイレントにされない——常に409としてユーザーへの指示メッセージと共にフロントエンドに伝播。

## SOS Locationとの関係

緊急時の寄付キャンペーンは極端で予測可能なトラフィックスパイクを持つ。`total_arrecadado`の精度は公開されている——寄付者がリアルタイムで合計を見る。不正確な（低い）値は、キャンペーンがまだ資金を必要としている時に追加の寄付を抑制する可能性がある。
'''

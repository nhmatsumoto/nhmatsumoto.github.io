body = '''
Os **padrões estruturais** do GoF tratam de **composição**: como montar objetos e classes em estruturas maiores mantendo tudo flexível. No .NET, você já os usa sem perceber - o pipeline de middleware é um Decorator, o lazy-loading do EF Core é um Proxy, qualquer wrapper de SDK de terceiros é um Adapter. Vamos implementar os quatro mais importantes de forma idiomática.

## Adapter: traduzir interfaces incompatíveis

O `Adapter` faz duas interfaces que não se conhecem trabalharem juntas. O uso mais valioso no mundo real é o **Anti-Corruption Layer (ACL)**: envolver um SDK ou API externa para que a linguagem dela não vaze para o seu domínio.

```csharp
// O domínio fala SUA língua
public interface INotificationSender
{
    Task SendAsync(Notification n, CancellationToken ct);
}

// O SDK de terceiros fala OUTRA língua
public sealed class TwilioAdapter(TwilioClient client) : INotificationSender
{
    public Task SendAsync(Notification n, CancellationToken ct) =>
        client.Messages.CreateAsync(new(             // tradução acontece aqui
            to: n.Recipient.Phone,
            from: "+550000",
            body: n.Body));
}
```

O ganho: o dia em que a Twilio for trocada pela Vonage, só o adapter muda. O domínio nunca soube que a Twilio existia. Esse é o padrão que protege seu núcleo de dependências instáveis.

## Decorator: adicionar comportamento por camadas

O `Decorator` adiciona responsabilidades a um objeto **sem alterar sua classe**, envolvendo-o em outro objeto da mesma interface. É a alma das *cross-cutting concerns*: cache, logging, retry, métricas.

```csharp
public sealed class CachingProductRepository(
    IProductRepository inner, IMemoryCache cache) : IProductRepository
{
    public async Task<Product?> GetAsync(int id)
        => cache.TryGetValue(id, out Product? p)
            ? p
            : cache.Set(id, await inner.GetAsync(id));   // delega ao "inner"
}
```

No .NET, registrar decorators à mão é verboso. A biblioteca **Scrutor** resolve com uma linha, e a **ordem importa** (o último registrado é o mais externo):

```csharp
services.AddScoped<IProductRepository, SqlProductRepository>();
services.Decorate<IProductRepository, CachingProductRepository>();
services.Decorate<IProductRepository, LoggingProductRepository>();
// chamada -> Logging -> Caching -> Sql
```

E você já usa Decorator todo dia: **cada `app.Use(...)` no ASP.NET Core** envolve o próximo no pipeline. Middleware *é* o padrão Decorator aplicado ao request.

## Composite: tratar árvore e folha igual

O `Composite` permite que objetos individuais e composições de objetos sejam tratados **uniformemente**. Sempre que há uma estrutura em árvore - pastas e arquivos, menus e submenus, grupos e usuários - onde a operação deve recursar de forma transparente.

```csharp
public interface IFileSystemNode { long SizeBytes(); }

public sealed record FileNode(long Size) : IFileSystemNode
{
    public long SizeBytes() => Size;                 // folha
}

public sealed class FolderNode(IReadOnlyList<IFileSystemNode> children) : IFileSystemNode
{
    public long SizeBytes() => children.Sum(c => c.SizeBytes());  // recursa
}
```

O cliente chama `SizeBytes()` sem saber se está falando com um arquivo ou uma pasta inteira. A recursão fica encapsulada na estrutura, não espalhada no chamador.

## Proxy: um substituto que controla o acesso

O `Proxy` é um objeto que fica **no lugar de** outro, controlando o acesso a ele. Os três sabores clássicos:

- **Virtual proxy** (lazy-loading): adia a criação cara até o primeiro uso - é o que o EF Core faz com navegações `virtual`.
- **Protection proxy**: checa autorização antes de delegar.
- **Remote proxy**: representa um objeto que vive em outro processo (a base do gRPC/HttpClient gerado).

```csharp
public sealed class AuthorizationProxy(IReportService inner, IUserContext user)
    : IReportService
{
    public Task<Report> GenerateAsync(ReportRequest r)
    {
        if (!user.HasPermission("reports:read"))
            throw new ForbiddenException();          // controla o acesso
        return inner.GenerateAsync(r);               // só então delega
    }
}
```

Note a semelhança com o Decorator: ambos envolvem e implementam a mesma interface. A diferença é de **intenção** - o Decorator *adiciona comportamento*; o Proxy *controla o acesso* ao objeto real.

## Comparativo

| Padrão | Intenção | Onde aparece no .NET | Sinal de uso |
| :--- | :--- | :--- | :--- |
| **Adapter** | Traduzir interfaces | Wrappers de SDK, ACL | "Preciso usar X com a interface Y" |
| **Decorator** | Adicionar comportamento | Middleware, Scrutor `.Decorate` | Cache/log/retry sem tocar no concreto |
| **Composite** | Árvore tratada como folha | Menus, file systems, regras aninhadas | Recursão transparente sobre hierarquia |
| **Proxy** | Controlar acesso | Lazy-loading EF, gRPC, autorização | Interceptar antes/depois do objeto real |
| **Facade** | Simplificar subsistema | `Application Services`, SDKs próprios | Esconder complexidade interna |

## Conclusão

Os padrões estruturais são, no fundo, variações sobre o mesmo verbo: **envolver**. Adapter envolve para traduzir, Decorator para enriquecer, Proxy para controlar, Composite para uniformizar. A força disso no .NET vem da combinação com o DI - você compõe o comportamento *na configuração*, não no código de negócio. Quando uma feature nova puder ser uma nova camada em vez de uma edição na classe existente, você está aplicando bem o estrutural: comportamento que cresce por composição, sem cicatrizes no núcleo.
'''
body_en_us = '''
The GoF **structural patterns** are about **composition**: how to assemble objects and classes into larger structures while keeping everything flexible. In .NET you already use them without noticing - the middleware pipeline is a Decorator, EF Core's lazy-loading is a Proxy, any third-party SDK wrapper is an Adapter. Let's implement the four most important ones idiomatically.

## Adapter: translating incompatible interfaces

The `Adapter` makes two interfaces that don't know each other work together. The most valuable real-world use is the **Anti-Corruption Layer (ACL)**: wrapping an external SDK or API so its language doesn't leak into your domain.

```csharp
// The domain speaks YOUR language
public interface INotificationSender
{
    Task SendAsync(Notification n, CancellationToken ct);
}

// The third-party SDK speaks ANOTHER language
public sealed class TwilioAdapter(TwilioClient client) : INotificationSender
{
    public Task SendAsync(Notification n, CancellationToken ct) =>
        client.Messages.CreateAsync(new(             // translation happens here
            to: n.Recipient.Phone,
            from: "+550000",
            body: n.Body));
}
```

The payoff: the day Twilio is swapped for Vonage, only the adapter changes. The domain never knew Twilio existed. This is the pattern that protects your core from unstable dependencies.

## Decorator: adding behavior in layers

The `Decorator` adds responsibilities to an object **without changing its class**, by wrapping it in another object of the same interface. It's the heart of cross-cutting concerns: cache, logging, retry, metrics.

```csharp
public sealed class CachingProductRepository(
    IProductRepository inner, IMemoryCache cache) : IProductRepository
{
    public async Task<Product?> GetAsync(int id)
        => cache.TryGetValue(id, out Product? p)
            ? p
            : cache.Set(id, await inner.GetAsync(id));   // delegates to "inner"
}
```

In .NET, registering decorators by hand is verbose. The **Scrutor** library solves it in one line, and the **order matters** (the last registered is the outermost):

```csharp
services.AddScoped<IProductRepository, SqlProductRepository>();
services.Decorate<IProductRepository, CachingProductRepository>();
services.Decorate<IProductRepository, LoggingProductRepository>();
// call -> Logging -> Caching -> Sql
```

And you already use Decorator every day: **each `app.Use(...)` in ASP.NET Core** wraps the next one in the pipeline. Middleware *is* the Decorator pattern applied to the request.

## Composite: treating tree and leaf alike

The `Composite` lets individual objects and compositions of objects be treated **uniformly**. Whenever there's a tree structure - folders and files, menus and submenus, groups and users - where the operation should recurse transparently.

```csharp
public interface IFileSystemNode { long SizeBytes(); }

public sealed record FileNode(long Size) : IFileSystemNode
{
    public long SizeBytes() => Size;                 // leaf
}

public sealed class FolderNode(IReadOnlyList<IFileSystemNode> children) : IFileSystemNode
{
    public long SizeBytes() => children.Sum(c => c.SizeBytes());  // recurses
}
```

The client calls `SizeBytes()` without knowing whether it's talking to a file or an entire folder. The recursion is encapsulated in the structure, not scattered across the caller.

## Proxy: a stand-in that controls access

The `Proxy` is an object that stands **in place of** another, controlling access to it. The three classic flavors:

- **Virtual proxy** (lazy-loading): defers expensive creation until first use - that's what EF Core does with `virtual` navigations.
- **Protection proxy**: checks authorization before delegating.
- **Remote proxy**: represents an object living in another process (the basis of generated gRPC/HttpClient).

```csharp
public sealed class AuthorizationProxy(IReportService inner, IUserContext user)
    : IReportService
{
    public Task<Report> GenerateAsync(ReportRequest r)
    {
        if (!user.HasPermission("reports:read"))
            throw new ForbiddenException();          // controls access
        return inner.GenerateAsync(r);               // only then delegates
    }
}
```

Note the resemblance to the Decorator: both wrap and implement the same interface. The difference is **intent** - the Decorator *adds behavior*; the Proxy *controls access* to the real object.

## Comparison

| Pattern | Intent | Where it appears in .NET | Usage signal |
| :--- | :--- | :--- | :--- |
| **Adapter** | Translate interfaces | SDK wrappers, ACL | "I need to use X through interface Y" |
| **Decorator** | Add behavior | Middleware, Scrutor `.Decorate` | Cache/log/retry without touching the concrete |
| **Composite** | Tree treated as a leaf | Menus, file systems, nested rules | Transparent recursion over a hierarchy |
| **Proxy** | Control access | EF lazy-loading, gRPC, authorization | Intercept before/after the real object |
| **Facade** | Simplify a subsystem | Application Services, your own SDKs | Hide internal complexity |

## Conclusion

The structural patterns are, at heart, variations on the same verb: **to wrap**. Adapter wraps to translate, Decorator to enrich, Proxy to control, Composite to unify. Their power in .NET comes from combining with DI - you compose behavior *in configuration*, not in business code. When a new feature can be a new layer instead of an edit to the existing class, you're applying structure well: behavior that grows by composition, without scars on the core.
'''
body_ja_jp = '''
GoF の **構造パターン** は **合成** についてです。すべてを柔軟に保ちつつ、オブジェクトとクラスをより大きな構造へ組み立てる方法です。.NET では気づかぬうちに使っています ── ミドルウェアのパイプラインは Decorator、EF Core の遅延読み込みは Proxy、サードパーティ SDK のラッパーはすべて Adapter。最も重要な 4 つをイディオム的に実装しましょう。

## Adapter：互換性のないインターフェースを翻訳する

`Adapter` は、互いを知らない 2 つのインターフェースを協働させます。現実で最も価値ある用途は **腐敗防止層（ACL）** です。外部 SDK や API を包み、その言語が自分のドメインへ漏れ出さないようにします。

```csharp
// ドメインは「自分の」言語を話す
public interface INotificationSender
{
    Task SendAsync(Notification n, CancellationToken ct);
}

// サードパーティ SDK は「別の」言語を話す
public sealed class TwilioAdapter(TwilioClient client) : INotificationSender
{
    public Task SendAsync(Notification n, CancellationToken ct) =>
        client.Messages.CreateAsync(new(             // 翻訳はここで起きる
            to: n.Recipient.Phone,
            from: "+550000",
            body: n.Body));
}
```

見返り。Twilio が Vonage に置き換わる日、変わるのは adapter だけ。ドメインは Twilio の存在を知りませんでした。これは、不安定な依存からあなたの中核を守るパターンです。

## Decorator：振る舞いを層で足す

`Decorator` は、同じインターフェースの別オブジェクトで包むことで、**クラスを変えずに** オブジェクトへ責務を加えます。横断的関心 ── キャッシュ、ロギング、リトライ、メトリクス ── の核心です。

```csharp
public sealed class CachingProductRepository(
    IProductRepository inner, IMemoryCache cache) : IProductRepository
{
    public async Task<Product?> GetAsync(int id)
        => cache.TryGetValue(id, out Product? p)
            ? p
            : cache.Set(id, await inner.GetAsync(id));   // "inner" に委譲
}
```

.NET では decorator の手動登録は冗長です。**Scrutor** ライブラリが一行で解決し、**順序が重要** です（最後に登録したものが最も外側）。

```csharp
services.AddScoped<IProductRepository, SqlProductRepository>();
services.Decorate<IProductRepository, CachingProductRepository>();
services.Decorate<IProductRepository, LoggingProductRepository>();
// 呼び出し -> Logging -> Caching -> Sql
```

そしてあなたは毎日 Decorator を使っています。**ASP.NET Core の各 `app.Use(...)`** は、パイプラインの次を包みます。ミドルウェアは、リクエストに適用された Decorator パターン *そのもの* です。

## Composite：木と葉を同じに扱う

`Composite` は、個々のオブジェクトとオブジェクトの合成を **一様に** 扱えるようにします。木構造 ── フォルダとファイル、メニューとサブメニュー、グループとユーザー ── があり、操作が透過的に再帰すべきときにいつでも。

```csharp
public interface IFileSystemNode { long SizeBytes(); }

public sealed record FileNode(long Size) : IFileSystemNode
{
    public long SizeBytes() => Size;                 // 葉
}

public sealed class FolderNode(IReadOnlyList<IFileSystemNode> children) : IFileSystemNode
{
    public long SizeBytes() => children.Sum(c => c.SizeBytes());  // 再帰
}
```

クライアントは、ファイルと話しているのかフォルダ全体と話しているのかを知らずに `SizeBytes()` を呼びます。再帰は呼び出し側に散らばらず、構造に閉じ込められます。

## Proxy：アクセスを制御する代理人

`Proxy` は、別オブジェクトの **代わりに** 立ち、そのアクセスを制御するオブジェクトです。古典的な 3 つの種類。

- **仮想プロキシ**（遅延読み込み）: 高価な生成を初回使用まで遅らせる ── EF Core が `virtual` ナビゲーションで行うこと。
- **保護プロキシ**: 委譲の前に認可を確認する。
- **リモートプロキシ**: 別プロセスに存在するオブジェクトを表す（生成された gRPC/HttpClient の基礎）。

```csharp
public sealed class AuthorizationProxy(IReportService inner, IUserContext user)
    : IReportService
{
    public Task<Report> GenerateAsync(ReportRequest r)
    {
        if (!user.HasPermission("reports:read"))
            throw new ForbiddenException();          // アクセスを制御
        return inner.GenerateAsync(r);               // その後にのみ委譲
    }
}
```

Decorator との類似に注目。どちらも包み、同じインターフェースを実装します。違いは **意図** です ── Decorator は *振る舞いを加え*、Proxy は実オブジェクトへの *アクセスを制御* します。

## 比較

| パターン | 意図 | .NET での現れ | 使用のサイン |
| :--- | :--- | :--- | :--- |
| **Adapter** | インターフェースの翻訳 | SDK ラッパー、ACL | 「X をインターフェース Y 経由で使いたい」 |
| **Decorator** | 振る舞いの追加 | ミドルウェア、Scrutor `.Decorate` | 具象に触れずにキャッシュ/ログ/リトライ |
| **Composite** | 木を葉として扱う | メニュー、ファイルシステム、入れ子規則 | 階層への透過的な再帰 |
| **Proxy** | アクセスの制御 | EF 遅延読み込み、gRPC、認可 | 実オブジェクトの前後で割り込む |
| **Facade** | サブシステムの簡素化 | Application Service、自作 SDK | 内部の複雑さを隠す |

## 結論

構造パターンは、根本的に同じ動詞 ── **包む** ── の変奏です。Adapter は翻訳のために、Decorator は豊かにするために、Proxy は制御するために、Composite は一様化するために包みます。.NET でのその力は DI との組み合わせから来ます ── 振る舞いをビジネスコードではなく *構成で* 合成するのです。新機能が既存クラスの編集ではなく新しい層になりうるとき、あなたは構造をうまく適用しています。中核に傷をつけず、合成によって育つ振る舞いです。

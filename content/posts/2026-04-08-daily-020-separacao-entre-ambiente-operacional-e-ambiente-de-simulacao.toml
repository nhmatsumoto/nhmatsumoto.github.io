## 具体的な例

ジョインヴィル（SC）での民間防衛訓練--2026-04-10、14:00から17:00。`SOS_CONTEXT=simulation`で実行中のステージングクラスター。コーディネーターがレベル3のテストアラートを12回、レベル8のアラートを2回実行。14回すべてのディスパッチがリアルタイムスタンプとともに`simulacao_log`に記録された。住民へのプッシュ通知ゼロ。`simulacao_log`テーブルから直接30秒で訓練後レポートを生成。

## 成功基準

シミュレーションコンテキスト中にエンドユーザーへのプッシュ通知またはSMSがゼロ--Firebaseログとの`simulacao_log`の毎月監査で確認。`SOS_CONTEXT`が設定されていないか無効な値がある場合はスタートアップが明示的に失敗する。アラートモジュールの統合テストの100%が両方の実装で合格する。

## SOS Locationとの関係

運用/シミュレーション分離は安全不変量だ：訓練中に実際の通知を送る緊急アラートシステムは住民と市政府の信頼を失う。`IAlertaDispatcher`インターフェースはこの不変量を構造的に違反不可能にするメカニズムだ--チームの慣習でも条件フラグでもなく、コンパイル境界として。

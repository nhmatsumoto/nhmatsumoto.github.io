## 実際のコンテキスト

SOS Locationは2つの異なるコンテキストで使用される：実際の緊急作戦と民間防衛訓練/演習。訓練中、コーディネーターはマップでアラートを見て、避難フローをテストし、決定を記録する必要がある--しかし監視ゾーンの80,000人の住民にリアルなプッシュ通知を送ることなく。システムはアラートディスパッチレイヤーを除いて、両方のコンテキストで同一に動作する必要がある。

## 具体的な問題

最初のバージョンでは、分離はコール全体のチェーンを通じて渡されるブールフラグ`isSimulacao`で行われていた：`EmitirAlertaCommand`、`EmitirAlertaHandler`、`AlertaService`、`NotificacaoService`。すべてのメソッドが`if (isSimulacao) { ... }`をチェックしていた。結果：14箇所に散らばったチェックポイント、条件が逆になった2つの本番バグ、そして訓練が23:17にジョインヴィル市の約3,200人の住民にプッシュ通知を送った実際のインシデント。

## 技術的決定

環境変数`SOS_CONTEXT=operational|simulation`を通じてスタートアップ時に選択される、2つの相互に排他的な実装を持つ`IAlertaDispatcher`インターフェース。シミュレーションコンテキストでは、すべてのディスパッチが実際のアラートと同じフィールドで`simulacao_log`テーブルに書き込まれる--訓練後の監査に有用。ドメインまたはアプリケーションレイヤーに条件フラグなし。

## 実装

```csharp

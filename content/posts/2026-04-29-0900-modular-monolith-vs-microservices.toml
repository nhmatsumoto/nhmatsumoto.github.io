body = '''
## Problema
Microservices cedo demais geram custo operacional alto.

## Regra
Comece com monólito modular bem definido.

## Estrutura
- Boundaries claros (DDD)
- Camadas isoladas
- Comunicação interna explícita

## Evolução
Extrair serviços apenas quando:
- Escala exige
- Times independentes
- Deploy isolado necessário

## Insight
Microservices resolvem problemas organizacionais, não técnicos.

## 実際のコンテキスト

ブラジルは約7,500kmの大西洋海岸線を持つ。主な津波リスクはカスカディア沈み込み帯（コスタリカ/コロンビア）と中央大西洋海嶺から来る。これらの地域でのM7.5+地震に対して、ブラジル北東部海岸への波の到達時間は8〜12時間、南東部海岸は10〜14時間。SOS Locationは地震イベント検出後5分以内に津波浸水シミュレーションを生成する必要がある——3時間後ではなく。

## 具体的な問題

完全なMOST（Method of Splitting Tsunami）物理モデルは正確だが遅い：ブラジル海岸への各海洋波伝播シミュレーションはHPCクラスターで2〜4時間かかる。地震イベント後にリアルタイムで実行することは不可能だ。ナイーブな代替案——専用HPCサーバーの維持——はSOS Locationが同時に2〜3のシミュレーションの容量を持つために月R$15,000のコストがかかる。

## 技術的決定

事前計算されたシナリオライブラリ：ブラジルの20の最も可能性の高い地震源×3つの規模（M7.0、M7.5、M8.0）×4つの震源深さをカバーする240のシナリオ。各シナリオは結果として得られる最大浸水グリッド（沿岸点ごとの波高）を格納する。イベント発生時、システムは（震央距離、規模）で最も類似したシナリオを見つけて波高を線形スケールする。

## 実装

```csharp
public sealed class TsunamiScenarioSelector
{
    public async Task<(TsunamiScenario Scenario, double ScaleFactor)> SelectAsync(
        SeismicEvent evt, CancellationToken ct)
    {
        const string sql = """
            SELECT scenario_id, epicenter_lat, epicenter_lon, magnitude, depth_km,
                   inundation_grid_path,
                   0.6 * ST_Distance(
                       ST_MakePoint(epicenter_lon, epicenter_lat)::geography,
                       ST_MakePoint(@lon, @lat)::geography
                   ) / 1000.0
                   + 0.4 * ABS(magnitude - @magnitude) * 100000 AS score
            FROM   tsunami_scenarios
            ORDER  BY score
            LIMIT  1;
            """;

        var best = await _db.QuerySingleAsync<TsunamiScenario>(
            sql, new { lat = evt.Latitude, lon = evt.Longitude, magnitude = evt.Magnitude });

        double deltaMagnitude = evt.Magnitude - best.Magnitude;
        double scaleFactor    = Math.Pow(10, 1.5 * deltaMagnitude);

        return (best, scaleFactor);
    }
}
```

## 具体的な例

検出されたイベント：M7.8地震（エクアドル沿岸 -3.2°、-80.5°）、深さ25km。システムが最も近いシナリオを選択：M7.5（-2.8°、-79.8°）、30km深さ。スケールファクター：$10^{1.5 \times 0.3} = 2.82$。プロジェクションは340msで生成。フォルタレザでの予測波高：1.8m × 2.82 = 5.1m。海岸から1km以内の標高6m以下の沿岸ゾーンに自動アラートが発令される。

## 成功基準

地震イベント検出後のシナリオ選択+浸水プロジェクション時間 < 500ms。10の歴史的キャリブレーションイベントに対する完全なMOSTシミュレーションと比較した平均波高プロジェクション誤差 < 25%。優先沿岸自治体の100%がライブラリ内の少なくとも3つの地震シナリオでカバーされている。

## SOS Locationとの関係

津波に対して、警告時間は最も希少なリソースだ。シミュレーションを発行するまでの5分と3時間の差は、沿岸ゾーンの避難が波の到達前に行われるか後に行われるかを決定する可能性がある。事前計算されたシナリオライブラリは、絶対的な精度を運用応答速度とトレードオフする意図的な選択だ。

## 実際のコンテキスト

緊急アプリケーションでは、マップは機能ではなくインターフェースだ。SOS Location v1.0は標準レイアウトを使っていた：上部にナビバー（64px）、左に280pxサイドバー、残りのスペースにマップ。テスト中の民間防衛コーディネーターからのフィードバック：「ズーム14で道路を識別するにはマップが小さすぎる」、「サイドバーがちょうど見たいエリアを隠している」。10インチタブレット（フィールドで一般的）では、マップは視覚エリアの40%未満しか占めていなかった。

## 具体的な問題

map-firstレイアウト（マップが100%ビューポート）への切り替えで2つの問題が発生した：(1) 情報パネル（リスクゾーンリスト、`PessoaDesaparecida`詳細、レイヤーコントロール）はマップを離れずにアクセスできる必要がある——オーバーレイソリューションは`z-index: 700`のLeafletネイティブポップアップとのz-index競合を作る；(2) Leafletはコンテナ内に絶対配置でネイティブコントロール（ズーム、アトリビューション）を追加する——同じコーナーのフローティングパネルがズームコントロールに重なる。

## 技術的決定

100%ビューポートをカバーする`position: fixed`マップ。z-index 800+（Leafletポップアップの上）の`position: fixed`フローティングパネル。ネイティブズームコントロールを無効化（`zoomControl: false`）し、フローティングパネル内のカスタムボタンに置き換える。Leafletアトリビューションをパネルとの競合を避けるためCSSで再配置。z-indexシステムを衝突を防ぐために`Z_INDEX`定数に文書化。

## 実装

```tsx
export function MapLayout({ children }: { children: React.ReactNode }) {
  return (
    <div style={{ position: 'fixed', inset: 0, overflow: 'hidden' }}>
      <SosMap />
      {children}
    </div>
  );
}
```

```ts
export const Z_INDEX = {
  mapBase:        0,
  mapOverlays:    400,
  leafletPopups:  700,
  floatingPanels: 800,
  modal:          900,
  toast:          1000,
} as const;
```

```tsx
export function LayerControlPanel() {
  return (
    <div style={{
      position: 'fixed', top: '16px', right: '16px',
      zIndex:   Z_INDEX.floatingPanels,
      background: 'rgba(255, 255, 255, 0.92)',
      backdropFilter: 'blur(4px)',
      borderRadius: '8px', padding: '12px',
    }}>
      <LayerControls />
      <ZoomControls />
    </div>
  );
}
```

## 具体的な例

ジョインヴィルの訓練中のコーディネーターからのリファクタリング後のフィードバック：「今は地図で街全体が見える」。マップの有効エリア比較：旧レイアウト（ナビバー + サイドバー）→ 10インチタブレットでビューポートの52%。map-firstレイアウト → ビューポートの100%。コントロールパネルは右上コーナーに200×280pxを占有——ビューポートエリアの4.3%、マップ背景に透明。

## 成功基準

幅320px以上の任意の解像度でマップが視覚エリアの95%以上を占有する。フローティングパネルとLeafletポップアップ間のz-index競合なし（DOM検査で確認）。すべてのフローティングパネルがアクセシビリティのためにキーボードアクセス可能（Tabナビゲーション）。

## SOS Locationとの関係

map-firstレイアウトは美学ではなく——運用上の人間工学だ。マップの追加ピクセルごとに、コーディネーターが意思決定に使う空間的コンテキストだ。コンテキストフローティングパネルを優先して従来のナビゲーション（ナビバー、固定サイドバー）を非表示にするトレードオフは実際のユーザーで検証済みで、ユーザビリティテストで測定された最大のプラスの影響を持つUX変更の1つだ。
'''

body_en_us = '''
Every language offers "a list" and almost every beginner uses it as if it were one single thing. But underneath live two structures with opposite philosophies: the **array**, a contiguous block of memory, and the **linked list**, a chain of scattered nodes. They hold the same collection of values and pick opposite costs. Understanding each one's memory layout explains everything that follows: why one is fast to access and the other fast to insert, and why sorting them calls for different algorithms.

## Array: a contiguous block

An array reserves a single, sequential block of memory. Since every element is the same size and sits side by side, the address of any position is plain arithmetic: `base + index * size`. That is why reading `v[10000]` costs the same as reading `v[0]`: constant time, **O(1)**.

```mermaid
graph LR
    subgraph "Array in memory (contiguous addresses)"
        A0["v[0]<br/>10"] --- A1["v[1]<br/>20"] --- A2["v[2]<br/>30"] --- A3["v[3]<br/>40"]
    end
```

That same layout is the weakness. To insert a value in the middle there is no gap between slots: you must push every following element one position forward. Inserting or removing at the front is the worst case, **O(n)**, because it touches the whole collection.

```mermaid
graph TD
    A["Insert 99 at position 1"] --> B["Shift v[1], v[2], v[3] right"]
    B --> C["Write 99 into v[1]"]
    C --> D["Cost proportional to size: O(n)"]
```

### The dynamic array

Python's "list", C#'s `List<T>` and Java's `ArrayList` are in fact **dynamic arrays**. They wrap a fixed array and, when it fills up, allocate a new larger one (usually double) and copy everything over. That copy is O(n), but it happens rarely, so the cost dilutes: we say append is **amortized O(1)**. You get the array's index access with the convenience of growing on demand.

## Linked list: a chain of nodes

The linked list gives up contiguity. Each element becomes a **node** holding the value and a pointer to the next node. Nodes can live anywhere in memory; what keeps the order is the chain of pointers.

```mermaid
graph LR
    H["head"] --> N1["10 | next"]
    N1 --> N2["20 | next"]
    N2 --> N3["30 | next"]
    N3 --> NULL["null"]
```

This flips the array's costs. There is no address formula, so reaching the tenth element means following the chain node by node: index access is **O(n)**. In return, inserting a value after a known node is just rewiring two pointers, **O(1)**, with nothing shifted.

```mermaid
graph TD
    subgraph Before
        A["10 | next"] --> B["30 | next"]
    end
    subgraph After
        C["10 | next"] --> D["20 | next"] --> E["30 | next"]
    end
```

## The table that settles the decision

| Operation | Dynamic array | Linked list |
| --- | --- | --- |
| Index access | O(1) | O(n) |
| Insert/remove at end | amortized O(1) | O(1) |
| Insert/remove at front | O(n) | O(1) |
| Insert/remove in middle | O(n) | O(1) with the node, O(n) to find it |
| Memory per element | value only | value + pointer |
| Cache locality | high | low |

The "cache locality" row fools many people. In theory the list wins at insertion, but in practice walking an array is so much friendlier to the CPU cache that, for many real workloads, the dynamic array wins even where Big O suggested the list. Measuring always beats guessing.

## Manipulating and traversing

The most common operation is traversal. In the array a loop with an index is enough. In the list you follow the `next` pointer until you hit `null`.

```python
# dynamic array: traverse by index
for i in range(len(v)):
    print(v[i])

# linked list: follow the chain of nodes
node = head
while node is not None:
    print(node.value)
    node = node.next
```

Reversing the two shows the difference in philosophy. Reversing an array swaps pairs of ends toward the center, in place. Reversing a linked list flips each `next` pointer backwards, one node at a time.

## Sorting depends on the structure

Sorting looks like one problem, but the structure picks the algorithm. Classic **quicksort** shines on arrays because it relies on index access to partition in place, at O(1) per access. On a linked list that access is O(n) and the algorithm degrades.

**Merge sort**, by contrast, never accesses by index: it splits the sequence into halves and merges sorted sublists, always walking from the start. That makes it the natural choice for linked lists, and it is stable on top of that.

```mermaid
graph TD
    A["[38, 27, 43, 3, 9, 82, 10]"] --> B["[38, 27, 43]"]
    A --> C["[3, 9, 82, 10]"]
    B --> D["[38]"]
    B --> E["[27, 43]"]
    C --> F["[3, 9]"]
    C --> G["[82, 10]"]
    D --> H["merge and sort on the way up"]
    E --> H
    F --> H
    G --> H
    H --> I["[3, 9, 10, 27, 38, 43, 82]"]
```

In practice you rarely write your own sort: `Array.Sort`, `list.sort()` and `std::sort` use finely tuned hybrids (introsort, timsort). But knowing why each was chosen for each structure is what separates using the library from understanding it.

## Conclusion

Array and linked list are not "better" and "worse": they are two opposite answers to the same question about where to spend time. The array buys instant index access at the price of expensive insertions; the list buys cheap insertions at the price of slow lookup and extra pointers. Everything else, from the cost of traversal to the ideal sorting algorithm, follows from that one fact: how the elements are laid out in memory. Choosing well starts with a simple question, which operation does your code perform most often.
'''
body_ja_jp = '''
どの言語にも「リスト」があり、ほとんどの初心者はそれを一つのものとして使う。しかしその下には、正反対の哲学を持つ二つの構造が存在する。連続したメモリブロックである **配列** と、散らばったノードの鎖である **連結リスト** だ。両者は同じ値の集まりを保持しながら、正反対のコストを選ぶ。それぞれのメモリ上のレイアウトを理解すれば、その後のすべてが説明できる。なぜ一方がアクセスに速く、もう一方が挿入に速いのか、そしてなぜ整列に異なるアルゴリズムが必要なのか。

## 配列：連続したブロック

配列はメモリ上に一つの連続したブロックを確保する。すべての要素が同じサイズで隣り合っているため、任意の位置のアドレスは単純な計算で求まる。`base + index * size` だ。だから `v[10000]` の読み出しは `v[0]` と同じコスト、すなわち定数時間 **O(1)** になる。

```mermaid
graph LR
    subgraph "メモリ上の配列（連続アドレス）"
        A0["v[0]<br/>10"] --- A1["v[1]<br/>20"] --- A2["v[2]<br/>30"] --- A3["v[3]<br/>40"]
    end
```

同じレイアウトが弱点でもある。途中に値を挿入するには、スロットの間に隙間がないため、後続のすべての要素を一つ前へ押し出す必要がある。先頭への挿入・削除は最悪のケース **O(n)** で、コレクション全体に触れることになる。

```mermaid
graph TD
    A["位置 1 に 99 を挿入"] --> B["v[1], v[2], v[3] を右へずらす"]
    B --> C["v[1] に 99 を書き込む"]
    C --> D["サイズに比例するコスト：O(n)"]
```

### 動的配列

Python の「リスト」、C# の `List<T>`、Java の `ArrayList` は、実は **動的配列** である。内部に固定サイズの配列を持ち、いっぱいになると新しいより大きな配列（通常は倍）を確保してすべてをコピーする。このコピーは O(n) だが、めったに起きないのでコストは薄まる。これを append は **償却 O(1)** と呼ぶ。配列のインデックスアクセスを、必要に応じて伸びる利便性とともに得られるのだ。

## 連結リスト：ノードの鎖

連結リストは連続性を捨てる。各要素は値と次のノードへのポインタを持つ **ノード** になる。ノードはメモリのどこにあってもよく、順序を保つのはポインタの鎖だ。

```mermaid
graph LR
    H["head"] --> N1["10 | next"]
    N1 --> N2["20 | next"]
    N2 --> N3["30 | next"]
    N3 --> NULL["null"]
```

これは配列のコストを逆転させる。アドレスの公式がないため、10 番目の要素に到達するには鎖をノードごとにたどる必要がある。インデックスアクセスは **O(n)** だ。その代わり、既知のノードの後ろへの挿入は二つのポインタをつなぎ替えるだけの **O(1)** で、何もずらさない。

```mermaid
graph TD
    subgraph 挿入前
        A["10 | next"] --> B["30 | next"]
    end
    subgraph 挿入後
        C["10 | next"] --> D["20 | next"] --> E["30 | next"]
    end
```

## 判断をまとめる表

| 操作 | 動的配列 | 連結リスト |
| --- | --- | --- |
| インデックスアクセス | O(1) | O(n) |
| 末尾への挿入・削除 | 償却 O(1) | O(1) |
| 先頭への挿入・削除 | O(n) | O(1) |
| 途中への挿入・削除 | O(n) | ノードがあれば O(1)、探すなら O(n) |
| 要素あたりのメモリ | 値のみ | 値 + ポインタ |
| キャッシュ局所性 | 高い | 低い |

「キャッシュ局所性」の行は多くの人を惑わせる。理論上はリストが挿入で勝つが、実際には配列を走査する方が CPU キャッシュにずっと優しいため、多くの現実の負荷では Big O がリストを示唆する場面でも動的配列が勝つ。推測より計測が常に勝る。

## 操作と走査

最も多い操作は走査だ。配列ならインデックスのループで足りる。リストなら `next` ポインタを `null` に当たるまでたどる。

```python
# 動的配列：インデックスで走査
for i in range(len(v)):
    print(v[i])

# 連結リスト：ノードの鎖をたどる
node = head
while node is not None:
    print(node.value)
    node = node.next
```

両者の反転は哲学の違いを示す。配列の反転は両端のペアを中心へ向かって交換する、その場で行う処理だ。連結リストの反転は各 `next` ポインタを一つずつ後ろへ向け直す。

## 整列は構造に依存する

整列は一つの問題に見えるが、構造がアルゴリズムを選ぶ。古典的な **クイックソート** は配列で輝く。その場での分割にインデックスアクセスを頼り、アクセスごとに O(1) だからだ。連結リストではそのアクセスが O(n) になり、アルゴリズムは劣化する。

対照的に **マージソート** はインデックスでアクセスしない。列を半分に分け、整列済みの部分列を融合し、常に先頭から走査する。だから連結リストの自然な選択であり、しかも安定である。

```mermaid
graph TD
    A["[38, 27, 43, 3, 9, 82, 10]"] --> B["[38, 27, 43]"]
    A --> C["[3, 9, 82, 10]"]
    B --> D["[38]"]
    B --> E["[27, 43]"]
    C --> F["[3, 9]"]
    C --> G["[82, 10]"]
    D --> H["上りながら融合・整列"]
    E --> H
    F --> H
    G --> H
    H --> I["[3, 9, 10, 27, 38, 43, 82]"]
```

実際には自分でソートを書くことはまれだ。`Array.Sort`、`list.sort()`、`std::sort` は精密に調整されたハイブリッド（introsort, timsort）を使う。だが、なぜ各構造に各アルゴリズムが選ばれたのかを知ることが、ライブラリを使うことと理解することを分ける。

## 結論

配列と連結リストは「良い」「悪い」ではない。どこに時間を費やすかという同じ問いへの正反対の二つの答えだ。配列は高価な挿入の代償に即時のインデックスアクセスを買い、リストは遅い探索と余分なポインタの代償に安価な挿入を買う。走査のコストから理想的な整列アルゴリズムまで、残りすべては一つの事実から導かれる。要素がメモリ上にどう並んでいるか、である。良い選択は単純な問いから始まる。あなたのコードが最も頻繁に行う操作は何か。
'''

## 実際のコンテキスト

SOS Locationは毎晩01時から05時の間に50の優先市町村の洪水シミュレーションを実行する。各市町村には1〜5の監視ゾーンがあり、各ゾーンには3つの降水シナリオ（予想・悲観・極端）がある。合計：夜間サイクルあたり約150のシミュレーション。結果は翌日の各`AreaDeRisco`の基準`NivelRisco`を更新する。バッチがサイレントに失敗すると、SOS Locationは古いリスクデータで1日を開始する。

## 具体的な問題

最初のバージョンはシンプルなループを持つ`IHostedService`を使っていた。問題：(1) 可視性なし--プロセスが午前2時に死ぬと、チームは8時まで気づかない；(2) 自動リトライなし--瞬間的なネットワーク障害でシミュレーション全体が破棄される；(3) 同時実行制御なし--再起動シナリオで同じシミュレーションが2回実行され、重複結果がデータベースに書き込まれる；(4) 優先順位付けなし--2時間のシミュレーション（大きな市町村）と5分のシミュレーション（小さな市町村）が等しくワーカーを競い合い、速いものを遅らせる。

## 技術的決定

SQL Serverを永続化バックエンドとするHangfire。8つの並列ワーカー。`EnqueueNightlySimulacoesJob`エンキュージョブはcronで01:00に実行。各個別シミュレーションは冪等性キー`sim:{municipioId}:{date}:{scenario}`を持つHangfireジョブ。最短優先：30分未満と推定されるシミュレーションは`fast`キューに、残りは`default`に入る。Hangfireダッシュボードは`/hangfire`ルートに`Admin`ロール認証付き。

## 実装

```csharp

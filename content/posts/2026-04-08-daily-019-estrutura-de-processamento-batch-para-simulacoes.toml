## 具体的な例

2026-04-15の夜間サイクル：148ジョブをエンキュー（2つの非アクティブゾーンを除外）。`fast`キュー：89ジョブ（推定 < 30分）。`default`キュー：59ジョブ。8ワーカーでのバッチ総時間：2時間14分。02:17のデータベースタイムアウトで3ジョブが初回試行で失敗--60秒の遅延で自動再処理、すべてが2回目の試行で完了。0件の重複検出（`idempotency_key`で確認）。当日のリスクデータは03:22に利用可能。

## 成功基準

通常条件下で150件の夜間シミュレーション100%が05:00前に完了。同じ`(areaId, date, scenario)`に対するゼロ重複結果。30日連続で測定したリトライ後の成功率 ≥ 99.5%。5件以上の未回復障害でバッチ完了時にSlackアラート。

## SOS Locationとの関係

コーディネーターが朝番開始時に見る各`AreaDeRisco`の基準`NivelRisco`は、このバッチの産物だ。20%のゾーンでサイレントに失敗するバッチは、完全に失敗するバッチより危険だ--偽のカバレッジ感を与えるから。冪等性とHangfireダッシュボードは障害を可視化して回復可能にするために存在する。

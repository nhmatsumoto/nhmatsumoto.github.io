このDailyでは、SOS Locationの **地図と可視化** トラックにおける **Leaflet.jsによる地図初期実装** を詳しく整理します。短いメモを、プロダクト、エンジニアリング、運用で再利用できる参照資料にすることが目的です。

## 説明
「Leaflet.jsによる地図初期実装」を、背景、運用基準、図、数式、実装例とともに整理します。

## 基礎
運用地図は装飾ではありません。認知負荷を下げ、行動可能なレイヤーを優先し、位置・時間・深刻度の関係を、プレッシャー下で判断する人に見える形に保つ必要があります。

中心となる考え方は、**Leaflet.jsによる地図初期実装** を観測可能にすることです。別の人が読める成果物、コードでテストできる契約、運用チームが検証できる基準が必要です。判断が会話だけに残る場合、それはスケールせず、組織的な学習にもなりません。

## 判断モデル
この判断は、次のような単純な指標で評価できます。

$$
L(z) = \min(L_{max}, \max(L_{min}, \lfloor \alpha z + \beta \rfloor))
$$

LOD関数はズームを表示詳細度に対応させ、操作者が広域を見るときに要素が過剰にならないようにします。


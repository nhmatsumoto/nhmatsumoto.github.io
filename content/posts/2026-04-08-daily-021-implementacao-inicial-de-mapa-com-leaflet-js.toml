## よくある落とし穴
- 実際のユースケースを検証する前に、概念を過度に汎用化してしまうこと。
- ビジネスルール、外部連携、表示上の詳細を同じ場所に混ぜること。
- 技術的に動くことだけを測り、救助チーム、被災ユーザー、操作者への影響を忘れること。


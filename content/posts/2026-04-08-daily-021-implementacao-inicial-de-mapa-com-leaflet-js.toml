## 実際のコンテキスト

マップはSOS Locationの緊急コーディネーター向けのプライマリインターフェースだ：午前3時にアラートを受け取った時に最初に開く画面だ。Google MapsやMapboxではなくLeaflet.jsを選んだのは意図的だった：タイルごとのAPIコストなし、ピーク時のイベント中のリクエスト制限なし、監査可能なオープンソースコード。問題はReactとの統合で発生した--Leafletは直接DOMを操作するため、明示的に処理しないとReactのライフサイクルと競合する。

## 具体的な問題

最初のLeaflet+React統合は、安定した参照なしで`useEffect`内でマップを作成していた。結果：親コンポーネントの再レンダリング（状態変更）のたびに、`useEffect`がマップを破棄して再作成した--ロードされたすべてのレイヤーを含めて。200ゾーンがロードされた緊急セッションでは、これが800msのフラッシュとビューポート位置の損失を引き起こした。この問題は最初の民間防衛訓練中に本番で表面化した。

## 技術的決定

レンダリング間でマップインスタンスを安定させる`useRef`。派生状態（中心、ズーム、アクティブレイヤー）はコンポーネントのローカル状態ではなくZustandに格納する。`if (mapRef.current) return`チェック付きの`useEffect`内でLeafletを初期化--冪等。デバイス別の初期ズーム：モバイルは`zoom=11`、デスクトップは`zoom=13`。

## 実装

```tsx

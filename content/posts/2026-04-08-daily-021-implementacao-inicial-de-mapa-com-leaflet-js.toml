## Fundamentals
An operational map is not decoration. It must reduce cognitive load, prioritize actionable layers and keep the relationship between position, time and severity visible to people deciding under pressure.

The core idea is to make **Initial map implementation with Leaflet.js** observable: there should be an artifact that another person can read, code can test or an operations team can validate. If the decision stays only in conversation, it does not scale and it does not create institutional learning.

## Decision model
The decision can be evaluated with a simple metric:

$$
L(z) = \min(L_{max}, \max(L_{min}, \lfloor \alpha z + \beta \rfloor))
$$

The LOD function maps zoom to visual detail to avoid too many elements when the operator sees a large area.

## Flow diagram
```mermaid
flowchart LR

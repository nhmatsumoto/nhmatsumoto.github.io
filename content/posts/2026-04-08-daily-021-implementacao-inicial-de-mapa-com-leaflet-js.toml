## 具体的な例

`useRef`リファクタリング後、マップはリアルタイムリスク更新（SignalR）によって引き起こされる再レンダリング中も安定している。10秒間に50件の`NivelRisco`更新のテストで、`SosMap`の再レンダリングはトリガーされなかった--ZustandはSosMapではなく`useMapStore`をサブスクライブするコンポーネントにのみ通知する。

## 成功基準

アクティブセッション中のLeafletマップ再初期化ゼロ（`useEffect`インストルメンテーションで測定）。マップの初期ロード時間（DOMContentLoaded → タイル表示） < 4G接続で1.5秒。リアルタイムデータ更新中のビューポート位置の保持。

## SOS Locationとの関係

マップはインターフェースの最も重要な産物だ。実際の緊急時にフラッシュしたり位置を失うマップは、UXの問題だけでなく運用上のリスクだ。`useRef`によるLeafletインスタンスの安定性は、すべてのリスクレイヤー、ホットスポット、避難経路が構築される基盤だ。

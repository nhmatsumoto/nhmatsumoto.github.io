## 実際のコンテキスト

緊急作戦中、コーディネーターは同じマップの異なるビューを素早く切り替える必要がある：「避難経路だけ表示」、「行方不明者を非表示にしてリスクの高いゾーンに集中」、「次の1時間の雨オーバーレイをアクティブに」。各トグルはすでにロードされたデータを再ロードしてはならない——8,500ポリゴンの初期ロードは340ms（#022）かかり、トグルのたびにそのコストを繰り返すとインターフェースが使えなくなる。

## 具体的な問題

最初のバージョンは`SosMap`コンポーネントのReact状態内でオーバーレイごとに1つのブールフラグを使っていた。ユーザーがレイヤーを非表示にすると、コンポーネントが再レンダリングされ、Leaflet要素を削除してタイルキャッシュを破棄した。再アクティブ化すると、すべてを再フェッチした。再フェッチにより100msのトグルが400msになった。さらに、4つのレイヤーすべてが単一コンポーネントに結合されていた——1つのレイヤーの状態変更がすべての再レンダリングをトリガーした。

## 技術的決定

レイヤーごとの可視性マップを持つZustand `layerStore`。各オーバーレイは、Zustandの自分自身の可視性ブールのみをサブスクライブする別のReactコンポーネント。可視性が変わると、そのコンポーネントだけが再レンダリングする。各レイヤーのLeafletインスタンス（`L.FeatureGroup`）はメモリに永続する；トグルは単に`.addTo(map)`または`.remove()`を呼ぶ——再フェッチなし、オブジェクト再構築なし。

## 実装

```ts
type LayerId = 'riskAreas' | 'missingPersons' | 'precipitation' | 'evacuationRoutes';

export const useLayerStore = create<LayerState>((set) => ({
  visibility: {
    riskAreas: true, missingPersons: true,
    precipitation: false, evacuationRoutes: false,
  },
  toggleLayer: (id) =>
    set((state) => ({
      visibility: { ...state.visibility, [id]: !state.visibility[id] },
    })),
}));
```

```tsx
export function EvacuationRouteLayer({ routes }: Props) {
  const mapInstance = useMapStore((s) => s.mapInstance);
  const isVisible   = useLayerStore((s) => s.visibility.evacuationRoutes);
  const groupRef    = useRef<L.FeatureGroup | null>(null);

  useEffect(() => {
    if (!mapInstance || groupRef.current) return;
    const group = L.featureGroup();
    for (const route of routes) {
      L.geoJSON(route.geometry, {
        style: { color: '#1d6fa4', weight: 3, dashArray: '6 4' },
      }).addTo(group);
    }
    groupRef.current = group;
  }, [mapInstance, routes]);

  useEffect(() => {
    if (!mapInstance || !groupRef.current) return;
    if (isVisible) groupRef.current.addTo(mapInstance);
    else           groupRef.current.remove();
  }, [isVisible, mapInstance]);

  return null;
}
```

## 具体的な例

ブルメナウの作戦中のコーディネーター：「避難経路」をアクティブ化（デフォルトで無効）——トグルに12ms、ネットワークリクエストなし。リスクゾーンに集中するため「行方不明者」を無効化——8ms。「行方不明者」を再アクティブ化——9ms、セッションデータはメモリに無傷。合計：追加のHTTPリクエストゼロで3トグルを29msで完了。

## 成功基準

すでにデータがロードされている任意のレイヤーのレイヤートグルレイテンシ（Leafletインスタンスへの追加/削除）< 20ms。セッションで以前にロードされたレイヤーをアクティブ化する際のネットワークリクエストゼロ。各レイヤーは可視性状態が変わった時に独立して再レンダリングする。

## SOS Locationとの関係

高速な動的オーバーレイはコンフォート機能ではなく——運用上の必要性だ。実際の作戦中にレイヤートグルのたびに2秒必要なコーディネーターはコンテキストを失い、ナビゲーションエラーを犯す。メモリに永続する`featureGroup`アーキテクチャがそのトグルを即座にする。
'''

body_en_us = '''
This Daily expands **Real-time communication with affected users** within the **product and vision** track of SOS Location.

## Description
The goal is to turn **Real-time communication with affected users** into a verifiable artifact in code, contract, or operations.

## Fundamentals
If the team cannot answer who decides, what changes, and how to measure it, **Real-time communication with affected users** is still abstract. The practical rule is to keep the artifact close to the flow it changes.

## Formula
Practical reading of the decision:
Impact = reach × trust × readiness

## Flow diagram
```mermaid
flowchart LR
  A["Necessidade"] --> B["Proposta de valor"]
  B --> C["Entrega"]
  C --> D["Medição pública"]
  D --> E["Ajuste de rota"]
```

## Implementation example
```typescript
export const D098ComunicacaoEmTempoRealComUsuarCapability = {
  name: 'D098ComunicacaoEmTempoRealComUsuar',
  status: 'planned',
  owner: 'product',
};
```

## How to apply it in SOS Location
- Define the minimum contract for Real-time communication with affected users.
- Record the decision where the team actually keeps it over time.
- Validate it with real data, a test, or a verifiable query.

## Common pitfalls
- Promising value without a clear operational path.
- Measuring delivery only and ignoring trust or transparency.

## Success criteria
The product evolves well when impact is visible and explainable to any team.

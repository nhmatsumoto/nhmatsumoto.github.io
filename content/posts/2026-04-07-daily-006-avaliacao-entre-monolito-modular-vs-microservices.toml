## 基礎
基礎は、ドメイン概念を明確な境界、安定した契約、追跡可能な判断に変換することです。緊急対応では曖昧さが時間を奪うため、各用語は誰が判断し、どのデータを信頼し、どの運用効果を起こすのかを示す必要があります。

中心となる考え方は、**モジュラーモノリスとマイクロサービスの比較評価** を観測可能にすることです。別の人が読める成果物、コードでテストできる契約、運用チームが検証できる基準が必要です。判断が会話だけに残る場合、それはスケールせず、組織的な学習にもなりません。


body_ja_jp = '''
このDailyでは、SOS Locationの **アーキテクチャ** トラックにおける **モジュラーモノリスとマイクロサービスの比較評価** を詳しく整理します。

## 説明
目的は、**モジュラーモノリスとマイクロサービスの比較評価** をコード、契約、運用で検証できる成果物にすることです。

## 基礎
チームが「誰が決めるか」「何が変わるか」「どう測るか」に答えられないなら、**モジュラーモノリスとマイクロサービスの比較評価** はまだ抽象的です。 実践的なルールは、その成果物を変更対象の流れの近くに置くことです。

## 数式
判断を読むための指標:
明確さ = (境界 + 契約) / 結合度

## フロー図
```mermaid
flowchart LR
  A["Descoberta do domínio"] --> B["Linguagem comum"]
  B --> C["Boundary"]
  C --> D["Contrato testável"]
  D --> E["Evolução controlada"]
```

## 実装例
```csharp
public sealed record D006AvaliacaoEntreMonolitoModularVDecision(string Boundary, string Owner, string ExpectedOutcome);

public static class D006AvaliacaoEntreMonolitoModularVPolicy
{
    public static bool IsReady(D006AvaliacaoEntreMonolitoModularVDecision decision)
        => !string.IsNullOrWhiteSpace(decision.Boundary)
        && !string.IsNullOrWhiteSpace(decision.Owner)
        && !string.IsNullOrWhiteSpace(decision.ExpectedOutcome);
}
```

## SOS Location での適用方法
- モジュラーモノリスとマイクロサービスの比較評価 の最小契約を定義します。
- 判断を、チームが長期的に維持する場所に記録します。
- 実データ、テスト、検証可能なクエリで確認します。

## よくある落とし穴
- 業務ルール、外部連携、UIを同じモジュールに混ぜる。
- 責任者、境界、期待動作を明示しない。

## 成功基準
境界を説明し、契約をテストし、回帰を測定できれば十分成熟しています。

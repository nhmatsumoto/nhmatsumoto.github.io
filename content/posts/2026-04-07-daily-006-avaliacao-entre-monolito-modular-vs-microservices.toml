body = '''
Este Daily aprofunda **Avaliação entre monolito modular vs microservices** dentro da trilha **arquitetura** do SOS Location.

## Descrição
O objetivo é transformar **Avaliação entre monolito modular vs microservices** em um artefato verificável no código, no contrato ou na operação.

## Fundamentos
Se o time não consegue responder quem decide, o que muda e como medir, **Avaliação entre monolito modular vs microservices** ainda está abstrato. A regra prática é manter o artefato perto do fluxo que ele altera.

## Fórmula
Leitura objetiva da decisão:
Clareza = (fronteiras + contratos) / acoplamento

## Diagrama
```mermaid
flowchart LR
  A["Descoberta do domínio"] --> B["Linguagem comum"]
  B --> C["Boundary"]
  C --> D["Contrato testável"]
  D --> E["Evolução controlada"]
```

## Exemplo de implementação
```csharp
public sealed record D006AvaliacaoEntreMonolitoModularVDecision(string Boundary, string Owner, string ExpectedOutcome);

public static class D006AvaliacaoEntreMonolitoModularVPolicy
{
    public static bool IsReady(D006AvaliacaoEntreMonolitoModularVDecision decision)
        => !string.IsNullOrWhiteSpace(decision.Boundary)
        && !string.IsNullOrWhiteSpace(decision.Owner)
        && !string.IsNullOrWhiteSpace(decision.ExpectedOutcome);
}
```

## Como aplicar no SOS Location
- Defina o contrato mínimo para Avaliação entre monolito modular vs microservices.
- Registre a decisão onde a equipe realmente a mantém ao longo do tempo.
- Valide com dado real, teste ou consulta verificável.

## Erros comuns
- Misturar regra de negócio, integração e UI no mesmo módulo.
- Não nomear dono, fronteira e comportamento esperado.

## Critério de sucesso
O tema está pronto quando a equipe explica a fronteira, testa o contrato e mede a regressão.

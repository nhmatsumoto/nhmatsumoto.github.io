body = '''
## Contexto real

Durante um tsunami no litoral catarinense, a infraestrutura de rede local fica degradada. Provedores de internet perdem capacidade. Latência de rede que normalmente é de 5 ms pode chegar a 500 ms ou mais. Se o SOS Location fosse composto por microservices, cada request de registro de pessoa desaparecida exigiria chamadas HTTP síncronas para o serviço de autenticação, o serviço de geolocalização e o serviço de alertas. Três chamadas de rede em sequência, cada uma potencialmente com 500 ms de latência: 1,5 segundo apenas para registrar uma ocorrência.

## Problema específico

A equipe avaliou microservices para o SOS Location v1 baseada em um argumento de escalabilidade: "e se precisarmos de 100k usuários simultâneos durante um grande desastre?" Mas o argumento ignora o custo operacional imediato: orquestração com Kubernetes, service mesh, observabilidade distribuída, rollouts coordenados. Para uma equipe de 3 pessoas construindo v1, isso é complexidade prematura que aumenta o tempo até o primeiro deploy real de semanas para meses.

## Decisão técnica

Monolito modular para v1, com interfaces de módulo projetadas para extração futura. Cada módulo expõe uma interface C# — `IBuscaModule`, `IResgateModule`, `IAlertas Module` — que define o contrato público. Quando um módulo precisar ser extraído como serviço, apenas a implementação da interface muda (chamada HTTP em vez de chamada in-process). O restante do sistema não percebe a diferença.

## Implementação

```csharp
// SosLocation.Shared/Contracts/IBuscaModule.cs
public interface IBuscaModule
{
    Task<Guid> RegistrarPessoaDesaparecidaAsync(
        RegistrarPessoaDesaparecidaRequest req,
        CancellationToken ct);

    Task<IReadOnlyList<PessoaDesaparecidaDto>> ListarEmAreaAsync(
        double latC, double lonC, double raioKm,
        CancellationToken ct);
}

// SosLocation.Busca/BuscaModule.cs — implementação in-process
internal sealed class BuscaModule : IBuscaModule
{
    private readonly IMediator _mediator;

    public Task<Guid> RegistrarPessoaDesaparecidaAsync(
        RegistrarPessoaDesaparecidaRequest req, CancellationToken ct)
        => _mediator.Send(new RegistrarPessoaDesaparecidaCommand(
               req.Nome, req.Latitude, req.Longitude, req.DescricaoFisica), ct);

    public Task<IReadOnlyList<PessoaDesaparecidaDto>> ListarEmAreaAsync(
        double latC, double lonC, double raioKm, CancellationToken ct)
        => _mediator.Send(new ListarPessoasEmAreaQuery(latC, lonC, raioKm), ct);
}

// Program.cs — registro via interface; implementação oculta
builder.Services.AddScoped<IBuscaModule, BuscaModule>();

// Quando extrair para microservice: apenas trocar a implementação
// builder.Services.AddScoped<IBuscaModule, BuscaHttpClient>();
```

## Exemplo concreto

Benchmark realizado com o simulador de rede degradada (tc netem com 200 ms de latência adicional): monolito modular, registro de pessoa desaparecida — 18 ms. Arquitetura de microservices equivalente com 3 chamadas HTTP síncronas — 618 ms. Durante um desastre real com rede instável, a diferença entre 18 ms e 618 ms é a diferença entre um sistema usável e um sistema que coordenadores abandonam em favor de rádio analógico.

## Critério de sucesso

O tempo de resposta do endpoint crítico `POST /missing-persons` permanece abaixo de 100 ms mesmo com rede degradada simulada (200 ms de latência adicional). A extração de qualquer módulo para serviço independente requer mudança somente no registro DI, não em código de negócio.

## Relação com SOS Location

O SOS Location é um sistema de resposta a emergências — não um sistema de e-commerce com escalabilidade previsível. A escolha de arquitetura deve priorizar confiabilidade sob condições adversas antes de escalabilidade horizontal. Microservices adicionam resiliência operacional apenas quando a equipe tem maturidade para operá-los; antes disso, adicionam pontos de falha.
'''
body_en_us = '''
## Real context

During a tsunami on the Santa Catarina coast, local network infrastructure degrades. Internet providers lose capacity. Network latency that is normally 5 ms can reach 500 ms or more. If SOS Location were composed of microservices, each missing person registration request would require synchronous HTTP calls to the authentication service, the geolocation service, and the alerts service. Three sequential network calls, each potentially with 500 ms of latency: 1.5 seconds just to register an incident.

## Specific problem

The team evaluated microservices for SOS Location v1 based on a scalability argument: "what if we need 100k simultaneous users during a major disaster?" But the argument ignores the immediate operational cost: Kubernetes orchestration, service mesh, distributed observability, coordinated rollouts. For a 3-person team building v1, this is premature complexity that increases the time to the first real deploy from weeks to months.

## Technical decision

Modular monolith for v1, with module interfaces designed for future extraction. Each module exposes a C# interface — `IBuscaModule`, `IResgateModule`, `IAlertas Module` — defining the public contract. When a module needs to be extracted as a service, only the interface implementation changes (HTTP call instead of in-process call). The rest of the system does not notice the difference.

## Implementation

```csharp
// SosLocation.Shared/Contracts/IBuscaModule.cs
public interface IBuscaModule
{
    Task<Guid> RegistrarPessoaDesaparecidaAsync(
        RegistrarPessoaDesaparecidaRequest req, CancellationToken ct);

    Task<IReadOnlyList<PessoaDesaparecidaDto>> ListarEmAreaAsync(
        double latC, double lonC, double raioKm, CancellationToken ct);
}

// In-process implementation
internal sealed class BuscaModule : IBuscaModule
{
    private readonly IMediator _mediator;

    public Task<Guid> RegistrarPessoaDesaparecidaAsync(
        RegistrarPessoaDesaparecidaRequest req, CancellationToken ct)
        => _mediator.Send(new RegistrarPessoaDesaparecidaCommand(
               req.Nome, req.Latitude, req.Longitude, req.DescricaoFisica), ct);

    public Task<IReadOnlyList<PessoaDesaparecidaDto>> ListarEmAreaAsync(
        double latC, double lonC, double raioKm, CancellationToken ct)
        => _mediator.Send(new ListarPessoasEmAreaQuery(latC, lonC, raioKm), ct);
}

// Program.cs — registered via interface; implementation is hidden
builder.Services.AddScoped<IBuscaModule, BuscaModule>();

// Future microservice extraction: only change the DI registration
// builder.Services.AddScoped<IBuscaModule, BuscaHttpClient>();
```

## Concrete example

Benchmark with a degraded network simulator (tc netem with 200 ms additional latency): modular monolith, missing person registration — 18 ms. Equivalent microservices architecture with 3 synchronous HTTP calls — 618 ms. During a real disaster with unstable network, the difference between 18 ms and 618 ms is the difference between a usable system and a system that coordinators abandon in favour of analogue radio.

## Success criteria

The critical `POST /missing-persons` endpoint response time stays below 100 ms even with simulated network degradation (200 ms additional latency). Extracting any module to an independent service requires a change only in DI registration, not in business code.

## Relation to SOS Location

SOS Location is an emergency response system — not an e-commerce system with predictable scalability. The architectural choice must prioritise reliability under adverse conditions before horizontal scalability. Microservices add operational resilience only when the team has the maturity to operate them; before that, they add failure points.
'''
body_ja_jp = '''
## 実際のコンテキスト

サンタカタリーナ州海岸沿いの津波発生時、地元のネットワークインフラが劣化する。インターネットプロバイダーが容量を失う。通常5msのネットワーク遅延が500ms以上になる可能性がある。SOS Locationがマイクロサービスで構成されていたなら、各行方不明者登録リクエストは認証サービス・ジオロケーションサービス・アラートサービスへの同期HTTP呼び出しを必要とする。それぞれ潜在的に500msの遅延を持つ3回の順次ネットワーク呼び出し：1件の報告を登録するだけで1.5秒。

## 具体的な問題

チームはスケーラビリティの観点からSOS Location v1のマイクロサービスを評価した：「大規模災害時に10万人の同時ユーザーが必要な場合はどうするか？」しかしこの議論は即座の運用コストを無視している：Kubernetesオーケストレーション・サービスメッシュ・分散オブザーバビリティ・協調ロールアウト。3人チームがv1を構築するにあたって、これは最初の実際のデプロイまでの時間を数週間から数ヶ月に増やす時期尚早な複雑さだ。

## 技術的決定

v1にはモジュラーモノリスを採用し、将来の分割のためにモジュールインターフェースを設計する。各モジュールはC#インターフェース——`IBuscaModule`・`IResgateModule`・`IAlertas Module`——でパブリックコントラクトを公開する。モジュールをサービスとして抽出する際は、インターフェースの実装のみが変わる（インプロセス呼び出しではなくHTTP呼び出し）。システムの残りは違いに気づかない。

## 実装

```csharp
public interface IBuscaModule
{
    Task<Guid> RegistrarPessoaDesaparecidaAsync(
        RegistrarPessoaDesaparecidaRequest req, CancellationToken ct);

    Task<IReadOnlyList<PessoaDesaparecidaDto>> ListarEmAreaAsync(
        double latC, double lonC, double raioKm, CancellationToken ct);
}

// インプロセス実装
internal sealed class BuscaModule : IBuscaModule
{
    private readonly IMediator _mediator;

    public Task<Guid> RegistrarPessoaDesaparecidaAsync(
        RegistrarPessoaDesaparecidaRequest req, CancellationToken ct)
        => _mediator.Send(new RegistrarPessoaDesaparecidaCommand(
               req.Nome, req.Latitude, req.Longitude, req.DescricaoFisica), ct);

    public Task<IReadOnlyList<PessoaDesaparecidaDto>> ListarEmAreaAsync(
        double latC, double lonC, double raioKm, CancellationToken ct)
        => _mediator.Send(new ListarPessoasEmAreaQuery(latC, lonC, raioKm), ct);
}

// Program.cs — インターフェース経由で登録；実装は非公開
builder.Services.AddScoped<IBuscaModule, BuscaModule>();

// 将来のマイクロサービス分割：DIの登録のみを変更
// builder.Services.AddScoped<IBuscaModule, BuscaHttpClient>();
```

## 具体的な例

劣化ネットワークシミュレーター（tc nememで200ms追加遅延）でのベンチマーク：モジュラーモノリス、行方不明者登録——18ms。3回の同期HTTP呼び出しを持つ同等のマイクロサービスアーキテクチャ——618ms。不安定なネットワークの実際の災害時、18msと618msの差は使えるシステムとコーディネーターがアナログ無線に切り替えるシステムの差だ。

## 成功基準

重要な`POST /missing-persons`エンドポイントのレスポンス時間が、シミュレートされたネットワーク劣化（200ms追加遅延）下でも100ms以下を維持する。モジュールの独立したサービスへの分割が、ビジネスコードではなくDI登録の変更のみを必要とする。

## SOS Locationとの関係

SOS Locationは予測可能なスケーラビリティを持つeコマースシステムではなく、緊急対応システムだ。アーキテクチャの選択は水平スケーラビリティより先に逆境下での信頼性を優先しなければならない。マイクロサービスが運用上のレジリエンスを追加するのは、チームがそれらを運用する成熟度を持つ場合のみ；その前では障害点を追加するだけだ。

body_en_us = '''
This Daily expands **Evaluation between modular monolith and microservices** within the **architecture** track of SOS Location.

## Description
The goal is to turn **Evaluation between modular monolith and microservices** into a verifiable artifact in code, contract, or operations.

## Fundamentals
If the team cannot answer who decides, what changes, and how to measure it, **Evaluation between modular monolith and microservices** is still abstract. The practical rule is to keep the artifact close to the flow it changes.

## Formula
Practical reading of the decision:
Clarity = (boundaries + contracts) / coupling

## Flow diagram
```mermaid
flowchart LR
  A["Descoberta do domínio"] --> B["Linguagem comum"]
  B --> C["Boundary"]
  C --> D["Contrato testável"]
  D --> E["Evolução controlada"]
```

## Implementation example
```csharp
public sealed record D006AvaliacaoEntreMonolitoModularVDecision(string Boundary, string Owner, string ExpectedOutcome);

public static class D006AvaliacaoEntreMonolitoModularVPolicy
{
    public static bool IsReady(D006AvaliacaoEntreMonolitoModularVDecision decision)
        => !string.IsNullOrWhiteSpace(decision.Boundary)
        && !string.IsNullOrWhiteSpace(decision.Owner)
        && !string.IsNullOrWhiteSpace(decision.ExpectedOutcome);
}
```

## How to apply it in SOS Location
- Define the minimum contract for Evaluation between modular monolith and microservices.
- Record the decision where the team actually keeps it over time.
- Validate it with real data, a test, or a verifiable query.

## Common pitfalls
- Mixing business rules, integration, and UI in the same module.
- Failing to name the owner, boundary, and expected behavior.

## Success criteria
The topic is ready when the team can explain the boundary, test the contract, and measure regressions.

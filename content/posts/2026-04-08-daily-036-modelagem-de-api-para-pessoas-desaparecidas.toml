body = '''
## Contexto real

A API de `PessoaDesaparecida` no SOS Location é usada por dois tipos de atores: coordenadores de emergência que registram casos durante operações, e familiares que reportam desaparecimentos via app público. O modelo de dados precisa capturar: identidade, localização do último avistamento, horário, condições de saúde relevantes, e o status do caso (desaparecida, encontrada com vida, óbito, cancelada).

## Problema específico

A primeira versão usava `PUT` para todas as atualizações de `PessoaDesaparecida` - o cliente enviava o objeto completo a cada mudança. Dois problemas: (1) atualização de status ("encontrada") com `PUT` obrigava o cliente a ter estado completo da entidade - em mobile com conexão instável, um campo desatualizado podia sobrescrever dados importantes; (2) o endpoint `GET /api/pessoas-desaparecidas` sem filtro retornava todos os registros do tenant sem paginação - consulta que crescia linearmente com o histórico e causava timeout após 6 meses.

## Decisão técnica

`POST` para criação com geolocalização obrigatória. `PATCH` para atualização de status (apenas o campo que muda). `GET` com parâmetros `lat`, `lon`, `raioKm` (padrão 5 km) usando `ST_DWithin` para busca por proximidade + paginação com cursor. Validação de estado de máquina: status `Encontrada` ou `Obito` encerra o caso - `PATCH` subsequente retorna `409 Conflict`.

## Implementação

```csharp
// POST /api/pessoas-desaparecidas
app.MapPost("/api/pessoas-desaparecidas",
    async (RegistrarPessoaDesaparecidaRequest req, ISender sender, ClaimsPrincipal user) =>
    {
        var command = new RegistrarPessoaDesaparecidaCommand(
            Nome:                    req.Nome,
            IdadeAproximada:         req.IdadeAproximada,
            LatUltimoAvistamento:    req.Latitude,
            LonUltimoAvistamento:    req.Longitude,
            DataUltimoAvistamento:   req.DataUltimoAvistamento,
            CondicoesEspeciais:      req.CondicoesEspeciais,
            TenantId:                user.GetTenantId(),
            OperacaoId:              req.OperacaoId
        );
        var result = await sender.Send(command);
        return Results.Created($"/api/pessoas-desaparecidas/{result.Id}", result);
    })
    .RequireAuthorization();

// PATCH /api/pessoas-desaparecidas/{id}/status
app.MapPatch("/api/pessoas-desaparecidas/{id}/status",
    async (Guid id, AtualizarStatusRequest req, ISender sender, ClaimsPrincipal user) =>
    {
        var command = new AtualizarStatusPessoaDesaparecidaCommand(
            PessoaId:  id,
            NovoStatus: Enum.Parse<StatusPessoaDesaparecida>(req.Status),
            TenantId:   user.GetTenantId()
        );
        var result = await sender.Send(command);
        return result is null
            ? Results.Conflict("Caso já encerrado - status não pode ser alterado.")
            : Results.Ok(result);
    })
    .RequireAuthorization();

// GET /api/pessoas-desaparecidas com raio geográfico
app.MapGet("/api/pessoas-desaparecidas",
    async (double lat, double lon, double raioKm,
           string? cursor, ISender sender, ClaimsPrincipal user) =>
    {
        var query = new BuscarPessoasDesaparecidasQuery(
            Lat: lat, Lon: lon, RaioKm: raioKm,
            Cursor: cursor, TenantId: user.GetTenantId()
        );
        return Results.Ok(await sender.Send(query));
    })
    .RequireAuthorization();
```

```sql
-- BuscarPessoasDesaparecidasQuery handler - cursor pagination + ST_DWithin
SELECT id, nome, status, data_ultimo_avistamento,
       ST_Distance(
           localizacao_ultimo_avistamento::geography,
           ST_MakePoint(@lon, @lat)::geography
       ) / 1000.0 AS distancia_km
FROM   pessoas_desaparecidas
WHERE  tenant_id = @tenantId
  AND  ST_DWithin(
           localizacao_ultimo_avistamento::geography,
           ST_MakePoint(@lon, @lat)::geography,
           @raioKm * 1000
       )
  AND  (status = 'Desaparecida' OR status = 'EmBusca')
  AND  (@cursor IS NULL OR id > @cursor::uuid)
ORDER  BY id
LIMIT  50;
```

## Exemplo concreto

Enchente em Petrópolis - operação ativa com 847 pessoas desaparecidas registradas. `GET /api/pessoas-desaparecidas?lat=-22.505&lon=-43.178&raioKm=3` retorna 89 pessoas no raio de 3 km do centro de coordenação, ordenadas por proximidade, em 120ms com índice GIST. PATCH de status para `Encontrada` em uma das 847 - retorna imediatamente sem re-enviar os outros campos. Tentativa de segundo PATCH em caso já `Encontrada` → 409 Conflict.

## Critério de sucesso

`POST /api/pessoas-desaparecidas` persiste e retorna em < 200ms incluindo emissão de evento de domínio. `PATCH /status` atualiza apenas o campo de status em < 100ms. `GET` com raio de 5 km retorna em < 300ms para tenant com até 5.000 registros ativos.

## Relação com SOS Location

`PessoaDesaparecida` é o agregado central do valor humano do SOS Location - cada registro representa uma vida em risco. A API precisa suportar tanto o volume de um grande evento (500+ registros em horas) quanto a precisão de uma atualização de status sem risco de sobrescrever dados.
'''
body_en_us = '''
## Real context

The `PessoaDesaparecida` API in SOS Location is used by two types of actors: emergency coordinators who register cases during operations, and family members who report disappearances via the public app. The data model must capture: identity, last-seen location, time, relevant health conditions, and case status (missing, found alive, deceased, cancelled).

## Specific problem

The first version used `PUT` for all `PessoaDesaparecida` updates - the client sent the complete object on every change. Two problems: (1) a status update ("found") with `PUT` forced the client to hold the complete entity state - on mobile with an unstable connection, a stale field could overwrite important data; (2) `GET /api/pessoas-desaparecidas` without a filter returned all tenant records without pagination - a query that grew linearly with history and caused timeouts after 6 months.

## Technical decision

`POST` for creation with mandatory geolocation. `PATCH` for status update (only the changing field). `GET` with `lat`, `lon`, `raioKm` parameters (default 5 km) using `ST_DWithin` for proximity search + cursor pagination. State machine validation: status `Encontrada` or `Obito` closes the case - a subsequent `PATCH` returns `409 Conflict`.

## Implementation

```csharp
// PATCH /api/pessoas-desaparecidas/{id}/status
app.MapPatch("/api/pessoas-desaparecidas/{id}/status",
    async (Guid id, AtualizarStatusRequest req, ISender sender, ClaimsPrincipal user) =>
    {
        var command = new AtualizarStatusPessoaDesaparecidaCommand(
            PessoaId:   id,
            NovoStatus: Enum.Parse<StatusPessoaDesaparecida>(req.Status),
            TenantId:   user.GetTenantId()
        );
        var result = await sender.Send(command);
        return result is null
            ? Results.Conflict("Case already closed - status cannot be changed.")
            : Results.Ok(result);
    })
    .RequireAuthorization();
```

```sql
-- Proximity search with cursor pagination
SELECT id, nome, status, data_ultimo_avistamento,
       ST_Distance(
           localizacao_ultimo_avistamento::geography,
           ST_MakePoint(@lon, @lat)::geography
       ) / 1000.0 AS distancia_km
FROM   pessoas_desaparecidas
WHERE  tenant_id = @tenantId
  AND  ST_DWithin(
           localizacao_ultimo_avistamento::geography,
           ST_MakePoint(@lon, @lat)::geography,
           @raioKm * 1000
       )
  AND  (status = 'Desaparecida' OR status = 'EmBusca')
  AND  (@cursor IS NULL OR id > @cursor::uuid)
ORDER  BY id
LIMIT  50;
```

## Concrete example

Flood in Petrópolis - active operation with 847 registered missing persons. `GET /api/pessoas-desaparecidas?lat=-22.505&lon=-43.178&raioKm=3` returns 89 people within a 3 km radius of the coordination centre, ordered by proximity, in 120ms with GIST index. PATCH status to `Encontrada` for one of the 847 - returns immediately without resending the other fields. Second PATCH attempt on an already `Encontrada` case → 409 Conflict.

## Success criteria

`POST /api/pessoas-desaparecidas` persists and returns in < 200ms including domain event emission. `PATCH /status` updates only the status field in < 100ms. `GET` with 5 km radius returns in < 300ms for a tenant with up to 5,000 active records.

## Relation to SOS Location

`PessoaDesaparecida` is the central aggregate of SOS Location's human value - each record represents a life at risk. The API must support both the volume of a large event (500+ records in hours) and the precision of a status update without the risk of overwriting data.
'''
body_ja_jp = '''
## 実際のコンテキスト

SOS Locationの`PessoaDesaparecida` APIは2種類のアクターが使用する：作戦中にケースを登録する緊急コーディネーター、そして公開アプリ経由で失踪を報告する家族。データモデルはキャプチャする必要がある：身元、最後に目撃した位置、時刻、関連する健康状態、ケースステータス（行方不明・生存確認・死亡・キャンセル）。

## 具体的な問題

最初のバージョンはすべての`PessoaDesaparecida`更新に`PUT`を使っていた--クライアントは変更のたびに完全なオブジェクトを送った。2つの問題：(1) `PUT`でのステータス更新（「発見」）はクライアントに完全なエンティティ状態を保持させた--不安定な接続のモバイルでは、古いフィールドが重要なデータを上書きする可能性があった；(2) フィルターなしの`GET /api/pessoas-desaparecidas`はページネーションなしにすべてのテナントレコードを返した--履歴と共に線形に増え、6ヶ月後にタイムアウトを引き起こすクエリ。

## 技術的決定

必須の位置情報付きの作成に`POST`。ステータス更新に`PATCH`（変更するフィールドのみ）。近接検索に`ST_DWithin`を使う`lat`、`lon`、`raioKm`パラメータ（デフォルト5 km） + カーソルページネーション付きの`GET`。状態機械バリデーション：ステータス`Encontrada`または`Obito`はケースを終了--後続の`PATCH`は`409 Conflict`を返す。

## 実装

```csharp
app.MapPatch("/api/pessoas-desaparecidas/{id}/status",
    async (Guid id, AtualizarStatusRequest req, ISender sender, ClaimsPrincipal user) =>
    {
        var command = new AtualizarStatusPessoaDesaparecidaCommand(
            PessoaId:   id,
            NovoStatus: Enum.Parse<StatusPessoaDesaparecida>(req.Status),
            TenantId:   user.GetTenantId()
        );
        var result = await sender.Send(command);
        return result is null
            ? Results.Conflict("ケースはすでに終了--ステータスは変更できません。")
            : Results.Ok(result);
    })
    .RequireAuthorization();
```

```sql
SELECT id, nome, status, data_ultimo_avistamento,
       ST_Distance(
           localizacao_ultimo_avistamento::geography,
           ST_MakePoint(@lon, @lat)::geography
       ) / 1000.0 AS distancia_km
FROM   pessoas_desaparecidas
WHERE  tenant_id = @tenantId
  AND  ST_DWithin(
           localizacao_ultimo_avistamento::geography,
           ST_MakePoint(@lon, @lat)::geography,
           @raioKm * 1000
       )
  AND  (status = 'Desaparecida' OR status = 'EmBusca')
  AND  (@cursor IS NULL OR id > @cursor::uuid)
ORDER  BY id
LIMIT  50;
```

## 具体的な例

ペトロポリスの洪水--847人の行方不明者が登録されたアクティブな作戦。`GET /api/pessoas-desaparecidas?lat=-22.505&lon=-43.178&raioKm=3`はGISTインデックスで120msで、近接順に並べられた調整センターから3km圏内の89人を返す。847人のうち1人のステータスを`Encontrada`にPATCH--他のフィールドを再送することなく即座に返す。すでに`Encontrada`のケースへの2回目のPATCH試行 → 409 Conflict。

## 成功基準

`POST /api/pessoas-desaparecidas`はドメインイベント発行を含む200ms未満で永続化して返す。`PATCH /status`は100ms未満でステータスフィールドのみを更新する。5km半径の`GET`は最大5,000のアクティブレコードを持つテナントに対して300ms未満で返す。

## SOS Locationとの関係

`PessoaDesaparecida`はSOS Locationの人間的価値の中心アグリゲートだ--各レコードはリスクにさらされた命を表す。APIは大規模イベントのボリューム（数時間で500+レコード）とデータを上書きするリスクなしにステータス更新の精度の両方をサポートする必要がある。
'''

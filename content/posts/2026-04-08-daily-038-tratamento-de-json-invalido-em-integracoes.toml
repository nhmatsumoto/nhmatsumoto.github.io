## 実際のコンテキスト

SOS Locationは制御できないサードパーティAPIと統合する：GDACS、Open-Meteo、INMET、市区町村システム。これらのAPIは無効（不正形式）、不完全（フィールドが欠落）、または予期しない型（数値が期待されるところにnull、配列が期待されるところにstring）のJSONを返す可能性がある。本番環境で、外部APIからの不正形式のJSONがカスケードした`NullReferenceException`を引き起こし、アラートサービスが12分間ダウンした。

## 具体的な問題

最初のバージョンは例外処理なしで`JsonSerializer.Deserialize<T>`を直接使っていた。Open-Meteoがデータギャップ中に`precipitation`フィールドを`0.0`ではなく`null`として返すと、デシリアライザーはハンドラーを通じて伝播した未処理の`JsonException`をスローし、Hangfireワーカーが失敗した——リトライがエラータイプを区別しなかったため、同じ失敗が3回すべての試行で発生し、45秒のリトライを無駄にして他のAPIからの有効なデータを処理しなかった。

## 技術的決定

デシリアライズ前の構造的バリデーションのための`JsonDocument`。`TryGetProperty`でチェックされる必須フィールド。明示的なデフォルト値を持つオプションフィールド。`JsonException`をキャッチして`Result<T, ParseError>`を返す`ExternalApiParser<T>`ラッパー——例外の伝播なし。元のJSONを500文字に切り詰めた無効フィールドのログ。

## 実装

```csharp
public sealed class ExternalApiParser<T>
{
    public Result<T, ParseError> Parse(string json, Func<JsonDocument, T> extractor)
    {
        if (string.IsNullOrWhiteSpace(json))
            return Result.Failure<T, ParseError>(new ParseError("空またはnullのJSON。"));

        try
        {
            using var doc = JsonDocument.Parse(json);
            return Result.Success<T, ParseError>(extractor(doc));
        }
        catch (JsonException ex)
        {
            _logger.LogWarning(
                "外部JSONのパース失敗: {Error}。JSON（最初の500文字）: {Json}",
                ex.Message,
                json.Length > 500 ? json[..500] + "..." : json);

            return Result.Failure<T, ParseError>(new ParseError(ex.Message));
        }
    }
}
```

```csharp
public Result<OpenMeteoData, ParseError> Parse(string json) =>
    _parser.Parse(json, doc =>
    {
        var hourly = doc.RootElement.GetProperty("hourly");

        var precipitation = hourly.TryGetProperty("precipitation", out var precipEl)
            ? precipEl.EnumerateArray()
                      .Select(e => e.ValueKind == JsonValueKind.Number ? e.GetDouble() : 0.0)
                      .ToList()
            : new List<double>();

        return new OpenMeteoData(precipitation, ...);
    });
```

## 具体的な例

Open-Meteoがデータメンテナンス中に`precipitation`をnullの配列として返す：`[0.2, null, null, 1.5, null]`。旧バージョン：未処理の`JsonException`がワーカーをダウンさせる。新バージョン：`ExternalApiParser`が`e.ValueKind == JsonValueKind.Number ? e.GetDouble() : 0.0`でnullを`0.0`に置き換え、部分的に有効なデータを返し、3つのnullフィールドをログに記録。ワーカーは正常に処理し、リスクモデルは`[0.2, 0.0, 0.0, 1.5, 0.0]`を受け取る。

## 成功基準

インフラレイヤーの外に伝播する未処理の`JsonException`ゼロ。外部APIから受け取った無効なJSONの100%に対してログが生成される。`Result<T, ParseError>`でコーラーがグレースフルデグラデーションと明示的な失敗を選択できる。

## SOS Locationとの関係

外部API統合はシステムの境界——SOS Locationのコードが制御できないデータと出会う場所だ。防御的なパーシングは偏執狂ではなく——GDACSのAPIバグがSOS Locationのアラートサービスをダウンさせないことを保証する唯一の方法だ。

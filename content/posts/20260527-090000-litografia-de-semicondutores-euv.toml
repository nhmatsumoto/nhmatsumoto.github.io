## 日本の見えない役割

日本は半導体競争の見出しにほとんど登場しないが、日本がなければ世界中の先端ファブは数週間で停止する。

**フォトレジスト**：JSR、信越化学工業、東京応化工業（TOK）、富士フイルムが世界の先端フォトレジストの大部分を供給する。EUVレジスト処方は数十年の蓄積された独自知識を持つ経験的科学だ。

**シリコンウェーハ**：信越化学工業とSUMCOが合わせて世界の300mmシリコンウェーハの約60%を生産する。

**特殊材料**：マスク基板（AGC、Hoya）、超高純度プロセスガス（昭和電工）、CMPスラリー（フジミ）、精密セラミック部品（京セラ、NGK）が代替不能なサプライチェーンを形成している。

「ものづくり」——職人的技術、カイゼン、世代を超えて蓄積された暗黙知を重視する日本の製造文化——は、これらのサプライチェーンに深く刻み込まれており、短期間で容易に複製することはできない。


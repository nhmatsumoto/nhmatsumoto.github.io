## 結論

あなたのスマートフォンのチップ——100億個のトランジスタを持つ1cm²のオブジェクト——は、文明の蓄積された技術的知識の物理的な具現化だ。すべてのトランジスタは解決された問題を表している：量子物理学、表面化学、X線光学、超精密機械工学、リアルタイム制御における問題を。

EUVリソグラフィ機械は、人類がこれまでに達成した最も印象的なエンジニアリングの成果だ——最も強力だからでも最もスペクタクルだからでもなく、最も精密で、人類の科学的・産業的歴史の全蓄積に最も依存しており、そして進化し続けているからだ。

ムーアの法則の終焉は、毎世代ごとに時期尚早に宣告されてきた。産業は常に別の道を見つけてきた——物理学が無限に柔軟だからではなく、技術的厳密さと産業的忍耐を持って適用された人間の創造性が、最終的に見えたあらゆる限界よりも一貫して強靭であることを証明してきたからだ。

人類史上最も複雑な機械は、今なお改良され続けている。そしてそれを改良する人々は——自覚があってもなくても——人間のエンジニアリングの歴史の中で最も密度の高い章を書いているという認識のもとで働いている。

# 半導体リソグラフィ：人類が作った最も複雑な機械

世界に、重さ180トン、価格3億5000万ドル以上、輸送に40本のコンテナを要し、現地での組み立てに18ヶ月かかり、年間約60台しか製造されない機械が存在する。その機械には10万点以上の個別部品が含まれ、40カ国以上の5,000社以上のサプライヤーに依存し、水素原子の直径より小さい公差で動作する。

これがなければ、あなたのポケットにあるiPhoneは存在しなかった。Googleの検索に応えるデータセンターも、AIアシスタントを動かすチップも、自動車のABSを制御するプロセッサも存在しなかった。

この機械こそがASMLのEUVリソグラフィスキャナーであり、その仕組みを理解することは、なぜ半導体製造が人類史上最も複雑なエンジニアリングの成果と考えられているかを理解することに他ならない。

---

## 半導体リソグラフィとは何か

この機械を理解するには、まずそれが解決する問題を理解する必要がある。

TSMCが3ナノメートルプロセスで製造するApple M4プロセッサには、10円玉ほどの面積に約280億個のトランジスタが含まれている。各トランジスタは、0と1の2進数値を表すオン・オフが可能な微小な電子スイッチだ。これらのトランジスタのスイッチング速度と単位面積当たりの数が、あらゆるデジタルデバイスの計算能力を直接決定する。

3nmプロセスのトランジスタの臨界寸法は約3ナノメートル——3マイクロメートルの1000分の1だ。スケール感を掴むために：人間の髪の毛は6万〜8万ナノメートルの太さ。現代のトランジスタは髪の毛より約2万倍小さい。典型的なウイルスは20〜300ナノメートル。シリコン原子の直径は約0.22ナノメートル。3nmトランジスタの臨界寸法方向にはシリコン原子がわずか13個並ぶだけだ。

これらの構造を——数十億個、完璧な再現性で、皿サイズのシリコンディスク上に——作成するには、フォトリソグラフィと呼ばれるプロセスが必要だ。基本的な考え方は単純だ：写真家が光を使ってフィルムを露光し画像を現像するように、チップエンジニアは光を使って光感光性基板（フォトレジスト）を露光し、シリコンウェーハに回路パターンを転写する。

ただし、そのスケールは桁違いだ。最小のカメラはマイクロメートル領域の詳細を解像する。半導体リソグラフィはナノメートル領域——3桁小さい——の詳細を解像しなければならない。そして高速で（1時間に数百枚のウェーハ）、層間オーバーレイ精度1ナノメートル以下で、ゼロに近い欠陥率で、これを行う必要がある。

これが問題だ。そして解決策こそが、人類がこれまでに作った最も複雑な機械だ。

---

## 半導体産業を支配するのは誰か

**ASML**（オランダ、1984年にフィリップスのスピンオフとして設立）は、世界で唯一EUVリソグラフィスキャナーを製造できる企業だ。販売されるすべてのEUV機械は、TSMC（台湾）、サムスン（韓国）、インテル（米国）の3社のみに納入される。

**TSMC**（台湾積体電路製造）はApple、NVIDIA、AMD、Qualcommなど数十社のチップを製造する。高性能チップ7nm以下の市場では90%以上のシェアを持つ。

**カールツァイスSMT**（ドイツ）は、ASMLのEUV機械に使用される光学ミラーを製造できる唯一の企業だ。これらのミラーは0.1ナノメートル未満の表面粗さに研磨されており、おそらくこれまでに製造された最も精密な物体だ。

**地政学的側面**：2022年10月、米国政府はEUV機械の中国への販売を禁止する前例のない輸出規制を発動した。中国最大のファウンドリーSMICは事実上7nm以下への前進を阻まれた。中国がEUV技術に追いつくまでの推定時間：10〜15年。このオランダの1社への依存が、21世紀の決定的な戦略的現実の一つとなっている。

---

## シリコン砂から完璧な結晶へ

**チョクラルスキー法**：
1. 超高純度シリコン（純度99.9999999%）を石英ルツボで1,425°Cに加熱し溶融。
2. 単結晶のシード（種）結晶を溶融シリコンに浸し、ゆっくりと引き上げながら回転させる。
3. 時間をかけて、直径300mm、長さ1m以上、重さ最大100kgの円柱状インゴットが成長。
4. ダイヤモンドワイヤーソーでウェーハに薄切りし、ラッピング、化学エッチング、CMPによって表面粗さ0.1nm RMS未満（シリコン原子半径の半分以下）に仕上げる。

---

## チップ製造の完全なプロセス

現代のチップ製造は1ステップではない——数週間の継続的な処理で、数百から1,000以上の個別ステップを経る：

- **熱酸化**：絶縁SiO₂層の成長
- **薄膜堆積**（CVD、PVD、ALD）：原子精度での材料層形成
- **フォトリソグラフィ**：光による回路パターンの転写（核心ステップ）
- **エッチング**：プラズマによる垂直エッジのパターン形成
- **イオン注入**：トランジスタのソース・ドレイン形成
- **CMP**：各堆積層のナノメートル精度平坦化
- **メタライゼーション**（BEOL）：最大15層の銅配線

---

## EUV光はどのように生成されるか

EUV光（13.5nm）は従来のランプやレーザーでは生成できない。ASMLの解決策は恒星温度のプラズマ物理学だ：

1. 直径27マイクロメートルのスズ液滴を毎秒50,000個、真空チャンバーに射出。
2. プリパルスのCO₂レーザーが各液滴を平らな円盤に変形。
3. メインパルス（最大30kW）が液滴に命中し、スズを20万〜50万°Cに加熱。
4. 生成されたプラズマが13.5nmを含む多波長の放射線を放出。
5. 楕円面集光ミラーがEUV光を集め、投影光学系へ導く。

エネルギー変換効率：わずか0.02〜0.05%。250WのEUV光を生成するために、電源は約1メガワットを消費する。スズデブリ問題は、水素ガスを流してスズと反応させ揮発性SnH₄として排気することで解決している。

---

## 史上最も精密な光学系

13.5nmを透過する材料は存在しないため、EUV光学系は完全反射型だ。投影システムの6枚のミラーはツァイスが製造し、Mo/Si多層コーティングを使用する：

- 40〜50対のMo/Siペア、各ペア約7nmの厚さ
- 各ミラーの反射率：最大約70%
- 6枚のミラー：0.70⁶ = 12%——入射光の12%のみがウェーハに到達

表面粗さ要件：0.1nm RMS未満——シリコン原子直径の半分以下。ツァイスはイオンビーム加工（IBF）と波面干渉計測によってこれを達成している。

ASMLの比喩：このミラーの一枚をドイツの大きさに拡大したとき、最大の表面の凹凸は1mm以下になる。

---

## 超高真空

EUV光は空気中で数ミリメートルで吸収される。光路全体を真空に保つ必要がある：

- 投影光学系：10⁻⁷〜10⁻⁸ mbar（大気圧の100億分の1以下）

これは低軌道宇宙空間に相当する真空度だ。

---

## 不可能な精度の機械メカニクス

ウェーハステージは時速3m/s、加速度50m/s²（5G）で動きながら、光学基準に対して1ナノメートル未満の位置精度を維持する。これは電磁浮上によって達成される——ステージは磁場上に浮かび、機械的接触ゼロで動作する。位置は2D回折エンコーダやレーザー干渉計でサブナノメートル分解能で測定される。

オーバーレイ（連続層間の位置合わせ精度）は、先端ノードでは2nm（3σ）以下が要求される。3nmトランジスタに対する3nmのオーバーレイ誤差はデバイス寸法の100%——壊滅的だ。


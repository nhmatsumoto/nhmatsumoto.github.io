## Real context

SOS Location needs to render 3D city models to simulate flood routes and tsunami reach. High-resolution LiDAR data covers less than 8% of Brazilian municipalities and costs R$15,000–R$80,000 per km². To cover all monitored regions, the cost would be prohibitive. The only universally available sources are 2D satellite images from OpenStreetMap and SRTM terrain elevation data (30 m resolution).

## Specific problem

2D images do not contain building height information. A reconstruction algorithm that ignores height produces completely flat models. For flood simulation, the height of obstacles — buildings, walls, urban hills — determines where water flows. Treating a city as a flat surface produces incorrect flood routes that can direct evacuations to more dangerous areas.

## Technical decision

Combine three sources to infer building height:
1. **Projected shadows**: for images with solar angle > 20°, building shadows encode height via trigonometry
2. **SRTM**: provides terrain elevation, determining whether the building is on a slope or flat ground
3. **Type heuristics**: `residential` → 8 m (2–3 floors), `commercial` → 20 m (4–8 floors), `industrial` → 12 m

## Implementation

```python

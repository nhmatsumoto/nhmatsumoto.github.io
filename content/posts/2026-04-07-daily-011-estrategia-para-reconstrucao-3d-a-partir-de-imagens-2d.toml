## Concrete example

Humaitá neighbourhood (Florianópolis): 1,847 buildings processed with a 10am image (solar angle 52°). Result: 1,203 buildings with shadow-based estimate (confidence ≥ 0.6), 644 by heuristic. Mean RMSE against available field survey: 2.3 m. For the flood simulation engine, a 2 m height error is tolerable when the terrain elevation variation in the neighbourhood is 8–35 m.

## Success criteria

RMSE < 3 m for buildings in regions with validation data. Coverage ≥ 80% of buildings in the area of interest. Processing time < 30 minutes for 2,000 buildings in a single Python process.

## Relation to SOS Location

The flood simulation engine uses these estimates as input to the cellular automata model: each 5×5 m cell receives the greater height between terrain elevation and building top. Without building height, the simulation treats walls and buildings as flat terrain — water flow would be incorrect for any evacuation decision.

The AI layer must not be treated as an oracle. It needs to declare inputs, assumptions, uncertainty, model version and operational limits. The goal is to support human decisions with computable evidence, not replace field command.

The core idea is to make **3D reconstruction strategy from 2D images** observable: there should be an artifact that another person can read, code can test or an operations team can validate. If the decision stays only in conversation, it does not scale and it does not create institutional learning.


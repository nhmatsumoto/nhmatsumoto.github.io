    source: str         # "shadow" | "heuristic"

def estimate_from_shadow(
    shadow_length_m: float,
    solar_elevation_deg: float
) -> Optional[float]:
    # 太陽高度角 < 20°の場合はNoneを返す（影が長すぎて不正確）
    if solar_elevation_deg < 20:
        return None
    height = shadow_length_m * math.tan(math.radians(solar_elevation_deg))
    return round(height, 1) if 2.0 <= height <= 200.0 else None

HEURISTICS = {
    "residential": (8.0, 0.40),
    "commercial":  (20.0, 0.35),
    "industrial":  (12.0, 0.38),
    "school":      (10.0, 0.42),
}

def estimate_building_height(
    building_type: str,
    shadow_length_m: float,
    solar_elevation_deg: float,
    building_id: str = ""
) -> BuildingHeightEstimate:
    shadow_h = estimate_from_shadow(shadow_length_m, solar_elevation_deg)
    if shadow_h is not None:
        return BuildingHeightEstimate(building_id, shadow_h, 0.75, "shadow")
    default_h, conf = HEURISTICS.get(building_type, (6.0, 0.30))
    return BuildingHeightEstimate(building_id, default_h, conf, "heuristic")
```

## 具体的な例

Humaitá地区（フロリアノーポリス）：午前10時の画像（太陽高度角52°）で1,847棟を処理。結果：1,203棟が影ベースの推定（confidence ≥ 0.6）、644棟がヒューリスティック。利用可能な現地調査データとの平均RMSE：2.3m。地区の地形標高変化が8〜35mの場合、洪水シミュレーションエンジンにとって2mの高さ誤差は許容できる。

## 成功基準

検証データが利用可能な地域の建物のRMSE < 3m。対象エリアの建物のカバレッジ ≥ 80%。単一のPythonプロセスで2,000棟の処理時間 < 30分。

## SOS Locationとの関係

洪水シミュレーションエンジンはこれらの推定値をセル状オートマトンモデルへの入力として使用する：各5×5mのセルは地形標高と建物頂部の高い方を受け取る。建物の高さなしでは、シミュレーションは壁と建物を平坦な地形として扱い、水の流れはいかなる避難決定においても誤ったものになる。

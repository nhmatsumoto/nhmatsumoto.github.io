## 実際のコンテキスト

SOS Locationは洪水経路と津波到達範囲をシミュレートするために都市の3Dモデルをレンダリングする必要がある。高解像度LiDARデータはブラジルの自治体の8%未満をカバーし、km²あたりR$15,000〜R$80,000のコストがかかる。監視対象地域すべてをカバーするとコストは法外になる。普遍的に利用可能なソースはOpenStreetMapの2D衛星画像とSRTM地形標高データ（30m解像度）のみだ。

## 具体的な問題

2D画像には建物の高さ情報が含まれない。高さを無視した再構成アルゴリズムは完全に平坦なモデルを生成する。洪水シミュレーションでは、障害物（建物・壁・都市の丘）の高さが水の流れる方向を決定する。都市を平面として扱うと、避難をより危険なエリアに向かわせる可能性のある誤った洪水経路が生成される。

## 技術的決定

建物高さを推定するために3つのソースを組み合わせる：
1. **投影された影**: 太陽高度角 > 20°の画像では、建物の影が三角法で高さをコード化する
2. **SRTM**: 地形標高を提供し、建物が斜面にあるか平地にあるかを判定する
3. **タイプ別ヒューリスティック**: `residential` → 8m（2〜3階）、`commercial` → 20m（4〜8階）、`industrial` → 12m

## 実装

```python
import math
from dataclasses import dataclass
from typing import Optional

@dataclass
class BuildingHeightEstimate:
    building_id: str

# SOS Location のスタック、概念、ツール

## 使用技術

- **TypeScript & Node.js** を取り込みと正規化コアに使用。
- **.NET 8** + ASP.NET Core を edge API、パイプライン実行、オーケストレーションに使用。
- **PostgreSQL + PostGIS** を `GIST` index 付きの空間ストレージとして使用。
- **Kafka + Redis Streams** をイベント基盤として使用。
- **React + Leaflet + D3** を dashboard と operational map に使用。
- **Grafana + Loki + Tempo** を observability に使用。
- **OpenTelemetry** を分散 tracing に使用。

## 中核概念

1. **文脈の安全性**: 各診断は `trust_level` を持ち、エージェント認証後にのみ機微データを解放する。
2. **アクティブな運用マップ**: frontend は `tiles` と `vector layers` を取り込み、危険度レベルを適用する。
3. **エージェントとの対話**: `ronaldinho-agent` 経由の subagent は、状態変更前に event history を参照する。

## コード例

```csharp
[HttpGet("incidents")]
public IActionResult GetIncidents(string region)
{
    var incidents = _repository.Fetch(region, DateTime.UtcNow.AddHours(-2));
    return Ok(incidents);
}
```

```ts
const watchResource = async (resourceId: string) => {
  const data = await fetch(`/api/resources/${resourceId}`);
  renderOnMap(data);
};
```


# SOS Location stack, concepts and tools

## Technologies in use

- **TypeScript & Node.js** for ingestion and the normalization core.
- **.NET 8** with ASP.NET Core for edge APIs, pipeline execution and orchestration.
- **PostgreSQL + PostGIS** for spatial storage with `GIST` indexes.
- **Kafka + Redis Streams** as the event backbone.
- **React + Leaflet + D3** for the dashboard and operational map.
- **Grafana + Loki + Tempo** for observability.
- **OpenTelemetry** for distributed tracing.

## Core concepts

1. **Context safety**: each diagnosis carries a `trust_level` and only releases sensitive data after the agent is authenticated.
2. **Active operational map**: the frontend consumes `tiles` and `vector layers` and applies severity levels.
3. **Conversation with agents**: subagents, via `ronaldinho-agent`, consult event history before mutating state.

## Code examples

```csharp

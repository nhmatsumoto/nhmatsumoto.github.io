body = '''
Este Daily aprofunda **Problemas de performance com renderização de camadas** dentro da trilha **mapas e visualização** do SOS Location.

## Descrição
O objetivo é transformar **Problemas de performance com renderização de camadas** em um artefato verificável no código, no contrato ou na operação.

## Fundamentos
Se o time não consegue responder quem decide, o que muda e como medir, **Problemas de performance com renderização de camadas** ainda está abstrato. A regra prática é manter o artefato perto do fluxo que ele altera.

## Fórmula
Leitura objetiva da decisão:
Custo = camadas × geometrias / zoom

## Diagrama
```mermaid
flowchart LR
  A["OpenStreetMap"] --> B["Camada base"]
  B --> C["Overlays"]
  C --> D["Hotspots e eventos"]
  D --> E["Atualização incremental"]
```

## Exemplo de implementação
```typescript
const map = L.map('D022ProblemasDePerformanceComRende-map');
const layer = L.layerGroup().addTo(map);

function addD022ProblemasDePerformanceComRende(lat: number, lng: number) {
  L.circleMarker([lat, lng], { radius: 8 }).addTo(layer);
}
```

## Como aplicar no SOS Location
- Defina o contrato mínimo para Problemas de performance com renderização de camadas.
- Registre a decisão onde a equipe realmente a mantém ao longo do tempo.
- Valide com dado real, teste ou consulta verificável.

## Erros comuns
- Carregar camadas demais antes de saber o zoom efetivo.
- Ignorar latência de rede e tamanho dos vetores.

## Critério de sucesso
A leitura fica fluida quando a interação continua responsiva em zoom e mobilidade reais.

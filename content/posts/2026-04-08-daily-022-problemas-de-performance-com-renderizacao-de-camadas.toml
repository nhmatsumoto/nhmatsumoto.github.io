  useEffect(() => {
    if (!mapRef) return;

    const renderer = L.canvas({ padding: 0.5 });
    const group    = L.featureGroup();

    for (const area of areas) {
      const color = RISK_COLORS[area.nivelRisco] ?? '#888';
      L.geoJSON(area.geometry, {
        renderer,
        style: { color, fillColor: color, fillOpacity: 0.4, weight: 1 },
      }).addTo(group);
    }

    group.addTo(mapRef);
    return () => { group.remove(); };
  }, [areas, mapRef]);

  return null;
}
```

```sql
-- GET /api/areas-de-risco が簡略化ジオメトリを返す
SELECT
    id, nivel_risco,
    ST_AsGeoJSON(ST_Simplify(geom, 0.0001)) AS geometry
FROM areas_de_risco
WHERE municipio_id = @municipioId
  AND nivel_risco >= @nivelMinimo;
```

## 具体的な例

サンパウロ、8,500ゾーンのロード：SVGデフォルト → 4.2秒フリーズ。Canvasレンダラー + ST_Simplify → 340ms。ジオメトリごとの平均頂点：1,200 → 35（97%削減）。ポリゴンDOMノード：8,500 → 1（単一キャンバス）。イベント中の`PessoaDesaparecida`マーカー：312ポイント → ズーム14まで数値カウントの8クラスターとして表示、その後個別に表示。

## 成功基準

Chrome 120+で8,500ポリゴンの全アクティブレイヤーの初期レンダリング時間 < 500ms。全レイヤーアクティブ時のパン/ズーム中に知覚可能なジャンクなし（フレームドロップ < 16ms）。ズーム ≤ 14で簡略化ジオメトリの視覚的忠実度がオリジナルと区別不可能。

## SOS Locationとの関係

4秒間フリーズするマップは緊急時に使用できない。4,200msと340msの差はパフォーマンス知覚ではない——フィールド更新を受けながらマップをナビゲートできるコーディネーターと、画面が応答するのを待つコーディネーターの差だ。

## 実際のコンテキスト

SOS Locationのマップは同時に表示する：`AreaDeRisco`ポリゴン（サンパウロでは最大8,500件）、`PessoaDesaparecida`マーカー（イベントごとに変動）、リアルタイム降水オーバーレイ。サンパウロの実データでの最初のテスト中、すべてのレイヤーをロードするとブラウザが4.2秒間フリーズした——即座の対応が必要な緊急コーディネーターには許容できない。

## 具体的な問題

LeafletはデフォルトでSVGを使ってベクタージオメトリをレンダリングする。各`AreaDeRisco`ポリゴンはDOMの`<path>`要素だ。8,500ポリゴンでは、DOMに8,500のSVG要素があった——ブラウザは初期レイアウトで要素ごとに約3msを費やし、最悪の場合合計25秒、平均ケースで4.2秒。さらに、PostGISからのポリゴンはジオメトリごとに最大1,200頂点があった（高精度の市区境界エクスポート）が、ズーム12での1,200頂点と20頂点の視覚的な差は知覚できない。

## 技術的決定

3つの同時変更：(1) SVGからLeafletのCanvasレンダラーに移行——8,500の`<path>`要素の代わりに単一の`<canvas>`要素、DOMノードを99.9%削減；(2) フロントエンドに送る前にPostGIS `ST_Simplify(geom, 0.0001)`でサーバー側のジオメトリを簡略化、平均頂点数を1,200から35に削減；(3) `Leaflet.markercluster`でマーカーをクラスタリング——20以上のマーカーが重なる場合に数値クラスターを表示。

## 実装

```tsx

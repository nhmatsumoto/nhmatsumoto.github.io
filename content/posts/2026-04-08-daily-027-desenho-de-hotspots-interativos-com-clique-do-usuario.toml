```

## 具体的な例

ペトロポリス（RJ）での作戦——コーディネーターがAlto da Serra地区に地滑りエリアをマーク。ポリゴンを描くために8回マップをクリック。計算された面積：0.34 km²。面積と設定フィールドを持つモーダルが表示。コーディネーターが`tipo=deslizamento, nivelRisco=9`を選択。180msでPOST。ホットスポットが即座にバーガンディ（#a81717）でマップに表示。SignalRで接続された他のコーディネーターが < 500msでホットスポットを受信。

## 成功基準

ポリゴン完成後100ms未満での視覚フィードバック付き最小面積バリデーション。モーダル確認後300ms未満でのホットスポット送信とマップ表示。UI経由で描画された`HotspotAtivo`の100%が有効なジオメトリ（自己交差なし）——Leaflet.Drawのネイティブバリデーションで保証。

## SOS Locationとの関係

マップに直接秒単位で`HotspotAtivo`をマークする能力——フォームなし、手動座標なし——は、フィールドで使用される緊急システムとデスクトップに留まるものの違いの1つだ。Leaflet.Draw + フロントエンドバリデーション + 即時POSTの統合は、コーディネーターの決定からチーム全員にホットスポットが見えるまで30秒未満でフロー全体を完了するように設計されている。

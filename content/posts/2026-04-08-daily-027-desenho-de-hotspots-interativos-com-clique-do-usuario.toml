## 実際のコンテキスト

緊急コーディネーターは作戦中にマップに`HotspotAtivo`をマークする必要がある：「この3ブロックのエリアに水がある」、「ここで道路封鎖」。lat/lonフィールドのテキストフォームでこれを行うのはストレス下では許容できない——コーディネーターはマップに直接描く必要がある。`HotspotAtivo`はドメインアグリゲート（`NivelRisco` 1〜10、ステータス`Ativo|Encerrado`、`Tipo: enchente|incendio|deslizamento`）で、描画後にバックエンドに永続化される必要がある。

## 具体的な問題

`Leaflet.Draw`はGeoJSONでジオメトリを生成するが、2つの統合問題がある：(1) `draw:created`イベントはLeafletオブジェクトを返し、送信可能なGeoJSONではない——バックエンドに送る前に`layer.toGeoJSON()`による変換が必要；(2) ユーザーは頻繁に誤って非常に小さなポリゴンを描く（面積 < 1,000 m²）、これは作戦には役立たないがデータベースノイズを生成する。バックエンドのみのバリデーションは遅いフィードバックを意味する——コーディネーターはすでに描画画面を離れている。

## 技術的決定

送信前のフロントエンドでの最小面積バリデーション付き`Leaflet.Draw`統合。面積はLeafletネイティブの`L.GeometryUtil.geodesicArea(layer.getLatLngs()[0])`でm²で計算。最小値：洪水`HotspotAtivo`に対して0.1 km²（100,000 m²）。`draw:created`後、計算された面積と`NivelRisco`・`Tipo`フィールドを持つ確認モーダルを表示。送信はGeoJSONをPOSTでバックエンドに送り、レスポンスには生成された`hotspotId`が含まれる——リロードなしで即座にLeafletレイヤーに追加。

## 実装

```tsx

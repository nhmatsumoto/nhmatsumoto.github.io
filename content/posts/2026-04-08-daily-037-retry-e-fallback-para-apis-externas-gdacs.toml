body_en_us = '''
## Real context

SOS Location consumes global alert data from GDACS (Global Disaster Alert and Coordination System) of the UN to detect seismic and tsunami events that may affect Brazil. GDACS has ~98.5% availability - good, but insufficient for an emergency platform. During the 1.5% downtime, GDACS is unavailable exactly when events may be occurring: traffic spikes after major global disasters overload the system.

## Specific problem

The first GDACS integration made a direct call with no failure handling. When GDACS returned an error (timeout, 503), the alert check job simply did not process data that cycle - no log, no retry, no fallback. In a 2025 incident, GDACS was unavailable for 45 minutes after an M7.9 earthquake in Japan. SOS Location missed 3 check cycles (90 minutes) without knowing - and potentially missed alerts about waves arriving in Brazil during that window.

## Technical decision

Polly `ResiliencePipeline` with: (1) exponential backoff retry - 3 attempts, delays of 2s, 8s, 32s (base 2, exponent = attempt - 1), 10% jitter; (2) circuit breaker - opens after 5 failures in 30 seconds, half-open after 60s; (3) Redis cache fallback - if the pipeline fails completely, uses the last successful result with a maximum age of 4 hours, tagged with `IsFromCache: true`. Cached alerts are processed but with an audit flag.

## Implementation

```csharp
_pipeline = new ResiliencePipelineBuilder()
    .AddRetry(new RetryStrategyOptions
    {
        MaxRetryAttempts = 3,
        BackoffType      = DelayBackoffType.Exponential,
        Delay            = TimeSpan.FromSeconds(2),
        UseJitter        = true,
    })
    .AddCircuitBreaker(new CircuitBreakerStrategyOptions
    {
        FailureRatio      = 0.5,
        MinimumThroughput = 5,
        SamplingDuration  = TimeSpan.FromSeconds(30),
        BreakDuration     = TimeSpan.FromSeconds(60),
    })
    .Build();

public async Task<GdacsAlertsResult> GetActiveAlertsAsync(CancellationToken ct)
{
    try
    {
        var response = await _pipeline.ExecuteAsync(
            async token => await _http.GetAsync("https://www.gdacs.org/xml/rss.xml", token), ct);

        var content = await ParseRssAsync(response);
        await _cache.SetAsync("gdacs:alerts", content, TimeSpan.FromHours(4), ct);
        return new GdacsAlertsResult(content, IsFromCache: false);
    }
    catch (Exception ex) when (ex is BrokenCircuitException or HttpRequestException)
    {
        var cached = await _cache.GetAsync<GdacsAlerts>("gdacs:alerts", ct);
        if (cached is not null)
            return new GdacsAlertsResult(cached, IsFromCache: true);

        throw new ExternalServiceUnavailableException("GDACS unavailable and no cache.", ex);
    }
}
```

## Concrete example

M7.9 Japan incident (simulation): GDACS returns 503 at 14:00. Polly retries: 2s → 503, 8s → 503, 32s → 503. Circuit breaker opens. Fallback: Redis returns cache from 14h ago with `IsFromCache: true`. Data processed, tsunami alerts based on 14h-old data (still valid - waves take 12+ hours to reach Brazil). Log records: `"GDACS unavailable at 14:00:00Z, using cache from 2025-04-10T00:00:00Z. Age: 14h."`. At 15:01 (60s circuit break), Polly retries - GDACS comes back, cache updated.

## Success criteria

Zero silent GDACS check cycle losses - every failure generates a Warning-level log. Cache fallback activated automatically when the pipeline fails. Circuit breaker reduces attempts during a prolonged outage (does not hammer GDACS with 3 retries every 30min cycle during a 1h outage).

## Relation to SOS Location

GDACS integration is the detection of external events affecting Brazil - earthquakes abroad that may generate tsunamis on the Brazilian coast. The resilience of this integration is not a quality feature - it is the difference between detecting a tsunami with 10 hours' notice and not detecting it due to an API timeout.

Este Daily aprofunda **Retry e fallback para APIs externas (GDACS)** dentro da trilha **Backend e APIs** do SOS Location. A ideia é sair de uma nota curta e transformar o item em material de referência para produto, engenharia e operação.

## Descrição
Evita que instabilidade de serviços externos interrompa o fluxo principal, usando retentativas controladas, cache e degradação segura.

## Fundamentos
APIs de crise precisam ser previsíveis, versionadas e observáveis. O contrato deve deixar claro autenticação, erros, idempotência, paginação e semântica dos campos para que clientes diferentes reajam da mesma forma.

O ponto central é tornar **Retry e fallback para APIs externas (GDACS)** observável: deve existir um artefato que possa ser lido por outra pessoa, testado por código ou validado por uma equipe operacional. Quando a decisão fica apenas na conversa, ela não escala e não cria aprendizado institucional.

## Modelo de decisão
A decisão pode ser avaliada com uma métrica simples:

$$
A = 1 - \prod_{i=1}^{n}(1 - a_i)
$$

Disponibilidade composta ajuda a raciocinar sobre fallback: serviços redundantes aumentam chance de resposta quando bem isolados.

## Diagrama de fluxo
```mermaid
flowchart LR
  A["Sinal de campo"] --> B["Retry e fallback para APIs externas (GDACS)"]
  B --> C["Contrato verificável"]
  C --> D["Implementação incremental"]
  D --> E["Métrica operacional"]
```

## Gráfico de maturidade
```mermaid

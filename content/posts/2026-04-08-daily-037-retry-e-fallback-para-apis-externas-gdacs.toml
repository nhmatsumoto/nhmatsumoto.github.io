## 実際のコンテキスト

SOS Locationはブラジルに影響を与える可能性のある地震や津波イベントを検出するために、国連のGDACS（Global Disaster Alert and Coordination System）からグローバルアラートデータを消費する。GDACSの可用性は~98.5%--良いが、緊急プラットフォームには不十分。1.5%のダウンタイム中、GDACSはイベントが起きている可能性があるまさにその時に利用不能になる：大規模な世界的災害後のトラフィックスパイクがシステムを過負荷にする。

## 具体的な問題

最初のGDACS統合は障害処理なしで直接呼び出しをしていた。GDACSがエラーを返す（タイムアウト、503）と、アラートチェックジョブはそのサイクルのデータを単に処理しなかった--ログなし、リトライなし、フォールバックなし。2025年のインシデントで、日本でのM7.9地震後にGDACSが45分間利用不能になった。SOS Locationは知らずに3回のチェックサイクル（90分）を見逃した--そしてその間にブラジルに到達した波のアラートを潜在的に見逃した。

## 技術的決定

Polly `ResiliencePipeline`：(1) 指数バックオフリトライ--3回の試行、2秒・8秒・32秒の遅延（底2、指数=試行-1）、10%のジッター；(2) サーキットブレーカー--30秒間に5回の失敗後にオープン、60秒後にハーフオープン；(3) Redisキャッシュフォールバック--パイプラインが完全に失敗すると、最大4時間の最後の成功した結果を使用し、`IsFromCache: true`でタグ付け。キャッシュされたアラートは処理されるが監査フラグ付き。

## 実装

```csharp
_pipeline = new ResiliencePipelineBuilder()
    .AddRetry(new RetryStrategyOptions
    {
        MaxRetryAttempts = 3,
        BackoffType      = DelayBackoffType.Exponential,
        Delay            = TimeSpan.FromSeconds(2),
        UseJitter        = true,
    })
    .AddCircuitBreaker(new CircuitBreakerStrategyOptions
    {
        FailureRatio      = 0.5,
        MinimumThroughput = 5,
        SamplingDuration  = TimeSpan.FromSeconds(30),
        BreakDuration     = TimeSpan.FromSeconds(60),
    })
    .Build();

public async Task<GdacsAlertsResult> GetActiveAlertsAsync(CancellationToken ct)
{
    try
    {
        var response = await _pipeline.ExecuteAsync(
            async token => await _http.GetAsync("https://www.gdacs.org/xml/rss.xml", token), ct);

        var content = await ParseRssAsync(response);
        await _cache.SetAsync("gdacs:alerts", content, TimeSpan.FromHours(4), ct);
        return new GdacsAlertsResult(content, IsFromCache: false);
    }
    catch (Exception ex) when (ex is BrokenCircuitException or HttpRequestException)
    {
        var cached = await _cache.GetAsync<GdacsAlerts>("gdacs:alerts", ct);
        if (cached is not null)
            return new GdacsAlertsResult(cached, IsFromCache: true);

        throw new ExternalServiceUnavailableException("GDACSが利用不能でキャッシュなし。", ex);
    }
}
```

## 具体的な例

日本M7.9インシデント（シミュレーション）：GDACSが14:00に503を返す。Pollyがリトライ：2秒 → 503、8秒 → 503、32秒 → 503。サーキットブレーカーがオープン。フォールバック：Redisが`IsFromCache: true`で14時間前のキャッシュを返す。14時間前のデータ（まだ有効--波がブラジルに到達するまで12時間以上かかる）に基づいてデータが処理され、津波アラートが送信。ログに記録：`「GDACSは14:00:00Zに利用不能、2025-04-10T00:00:00Zのキャッシュを使用。年齢：14時間。」`。15:01（60秒のサーキットブレイク）にPollyが再試行--GDACSが復旧、キャッシュが更新。

## 成功基準

GDACSチェックサイクルのサイレントな損失ゼロ--すべての失敗がWARNINGレベルのログを生成。パイプライン失敗時にキャッシュフォールバックが自動的にアクティブ化。サーキットブレーカーが長時間のアウタージ中に試行を削減する（1時間のアウタージ中に30分サイクルごとに3回リトライでGDACSを叩き続けない）。

## SOS Locationとの関係

GDACS統合はブラジルに影響する外部イベントの検出だ--海外での地震がブラジルの海岸に津波を引き起こす可能性がある。この統合のレジリエンスは品質機能ではなく--APIタイムアウトによって検出できないことと10時間前に津波を検出することの差だ。
'''

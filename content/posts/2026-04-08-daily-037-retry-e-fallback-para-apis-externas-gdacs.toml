This Daily expands **Retry and fallback for external APIs such as GDACS** within the **Backend and APIs** track of SOS Location. The goal is to turn a short note into reference material for product, engineering and operations.

## Description
Covers Retry and fallback for external APIs such as GDACS in SOS Location with context, operational criteria, diagrams, formulas and implementation examples.

## Fundamentals
Crisis APIs need to be predictable, versioned and observable. The contract must clarify authentication, errors, idempotency, pagination and field semantics so different clients react consistently.

The core idea is to make **Retry and fallback for external APIs such as GDACS** observable: there should be an artifact that another person can read, code can test or an operations team can validate. If the decision stays only in conversation, it does not scale and it does not create institutional learning.

## Decision model
The decision can be evaluated with a simple metric:

$$
A = 1 - \prod_{i=1}^{n}(1 - a_i)
$$

Composite availability helps reason about fallback: redundant services increase the chance of response when they are properly isolated.

## Flow diagram
```mermaid
flowchart LR
  A["Field signal"] --> B["Retry and fallback for external APIs such as GDACS"]
  B --> C["Verifiable contract"]
  C --> D["Incremental implementation"]
  D --> E["Operational metric"]
```


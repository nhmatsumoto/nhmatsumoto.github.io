O Flutter mudou a forma como criamos apps. Ele não usa componentes nativos do sistema, mas sim o seu próprio motor de renderização (**Skia/Impeller**). E o coração disso tudo é o **Dart**.

## Dart: O Segredo do Hot Reload

O Dart foi desenhado para duas coisas: compilação rápida durante o desenvolvimento (**JIT**) e performance nativa na produção (**AOT**).

*   **JIT (Just-In-Time)**: Permite o famoso *Hot Reload*, mudando a UI em milissegundos sem perder o estado do app.
*   **AOT (Ahead-Of-Time)**: Compila o código para ARM/x64 nativo, garantindo 60 (ou 120) FPS constantes.

```mermaid
graph TD
    A[Código Dart] -->|Dev Mode| B[JIT - Hot Reload]
    A -->|Release Mode| C[AOT - Nativo]
    C --> D[Motor Flutter]
    D --> E[Skia/Impeller]
    E --> F[Tela do Device]
```

### Composição em vez de Herança: Tudo é um Widget

No Flutter, tudo é um widget. O layout é construído por uma árvore de composição, facilitando a criação de interfaces ricas e complexas.

### O Poder do Null Safety

O Dart moderno possui **Sound Null Safety**. Isso significa que o compilador garante que você nunca terá um erro de "null pointer exception" em tempo de execução, tornando o app muito mais estável.

## Conclusão

Flutter + Dart oferecem a melhor experiência de desenvolvimento do mercado hoje. Se você busca performance próximo ao nativo com a produtividade de um framework cross-platform, este é o caminho.

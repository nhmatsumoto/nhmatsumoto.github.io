status = "published"
tags = ["microservices", "event_driven", "consistency"]
body = '''
## Problema
Salvar no banco e publicar evento não é atômico.

## Solução
Outbox.

## Fluxo
1. Salva dados + evento na mesma transação
2. Worker publica evento

## Insight
Outbox elimina inconsistência entre DB e mensageria.
'''


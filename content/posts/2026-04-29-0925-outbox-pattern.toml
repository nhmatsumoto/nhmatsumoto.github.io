body = '''
Considere o trecho mais comum de uma arquitetura orientada a eventos:

```csharp
await _db.SaveChangesAsync();          // 1. grava o pedido no banco
await _broker.PublishAsync(orderEvt);  // 2. publica o evento
```

Parece inocente. Não é. Esses dois passos vivem em sistemas diferentes (banco e *message broker*) e **não compartilham uma transação**. Esse é o **problema da dupla escrita**, e ele tem dois modos de falha catastróficos.

## As duas falhas que ninguém vê em dev

- **Falha A — evento fantasma:** o passo 1 dá *commit*, mas o processo morre antes do passo 2. O pedido existe no banco, mas o resto do sistema nunca soube. O estoque não foi reservado, o e-mail nunca saiu.
- **Falha B — evento órfão:** você inverte a ordem (publica primeiro), o passo 2 envia o evento, e então o passo 1 faz *rollback*. O sistema reagiu a um pedido que **não existe**.

Não há ordem de chamadas que resolva isso. Você não pode tornar atômicas duas operações em sistemas distintos sem coordenação. O *Two-Phase Commit* (2PC) tentaria, mas é lento, frágil e raramente suportado por brokers modernos.

## A ideia central do Outbox

Se não podemos escrever atomicamente no banco **e** no broker, então **só escrevemos no banco** — e tornamos o evento parte dessa mesma escrita. O broker entra depois, de forma assíncrona.

```sql
-- Tudo numa ÚNICA transação ACID:
BEGIN;
  INSERT INTO orders (id, customer_id, total) VALUES (...);
  INSERT INTO outbox_messages (id, type, payload, created_at, status)
  VALUES (gen_random_uuid(), 'OrderConfirmed', '{...}', now(), 'pending');
COMMIT;
```

Como `orders` e `outbox_messages` estão no mesmo banco, ou os dois são gravados, ou nenhum é. A inconsistência da dupla escrita desaparece por construção.

## Tirando o evento de dentro do banco

Um processo separado lê a tabela outbox e publica no broker. Há duas formas:

| Abordagem | Como funciona | Trade-off |
| :--- | :--- | :--- |
| **Polling Publisher** | Worker faz `SELECT ... WHERE status='pending'` em loop | Simples, mas adiciona latência e carga de polling |
| **Transaction Log Tailing (CDC)** | Ferramenta lê o WAL/binlog (ex.: Debezium) | Baixa latência, sem polling; mais infra |

```csharp
// Polling publisher (simplificado)
var pending = await _db.Outbox
    .Where(m => m.Status == "pending")
    .OrderBy(m => m.CreatedAt).Take(100).ToListAsync();

foreach (var msg in pending)
{
    await _broker.PublishAsync(msg.Type, msg.Payload);
    msg.Status = "published";   // ou DELETE
}
await _db.SaveChangesAsync();
```

## O detalhe que todo mundo esquece: at-least-once

Entre "publiquei no broker" e "marquei como publicado" existe uma janela. Se o worker morre nela, o evento será publicado **de novo** na próxima rodada. O Outbox garante **at-least-once**, nunca *exactly-once*.

A consequência é direta: **todo consumidor precisa ser idempotente**. O Outbox resolve o lado do produtor (o evento nunca se perde); a idempotência do consumidor resolve o lado do receptor (o evento duplicado não causa dano). Os dois padrões são complementares — um sem o outro é incompleto.

## Conclusão

O Outbox Pattern troca um problema impossível (atomicidade entre dois sistemas) por um problema tratável (entrega assíncrona com duplicatas). Você ganha a garantia de que **nenhum evento se perde** ao custo de uma tabela extra, um worker e o requisito de consumidores idempotentes. Em qualquer sistema onde "gravou no banco mas o evento não saiu" seja inaceitável — pagamentos, pedidos, qualquer fluxo crítico — o Outbox deixou de ser opcional.
'''
body_en_us = '''
Consider the most common snippet in an event-driven architecture:

```csharp
await _db.SaveChangesAsync();          // 1. write the order to the DB
await _broker.PublishAsync(orderEvt);  // 2. publish the event
```

It looks innocent. It isn't. These two steps live in different systems (the database and the message broker) and **share no transaction**. This is the **dual-write problem**, and it has two catastrophic failure modes.

## The two failures you never see in dev

- **Failure A — ghost event:** step 1 commits, but the process dies before step 2. The order exists in the database, but the rest of the system never heard about it. Inventory wasn't reserved, the email never went out.
- **Failure B — orphan event:** you flip the order (publish first), step 2 sends the event, and then step 1 rolls back. The system reacted to an order that **doesn't exist**.

No ordering of the calls fixes this. You cannot make two operations across distinct systems atomic without coordination. Two-Phase Commit (2PC) would try, but it's slow, fragile, and rarely supported by modern brokers.

## The core idea of the Outbox

If we can't atomically write to the database **and** the broker, then **we only write to the database** — and we make the event part of that same write. The broker comes later, asynchronously.

```sql
-- All in a SINGLE ACID transaction:
BEGIN;
  INSERT INTO orders (id, customer_id, total) VALUES (...);
  INSERT INTO outbox_messages (id, type, payload, created_at, status)
  VALUES (gen_random_uuid(), 'OrderConfirmed', '{...}', now(), 'pending');
COMMIT;
```

Because `orders` and `outbox_messages` are in the same database, either both are written or neither is. The dual-write inconsistency disappears by construction.

## Getting the event out of the database

A separate process reads the outbox table and publishes to the broker. There are two ways:

| Approach | How it works | Trade-off |
| :--- | :--- | :--- |
| **Polling Publisher** | Worker runs `SELECT ... WHERE status='pending'` in a loop | Simple, but adds latency and polling load |
| **Transaction Log Tailing (CDC)** | A tool reads the WAL/binlog (e.g., Debezium) | Low latency, no polling; more infrastructure |

```csharp
// Polling publisher (simplified)
var pending = await _db.Outbox
    .Where(m => m.Status == "pending")
    .OrderBy(m => m.CreatedAt).Take(100).ToListAsync();

foreach (var msg in pending)
{
    await _broker.PublishAsync(msg.Type, msg.Payload);
    msg.Status = "published";   // or DELETE
}
await _db.SaveChangesAsync();
```

## The detail everyone forgets: at-least-once

Between "I published to the broker" and "I marked it as published" there is a window. If the worker dies inside it, the event will be published **again** on the next round. The Outbox guarantees **at-least-once**, never *exactly-once*.

The consequence is direct: **every consumer must be idempotent**. The Outbox solves the producer side (the event is never lost); consumer idempotency solves the receiver side (the duplicate event does no harm). The two patterns are complementary — one without the other is incomplete.

## Conclusion

The Outbox Pattern swaps an impossible problem (atomicity across two systems) for a tractable one (asynchronous delivery with duplicates). You gain the guarantee that **no event is ever lost** at the cost of one extra table, a worker, and the requirement of idempotent consumers. In any system where "saved to the DB but the event never fired" is unacceptable — payments, orders, any critical flow — the Outbox is no longer optional.
'''
body_ja_jp = '''
イベント駆動アーキテクチャで最も一般的なコードを考えてみましょう。

```csharp
await _db.SaveChangesAsync();          // 1. 注文を DB に書き込む
await _broker.PublishAsync(orderEvt);  // 2. イベントを発行する
```

無害に見えます。違います。この 2 つのステップは異なるシステム（データベースとメッセージブローカー）に存在し、**トランザクションを共有しません**。これが **二重書き込み問題** であり、2 つの破滅的な障害モードを持ちます。

## 開発では決して見えない 2 つの障害

- **障害 A ── 幽霊イベント:** ステップ 1 がコミットするが、ステップ 2 の前にプロセスが死ぬ。注文は DB に存在するが、システムの他の部分は知らない。在庫は予約されず、メールも送られない。
- **障害 B ── 孤児イベント:** 順序を入れ替え（先に発行）、ステップ 2 がイベントを送り、その後ステップ 1 がロールバックする。システムは **存在しない** 注文に反応した。

呼び出し順序を変えても解決しません。協調なしに、異なるシステムをまたぐ 2 つの操作を原子的にはできません。2 フェーズコミット（2PC）は試みますが、遅く、脆く、現代のブローカーではほとんどサポートされません。

## Outbox の核心アイデア

データベース **と** ブローカーへ原子的に書けないなら、**データベースだけに書く** ── そしてイベントをその同じ書き込みの一部にします。ブローカーは後から非同期に入ります。

```sql
-- すべてを単一の ACID トランザクションで:
BEGIN;
  INSERT INTO orders (id, customer_id, total) VALUES (...);
  INSERT INTO outbox_messages (id, type, payload, created_at, status)
  VALUES (gen_random_uuid(), 'OrderConfirmed', '{...}', now(), 'pending');
COMMIT;
```

`orders` と `outbox_messages` は同じデータベースにあるため、両方書かれるか、どちらも書かれないかのどちらかです。二重書き込みの不整合は、構造上消滅します。

## イベントをデータベースから取り出す

別プロセスが outbox テーブルを読み、ブローカーへ発行します。2 つの方法があります。

| 方式 | 仕組み | トレードオフ |
| :--- | :--- | :--- |
| **ポーリングパブリッシャ** | ワーカーが `SELECT ... WHERE status='pending'` をループ実行 | 単純だが、レイテンシとポーリング負荷が増える |
| **トランザクションログ追尾（CDC）** | ツールが WAL/binlog を読む（例：Debezium） | 低レイテンシ、ポーリング不要。インフラは増える |

```csharp
// ポーリングパブリッシャ（簡略化）
var pending = await _db.Outbox
    .Where(m => m.Status == "pending")
    .OrderBy(m => m.CreatedAt).Take(100).ToListAsync();

foreach (var msg in pending)
{
    await _broker.PublishAsync(msg.Type, msg.Payload);
    msg.Status = "published";   // または DELETE
}
await _db.SaveChangesAsync();
```

## 誰もが忘れる細部：at-least-once

「ブローカーへ発行した」と「発行済みと印を付けた」の間に窓があります。その中でワーカーが死ぬと、イベントは次のラウンドで **再び** 発行されます。Outbox は **at-least-once** を保証し、*exactly-once* は決して保証しません。

帰結は直接的です。**すべてのコンシューマは冪等でなければならない**。Outbox はプロデューサ側を解決し（イベントは決して失われない）、コンシューマの冪等性は受信側を解決します（重複イベントが害を成さない）。2 つのパターンは相補的であり、片方だけでは不完全です。

## 結論

Outbox パターンは、不可能な問題（2 つのシステムをまたぐ原子性）を、扱える問題（重複を伴う非同期配信）に置き換えます。**イベントが決して失われない** という保証を、テーブル 1 つ、ワーカー 1 つ、そして冪等なコンシューマという要件と引き換えに得ます。「DB には保存されたのにイベントが出なかった」が許されないあらゆるシステム ── 決済、注文、あらゆる重要なフロー ── において、Outbox はもはや任意ではありません。
'''

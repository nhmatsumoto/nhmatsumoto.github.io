## 実際のコンテキスト

SOS Locationは作戦フェーズによって3つの異なるスケールで使用される：広域ビュー（複数市町村を評価する都道府県コーディネーター、ズーム8〜9）、市町村ビュー（1つの市町村に集中するコーディネーター、ズーム11〜13）、ストリートビュー（救助チームをガイドするコーディネーター、ズーム15+）。各スケールには異なる情報ニーズがある——ズーム8で8,500の詳細ポリゴンを表示するのは視覚的にも計算的にも不可能だ。

## 具体的な問題

LODなしでは、システムはズームに関わらず8,500の完全なポリゴンをすべて送っていた。ズーム8では、サンパウロの地区の50 m²ポリゴンが重なり合う1pxのドットとして表示——視覚的に役に立たない——一方で3.4MBのGeoJSONと340msのレンダリングを消費した。概要が必要な都道府県コーディネーターは、見ることさえできないデータによる遅いインターフェースに行き詰まった。

## 技術的決定

LeafletのイベントZoom終了で制御される3つのLODレイヤー：
- **ズーム ≤ 10**：各ヘキサゴン内の`AreaDeRisco`の平均`NivelRisco`に比例した色のH3六角形（解像度5、~252 km²）。データ：エンドポイント`/api/risk-summary/h3?resolution=5`。ロード：ブラジル全体で < 200六角形。
- **ズーム11〜13**：~8頂点の簡略化ポリゴン`ST_Simplify(geom, 0.001)`。エンドポイント`/api/areas-de-risco?simplified=true`。
- **ズーム ≥ 14**：~35頂点の完全ジオメトリ`ST_Simplify(geom, 0.0001)`、クリックで詳細ポップアップ。

## 実装

```tsx
function getLodLevel(zoom: number): LODLevel {
  if (zoom <= 10) return 'h3';
  if (zoom <= 13) return 'simplified';
  return 'full';
}

export function AdaptiveRiskLayer({ municipioId }: { municipioId: string }) {
  const mapInstance = useMapStore((s) => s.mapInstance);
  const [lod, setLod] = useState<LODLevel>('simplified');

  useEffect(() => {
    if (!mapInstance) return;
    const onZoomEnd = () => setLod(getLodLevel(mapInstance.getZoom()));
    mapInstance.on('zoomend', onZoomEnd);
    return () => { mapInstance.off('zoomend', onZoomEnd); };
  }, [mapInstance]);

  useEffect(() => {
    if (!mapInstance) return;
    const group = L.featureGroup().addTo(mapInstance);

    if (lod === 'h3') {
      fetchH3Summary().then((hexes) => {
        hexes.forEach((hex) => {
          const color = RISK_COLORS[Math.round(hex.avgRisk)] ?? '#888';
          L.geoJSON(hex.geometry, {
            style: { color, fillColor: color, fillOpacity: 0.5, weight: 0 },
          }).bindTooltip(`リスク: ${hex.avgRisk.toFixed(1)}`).addTo(group);
        });
      });
    } else if (lod === 'simplified') {
      fetchAreasSimplified(municipioId).then((areas) => renderAreas(areas, group, false));
    } else {
      fetchAreasFull(municipioId).then((areas) => renderAreas(areas, group, true));
    }

    return () => { group.remove(); };
  }, [lod, municipioId, mapInstance]);

  return null;

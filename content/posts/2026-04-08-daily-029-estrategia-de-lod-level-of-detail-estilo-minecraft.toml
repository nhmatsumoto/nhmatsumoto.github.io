```

## 具体的な例

ズーム9のサンタカタリーナ州コーディネーター：州全体をカバーする47のH3六角形、各々が平均リスクに比例した色。ロードされたデータ：18 KB。レンダリング：12ms。ズーム12（ブルメナウにフォーカス）：1,240の簡略化ポリゴンがロード、180ms。ズーム15（特定の通り）：89の表示ゾーンの完全ジオメトリ、クリックでポップアップアクティブ。

## 成功基準

LOD遷移 < 300ms（レイヤー切り替え + バックエンドリクエスト）。LOD切り替え時に知覚可能な視覚フラッシュなし（150msのフェードアウト/イン）。LODごとのデータロード：H3 < 50 KB、simplified < 500 KB、large市町村でfull < 2 MB。

## SOS Locationとの関係

LODはMinecraftが何百万ブロックの世界をレンダリングするために使う戦略と同じだ：異なる距離に対して異なるレベルの詳細。SOS Locationでは、「距離」はズームであり——各ズームレベルは異なる情報ニーズを持つ実際の作戦スケールに対応する。

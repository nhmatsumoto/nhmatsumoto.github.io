    mapInstance.on('zoomend', onZoomEnd);
    return () => { mapInstance.off('zoomend', onZoomEnd); };
  }, [mapInstance]);

  useEffect(() => {
    if (!mapInstance) return;
    groupRef.current?.remove();
    const group = L.featureGroup().addTo(mapInstance);
    groupRef.current = group;

    if (lod === 'h3') {
      fetchH3Summary().then((hexes) => {
        hexes.forEach((hex) => {
          const color = RISK_COLORS[Math.round(hex.avgRisk)] ?? '#888';
          L.geoJSON(hex.geometry, {
            style: { color, fillColor: color, fillOpacity: 0.5, weight: 0 },
          }).bindTooltip(`Risk: ${hex.avgRisk.toFixed(1)}`).addTo(group);
        });
      });
    } else if (lod === 'simplified') {
      fetchAreasSimplified(municipioId).then((areas) => renderAreas(areas, group, false));
    } else {
      fetchAreasFull(municipioId).then((areas) => renderAreas(areas, group, true));
    }

    return () => { group.remove(); };
  }, [lod, municipioId, mapInstance]);

  return null;
}
```

## Concrete example

Santa Catarina state coordinator at zoom 9: 47 H3 hexagons covering the entire state, each with colour proportional to average risk. Data loaded: 18 KB. Rendering: 12ms. Zoom to 12 (focus on Blumenau): 1,240 simplified polygons loaded, 180ms. Zoom to 15 (specific street): full geometry of 89 visible zones, popup active on click.

## Success criteria

LOD transition < 300ms (layer swap + backend request). No perceptible visual flash when switching LOD (150ms fade out/in). Data load per LOD: H3 < 50 KB, simplified < 500 KB, full < 2 MB for large municipalities.

## Relation to SOS Location

LOD is the same strategy Minecraft uses to render worlds of millions of blocks: different levels of detail for different distances. In SOS Location, "distance" is zoom — and each zoom level corresponds to a real operational scale with distinct information needs.

## Real context

SOS Location is used at three different scales depending on the operation phase: regional view (state coordinator assessing multiple municipalities, zoom 8–9), municipal view (coordinator focusing on one municipality, zoom 11–13), and street view (coordinator guiding a rescue team, zoom 15+). Each scale has different information needs — displaying 8,500 detailed polygons at zoom 8 would be both visually and computationally impossible.

## Specific problem

Without LOD, the system sent all 8,500 complete polygons regardless of zoom. At zoom 8, 50 m² polygons of São Paulo neighbourhoods appeared as overlapping 1px dots — visually useless — while consuming 3.4 MB of GeoJSON and 340ms of rendering. State coordinators who needed an overview were stuck with a slow interface due to data they could not even see.

## Technical decision

Three LOD layers controlled by Leaflet's `zoomend` event:
- **Zoom ≤ 10**: H3 hexagons at resolution 5 (~252 km² each) with colour proportional to the average `NivelRisco` of `AreaDeRisco` within the hexagon. Data: endpoint `/api/risk-summary/h3?resolution=5`. Load: < 200 hexagons for all of Brazil.
- **Zoom 11–13**: simplified polygons `ST_Simplify(geom, 0.001)` with ~8 average vertices. Endpoint `/api/areas-de-risco?simplified=true`.
- **Zoom ≥ 14**: full geometry `ST_Simplify(geom, 0.0001)` with ~35 vertices, detail popup on click.

## Implementation

```tsx

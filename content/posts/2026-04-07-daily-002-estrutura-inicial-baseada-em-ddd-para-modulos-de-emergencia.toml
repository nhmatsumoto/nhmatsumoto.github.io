body = '''
Este Daily aprofunda **Estrutura inicial baseada em DDD para módulos de emergência** dentro da trilha **arquitetura** do SOS Location.

## Descrição
O objetivo é transformar **Estrutura inicial baseada em DDD para módulos de emergência** em um artefato verificável no código, no contrato ou na operação.

## Fundamentos
Se o time não consegue responder quem decide, o que muda e como medir, **Estrutura inicial baseada em DDD para módulos de emergência** ainda está abstrato. A regra prática é manter o artefato perto do fluxo que ele altera.

## Fórmula
Leitura objetiva da decisão:
Clareza = (fronteiras + contratos) / acoplamento

## Diagrama
```mermaid
flowchart LR
  A["Descoberta do domínio"] --> B["Linguagem comum"]
  B --> C["Boundary"]
  C --> D["Contrato testável"]
  D --> E["Evolução controlada"]
```

## Exemplo de implementação
```csharp
public sealed record D002EstruturaInicialBaseadaEmDddPaDecision(string Boundary, string Owner, string ExpectedOutcome);

public static class D002EstruturaInicialBaseadaEmDddPaPolicy
{
    public static bool IsReady(D002EstruturaInicialBaseadaEmDddPaDecision decision)
        => !string.IsNullOrWhiteSpace(decision.Boundary)
        && !string.IsNullOrWhiteSpace(decision.Owner)
        && !string.IsNullOrWhiteSpace(decision.ExpectedOutcome);
}
```

## Como aplicar no SOS Location
- Defina o contrato mínimo para Estrutura inicial baseada em DDD para módulos de emergência.
- Registre a decisão onde a equipe realmente a mantém ao longo do tempo.
- Valide com dado real, teste ou consulta verificável.

## Erros comuns
- Misturar regra de negócio, integração e UI no mesmo módulo.
- Não nomear dono, fronteira e comportamento esperado.

## Critério de sucesso
O tema está pronto quando a equipe explica a fronteira, testa o contrato e mede a regressão.
'''
body_en_us = '''
This Daily expands **Initial DDD-based structure for emergency modules** within the **architecture** track of SOS Location.

## Description
The goal is to turn **Initial DDD-based structure for emergency modules** into a verifiable artifact in code, contract, or operations.

## Fundamentals
If the team cannot answer who decides, what changes, and how to measure it, **Initial DDD-based structure for emergency modules** is still abstract. The practical rule is to keep the artifact close to the flow it changes.

## Formula
Practical reading of the decision:
Clarity = (boundaries + contracts) / coupling

## Flow diagram
```mermaid
flowchart LR
  A["Descoberta do domínio"] --> B["Linguagem comum"]
  B --> C["Boundary"]
  C --> D["Contrato testável"]
  D --> E["Evolução controlada"]
```

## Implementation example
```csharp
public sealed record D002EstruturaInicialBaseadaEmDddPaDecision(string Boundary, string Owner, string ExpectedOutcome);

public static class D002EstruturaInicialBaseadaEmDddPaPolicy
{
    public static bool IsReady(D002EstruturaInicialBaseadaEmDddPaDecision decision)
        => !string.IsNullOrWhiteSpace(decision.Boundary)
        && !string.IsNullOrWhiteSpace(decision.Owner)
        && !string.IsNullOrWhiteSpace(decision.ExpectedOutcome);
}
```

## How to apply it in SOS Location
- Define the minimum contract for Initial DDD-based structure for emergency modules.
- Record the decision where the team actually keeps it over time.
- Validate it with real data, a test, or a verifiable query.

## Common pitfalls
- Mixing business rules, integration, and UI in the same module.
- Failing to name the owner, boundary, and expected behavior.

## Success criteria
The topic is ready when the team can explain the boundary, test the contract, and measure regressions.

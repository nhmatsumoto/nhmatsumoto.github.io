body = '''
## Contexto real

O backend do SOS Location começou como um projeto único com controllers, services e repositories misturados. Três meses depois, o endpoint `POST /emergency` tinha 400 linhas, chamava serviços de alerta, de busca e de pagamento no mesmo método. Cada mudança quebrava algo inesperado em outro módulo.

## Problema específico

A regra de negócio "ao registrar uma pessoa desaparecida, notificar automaticamente os resgatadores num raio de 2 km" estava espalhada por três classes: `EmergencyController`, `NotificationService` e `UserRepository`. Para alterar o raio de 2 km para 3 km, era necessário localizar e editar código em dois arquivos diferentes. A lógica de notificação de resgate dependia da estrutura interna de `PessoaDesaparecida`, criando acoplamento direto entre módulos que deveriam ser independentes.

## Decisão técnica

Três módulos independentes, cada um com seu próprio aggregate root, sem dependência direta entre eles. Integração exclusivamente via eventos de domínio.

- `SosLocation.Busca` → aggregate root: `PessoaDesaparecida`
- `SosLocation.Resgate` → aggregate root: `OperacaoDeResgate`
- `SosLocation.Alertas` → aggregate root: `AlertaDeEmergencia`

## Implementação

```csharp
// SosLocation.Busca/Domain/PessoaDesaparecida.cs
public sealed class PessoaDesaparecida : AggregateRoot
{
    public PessoaDesaparecidaId Id     { get; private set; }
    public string Nome                 { get; private set; }
    public Coordenadas UltimaLocalizacao { get; private set; }
    public StatusBusca Status          { get; private set; }

    private PessoaDesaparecida() { }

    public static PessoaDesaparecida Reportar(string nome, Coordenadas loc)
    {
        var pessoa = new PessoaDesaparecida
        {
            Id               = PessoaDesaparecidaId.New(),
            Nome             = nome,
            UltimaLocalizacao = loc,
            Status           = StatusBusca.Reportada
        };
        pessoa.AddDomainEvent(new PessoaDesaparecidaReportadaEvent(pessoa.Id, loc));
        return pessoa;
    }
}

// SosLocation.Alertas/Application/EnviarAlertaHandler.cs
public sealed class EnviarAlertaHandler
    : INotificationHandler<PessoaDesaparecidaReportadaEvent>
{
    private readonly IAlertaService _alertaService;

    public EnviarAlertaHandler(IAlertaService alertaService)
        => _alertaService = alertaService;

    public async Task Handle(
        PessoaDesaparecidaReportadaEvent evento,
        CancellationToken ct)
    {
        // Alertas não acessa PessoaDesaparecida diretamente;
        // recebe apenas os dados necessários via evento
        await _alertaService.BroadcastParaAreaAsync(
            evento.Localizacao,
            raioKm: 3.0,
            ct);
    }
}
```

## Exemplo concreto

Quando o raio de notificação mudou de 2 km para 3 km por decisão operacional da coordenação, a mudança foi em uma única linha em `EnviarAlertaHandler`. Nenhum arquivo do módulo `Busca` ou `Resgate` foi alterado. Os testes de `PessoaDesaparecida` continuaram passando sem modificação.

## Critério de sucesso

Alterar a lógica de um módulo não exige mudanças em outros módulos. Cada módulo tem testes de unidade sem dependências cruzadas. O build de um módulo individual não requer compilar os demais.

## Relação com SOS Location

Em situações de desastre real, equipes de busca, resgate e comunicação operam em paralelo com coordenação mínima entre si. O código reflete essa realidade operacional: módulos independentes que colaboram via eventos, não via chamadas diretas.
'''
body_en_us = '''
## Real context

The SOS Location backend started as a single project with controllers, services, and repositories mixed together. Three months later, the `POST /emergency` endpoint had 400 lines, calling alert services, search services, and payment services in the same method. Every change broke something unexpected in another module.

## Specific problem

The business rule "when registering a missing person, automatically notify rescuers within a 2 km radius" was spread across three classes: `EmergencyController`, `NotificationService`, and `UserRepository`. To change the 2 km radius to 3 km, you had to find and edit code in two separate files. The rescue notification logic depended on the internal structure of `PessoaDesaparecida`, creating direct coupling between modules that should be independent.

## Technical decision

Three independent modules, each with its own aggregate root, with no direct dependency between them. Integration exclusively via domain events.

- `SosLocation.Busca` → aggregate root: `PessoaDesaparecida`
- `SosLocation.Resgate` → aggregate root: `OperacaoDeResgate`
- `SosLocation.Alertas` → aggregate root: `AlertaDeEmergencia`

## Implementation

```csharp
// SosLocation.Busca/Domain/PessoaDesaparecida.cs
public sealed class PessoaDesaparecida : AggregateRoot
{
    public PessoaDesaparecidaId Id     { get; private set; }
    public string Nome                 { get; private set; }
    public Coordenadas UltimaLocalizacao { get; private set; }
    public StatusBusca Status          { get; private set; }

    private PessoaDesaparecida() { }

    public static PessoaDesaparecida Reportar(string nome, Coordenadas loc)
    {
        var pessoa = new PessoaDesaparecida
        {
            Id               = PessoaDesaparecidaId.New(),
            Nome             = nome,
            UltimaLocalizacao = loc,
            Status           = StatusBusca.Reportada
        };
        pessoa.AddDomainEvent(new PessoaDesaparecidaReportadaEvent(pessoa.Id, loc));
        return pessoa;
    }
}

// SosLocation.Alertas/Application/EnviarAlertaHandler.cs
public sealed class EnviarAlertaHandler
    : INotificationHandler<PessoaDesaparecidaReportadaEvent>
{
    private readonly IAlertaService _alertaService;

    public EnviarAlertaHandler(IAlertaService alertaService)
        => _alertaService = alertaService;

    public async Task Handle(
        PessoaDesaparecidaReportadaEvent evento,
        CancellationToken ct)
    {
        // Alertas does not access PessoaDesaparecida directly;
        // it receives only the necessary data via the event
        await _alertaService.BroadcastParaAreaAsync(
            evento.Localizacao,
            raioKm: 3.0,
            ct);
    }
}
```

## Concrete example

When the notification radius changed from 2 km to 3 km by a coordination operational decision, the change was a single line in `EnviarAlertaHandler`. No files in the `Busca` or `Resgate` modules were modified. The tests for `PessoaDesaparecida` continued to pass without modification.

## Success criteria

Changing the logic of one module requires no changes in other modules. Each module has unit tests without cross-dependencies. Building an individual module does not require compiling the others.

## Relation to SOS Location

In real disaster situations, search, rescue, and communications teams operate in parallel with minimal coordination between them. The code reflects this operational reality: independent modules that collaborate via events, not direct calls.
'''
body_ja_jp = '''
## 実際のコンテキスト

SOS Locationのバックエンドは、コントローラー・サービス・リポジトリが混在する単一プロジェクトとして始まった。3ヶ月後、`POST /emergency`エンドポイントは400行になり、アラートサービス・捜索サービス・決済サービスを同じメソッドで呼び出していた。変更するたびに別のモジュールで予期しない箇所が壊れた。

## 具体的な問題

「行方不明者を登録したとき、2km圏内の救助者に自動通知する」というビジネスルールが`EmergencyController`・`NotificationService`・`UserRepository`の3つのクラスに散在していた。2kmを3kmに変更するには、2つの異なるファイルを見つけて編集する必要があった。救助通知ロジックが`PessoaDesaparecida`の内部構造に依存しており、独立すべきモジュール間に直接的な結合が生まれていた。

## 技術的決定

3つの独立したモジュール、それぞれ独自の集約ルートを持ち、モジュール間の直接依存なし。統合はドメインイベント経由のみ。

- `SosLocation.Busca` → 集約ルート：`PessoaDesaparecida`
- `SosLocation.Resgate` → 集約ルート：`OperacaoDeResgate`
- `SosLocation.Alertas` → 集約ルート：`AlertaDeEmergencia`

## 実装

```csharp
// SosLocation.Busca/Domain/PessoaDesaparecida.cs
public sealed class PessoaDesaparecida : AggregateRoot
{
    public PessoaDesaparecidaId Id     { get; private set; }
    public string Nome                 { get; private set; }
    public Coordenadas UltimaLocalizacao { get; private set; }
    public StatusBusca Status          { get; private set; }

    private PessoaDesaparecida() { }

    public static PessoaDesaparecida Reportar(string nome, Coordenadas loc)
    {
        var pessoa = new PessoaDesaparecida
        {
            Id               = PessoaDesaparecidaId.New(),
            Nome             = nome,
            UltimaLocalizacao = loc,
            Status           = StatusBusca.Reportada
        };
        pessoa.AddDomainEvent(new PessoaDesaparecidaReportadaEvent(pessoa.Id, loc));
        return pessoa;
    }
}

// SosLocation.Alertas/Application/EnviarAlertaHandler.cs
public sealed class EnviarAlertaHandler
    : INotificationHandler<PessoaDesaparecidaReportadaEvent>
{
    private readonly IAlertaService _alertaService;

    public EnviarAlertaHandler(IAlertaService alertaService)
        => _alertaService = alertaService;

    public async Task Handle(
        PessoaDesaparecidaReportadaEvent evento,
        CancellationToken ct)
    {
        // AlertasはPessoaDesaparecidaに直接アクセスしない；
        // イベント経由で必要なデータのみを受け取る
        await _alertaService.BroadcastParaAreaAsync(
            evento.Localizacao,
            raioKm: 3.0,
            ct);
    }
}
```

## 具体的な例

運用上の決定により通知半径が2kmから3kmに変更された際、変更は`EnviarAlertaHandler`の1行だった。`Busca`または`Resgate`モジュールのファイルは変更されなかった。`PessoaDesaparecida`のテストは変更なしで通過し続けた。

## 成功基準

1つのモジュールのロジックを変更しても他のモジュールに変更が必要ない。各モジュールはクロス依存なしに独自のユニットテストを持つ。個別モジュールのビルドに他のモジュールのコンパイルが不要。

## SOS Locationとの関係

実際の災害状況では、捜索・救助・通信チームが最小限の調整で並行して活動する。コードはこの運用の現実を反映している：直接呼び出しではなくイベント経由で協力する独立したモジュール。

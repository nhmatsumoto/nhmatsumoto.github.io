## 実際のコンテキスト

SOS Locationは複数の自治体を同時にサービスする：フロリアノーポリス・レシフェ・マナウスはリスクマップが完全に異なり、緊急対応コーディネーターも異なり、各地域の災害タイプ（南部の洪水、北東部の干ばつ、北部の猛暑）に特化したアラート設定を持つ。テナント分離なしでは、フロリアノーポリス用に設定されたアラートがマナウスのダッシュボードに表示される可能性がある。

## 具体的な問題

最初のバージョンでは、`TenantId`は各リポジトリで手動で適用するオプションのフィルターだった。2ヶ月後、開発者が`HotspotRepository.GetActiveAsync()`でフィルターを忘れ、実際の運用中にレシフェのダッシュボードに全自治体のホットスポットが表示された。フロリアノーポリスのコーディネーターがレシフェのNOCに電話して自分たちの危険区域が見えると報告した時にバグが発覚した。

## 技術的決定

EF Coreのグローバルクエリフィルターとしての`TenantId`——`OnModelCreating`経由で自動的に適用されるため忘れることができない。すべてのルートエンティティが`ITenanted`を実装する。テナントコンテキストはJWTから解決された`ITenantContext`経由で注入される。

## 実装

```csharp
public class TenantScopedDbContext : DbContext
{
    private readonly ITenantContext _tenant;

    protected override void OnModelCreating(ModelBuilder mb)
    {
        foreach (var entityType in mb.Model.GetEntityTypes())
        {
            if (!typeof(ITenanted).IsAssignableFrom(entityType.ClrType))
                continue;

            mb.Entity(entityType.ClrType)
              .HasQueryFilter(BuildTenantFilter(entityType.ClrType));
        }
        base.OnModelCreating(mb);
    }

    private LambdaExpression BuildTenantFilter(Type entityType)
    {
        var param    = Expression.Parameter(entityType, "e");
        var tenantId = Expression.Constant(_tenant.TenantId);
        var prop     = Expression.Property(param, nameof(ITenanted.TenantId));
        var body     = Expression.Equal(prop, tenantId);
        return Expression.Lambda(body, param);
    }
}

public interface ITenanted { Guid TenantId { get; } }

public sealed class AlertaDeEmergencia : AggregateRoot, ITenanted
{
    public Guid TenantId   { get; private set; }
    public string Mensagem { get; private set; }
    public bool Ativo      { get; private set; }

    public static AlertaDeEmergencia Emitir(
        Guid tenantId, string mensagem, AreaDeRisco area)
    {
        if (string.IsNullOrWhiteSpace(mensagem))
            throw new DomainException("Mensagem do alerta não pode ser vazia.");
        return new AlertaDeEmergencia { TenantId = tenantId, Mensagem = mensagem, Ativo = true };
    }
}
```

## 具体的な例

グローバルクエリフィルターにより、レシフェのテナントコンテキストから実行された`SELECT * FROM alertas`は`tenant_id = 'recife-guid'`のレコードのみを返す。フィルターを忘れることは不可能——それはリポジトリではなくモデルの一部だ。フロリアノーポリスのデータをレシフェのダッシュボードに表示させたバグは、このアプローチでは発生しない。

## 成功基準

読み込みクエリが現在のコンテキスト以外のテナントのレコードを返さない。テナントフィルターの欠如は、サイレントな本番バグではなくコンパイルエラーを引き起こす（`ITenanted`インターフェースが必須）。

## SOS Locationとの関係

各自治体は自身の緊急データの主権を持つ。テナント間のデータ漏洩——フロリアノーポリスの危険区域をマナウスのオペレーターに公開すること——は単なる技術的バグではない：自治体の市民防衛機関に対するシステムの信頼性を損なう運用上のプライバシー侵害だ。

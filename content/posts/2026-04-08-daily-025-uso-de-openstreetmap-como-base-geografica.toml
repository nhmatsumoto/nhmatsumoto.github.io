```

## 具体的な例

ブルメナウ（SC）の洪水：イベント中に携帯ネットワークが劣化。インストール済みPWA（プリロードキャッシュ）を持つコーディネーター：ブルメナウのズーム10〜15タイルがオフラインで利用可能。インターネットなしで、ブルメナウのベースマップは機能し続ける——動的オーバーレイ（リスク、マーカー）だけが再接続を待つ。プリキャッシュされたタイル：6ズームレベルのブルメナウで約2,800枚の画像、デバイスキャッシュで約18MBを占有。

## 成功基準

PWAインストール後に50の優先市町村のオフラインベースマップが機能する。Service Workerキャッシュからのタイルロード時間 < 5ms（ネットワーク経由の200msと比較）。本番でのベースマップレンダリングにサードパーティAPIキー依存ゼロ。

## SOS Locationとの関係

ベースマップはコーディネーターの空間的オリエンテーションレイヤーだ。通信に影響する災害中——これはまさにSOS Locationが支援するために構築されたイベントだ——ベースマップのオフライン利用可能性は機能ではなく、運用要件だ。OSM + PWAキャッシュはコストゼロでサードパーティ依存なしにこれを満たす唯一の組み合わせだ。

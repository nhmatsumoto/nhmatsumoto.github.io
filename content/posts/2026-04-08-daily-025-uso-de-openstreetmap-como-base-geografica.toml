## 実際のコンテキスト

SOS Locationはネットワーク接続が予測不能な状況で使用される：通信インフラを破壊する洪水、遠隔地、不安定な3Gでのフィールド作戦。単一のタイルサーバー（Google Maps、Mapbox）への依存は、単一の運用障害点になる。さらに、Google Mapsはロードされたタイルごとに課金する——複数のゾーンにアクセスする10,000人の同時ユーザーのピークがある災害イベントでは、コストが法外になる。

## 具体的な問題

`tile.openstreetmap.org`経由のOSMタイルは無料だが、利用規約で本番での高頻度使用が禁止されている（「heavy use」ポリシー）。30秒ごとにマップを更新する500人のコーディネーターがいる緊急イベントでは、リクエスト量が制限を違反する。さらに、ローカルキャッシュなしでは、作戦中の接続損失でマップが完全に白くなる——すでにロードされたタイルは未訪問エリアに移動すると消える。

## 技術的決定

カスケードフォールバック付きの設定可能なタイルURL：(1) Carto CDN（無料プラン、月25万リクエスト、現在のSOS Locationには十分）；(2) CartoCDNがダウンした場合のフォールバックとしてStadia Maps；(3) 開発用の最終手段として`tile.openstreetmap.org`。Service WorkerはPWAインストール中に50の優先市町村のズーム10〜15のタイルをプリフェッチしてキャッシュする——オフラインで利用可能。

## 実装

```ts
export const TILE_SERVERS = {
  carto:  'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  stadia: 'https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png',

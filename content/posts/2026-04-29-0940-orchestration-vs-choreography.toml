status = "published"
tags = ["microservices", "event_driven"]
body = '''
## Orquestração
Fluxo centralizado.

## Coreografia
Eventos distribuídos.

## Trade-off
- Orquestração -> controle
- Coreografia -> flexibilidade

## Regra
Comece simples, evolua para eventos.

## Insight
Coreografia mal definida vira caos distribuído.
'''

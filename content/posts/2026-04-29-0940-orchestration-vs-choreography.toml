body = '''
Um pedido de e-commerce precisa: reservar estoque, cobrar o pagamento, agendar a entrega e notificar o cliente. Quatro serviços, quatro passos que precisam acontecer na ordem certa e desfazer-se com elegância se um falhar. **Quem coordena isso?** Há exatamente duas respostas, e a escolha entre elas é uma das decisões mais consequentes de uma arquitetura distribuída.

## Orquestração: o maestro central

Um componente — o **orquestrador** — conhece o fluxo inteiro e comanda cada serviço explicitamente: "reserve o estoque", aguarda a resposta, "cobre o pagamento", aguarda, e assim por diante. Os serviços são "burros" quanto ao processo; eles só obedecem comandos.

```
        ┌──────────────┐
        │ Orquestrador │  (conhece todo o fluxo)
        └──────────────┘
        ↓ cmd  ↓ cmd  ↓ cmd
    [Estoque][Pagamento][Entrega]
```

- **A favor:** o fluxo está em **um lugar só** — fácil de ler, monitorar, versionar. Tratamento de erro e *timeout* centralizados. Estado do processo explícito.
- **Contra:** acoplamento ao orquestrador; ele pode virar um *God Service*; é um ponto que precisa ser resiliente.

Ferramentas como **Camunda**, **Temporal** e o padrão **Saga orquestrada** vivem aqui.

## Coreografia: a dança sem maestro

Não há comandante. Cada serviço **emite eventos** sobre o que fez e **reage a eventos** dos outros. O fluxo emerge da soma dessas reações: `Pagamento` ouve `OrderPlaced`, faz seu trabalho, emite `PaymentConfirmed`; `Entrega` ouve `PaymentConfirmed` e age.

```
[Pedido] --OrderPlaced--> (bus) --> [Pagamento]
                                       │ PaymentConfirmed
                                       ↓
                          (bus) --> [Entrega] --> ...
```

- **A favor:** baixo acoplamento; serviços são autônomos; fácil adicionar um novo consumidor sem tocar nos existentes.
- **Contra:** **ninguém conhece o fluxo inteiro**. A lógica de negócio fica espalhada e implícita nos *handlers*. Depurar "por que o pedido travou?" exige reconstruir a história a partir de eventos. Sem disciplina, vira o que Sam Newman chama de caos distribuído.

## A comparação que importa

| Dimensão | Orquestração | Coreografia |
| :--- | :--- | :--- |
| Onde está a lógica | Centralizada (visível) | Distribuída (implícita) |
| Acoplamento | Maior (ao orquestrador) | Menor (via eventos) |
| Visibilidade do fluxo | Alta | Baixa |
| Adicionar passo novo | Mudar o orquestrador | Adicionar um consumidor |
| Depuração | Mais simples | Exige tracing distribuído |
| Risco | Gargalo central | Caos emergente |

## O ponto comum esquecido: a Saga e a compensação

Os dois modelos são formas de implementar uma **Saga** — uma transação distribuída de longa duração que substitui o ACID (impossível entre serviços) por uma sequência de transações locais. E ambos enfrentam a mesma pergunta difícil: **e quando o passo 3 falha depois que 1 e 2 já tiveram sucesso?** Não há *rollback* — é preciso **compensar**: estornar o pagamento, liberar o estoque. A diferença é que na orquestração a lógica de compensação está no maestro; na coreografia, espalhada em eventos de reversão. A complexidade não some — ela muda de endereço.

## Como escolher

Uma heurística pragmática: **orquestre o que precisa ser entendido como um todo; coreografe o que é genuinamente reativo e desacoplado.** Fluxos de negócio críticos, com muitos passos e compensações (checkout, onboarding), pedem a visibilidade da orquestração. Notificações, indexação, *side effects* independentes ("quando X acontecer, faça Y, sem ordem rígida") pedem a flexibilidade da coreografia. Muitos sistemas maduros usam os dois: orquestração para o núcleo do processo, coreografia para os efeitos periféricos.

## Conclusão

Não existe vencedor universal — existe a pergunta "**onde quero que a complexidade do fluxo viva: visível no centro, ou diluída nas bordas?**". Comece simples: na dúvida, a orquestração explícita é mais fácil de operar e raciocinar. Evolua para coreografia quando o desacoplamento entre serviços valer o custo de perder a visão central. O pior dos mundos é a coreografia acidental — eventos jogados sem contrato, sem rastreabilidade — que ninguém decidiu adotar, mas todos acabam mantendo.
'''
body_en_us = '''
An e-commerce order needs to: reserve inventory, charge the payment, schedule delivery, and notify the customer. Four services, four steps that must happen in the right order and unwind gracefully if one fails. **Who coordinates that?** There are exactly two answers, and choosing between them is one of the most consequential decisions in a distributed architecture.

## Orchestration: the central conductor

One component — the **orchestrator** — knows the whole flow and commands each service explicitly: "reserve inventory," waits for the reply, "charge the payment," waits, and so on. The services are "dumb" about the process; they just obey commands.

```
        ┌──────────────┐
        │ Orchestrator │  (knows the whole flow)
        └──────────────┘
        ↓ cmd  ↓ cmd  ↓ cmd
    [Inventory][Payment][Delivery]
```

- **For:** the flow is in **one place** — easy to read, monitor, version. Centralized error and timeout handling. Explicit process state.
- **Against:** coupling to the orchestrator; it can become a God Service; it's a point that must be resilient.

Tools like **Camunda**, **Temporal**, and the **orchestrated Saga** pattern live here.

## Choreography: the dance with no conductor

There is no commander. Each service **emits events** about what it did and **reacts to events** from others. The flow emerges from the sum of those reactions: `Payment` listens for `OrderPlaced`, does its job, emits `PaymentConfirmed`; `Delivery` listens for `PaymentConfirmed` and acts.

```
[Order] --OrderPlaced--> (bus) --> [Payment]
                                      │ PaymentConfirmed
                                      ↓
                         (bus) --> [Delivery] --> ...
```

- **For:** low coupling; services are autonomous; easy to add a new consumer without touching existing ones.
- **Against:** **nobody knows the whole flow**. Business logic is scattered and implicit in the handlers. Debugging "why did the order get stuck?" requires reconstructing the story from events. Without discipline, it becomes what Sam Newman calls distributed chaos.

## The comparison that matters

| Dimension | Orchestration | Choreography |
| :--- | :--- | :--- |
| Where the logic lives | Centralized (visible) | Distributed (implicit) |
| Coupling | Higher (to the orchestrator) | Lower (via events) |
| Flow visibility | High | Low |
| Adding a new step | Change the orchestrator | Add a consumer |
| Debugging | Simpler | Needs distributed tracing |
| Risk | Central bottleneck | Emergent chaos |

## The forgotten common ground: the Saga and compensation

Both models are ways to implement a **Saga** — a long-running distributed transaction that replaces ACID (impossible across services) with a sequence of local transactions. And both face the same hard question: **what about when step 3 fails after 1 and 2 already succeeded?** There is no rollback — you must **compensate**: refund the payment, release the inventory. The difference is that in orchestration the compensation logic lives in the conductor; in choreography it's scattered across reversal events. Complexity doesn't vanish — it just changes address.

## How to choose

A pragmatic heuristic: **orchestrate what must be understood as a whole; choreograph what is genuinely reactive and decoupled.** Critical business flows with many steps and compensations (checkout, onboarding) call for the visibility of orchestration. Notifications, indexing, independent side effects ("when X happens, do Y, no strict order") call for the flexibility of choreography. Many mature systems use both: orchestration for the process core, choreography for the peripheral effects.

## Conclusion

There is no universal winner — there is the question "**where do I want the flow's complexity to live: visible at the center, or diluted at the edges?**". Start simple: when in doubt, explicit orchestration is easier to operate and reason about. Evolve toward choreography when the decoupling between services is worth the cost of losing the central view. The worst of both worlds is accidental choreography — events thrown around with no contract, no traceability — that nobody decided to adopt, but everybody ends up maintaining.
'''
body_ja_jp = '''
EC の注文には、在庫の確保、決済の課金、配送の手配、顧客への通知が必要です。4 つのサービス、正しい順序で起き、ひとつ失敗したら優雅に巻き戻さねばならない 4 つの手順。**誰がこれを調整するのか。** 答えはちょうど 2 つあり、その選択は分散アーキテクチャで最も影響の大きい判断のひとつです。

## オーケストレーション：中央の指揮者

ひとつのコンポーネント ── **オーケストレータ** ── がフロー全体を知り、各サービスを明示的に指揮します。「在庫を確保せよ」、応答を待ち、「決済を課金せよ」、待ち、と続きます。サービスはプロセスについて「無知」で、命令に従うだけです。

```
        ┌──────────────┐
        │ オーケストレータ │  (フロー全体を知る)
        └──────────────┘
        ↓ cmd  ↓ cmd  ↓ cmd
     [在庫]  [決済]  [配送]
```

- **利点:** フローが **一か所** にある ── 読み、監視し、バージョン管理しやすい。エラーとタイムアウトの処理が集中。プロセスの状態が明示的。
- **欠点:** オーケストレータへの結合。God Service になりうる。レジリエントであらねばならない一点。

**Camunda**、**Temporal**、**オーケストレーション型サーガ** パターンはここに属します。

## コレオグラフィ：指揮者なきダンス

司令官はいません。各サービスは、自分がしたことについて **イベントを発行** し、他者からの **イベントに反応** します。フローはそれら反応の総和として立ち現れます。`決済` は `OrderPlaced` を聞き、仕事をし、`PaymentConfirmed` を発行する。`配送` は `PaymentConfirmed` を聞いて動く。

```
[注文] --OrderPlaced--> (bus) --> [決済]
                                    │ PaymentConfirmed
                                    ↓
                       (bus) --> [配送] --> ...
```

- **利点:** 低結合。サービスは自律的。既存に触れず新しいコンシューマを足しやすい。
- **欠点:** **誰もフロー全体を知らない**。ビジネスロジックがハンドラに散らばり暗黙化する。「なぜ注文が止まったか」のデバッグは、イベントから物語を再構成せねばならない。規律がなければ、サム・ニューマンが言う分散カオスになる。

## 重要な比較

| 観点 | オーケストレーション | コレオグラフィ |
| :--- | :--- | :--- |
| ロジックの所在 | 集中（可視） | 分散（暗黙） |
| 結合 | 高（オーケストレータへ） | 低（イベント経由） |
| フローの可視性 | 高 | 低 |
| 手順の追加 | オーケストレータを変更 | コンシューマを追加 |
| デバッグ | より単純 | 分散トレーシングが必要 |
| リスク | 中央のボトルネック | 創発的カオス |

## 忘れられた共通基盤：サーガと補償

両モデルは **サーガ** ── ACID（サービス間では不可能）をローカルトランザクションの連なりで置き換える、長時間実行の分散トランザクション ── を実装する方法です。そして両者は同じ難問に直面します。**1 と 2 が成功した後で 3 が失敗したらどうするか。** ロールバックはありません ── **補償** せねばなりません。決済を返金し、在庫を解放する。違いは、オーケストレーションでは補償ロジックが指揮者にあり、コレオグラフィでは反転イベントに散らばること。複雑さは消えず、住所を変えるだけです。

## 選び方

実践的なヒューリスティック。**全体として理解されねばならないものはオーケストレートし、真に反応的で疎結合なものはコレオグラフする。** 多くの手順と補償を持つ重要なビジネスフロー（チェックアウト、オンボーディング）は、オーケストレーションの可視性を求めます。通知、インデックス作成、独立した副作用（「X が起きたら Y をせよ、厳密な順序なし」）は、コレオグラフィの柔軟性を求めます。成熟したシステムの多くは両方を使います。プロセスの中核にはオーケストレーション、周辺の効果にはコレオグラフィ。

## 結論

普遍的な勝者はありません ── あるのは「**フローの複雑さをどこに住まわせたいか。中央に可視化するか、周縁に希釈するか**」という問いです。単純に始めましょう。迷ったら、明示的なオーケストレーションの方が運用も推論も容易です。サービス間の疎結合が、中央の視界を失う代償に値するときにコレオグラフィへ進みましょう。最悪なのは偶発的なコレオグラフィ ── 契約もトレーサビリティもなく投げられたイベント ── で、誰も採用を決めていないのに、全員が保守する羽目になるものです。

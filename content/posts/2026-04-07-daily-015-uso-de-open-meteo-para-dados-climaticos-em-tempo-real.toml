## 実際のコンテキスト

SOS Locationは洪水リスクモデル（#018）に供給するためのリアルタイム降水データが必要だ。監視対象エリアで今何mm降っているか、今後6時間でどのくらい降るか？この情報により、システムは川近くのゾーンの`NivelRisco`を洪水が起きる前に自動的に上げることができる--後ではなく。

## 具体的な問題

チームはブラジルの3つの気象データソースを評価した：
- **INMET（ブラジル国立気象研究所）**: ブラジルの公式データだが、認証が一貫しないAPI・古いドキュメント・大規模な気象イベント中の利用不能の歴史--まさにSOS Locationが最もAPIを必要とするとき。
- **OpenWeatherMap**: 無料プランで60 req/分の制限；有料プランは50の監視ゾーンが30分ごとに更新すると高価になる。
- **Open-Meteo**: 無料API・認証不要・2024年のアップタイム > 99.5%・0.1°（~11km）解像度のECMWF気象モデルデータ・48時間の時間別予報。

## 技術的決定

Open-Meteoをプライマリソースとして使用。APIは時間別データを返す--SOS Locationはリスクモデルのために6時間ウィンドウに集計する（6時間の累積降水量はCEMADENに従うブラジルの都市洪水リスクの参照指標）。監視ゾーンごとに30分ごとのポーリング、リクエストのバーストを避けるための25分Redisキャッシュ付き。

## 実装

```csharp
public sealed class OpenMeteoClient
{
    private readonly HttpClient _http;
    private readonly IRedisCache _cache;
    private const int CacheTtlMinutes = 25;

    public async Task<PrecipitacaoForecast> GetPrecipitacaoAsync(
        double lat, double lon, CancellationToken ct)
    {
        var cacheKey = $"openmeteo:{lat:F4}:{lon:F4}";
        var cached   = await _cache.GetAsync<PrecipitacaoForecast>(cacheKey, ct);
        if (cached is not null) return cached;

        var url = $"https://api.open-meteo.com/v1/forecast" +
                  $"?latitude={lat}&longitude={lon}" +
                  $"&hourly=precipitation,precipitation_probability" +
                  $"&forecast_days=2&timezone=America%2FSao_Paulo";

        var response = await _http.GetFromJsonAsync<OpenMeteoResponse>(url, ct)
            ?? throw new ExternalServiceException("Open-Meteo returned null response.");

        var forecast = AgregarEmJanelas6h(response);
        await _cache.SetAsync(cacheKey, forecast, TimeSpan.FromMinutes(CacheTtlMinutes), ct);
        return forecast;
    }

    private static PrecipitacaoForecast AgregarEmJanelas6h(OpenMeteoResponse response)
    {
        var janelas = response.Hourly.Time
            .Zip(response.Hourly.Precipitation, (t, p) => (Time: t, Precip: p))
            .GroupBy(x => x.Time.Hour / 6)
            .Select(g => new Janela6h(
                g.First().Time,
                g.Sum(x => x.Precip),
                response.Hourly.PrecipitationProbability.Skip(g.Key * 6).Take(6).Max()))
            .ToList();
        return new PrecipitacaoForecast(janelas);
    }
}

public static class LimitesPrecipitacao
{
    public const double AtencaoMm6h    = 20.0;   // NivelRisco += 1
    public const double AlertaMm6h     = 40.0;   // NivelRisco += 2
    public const double EmergenciaMm6h = 80.0;   // NivelRisco = 10（クリティカル）
}
```

## 具体的な例

監視ゾーン：ブルメナウ（SC）近くのRio Itajaí-Açu。Open-Meteoが今後12時間の6時間で65mmを予報。システムが川から2km以内のすべての`AreaDeRisco`の`NivelRisco`を4から6に引き上げる（`AlertaMm6h` = 40mm → +2）。コーディネーターは重大な降水ウィンドウの6時間前にプッシュ通知を受信する--予防的避難プロトコルを開始するのに十分な時間。

## 成功基準

気象データ更新の遅延 < 35分（30分ポーリング + 5分処理）。連続30日間の監視でOpen-Meteo APIの利用不能によるゼロ障害。降雨期間開始前に`AtencaoMm6h`以上の予測降水量を持つゾーンの`NivelRisco`が自動的に更新される。

## SOS Locationとの関係

SOS Locationのリスクシステムは反応的ではなく予測的だ。大雨の6時間前にゾーンのリスクレベルを上げることで、コーディネーターが救助チームを事前配置し、予防的アラートを発令できる--エリアがすでに洪水してアクセスが危うくなってから問題を発見するのとは対照的だ。

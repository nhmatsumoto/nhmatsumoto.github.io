body = '''
Pergunte a um especialista de negócio o que é um "cliente" e depois abra o código. Você vai encontrar `Customer`, `User`, `Account`, `Client` e `Party` - cinco palavras para, supostamente, a mesma coisa. Cada uma dessas divergências é um ponto onde alguém terá que **traduzir** mentalmente entre o que foi dito e o que foi escrito. A linguagem ubíqua existe para matar essa tradução.

## O que ela realmente é

Linguagem ubíqua é um vocabulário **rigoroso, compartilhado e único** entre desenvolvedores e especialistas de domínio, usado em conversas, documentos e - crucialmente - no código-fonte. Eric Evans, que cunhou o termo em *Domain-Driven Design* (2003), foi enfático: não basta que o time concorde com a palavra; a palavra precisa **aparecer no código**, nos nomes de classes, métodos e eventos.

```csharp
// Tradução exigida do leitor: "status 2 = ?"
order.SetStatus(2);

// Linguagem ubíqua: o código fala o idioma do negócio
order.Confirm();          // dispara OrderConfirmed
order.Cancel(reason);     // invariante: só antes do envio
```

Quando o especialista de logística diz "o pedido foi *despachado*", deve existir um `order.Dispatch()` e um evento `OrderDispatched` - não um `UPDATE status SET 4`.

## Por que é um ativo estratégico, não cosmético

A linguagem ubíqua reduz o custo mais silencioso de um sistema: o **custo de tradução** que cada pessoa paga toda vez que lê o código. Esse custo se acumula em três frentes:

| Sem linguagem ubíqua | Com linguagem ubíqua |
| :--- | :--- |
| Reuniões revisitam o mesmo mal-entendido | O vocabulário é resolvido uma vez |
| Bugs nascem na fronteira negócio↔código | A regra é expressa onde o negócio a descreve |
| Onboarding leva semanas decifrando nomes | O código é legível por quem conhece o domínio |

## A palavra muda de significado na fronteira - e tudo bem

O erro clássico é buscar um glossário **global** para a empresa inteira. "Produto" para o time de vendas (algo com preço e desconto) é diferente de "Produto" para o time de estoque (algo com peso e localização). Forçar um único modelo cria um *God Object* anêmico.

A solução de DDD é o **bounded context**: cada contexto tem sua própria linguagem ubíqua, coerente internamente. O mesmo termo pode existir em dois contextos com modelos diferentes, e a tradução explícita entre eles acontece num *Context Map* (via *Anti-Corruption Layer*, por exemplo). A ambiguidade não é eliminada - ela é **isolada**.

## Como cultivar na prática

1. **Ouça os verbos.** Especialistas descrevem processos com verbos ("aprovar", "estornar", "reservar"). Verbos viram métodos e eventos de domínio; substantivos viram entidades e value objects.
2. **Proíba termos genéricos.** `Manager`, `Processor`, `Data`, `Info`, `Helper` são sinais de que o domínio não foi nomeado.
3. **Refatore quando a linguagem mudar.** Se o negócio passou a chamar de "assinatura" o que o código chama de "contrato", o código está desatualizado - renomeie.
4. **Trate o glossário como código.** Versione, revise em PR, mantenha por contexto.

## Conclusão

Linguagem ubíqua não é a parte "soft" de DDD que se pula para ir aos padrões táticos. É a fundação: agregados, eventos e invariantes só fazem sentido se nomeiam conceitos reais do domínio. Um modelo de domínio rico escrito em palavras erradas continua sendo um modelo anêmico - apenas mais difícil de perceber.
'''
body_en_us = '''
Ask a business expert what a "customer" is, then open the code. You'll find `Customer`, `User`, `Account`, `Client`, and `Party` - five words for supposedly the same thing. Each of those divergences is a point where someone will have to **translate** in their head between what was said and what was written. Ubiquitous language exists to kill that translation.

## What it actually is

Ubiquitous language is a **rigorous, shared, single** vocabulary between developers and domain experts, used in conversations, documents, and - crucially - in the source code. Eric Evans, who coined the term in *Domain-Driven Design* (2003), was emphatic: it isn't enough for the team to agree on the word; the word must **appear in the code**, in the names of classes, methods, and events.

```csharp
// Reader must translate: "status 2 = ?"
order.SetStatus(2);

// Ubiquitous language: the code speaks the business's tongue
order.Confirm();          // raises OrderConfirmed
order.Cancel(reason);     // invariant: only before shipping
```

When the logistics expert says "the order was *dispatched*", there should be an `order.Dispatch()` and an `OrderDispatched` event - not an `UPDATE status SET 4`.

## Why it's a strategic asset, not cosmetics

Ubiquitous language reduces a system's quietest cost: the **translation cost** every person pays each time they read the code. That cost accumulates on three fronts:

| Without ubiquitous language | With ubiquitous language |
| :--- | :--- |
| Meetings revisit the same misunderstanding | The vocabulary is resolved once |
| Bugs are born at the business↔code boundary | The rule is expressed where the business describes it |
| Onboarding spends weeks deciphering names | The code is readable by anyone who knows the domain |

## The word changes meaning at the boundary - and that's fine

The classic mistake is to chase a **global** glossary for the whole company. "Product" for the sales team (something with a price and discount) is different from "Product" for the inventory team (something with weight and a location). Forcing one model creates an anemic *God Object*.

DDD's answer is the **bounded context**: each context has its own ubiquitous language, internally consistent. The same term can exist in two contexts with different models, and explicit translation between them happens in a *Context Map* (through an Anti-Corruption Layer, for instance). Ambiguity isn't eliminated - it's **isolated**.

## How to cultivate it in practice

1. **Listen for verbs.** Experts describe processes with verbs ("approve", "refund", "reserve"). Verbs become domain methods and events; nouns become entities and value objects.
2. **Ban generic terms.** `Manager`, `Processor`, `Data`, `Info`, `Helper` are signs the domain was never named.
3. **Refactor when the language changes.** If the business now calls "subscription" what the code calls "contract", the code is stale - rename it.
4. **Treat the glossary as code.** Version it, review it in PRs, keep it per context.

## Conclusion

Ubiquitous language isn't the "soft" part of DDD you skip on the way to the tactical patterns. It is the foundation: aggregates, events, and invariants only make sense if they name real domain concepts. A rich domain model written in the wrong words is still an anemic model - just harder to notice.
'''
body_ja_jp = '''
ドメインエキスパートに「顧客とは何か」と尋ねてから、コードを開いてみてください。`Customer`、`User`、`Account`、`Client`、`Party` ── 同じはずのものに 5 つの語が見つかります。これらの食い違いひとつひとつが、語られたことと書かれたことの間で誰かが頭の中で **翻訳** しなければならない地点です。ユビキタス言語は、その翻訳を消すために存在します。

## それが実際に何であるか

ユビキタス言語とは、開発者とドメインエキスパートの間で **厳密に、共有され、唯一の** 語彙であり、会話、文書、そして決定的に重要なことに、ソースコードの中で使われます。『エリック・エヴァンスのドメイン駆動設計』（2003年）でこの語を生んだエヴァンスは強調しました。チームが言葉に合意するだけでは足りない。その言葉は、クラス・メソッド・イベントの名前として **コードに現れなければならない**。

```csharp
// 読み手に翻訳を強いる：「status 2 とは？」
order.SetStatus(2);

// ユビキタス言語：コードがビジネスの言語を話す
order.Confirm();          // OrderConfirmed を発火
order.Cancel(reason);     // 不変条件：出荷前のみ
```

物流の担当者が「注文が *出荷された*」と言うなら、`UPDATE status SET 4` ではなく、`order.Dispatch()` と `OrderDispatched` イベントが存在すべきです。

## なぜ装飾ではなく戦略的資産なのか

ユビキタス言語は、システムの最も静かなコストを下げます。コードを読むたびに各人が支払う **翻訳コスト** です。このコストは 3 つの面で積み上がります。

| ユビキタス言語なし | ユビキタス言語あり |
| :--- | :--- |
| 会議が同じ誤解を何度も蒸し返す | 語彙は一度で解決される |
| バグがビジネス↔コードの境界で生まれる | ルールはビジネスが記述する場所で表現される |
| オンボーディングが名前の解読に数週間を費やす | ドメインを知る者ならコードを読める |

## 言葉は境界で意味を変える ── それでよい

典型的な誤りは、会社全体のための **グローバルな** 用語集を追い求めることです。営業チームにとっての「製品」（価格と割引を持つもの）は、在庫チームにとっての「製品」（重量と保管場所を持つもの）とは異なります。単一モデルを強制すれば、貧血症の *God Object* が生まれます。

DDD の答えは **境界づけられたコンテキスト** です。各コンテキストは、内部的に一貫した独自のユビキタス言語を持ちます。同じ語が異なるモデルで 2 つのコンテキストに存在してよく、その間の明示的な翻訳は *Context Map*（たとえば腐敗防止層を介して）で行われます。曖昧さは消えるのではなく、**隔離** されます。

## 実践での育て方

1. **動詞に耳を傾ける。** エキスパートは動詞で過程を語る（「承認する」「返金する」「予約する」）。動詞はドメインのメソッドとイベントに、名詞はエンティティと値オブジェクトになる。
2. **汎用的な語を禁じる。** `Manager`、`Processor`、`Data`、`Info`、`Helper` は、ドメインが名付けられなかった兆候。
3. **言語が変わったらリファクタする。** コードが「契約」と呼ぶものをビジネスが「サブスクリプション」と呼ぶようになったなら、コードは古い ── 改名する。
4. **用語集をコードとして扱う。** バージョン管理し、PR でレビューし、コンテキストごとに保つ。

## 結論

ユビキタス言語は、戦術的パターンへ向かう途中で飛ばす DDD の「ソフトな」部分ではありません。それは土台です。集約・イベント・不変条件は、実際のドメイン概念を名付けてはじめて意味を持ちます。誤った言葉で書かれたリッチなドメインモデルは、依然として貧血症のモデル ── ただ気づきにくいだけです。
'''

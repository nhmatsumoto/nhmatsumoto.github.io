tags = ["ddd", "arquitetura", "design"]
body = '''
## Problema
Código não reflete negócio.

## Solução
Linguagem ubíqua.

## Exemplo
Order, Invoice, Payment -> não são tabelas, são conceitos.

## Regra
- Nomear baseado no domínio
- Evitar termos genéricos

## Insight
DDD reduz tradução mental entre negócio e código.
'''


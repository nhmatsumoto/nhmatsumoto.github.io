overview = """
Fork do Mermaid Live Editor, a aplicação web oficial para criação e preview de diagramas Mermaid em tempo real.

## Funcionalidades

- **Editor com syntax highlighting** via Monaco Editor (mesmo do VS Code)
- **Preview instantâneo** — renderização em tempo real conforme o texto é editado
- **Exportação** — download em SVG, PNG e links compartilháveis
- **Templates** — exemplos pré-configurados para cada tipo de diagrama
- **Temas** — preview com diferentes temas (default, dark, forest, neutral)

## Uso prático

Ferramenta complementar ao fork do **mermaid** para desenvolvimento e teste de diagramas antes de incorporá-los aos posts e documentos do Technical Knowledge OS.

## Stack

Construído com Svelte para uma experiência de UI reativa e leve, com TypeScript para type safety e Monaco Editor para a experiência de edição.
"""
overview_en_us = """
Fork of Mermaid Live Editor, the official web application for creating and previewing Mermaid diagrams in real time.

## Features

- **Editor with syntax highlighting** powered by Monaco Editor
- **Instant preview** — diagrams render live while the text changes
- **Export** — download as SVG, PNG or shareable links
- **Templates** — starter examples for each diagram type
- **Themes** — preview under different visual themes

## Practical use

It complements the **mermaid** fork as the place to prototype and validate diagrams before embedding them into Technical Knowledge OS posts and documents.

## Stack

Built with Svelte for a lightweight reactive UI, TypeScript for type safety and Monaco for the editing experience.
"""
overview_ja_jp = """
Mermaid 図をリアルタイムに作成・プレビューできる公式 Web アプリ、Mermaid Live Editor のフォークです。

## 機能

- **syntax highlighting 付きエディタ** — Monaco Editor ベース
- **instant preview** — テキスト変更に合わせて即時描画
- **export** — SVG、PNG、共有リンクとして出力
- **template** — 図種ごとのスターター例
- **theme** — 複数の見た目でプレビュー可能

## 実用面

Technical Knowledge OS の記事や文書に組み込む前に、図を試作・検証する場所として **mermaid** フォークを補完します。

## スタック

軽量なリアクティブ UI のための Svelte、型安全のための TypeScript、編集体験のための Monaco を採用しています。
"""

problem_solution = """
Escrever diagramas Mermaid sem feedback visual é lento e propenso a erros de sintaxe. O live editor resolve isso com preview instantâneo, reduzindo o ciclo de iteração de minutos para segundos.
"""
problem_solution_en_us = "Writing Mermaid without visual feedback is slow and error-prone. The live editor shortens the iteration loop from minutes to seconds by rendering diagrams immediately."
problem_solution_ja_jp = "視覚的なフィードバックなしで Mermaid を書くのは遅く、構文ミスも起こしやすくなります。live editor は即時描画によって、その反復サイクルを数分から数秒へ短縮します。"

architecture = """
SPA em Svelte com três painéis: editor (Monaco), preview (Mermaid renderer) e configuração (tema, tipo de diagrama). Estado compartilhado via Svelte stores. Exportação feita via serialização do SVG renderizado.
"""
architecture_en_us = "Svelte SPA with three panels: editor (Monaco), preview (Mermaid renderer) and configuration (theme and diagram options). Shared state lives in Svelte stores. Export is done by serializing the rendered SVG."

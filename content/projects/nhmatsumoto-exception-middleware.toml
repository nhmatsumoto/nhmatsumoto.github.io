overview = """
Middleware de tratamento global de exceções para aplicações ASP.NET Core, projetado para padronizar respostas de erro em APIs REST.

## O que faz

Intercepta todas as exceções não tratadas no pipeline de requisições e as converte em respostas HTTP padronizadas:

- **Exceções de domínio** → 400 Bad Request com mensagem específica
- **Exceções de validação** → 422 Unprocessable Entity com detalhes
- **Exceções de autenticação** → 401/403 com contexto
- **Exceções não mapeadas** → 500 Internal Server Error com ID de correlação

## Por que um middleware dedicado

Sem tratamento centralizado, cada controller precisa implementar seus próprios try/catch, levando a inconsistências na formatação de erros e duplicação de lógica de logging. O middleware garante:

- Formato consistente (RFC 7807 Problem Details)
- Log estruturado com correlation ID
- Supressão de stack traces em produção
- Extensibilidade via mapeamento de tipos de exceção

## Uso no ecossistema

Utilizado nos backends do **SplitCosts**, **Financial** e outros projetos .NET como pacote reutilizável.
"""
overview_en_us = """
Global exception-handling middleware for ASP.NET Core applications, designed to standardize error responses in REST APIs.

## What it does

It intercepts all unhandled exceptions in the request pipeline and converts them into standardized HTTP responses:

- **Domain exceptions** → 400 Bad Request with a specific message
- **Validation exceptions** → 422 Unprocessable Entity with detailed information
- **Authentication exceptions** → 401 / 403 with context
- **Unmapped exceptions** → 500 Internal Server Error with a correlation ID

## Why use a dedicated middleware

Without centralized handling, each controller ends up with its own try/catch blocks, resulting in inconsistent error formats and duplicated logging logic. The middleware guarantees:

- Consistent response format (RFC 7807 Problem Details)
- Structured logging with correlation IDs
- Suppression of stack traces in production
- Extensibility through exception-type mappings

## Use in the ecosystem

This package is reused in **SplitCosts**, **Financial** and other .NET backends.
"""
overview_ja_jp = """
REST API のエラーレスポンスを標準化するために設計された、ASP.NET Core アプリ向けのグローバル例外処理ミドルウェアです。

## 何をするか

リクエスト・パイプライン上の未処理例外を横取りし、標準化された HTTP レスポンスへ変換します。

- **ドメイン例外** → 具体的メッセージ付き 400 Bad Request
- **検証例外** → 詳細付き 422 Unprocessable Entity
- **認証例外** → 文脈付き 401 / 403
- **未マップ例外** → correlation ID 付き 500 Internal Server Error

## 専用ミドルウェアを使う理由

集中処理がないと、各 controller が独自の try/catch を持つことになり、エラー形式の不一致と logging ロジックの重複を招きます。このミドルウェアは次を保証します。

- 一貫したレスポンス形式（RFC 7807 Problem Details）
- correlation ID 付きの構造化ログ
- 本番環境での stack trace 抑制
- 例外型マッピングによる拡張性

## エコシステムでの利用

**SplitCosts**、**Financial** などの .NET バックエンドで再利用されています。
"""

problem_solution = """
APIs sem tratamento centralizado de erros vazam detalhes internos, retornam formatos inconsistentes e dificultam o debugging. O middleware resolve isso com um ponto único de interceptação que padroniza todas as respostas de erro.
"""
problem_solution_en_us = "APIs without centralized error handling leak internal details, return inconsistent payloads and make debugging harder. This middleware fixes that through a single interception point that standardizes every error response."
problem_solution_ja_jp = "集中したエラーハンドリングがない API は内部情報を漏らしやすく、payload 形式も不揃いになり、デバッグも難しくなります。このミドルウェアは単一の横取りポイントで全エラーレスポンスを標準化して、それを解決します。"


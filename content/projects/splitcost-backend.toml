overview = """
Backend do **SplitCosts** — API em .NET/C# que implementa a lógica de compartilhamento de despesas com foco em multi-tenancy e modelagem de domínio.

## Arquitetura

- **Multi-tenant** — isolamento de dados por grupo/household com tenant resolution no middleware
- **Domain events** — mudanças de estado publicam eventos para manter projeções atualizadas
- **CQRS simplificado** — separação entre comandos (escrita) e queries (projeções de leitura)
- **Repository pattern** — abstração de persistência com PostgreSQL via Entity Framework

## Domínio

O modelo de domínio trata despesas como agregados com regras de negócio:

- Divisão proporcional ou customizada entre participantes
- Histórico de pagamentos e saldos por período
- Reconciliação de dívidas entre membros do grupo
- Categorização e reporting

## Relação com o ecossistema

Evolução direta do **Financial** (monolito), agora com separação clara entre contextos, multi-tenancy e projeções de leitura. Consumido pelo **SplitCosts-FE** via REST API.
"""
overview_en_us = """
Backend of **SplitCosts** — a .NET / C# API that implements expense-sharing logic with a focus on multi-tenancy and domain modeling.

## Architecture

- **Multi-tenant** — data isolation per group / household, with tenant resolution in middleware
- **Domain events** — state changes publish events to keep read models updated
- **Lightweight CQRS** — separation between commands (writes) and queries (read projections)
- **Repository pattern** — persistence abstraction backed by PostgreSQL and Entity Framework

## Domain

The domain model treats expenses as aggregates governed by business rules:

- Proportional or custom splits among participants
- Payment history and balances over time
- Debt reconciliation between group members
- Categorization and reporting

## Relationship with the ecosystem

This is the direct evolution of **Financial**, now with clearer boundaries, multi-tenancy and dedicated read projections. It is consumed by **SplitCosts-FE** through a REST API.
"""
overview_ja_jp = """
**SplitCosts** のバックエンドであり、マルチテナンシーとドメインモデリングに重点を置いて支出共有ロジックを実装する .NET / C# API です。

## アーキテクチャ

- **Multi-tenant** — middleware の tenant resolution による household / group 単位のデータ分離
- **Domain events** — 状態変化をイベント公開し、read model を更新
- **軽量 CQRS** — command（書き込み）と query（読み取り投影）の分離
- **Repository pattern** — PostgreSQL と Entity Framework を背後に持つ永続化抽象

## ドメイン

ドメインモデルは、業務ルールに従う aggregate として支出を扱います。

- 参加者間の比例またはカスタム分配
- 支払い履歴と期間ごとの残高
- グループ内メンバー間の債務精算
- カテゴリ分類とレポート

## エコシステムとの関係

これは **Financial** の直接的な進化形で、より明確な境界、マルチテナント化、専用 read projection を備えます。**SplitCosts-FE** から REST API で利用されます。
"""

problem_solution = """
O Financial original acoplava regras de negócio à infraestrutura e não suportava múltiplos grupos. O backend do SplitCosts resolve isso com fronteiras de domínio explícitas, tenant isolation e projeções dedicadas para cada tela.
"""
problem_solution_en_us = "The original Financial monolith coupled business rules to infrastructure and could not support multiple groups. SplitCosts backend addresses that with explicit domain boundaries, tenant isolation and read models tailored to each screen."
problem_solution_ja_jp = "元の Financial モノリスは業務ルールとインフラが結合し、複数グループも扱えませんでした。SplitCosts バックエンドは、明示的なドメイン境界、tenant 分離、画面ごとに最適化された read model によってそれを解決します。"

architecture = """
API ASP.NET Core em camadas: Controllers → Application Services → Domain → Infrastructure. Multi-tenancy via middleware de tenant resolution. PostgreSQL com Entity Framework Core. Projeções de leitura como queries separadas sobre views materializadas.
"""

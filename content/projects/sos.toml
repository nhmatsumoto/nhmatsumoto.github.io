overview = """
Módulo auxiliar do ecossistema **SOS Location**, contendo componentes compartilhados entre os serviços da plataforma de resposta a desastres.

## Papel no ecossistema

Enquanto o **SOS Location** é a aplicação principal com interface de usuário e pipelines de dados, o repositório **SOS** concentra:

- **Contratos de integração** — tipos TypeScript compartilhados entre serviços
- **Utilitários GIS** — funções de conversão de coordenadas, cálculo de distâncias e processamento de GeoJSON
- **Configurações compartilhadas** — constantes, enums e mapas de referência

## Relação com brumadinho_location

O aprendizado acumulado no projeto **brumadinho_location** foi formalizado nos utilitários deste módulo, transformando scripts ad-hoc em funções reutilizáveis e testáveis.
"""
overview_en_us = """
Auxiliary module of the **SOS Location** ecosystem, containing shared components across the disaster-response platform.

## Role in the ecosystem

While **SOS Location** is the main application with UI and data pipelines, the **SOS** repository centralizes:

- **Integration contracts** — shared TypeScript types across services
- **GIS utilities** — coordinate conversion, distance calculation and GeoJSON processing helpers
- **Shared configuration** — constants, enums and reference maps

## Relationship with `brumadinho_location`

Lessons accumulated in **brumadinho_location** were formalized in this module, turning ad hoc scripts into reusable and testable functions.
"""
overview_ja_jp = """
災害対応プラットフォーム **SOS Location** エコシステムの補助モジュールで、共有コンポーネントを集約しています。

## エコシステム内での役割

UI とデータ・パイプラインを持つ主アプリが **SOS Location** である一方、この **SOS** リポジトリは次を集中管理します。

- **Integration contracts** — サービス間で共有する TypeScript 型
- **GIS utilities** — 座標変換、距離計算、GeoJSON 処理関数
- **Shared configuration** — 定数、enum、参照マップ

## `brumadinho_location` との関係

**brumadinho_location** で得た知見をこのモジュールに形式化し、場当たり的なスクリプトを再利用可能でテスト可能な関数へ変えました。
"""

problem_solution = """
Em sistemas distribuídos, a duplicação de tipos e utilitários entre serviços gera inconsistências. Este módulo centraliza contratos e funções compartilhadas para garantir coerência entre os componentes do ecossistema SOS.
"""
problem_solution_en_us = "In distributed systems, duplicating shared types and utilities across services creates drift and inconsistency. This module centralizes those contracts and helpers to preserve coherence throughout the SOS ecosystem."
problem_solution_ja_jp = "分散システムでは、共有型やユーティリティを各サービスに重複配置すると、すぐにズレと不整合が生まれます。このモジュールはそれらを集中管理し、SOS エコシステム全体の一貫性を保ちます。"

architecture = """
Pacote TypeScript/Node.js publicável como dependência local. Exporta tipos, interfaces e funções utilitárias consumidas pelos demais serviços do ecossistema SOS via import direto.
"""
architecture_en_us = "Publishable TypeScript / Node.js package used as a local dependency. It exports types, interfaces and utility functions consumed directly by the other SOS services."
architecture_ja_jp = "ローカル依存として使える公開可能な TypeScript / Node.js パッケージです。ほかの SOS サービスが直接利用する型、interface、utility 関数を export します。"

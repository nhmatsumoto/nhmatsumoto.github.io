overview = """
Biblioteca de referência com implementações de algoritmos e estruturas de dados fundamentais da ciência da computação.

## Conteúdo

Coleção organizada por categoria:

- **Ordenação** - quicksort, mergesort, heapsort, radix sort
- **Busca** - binary search, BFS, DFS, A*
- **Estruturas** - listas, pilhas, filas, árvores, grafos, hash tables
- **Grafos** - Dijkstra, Bellman-Ford, topological sort, MST
- **Programação dinâmica** - knapsack, LCS, edit distance
- **Strings** - KMP, Rabin-Karp, suffix arrays

## Propósito

Servir como material de consulta rápida e estudo, com implementações limpas e comentadas que priorizam clareza sobre otimização.
"""
overview_en_us = """
Reference library with implementations of fundamental algorithms and data structures from computer science.

## Content

Collection organized by category:

- **Sorting** - quicksort, mergesort, heapsort and radix sort
- **Search** - binary search, BFS, DFS and A*
- **Structures** - lists, stacks, queues, trees, graphs and hash tables
- **Graphs** - Dijkstra, Bellman-Ford, topological sort and MST
- **Dynamic programming** - knapsack, LCS and edit distance
- **Strings** - KMP, Rabin-Karp and suffix arrays

## Purpose

The goal is fast lookup and study, with implementations that favor clarity and annotation over micro-optimization.

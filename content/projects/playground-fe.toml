overview = """
Projeto frontend criado com React e TypeScript, com integração completa ao Keycloak para autenticação e autorização de usuários.

## Funcionalidades

- **Login/Logout** via Keycloak com fluxo OAuth2/OIDC
- **Token management** — refresh automático de access tokens
- **Protected routes** — rotas que exigem autenticação
- **Role-based UI** — componentes condicionais baseados em roles do Keycloak
- **Silent refresh** — renovação de token sem interrupção da sessão

## Stack técnico

- React com hooks e context API para state management
- TypeScript para type safety em toda a aplicação
- Keycloak JS adapter para integração com o identity provider
- Vite como build tool

## Relação com o ecossistema

Este playground serve como base de autenticação para os frontends do **SplitCosts-FE** e outros projetos que precisam de controle de acesso. As decisões de integração com Keycloak testadas aqui são replicadas nos projetos de produção.
"""
overview_en_us = """
Frontend project built with React and TypeScript, with full Keycloak integration for authentication and authorization.

## Features

- **Login / Logout** via Keycloak using OAuth2 / OIDC flows
- **Token management** — automatic refresh of access tokens
- **Protected routes** — routes that require authentication
- **Role-based UI** — components conditional on Keycloak roles
- **Silent refresh** — token renewal without interrupting the session

## Technical stack

- React with hooks and the Context API for state management
- TypeScript for full-application type safety
- Keycloak JS adapter for identity-provider integration
- Vite as the build tool

## Relationship with the ecosystem

This playground serves as the authentication baseline for **SplitCosts-FE** and other frontends that need access control. Keycloak integration choices validated here are reused in production systems.
"""
overview_ja_jp = """
React と TypeScript で構築したフロントエンド・プロジェクトで、認証・認可のための Keycloak 統合をフルで備えています。

## 機能

- **Login / Logout** — OAuth2 / OIDC フローによる Keycloak 認証
- **Token management** — access token の自動 refresh
- **Protected routes** — 認証が必要な route
- **Role-based UI** — Keycloak role に応じた条件付きコンポーネント
- **Silent refresh** — セッションを切らさず token を更新

## 技術スタック

- state 管理に hooks と Context API を用いた React
- アプリ全体の型安全のための TypeScript
- IdP 連携のための Keycloak JS adapter
- build tool としての Vite

## エコシステムとの関係

この playground は **SplitCosts-FE** など、アクセス制御が必要なフロントエンドの認証ベースになります。ここで検証した Keycloak 統合方針は本番システムでも再利用されます。
"""

problem_solution = """
Integrar autenticação OAuth2/OIDC corretamente em SPAs tem armadilhas: PKCE, refresh silencioso, CORS, logout distribuído. Este playground isola a complexidade de autenticação para testar padrões antes de aplicá-los em projetos reais.
"""
problem_solution_en_us = "Implementing OAuth2 / OIDC correctly in SPAs has plenty of traps: PKCE, silent refresh, CORS and distributed logout. This playground isolates the authentication complexity before it reaches production apps."
problem_solution_ja_jp = "SPA で OAuth2 / OIDC を正しく実装するには、PKCE、silent refresh、CORS、分散 logout など多くの落とし穴があります。この playground は、その認証の複雑さを本番アプリに持ち込む前に切り離して検証します。"

architecture = """
SPA React com Keycloak JS adapter inicializado no bootstrap da aplicação. O adapter gerencia o ciclo de vida dos tokens (access, refresh, id) e expõe um AuthContext para toda a árvore de componentes.
"""
architecture_en_us = "React SPA with the Keycloak JS adapter initialized during bootstrap. The adapter manages access, refresh and ID token lifecycles and exposes an `AuthContext` to the full component tree."
architecture_ja_jp = "bootstrap 時に Keycloak JS adapter を初期化する React SPA です。adapter が access / refresh / ID token のライフサイクルを管理し、`AuthContext` をコンポーネント・ツリー全体に公開します。"

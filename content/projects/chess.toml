overview = """
Implementação de um jogo de xadrez completo em C#, com modelagem de domínio que trata cada peça como entidade com regras próprias de movimentação.

## Modelagem de domínio

O tabuleiro é representado como uma matriz 8x8 onde cada célula pode conter uma peça. Cada tipo de peça (Rei, Rainha, Torre, Bispo, Cavalo, Peão) implementa suas próprias regras de movimentação, incluindo:

- Movimentos válidos considerando o estado atual do tabuleiro
- Detecção de xeque e xeque-mate
- Movimentos especiais: roque, en passant, promoção de peão

## Decisões de design

- **Value Objects** para posições no tabuleiro
- **Strategy pattern** para regras de movimentação por tipo de peça
- **Imutabilidade** do estado do jogo para facilitar undo/redo
"""
overview_en_us = """
Implementation of a complete chess game in C#, with a domain model that treats each piece as an entity with its own movement rules.

## Domain modeling

The board is represented as an 8x8 matrix where each square may contain a piece. Each piece type (King, Queen, Rook, Bishop, Knight and Pawn) implements its own movement rules, including:

- Valid moves considering the current board state
- Check and checkmate detection
- Special moves: castling, en passant and pawn promotion

## Design decisions

- **Value Objects** for board positions
- **Strategy pattern** for movement rules by piece type
- **Immutable game state** to simplify undo/redo
"""
overview_ja_jp = """
C# による完全なチェス実装で、各駒を固有の移動ルールを持つエンティティとして扱うドメインモデルを採用しています。

## ドメインモデリング

盤面は 8x8 の行列で表現され、各マスに駒が置かれます。各駒種（キング、クイーン、ルーク、ビショップ、ナイト、ポーン）は、それぞれの移動ルールを実装しています。対象には以下が含まれます。

- 現在の盤面状態を考慮した合法手
- チェックとチェックメイトの判定
- 特殊手: キャスリング、アンパッサン、ポーン昇格

## 設計上の判断

- 盤面座標を表す **Value Object**
- 駒種ごとの移動ルールを切り出す **Strategy pattern**
- undo / redo を簡単にする **不変なゲーム状態**
"""

problem_solution = """
Xadrez é um exercício clássico de modelagem de domínio: regras complexas que interagem entre si, validações que dependem do estado global e lógica que precisa ser expressa de forma clara. O projeto aplica princípios de DDD para manter as regras legíveis e testáveis.
"""
problem_solution_en_us = "Chess is a classic domain-modeling exercise: complex rules interact with each other, validations depend on global state, and the logic needs to remain explicit. The project applies DDD principles to keep those rules readable and testable."
problem_solution_ja_jp = "チェスは古典的なドメインモデリングの題材です。複雑なルールが相互作用し、検証はグローバル状態に依存し、ロジックは明快に表現される必要があります。このプロジェクトでは DDD の原則を用いて、ルールを読みやすくテスト可能に保っています。"

architecture = """
Arquitetura em camadas simples: domínio (peças, tabuleiro, regras), aplicação (controle de jogo, turnos) e interface de console. O domínio é completamente independente da camada de apresentação.
"""
architecture_en_us = "A simple layered architecture: domain (pieces, board and rules), application (game control and turns) and console UI. The domain layer is completely independent from presentation."
architecture_ja_jp = "アーキテクチャは単純なレイヤ構造です。ドメイン（駒、盤面、ルール）、アプリケーション（対局進行とターン制御）、コンソール UI に分かれ、ドメイン層は表示層から完全に独立しています。"

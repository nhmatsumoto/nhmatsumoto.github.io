overview = """
SOS Location é uma iniciativa de resposta humanitária focada no uso de tecnologia geoespacial para acelerar a tomada de decisão em cenários de crise. O projeto organiza camadas de dados complexas em uma interface operacional simples.
"""
overview_en_us = "SOS Location is a humanitarian-response initiative focused on using geospatial technology to accelerate decision-making in crisis scenarios. The project organizes complex data layers into a simple operational interface."
overview_ja_jp = "SOS Location は、危機時の意思決定を加速するために地理空間技術を活用する人道対応イニシアチブです。複雑なデータレイヤを、現場で扱いやすいシンプルな運用インターフェースに整理します。"
problem_solution = """
Em desastres, a fragmentação da informação custa vidas. A solução centraliza feeds de clima, áreas de risco e recursos disponíveis, utilizando processamento assíncrono para manter a atualização constante sem sobrecarregar o sistema.
"""
problem_solution_en_us = "In disasters, fragmented information costs lives. The platform centralizes weather feeds, risk areas and available resources, using asynchronous processing to keep everything updated without overwhelming the system."
problem_solution_ja_jp = "災害時には、情報の分断がそのまま命の損失につながります。このプラットフォームは、気象フィード、危険領域、利用可能リソースを集中化し、非同期処理によってシステムを過負荷にせず更新を維持します。"
architecture = """
Baseado em pipelines de eventos, o sistema separa a ingestão de dados (sensores, APIs externas) do processamento geoespacial e da camada de visualização em tempo real (WebSockets/Leaflet).
"""
architecture_en_us = "Built on event pipelines, the system separates data ingestion (sensors and external APIs), geospatial processing and the real-time visualization layer based on WebSockets and Leaflet."

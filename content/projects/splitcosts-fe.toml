overview = """
Frontend do **SplitCosts** — SPA em React/TypeScript que consome o SplitCost-Backend para gerenciamento de despesas compartilhadas.

## Funcionalidades

- **Dashboard** — visão geral de saldos e despesas recentes por grupo
- **Registro de despesas** — formulário com divisão proporcional ou customizada
- **Reconciliação** — visualização de dívidas e sugestão de pagamentos mínimos
- **Histórico** — timeline de transações com filtros por período e categoria
- **Multi-grupo** — navegação entre diferentes households/grupos

## Stack

- React com hooks e context API
- TypeScript para type safety end-to-end (tipos compartilhados com o backend)
- Keycloak para autenticação (padrões validados no **Playground-FE**)
- React-data-grid para tabelas de dados com virtualização

## Design

Interface dark-theme com foco em clareza operacional — números grandes, cores semânticas para saldos positivos/negativos e ações primárias sempre visíveis.
"""
overview_en_us = """
Frontend of **SplitCosts** — a React / TypeScript SPA that consumes the backend to manage shared expenses.

## Features

- **Dashboard** — overview of balances and recent expenses by group
- **Expense entry** — forms with proportional or custom split rules
- **Reconciliation** — debt visualization and minimal-payment suggestions
- **History** — transaction timeline with filters by period and category
- **Multi-group** — navigation between households / groups

## Stack

- React with hooks and Context API
- TypeScript for end-to-end type safety
- Keycloak for authentication, reusing patterns validated in **Playground-FE**
- `react-data-grid` for performant tabular views

## Design

Dark-theme interface optimized for operational clarity — large numbers, semantic colors for balances and primary actions always visible.
"""
overview_ja_jp = """
**SplitCosts** のフロントエンドであり、共有支出を管理するためにバックエンドを利用する React / TypeScript SPA です。

## 機能

- **Dashboard** — グループごとの残高と最近の支出の概観
- **Expense entry** — 比例分配やカスタム分配に対応した入力フォーム
- **Reconciliation** — 債務の可視化と最小支払い提案
- **History** — 期間・カテゴリで絞り込める取引タイムライン
- **Multi-group** — household / group 間の切り替え

## スタック

- hooks と Context API を使う React
- end-to-end の型安全のための TypeScript
- **Playground-FE** で検証したパターンを再利用する Keycloak 認証
- 高速な表表示のための `react-data-grid`

## デザイン

運用の明瞭さを重視した dark theme UI で、大きな数値表示、残高の意味色、主要アクションの常時視認性を意識しています。
"""

problem_solution = """
Aplicações financeiras precisam de UX que torne números complexos compreensíveis de relance. O frontend do SplitCosts prioriza hierarquia visual clara: saldos em destaque, despesas recentes acessíveis e reconciliação a um clique.
"""
problem_solution_en_us = "Financial applications need a UX that makes complex numbers understandable at a glance. SplitCosts-FE prioritizes a clear visual hierarchy so balances, recent expenses and settlement actions are always easy to reach."
problem_solution_ja_jp = "金融アプリには、複雑な数字を一目で理解できる UX が必要です。SplitCosts-FE は、残高、最近の支出、精算アクションへすぐ到達できるよう、明確な視覚階層を優先しています。"

architecture = """
SPA React consumindo REST API do backend. Autenticação via Keycloak JS adapter (inicializado no bootstrap). State management via React context + hooks. Roteamento com React Router e lazy loading de módulos por grupo.
"""
architecture_en_us = "React SPA consuming the backend REST API. Authentication is bootstrapped through the Keycloak JS adapter, state is managed with hooks and context, and routing uses lazy-loaded modules per group."
architecture_ja_jp = "バックエンドの REST API を利用する React SPA です。認証は Keycloak JS adapter で bootstrap し、状態管理は hooks と context、routing はグループ単位の lazy-loaded module で構成します。"

overview = """
Fork do Leaflet, a biblioteca JavaScript open-source mais utilizada para renderização de mapas interativos na web.

## Papel no ecossistema

Leaflet é a camada de visualização de mapas utilizada nos projetos **SOS Location**, **brumadinho_location** e **GIS Incident Lab**. Manter o fork permite:

- Estudar internals de renderização de tiles e layers
- Testar plugins customizados antes de integrar nos projetos
- Avaliar performance com grandes volumes de marcadores

## Capacidades técnicas

- **Tile layers** — suporte a múltiplos provedores (OpenStreetMap, Mapbox, etc.)
- **GeoJSON** — renderização nativa de dados geoespaciais
- **Markers e popups** — interação com pontos de interesse
- **Layer control** — composição de camadas para visualização operacional
- **Mobile-first** — touch events e gestos nativos

## Relevância para projetos de crise

Em projetos de resposta a desastres, a capacidade de renderizar milhares de pontos com performance e de funcionar offline (tile caching) é crítica para equipes de campo.
"""
overview_en_us = """
Fork of Leaflet, the most widely used open-source JavaScript library for rendering interactive maps on the web.

## Role in the ecosystem

Leaflet is the map-visualization layer used in **SOS Location**, **brumadinho_location** and **GIS Incident Lab**. Keeping the fork available makes it possible to:

- Study tile and layer rendering internals
- Test custom plugins before integrating them into production projects
- Evaluate performance under large marker volumes

## Technical capabilities

- **Tile layers** — support for multiple providers such as OpenStreetMap and Mapbox
- **GeoJSON** — native rendering of geospatial data
- **Markers and popups** — interaction with points of interest
- **Layer control** — composition of overlays for operational views
- **Mobile-first** — touch events and native gestures

## Relevance in crisis projects

In disaster-response systems, being able to render thousands of points efficiently and to operate offline through tile caching is critical for field teams.
"""
overview_ja_jp = """
Web 上でインタラクティブ地図を描画する、最も広く使われているオープンソース JavaScript ライブラリ Leaflet のフォークです。

## エコシステム内での役割

Leaflet は **SOS Location**、**brumadinho_location**、**GIS Incident Lab** で使われている地図可視化レイヤです。フォークを維持することで、次を実現できます。

- tile と layer 描画の internals を調べる
- 本番統合前にカスタム plugin を試す
- 大量 marker 下での性能を評価する

## 技術的な能力

- **Tile layers** — OpenStreetMap や Mapbox など複数プロバイダ対応
- **GeoJSON** — 地理空間データのネイティブ描画
- **Markers / popups** — 関心地点との対話
- **Layer control** — 運用ビュー向け overlay 合成
- **Mobile-first** — touch event とネイティブ gesture

## 危機対応プロジェクトでの重要性

災害対応では、何千もの点を高速に描画し、tile cache を通じてオフラインでも動けることが現場にとって重要です。
"""

problem_solution = """
Mapas interativos na web precisam ser leves, rápidos e funcionar em dispositivos móveis de campo. Leaflet resolve isso com uma API minimalista e extensível, sem a complexidade de soluções como Google Maps ou Mapbox GL.
"""
problem_solution_en_us = "Interactive web maps need to stay lightweight, fast and usable on mobile devices in the field. Leaflet achieves that with a minimal, extensible API, avoiding the weight and complexity of heavier map stacks."
problem_solution_ja_jp = "Web のインタラクティブ地図は、軽量・高速で、現場のモバイル端末でも使えなければなりません。Leaflet は最小限で拡張しやすい API によって、それを重い地図スタックなしに実現します。"


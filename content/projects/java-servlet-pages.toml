overview = """
Projeto de estudo de desenvolvimento web com Java Servlets e JavaServer Pages (JSP), utilizando Apache Tomcat como container.

## Conceitos cobertos

- **Ciclo de vida de Servlets** — init, service, destroy
- **Requisições HTTP** — tratamento de GET, POST, redirecionamento e forwarding
- **Sessões e cookies** — gerenciamento de estado entre requisições
- **Filtros** — interceptação e processamento de requisições antes de chegar ao servlet
- **Padrão MVC** — separação entre model (JavaBeans), view (JSP) e controller (Servlets)

## Contexto

Embora frameworks modernos como Spring Boot abstraiam a maioria desses conceitos, entender Servlets é fundamental para compreender como o ecosistema web Java funciona por baixo. Todo o Spring MVC é construído sobre a Servlet API.
"""
overview_en_us = """
Study project on web development with Java Servlets and JavaServer Pages (JSP), using Apache Tomcat as the container.

## Covered concepts

- **Servlet lifecycle** — init, service and destroy
- **HTTP requests** — handling GET, POST, redirects and forwarding
- **Sessions and cookies** — state management across requests
- **Filters** — intercepting and processing requests before they hit servlets
- **MVC pattern** — separation between model (JavaBeans), view (JSP) and controller (Servlets)

## Context

Modern frameworks such as Spring Boot abstract most of these details, but understanding Servlets is still essential for grasping how the Java web ecosystem works underneath. Spring MVC itself is built on top of the Servlet API.
"""
overview_ja_jp = """
Apache Tomcat をコンテナとして使い、Java Servlets と JavaServer Pages (JSP) による Web 開発を学ぶプロジェクトです。

## 扱う概念

- **Servlet lifecycle** — init、service、destroy
- **HTTP request** — GET、POST、redirect、forward の処理
- **session と cookie** — リクエストをまたぐ状態管理
- **filter** — servlet に届く前のリクエスト横取りと前処理
- **MVC pattern** — model（JavaBeans）、view（JSP）、controller（Servlets）の分離

## 背景

Spring Boot のような現代的フレームワークはこれらを大きく抽象化しますが、Servlet を理解することは Java Web が下層でどう動いているかを知るうえで不可欠です。Spring MVC も Servlet API の上に構築されています。
"""

problem_solution = """
Frameworks modernos abstraem demais os fundamentos de HTTP no Java. Este projeto expõe diretamente a Servlet API para construir entendimento sólido de como requisições são processadas antes de trabalhar com abstrações de alto nível.
"""
problem_solution_en_us = "Modern frameworks hide too much of Java's HTTP foundations. This project exposes the Servlet API directly to build a solid understanding of request processing before relying on higher-level abstractions."
problem_solution_ja_jp = "現代のフレームワークは、Java における HTTP の基礎を抽象化しすぎる傾向があります。このプロジェクトでは Servlet API を直接扱い、高水準抽象に進む前にリクエスト処理の基礎理解を固めます。"

architecture = """
Aplicação web tradicional Java EE: web.xml para configuração de servlets e filtros, JSP para renderização de views, JavaBeans como modelos de dados. Deployada como WAR no Apache Tomcat.
"""
architecture_en_us = "Traditional Java EE web application: `web.xml` for servlet and filter configuration, JSP for view rendering and JavaBeans as data models. Packaged as a WAR and deployed on Apache Tomcat."
architecture_ja_jp = "伝統的な Java EE Web アプリ構成です。servlet と filter の設定には `web.xml`、view の描画には JSP、データモデルには JavaBeans を使用し、WAR として Apache Tomcat にデプロイします。"

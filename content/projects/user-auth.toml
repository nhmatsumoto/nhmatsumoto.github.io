overview = """
Serviço de autenticação e autorização em TypeScript/Node.js, projetado para gerenciar usuários, sessões e integração com provedores de identidade.

## Funcionalidades

- **Registro e login** — criação de contas com validação de email
- **JWT management** — emissão e validação de access/refresh tokens
- **Session management** — controle de sessões ativas com revogação
- **OAuth2 integration** — login via provedores externos (Keycloak, Google)
- **Role-based access** — controle de permissões por papel do usuário

## Relação com o ecossistema

Componente de autenticação que complementa:

- **Playground-FE** — frontend de teste para fluxos de auth
- **Security.Jwt** — biblioteca de referência para gerenciamento de chaves JWT
- **SplitCosts** — autenticação de produção via Keycloak

## Decisões de design

- Tokens de curta duração (15min access) com refresh transparente
- Hashing de senhas com bcrypt (cost factor 12)
- Rate limiting em endpoints de autenticação
- Audit log de eventos de segurança (login, logout, failed attempts)
"""
overview_en_us = """
Authentication and authorization service in TypeScript / Node.js, designed to manage users, sessions and integration with identity providers.

## Features

- **Sign up and sign in** — account creation with email validation
- **JWT management** — issuing and validating access / refresh tokens
- **Session management** — active-session control with revocation
- **OAuth2 integration** — login through external providers such as Keycloak and Google
- **Role-based access** — authorization by user role

## Relationship with the ecosystem

This authentication component complements:

- **Playground-FE** — frontend used to validate auth flows
- **Security.Jwt** — reference library for JWT key management
- **SplitCosts** — production authentication via Keycloak

## Design decisions

- Short-lived access tokens (15 minutes) with transparent refresh
- Password hashing with bcrypt (cost factor 12)
- Rate limiting on authentication endpoints
- Audit logs for security events such as login, logout and failed attempts
"""
overview_ja_jp = """
ユーザー、セッション、identity provider 連携を管理するために設計された TypeScript / Node.js 製の認証・認可サービスです。

## 機能

- **Sign up / sign in** — メール検証付きのアカウント作成
- **JWT management** — access / refresh token の発行と検証
- **Session management** — revoke 可能なアクティブ・セッション管理
- **OAuth2 integration** — Keycloak や Google などの外部プロバイダ経由ログイン
- **Role-based access** — ユーザーロール単位の認可

## エコシステムとの関係

この認証コンポーネントは次を補完します。

- **Playground-FE** — 認証フローを検証するフロントエンド
- **Security.Jwt** — JWT 鍵管理の参照ライブラリ
- **SplitCosts** — Keycloak による本番認証

## 設計判断

- 15 分の短命 access token と透過的 refresh
- bcrypt（cost factor 12）によるパスワード・ハッシュ
- 認証 endpoint への rate limiting
- login、logout、failed attempt などのセキュリティ監査ログ
"""


overview = """
Fork do NetDevPack Security.Jwt — conjunto de componentes para gerenciamento completo de JWTs em aplicações .NET.

## Funcionalidades principais

- **Rotação automática de chaves** — gera novas chaves de assinatura periodicamente sem downtime
- **JWKS endpoint** — expõe `/.well-known/jwks` para validação distribuída de tokens
- **Múltiplos algoritmos** — suporte a RSA, ECDSA e HMAC
- **Armazenamento seguro** — chaves podem ser persistidas em banco de dados, filesystem ou Azure Key Vault
- **Key revocation** — revogação de chaves comprometidas com propagação automática

## Por que rotação de chaves importa

Chaves de assinatura estáticas são um risco de segurança: se comprometidas, todos os tokens emitidos ficam vulneráveis. Rotação automática limita a janela de exposição e garante que tokens antigos expirem naturalmente.

## Uso no ecossistema

Referência direta para a implementação de autenticação nos projetos **User-Auth**, **Playground-FE** e **SplitCosts**. O padrão de JWKS é especialmente relevante em arquiteturas onde múltiplos serviços precisam validar tokens independentemente.
"""
overview_en_us = """
Fork of NetDevPack Security.Jwt, a set of components for end-to-end JWT management in .NET applications.

## Main features

- **Automatic key rotation** — generate new signing keys periodically without downtime
- **JWKS endpoint** — expose `/.well-known/jwks` for distributed token validation
- **Multiple algorithms** — RSA, ECDSA and HMAC support
- **Secure storage** — keys can be persisted in a database, filesystem or Azure Key Vault
- **Key revocation** — compromised keys can be invalidated and propagated automatically

## Why key rotation matters

Static signing keys are a security risk: once compromised, every issued token becomes vulnerable. Rotation narrows the exposure window and allows old tokens to expire naturally.

## Use in the ecosystem

This library is a direct reference for authentication design in **User-Auth**, **Playground-FE** and **SplitCosts**. JWKS is especially relevant in systems where multiple services validate tokens independently.
"""
overview_ja_jp = """
`.NET` アプリ向けに JWT をエンドツーエンドで管理するコンポーネント群、NetDevPack Security.Jwt のフォークです。

## 主な機能

- **Automatic key rotation** — 無停止で署名鍵を定期生成
- **JWKS endpoint** — 分散 token 検証のため `/.well-known/jwks` を公開
- **Multiple algorithms** — RSA、ECDSA、HMAC 対応
- **Secure storage** — DB、filesystem、Azure Key Vault へ鍵を保存可能
- **Key revocation** — 侵害鍵を無効化し、自動伝播できる

## なぜ鍵ローテーションが重要か

固定の署名鍵はセキュリティ上の大きなリスクです。侵害されると、発行済み token 全体が危険にさらされます。ローテーションは露出期間を短くし、古い token を自然失効させられます。

## エコシステムでの利用

このライブラリは **User-Auth**、**Playground-FE**、**SplitCosts** における認証設計の直接的な参照です。特に JWKS は、複数サービスが独立に token を検証する構成で重要になります。
"""


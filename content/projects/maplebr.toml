overview = """
Projeto de servidor e ferramentas para o universo MapleStory, com automação de build via Makefile.

## Contexto

MapleStory é um MMORPG que possui uma comunidade ativa de desenvolvimento de servidores privados. Este projeto reúne ferramentas, scripts de compilação e configurações para manutenção de um ambiente de servidor.

## Aspectos técnicos

- **Build system** com Makefile para compilação de componentes C++
- **Networking** — protocolo de comunicação cliente-servidor customizado
- **Gestão de dados** — handling de arquivos de dados do jogo (WZ files)
- **Automação** — scripts para deploy e manutenção do servidor
"""
overview_en_us = """
Server-and-tooling project for the MapleStory universe, with build automation orchestrated through Makefiles.

## Context

MapleStory has a long-standing private-server development community. This project brings together tooling, compilation scripts and configuration needed to maintain a server environment.

## Technical aspects

- **Build system** with Makefiles for compiling C++ components
- **Networking** — a custom client-server communication protocol
- **Data management** — handling of game data files (WZ files)
- **Automation** — scripts for deployment and server maintenance
"""
overview_ja_jp = """
MapleStory のサーバーと周辺ツールを扱うプロジェクトで、Makefile によるビルド自動化を中心に構成されています。

## 背景

MapleStory には長く続くプライベートサーバー開発コミュニティがあります。このプロジェクトは、そのサーバー環境を維持するためのツール、コンパイル・スクリプト、設定をまとめたものです。

## 技術的な要素

- **Build system** — C++ コンポーネントをコンパイルする Makefile
- **Networking** — クライアント・サーバ間の独自通信プロトコル
- **Data management** — ゲームデータ（WZ files）の取り扱い
- **Automation** — デプロイと保守のためのスクリプト
"""

problem_solution = """
Servidores de jogos exigem compilação e configuração complexa de múltiplos componentes. O Makefile centraliza o processo de build e garante reprodutibilidade na construção do ambiente.
"""
problem_solution_en_us = "Game servers require a complex build and configuration flow across multiple components. The Makefile centralizes that process and improves reproducibility when bringing the environment up."
problem_solution_ja_jp = "ゲームサーバーは複数コンポーネントにまたがる複雑なビルド・設定フローを必要とします。Makefile はその手順を一元化し、環境構築の再現性を高めます。"

architecture = """
Servidor multi-threaded em C++ com protocolo de rede proprietário. O Makefile orquestra a compilação de módulos (login server, game server, channel server) e a preparação de dados estáticos do jogo.
"""
architecture_en_us = "Multi-threaded C++ server with a proprietary network protocol. The Makefile orchestrates the build of modules such as login, game and channel servers, along with preparation of static game data."

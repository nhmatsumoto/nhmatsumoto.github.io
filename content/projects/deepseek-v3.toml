overview = """
Fork do repositório oficial do DeepSeek-V3, um Large Language Model com 671B de parâmetros totais que utiliza Mixture-of-Experts (MoE) para ativar apenas 37B por token durante inferência.

## Arquitetura MoE

Mixture-of-Experts é uma abordagem que permite escalar modelos sem aumentar proporcionalmente o custo computacional:

- **Router** — decide quais especialistas ativar para cada token
- **Expert layers** — módulos Feed-Forward especializados (apenas uma fração é ativada por vez)
- **Multi-head Latent Attention (MLA)** — comprime as key-value caches para reduzir uso de memória durante inferência

## Relevância para estudo

O DeepSeek-V3 é uma referência importante para entender:

- Trade-offs entre tamanho total do modelo e custo de inferência
- Estratégias de treinamento com FP8 mixed-precision
- Balanceamento de carga entre experts sem auxiliary losses
- Pipeline parallelism para treinamento distribuído
"""
overview_en_us = """
Fork of the official DeepSeek-V3 repository, a large language model with 671B total parameters that activates only 37B per token during inference through a Mixture-of-Experts (MoE) architecture.

## MoE architecture

Mixture-of-Experts makes it possible to scale models without increasing compute cost proportionally:

- **Router** — decides which experts to activate for each token
- **Expert layers** — specialized feed-forward modules, of which only a fraction is active at once
- **Multi-head Latent Attention (MLA)** — compresses key-value caches to reduce memory usage during inference

## Why it matters for study

DeepSeek-V3 is a useful reference for understanding:

- Trade-offs between total parameter count and inference cost
- FP8 mixed-precision training strategies
- Expert-load balancing without auxiliary losses
- Distributed training through pipeline parallelism
"""
overview_ja_jp = """
公式 DeepSeek-V3 リポジトリのフォークです。総パラメータ 671B の大規模言語モデルで、Mixture-of-Experts (MoE) により推論時にはトークンごとに 37B だけを活性化します。

## MoE アーキテクチャ

Mixture-of-Experts は、計算コストを比例的に増やさずにモデルをスケールさせる仕組みです。

- **Router** — 各トークンでどの expert を有効化するか決める
- **Expert layers** — 特化した feed-forward モジュール群で、一度に使うのは一部だけ
- **Multi-head Latent Attention (MLA)** — key-value cache を圧縮し、推論時のメモリ使用量を減らす

## 学習対象としての価値

DeepSeek-V3 は、次を理解するうえで有用な参照実装です。

- 総モデルサイズと推論コストのトレードオフ
- FP8 mixed-precision による学習戦略
- auxiliary loss を使わない expert 負荷分散
- pipeline parallelism による分散学習
"""

problem_solution = """
Treinar e servir modelos com centenas de bilhões de parâmetros é proibitivamente caro com arquiteturas densas. MoE resolve isso ativando seletivamente subconjuntos do modelo, mantendo qualidade com custo computacional uma ordem de grandeza menor.
"""
problem_solution_en_us = "Training and serving models with hundreds of billions of parameters is prohibitively expensive with dense architectures. MoE addresses that by activating only selective subsets of the model, preserving quality at roughly an order of magnitude lower compute cost."
problem_solution_ja_jp = "数百億から数千億規模のパラメータを持つモデルを、dense な構造のまま学習・提供するのは極めて高コストです。MoE は必要な部分だけを選択的に活性化することで、品質を保ちながら計算コストを大幅に抑えます。"

architecture = """
Transformer com DeepSeekMoE layers: cada camada tem um router que seleciona top-K experts de um pool maior. A inovação do V3 está na eliminação de auxiliary balancing losses, substituindo-as por um mecanismo de bias dinâmico no router.
"""
architecture_en_us = "A transformer with DeepSeekMoE layers. Each layer has a router that selects top-K experts from a larger pool. V3's key innovation is removing auxiliary balancing losses and replacing them with a dynamic router-bias mechanism."
architecture_ja_jp = "DeepSeekMoE layer を備えた transformer 構成です。各 layer には、より大きな expert pool から top-K expert を選択する router があります。V3 の主な革新は、auxiliary balancing loss を廃し、動的な router bias メカニズムに置き換えた点です。"

overview = """
Fork do Gemini CLI, o agente de IA open-source do Google que integra o modelo Gemini diretamente ao terminal, com capacidade de executar ferramentas de sistema.

## Arquitetura de agente

O Gemini CLI implementa um loop de agente clássico:

1. **Input** — recebe instrução do usuário via terminal
2. **Reasoning** — o modelo Gemini processa o contexto e decide a próxima ação
3. **Tool execution** — executa ferramentas (shell, file read/write, search)
4. **Observation** — resultado da ferramenta alimenta o próximo ciclo
5. **Output** — resposta final ao usuário

## Por que este fork

Estudo comparativo de arquiteturas de agentes de código. Compara abordagens do Gemini CLI com Claude Code e outros agentes no repositório **system-prompts-and-models-of-ai-tools**.

## Pontos de interesse

- Gestão de contexto e memória entre turnos
- Estratégia de tool selection e parameter extraction
- Sandboxing e permissões de execução
- Streaming de respostas longas
"""
overview_en_us = """
Fork of Gemini CLI, Google's open-source AI agent that plugs the Gemini model directly into the terminal with the ability to execute system tools.

## Agent architecture

Gemini CLI implements a classic agent loop:

1. **Input** — receive a user instruction through the terminal
2. **Reasoning** — the Gemini model evaluates context and chooses the next action
3. **Tool execution** — run tools such as shell, file read/write or search
4. **Observation** — feed tool results back into the next cycle
5. **Output** — produce the final response

## Why this fork

Comparative study of coding-agent architectures. It contrasts Gemini CLI with Claude Code and other agents cataloged in **system-prompts-and-models-of-ai-tools**.

## Topics of interest

- Context and memory management across turns
- Tool selection and parameter extraction
- Sandboxing and execution permissions
- Streaming of long responses
"""
overview_ja_jp = """
Gemini モデルを端末に直接接続し、システムツールを実行できる Google 製オープンソース AI エージェント、Gemini CLI のフォークです。

## エージェント・アーキテクチャ

Gemini CLI は古典的なエージェント・ループを実装しています。

1. **Input** — 端末経由でユーザー指示を受け取る
2. **Reasoning** — Gemini モデルが文脈を評価し、次の行動を決める
3. **Tool execution** — shell、ファイル読取/書込、検索などを実行する
4. **Observation** — ツール結果を次のサイクルへ戻す
5. **Output** — 最終応答を返す

## このフォークの理由

コードエージェント・アーキテクチャの比較研究です。**system-prompts-and-models-of-ai-tools** に整理された Claude Code などのエージェントと対比できます。

## 注目ポイント

- ターンをまたぐコンテキストとメモリ管理
- ツール選択とパラメータ抽出
- サンドボックスと実行権限
- 長文レスポンスのストリーミング

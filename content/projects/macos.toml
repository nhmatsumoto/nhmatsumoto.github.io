overview = """
Fork do projeto que permite executar macOS dentro de um container Docker, utilizando QEMU/KVM para virtualização.

## Motivação

Desenvolvimento cross-platform frequentemente exige testar em macOS sem ter acesso a hardware Apple. Este projeto permite criar ambientes macOS efêmeros para:

- Testes de compatibilidade de aplicações
- Build de projetos iOS/macOS em CI/CD Linux
- Experimentação com APIs exclusivas do macOS

## Como funciona

O container utiliza QEMU com aceleração KVM para virtualizar o hardware necessário, incluindo emulação de dispositivos Apple. A imagem do macOS é carregada de um disco virtual dentro do container.

## Considerações

A virtualização de macOS está sujeita aos termos de licenciamento da Apple (EULA), que restringe a execução a hardware Apple genuíno. Este fork é mantido para estudo da tecnologia de virtualização, não para uso em produção.
"""
overview_en_us = """
Fork of the project that runs macOS inside a Docker container by using QEMU / KVM for virtualization.

## Motivation

Cross-platform development often requires testing on macOS without access to Apple hardware. This project makes it possible to create ephemeral macOS environments for:

- Compatibility testing
- Building iOS / macOS projects from Linux CI pipelines
- Experimenting with macOS-only APIs

## How it works

The container uses QEMU with KVM acceleration to virtualize the required hardware, including Apple-specific device emulation. A macOS image is loaded from a virtual disk inside the container.

## Considerations

macOS virtualization is subject to Apple's licensing terms (EULA), which restrict execution to genuine Apple hardware. This fork is kept for studying virtualization technology, not for production use.
"""
overview_ja_jp = """
QEMU / KVM を用いて Docker コンテナ内で macOS を動かすプロジェクトのフォークです。

## 動機

クロスプラットフォーム開発では、Apple ハードウェアがなくても macOS 上での検証が必要になることがあります。このプロジェクトは、次のための使い捨て macOS 環境を作れるようにします。

- 互換性テスト
- Linux CI からの iOS / macOS ビルド
- macOS 専用 API の実験

## 仕組み

コンテナは QEMU と KVM アクセラレーションを用いて必要なハードウェアを仮想化し、Apple デバイスのエミュレーションも含みます。macOS イメージはコンテナ内の仮想ディスクから読み込まれます。

## 注意点

macOS 仮想化は Apple のライセンス規約（EULA）の対象であり、実行は正規 Apple ハードウェアに制限されます。このフォークは本番利用ではなく、仮想化技術の研究目的で保持しています。
"""

problem_solution = """
Desenvolvedores que trabalham em Linux/Windows mas precisam testar em macOS enfrentam um gap de acesso. A virtualização via Docker reduz a fricção ao criar ambientes macOS descartáveis, embora com limitações de performance e licenciamento.
"""
problem_solution_en_us = "Developers working on Linux or Windows but needing macOS testing face an access gap. Containerized virtualization reduces friction by creating disposable macOS environments, albeit with performance and licensing constraints."

overview = """
Fork do Mermaid.js, a biblioteca de geração de diagramas a partir de texto que é integrada nativamente no Technical Knowledge OS.

## Uso no ecossistema

O Mermaid é utilizado em posts, documentos e projetos para renderizar diagramas técnicos diretamente no conteúdo markdown:

- **Flowcharts** — fluxos de processamento e pipelines
- **Sequence diagrams** — interações entre serviços
- **Class diagrams** — modelagem de domínio
- **ER diagrams** — esquemas de banco de dados
- **Gantt charts** — cronogramas de projeto

## Integração

O render engine do blog detecta blocos de código marcados como `mermaid` e os renderiza automaticamente como SVG no lado do cliente. A biblioteca é carregada via CDN com tema escuro configurado para o design do site.

## Exemplo

Um bloco como:

```
graph LR
  A[Input] --> B[Process]
  B --> C[Output]
```

É renderizado como um diagrama de fluxo interativo diretamente na página.
"""
overview_en_us = """
Fork of Mermaid.js, the text-to-diagram library integrated natively into Technical Knowledge OS.

## Use inside the ecosystem

Mermaid is used across posts, documents and project pages to render technical diagrams directly from markdown content:

- **Flowcharts** — processing flows and pipelines
- **Sequence diagrams** — interactions between services
- **Class diagrams** — domain modeling
- **ER diagrams** — database schemas
- **Gantt charts** — project schedules

## Integration

The blog rendering engine detects fenced code blocks marked as `mermaid` and renders them automatically to SVG on the client. The library is loaded via CDN with theming adapted to the site's design.

## Example

A block such as:

```
graph LR
  A[Input] --> B[Process]
  B --> C[Output]
```

is rendered directly as an interactive flow diagram in the page.
"""
overview_ja_jp = """
Technical Knowledge OS にネイティブ統合されているテキストベース図表ライブラリ Mermaid.js のフォークです。

## エコシステム内での利用

Mermaid は記事、文書、プロジェクト・ページ全体で使われ、markdown から技術図を直接描画します。

- **Flowcharts** — 処理フローとパイプライン
- **Sequence diagrams** — サービス間相互作用
- **Class diagrams** — ドメインモデリング
- **ER diagrams** — DB スキーマ
- **Gantt charts** — プロジェクト日程

## 統合方法

ブログのレンダリングエンジンは `mermaid` と付いた fenced code block を検出し、クライアント側で自動的に SVG として描画します。ライブラリは CDN 経由で読み込み、テーマはサイトのデザインに合わせて調整しています。

## 例

次のようなブロックは:

```
graph LR
  A[Input] --> B[Process]
  B --> C[Output]
```

ページ上でそのままインタラクティブなフローダイアグラムとして表示されます。

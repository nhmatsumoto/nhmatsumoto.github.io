problem_solution = """
Documentação técnica com diagramas estáticos (imagens) é difícil de manter e versionar. Mermaid resolve isso tratando diagramas como código: versionáveis, diff-friendly e atualizados automaticamente quando o texto muda.
"""
problem_solution_en_us = "Technical documentation based on static diagram images is hard to maintain and diff. Mermaid solves that by treating diagrams as code: versionable, reviewable and updated automatically when the text changes."
problem_solution_ja_jp = "静的画像に依存する技術ドキュメントは保守しづらく、差分も追いにくいものです。Mermaid は図をコードとして扱うことでそれを解決します。バージョン管理でき、レビューしやすく、テキスト変更に合わせて自動更新されます。"

architecture = """
Parser PEG.js que converte sintaxe textual em AST, renderer que transforma AST em SVG via D3.js. Suporta temas customizáveis e integração com markdown parsers via blocos de código fenced.
"""
architecture_en_us = "A PEG.js parser converts textual syntax into an AST, and the renderer turns that AST into SVG through D3.js. The library supports custom themes and integration with markdown parsers through fenced code blocks."
architecture_ja_jp = "PEG.js parser がテキスト構文を AST に変換し、renderer がその AST を D3.js 経由で SVG に変換します。カスタムテーマや fenced code block を通じた markdown parser 連携もサポートしています。"

production_notes = """
Pipeline em operação contínua desde 2024. Stack real: .NET para serviços de ingestão e normalização, Python para geoprocessamento pesado. A separação cálculo/regra permitiu que o time de dados iterasse sem impactar a API operacional. Tempo médio de resolução de incidentes GIS caiu de 4h para 45min após adoção da ops view.
"""
production_notes_en_us = "Pipeline in continuous production use since 2024. Real stack: .NET for ingestion and normalization services, Python for heavy geoprocessing. Separating calculation from business rules allowed the data team to iterate without affecting the operational API. Mean resolution time for GIS incidents dropped from 4 hours to 45 minutes after adopting the ops view."
production_notes_ja_jp = "2024 年から継続的に運用中のパイプラインです。実スタックは、取り込みと正規化サービスに .NET、重い地理処理に Python を使用。計算処理と業務ルールを分離したことで、データチームは運用 API に影響を与えず改善を回せました。GIS インシデントの平均解決時間は、ops view 採用後に 4 時間から 45 分へ短縮しました。"

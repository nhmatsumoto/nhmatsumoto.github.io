overview = """
Aplicação de speed reading que apresenta texto em chunks otimizados para leitura rápida, inspirada na técnica RSVP (Rapid Serial Visual Presentation).

## Como funciona

O texto é dividido em fragmentos (1-3 palavras) apresentados sequencialmente no centro da tela. O ponto focal (ORP - Optimal Recognition Point) de cada palavra é destacado para reduzir movimentos oculares.

## Funcionalidades

- Controle de velocidade (palavras por minuto)
- Tracking de progresso de leitura
- Import de textos em diferentes formatos
- Ajuste de tamanho de chunk por complexidade do texto

## Contexto

Este projeto explora a interseção entre interface de usuário e cognição humana - como a apresentação do texto afeta a velocidade e compreensão de leitura.
"""
overview_en_us = """
Speed-reading application that presents text in optimized chunks, inspired by the RSVP (Rapid Serial Visual Presentation) technique.

## How it works

Text is divided into small fragments of one to three words and displayed sequentially at the center of the screen. The focal point (ORP - Optimal Recognition Point) of each word is highlighted to reduce eye movement.

## Features

- Reading-speed control (words per minute)
- Progress tracking
- Text import in multiple formats
- Chunk-size adjustment based on text complexity

## Context

The project explores the boundary between user interface design and human cognition - how text presentation influences reading speed and comprehension.
"""
overview_ja_jp = """
RSVP（Rapid Serial Visual Presentation）に着想を得て、最適化されたチャンク単位でテキストを提示する速読アプリです。

## 仕組み

テキストを 1〜3 語の小さな断片に分割し、画面中央に順番に表示します。各語の焦点（ORP - Optimal Recognition Point）を強調し、眼球移動を減らします。

## 機能

- 読書速度の制御（words per minute）
- 進捗トラッキング
- 複数形式のテキスト import
- テキスト複雑度に応じた chunk サイズ調整

## 背景

このプロジェクトは、UI 設計と人間の認知の境界、つまりテキスト提示方法が読書速度と理解度にどう影響するかを探ります。
"""

problem_solution = """
Leitura convencional é limitada por movimentos oculares (saccades) e regressões. A técnica RSVP elimina esses fatores apresentando o texto em um ponto fixo, permitindo velocidades de leitura significativamente maiores.
"""
problem_solution_en_us = "Conventional reading is limited by saccades and regressions. RSVP reduces those effects by fixing the presentation point, enabling significantly higher reading speeds for the right kind of content."
problem_solution_ja_jp = "通常の読書は、サッカードと回帰によって速度が制約されます。RSVP は表示位置を固定することでそれらを減らし、適したコンテンツでは読書速度を大きく引き上げます。"

architecture = """
SPA em React/TypeScript com state machine para controle do fluxo de apresentação. O texto é tokenizado e processado em um pipeline: input → tokenize → chunk → schedule → render.
"""

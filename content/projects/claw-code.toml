overview = """
Fork do projeto Claw Code, focado em criar ferramentas úteis para análise e experimentação com a arquitetura de agentes de código como Claude Code.

## Motivação

Entender como agentes de código funcionam internamente — seus system prompts, tool loops, decisão de contexto — é fundamental para quem trabalha com automação de engenharia. Este projeto vai além do arquivo: transforma referência em ferramenta.

## Reescrita em Rust

A versão atual está sendo reescrita em Rust para:

- **Performance** — parsing e análise de prompts grandes sem overhead de runtime
- **Portabilidade** — binário único sem dependências
- **CLI ergonômico** — interface de terminal com output formatado

## Relação com o ecossistema

Complementa o repositório **system-prompts-and-models-of-ai-tools** como referência de engenharia de prompts e arquitetura de agentes.
"""
overview_en_us = """
Fork of the Claw Code project, focused on building useful tooling for analyzing and experimenting with code-agent architectures such as Claude Code.

## Motivation

Understanding how coding agents work internally — system prompts, tool loops, context decisions — is essential for anyone automating engineering workflows. This project turns a reference implementation into practical tooling.

## Rust rewrite

The current version is being rewritten in Rust to improve:

- **Performance** — parsing and analyzing large prompts without runtime overhead
- **Portability** — a single binary with no external dependencies
- **CLI ergonomics** — a polished terminal interface with structured output

## Relationship with the ecosystem

It complements **system-prompts-and-models-of-ai-tools** as a practical companion for prompt engineering and agent-architecture analysis.
"""
overview_ja_jp = """
Claude Code のようなコードエージェントのアーキテクチャを分析・実験するための実用ツールを作ることに焦点を当てた、Claw Code プロジェクトのフォークです。

## 動機

コードエージェントの内部動作、つまり system prompt、tool loop、コンテキスト判断を理解することは、開発フローを自動化するうえで重要です。このプロジェクトは、参照実装を実用ツールへと変換します。

## Rust への書き直し

現在のバージョンは、次を改善するため Rust へ書き直し中です。

- **性能** — 大きな prompt をランタイム・オーバーヘッドなしに解析
- **可搬性** — 依存の少ない単一バイナリ
- **CLI 体験** — 整形済み出力を持つ使いやすい端末インターフェース

## エコシステムとの関係

**system-prompts-and-models-of-ai-tools** を、より実践的なプロンプト工学・エージェント分析ツールとして補完します。
"""


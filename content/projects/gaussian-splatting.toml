overview = """
Fork da implementação de referência do paper "3D Gaussian Splatting for Real-Time Radiance Field Rendering" (SIGGRAPH 2023).

## O que é Gaussian Splatting

Diferente de NeRFs (Neural Radiance Fields) que usam redes neurais para representar cenas, Gaussian Splatting representa a cena como milhões de gaussianas 3D semi-transparentes. Cada gaussiana tem:

- **Posição** (xyz) no espaço 3D
- **Covariância** (3x3) que define forma e orientação
- **Opacidade** (alpha)
- **Cor** representada em spherical harmonics

## Vantagens sobre NeRFs

- **Renderização em tempo real** (>100 FPS) vs. segundos por frame em NeRFs
- **Rasterização diferenciável** permite otimização por gradiente
- **Sem rede neural** na etapa de inferência — apenas projeção e alpha compositing
- **Qualidade visual** comparável ou superior a NeRFs estado-da-arte

## Relevância

O estudo de técnicas de renderização neural é relevante para aplicações de visualização 3D, realidade aumentada e reconstrução de cenas a partir de fotografias.
"""
overview_en_us = """
Fork of the reference implementation for the paper "3D Gaussian Splatting for Real-Time Radiance Field Rendering" (SIGGRAPH 2023).

## What Gaussian Splatting is

Unlike NeRFs (Neural Radiance Fields), which rely on neural networks to represent scenes, Gaussian Splatting models a scene as millions of semi-transparent 3D Gaussians. Each Gaussian carries:

- **Position** (xyz) in 3D space
- **Covariance** (3x3) defining shape and orientation
- **Opacity** (alpha)
- **Color** represented with spherical harmonics

## Advantages over NeRFs

- **Real-time rendering** (>100 FPS) instead of seconds per frame
- **Differentiable rasterization** for gradient-based optimization
- **No neural network in the inference stage** — only projection and alpha compositing
- **Visual quality** comparable to or better than state-of-the-art NeRFs

## Relevance

Neural-rendering techniques matter for 3D visualization, augmented reality and scene reconstruction from photographs.
"""
overview_ja_jp = """
論文 "3D Gaussian Splatting for Real-Time Radiance Field Rendering"（SIGGRAPH 2023）の参照実装フォークです。

## Gaussian Splatting とは

NeRF（Neural Radiance Fields）のようにニューラルネットでシーンを表現するのではなく、Gaussian Splatting はシーンを半透明な 3D Gaussian の大量集合として表現します。各 Gaussian は次を持ちます。

- **位置** (xyz)
- **共分散** (3x3) による形状と向き
- **不透明度** (alpha)
- **球面調和関数で表された色**

## NeRF に対する利点

- **リアルタイム描画**（>100 FPS）で、NeRF のように 1 フレーム数秒かからない
- **微分可能ラスタライズ** により勾配最適化が可能
- **推論段階でニューラルネット不要** — 射影と alpha compositing のみ
- **視覚品質** は最先端 NeRF と同等以上

## 関連性

こうしたニューラル描画技術は、3D 可視化、拡張現実、写真からのシーン再構成に重要です。
"""

problem_solution = """
NeRFs produzem resultados visuais impressionantes mas são lentos demais para aplicações em tempo real. Gaussian Splatting resolve isso substituindo a rede neural por primitivas geométricas explícitas que podem ser rasterizadas eficientemente em GPU.
"""
problem_solution_en_us = "NeRFs can produce impressive results, but they are too slow for real-time applications. Gaussian Splatting addresses that by replacing implicit neural representation with explicit geometric primitives that can be rasterized efficiently on the GPU."
problem_solution_ja_jp = "NeRF は非常に高品質ですが、リアルタイム用途には遅すぎます。Gaussian Splatting は、暗黙的なニューラル表現を GPU で効率よくラスタライズできる明示的な幾何プリミティブに置き換えることで、この問題を解決します。"

architecture = """
Pipeline de treinamento: inicialização via Structure-from-Motion (COLMAP) → otimização iterativa das gaussianas via gradiente → adaptive density control (split/clone/prune). Renderização via tile-based rasterizer customizado em CUDA.
"""
architecture_en_us = "Training pipeline: initialize via Structure-from-Motion (COLMAP) → iteratively optimize Gaussians through gradients → apply adaptive density control (split / clone / prune). Rendering is done through a custom tile-based CUDA rasterizer."

overview = """
Fork do AutoMapper, a biblioteca mais utilizada no ecossistema .NET para mapeamento automático entre objetos de diferentes camadas (DTOs, ViewModels, Entities).

## Por que este fork

AutoMapper é referência direta para projetos como SplitCosts e Financial, onde a separação entre domínio e contratos de API exige transformações frequentes entre modelos. Manter o fork permite estudar a implementação interna e avaliar trade-offs de performance vs. conveniência.

## Conceitos centrais

- **Convention over configuration** — propriedades com mesmo nome são mapeadas automaticamente
- **Profiles** — agrupamento de configurações de mapeamento por contexto de domínio
- **Projections** — integração com LINQ/EF para projeções diretas no banco de dados
- **Validação de configuração** — detecção antecipada de mapeamentos incompletos em tempo de inicialização
"""
overview_en_us = """
Fork of AutoMapper, the most widely used library in the .NET ecosystem for automatic mapping between objects from different layers (DTOs, ViewModels and Entities).

## Why this fork

AutoMapper is a direct reference for projects such as SplitCosts and Financial, where the separation between domain models and API contracts requires frequent transformations between representations. Keeping the fork available makes it possible to inspect the internal implementation and evaluate performance-versus-convenience trade-offs.

## Core concepts

- **Convention over configuration** — properties with the same name are mapped automatically
- **Profiles** — grouping mapping configuration by domain context
- **Projections** — integration with LINQ/EF for database-side projections
- **Configuration validation** — early detection of incomplete mappings during startup
"""
overview_ja_jp = """
AutoMapper のフォークです。.NET エコシステムで最も広く使われている、異なるレイヤー間（DTO、ViewModel、Entity）のオブジェクトを自動マッピングするライブラリです。

## このフォークの理由

AutoMapper は SplitCosts や Financial のようなプロジェクトにおける直接的な参照実装です。ドメインと API 契約を分離すると、表現間の変換が頻繁に発生します。フォークを維持することで、内部実装を調べ、パフォーマンスと利便性のトレードオフを評価できます。

## 中核となる考え方

- **Convention over configuration** — 同名プロパティを自動マッピング
- **Profiles** — ドメイン文脈ごとにマッピング設定を整理
- **Projections** — LINQ / EF と統合し、DB 側で投影を実行
- **Configuration validation** — 起動時に不完全なマッピングを早期検出
"""

problem_solution = """
Código de mapeamento manual entre camadas é repetitivo e frágil. AutoMapper resolve isso com convenções que reduzem boilerplate, mas exige disciplina: mapeamentos implícitos podem esconder bugs quando os modelos divergem.
"""
problem_solution_en_us = "Manual mapping code between layers is repetitive and fragile. AutoMapper reduces that boilerplate through conventions, but it requires discipline: implicit mappings can hide bugs when models diverge."
problem_solution_ja_jp = "レイヤー間の手動マッピングコードは反復的で壊れやすいものです。AutoMapper は規約でその定型コードを減らしますが、規律は必要です。モデルが乖離すると、暗黙マッピングが不具合を隠すことがあります。"

architecture = """
AutoMapper utiliza reflection e expression trees para gerar mapeamentos em tempo de compilação do perfil. A versão mais recente introduziu source generators como alternativa para eliminar overhead de reflection em cenários de alta performance.
"""
architecture_en_us = "AutoMapper uses reflection and expression trees to generate mappings when profiles are compiled. Newer versions also introduced source generators as an alternative for eliminating reflection overhead in performance-sensitive scenarios."
architecture_ja_jp = "AutoMapper は profile のコンパイル時に reflection と expression tree を使ってマッピングを生成します。最近のバージョンでは、高性能が求められる場面で reflection のオーバーヘッドを避けるため、source generator も導入されました。"

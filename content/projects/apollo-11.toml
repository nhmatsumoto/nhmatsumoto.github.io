overview = """
Fork do código-fonte original do Apollo 11 Guidance Computer (AGC), escrito em assembly para o computador de bordo que levou a humanidade à Lua em 1969.

O AGC foi um dos primeiros sistemas de computação embarcada a operar em tempo real com restrições extremas de memória e processamento. O código é dividido entre o módulo de comando (Comanche055) e o módulo lunar (Luminary099).

## Relevância técnica

Este repositório serve como referência histórica para estudo de:

- **Arquitetura de software embarcado** sob restrições severas de hardware
- **Sistemas de tempo real** com prioridade de tarefas e preempção
- **Tolerância a falhas** - o famoso alarme 1202 durante o pouso é um exemplo clássico de design resiliente
- **Engenharia de missão crítica** onde bugs podem ter consequências irreversíveis

## Contexto

O AGC tinha apenas 74KB de memória ROM e 4KB de RAM. Todo o software de navegação, controle de atitude e interface com astronautas cabia nesse espaço. A arquitetura de prioridades do AGC influenciou gerações de sistemas operacionais de tempo real.
"""
overview_en_us = """
Fork of the original Apollo 11 Guidance Computer (AGC) source code, written in assembly for the onboard computer that took humanity to the Moon in 1969.

The AGC was one of the first embedded computing systems to operate in real time under extreme memory and processing constraints. The code is split between the command module (Comanche055) and the lunar module (Luminary099).

## Technical relevance

This repository is a historical reference for studying:

- **Embedded software architecture** under severe hardware constraints
- **Real-time systems** with task priorities and preemption
- **Fault tolerance** - the famous 1202 alarm during landing is a classic example of resilient design
- **Mission-critical engineering** where bugs can have irreversible consequences

## Context

The AGC had only 74 KB of ROM and 4 KB of RAM. All navigation software, attitude control logic and the astronaut interface had to fit within that space. The AGC priority model influenced generations of real-time operating systems.
"""
overview_ja_jp = """
1969 年に人類を月へ導いたオンボード計算機向けに assembly で書かれた、Apollo 11 Guidance Computer (AGC) オリジナル・ソースコードのフォークです。

AGC は、極端なメモリと処理能力の制約の下でリアルタイム動作した最初期の組み込み計算システムのひとつでした。コードは司令船モジュール（Comanche055）と月着陸船モジュール（Luminary099）に分かれています。

## 技術的な重要性

このリポジトリは、以下を学ぶための歴史的リファレンスです。

- **厳しいハードウェア制約下での組み込みソフトウェアアーキテクチャ**
- **優先度付きタスクとプリエンプションを備えたリアルタイムシステム**
- **フォールトトレランス** - 着陸時の有名な 1202 アラームはレジリエント設計の古典例です
- **ミッションクリティカル工学** - バグが取り返しのつかない結果を招きうる領域

## 背景

AGC が持っていたのは ROM 74 KB、RAM 4 KB だけでした。航法ソフトウェア、姿勢制御、宇宙飛行士向けインターフェースのすべてをこの容量に収める必要がありました。AGC の優先度アーキテクチャは、その後のリアルタイム OS 世代に影響を与えました。
"""

problem_solution = """
O código original estava disperso em documentos históricos e microfilmes. A digitalização e publicação no GitHub permitiu que engenheiros modernos estudassem as decisões de design que tornaram possível a navegação lunar com hardware extremamente limitado.
"""
problem_solution_en_us = "The original code was scattered across historical documents and microfilms. Digitizing and publishing it on GitHub allowed modern engineers to study the design decisions that made lunar navigation possible on extremely limited hardware."
problem_solution_ja_jp = "オリジナルのコードは歴史資料やマイクロフィルムに散在していました。それをデジタル化して GitHub で公開したことで、極端に限られたハードウェアで月面航法を可能にした設計判断を、現代のエンジニアが検証できるようになりました。"

architecture = """
O AGC utiliza uma arquitetura de execução baseada em jobs com prioridades, onde tarefas críticas (como controle de atitude) podem interromper tarefas de menor prioridade. O sistema operacional embarcado gerencia filas de execução, I/O com sensores inerciais e interface DSKY (Display & Keyboard).
"""
architecture_en_us = "The AGC uses a priority-based job execution architecture, where critical tasks such as attitude control can interrupt lower-priority work. The embedded operating system manages execution queues, inertial-sensor I/O and the DSKY (Display & Keyboard) interface."
architecture_ja_jp = "AGC は優先度ベースのジョブ実行アーキテクチャを採用しており、姿勢制御のような重要タスクが低優先度タスクを割り込めます。組み込み OS は実行キュー、慣性センサー I/O、DSKY（Display & Keyboard）インターフェースを管理します。"

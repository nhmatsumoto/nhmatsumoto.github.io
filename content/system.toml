[[about.sections]]
title = "software como sistema inteiro"
title_en_us = "software as a whole system"
title_ja_jp = "全体としてのソフトウェア"
body = """
Meu trabalho começa antes do código e continua depois do deploy. Eu gosto de entender o problema, encontrar a linguagem certa para o domínio, desenhar uma arquitetura que não prenda o futuro e implementar com atenção ao detalhe operacional.

Essa forma de trabalhar vem de anos construindo e mantendo software em contextos diferentes: consultoria, produto, sistemas corporativos, integrações, APIs, backends críticos e projetos próprios. O padrão que ficou foi simples: software precisa ser tecnicamente correto, mas também precisa explicar valor, reduzir atrito e continuar compreensível quando cresce.
"""
body_en_us = """
My work starts before code and continues after deployment. I like understanding the problem, finding the right language for the domain, designing architecture that does not trap the future and implementing with attention to operational detail.

This way of working comes from years building and maintaining software in different contexts: consulting, product, enterprise systems, integrations, APIs, critical backends and personal projects. The pattern that stayed is simple: software must be technically correct, but it must also explain value, reduce friction and remain understandable as it grows.
"""
body_ja_jp = """
私の仕事はコードを書く前から始まり、デプロイの後も続きます。問題を理解し、ドメインに合う言葉を見つけ、未来を閉じ込めないアーキテクチャを設計し、運用の細部まで意識して実装することに関心があります。

この働き方は、コンサルティング、プロダクト、業務システム、連携、API、重要なバックエンド、自分のプロジェクトなど、異なる文脈でソフトウェアを作り、保守してきた経験から来ています。残った基準はシンプルです。ソフトウェアは技術的に正しいだけでなく、価値を説明し、摩擦を減らし、成長しても理解できるものであるべきです。
"""

[[about.sections]]
title = "base técnica, sem fetiche"
title_en_us = "technical base, without fetish"
title_ja_jp = "技術基盤、過剰なこだわりなし"
body = """
Tenho uma base forte em backend: .NET Core/C#, SQL Server, Clean Architecture, DDD, CQRS, mensageria, persistência, cache, containers, CI/CD e suporte a produção. Mas não trato stack como identidade. Stack é ferramenta para preservar clareza e entregar comportamento confiável.

O que me importa é conseguir atravessar as camadas sem perder o desenho: regra de negócio, contrato de API, modelo de dados, filas, observabilidade, experiência de uso e manutenção futura. Quando essas peças conversam, o sistema fica mais fácil de operar e mais honesto com quem depende dele.
"""
body_en_us = """
I have a strong backend base: .NET Core/C#, SQL Server, Clean Architecture, DDD, CQRS, messaging, persistence, cache, containers, CI/CD and production support. But I do not treat a stack as an identity. A stack is a tool to preserve clarity and deliver reliable behavior.

What matters to me is crossing layers without losing the design: business rule, API contract, data model, queues, observability, user experience and future maintenance. When those pieces talk to each other, the system becomes easier to operate and more honest with the people who depend on it.
"""
body_ja_jp = """
私の基盤はバックエンドにあります。.NET Core/C#、SQL Server、Clean Architecture、DDD、CQRS、メッセージング、永続化、キャッシュ、コンテナ、CI/CD、本番運用サポートです。ただし、スタックを自分のアイデンティティにはしません。スタックは明瞭さを保ち、信頼できる振る舞いを届けるための道具です。

大事なのは、業務ルール、API の契約、データモデル、キュー、可観測性、利用体験、将来の保守を、設計を失わずにつなげることです。それらが会話できると、システムは運用しやすくなり、それに依存する人に対してより誠実になります。
"""

[[about.sections]]
title = "produto, negócio e entrega"
title_en_us = "product, business and delivery"
title_ja_jp = "プロダクト、ビジネス、提供"
body = """
Eu me interesso pelo caminho completo entre uma ideia e o valor percebido por quem usa. Isso inclui o recorte do problema, as restrições do negócio, a arquitetura possível, a experiência da interface, a forma de operar e o feedback que volta depois.

Pagamentos, mobilidade, recuperação financeira, telecom, educação, ERP e software corporativo me ensinaram que domínio muda, mas a pergunta central se repete: que decisão este sistema facilita, que risco ele reduz e que atrito ele remove? A tecnologia entra para sustentar essa resposta.
"""
body_en_us = """
I am interested in the whole path between an idea and the value perceived by the people who use it. That includes framing the problem, understanding business constraints, choosing a possible architecture, shaping the interface experience, operating the system and listening to the feedback that returns.

Payments, mobility, financial recovery, telecom, education, ERP and enterprise software taught me that domains change, but the central question repeats: what decision does this system make easier, what risk does it reduce and what friction does it remove? Technology exists to support that answer.
"""
body_ja_jp = """
私は、アイデアから使う人が感じる価値までの道筋全体に関心があります。問題の切り出し、ビジネス上の制約、選べるアーキテクチャ、インターフェースの体験、運用の仕方、戻ってくるフィードバックまで含みます。

決済、モビリティ、金融回収、通信、教育、ERP、業務ソフトウェアから学んだのは、ドメインは変わっても中心の問いは繰り返されるということです。このシステムはどの判断を楽にし、どのリスクを減らし、どの摩擦を取り除くのか。技術はその答えを支えるためにあります。
"""

[[about.sections]]
title = "projetos autorais como laboratório sério"
title_en_us = "personal projects as serious labs"
title_ja_jp = "真剣な実験場としての個人プロジェクト"
body = """
Projetos autorais são uma forma prática de manter pensamento e execução no mesmo lugar. SOS Location, por exemplo, concentra backend, GIS, regras operacionais, mapas, risco, simulação e interface. Nihongo Sensei segue outra direção, mas nasce da mesma vontade: transformar aprendizado e uso real em produto.

Este site também faz parte disso. Ele não é só vitrine. É uma peça do meu processo: escrever para pensar melhor, organizar decisões, publicar sistemas em andamento e deixar rastros técnicos que possam ser revisitados.
"""
body_en_us = """
Personal projects are a practical way to keep thinking and execution in the same place. SOS Location, for example, brings together backend, GIS, operational rules, maps, risk, simulation and interface. Nihongo Sensei follows another direction, but comes from the same will: turning learning and real use into product.

This site is part of that too. It is not just a showcase. It is part of my process: writing to think better, organizing decisions, publishing systems in progress and leaving technical traces that can be revisited.
"""
body_ja_jp = """
個人プロジェクトは、思考と実行を同じ場所に置くための実践的な方法です。たとえば SOS Location は、バックエンド、GIS、運用ルール、地図、リスク、シミュレーション、インターフェースをまとめています。Nihongo Sensei は別の方向ですが、学習と実際の利用をプロダクトに変えたいという同じ意志から生まれています。

このサイトもその一部です。単なるショーケースではありません。よりよく考えるために書き、意思決定を整理し、進行中のシステムを公開し、後から見直せる技術的な跡を残すための場所です。
"""

[[about.sections]]
title = "a assinatura que procuro"
title_en_us = "the signature I look for"
title_ja_jp = "目指している署名"
body = """
Tenho inclinação por sistemas em que dados, pessoas e decisão se encontram. Mapas que precisam explicar uma situação. Agentes que precisam operar com rastreabilidade. Interfaces que precisam acalmar a leitura. Backends que precisam sustentar regra sem virar labirinto.

O que procuro é esse ponto em que engenharia deixa de ser só implementação e vira clareza aplicada: uma solução que alguém consegue usar, operar, explicar e evoluir.
"""
body_en_us = """
I am drawn to systems where data, people and decision meet. Maps that need to explain a situation. Agents that need to operate with traceability. Interfaces that need to calm the reading experience. Backends that need to support rules without becoming a maze.

What I look for is that point where engineering stops being only implementation and becomes applied clarity: a solution someone can use, operate, explain and evolve.
"""
body_ja_jp = """
データ、人、判断が交わるシステムに惹かれます。状況を説明する必要がある地図。トレーサビリティを持って動く必要があるエージェント。読む体験を落ち着かせるインターフェース。迷路にならずにルールを支えるバックエンド。

私が探しているのは、エンジニアリングが単なる実装ではなく、適用された明晰さになる地点です。つまり、誰かが使い、運用し、説明し、進化させられる解決策です。
"""


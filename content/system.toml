[[about.sections]]
title = "de onde eu venho"
title_en_us = "where I come from"
title_ja_jp = "私の出発点"
body = """
Venho de uma criação humilde no Brasil. Meus pais são agricultores, estudei em escola pública e cresci entendendo cedo que quase nada chegaria pronto. Isso não virou discurso de superação para mim. Virou uma forma prática de olhar para as coisas: observar, aprender, insistir e construir com o que existe.

Tecnologia entrou nesse caminho muito cedo. Eu tinha 9 ou 10 anos quando comecei a tentar entender como páginas e sistemas funcionavam. Aprendi HTML, CSS e JavaScript quando o conteúdo era mais disperso, muitas vezes em inglês, espalhado por fóruns, blogs, grupos e respostas soltas no Stack Overflow.
"""
body_en_us = """
I come from a humble upbringing in Brazil. My parents are farmers, I studied in public school and learned early that very little would arrive ready-made. I do not turn that into a dramatic story. It became a practical way of seeing things: observe, learn, insist and build with what is available.

Technology entered that path very early. I was 9 or 10 when I started trying to understand how pages and systems worked. I learned HTML, CSS and JavaScript when technical content was more scattered, often in English, spread across forums, blogs, groups and loose Stack Overflow answers.
"""
body_ja_jp = """
私はブラジルの素朴な環境で育ちました。両親は農家で、公立学校に通い、何かが最初から用意されているわけではないことを早くから知りました。それを大げさな物語にはしたくありません。ただ、観察し、学び、続け、あるもので作るという現実的な姿勢になりました。

技術はかなり早い時期にその道へ入ってきました。9歳か10歳の頃、ページやシステムがどう動くのかを知りたくなりました。技術情報が今より散らばっていて、多くが英語で、フォーラム、ブログ、グループ、Stack Overflow の断片的な回答にあった時代に、HTML、CSS、JavaScript を学びました。
"""

[[about.sections]]
title = "a decisão de entrar na área"
title_en_us = "the decision to enter tech"
title_ja_jp = "IT へ入る決断"
body = """
Quando morei em Curitiba, comecei um tecnólogo em ADS. Faltava um semestre para terminar, mas a vida naquele momento estava pesada: eu ainda não tinha emprego em TI, trabalhava por uma renda muito baixa e vivia em uma república que não fazia bem. Trabalho, faculdade e ambiente estavam se somando de um jeito ruim.

Deixar o curso não foi desistir da área. Foi uma escolha difícil para focar no que, naquele momento, podia mudar minha vida de forma mais direta: entrar no mercado de TI. Eu já estudava havia muitos anos, já programava, já sabia que queria trabalhar com software. Coloquei energia nisso e consegui minha primeira entrada.
"""
body_en_us = """
When I lived in Curitiba, I started a technology degree in Systems Analysis and Development. I was one semester away from finishing, but life was heavy then: I still did not have a tech job, worked for very low income and lived in a shared house that was not good for me. Work, college and the living environment were adding up in the wrong way.

Leaving the course was not giving up on tech. It was a hard choice to focus on what could change my life more directly at that moment: entering the tech market. I had already studied for years, already programmed and already knew I wanted to work with software. I put my energy there and got my first entry.
"""
body_ja_jp = """
クリチバに住んでいた頃、システム分析開発の短期大学に入りました。卒業まであと1学期でしたが、その時の生活は重いものでした。まだ IT の仕事はなく、低い収入で働き、良くない環境のシェアハウスに住んでいました。仕事、学校、生活環境が悪い形で重なっていました。

学校を離れたことは、IT を諦めたという意味ではありません。その時の自分の人生を一番直接変えられること、つまり IT 市場に入ることへ集中するための難しい選択でした。私はすでに何年も学び、プログラムを書き、ソフトウェアで働きたいと分かっていました。そこに力を向け、最初の入口を掴みました。
"""

[[about.sections]]
title = "software como profissão"
title_en_us = "software as a profession"
title_ja_jp = "職業としてのソフトウェア"
body = """
Depois vieram os anos profissionais no Brasil. Trabalhei com software em consultoria, produto e sistemas corporativos, passando por domínios como pagamentos, mobilidade, recuperação financeira, telecom, educação, ERP e software interno de empresas. Com o tempo, me consolidei principalmente em backend, .NET/C#, SQL Server, arquitetura e sistemas que precisam continuar compreensíveis.

O que ficou mais forte em mim não foi só uma stack. Foi a vontade de entender o caminho inteiro: o problema, a regra de negócio, a arquitetura, o código, a operação, a interface possível e o valor que chega para alguém. Eu gosto de criar solução, não apenas entregar tarefa.
"""
body_en_us = """
Then came the professional years in Brazil. I worked with software in consulting, product and enterprise systems, across domains such as payments, mobility, financial recovery, telecom, education, ERP and internal corporate software. Over time, I consolidated mainly around backend, .NET/C#, SQL Server, architecture and systems that need to remain understandable.

What became stronger in me was not only a stack. It was the will to understand the whole path: the problem, business rule, architecture, code, operation, possible interface and the value that reaches someone. I like creating solutions, not only delivering tasks.
"""
body_ja_jp = """
その後、ブラジルでプロとしての年月が始まりました。コンサルティング、プロダクト、業務システムでソフトウェアに携わり、決済、モビリティ、金融回収、通信、教育、ERP、企業内システムなどの領域を経験しました。時間とともに、主にバックエンド、.NET/C#、SQL Server、アーキテクチャ、理解し続けられるシステムに軸が固まりました。

自分の中で強くなったのは、単なるスタックではありません。問題、業務ルール、アーキテクチャ、コード、運用、可能なインターフェース、そして誰かに届く価値まで、全体を理解したいという気持ちです。私はタスクだけでなく、解決策を作ることが好きです。
"""

[[about.sections]]
title = "o capítulo do Japão"
title_en_us = "the Japan chapter"
title_ja_jp = "日本という章"
body = """
Há dois anos me mudei para o Japão. Hoje meu trabalho está fora do escritório: atuo em fábricas como Murata e NGK, na manufatura de componentes eletrônicos essenciais. É um capítulo diferente da minha trajetória, mais físico, mais operacional, mais silencioso. Mas ele não apagou minha identidade técnica.

O Japão me deu outra escala de disciplina, rotina e precisão. Ao mesmo tempo, sigo estudando, escrevendo, revisando arquitetura, criando projetos pessoais e acompanhando tecnologia. Software continua sendo o lugar onde minha cabeça volta quando penso em futuro.
"""
body_en_us = """
Two years ago I moved to Japan. Today my work is outside the office: I work in factories such as Murata and NGK, manufacturing essential electronic components. It is a different chapter of my path, more physical, more operational, quieter. But it did not erase my technical identity.

Japan gave me another scale of discipline, routine and precision. At the same time, I keep studying, writing, reviewing architecture, creating personal projects and following technology. Software remains the place my mind returns to when I think about the future.
"""
body_ja_jp = """
2年前、日本へ移りました。今の仕事はオフィスの外にあります。Murata や NGK のような工場で、重要な電子部品の製造に関わっています。自分の道の中では違う章です。より身体的で、より運用的で、静かな章です。でも、それが私の技術者としての identity を消したわけではありません。

日本は、規律、日々のリズム、精度について別の尺度をくれました。同時に、私は学び、書き、アーキテクチャを見直し、個人プロジェクトを作り、技術を追い続けています。未来を考える時、私の頭が戻る場所は今もソフトウェアです。
"""

[[about.sections]]
title = "o que eu quero construir"
title_en_us = "what I want to build"
title_ja_jp = "作りたいもの"
body = """
Minha direção é voltar ao mercado de TI, no Japão ou em qualquer lugar do mundo, para fazer o que eu realmente amo: criar soluções que mudam a vida das pessoas de algum jeito concreto. Pode ser reduzindo atrito, organizando uma operação, explicando uma decisão difícil, conectando dados a contexto ou transformando uma ideia em produto utilizável.

Tenho interesse especial por software, produto, arquitetura, agentes, GIS e sistemas legíveis. Mas, por baixo desses temas, a motivação é simples: construir coisas que façam sentido para alguém além de mim. Código é importante. O impacto de uma solução bem pensada é o que me faz continuar.

Este site também faz parte disso. Ele não precisa ser inteiramente profissional no sentido rígido da palavra. É um lugar confortável para publicar ideias, projetos, pensamentos, artigos e registros do que estou aprendendo ou tentando construir.
"""
body_en_us = """
My direction is to return to the tech market, in Japan or anywhere in the world, to do what I truly love: create solutions that change people's lives in some concrete way. That may mean reducing friction, organizing an operation, explaining a difficult decision, connecting data to context or turning an idea into a usable product.

I am especially interested in software, product, architecture, agents, GIS and readable systems. But beneath those themes, the motivation is simple: build things that make sense for someone beyond me. Code matters. The impact of a well-thought-out solution is what keeps me going.

This site is part of that too. It does not need to be entirely professional in the rigid sense of the word. It is a comfortable place to publish ideas, projects, thoughts, articles and notes about what I am learning or trying to build.
"""
body_ja_jp = """
私の方向は、日本でも世界のどこでも IT 市場へ戻り、本当に好きなことをすることです。人の生活を何か具体的な形で変える解決策を作ること。摩擦を減らすこと、運用を整理すること、難しい判断を説明すること、データを文脈につなげること、アイデアを使えるプロダクトに変えることかもしれません。

特に関心があるのは、ソフトウェア、プロダクト、アーキテクチャ、エージェント、GIS、読みやすいシステムです。でもその下にある動機はシンプルです。自分以外の誰かにとって意味のあるものを作りたい。コードは大切です。よく考えられた解決策の影響が、私を進ませています。

このサイトもその一部です。硬い意味で完全にプロフェッショナルな場所である必要はありません。アイデア、プロジェクト、考え、記事、そして学んでいることや作ろうとしていることを、自然に残すための居心地のよい場所です。
"""


[about]
lede = "Resumo curto sobre quem eu sou, como penso engenharia e onde concentro energia agora."

[[about.sections]]
title = "quem sou"
body = """
Engenheiro de software com interesse em sistemas onde arquitetura, operação e experiência de leitura importam ao mesmo tempo. Gosto de ambientes em que a complexidade precisa ser organizada com calma, sem teatralidade.
"""

[[about.sections]]
title = "carreira"
body = """
Atuo construindo software de produto, APIs, pipelines e interfaces técnicas. Minha trajetória mistura backend, frontend, integração e infraestrutura, normalmente em cenários onde a clareza da modelagem tem impacto direto no ritmo do time.
"""

[[about.sections]]
title = "perfil técnico"
body = """
Trabalho com Python, .NET, TypeScript e arquitetura orientada a domínio. Tenho interesse particular por sistemas estáticos bem modelados, workflows com agentes, visualização de dados e aplicações geoespaciais.
"""

[[about.sections]]
title = "visão de engenharia"
body = """
Prefiro decisões reversíveis, interfaces explícitas e código que explique a própria intenção. O objetivo não é reduzir tudo ao mínimo, e sim tornar o sistema legível o suficiente para evoluir sem atrito desnecessário.
"""

[[about.sections]]
title = "áreas de interesse"
body = """
DDD, agentes com uso de ferramentas, GIS, observabilidade de produto, renderização estática e design de interfaces técnicas que valorizam leitura longa.
"""

[[about.sections]]
title = "foco atual"
body = """
Refinar este site como um caderno técnico publicável, consolidar a linha de pesquisa em agentes e aprofundar projetos onde geoespacial, modelagem de domínio e visualização compartilham a mesma arquitetura.
"""

